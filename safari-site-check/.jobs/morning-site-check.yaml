id: morning-site-check
name: Morning Site Check
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: site-checker
agentSlug: site-checker
timeout: 900
prompt: |-
  Run this morning's site check.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-site-check.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the pages to check, the
     frontmatter shape, the table columns and the Pass/Fail/Slow vocabulary. This
     prompt does not repeat them.
  2. With your Safari browsing tools, open each page listed under "What you watch"
     and check it against what "working" means for that page.
  3. You browse and you look. Never submit a real form with real data, never make a
     purchase, never sign in with credentials you were not explicitly given, and
     never follow a link that leaves the site being checked.
  4. Take a screenshot on every `Fail` and every `Slow`, never on a `Pass`. Save to
     `shots/<page-slug>-<YYYY-MM-DD>T<HH-MM-SS>.png`.
  5. If you have no Safari browsing tools, or they are not connected, or a check
     fails to even run, STOP HERE. Write nothing. Leave `summaries/` and `shots/`
     exactly as you found them, examples and all. Report: "Safari is not reachable.
     I would have checked: <the pages listed under "What you watch">." Then exit.
  6. On the first run that does reach Safari, write your dated file and then
     delete `summaries/EXAMPLE-site-check.md` and every `shots/EXAMPLE-*.png`. They
     are demos, not past runs, and must not sit beside real ones. Never write
     `EXAMPLE` into a name of your own.
