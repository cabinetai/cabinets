id: morning-slack-catch-up
name: Morning catch-up
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: slack-reader
agentSlug: slack-reader
timeout: 900
prompt: |-
  Catch up on Slack for the Catch up app.

  Your working directory is the cabinet root. Your persona holds the rules. The helper
  `node catch-up/slack-sort.mjs` (from the cabinet root, never `cd`) reads Slack itself and
  writes every file the page reads; you write only your own short words.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `catch-up/setup.md`, and run `ls catch-up/data/profile.json`.
  2. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  3. If `start` says Slack could not be read, add what it tells you to your cabinet block and
     stop. If anything else fails after `start`, still run `done`.

  Only read Slack in this run: never propose SEND_SLACK, never post, reply, react or mark
  anything read.

  Finish in one or two plain sentences and nothing else: how many people wait for an
  answer, how many promises are open, and the one thing that matters most this morning.
createdAt: '2026-11-12T00:00:00.000Z'
updatedAt: '2026-11-15T00:00:00.000Z'
