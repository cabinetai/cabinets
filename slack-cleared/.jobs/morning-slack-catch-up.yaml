id: morning-slack-catch-up
name: Morning catch-up
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: slack-reader
agentSlug: slack-reader
timeout: 900
prompt: |-
  Catch up on Slack for the Catch up app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Slack, what needs the person, the helper's commands, and how to spend little. You read Slack
  only with the Slack tools; after each round of calls, `node catch-up/slack-sort.mjs take`
  (from the cabinet root, never `cd`) keeps their answers exactly as Slack gave them, and the
  helper writes every file the page reads. Never copy an answer by hand.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `catch-up/setup.md`, and run `ls catch-up/data/profile.json`.
  2. If your Slack line says Slack is not connected, run
     `node catch-up/slack-sort.mjs fail 'Slack is not connected. Press Connect Slack.'`, add
     `NEEDS_CONNECTION: slack | <why, in plain words>` to your cabinet block, and stop.
  3. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  4. If a Slack tool says Slack needs a new sign-in or refuses every search, run `fail` with a
     plain why (your persona has the words) and stop. If anything else fails after `start`,
     still run `done`.

  The searches and one `slack_list_files` call are all you need: never read whole channels
  (Slack allows that about once a minute) and never fetch a file.

  Only read Slack in this run: never propose SEND_SLACK, never post, reply, react or mark
  anything read.

  Finish in one or two plain sentences and nothing else: how many people wait for an
  answer, how many promises are open, and the one thing that matters most this morning.
createdAt: '2026-11-12T00:00:00.000Z'
updatedAt: '2026-11-12T00:00:00.000Z'
