id: monday-asset-catalogue
name: Monday Asset Catalogue
enabled: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: catalogue-keeper
agentSlug: catalogue-keeper
timeout: 900
prompt: |-
  Write this week's asset catalogue.

  Your working directory is the cabinet root. Every page lives in `catalogue/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-asset-catalogue.md`, the local time you
  ran and then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a page nobody will see. You only
  ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the five
     columns, the `Use` vocabulary, the row order and the tone. This prompt does not
     repeat them.
  2. Find the copied drop folder in this cabinet. It is the folder that is none of
     `.agents`, `.jobs`, `.cabinet-state`, `catalogue` or `asset-catalogue`, and it is
     named after the bucket. `asset-catalogue` is this cabinet's own app folder, not
     anything the agency sent. Walk it with your file tools.
  3. Read the previous page in `catalogue/`, if there is one, to know what "new" means
     this week. Where there is none, treat everything in the drop as new and say so in
     the headline.
  4. Find the notes before you fill the `Use` column. Delivery notes, licences, usage
     summaries, model and property releases, the agency's handover PDF. A file
     existing is not permission, and an asset with no note you actually read is
     `No note`. This is the column people will act on, so be strict with it.
  5. This run is read only, and the folder is mounted so that it has to be. Do not
     create, edit, rename, move, copy or delete anything inside it, and do not try to
     write anything back to S3. You write into `catalogue/` and nowhere else.
  6. If the drop folder is there but unreadable, or holds nothing that looks like
     delivered work, say which, touch no file, and exit. A catalogue you could not read
     the folder for is worse than no catalogue: never fall back to the example's
     contents, to last week's file, or to the assets a campaign like this one usually
     has.
  7. A week where nothing new arrived is a real result. Write the file, say so in the
     headline, and keep every row that is still `No note` or `Check first`. Never drop
     one because it is not new.
  8. On the first run that does reach a real drop folder, write your dated file and
     then delete `catalogue/EXAMPLE-asset-catalogue.md`. It is a demo, not a past week,
     and it must not sit in the date list beside real ones. Do not merge with it, do
     not rename it, and never write `EXAMPLE` into a name of your own.
