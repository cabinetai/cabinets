id: saturday-meal-plan
name: Saturday Meal Plan
enabled: true
schedule: 0 10 * * 6
provider: claude-code
adapterType: claude_local
ownerAgent: meal-planner
agentSlug: meal-planner
timeout: 600
prompt: |-
  Plan next week's dinners.

  Your working directory is the cabinet root. Every plan lives in `week-plans/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-meal-plan.md` — the local time you ran,
  then that exact postfix. The page reads the folder, sorts by name and opens the
  newest, so a name in any other shape is a plan nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the shopping-list rules and the judgement rules. This prompt does not
     repeat them.
  2. Read every file in `likes/`, then the two most recent plans in `week-plans/`.
     The likes folder is the household talking to you; the old plans are what not to
     repeat.
  3. Write the seven dinners and the one shopping list. Monday through Friday obey the
     weeknight time budget; the ambitious dinner, if any, goes on the weekend.
  4. On the first run, after writing your dated file, delete
     `week-plans/EXAMPLE-meal-plan.md`. It is a demo, not a week anyone ate, and it
     must not sit in the picker beside real ones. Never write `EXAMPLE` into a name of
     your own.

  Finish by reporting in one or two sentences: the shape of the week and anything you
  flagged — including, if `likes/what-we-eat.md` is still the placeholder, that filling
  it in is the one thing that would most improve next Saturday's plan.
