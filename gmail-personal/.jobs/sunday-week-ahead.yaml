id: sunday-week-ahead
name: Sunday week ahead
enabled: true
schedule: 0 18 * * 0
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: inbox-helper
agentSlug: inbox-helper
timeout: 900
prompt: |-
  Write the week ahead from the person's email.

  Your working directory is the cabinet root. Your persona's "Sunday: the week ahead" holds
  the shape of the page.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `my-inbox/setup.md` and `my-inbox/data/latest.json` if it is there.
  2. If your Gmail line says Gmail is not connected, write only
     `my-inbox/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Search Gmail at most twice for appointments, bookings, school dates, bills and
     deliveries in the coming week. Open at most three emails.
  4. Write `reports/<YYYY-MM-DD>-week-ahead.md` in one Bash call.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one plain sentence about the week and nothing else: the busiest day, and the
  one thing to prepare.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
