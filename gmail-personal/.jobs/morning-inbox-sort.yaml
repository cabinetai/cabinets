id: morning-inbox-sort
name: Morning inbox sort
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: inbox-helper
agentSlug: inbox-helper
timeout: 900
prompt: |-
  Sort this morning's email for the My inbox app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Gmail, the lists, the shape of each file, and how to spend little. Follow its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `my-inbox/setup.md` and, if it is there, `my-inbox/data/latest.json` (the last sort).
  2. If your Gmail line says Gmail is not connected, write only
     `my-inbox/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Read Gmail: since the last sort when it is under 3 days old, otherwise the wider
     windows once. At most four searches and three opened emails. When nothing new
     arrived, keep the last sort's lists as they are.
     If `my-inbox/data/profile.json` is not there (check it with `ls` in step 1, from the
     cabinet root, never `cd`), this is the first sort, with up to three more searches and
     nothing written under `/tmp`: follow "The
     first sort" in your persona. Save search results in `my-inbox/data/.work/`, never
     `/tmp`. Run `node my-inbox/first-sort.mjs start` first, and use it (push, profile, done) for every line and the profile; push one line after each search
     with its number computed from the saved result (never typed by hand, never rewritten
     later), count the inbox and its ads and social exactly with `--page-all` (never
     `resultSizeEstimate`), and at the end write `my-inbox/data/profile.json`, fill the
     unanswered lines of `my-inbox/setup.md` and after
     `latest.json` run `node my-inbox/first-sort.mjs done`.
  4. On the first sort, write `my-inbox/data/latest.json` through `node my-inbox/first-sort.mjs latest
     @latest.json` (it also writes status.json), then the report. Otherwise, in one Bash call, write
     `my-inbox/data/latest.json` (and check it parses),
     `reports/<YYYY-MM-DD>-morning.md` and `my-inbox/data/status.json` with `ok: true`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one or two plain sentences about the email and nothing else: how many people
  are waiting for an answer, what is due or coming up soon, and the one that matters most,
  if there is one.
