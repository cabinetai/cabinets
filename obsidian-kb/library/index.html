<!DOCTYPE html>
<!--
  CHASSIS 2 — chat page. Chassis 1 plus a prompt box that dispatches a one-shot
  agent run and re-lists the folder when it returns. Replace every token below:

    Obsidian Knowledge Base        browser title and <h1>
    Turns the vault you already wrote into a knowledge base you can ask questions of.     the one sentence — must match .cabinet description and index.md
    /logos/obsidian.svg         catalog entry `logo`, e.g. /logos/acme.svg
    #7C3AED       catalog entry `brand`
    pages          archive folder, e.g. summaries
    .jobs/build-the-library.yaml          job path
    Ask your notes something…  prompt box placeholder, e.g. "Ask the web a question…"

  POST /api/agents/headless is capped at 120s server-side; this page aborts at
  118s and loses the race deliberately. providerId is omitted so the user's own
  provider calls the MCP tool this cabinet exists to show off.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obsidian Knowledge Base</title>
<style>
  :root {
    --bg: #fbfbfa; --card: #fff; --ink: #1a1a18; --dim: #6b6b66;
    --line: #e6e5e1; --accent: #7C3AED;
    --hi: #b4443c; --mid: #9a6b1f; --lo: #6b6b66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 {
    font-size: 22px; margin: 0; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 10px;
  }
  /* The mark is an <img> from the catalog; SVG sources have no intrinsic pixel size,
     so size it here or it renders enormous. flex:none stops the flex row shrinking it. */
  .mark { width: 22px; height: 22px; flex: none; }
  .sub { color: var(--dim); margin: 4px 0 0; font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-top: 18px;
  }
  .empty { color: var(--dim); font-size: 14px; }
  .empty code { font-size: 13px; }
  .picker { margin-top: 18px; font-size: 14px; color: var(--dim); }
  .picker .next { display: block; margin-top: 7px; }
  .seeded {
    margin: 0 0 14px; padding: 9px 11px; border-radius: 8px;
    background: #fdf6e3; border: 1px solid #efe3c2; color: #6b5a2f; font-size: 13.5px;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 18px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .page-card {
    display: block; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    padding: 14px 16px; text-decoration: none; color: inherit;
  }
  .page-card:hover { border-color: var(--accent); }
  .page-title { font-weight: 600; font-size: 15px; }
  .page-meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .panel {
    margin: 0 0 22px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px;
  }
  .panel textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 10px 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--ink); font: inherit;
  }
  .panel textarea:focus { outline: none; border-color: var(--accent); }
  .panel .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .panel button {
    font: inherit; font-size: 14px; padding: 8px 15px; border-radius: 7px;
    border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer;
  }
  .panel button:disabled { opacity: 0.45; cursor: default; }
  .panel .status { font-size: 13px; color: var(--dim); }
  .panel .status.err { color: var(--hi); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>
      <!-- The mark comes from the integration's catalog entry (`logo`), served
           same-origin from the app. Not inlined: inlining duplicates an asset
           that already exists, drifts when the real one is updated, and cannot
           represent the raster marks (brightdata.webp, openai-image.png). -->
      <img class="mark" src="/logos/obsidian.svg" alt="" />
      Obsidian Knowledge Base
    </h1>
    <!-- The one sentence. Identical to .cabinet description and index.md's first line. -->
    <p class="sub">Turns the vault you already wrote into a knowledge base you can ask questions of.</p>
  </header>

  <section class="panel">
    <textarea id="prompt" placeholder="Ask your notes something…"></textarea>
    <div class="row">
      <button id="send">Send</button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <div id="root"><div class="card empty">Loading…</div></div>

</div>

<script>
(function () {
  var root = document.getElementById('root');
  var DIR = 'pages';
  var JOB = '.jobs/build-the-library.yaml';
  var job = null;
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
                'September', 'October', 'November', 'December'];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* One-shot agent run. The server caps at 120s; we abort at 118s so the
     failure message is ours rather than a dead socket. `providerId` is
     deliberately omitted — whichever provider the user has should be the one
     that calls the MCP tool, since that tool is what this cabinet showcases. */
  var TIMEOUT = 118000;

  function runAgent(prompt) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, TIMEOUT);
    return fetch('/api/agents/headless', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, workdir: cabinetDir() }),
      signal: ctl.signal
    })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (res) {
        clearTimeout(timer);
        if (!res) return { ok: false, error: 'no response from the agent' };
        if (res.error) return { ok: false, error: res.error };
        return { ok: true };
      })
      .catch(function (e) {
        clearTimeout(timer);
        return {
          ok: false,
          error: e && e.name === 'AbortError' ? 'timed out after 118s' : String(e && e.message || e)
        };
      });
  }

  var sendBtn = document.getElementById('send');
  var promptBox = document.getElementById('prompt');
  var statusEl = document.getElementById('status');

  sendBtn.addEventListener('click', function () {
    var text = promptBox.value.trim();
    if (!text) { promptBox.focus(); return; }
    sendBtn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = 'Working — this can take up to two minutes.';
    runAgent(text).then(function (res) {
      sendBtn.disabled = false;
      if (!res.ok) {
        statusEl.className = 'status err';
        statusEl.textContent = res.error;
        return;
      }
      statusEl.textContent = 'Done.';
      promptBox.value = '';
      load();
    });
  });

  /* Frontmatter only — a page has no table, just title/sources/updated up top. Anything
     richer belongs in the page body, which this listing page never renders. */
  function parseMeta(text) {
    var meta = {};
    var m = text.match(/^---\n([\s\S]*?)\n---\n?/);
    if (m) {
      m[1].split('\n').forEach(function (line) {
        var kv = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
        if (kv) meta[kv[1]] = kv[2].replace(/^['"]|['"]$/g, '').trim();
      });
    }
    return meta;
  }

  /* RENDER SWAP: shape F replaces the table renderer with a card grid over pages/.
     Every page in the folder is its own card, not a single file's rows — so there is no
     "current day" concept here, and no per-file table to lay out. */
  function renderCards(pages) {
    if (!pages.length) {
      return '<div class="card empty">Nothing yet. Import your Obsidian vault, or wait for ' +
             'Monday’s run.</div>';
    }
    var seeded = pages.some(function (p) { return p.name.indexOf('EXAMPLE-') === 0; });
    var banner = seeded
      ? '<p class="seeded">These pages are made up examples. Import your Obsidian vault and ' +
        'the library rebuilds itself from your real notes.</p>'
      : '';
    /* Seeded examples always sink to the bottom; among the rest, most recently updated
       first, then title, so the grid has a stable, predictable order run to run. */
    var sorted = pages.slice().sort(function (a, b) {
      var aSeed = a.name.indexOf('EXAMPLE-') === 0, bSeed = b.name.indexOf('EXAMPLE-') === 0;
      if (aSeed !== bSeed) return aSeed ? 1 : -1;
      var au = a.meta.updated || '', bu = b.meta.updated || '';
      if (au !== bu) return au < bu ? 1 : -1;
      var at = a.meta.title || '', bt = b.meta.title || '';
      return at < bt ? -1 : at > bt ? 1 : 0;
    });
    return banner + '<div class="grid">' + sorted.map(function (p) {
      var url = '../' + DIR + '/' + encodeURIComponent(p.name);
      var title = p.meta.title || p.name;
      var sources = p.meta.sources || '?';
      var line = 'fed by ' + sources + ' notes' +
        (p.meta.updated ? ' · updated ' + p.meta.updated : '');
      return '<a class="page-card" href="' + esc(url) + '">' +
             '<div class="page-title">' + esc(title) + '</div>' +
             '<div class="page-meta">' + esc(line) + '</div></a>';
    }).join('') + '</div>';
  }

  /* ---- when the routine next runs ---------------------------------------------------
     Read straight off this cabinet's own job file, so a user who edits the schedule or
     pauses the routine sees the truth here. Cron is evaluated in the browser's timezone,
     which is the same host the routine runs on. */

  /* One cron field -> the set of values it matches. Handles *, n, a-b, lists and /step. */
  function field(spec, min, max) {
    var set = {};
    spec.split(',').forEach(function (part) {
      var bits = part.split('/'), step = bits[1] ? +bits[1] : 1, lo = min, hi = max;
      if (bits[0] !== '*') {
        var r = bits[0].split('-');
        lo = +r[0];
        hi = r[1] !== undefined ? +r[1] : (bits[1] ? max : +r[0]);
      }
      for (var v = lo; v <= hi; v += step) set[v] = true;
    });
    return set;
  }

  function nextRun(cron, from) {
    var f = cron.trim().split(/\s+/);
    if (f.length !== 5) return null;
    var mins = field(f[0], 0, 59), hrs = field(f[1], 0, 23), doms = field(f[2], 1, 31),
        mons = field(f[3], 1, 12), dows = field(f[4], 0, 7);
    if (dows[7]) dows[0] = true;  /* cron allows 7 for Sunday */
    var d = new Date(from.getTime() + 60000);
    d.setSeconds(0, 0);
    /* Walks forward a minute at a time; a scheduled routine lands within days, and the cap
       stops a schedule that can never match (30 February) from spinning. */
    for (var i = 0; i < 366 * 1440; i++) {
      if (mons[d.getMonth() + 1] && doms[d.getDate()] && dows[d.getDay()] &&
          hrs[d.getHours()] && mins[d.getMinutes()]) return d;
      d = new Date(d.getTime() + 60000);
    }
    return null;
  }

  function human(d) {
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' +
           d.getFullYear();
  }

  function nextRunText() {
    if (!job) return '';
    if (job.enabled === 'false') return 'Routine paused';
    if (!job.schedule) return '';
    var d = nextRun(job.schedule, new Date());
    if (!d) return '';
    var clock = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return 'Next run: ' + human(d) + ' at ' + clock;
  }

  /* /api/assets/<cabinet path>/<app folder>/index.html — dropping the last two segments
     tells the page which cabinet it is installed in, whatever the user named it. */
  function cabinetDir() {
    var p = location.pathname.replace(/^\/+/, '').replace(/^api\/assets\//, '');
    return p.split('/').slice(0, -2).map(decodeURIComponent).join('/');
  }

  /* Direct .md children of pages/ only — never a nested one, and never the index the
     app itself renders from. The tree strips `.md` from `path` but keeps it on `name`,
     so the two are matched separately: `path` decides what lives in the folder, `name`
     is what we fetch. */
  function listFiles(nodes, dir, out) {
    (nodes || []).forEach(function (n) {
      if (!n || !n.path) return;
      if (n.path.indexOf(dir + '/') === 0 &&
          n.path.indexOf('/', dir.length + 1) === -1 &&
          /\.md$/i.test(n.name || '') && n.name.toLowerCase() !== 'index.md') out.push(n.name);
      if (n.children) listFiles(n.children, dir, out);
    });
    return out;
  }

  /* An empty folder is the normal state before the first run — not an error to shout about.
     `fresh=1` busts the tree cache so a page written moments ago is already listed.
     Named (not a bare IIFE tail) so a successful agent run can re-list the folder. */
  function load() {
    Promise.all([
      fetch('/api/tree?fresh=1', { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }),
      /* The schedule is a nicety — never let a missing or renamed job file break the page. */
      fetch('../' + JOB, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .catch(function () { return ''; })
    ])
      .then(function (both) {
        var tree = both[0];
        job = {};
        both[1].split('\n').forEach(function (line) {
          var kv = line.match(/^(enabled|schedule):\s*(.*)$/);
          if (kv) job[kv[1]] = kv[2].replace(/^['"]|['"]$/g, '').trim();
        });
        var names = listFiles(tree, cabinetDir() + '/' + DIR, []);
        var next = nextRunText();
        var nextHtml = next ? '<div class="picker"><span class="next">' + esc(next) +
          '</span></div>' : '';
        if (!names.length) {
          root.innerHTML = nextHtml + renderCards([]);
          return;
        }
        /* Every page's frontmatter is a few bytes; fetching all of them in parallel keeps
           the card grid a single extra round trip past the tree listing. */
        return Promise.all(names.map(function (name) {
          return fetch('../' + DIR + '/' + encodeURIComponent(name), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (text) { return { name: name, meta: parseMeta(text) }; })
            .catch(function () { return { name: name, meta: {} }; });
        })).then(function (pages) {
          root.innerHTML = nextHtml + renderCards(pages);
        });
      })
      .catch(function (err) {
        root.innerHTML = '<div class="card empty">Could not list <code>' + DIR + '/</code> (' +
          esc(err.message) + '). Reload in a moment.</div>';
      });
  }

  load();
})();
</script>
</body>
</html>
