id: build-the-library
name: Build The Library
enabled: true
schedule: 0 10 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: librarian
agentSlug: librarian
timeout: 1800
prompt: |-
  Build or rebuild the library from the imported notes.

  Your working directory is the cabinet root. Output goes to `pages/`, one file
  per topic named `<topic-slug>.md`, plus `pages/index.md`. Unlike the other
  showcases, this cabinet REWRITES its own pages rather than adding timestamped
  files: a page may be updated in place on a later run, but the imported notes
  themselves are never touched.

  1. Read your persona before anything else. It holds the page shape, the
     five-to-twenty rule, and what you may and may not do. This prompt does not
     repeat them.
  2. Read every imported note in the cabinet, skipping `.agents`, `.jobs`,
     `.cabinet-state`, `pages` and the app folder (`library`). Those are the
     cabinet's own machinery, not notes.
  3. Group the notes into topics per your persona — a project, a person, a
     recurring question, a decision made over several notes. Not a folder name
     and not a date.
  4. Write the pages and `pages/index.md`.
  5. If no notes have been imported yet, STOP HERE. Write nothing. Leave `pages/`
     exactly as you found it, examples and all. Report: "Obsidian has not been
     imported yet." Then exit.
  6. On the first run that finds real notes, delete every `pages/EXAMPLE-*.md` and
     rebuild `pages/index.md` without them. They are demos, not past pages, and
     they must not sit in the library beside real ones. Never write `EXAMPLE`
     into a name of your own.
