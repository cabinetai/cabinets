id: morning-pipeline-check
name: Morning Pipeline Check
enabled: true
schedule: 0 9 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: application-clerk
agentSlug: application-clerk
timeout: 600
prompt: |-
  Do the morning walk of the applications folder.

  Your working directory is the cabinet root. Applications live in `applications/`,
  one file each. The Pipeline page redraws from that folder, so the folder is the
  truth and you keep it true.

  1. Read your persona before anything else. It holds the two-zone rule (frontmatter
     and Log are yours; the person's notes are not), the five state words, and the
     three things worth acting on. This prompt does not repeat them.
  2. Walk every application file except the README. Flag what's gone quiet, prep
     what's coming up, fix contradictions — one dated Log line each, newest first.
     Update `state`, `last` and `next` only when the file's own contents justify it.
  3. Skip `EXAMPLE-riverline-product-manager.md` if it's still there — it's a demo,
     not an application. Never delete it yourself; the README tells the user to.
  4. Touch nothing in `cv/` — drafts happen only when the user asks.
  5. If `applications/` holds nothing but the README and the example, report: "The
     folder is waiting for its first application — tell me about one and I'll file
     it." and exit.

  Finish by reporting in two or three sentences: how many applications are live,
  which ones you flagged, and the single next action most worth doing today.
