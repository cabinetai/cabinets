id: monday-studio-review
name: Monday Studio Review
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: web-developer
agentSlug: web-developer
timeout: 600
prompt: |-
  Do the Monday walk of the studio.

  Your working directory is the cabinet root. Sites live in `sites/`, one folder
  each. Reviews live in `reviews/`, one file per run, named
  `<YYYY-MM-DD>T<HH-MM-SS>-studio-review.md` — the local time you ran, then that
  exact postfix. The Studio page reads the folder, sorts by name and opens the
  newest, so a name in any other shape is a review nobody will see. You only ever
  ADD a review: never overwrite, rename or delete one already sitting there.

  1. Read your persona before anything else. It holds the single-file discipline
     each site is measured against. This prompt does not repeat it.
  2. Walk every folder in `sites/` (skip none). For each, check: `index.html`
     exists and parses; the file is self-contained — no external scripts, styles,
     fonts or images fetched from the network; the `.app` marker is present; the
     page has a title. Fix nothing — broken gets named, fixing happens when asked.
  3. Write the review:

     ---
     headline: <one line, e.g. "4 sites, all healthy" or "3 healthy, 1 needs a look">
     generated: <YYYY-MM-DD HH:MM>
     status: ok
     ---

     | Site | Verdict | Note |
     |---|---|---|

     One row per site folder. `Site` is the folder name. `Verdict` is exactly
     `Healthy` or `Needs a look`. `Note` is one plain sentence — empty when healthy,
     specific when not ("loads a font from the network", "index.html is missing").
  4. Skip nothing but say plainly in the headline if `sites/` is empty apart from
     the example: "Just the example so far — describe a site and I'll build it."
  5. Leave `sites/EXAMPLE-lemonade-stand/` in place — it is the demo the Studio
     page banner explains. Review it like any other site.

  Finish by reporting the headline in one sentence.
