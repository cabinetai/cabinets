id: weekly-brightdata-search
name: Weekly Bright Data Search
enabled: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: web-reader
agentSlug: web-reader
timeout: 600
prompt: |-
  Answer this week's standing question.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-web-search.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the standing question under
     "What you watch", the frontmatter shape, the table columns and the tone. This
     prompt does not repeat them.
  2. Answer the standing question using your Bright Data tools. Open the pages you
     cite — a search result snippet is not a source you read.
  3. If you have no Bright Data tool, or it is not connected, or the call fails,
     STOP HERE. Write nothing. Leave `summaries/` exactly as you found it, example
     and all. Report: "Bright Data is not reachable. I would have searched the live
     web for: <the standing question>." Then exit.
  4. On the first run that does reach Bright Data, write your dated file and then
     delete `summaries/EXAMPLE-web-search.md`. Never write `EXAMPLE` into a name of
     your own.
