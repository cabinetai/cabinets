id: daily-deal-watch
name: Daily Deal Watch
enabled: true
schedule: 30 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: deal-watcher
agentSlug: deal-watcher
timeout: 900
prompt: |-
  Check my Salesforce deals and update the Deal board. Follow the Morning catch-up steps in
  your instructions. This run only reads Salesforce: it never adds, changes or deletes
  anything there. When you are done, tell me in one or two sentences how many deals need a
  person and the most urgent one.
