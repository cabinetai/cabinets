<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Briefing</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f5f5f7; --bg-elevated:#ffffff;
    --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
    --track:rgba(0,0,0,.055); --accent:#0071e3;
    --shadow-md:0 4px 18px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --bg-elevated:#1c1c1e;
      --text:#f5f5f7; --text-2:#98989d; --text-3:#8e8e93;
      --track:rgba(255,255,255,.08); --accent:#0a84ff;
      --shadow-md:0 4px 18px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{max-width:420px;margin:24px;background:var(--bg-elevated);border-radius:20px;
    box-shadow:var(--shadow-md);padding:38px 34px;text-align:center}
  .icon{width:52px;height:52px;border-radius:14px;background:var(--track);color:var(--text-3);
    display:grid;place-items:center;margin:0 auto 18px}
  h1{font-size:19px;font-weight:650;letter-spacing:-.015em;margin:0 0 10px}
  p{color:var(--text-2);margin:0;font-size:14px;line-height:1.55}
  code{background:var(--track);padding:2px 7px;border-radius:6px;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>
    </div>
    <h1>No briefing yet</h1>
    <p>This fills in automatically once Competitor Scout has competitors to track and a
    week of evidence behind it. Until then, open <code>../dashboard</code> to see what's
    been captured so far, or message Competitor Scout to add a competitor.</p>
  </div>
</body>
</html>
