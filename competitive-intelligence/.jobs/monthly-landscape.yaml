id: monthly-landscape
name: Monthly Landscape Review
enabled: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
ownerAgent: competitor-scout
agentSlug: competitor-scout
timeout: 1800
prompt: |-
  Read `competitors/.roster.json`. If it is still empty, say one line noting the cabinet
  isn't onboarded yet and stop.

  This is the leadership-grade review: forwardable to an exec team or a board with no
  rework. Unlike the weekly report, you are compiling already-synthesized material, not
  reading raw digests, so this should be cheap: read the last four to five
  `briefing/*/insights.json` files (the weekly synthesis already did the "what happened
  and so what" work) plus the full `.signals/log.md` for anything the weeklies missed.

  Write `briefing/<date>-monthly/insights.json` reusing the weekly shape, with monthly
  framing:
    - `headline` — the month's single throughline, not a list of everything that happened.
    - `materialMoves[]` — the month's biggest moves across all competitors, each still
      carrying `sourceUrl`/`screenshot` and an implication, but written at strategy grain
      ("moving upmarket" not "posted 3 job listings").
    - `pricingWatch[]` — the current pricing landscape across every Tier 1 competitor, not
      just what changed this month.
    - `battlecardChanges[]` — repurposed here as re-tiering recommendations: which
      competitor should move Tier 1/2/3 and why. Leave empty if nothing needs re-tiering.
    - `watchlist[]` — strategic recommendations for product, pricing, and GTM, each tied
      to evidence from the month. This is the section a board actually reads.
    - `unreachable[]` — competitors or pages that stayed dark all month; a real gap in
      coverage is itself a finding worth naming.

  Run `node .scripts/render-report.mjs briefing/<date>-monthly/insights.json` to produce
  the HTML + PDF, then `node .scripts/render-dashboard.mjs`. Do not propose sending this
  one by email automatically — a monthly board document goes out deliberately, not on a
  cron. Say where it landed and let the user forward it.
cabinetPath: my-business/cabinets/competitive-intelligence
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
