id: daily-sweep
name: Daily Sweep
enabled: true
schedule: 0 7 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: competitor-scout
agentSlug: competitor-scout
timeout: 600
prompt: |-
  First, read `competitors/.roster.json`.

  IF IT IS EMPTY: this cabinet hasn't been onboarded yet. Do not sweep anything. Post a
  short message in the `general` channel asking for the user's company name + URL, a
  handful of competitors to track, and (optional) who should get the weekly PDF report by
  email. Then stop — nothing else in this job applies until the roster has entries. See
  the "This cabinet ships empty" section of your persona for the exact shapes to write
  once they reply.

  IF IT HAS ENTRIES: run, in order —
    1. `node .scripts/sweep.mjs` — fetches every due competitor's tracked pages, diffs
       against the last capture, screenshots with local Chrome if available, and writes
       today's `.evidence/<date>-digest.json` plus lines in `.signals/log.md`. This is a
       plain script; it does not need you to read or verify its output line by line.
    2. `node .scripts/render-dashboard.mjs` — refreshes `dashboard/data.js` so the
       dashboard reflects today's sweep.

  Then write a two-to-three sentence summary: how many competitors were swept, how many
  pages changed, and whether Chrome was available for screenshots. Do NOT re-fetch any
  competitor page yourself with WebFetch — the digest already has what changed. Do NOT
  decide materiality here; that is the weekly job's work, not this one's.
cabinetPath: my-business/cabinets/competitive-intelligence
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
