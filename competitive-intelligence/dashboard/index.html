<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitive Intelligence</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f5f5f7; --bg-elevated:#ffffff; --bg-sunken:#ffffff;
    --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
    --separator:rgba(0,0,0,.08); --separator-strong:rgba(0,0,0,.12);
    --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
    --track:rgba(0,0,0,.055);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 18px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --bg-elevated:#1c1c1e; --bg-sunken:#000000;
      --text:#f5f5f7; --text-2:#98989d; --text-3:#8e8e93;
      --separator:rgba(255,255,255,.1); --separator-strong:rgba(255,255,255,.16);
      --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16);
      --track:rgba(255,255,255,.08);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 4px 18px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.47; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 28px 90px}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:14px}
  .glyph{width:44px;height:44px;border-radius:12px;flex:none;background:var(--accent-soft);
    display:grid;place-items:center;color:var(--accent)}
  .brand h1{font-size:26px;font-weight:700;letter-spacing:-.021em;margin:0}
  .brand .sub{color:var(--text-2);font-size:13px;margin-top:3px;font-weight:400}
  .meta{text-align:right;color:var(--text-3);font-size:12px;line-height:1.6;padding-top:6px}
  .meta b{color:var(--text-2);font-weight:590}

  /* Segmented control */
  .segmented{display:inline-flex;gap:2px;background:var(--track);border-radius:10px;
    padding:2px;margin-bottom:26px}
  .seg{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;font-weight:590;
    padding:7px 16px;border-radius:8px;cursor:pointer;transition:background .18s ease,color .18s ease}
  .seg[aria-selected="true"]{background:var(--bg-elevated);color:var(--text);box-shadow:var(--shadow-sm)}

  .panel{display:none}
  .panel.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--bg-elevated);border-radius:var(--radius-lg);overflow:hidden;
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
    transition:box-shadow .2s ease,transform .2s ease}
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .card .shot{width:100%;height:124px;object-fit:cover;object-position:top;background:var(--track)}
  .card .shot.placeholder{display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px}
  .card .body{padding:14px 16px 16px}
  .card .nm{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .card .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:-.005em;
    padding:3px 9px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
  .badge.neutral{color:var(--text-2);background:var(--track)}
  .card .checked{color:var(--text-3);font-size:12px;margin-top:6px}

  .feeditem{display:flex;gap:13px;align-items:flex-start;background:var(--bg-elevated);
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--track);flex:none;margin-top:6px}
  .dot.material{background:var(--accent)}
  .feeditem .body{flex:1;min-width:0}
  .feeditem .row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
  .feeditem .who{font-weight:600;font-size:14px}
  .feeditem .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3)}
  .feeditem .when{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
  .feeditem .desc{color:var(--text-2);font-size:13.5px}
  .feeditem a.src{font-size:12.5px;color:var(--accent);text-decoration:none;margin-top:2px;display:inline-block}

  .briefingrow{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);
    border-radius:var(--radius-md);padding:14px 18px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .briefingrow .date{font-weight:600;font-size:14px}
  .briefingrow .links a{margin-left:18px;font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:590}

  .empty{text-align:center;padding:64px 24px;background:var(--bg-elevated);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm)}
  .empty svg{color:var(--text-3);margin-bottom:14px}
  .empty .big{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text);margin-bottom:8px}
  .empty p{color:var(--text-2);font-size:14px;max-width:420px;margin:0 auto;line-height:1.5}
  .empty code{background:var(--track);padding:2px 7px;border-radius:6px;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  @media(max-width:640px){.segmented{width:100%}.seg{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="glyph">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/>
        </svg>
      </div>
      <div>
        <h1>Competitive Intelligence</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="segmented" role="tablist">
    <button class="seg" data-tab="overview" aria-selected="true">Overview</button>
    <button class="seg" data-tab="feed" aria-selected="false">What Changed</button>
    <button class="seg" data-tab="briefings" aria-selected="false">Briefings</button>
  </div>

  <section class="panel active" id="panel-overview"></section>
  <section class="panel" id="panel-feed"></section>
  <section class="panel" id="panel-briefings"></section>
</div>

<script src="data.js"></script>
<script>
const data = window.__CI_DATA__ || { competitors: [], feed: [], briefings: [], trackedCount: 0 };

document.getElementById("sub").textContent = data.trackedCount
  ? `${data.trackedCount} competitor${data.trackedCount === 1 ? "" : "s"} tracked`
  : "No competitors tracked yet";
document.getElementById("meta").innerHTML = data.generatedAt
  ? `<b>Updated</b>&ensp;${new Date(data.generatedAt).toLocaleString()}`
  : "";

const ICON_SCOPE = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21"/></svg>`;
const ICON_BOLT = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>`;
const ICON_DOC = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>`;

function empty(icon, title, bodyHtml) {
  return `<div class="empty">${icon}<div class="big">${title}</div><p>${bodyHtml}</p></div>`;
}

const ONBOARDING_BODY = `Message Competitor Scout in chat with your company and a few
  competitor names, and it takes it from there.`;

function renderOverview() {
  const el = document.getElementById("panel-overview");
  if (!data.competitors.length) {
    el.innerHTML = empty(ICON_SCOPE, "This cabinet is empty on purpose.", ONBOARDING_BODY);
    return;
  }
  el.innerHTML = `<div class="grid">${data.competitors.map(c => `
    <div class="card">
      ${c.screenshot
        ? `<img class="shot" src="../${c.screenshot}" alt="${c.name} evidence" />`
        : `<div class="shot placeholder">No capture yet</div>`}
      <div class="body">
        <div class="nm">${c.name}</div>
        <div class="row">
          <span class="badge ${c.tier === 1 ? "" : "neutral"}">Tier ${c.tier}</span>
        </div>
        <div class="checked">${c.lastChecked ? `Checked ${new Date(c.lastChecked).toLocaleDateString()}` : "Not checked yet"}</div>
      </div>
    </div>`).join("")}</div>`;
}

function renderFeed() {
  const el = document.getElementById("panel-feed");
  if (!data.feed.length) {
    el.innerHTML = empty(ICON_BOLT, "No signals yet.", "The first sweep hasn't run, or nothing has changed since it did.");
    return;
  }
  el.innerHTML = data.feed.map(f => `
    <div class="feeditem">
      <span class="dot ${f.material ? "material" : ""}"></span>
      <div class="body">
        <div class="row1">
          <span class="who">${f.competitor}</span>
          <span class="kind">${f.kind}</span>
          <span class="when">${f.date}</span>
        </div>
        <div class="desc">${f.description}</div>
        ${f.url ? `<a class="src" href="${f.url}">Source →</a>` : ""}
      </div>
    </div>`).join("");
}

function renderBriefings() {
  const el = document.getElementById("panel-briefings");
  if (!data.briefings.length) {
    el.innerHTML = empty(ICON_DOC, "No weekly briefing yet.", "The first one ships once competitors are tracked and a week of evidence has been captured.");
    return;
  }
  el.innerHTML = data.briefings.map(b => `
    <div class="briefingrow">
      <span class="date">${b.date}</span>
      <span class="links">
        <a href="../${b.html}">Open</a>
        ${b.pdf ? `<a href="../${b.pdf}">PDF</a>` : ""}
      </span>
    </div>`).join("");
}

renderOverview();
renderFeed();
renderBriefings();

document.querySelectorAll(".seg").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".seg").forEach(t => t.setAttribute("aria-selected", "false"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.setAttribute("aria-selected", "true");
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add("active");
  });
});
</script>
</body>
</html>
