id: morning-whatsapp-digest
name: Morning WhatsApp Digest
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: whatsapp-digest
agentSlug: whatsapp-digest
timeout: 600
prompt: |-
  Write this morning's WhatsApp digest.

  Your working directory is the cabinet root. Every digest lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-whatsapp-summary.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and opens
  today's, so a name in any other shape is a digest nobody will see. You only ever ADD a
  file: never overwrite, rename or delete a digest already sitting there, including one
  from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the urgency vocabulary and the tone. This prompt does not repeat them.
  2. Read the user's WhatsApp with your WhatsApp tool: every chat with a message in the
     last 24 hours, direct and group. Skip broadcast lists and status updates.
  3. If you have no WhatsApp tool, STOP HERE. Cabinet's connector archives every message
     it sees, but nothing reads that archive back yet — capture and acting are separate
     paths on purpose, so this is expected today, not a broken install. Write nothing.
     Leave `daily-summaries/` exactly as you found it, example and all. Report: "WhatsApp
     is not readable from a routine yet. I would have read the last 24 hours of chats and
     written one row per conversation." Then exit.
  4. If the tool exists but the account is not linked or the call fails, treat it the same
     way: name WhatsApp, say what you would have read, touch no file, exit. A run that
     read nothing writes no file — an empty digest is worse than an absent one.
  5. On the first run that does reach WhatsApp, write your dated file and then delete
     `daily-summaries/EXAMPLE-whatsapp-summary.md`. It is a demo, not a past digest, and
     it must not sit in the date list beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
