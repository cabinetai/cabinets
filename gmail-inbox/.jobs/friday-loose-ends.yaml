id: friday-loose-ends
name: Friday check
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 900
prompt: |-
  Do this Friday's check: who is still waiting for an answer from the owner.

  Your working directory is the cabinet root. Your persona's "Friday check" section holds
  the shape of both files, and its "Waiting on you" lane holds the rule for what counts as
  waiting. This prompt only gives the order.

  1. Read `front-desk/setup.md`.
  2. Read the last 14 days of the inbox the way your persona says. Read only.
  3. If your Connections line says Gmail is not connected, or Gmail cannot be read, write
     only `front-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  4. Write `front-desk/data/loose-ends.json`, oldest first, then check that it parses as
     JSON and fix it if not. On a week when nobody is waiting, still write it, with an
     empty list and the headline "Nobody is waiting on you".
  5. Write `reports/<YYYY-MM-DD> Still waiting.md`.

  Never send, reply, draft, label, archive, mark read or delete anything in Gmail.

  Finish in one plain sentence about the email and nothing else: how many people are
  still waiting, and who has waited longest.
createdAt: '2026-09-15T00:00:00.000Z'
updatedAt: '2026-09-25T00:00:00.000Z'
