id: friday-loose-ends
name: Friday check
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 900
prompt: |-
  Do this Friday's check: who is still waiting for an answer from the owner.

  Your working directory is the cabinet root. Your persona's "Friday check" holds the
  shape, and its lanes say what counts as waiting.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `front-desk/setup.md` and `front-desk/data/latest.json`.
  2. If your Gmail line says Gmail is not connected, write only
     `front-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Start from the last sort's waiting lane when it is under a day old and check the Sent
     mail since then once; otherwise search the last 14 days once.
  4. In one Bash call, write `front-desk/data/loose-ends.json` (and check it parses) and
     `reports/<YYYY-MM-DD>-still-waiting.md`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one plain sentence about the email and nothing else: how many people are
  still waiting, and who has waited longest.
createdAt: '2026-09-15T00:00:00.000Z'
updatedAt: '2026-09-25T00:00:00.000Z'
