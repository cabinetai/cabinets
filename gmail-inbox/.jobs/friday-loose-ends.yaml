id: friday-loose-ends
name: Friday Loose Ends
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 600
prompt: |-
  Write this Friday's loose ends: the threads where someone is still waiting on the person.

  Your working directory is the cabinet root. Every check lives in `loose-ends/`, one file
  per run, named `<YYYY-MM-DD>T<HH-MM-SS>-loose-ends.md`: the local time you ran, then that
  exact postfix. The Inbox Summary page reads the newest one, so a name in any other shape
  is a check nobody will see. Create the folder if it is not there yet. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there.

  1. Read your persona, then `setup.md`, before anything else. The persona's "Friday Loose
     Ends" section holds the file's shape, and its "Waiting on your reply" section holds the
     rule for what counts; `setup.md` holds the person's own answer to "What counts as
     waiting on me". This prompt does not repeat them.
  2. Read the last 14 days of the user's inbox with the Gmail skill, or the
     `mcp__claude_ai_Gmail__*` tools if that is how Gmail is connected. Inbox only. Read
     only.
  3. If a Gmail call fails, say which way in you tried and what it said, touch no file,
     and stop. Never fall back to a morning summary's rows or to an earlier Friday's file.
  4. Write your dated file: frontmatter and the one "Waiting on your reply" table, oldest
     first. On a week when nobody is waiting, still write the file with the header rows
     and a headline that says so. Never create a Gmail draft and never propose sending
     anything from this run.

  Finish by reporting in one sentence how many people are still waiting, and who has waited
  longest.
createdAt: '2026-09-15T00:00:00.000Z'
