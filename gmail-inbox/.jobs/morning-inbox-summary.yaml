id: morning-inbox-summary
name: Morning Inbox Summary
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 600
prompt: |-
  Write this morning's inbox summary.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-gmail-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the urgency vocabulary and the tone. This prompt does not repeat them.
  2. Read the last 24 hours of the user's inbox. Your persona names the two ways in — the
     `mcp__claude_ai_Gmail__*` tools, or the Cabinet `Gmail` skill — and which to prefer.
     Inbox only, skipping spam and promotions.
  3. If you have neither, STOP HERE: Gmail is not connected. Write nothing, leave
     `daily-summaries/` exactly as you found it, example and all, and report: "I can't
     reach Gmail — it isn't connected yet. Open Cabinet's integrations screen and connect
     Gmail, then run this again." Then exit.
  4. Same if you have a tool but the call fails or comes back unauthorized: say which of
     the two you tried and what it said, touch no file, exit. A summary you couldn't read
     the mail for is worse than no summary — never fall back to the example's contents,
     to an earlier day's file, or to what you'd expect a normal inbox to hold.
  5. On the first run that does reach Gmail, write your dated file and then delete
     `daily-summaries/EXAMPLE-gmail-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
