id: morning-inbox-summary
name: Morning Inbox Summary
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 600
prompt: |-
  Write this morning's inbox summary.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-gmail-summary.md`: the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona, then `setup.md`, before anything else. The persona holds the
     frontmatter, the six sections and their columns, the urgency words and the tone;
     `setup.md` holds the person's own answers. This prompt does not repeat them.
  2. Read the user's inbox with the Gmail skill, or the `mcp__claude_ai_Gmail__*` tools
     if that is how Gmail is connected: the last 24 hours for most sections, the last 14
     days for threads still waiting on a reply, and the last seven days of unread mail
     for newsletters. Inbox only, skipping spam and promotions except when counting
     newsletters. Read only.
  3. If a Gmail call fails, say which way in you tried and what it said, touch no file,
     and stop. A summary you couldn't read the mail for is worse than no summary: never
     fall back to the example's contents, to an earlier day's file, or to what you'd
     expect a normal inbox to hold.
  4. Write your dated file with all six sections, in the persona's order, each one table.
     A section with nothing in it keeps its heading and header rows. Replies go into
     "Replies ready to send" as text: never create a Gmail draft and never propose sending
     anything from this run.
  5. On the first run that does reach Gmail, write your dated file and then delete
     `daily-summaries/EXAMPLE-gmail-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: how many messages arrived, how many need
  the person today, and the lead if there is one.
