id: morning-inbox-summary
name: Morning inbox sort
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 900
prompt: |-
  Sort this morning's email for the Front desk app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Gmail, the lanes, the shape of each file, and how to spend little. Follow its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `front-desk/setup.md` and, if it is there,
     `front-desk/data/latest.json` (the last sort).
  2. If your Gmail line says Gmail is not connected, write only
     `front-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Read Gmail: since the last sort when it is under 3 days old, otherwise the wider
     windows once. At most four searches and three opened emails. When nothing new
     arrived, keep the last sort's lanes as they are.
  4. In one Bash call, write `front-desk/data/latest.json` (and check it parses),
     `reports/<YYYY-MM-DD>-morning.md` and `front-desk/data/status.json` with `ok: true`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one or two plain sentences about the email and nothing else: how many people
  are waiting, what money is owed or due, and the one that matters most, if there is one.
createdAt: '2026-08-10T10:39:37.259Z'
updatedAt: '2026-09-25T00:00:00.000Z'
