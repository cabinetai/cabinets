id: monday-gone-quiet
name: Monday check-ins
enabled: true
cloudOnly: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: inbox-summarizer
agentSlug: inbox-summarizer
timeout: 900
prompt: |-
  Do this Monday's check: which regular customers have gone quiet.

  Your working directory is the cabinet root. Your persona's "Monday check" holds who
  counts as a regular, when they have gone quiet, and the shape of the files.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `front-desk/setup.md`.
  2. If your Gmail line says Gmail is not connected, write only
     `front-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Search Gmail twice, as the persona says: the Sent mail from 365 to 60 days ago, then
     all mail of the last 60 days. Open at most three emails.
  4. In one Bash call, write `front-desk/data/gone-quiet.json` (and check it parses) and
     `reports/<YYYY-MM-DD>-gone-quiet.md`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one plain sentence about the email and nothing else: how many regulars have
  gone quiet, and who has been quiet longest.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
