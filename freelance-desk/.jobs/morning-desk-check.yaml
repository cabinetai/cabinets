id: morning-desk-check
name: Morning Desk Check
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: desk-clerk
agentSlug: desk-clerk
timeout: 600
prompt: |-
  Do the morning walk of the desk.

  Your working directory is the cabinet root. One file per thing in `invoices/`,
  `proposals/` and `clients/`. The Desk page redraws from those folders, so the
  folders are the truth and you keep them true.

  1. Read your persona before anything else. It holds the two-zone rule (frontmatter
     states and Log are yours; the person's notes are not), the closed state words
     per folder, and the three things worth acting on. This prompt does not repeat
     them.
  2. Walk every file except the READMEs. Flip Sent invoices past their due date to
     Overdue and draft the chase note; nudge proposals a week quiet; fix
     contradictions. One dated Log line each, newest first.
  3. Skip the `EXAMPLE-` files if they're still there — they're demos. Never delete
     them yourself; their own text tells the user to.
  4. You draft, you never send — every note waits in its file for the person to
     paste into their own email.
  5. If the folders hold nothing but READMEs and examples, report: "The desk is
     empty — tell me about an invoice or proposal and I'll file it." and exit.

  Finish by reporting in two or three sentences: what's overdue and for how much,
  what's gone quiet, and the one chase most worth sending today.
