id: morning-gitlab-brief
name: Morning GitLab Brief
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: gitlab-briefer
agentSlug: gitlab-briefer
timeout: 600
prompt: |-
  Write this morning's GitLab brief.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-gitlab-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Kind` and `State` vocabularies, the ordering, the read-only rule, the
     stop rule for when GitLab is not there, and the tone. This prompt repeats none of them.
  2. With your GitLab tools, find the user's own activity in the last 24 hours across every
     project they touch: their commits, the merge requests they opened or updated, the
     merge requests waiting on their review, and the issues they opened or are assigned.
     Not a feed of everything that happened in a project.
  3. Check the pipeline on anything of theirs still in flight, so a red build turns up as a
     state this morning rather than as a surprise this afternoon.
  4. Open each one only far enough to say in one short line what it does. Read file
     contents and project metadata when a title is too thin to be useful, no further.
  5. If GitLab is not reachable, follow the stop rule in your persona to the letter.
