id: morning-teams-digest
name: Morning catch-up
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: teams-reader
agentSlug: teams-reader
timeout: 900
prompt: |-
  Catch up on Teams for the Catch up app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Teams, what needs the person, the helper's commands, and how to spend little. Every call
  to Teams and every file the page reads goes through `node catch-up/first-sort.mjs`
  (from the cabinet root, never `cd`).

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `catch-up/setup.md`, and run `ls catch-up/data/profile.json`.
  2. If your Microsoft Teams line says Teams is not connected, write only
     `catch-up/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  4. If the helper exits 3, Teams needs a new sign-in: run `done`, write the failed status
     with that why, and stop. If anything else fails after `start`, still run `done`.

  Only read Teams: never post, reply, react, mark read, or change anything.

  Finish in one or two plain sentences and nothing else: how many people wait for an
  answer, how many promises are open, and the one thing that matters most this morning.
createdAt: '2026-08-09T00:00:00.000Z'
updatedAt: '2026-10-14T00:00:00.000Z'
