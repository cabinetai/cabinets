    }
    var refused = state.data && state.data.channelsRefused === true;
    return listBox("channels", "Channels", "i-hash", "", c.length,
      '<ul class="rows">' + c.map(function (x) {
        var name = text(x.name, 60) || "General";
        var link = teamsLink(x);
        var needs = NEEDS_WORDS[x.needs] ? x.needs : "none";
        return '<li class="ch ' + needs + '"><b dir="auto">' + (text(x.team) ? '<span class="team">' + esc(text(x.team, 60)) + " › </span>" : "") + esc(name) + "</b>" +
          '<span class="n num">' + num(x.count).toLocaleString() + "</span>" +
          '<span class="g" dir="auto">' + esc(text(x.gist, 160)) + "</span>" + '<span class="w">' + esc(NEEDS_WORDS[needs]) + "</span>" +
          (needs !== "you" ? "" : '<span class="acts">' + (canAsk() ? '<button class="btn quiet small" data-act="channel-ask" data-name="' + esc((text(x.team) ? text(x.team, 60) + " > " : "") + name) + '">' + icon("i-chat") + "What happened here?</button>" : "") +
          (link ? '<a class="btn quiet small" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Teams</a>" : "") + "</span>") + "</li>";
      }).join("") + "</ul>",
      refused ? "Your channels need your IT admin’s OK before Cabinet can read them. Your chats are all here." : "No channel moved since the last morning.");
  }

  function drawLoud(level) {
    var l = loud();
    var skipped = num(totals().skipped);
    if (level === "S") {
      return sumBox("loud", "Safe to skip", "i-bell-off", skipped ? skipped.toLocaleString() : "", "messages needed nothing from you",
        l[0] ? esc(text(l[0].name, 80)) : "");
    }
    var max = l.reduce(function (m, x) { return Math.max(m, num(x.count)); }, 1);
    return listBox("loud", "Safe to skip", "i-bell-off", "", l.length,
      '<ul class="rows skip">' + l.map(function (x) {
        return '<li><b dir="auto">' + esc(text(x.name, 90)) + '</b><span class="n num">' + num(x.count).toLocaleString() + "</span>" +
          '<span class="bar" aria-hidden="true"><i style="width:' + Math.max(4, Math.round(num(x.count) / max * 100)) + '%"></i></span></li>';
      }).join("") + "</ul>",
      "Nothing loud. Every place that moved had something for you.") +
      (l.length ? '<p class="skip-foot">' + (skipped ? "<b>" + skipped.toLocaleString() + " messages</b> needed nothing from you. " : "None of these asked anything of you. ") + "They are still all in Teams.</p>" : "") + nudgeHtml(boxIdea("loud"));
  }

  /** The numbers to glance at, each a card. */
  function kpiCards() {
    var w = waiting().length;
    var urgent = waiting().filter(function (x) { return x.urgent === true; }).length;
    var p = promises().length;
    var skipped = num(totals().skipped);
    return {
      waiting: w
        ? '<a class="kpi first" href="#lane-waiting"><span class="label">' + icon("i-reply") + "Waiting on you</span>" +
          '<span class="value num">' + w + '</span><span class="sub">' + (urgent ? urgent + " to answer today" : plural(w, "person", "people")) + "</span></a>"
        : '<a class="kpi calm" href="#lane-waiting"><span class="label">' + icon("i-check") + "Waiting on you</span>" +
          '<span class="value num">0</span><span class="sub">Everyone has an answer</span></a>',
      promises: '<a class="kpi" href="#lane-promises"><span class="label">' + icon("i-flag") + "You said you would</span>" +
        (p ? '<span class="value num">' + p + '</span><span class="sub">still open</span>' : '<span class="value none">None</span><span class="sub">Nothing open</span>') + "</a>",
      skipped: '<a class="kpi" href="#lane-loud"><span class="label">' + icon("i-bell-off") + "Safe to skip</span>" +
        '<span class="value num">' + skipped + '</span><span class="sub">of ' + num(totals().messages).toLocaleString() + " messages</span></a>"
    };
  }

  /** What the person told the cabinet about their work, from setup.md. */
  function drawSetup(level) {
    var items = state.setup || [];
    var set = items.filter(function (a) { return !a.unset; }).length;
    var btn = canAsk() && askReady()
      ? '<button class="btn small" data-act="ask" data-q="' + esc(set ? "I want to change what you know about my work in Teams." : "I want to tell you about my work so you can read my Teams better.") + '">' +
        icon("i-pen") + (set ? "Change this" : "Tell it now") + "</button>"
      : "";
    if (level === "S") {
      return sumBox("setup", "What it knows", "i-sliders", set + " of " + items.length, "answers given", "") + (btn ? '<div class="box-pad">' + btn + "</div>" : "");
    }
    if (!set) {
      return boxHead("setup", "Tell your catch-up about your work", "i-sliders", "", null) +
        '<div class="box-pad"><p>Whose messages always matter, which chats to skip, and how your replies sound. Two minutes here makes every morning sharper.</p>' + btn + "</div>";
    }
    return boxHead("setup", "What your catch-up knows", "i-sliders", "", null) +
      '<div class="box-pad"><dl class="facts">' + items.slice(0, 4).map(function (a) {
        return "<div><dt>" + esc(a.label) + "</dt><dd" + (a.unset ? ' class="unset"' : "") + ' dir="auto">' + esc(a.unset ? "Not set yet" : text(a.value, 240)) + "</dd></div>";
      }).join("") + "</dl>" + btn + "</div>";
  }

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shown = shownIdeas();
    if (featured) shown[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shown[idea.id] && !state.hiddenIdeas[idea.id]; }).slice(0, level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask, or try an idea</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about your Teams..." />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +
      (level !== "S" && note ? '<p class="note" id="ask-note">' + esc(note) + "</p>" : "");
  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */
  function drawLayoutAsk(level) {
    var note = state.askNote || "The agent suggests the boxes. Nothing changes until you press Apply.";
    return (level === "S" ? "" : '<h2 id="ask-title">Ask the agent about your boxes</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: hide the channels, show my next 3 things" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about Teams</button></p>';
  }
  function askHint() {
    if (askReady()) return "The answer comes up in the chat next to this page.";
    return teamsState() === "not-available-here"
      ? "Once Teams works here, you can ask things like these."
      : "Connect Teams first, then ask anything. A question here takes you to connecting.";
  }

  // ── Ideas, where and when they help ────────────────────────────────────
  // An idea offers itself in its box when today's messages say it would help, with the real
  // numbers, at most one per box. "Hide" takes it off the page for good (kept per person in
  // cabinet.mine); the Ideas panel always has every one.

  var HIDDEN_IDEAS_KEY = "teams-catch-up-hidden-ideas@1";

  /** What today's Teams says, counted once for every idea. */
  function ideaFacts() {
    var ref = refDate();
    return {
      ref: ref,
      longWait: waiting().filter(function (x) { var at = parseTime(x.at); return at && daysBetween(at, ref) >= 1; }).length,
      promises: promises().length,
      meetings: decided().filter(function (x) { return x.where && x.where.kind === "meeting"; }).length,
      loud: loud().length
    };
  }

  /** For each idea: the line and the press that fit today, or null when it would not help now. */
  var IDEA_FITS = {
    replies: function (f) {
      var n = f.longWait;
      return n ? { line: n + " " + plural(n, "person has", "people have") + " waited a day or more for you.", act: n === 1 ? "Write the reply" : "Write their replies" } : null;
    },
    promises: function (f) {
      var n = f.promises;
      return n ? { line: "You said you would do " + n + " " + plural(n, "thing", "things") + ". Check what is still open?", act: "Check them" } : null;
    },
    catchup: function (f) {
      return f.ref.getDay() === 1 ? { line: "It’s Monday. Catch up on what moved since Friday?", act: "Catch me up" } : null;
    },
    prep: function (f) {
      return f.meetings ? { line: "Your meeting chats moved. Know what was said before you go in?", act: "Get me ready" } : null;
    },
    quiet: function (f) {
      var n = f.loud;
      return n ? { line: n + " loud " + plural(n, "place", "places") + " never needed you. Mute them?", act: "Show me how" } : null;
    },
    weekly: function (f) {
      var day = f.ref.getDay();
      return day === 4 || day === 5
        ? { line: "It’s " + f.ref.toLocaleDateString([], { weekday: "long" }) + ". Send your manager this week’s update?", act: "Write the update" }
        : null;
    },
    files: function () { return null; }
  };

  function actionButton(a) {
    return '<button type="button" class="btn small" data-act="' + a.act + '"' + (a.id ? ' data-id="' + esc(a.id) + '"' : "") +
      (typeof a.i === "number" ? ' data-i="' + a.i + '"' : "") +
      (a.q ? ' data-q="' + esc(a.q) + '"' : "") + (canAsk() || a.act === "copy" ? "" : " disabled") + ">" + esc(a.label) + "</button>";
  }

  function drawNext(level) {
    var all = nextThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    var top = open.slice(0, 3);
    if (level === "S") {
      return sumBox("next", "Do next", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "Nothing needs you",
        top[0] ? "<b>" + esc(top[0].title) + "</b>" : "");
    }
    var body = top.length
      ? '<ol class="rows things">' + top.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            actionButton(t.action) + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else needs you today." : "Nothing needs you today.") + "</p>";
    var rest = open.length - top.length;
    var foot = (rest > 0 ? "<span>" + rest + " more " + plural(rest, "thing", "things") + " in the other boxes</span>" : "<span></span>") +
      (done ? '<button type="button" class="btn quiet small" data-act="undone">' + done + " done · Bring back</button>" : "");
    return boxHead("next", top.length === 3 ? "Your next 3 things" : "Your next things", "i-check", "", null) +
      '<div class="box-body">' + body + "</div>" +
      (rest > 0 || done ? '<div class="next-foot">' + foot + "</div>" : "") +
      '<button type="button" class="box-more" data-act="more-rows" hidden></button>';
  }

  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.next;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    nextThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shown = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shown.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }
    var facts = ideaFacts();
    var can = canAsk();
    return listBox("ideas", "Ideas", "i-bulb", "", shown.length,
      '<ul class="rows idea-rows">' + shown.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }

  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  function ideaById(id) {
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].id === id) return IDEAS[i];
    return null;
  }
  /** The idea with what fits today, or null when it is hidden or would not help now. */
  function fitted(idea, facts) {
    if (!idea || state.hiddenIdeas[idea.id] || !state.data) return null;
    var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts || ideaFacts()) : null;
    return fit ? { idea: idea, line: fit.line, act: fit.act } : null;
  }
  function onPage(boxId) {
    return placed().some(function (spot) { return spot.id === boxId; });
  }
  /** The first idea of this box that fits today. */
  function boxIdea(boxId) {
    var facts = ideaFacts();
    for (var i = 0; i < IDEAS.length; i++) {
      if (IDEAS[i].box !== boxId) continue;
      var f = fitted(IDEAS[i], facts);
      if (f) return f;
    }
    return null;
  }
  /** Ideas the list boxes on the page are showing right now. */
  function shownIdeas() {
    var shown = {};
    ["waiting", "promises", "decided", "loud"].forEach(function (id) {
      var el = boxEls[id];
      if (!onPage(id) || (el && el.getAttribute("data-level") === "S")) return;
      var f = boxIdea(id);
      if (f) shown[f.idea.id] = true;
    });
    return shown;
  }
  /** The Ask box's idea for today: its own, or one whose box is not on the page. */
  function askIdea() {
    var facts = ideaFacts();
    var shown = shownIdeas();
    var best = null;
    IDEAS.forEach(function (idea) {
      if (best || shown[idea.id] || (idea.box !== "ask" && onPage(idea.box))) return;
      best = fitted(idea, facts);
    });
    return best;
  }

  /** "every Monday", "every month": the schedule as the end of "Do this ...". */
  function routineWords(idea) { return idea.when.charAt(0).toLowerCase() + idea.when.slice(1); }

  function nudgeHtml(fit, lead) {
    if (!fit) return "";
    var idea = fit.idea;
    var can = canAsk();
    return '<div class="nudge">' + icon("i-bulb") + '<p dir="auto">' + esc((lead || "") + fit.line) + "</p>" +
      '<div class="nudge-actions">' +
      '<button type="button" class="btn small ' + (lead ? "primary" : "dark") + '" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + esc(fit.act) + "</button>" +
      '<button type="button" class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>" +
      '<button type="button" class="nudge-hide" data-act="idea-hide" data-idea="' + idea.id + '" aria-label="Hide this idea from the page">Hide</button>' +
      "</div></div>";
  }

  function setIdeaHidden(id, hidden) {
    var before = snapshot();
    if (hidden) state.hiddenIdeas[id] = true;
    else delete state.hiddenIdeas[id];
    paintGrid();
    glide(before);
    // The idea that takes its place fades up.
    var idea = ideaById(id);
    var home = idea && boxEls[idea.box];
    if (home && home.isConnected) fadeIn(home.querySelector(".nudge"));
    if (state.drawerOpen) paintDrawer();
    toast(hidden ? "Hidden. You can always find it under Ideas." : "It’s back on your page when it fits your day.");
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(HIDDEN_IDEAS_KEY, Object.keys(state.hiddenIdeas)).catch(function () {
        toast("That could not be saved. It comes back next time.");
      });
    }
  }

  var DRAWERS = {
    ideas: { title: "Ideas", sub: "One tap to ask now, or to have it done for you on a schedule.", icon: "i-bulb", paint: paintIdeasPanel },
    add: { title: "Add a box", sub: "Pick what you want on your page. You can remove it again any time.", icon: "i-plus", paint: paintPicker }
  };
  function paintDrawer() {
    var kind = DRAWERS[state.drawerKind] || DRAWERS.ideas;
    $("drawer-title").textContent = kind.title;
    $("drawer-sub").textContent = kind.sub;
    $("drawer-icon").innerHTML = icon(kind.icon);
    kind.paint();
  }

  // The Add a box panel: every box by group, the ones on the page ticked.
  function paintPicker() {
    var on = {};
    (state.layout || DEFAULT_LAYOUT).forEach(function (b) { on[b.id] = true; });
    $("drawer-body").innerHTML = GROUPS.map(function (group) {
      var ids = Object.keys(BOXES).filter(function (id) { return BOXES[id].group === group.id; });
      return '<section class="pick-group"><h3>' + esc(group.title) + "</h3>" + ids.map(function (id) {
        var box = BOXES[id];
        var ready = !box.show || box.show();
        var note = on[id] ? (ready ? "On your page" : "On your page. " + box.when) : ready ? "" : box.when;
        return '<div class="pick' + (on[id] ? " on" : "") + '"><span class="pick-ic" aria-hidden="true">' + icon(box.icon) + "</span>" +
          "<div><b>" + esc(box.title) + "</b><span>" + esc(box.desc) + "</span>" +
          (note ? "<em" + (ready ? "" : ' class="wait"') + ">" + esc(note) + "</em>" : "") + "</div>" +
          (on[id]
            ? '<span class="pick-on" aria-hidden="true">' + icon("i-check") + "</span>"
            : '<button type="button" class="btn small" data-act="add-this" data-add="' + id + '"' + (ready ? "" : " disabled") +
              ' aria-label="Add ' + esc(box.title) + '">' + icon("i-plus") + "Add</button>") +
          "</div>";
      }).join("") + "</section>";
    }).join("");
  }

  // ── Editing the page ───────────────────────────────────────────────────
  // Edit layout turns on a bar above the grid; each box gets a remove button and stops
  // reacting to presses. Every change is kept at once in cabinet.mine, and Undo steps back.

  function startEdit() {
    // Boxes show the size they were given while being arranged, not grown by an open list.
    state.open = {};
    state.expanded = {};
    state.need = {};
    state.editing = true;
    state.undo = [];
    // The page's opening fade ends here, so no box is caught half way into it while moving.
    Object.keys(boxEls).forEach(function (id) { boxEls[id].classList.remove("rise"); });
    paint();
    paintEditbar();
    // The remove and resize handles pop in once, as edit mode starts.
    var grid = $("grid");
    grid.classList.add("fresh");
    setTimeout(function () { grid.classList.remove("fresh"); }, 700);
    toast(phone() ? "Hold a box to move it. Pick its size on top." : "Drag a box to move it. Pull its corner to resize it.");
  }
  function doneEdit() {
    state.editing = false;
    state.undo = [];
    closeDrawer();
    paint();
    paintEditbar();
  }
  function paintEditbar() {
    $("editbar").hidden = !state.editing;
    $("undo-btn").disabled = !state.undo.length;
  }

  function saveLayout() {
    if (!V2 || !cab.mine || typeof cab.mine.set !== "function") return;
    cab.mine.set(LAYOUT_KEY, state.layout).catch(function () {
      toast("Your page could not be saved. It goes back to how it was next time.");
    });
  }
  function changeLayout(next, easing) {
    var before = snapshot();
    letGo();
    state.undo.push(copyLayout(state.layout || DEFAULT_LAYOUT));
    if (state.undo.length > 30) state.undo.shift();

  }

  function removeBox(id) {

  // ── Asking the agent to change the page ────────────────────────────────
  // The agent cannot reach a person's layout (it lives in cabinet.mine), so it writes what
  // to add and remove into data/layout-change.json. The page shows that with Apply and
  // No thanks, and remembers in cabinet.mine which change it last showed.

  var CHANGE_SEEN_KEY = "teams-catch-up-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {
    var menu = $("layout-menu");
    var r = button.getBoundingClientRect();
    state.menuOpen = true;
    menu.hidden = false;
    menu.style.top = r.bottom + 6 + "px";
    menu.style.left = Math.max(16, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 16)) + "px";

  /** The words sent with a layout request: the boxes on the page now and who is asking. */
  function layoutWords(wish) {

    var me = myName();
    return "Change the boxes on my Teams catch-up page." + (me ? " I am " + me + "." : "") +
      " On it now: " + (on.length ? on.join(", ") : "no boxes") + ". What I want: " + wish;
  }
  function myName() {
    var own = cabName();
    if (own) return own;
    return state.profile && state.profile.name ? state.profile.name : "";
  }
  function cabName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    // Without a cloud sign-in Cabinet says "You": that is no name, so the greeting leaves it out.
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    return /^you$/i.test(name) ? "" : name;
  }
  /** The Ask box takes the request when it is on the page; otherwise the chat's own box does. */
  function askAboutLayout() {
    var el = boxEls.ask;
    if (onPage("ask") && el && el.isConnected) {
      state.layoutAsk = true;
      setAskNote("");
      drawBox(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if ($("ask-input")) $("ask-input").focus({ preventScroll: true });
      return;
    }
    cab.ask(layoutWords(""), { send: false }).then(function () {
      toast("Finish the sentence in the chat. The agent's suggestion shows up on this page.");
    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });
  }
  function sendLayoutAsk(wish) {
    var words = text(wish, 600);
    if (!words) return;
    setAskNote("Sending...");
    cab.ask(layoutWords(words), { send: true }).then(function () {
      state.layoutAsk = false;
      if ($("ask-input")) $("ask-input").value = "";
      setAskNote("Sent. The agent's suggestion shows up at the top of this page.");
      if (boxEls.ask) drawBox(boxEls.ask);
    }).catch(function (e) {

    });
  }
  function stopLayoutAsk() {

  }

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    function ids(list) {
      return Array.isArray(list) ? list.filter(function (id, i) { return typeof id === "string" && BOXES[id] && list.indexOf(id) === i; }) : [];
    }
    return { at: d.at, for: text(d.for, 80), add: ids(d.add), remove: ids(d.remove), note: text(d.note, 300) };
  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {
    var c = state.change;
    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = cabName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });
    if (!add.length && !remove.length && !c.note) return null;

  // A number box shares its title with a list ("Waiting on you"), so it says it is the number.
  function titles(ids) {
    return ids.map(function (id) { return BOXES[id].title + (BOXES[id].group === "numbers" ? " (number)" : ""); }).join(", ");
  }
  function paintSuggest() {
    var el = $("suggest");
    if (state.changeApplied) {
      el.hidden = false;
      el.innerHTML = "<p><b>Your page changed.</b></p>" +
        '<div class="suggest-actions"><button type="button" class="btn" data-act="change-undo">' + icon("i-undo") + "Undo</button>" +
        '<button type="button" class="btn dark" data-act="change-ok">OK</button></div>';
      return;
    }
    var c = state.loaded ? pendingChange() : null;
    el.hidden = !c;
    if (!c) { el.innerHTML = ""; return; }
    var parts = [];
    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");
    el.innerHTML = "<p>" + (parts.length ? "<b>The agent suggests:</b> " + esc(parts.join(", and ")) + "." : "<b>From the agent:</b>") +
      (why ? '<span class="why" dir="auto">' + esc(why) + "</span>" : "") + "</p>" +
      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">' + icon("i-check") + "Apply</button>" +
          '<button type="button" class="btn" data-act="change-skip">No thanks</button>'
        : '<button type="button" class="btn" data-act="change-skip">OK</button>') + "</div>";
  }
  function markChangeSeen(at) {

  }
  function applyChange() {
    var c = pendingChange();
    if (!c) return;
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return c.remove.indexOf(b.id) < 0; });
    c.add.forEach(function (id) {
      var box = BOXES[id];
      var w = Math.min(box.w, COLS);
      var at = freeSpot(w, box.h, next);
      next.push({ id: id, x: at.x, y: at.y, w: w, h: box.h });

  }
  function skipChange() {

    paintSuggest();
  }

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a
  // moment first, so the page still scrolls under a passing finger; outside edit mode the
  // hold also starts editing. While a box moves, the others make room live and an outline
  // shows where it lands. The corner handle resizes it on the grid, naming the size it
  // reaches. On a phone a box moves up and down its column; its size is a switch.

  var HOLD_MS = 600;
  var SLOP = 8;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  }
  /** The page with one box put at x, y and sized w by h, every other box making room. */
  function previewWith(id, x, y, w, h) {
    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }
      return b;
    }), id);
  }
  function showSpots(spots) {
    spots.forEach(function (s) {
      var el = boxEls[s.id];

      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {
    var at = {};
    spots.forEach(function (s) { at[s.id] = s; });
    var before = copyLayout(state.layout || DEFAULT_LAYOUT);
    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }

  }
  /** Nothing changed: every box glides back to the place it already had. */
  function settleBack(easing) {

  // The outline where a moving box lands, and the size a resized box has reached.

  function sizeWords(el) {
    var id = el.getAttribute("data-box");
    var level = el.getAttribute("data-level") || "M";
    var name = LEVEL_WORDS[level];
    if (!BOXES[id].list) return name;
    if (level === "S") return name + ": the total only";
    var n = el.querySelectorAll(".rows > li:not([hidden]), .cards > li:not([hidden])").length;
    return n ? name + ": " + n + " " + plural(n, "row", "rows") : name;
  }

  function beginDrag(kind, el, x, y, touch) {

    if (kind === "stack") {

      drag.sx = spot.x;
      drag.sy = spot.y;

    // while the hand moves.

  // The box follows the hand pixel by pixel; the outline shows the grid size it will take,
  // the neighbours make room for that size, and letting go glides the box into it.
  function resizeOnGrid() {

    drag.el.style.height = ph + "px";

  /** The label names what the box shows at the size it has under the hand. */

    drag.boxes.forEach(function (b, i) {

  /**

   * after it has rested there for a moment, slowly at first and never fast, so a box carried

  var EDGE = 56;

  // Mouse and pen: press on a box and move a little; the corner handle resizes at once

  // A finger: hold still on a box for a moment, then drag.
  document.addEventListener("touchstart", function (e) {
    if (drag || e.touches.length !== 1 || !state.data) return;
    var el = e.target.closest ? e.target.closest("#grid > .box") : null;
    if (!el || e.target.closest(".box-x, .box-size, .box-resize")) return;
    var t = e.touches[0];
    hold = { el: el, x: t.clientX, y: t.clientY, timer: setTimeout(function () {
      var h = hold;
      hold = null;
      if (!h || !h.el.isConnected) return;
      if (!state.editing) startEdit();
      beginDrag(phone() ? "stack" : "move", h.el, h.x, h.y, true);
    }, HOLD_MS) };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (hold && t && Math.abs(t.clientX - hold.x) + Math.abs(t.clientY - hold.y) > SLOP) {
      clearTimeout(hold.timer);
      hold = null;
    }
    if (drag && drag.touch && t) {
      e.preventDefault();
      moveDrag(t.clientX, t.clientY);
    }
  }, { passive: false });
  function touchOver(e, cancelled) {
    if (hold) { clearTimeout(hold.timer); hold = null; }
    if (drag && drag.touch) {
      // No tap reaches what was under the finger when it lets go of a box.
      if (e.cancelable) e.preventDefault();
      endDrag(cancelled);
    }
  }
  document.addEventListener("touchend", function (e) { touchOver(e, false); }, { passive: false });
  document.addEventListener("touchcancel", function (e) { touchOver(e, true); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { if (drag || hold) e.preventDefault(); });

  // The keyboard: arrows move the box in focus, Shift and arrows resize it.
  var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  function keyMove(el, d, resize) {
    var id = el.getAttribute("data-box");
    if (phone()) {
      if (!d[1]) return;
      var ids = phoneOrder(placed()).map(function (s) { return s.id; });
      var from = ids.indexOf(id);
      var to = clamp(from + d[1], 0, ids.length - 1);
      if (to === from) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
        var at = ids.indexOf(b.id);
        if (at >= 0) b.o = at;
        return b;
      }));
      el.focus();
      toast(BOXES[id].title + " moved " + (d[1] < 0 ? "up" : "down") + ".");
      return;
    }
    var s = spotIn(placed(), id);
    if (!s) return;
    var min = minSize(id);
    if (resize) {
      var w = clamp(s.w + d[0], min.w, COLS - s.x);
      var h = clamp(s.h + d[1], min.h, 40);
      if (keepSpots(previewWith(id, s.x, s.y, w, h))) {
        el.focus();
        requestAnimationFrame(function () { toast(BOXES[id].title + ": " + sizeWords(el)); });
      }
      return;
    }
    // Down past empty space would only float back up, so it goes as far as it takes to move.
    for (var step = 1; step <= 40; step++) {
      var x = clamp(s.x + d[0] * step, 0, COLS - s.w);
      var y = Math.max(0, s.y + d[1] * step);
      if (x === s.x && y === s.y) return;
      if (keepSpots(previewWith(id, x, y, s.w, s.h))) {
        el.focus();
        toast(BOXES[id].title + " moved.");
        return;
      }
      if (d[0]) return;
    }
  }
  document.addEventListener("keydown", function (e) {
    if (!state.editing || drag || !ARROWS[e.key]) return;
    var el = document.activeElement;
    if (!el || !el.matches || !el.matches("#grid > .box")) return;
    e.preventDefault();
    keyMove(el, ARROWS[e.key], e.shiftKey);
  });

  // The Ideas panel: every idea, today's line when it fits, and the hidden ones to bring back.
  function paintIdeasPanel() {
    var can = canAsk();
    var facts = state.data ? ideaFacts() : null;
    $("drawer-body").innerHTML =
      (!V2 ? '<p class="fine" style="margin:0">Ask for any of these in the cabinet’s chat.</p>'
        : !askReady() ? '<p class="fine" style="margin:0">Connect Teams and each of these is one tap away.</p>' : "") +
      IDEAS.map(function (idea) {
        var off = !!state.hiddenIdeas[idea.id];
        var fit = !off && facts && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<article class="idea' + (off ? " off" : "") + '">' +
          '<span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<h3>" + esc(idea.title) + "</h3><p>" + esc(idea.text) + "</p>" +
          (fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "") +
          (off ? '<div class="off-note">Hidden from your page<button type="button" class="btn quiet" data-act="idea-unhide" data-idea="' + idea.id + '">Show on my page</button></div>' : "") +
          '<div class="go"><button class="btn dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask now</button>" +
          '<button class="btn" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button></div>" +
          "</article>";
      }).join("");
  }

  var drawerTimer = 0;
  var drawerFrom = null;
  function openDrawer(kind) {
    var el = $("drawer");
    clearTimeout(drawerTimer);
    drawerFrom = document.activeElement;
    state.drawerOpen = true;
    state.drawerKind = kind;
    el.querySelector(".drawer-body").scrollTop = 0;
    paintDrawer();
    el.hidden = false;
    document.body.style.overflow = "hidden";
    // One frame on screen closed first, so the panel slides in rather than appearing.
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("open"); }); });
    el.querySelector(".drawer-panel").focus();
  }
  function closeDrawer() {
    var el = $("drawer");
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    el.classList.remove("open");
    document.body.style.overflow = "";
    drawerTimer = setTimeout(function () { el.hidden = true; }, 360);
    if (drawerFrom && drawerFrom.focus) drawerFrom.focus();
  }

  // A press anywhere outside the Layout menu closes it.
  document.addEventListener("pointerdown", function (event) {
    if (!state.menuOpen || !event.target.closest) return;
    if (event.target.closest("#layout-menu, [data-act='layout-menu']")) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) button.setAttribute("aria-expanded", "false");
  });
  window.addEventListener("resize", function () { if (state.menuOpen) { state.menuOpen = false; $("layout-menu").hidden = true; } });

  // ── Presses ────────────────────────────────────────────────────────────

  function about(item) {
    var who = text(item.who || item.to, 90);
    return who + " " + askPlace(item.where) + (text(item.said) ? ', who wrote: "' + text(item.said, 240) + '"' : "");
  }
  /** Ticks a waiting message or a promise off the page; it stays off on every computer. */
  function itemDone(kind, item, row) {
    var finish = function () {
      state.done[thingKey(kind, item)] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      toast("Done. It is off your page.");
    };
    if (row && motionOK()) {
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 260);
    } else finish();
  }

  document.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var item = id ? findItem(id) : null;
    if (act === "toggle") {
      var was = snapshot();
      state.open[id] = !state.open[id];
      paintGrid();
      glide(was);
      var again = document.querySelector('[data-act="toggle"][data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (again) again.focus();
    } else if (act === "connect") connect();
    else if (act === "run") runNow();
    else if (act === "more-rows") {
      var boxId = el.closest(".box").getAttribute("data-box");
      var shown = snapshot();
      state.expanded[boxId] = !state.expanded[boxId];
      fitBox(boxEl(boxId));
      glide(shown);
    }
    else if (act === "ask") ask(el.getAttribute("data-q"));
    else if (act === "copy" && item) copyText(text(item.reply));
    else if (act === "reply" && item) {
      ask((text(item.reply) ? "Change the reply you wrote to " : "Write a short reply to ") + about(item) +
        ". Read the chat first, write it the way I write in Teams, and show it to me here so I can copy it. Never post anything in Teams.");
    } else if (act === "followup" && item) {
      ask("In Teams, " + askPlace(item.where) + ", I told " + (text(item.to, 90) || "someone") + ': "' + text(item.said, 240) +
        '". Read that chat, tell me in one line whether I seem to have done it, and write a short message I could send with it or to give an update, in my voice, with [brackets] for what I need to fill in. Never post anything in Teams.');
    } else if (act === "item-done" && item) {
      itemDone(el.getAttribute("data-kind") === "promise" ? "promise" : "reply", item, el.closest(".row"));
    } else if (act === "channel-ask") {
      ask("What happened in the Teams channel " + el.getAttribute("data-name") + " " + sinceWords() + "? Tell me in three short lines, and say if anything there needs me.");
    } else if (act === "idea-now") {
      var idea = ideaById(el.getAttribute("data-idea"));
      if (idea) { closeDrawer(); ask(idea.ask); }
    } else if (act === "idea-routine") {
      var r = ideaById(el.getAttribute("data-idea"));
      if (r) { closeDrawer(); ask("Set this up as a routine that runs " + r.at + ": " + r.ask + " Show me the routine so I can approve it before it starts."); }
    } else if (act === "idea-hide") {
      setIdeaHidden(el.getAttribute("data-idea"), true);
    } else if (act === "idea-unhide") {
      setIdeaHidden(el.getAttribute("data-idea"), false);
    } else if (act === "ideas") {
      openDrawer("ideas");
    } else if (act === "done") {
      markDone(el.getAttribute("data-key"), el.closest(".thing"));
    } else if (act === "undone") {
      bringBack();
    } else if (act === "add-box") {
      openDrawer("add");
    } else if (act === "add-this") {
      var add = el.getAttribute("data-add");
      if (BOXES[add]) addBox(add);
    } else if (act === "phone-size") {
      var sized = el.closest(".box").getAttribute("data-box");
      var size = el.getAttribute("data-size");
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) { if (b.id === sized) b.p = size; return b; }));
      if (boxEls[sized]) { var btn = boxEls[sized].querySelector('[data-size="' + size + '"]'); if (btn) btn.focus(); }
    } else if (act === "remove-box") {
      removeBox(el.closest(".box").getAttribute("data-box"));
    } else if (act === "layout-menu") {
      if (state.menuOpen) closeMenu(); else openMenu(el);
    } else if (act === "layout-edit") {
      closeMenu();
      startEdit();
    } else if (act === "layout-ask") {
      closeMenu();
      askAboutLayout();
    } else if (act === "layout-ask-cancel") {
      stopLayoutAsk();
    } else if (act === "change-apply") {
      applyChange();
    } else if (act === "change-skip") {
      skipChange();
    } else if (act === "change-undo") {
      state.changeApplied = false;
      undoLayout();
      paintSuggest();
      toast("Your page is back to how it was.");
    } else if (act === "gift-do") {
      var gift = state.reading && state.reading.gift;
      if (gift) {
        ask(giftParts(gift).ask);
        state.giftAsked = gift.at;
        giftDone(gift);
        if (readingNow() || revealing()) paintHero(); else paintGiftKeep();
      }
    } else if (act === "gift-skip") {
      if (state.reading && state.reading.gift) giftDone(state.reading.gift);
      paintGiftKeep();
    } else if (act === "profile-ok") {
      markProfileSeen();
      toast("Thanks. Your catch-up works with this from now on.");
    } else if (act === "profile-fix") {
      markProfileSeen();
      cab.ask("About how I work in Teams, please fix this: ", { send: false }).catch(function () {});
    } else if (act === "change-ok") {
      state.changeApplied = false;
      paintSuggest();
    } else if (act === "edit-start") {
      startEdit();
    } else if (act === "edit-done") {
      doneEdit();
    } else if (act === "undo") {
      undoLayout();
    } else if (act === "reset-layout") {
      resetLayout();
    } else if (act === "drawer-close") {
      closeDrawer();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (drag) endDrag(true);
    else if (state.menuOpen) closeMenu();
    else if (state.drawerOpen) closeDrawer();
    else if (state.editing) doneEdit();
  });

  // The Ask box is drawn again as it changes size, so its form is listened to from here.
  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    if (state.layoutAsk) sendLayoutAsk($("ask-input").value);
    else ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paint();

  if (PHONE) {
    var onPhoneChange = function () { if (state.loaded && state.data) paintGrid(); };
    if (PHONE.addEventListener) PHONE.addEventListener("change", onPhoneChange);
    else if (PHONE.addListener) PHONE.addListener(onPhoneChange);
  }
  // Rows are measured to fit their boxes; the web font changes their height once it arrives.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      Object.keys(boxEls).forEach(function (id) { if (boxEls[id].isConnected) fitBox(boxEls[id]); });
    });
  }

  if (V2) {
    // This person's own layout, if they changed it; the default otherwise.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var clean = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (clean) state.layout = clean;
      var seenProfile = mine ? mine.get(PROFILE_SEEN_KEY) : null;
      if (typeof seenProfile === "string") state.profileSeen = seenProfile;
      var giftSeen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof giftSeen === "string") state.giftDone = giftSeen;
      state.mineReady = true;
      var seen = mine ? mine.get(CHANGE_SEEN_KEY) : null;
      if (typeof seen === "string") state.changeSeen = seen;
      var hidden = mine ? mine.get(HIDDEN_IDEAS_KEY) : null;
      if (Array.isArray(hidden)) hidden.forEach(function (id) { if (ideaById(id)) state.hiddenIdeas[id] = true; });
      var done = mine ? mine.get(DONE_KEY) : null;
      var fresh = new Date(Date.now() - 14 * DAY_MS);
      if (done && typeof done === "object") Object.keys(done).forEach(function (k) {
        var at = parseTime(done[k]);
        if (at && at >= startOfDay(fresh)) state.done[k] = done[k];
      });
      paint();
    }).catch(function () {});
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      // The routine's data and the person's setup.md both live in this app's folder.
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    cab.connectors.list().then(function (items) {
      state.teams = pickTeams(items) || { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    }).catch(function () {
      state.teams = { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    });
    cab.connectors.onChange(function (items) { var t = pickTeams(items); if (t) { state.teams = t; paint(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }
})();
</script>
</body>
</html>
