id: daily-channel-watch
name: Daily Channel Watch
enabled: true
schedule: 30 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: channel-watcher
agentSlug: channel-watcher
timeout: 600
prompt: |-
  Update the Watch Board with what on the person's YouTube channel needs a look.

  Your working directory is the cabinet root. The board lives in `board/data.json`, and it
  is the only file you write. Never touch `board/data/EXAMPLE-data.json`.

  1. Read your persona before anything else. It holds the calls, the file shape, what goes
     on the board, the exact kind and level words and when an item leaves. This prompt does
     not repeat them. Then, from the cabinet root (never `cd`): note the time now in UTC,
     read `board/data.json` if it is there, and read `CABINET_GOOGLE_ACCESS` from the
     environment (`$CABINET_GOOGLE_ACCESS`, or `$env:CABINET_GOOGLE_ACCESS` in Windows
     PowerShell).
  2. If `board/data.json` does not exist yet, this is the first run: you will create it with
     empty `items` and `known` before adding to it.
  3. If `CABINET_GOOGLE_ACCESS` has no `youtube=`, YouTube is not connected: set `status` to
     "YouTube isn't connected yet", write the file, and stop. If the first call answers 401,
     set `status` to "Google needs a new sign-in", write the file, and stop.
  4. Read the channel once (`channels?mine=true`), the uploads playlist (one page of 50),
     and `videos` for the 10 newest uploads in one call. Work out `usual.viewsPerDay` and
     compare each video with it and with its views in `known`, for `Drop` items.
  5. Read the comments: `commentThreads` with `allThreadsRelatedToChannelId`, `order=time`,
     `maxResults` 100, `textFormat=plainText`. Page on until you reach the `cursor`, or, on
     the first run, comments older than 14 days, at most 10 pages either way.
  6. Sort each new comment: leave it out, add it to an item already on the board, or start a
     new item. A request to do business with the creator (a sponsorship, a collab, a job,
     consulting, a partnership, a bulk order, a press invite) is a `Business` item with its
     `ask`, `from` and `reach`, as your persona says; a "collab" that is really a scam is
     `Spam`. Look again at the `Waiting` items: drop the ones the channel answered, and add
     questions that have now waited more than 3 days. Drop items that are settled or had
     nothing new for 14 days. Then update counts, dates and levels.
  7. Set `cursor` to the `publishedAt` of the newest comment you read (keep the old one if
     there was nothing new), `generated` to now, `known` to today's views, `status` to "ok",
     and write the whole file back as valid JSON (check it parses).
  8. This run is read only, and so is every scheduled run of this cabinet. Do not reply,
     like, pin, edit, hide or remove anything on YouTube, however obvious it looks, and do
     not answer a business ask or write to anyone. Use list calls only: never call
     `search`.
  9. If a call answers `quotaExceeded`, stop calling YouTube, write the board from what you
     have, and set `status` to "YouTube's daily limit was reached: some comments may be
     missing". If YouTube can't be reached at all, set `status` to a short phrase naming the
     problem, keep everything else in the file as it was, and stop.

  Finish in one or two plain sentences about the channel and nothing else: how many things
  need a look, the most urgent one, if there is one, and how many business asks came in.
