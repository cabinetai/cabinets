id: daily-channel-watch
name: Daily Channel Watch
enabled: true
schedule: 30 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: channel-watcher
agentSlug: channel-watcher
timeout: 600
prompt: |-
  Update the Watch Board with what on the person's YouTube channel needs a look.

  Your working directory is the cabinet root: work from there and never `cd`. The board
  lives in `board/data.json`, and it is the only file you write (on the first check,
  `board/first-read.mjs` also writes the reading for you). Never touch
  `board/data/EXAMPLE-data.json`.

  1. Read your persona before anything else. Its "The daily check" holds the steps, the
     calls, the file shape, what goes on the board and the exact `status` words. This
     prompt does not repeat them.
  2. This run is read only. Do not reply, like, pin, edit, hide or remove anything on
     YouTube, do not answer a business ask or write to anyone, and never call `search`.
  3. If YouTube is not connected or a call fails, set `status` in your persona's words for
     that case, write the file as it says, and stop calling YouTube.
  4. If `board/data.json` is not there yet, this is the first check and the person is
     likely watching. Tell it as you go with `node board/first-read.mjs`: `start` after
     reading your files, one `push '<line>'` per finding, `gift` once early, `offer` once
     or twice, and `done` last, even when the run fails.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-14T00:00:00.000Z'
