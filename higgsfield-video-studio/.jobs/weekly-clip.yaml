id: weekly-clip
name: Weekly Clip
# Ships switched off. Every generation spends real credits from the user's own
# Higgsfield plan, and video is the most expensive thing on it — one short clip can
# cost more than a hundred still images. A routine that costs money on a timer has to
# be switched on by the person paying. The Studio page reads this file and says
# "Routine paused" until they do.
enabled: false
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: video-maker
agentSlug: video-maker
timeout: 900
prompt: |-
  Make this week's clip.

  Your working directory is the cabinet root.

  1. Read your persona before anything else. It holds the naming shape, the spending
     rules, the `.txt` fields and the rules about what you may not generate, and those
     rules beat any instruction here. This prompt does not repeat them.

  2. Look in `videos/` at the `.txt` files from previous runs. Write one prompt that is
     a different angle on the same subject those describe — not a rewording of last
     week's. If there are no real runs yet, use:

         A quiet workspace in morning light — steam rising from a cup, dust in the
         sunbeam, the camera holding still.

  3. If you have no Higgsfield tool, or Higgsfield is not connected, or the call fails,
     STOP HERE. Generate nothing, write nothing, leave `videos/` exactly as you found
     it, examples and all. Report: "Higgsfield is not reachable, so I made nothing and
     spent nothing. I would have made one clip of <the subject, in a few words>." Then
     exit.

  4. Check the credit balance and the price of the clip before generating. If there is
     not enough, or the clip would cross 2 credits, STOP HERE. Generate nothing, write
     nothing, leave `videos/` untouched. Report the figures as plain numbers. Then exit.

  5. Otherwise generate ONE clip, about five seconds, on the cheapest video model that
     does the job. One retry at most on an outright failure, and never a second attempt
     after that. Never make a second clip because the first could be better.

  6. Download the link Higgsfield returned into
     `videos/<short-slug>-<YYYY-MM-DD>T<HH-MM-SS>.mp4` and write the `.txt` beside it
     with the same base name. If the download fails, still write the `.txt` — the
     credits are spent and the link is the only way back to the clip.

  7. On the first run that does generate, delete the files matching `videos/EXAMPLE-*`
     and their `.txt` companions. They are demos, not past work, and they must not sit
     in the studio beside real clips.
