id: monthly-hours
name: Hours for invoices
enabled: true
cloudOnly: true
schedule: 0 8 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: time-keeper
agentSlug: time-keeper
timeout: 900
prompt: |-
  Make last month's hours list for the freelancer's invoices.

  Your working directory is the cabinet root. Your persona's "Monthly hours" holds what
  counts and the shape of the page; its "Who counts as people you meet" says which
  meetings are with clients.

  1. Find today's date and the calendar's time zone, and read
     `calendar-brief/data/latest.json` if it is there (its `rules` say who is a client).
  2. Read last month from the calendar once, the way the "Connections this cabinet uses"
     section says. If you cannot, write nothing and say why in one sentence.
  3. Write `reports/<YYYY-MM>-hours.md`.

  Only read the calendar: never create, move, cancel or answer an event.

  Finish in one plain sentence and nothing else: the total hours, and the client with the
  most.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
