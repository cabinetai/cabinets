id: morning-calendar-brief
name: Morning Calendar Brief
enabled: true
cloudOnly: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: time-keeper
agentSlug: time-keeper
timeout: 900
prompt: |-
  Update the Your week page and the people pages from the person's Google Calendar.

  On the first read (no `calendar-brief/data/profile.json` yet), first follow "The first
  read" in your persona: it also writes, only through `node calendar-brief/first-sort.mjs` (start, push, profile, done),
  `calendar-brief/data/reading.json`, line by line
  as you work, and `calendar-brief/data/profile.json`, every number computed from the
  saved events file, never typed by hand.

  You write only `calendar-brief/data/latest.json` (the page draws it; it also keeps what
  you need for tomorrow) and the people pages: `people/`, or `clients/` in a cabinet set up
  before `people/` existed (your persona says which). Never touch any other file, except on the first read: `reading.json` and `profile.json`
  through the helper, and scratch files in `calendar-brief/data/.work/`. Your
  persona says who counts as people you meet, the kinds, and the shape of the pages. Work in as few steps as you can (on the first read, one line per call wins): a short
  node script (Python may not be installed) for reading, merging and the numbers is best.

  1. Find today's date, the time now and the calendar's time zone. Read
     `calendar-brief/data/latest.json` if it exists. If it has `readThrough` and `rules`,
     read the calendar from `readThrough` to midnight 30 days ahead. Otherwise, or if
     `readThrough` is more than 90 days ago, read from midnight 90 days ago.
  2. Read the primary calendar the way the "Connections this cabinet uses" section says:
     - "connected through Sign in with Google": use `gws`, Google's own Workspace command
       line tool. It is on your PATH and signs itself in with this run's token; never
       print, copy or write the token, and never run `gws auth`. Save its answer to a file
       in `calendar-brief/data/.work/` (never `/tmp`: on Windows the shell's and the
       script's /tmp differ) and work from the file:

       gws calendar events list --params '{"calendarId":"primary","timeMin":"<from, with offset>","timeMax":"<to, with offset>","singleEvents":true,"orderBy":"startTime","maxResults":2500,"fields":"items(id,status,summary,start,end,location,htmlLink,eventType,transparency,attendees(email,displayName,responseStatus,resource,self)),nextPageToken,timeZone"}'

       Add `--page-all` if the answer has a `nextPageToken`. Guests with `resource: true`
       are rooms: skip them. Never use `gws calendar +agenda` here: it gives no guests.
     - "connected by its secret address": read the same days through the Google Calendar
       skill, at most 62 days per ask. Its events carry `guests` (`name`, `email`,
       `response`); the person's own address is the calendar's `label`.
     Leave out cancelled events and events the person declined.
  3. This run only reads. Never create, move, shorten, cancel or answer an event.
  4. If you could not read the calendar, write no page. In `calendar-brief/data/latest.json`
     set only `status` to one plain sentence and `checkedAt` to now, keeping everything else
     (if the file does not exist, write {"generatedAt": null, "checkedAt": "<now>",
     "status": "<sentence>", "events": [], "clients": []}), then stop:
     - not connected (no Connections line says it is, or gws exits with code 2,
       `error[auth]`): "Google Calendar isn't connected yet."
     - gws exits with code 1 and its answer has `401` or `UNAUTHENTICATED`: "Google
       Calendar needs you to sign in again." Also add
       `NEEDS_CONNECTION: google-calendar | Google needs a new sign-in` in your cabinet block.
     - `403`, `insufficientPermissions` or `ACCESS_TOKEN_SCOPE_INSUFFICIENT`: "Cabinet isn't
       allowed to read your calendar."
     - `429` or a code of 500 or more: try once more after a few seconds; then, or on
       anything else: "Couldn't reach Google Calendar this morning."
  5. Update the people you meet (the `clients` list). `rules` in the file is what you
     decided before: `ownDomains` (the person's own circle), `notClients` (domains or names
     that are not people to keep in touch with: services, family, close friends) and
     `names` (a domain to its company name). Apply it as it is; only
     decide guests it does not cover yet, and add those decisions to it.
     - Each row keeps `met`: its meetings with others that have ended in the last 90 days,
       as [date, minutes, event id]. Add the ended meetings you just read (skip an id that
       is already there), then drop entries older than 90 days.
     - From `met`: `meetings90` is the count, `lastMet` the latest date, `hoursMonth` the
       hours since the 1st of this month (to the nearest half hour). `firstMet` is the
       earliest meeting that has ended, from before or from `met` (keep an older one); null
       while there is only a booking. `next` is the first meeting with them from now on,
       from what you just read, as {"date", "start", "title"}, or null.
     - `status`: `quiet` when there is no meeting in the last 45 days and none booked;
       `new` when the first meeting, or the first booking, is this month; else `active`.
     Keep every row from before, even one with nothing new. Sort new first, then active
     by next meeting, then quiet by last met. At most 60.
  The script that writes latest.json takes `today`, the offset and `timeZone` from `date` and
  the events file, and `kind` and `client` from the guests' addresses; a `headline` or `note`
  says only what that script counted.
  6. Replace `calendar-brief/data/latest.json` with this shape (every date and time in
     the calendar's own time zone, times as 24-hour HH:MM):

     {"generatedAt": "<now, with offset>", "checkedAt": "<now>", "status": "ok",
      "timeZone": "America/New_York", "today": "2026-09-25", "readThrough": "<yesterday>",
      "canChange": false, "business": null,
      "headline": "14 events this week, and Thursday afternoon is free.",
      "note": "You haven't met Kessler & Sons since July.",
      "events": [{"id": "...", "date": "2026-09-25", "start": "09:30", "end": "10:30",
        "allDay": false, "title": "Office AC replacement quote", "place": "2200 Main St",
        "people": ["Greg Novak"], "morePeople": 0, "kind": "client",
        "client": "summit-insurance", "link": "<the event's htmlLink, or null>"}],
      "clients": [{"id": "summit-insurance", "name": "Summit Insurance Group",
        "contact": "Greg Novak", "meetings90": 1, "firstMet": "2026-09-15",
        "lastMet": "2026-09-15", "next": {"date": "2026-09-25", "start": "09:30",
        "title": "Office AC replacement quote"}, "hoursMonth": 1, "status": "new",
        "met": [["2026-09-15", 60, "..."]]}],
      "rules": {"ownDomains": ["prairieair.com"], "notClients": ["midwestsupply.com"],
        "names": {"summitins.com": "Summit Insurance Group"}}}

     - `canChange`: true only when your Connections line for Google Calendar says "may read
       and change events"; false when it says read only, as the secret address always does.
     - `business`: the person's business name only when the calendar plainly is a
       business's, else null.
     - `headline`: the week in plain words, at most 80 characters. `note`: the one thing
       worth knowing, like someone they used to meet going quiet, or two events that
       overlap; leave it out when nothing stands out.
     - `events`: every event of the seven days from today, with its `kind`; a meeting
       with others has its row's `id` in `client`. An all-day event has `allDay: true`, `start`
       and `end` null, and `lastDate`
       when it covers more than one day. A timed event that ends on a later day (a night
       flight, a conference over several days) has `endDate`, the day it ends, and
       `end` is the time on that day. Copy `eventType` when it is not `default` (such as
       `outOfOffice`) and `transparency` when it is `transparent` (shown as free), as the
       calendar gives them: the page counts free time from them. Keep an event that began
       before today and still runs into today. At most 80.
  7. People pages, in the shapes your persona gives, in `people/` (or `clients/`, as above):
     create `<id>.md` for someone new; on an existing page rewrite only the frontmatter and
     the summary line, and only when their numbers changed; rewrite `index.md` there. Never delete or
     rename a page, and never change anything from `## Notes` down.
