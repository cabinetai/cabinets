<!DOCTYPE html>
<!--
  Calendar for Freelancers: your hours. The cabinet opens on this page.

  For a freelancer: the hours spent with each client this week and this month, ready for
  invoices, the client meetings of today with help before and after, free time for new
  work, and the week. Personal events keep their titles here, which only the person sees. The page is a grid of boxes each person arranges for themselves
  (Edit layout): add, remove, move and resize, kept per person in cabinet.mine.

  Where the words come from: the morning routine reads Google Calendar and writes
  data/latest.json next to this page (the shape is data/EXAMPLE-latest.json, a made-up
  week, always labelled as an example here). The page works the week out itself: now and
  next, free time, overlaps, hours.

  How it talks to Cabinet: window.cabinet v2 (connection state, connect, ask, run the
  routine, read files, the person's own store). In an older Cabinet it reads the same files
  over the page's own address. It never changes the calendar: changes go through the chat,
  where the agent asks first.

  One file on purpose: a sealed frame cannot load files next to it. Space Grotesk for titles
  and figures, Plus Jakarta Sans for text, from Google Fonts with system fallbacks; icons are inline SVG. The grid, editing, moving and
  motion are the same as the Gmail Inbox front desk's.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* A viewer may not ask or run: the buttons only an editor can use are not shown at all. */
  html[data-role="viewer"] [data-viewer-off] { display: none !important; }
  /* "The timesheet": the headline is a sheet of graph paper with the week's client hours
     drawn as a bar for each day, today's in coral. Under it plain white sheets on warm
     paper. Charcoal and coral are the page's own; red only for what is late or failed. */
  :root {
    --serif: "Space Grotesk", "Segoe UI Variable Display", system-ui, sans-serif;
    --display: var(--serif);
    --canvas: #f7ebe5;
    --page: #ffffff;
    --panel: #f7f4ef;
    --panel-2: #efebe4;
    --line: #ebe6dd;
    --line-2: #d9d2c6;
    --ink: #1f1d22;
    --ink-2: #45424b;
    --ink-3: #6b6771;
    --charcoal: #26242b;
    --coral: #e05a3a;
    --coral-ink: #b8401f;
    --grid: rgba(31, 29, 34, .055);

    --terra: #d95d39;
    --terra-ink: #a73918;
    --terra-deep: #862201;
    --terra-tint: #fdf2ee;
    --terra-line: #f4d6ca;
    --slate: #505b6e;
    --slate-ink: #394456;
    --slate-tint: #edf0f5;
    --sage: #3a6351;
    --sage-ink: #224b3a;
    --sage-deep: #2f5444;
    --sage-tint: #ebf3ee;
    --sage-line: #cfe2d6;
    --sand: #a07a3c;
    --sand-ink: #7a5a22;
    --sand-tint: #f6efe2;

    --shadow-1: 0 1px 2px rgba(27, 37, 40, .05), 0 6px 18px -12px rgba(27, 37, 40, .18);
    --shadow-2: 0 2px 4px rgba(27, 37, 40, .05), 0 16px 34px -18px rgba(27, 37, 40, .28);
    --radius: 20px;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  ::selection { background: color-mix(in srgb, var(--coral) 24%, transparent); }
  html { scrollbar-color: var(--line-2) transparent; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--slate-ink); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--sage) 50%, transparent); outline-offset: 2px; border-radius: 10px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .bar { border-bottom: 1px solid var(--line); background: var(--canvas); }
  .bar-in { max-width: 1280px; margin: 0 auto; padding: 16px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .mark .icon { width: 22px; height: 22px; stroke-width: 1.9; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--ink-3); font-size: 14px; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .status .btn { min-height: 40px; padding: 8px 15px; font-size: 14px; }
  .pill .when { font-weight: 500; opacity: .85; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px; border-radius: 999px; background: var(--panel); font-weight: 600; font-size: 14px; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
  .pill.ok { background: var(--sage-tint); color: var(--sage-ink); }
  .pill.ok .dot { background: var(--sage); }
  .pill.warn { background: var(--sand-tint); color: var(--sand-ink); }
  .pill.warn .dot { background: var(--sand); }
  .pill.off { background: var(--terra-tint); color: var(--terra-ink); }
  .pill.off .dot { background: var(--terra); }
  .updated { color: var(--ink-3); font-size: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
    border-radius: 999px; border: 1px solid var(--line-2); background: var(--page); color: var(--ink);
    font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
    box-shadow: var(--shadow-1); transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover { background: var(--panel); border-color: #c9c5bb; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { cursor: default; opacity: .6; transform: none; }
  .btn.primary { background: var(--sage); border-color: var(--sage); color: #fff; box-shadow: 0 8px 18px -10px rgba(34, 75, 58, .7); }
  .btn.primary:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.dark:hover { background: #2d3442; }
  .btn.big { min-height: 52px; padding: 13px 26px; font-size: 17px; }
  .btn.quiet { border-color: transparent; box-shadow: none; background: transparent; color: var(--slate-ink); padding-inline: 10px; }
  .btn.quiet:hover { background: var(--slate-tint); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 28px 40px; }
  .main { display: flex; flex-direction: column; gap: 26px; }

  /* ── Hero: the one answer and the numbers ────────────────────────────── */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .hero h2 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -.03em; }
  .hero .lead { margin: 10px 0 0; font-size: 18px; color: var(--ink-2); max-width: 70ch; }
  .hero .lead b { color: var(--ink); font-weight: 700; }
  .hero .fine { margin: 8px 0 0; font-size: 15px; color: var(--ink-3); }
  .hero .actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label value" "sub value"; align-items: center; gap: 4px 12px; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--page); text-decoration: none; color: inherit; min-height: 44px;
  }
  .kpi { transition: transform .15s ease, box-shadow .15s ease; }
  .kpi:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .kpi .label { grid-area: label; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .kpi .label .icon { width: 18px; height: 18px; color: var(--ink-3); }
  .kpi .value { grid-area: value; font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; text-align: end; }
  .kpi .sub { grid-area: sub; font-size: 14px; color: var(--ink-3); }
  .kpi.first { background: var(--terra-tint); border-color: var(--terra-line); }
  .kpi.first .value { color: var(--terra-ink); }
  .kpi.calm { background: var(--sage-tint); border-color: var(--sage-line); }
  .kpi.calm .value, .kpi.calm .sub { color: var(--sage-ink); }
  .kpi .value.none, .kpi.money .value.none { color: var(--ink-3); }
  .kpi .sub .hot { color: var(--terra-ink); font-weight: 700; }

  /* The panel under a connection problem or before the first sort. */
  .card-hero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center;
    padding: 26px 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--page);
    box-shadow: var(--shadow-2);
  }
  .art { width: 132px; height: 104px; }
  .card-hero h2 { font-size: clamp(24px, 2.8vw, 32px); }
  .steps { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 15px; }
  .steps li { display: flex; align-items: center; gap: 8px; }
  .steps .icon { color: var(--sage); width: 18px; height: 18px; }

  .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--terra-tint); color: var(--ink); border: 1px solid var(--terra-line); }
  .notice .icon { color: var(--terra-ink); margin-top: 2px; }
  .notice p { margin: 0; }
  .notice .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }

  #ribbon:empty { display: none; }
  .ribbon { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-radius: 12px; background: var(--sand-tint); border: 1px solid #eadfca; }
  .ribbon p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .tag-example { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

  /* ── Boxes with a list ───────────────────────────────────────────────── */
  /* Plain white sheets: no border, a soft shadow, and a list inside. */
  .lane { border: 0; border-radius: var(--radius); background: var(--page); overflow: hidden; box-shadow: var(--shadow-1); }
  /* A box title: a plain outline icon and a bold word, nothing around them. */
  .lane-head { display: flex; align-items: center; gap: 11px; margin: 0 20px 2px; padding: 18px 0 10px; }
  .lane-head .lane-icon { display: inline-grid; place-items: center; color: var(--coral); }
  .lane-head .lane-icon .icon { width: 22px; height: 22px; stroke-width: 1.8; }
  .lane-head h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); flex: 1; }
  .lane-head .count { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-3); }
  .lane-head .total { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-2); }
  .lane.waiting .count:not(.zero) { color: var(--terra-ink); }
  /* Nobody waiting is done, not pending: the accent turns sage. */

  /* Your next 3 things: a numbered list to tick off. Terracotta while something waits,
     sage once all is done. */
  .things > li.thing { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .things > li.thing:last-child { border-bottom: 0; }
  .thing .tick { width: 28px; height: 28px; flex: none; display: grid; place-items: center; padding: 0; border: 2px solid var(--line-2); border-radius: 50%; background: var(--page); color: transparent; transition: border-color .15s ease, color .15s ease, background .15s ease; }
  .thing .tick .icon { width: 15px; height: 15px; stroke-width: 2.8; }
  .thing .tick:hover { border-color: var(--sage); color: var(--sage); }
  .thing .tick.ticked { background: var(--sage); border-color: var(--sage); color: #fff; }
  .thing .n { min-width: 14px; font-size: 14px; font-weight: 800; color: var(--ink-3); }
  .thing .what { min-width: 0; }
  .thing .what b { display: block; font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; }
  .thing .what span { display: block; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .thing .btn { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .box[data-level="M"] .thing { grid-template-columns: auto minmax(0, 1fr); }
  .box[data-level="M"] .thing .n { display: none; }
  .box[data-level="M"] .thing .btn { grid-column: 2; justify-self: start; margin-top: 4px; }
  .next-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 4px 8px 4px 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13.5px; }
  .next-foot .btn { min-height: 32px; padding: 4px 10px; font-size: 13.5px; }
  .all-done { display: flex; align-items: center; gap: 10px; color: var(--sage-ink); font-weight: 600; }
  .all-done .icon { color: var(--sage); }

  /* This week: a list by day, or a strip of seven days when there is room. */
  .agenda > li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .agenda > li:last-child { border-bottom: 0; }
  .agenda .day { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .agenda .t { min-width: 0; overflow-wrap: anywhere; }
  .agenda .t small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .agenda .amt { font-weight: 700; }
  .agenda .in .amt { color: var(--sage-ink); }
  .agenda .person .t small { color: var(--terra-ink); }
  .strip { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .strip .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 8px; border-inline-end: 1px solid var(--line); }
  .strip .col:last-child { border-inline-end: 0; }
  .strip .col.today { background: #f6f9f7; }
  .strip .dname { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .strip .dnum { margin-top: -4px; font-size: 20px; font-weight: 800; }
  .strip .col.today .dnum, .strip .col.today .dname { color: var(--sage); }
  .ev { display: block; padding: 6px 8px; border-radius: 10px; background: var(--slate-tint); color: var(--slate-ink); font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .ev b { display: block; font-weight: 700; }
  .ev.in { background: var(--sage-tint); color: var(--sage-ink); }
  .ev.person { background: var(--terra-tint); color: var(--terra-ink); }
  .ev.auto { background: var(--panel); color: var(--ink-3); }
  .ev-more { font-size: 12px; color: var(--ink-3); padding-inline-start: 4px; }
  .lane.waiting .count.zero { color: var(--ink-3); }
  .lane-empty { padding: 18px; color: var(--ink-3); margin: 0; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  /* A row is a line in a note: the name in bold, then plain words. No faces, no badges. */
  .row-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: start; width: 100%; text-align: start; padding: 13px 20px; border: 0; background: transparent; }
  .row-main:hover { background: var(--panel); }
  .row.open .row-main { background: var(--panel); }
  .avatar { display: none; }
  .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .who b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .who .co { color: var(--ink-3); font-size: 14px; }
  .when { font-size: 14px; color: var(--ink-3); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; grid-row: span 2; }
  .drafted { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--sage-ink); }
  .drafted .icon { width: 14px; height: 14px; }
  .gist { grid-column: 1; color: var(--ink-2); font-size: 15.5px; overflow-wrap: anywhere; }
  /* Labels are words, not pills: grey for what kind of mail it is, red only when it is late. */
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 0; border-radius: 0; font-size: 13px; font-weight: 600; background: none; color: var(--ink-3); white-space: nowrap; }
  .chip .icon { width: 13px; height: 13px; stroke-width: 2.2; }
  .chip.hot, .chip.wait, .chip.soon { color: var(--terra-ink); }
  .chip.hot { font-weight: 700; }
  .chip.ok { color: var(--sage-ink); }

  .row-body { padding: 0 20px 18px; background: var(--panel); }
  .row-body .short { margin: 0; color: var(--ink); font-size: 16px; line-height: 1.55; }
  .row-body .subject { margin: 0 0 8px; font-size: 14px; color: var(--ink-3); }
  .draft { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--page); border: 1px solid var(--line); }
  .draft h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .draft p { margin: 0; white-space: pre-line; font-size: 16px; }
  .draft mark { background: var(--sand-tint); box-shadow: inset 0 -2px 0 var(--sand); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .draft .hint { margin-top: 10px; font-size: 14px; color: var(--ink-3); white-space: normal; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .reply-btn { grid-column: 3; grid-row: 2; justify-self: end; }

  .cards { list-style: none; margin: 0; padding: 0 6px 6px; display: grid; gap: 0; }
  .money-card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
  .money-card:last-child { border-bottom: 0; }
  .money-card .mc-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; text-align: start; padding: 14px 14px 12px; border: 0; background: transparent; border-radius: 12px; }
  .money-card .mc-main:hover { background: var(--panel); }
  .mc-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .mc-what { color: var(--ink-3); font-size: 14px; grid-column: 1; overflow-wrap: anywhere; }
  .mc-amount { font-family: var(--serif); font-size: 21px; font-weight: 600; grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: end; }
  .mc-foot { grid-column: 1 / -1; margin-top: 6px; }
  .money-card.overdue .mc-amount { color: var(--terra-ink); }
  .money-card.paid .mc-amount { color: var(--sage-ink); }
  .mc-body { padding: 0 14px 14px; }
  .mc-body p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .mc-body .row-actions { margin-top: 12px; }

  .mini { list-style: none; margin: 0; padding: 6px 18px 14px; }
  .mini li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .mini li:last-child { border-bottom: 0; }
  .mini b { font-weight: 700; white-space: nowrap; }
  .mini span { color: var(--ink-2); }

  /* ── Ideas ───────────────────────────────────────────────────────────── */
  .idea { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--page); box-shadow: var(--shadow-1); }
  .idea:hover { box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .idea .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
  .idea h3 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .idea p { margin: 0; color: var(--ink-2); font-size: 15px; flex: 1; }
  .idea .go { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin-top: 4px; }
  .idea .go .btn { min-height: 44px; padding: 8px 12px; font-size: 14px; }
  /* Idea icons are plain outline drawings, never a coloured tile. */
  .ic, .idea .ic, .idea-rows .ic, .one-idea .ic { background: none !important; color: var(--ink-2); width: auto; height: auto; border-radius: 0; }
  .ic .icon { width: 22px; height: 22px; stroke-width: 1.8; }

  /* ── Ask ─────────────────────────────────────────────────────────────── */
  /* Ask: the charcoal box, the one dark sheet on the page. */
  .ask { padding: 22px; border-radius: var(--radius); background: var(--charcoal); color: #fff; }
  .ask h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
  .ask > p { margin: 0 0 14px; color: rgba(255, 255, 255, .8); font-size: 15px; }
  .ask form { display: flex; gap: 10px; }
  .ask input { flex: 1; min-width: 0; min-height: 50px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .09); color: #fff; padding: 10px 18px; font-size: 16px; }
  .ask input::placeholder { color: rgba(255, 255, 255, .62); }
  .ask input:focus { outline: none; border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .22); }
  .ask .btn.primary { min-height: 50px; background: #fff; border-color: #fff; color: var(--charcoal); box-shadow: none; }
  .ask .btn.primary:hover { background: #eef4f0; border-color: #eef4f0; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .q { min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .06); color: #fff; font-size: 14.5px; font-weight: 600; text-align: start; }
  .q:hover { background: rgba(255, 255, 255, .14); }
  .ask .note { margin: 12px 0 0; font-size: 14px; color: rgba(255, 255, 255, .75); min-height: 1.5em; }
  .ask.waiting .q, .ask.waiting input, .ask.waiting .btn { opacity: .5; cursor: default; }
  .ask.waiting .note { color: #fff; font-weight: 600; }

  .foot { display: flex; gap: 10px; align-items: flex-start; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 14px; }
  .foot .icon { color: var(--sage); }
  .foot p { margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-2); transition: opacity .2s ease, transform .2s ease; z-index: 50; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* "backwards": hidden until its turn, then it lets go, so it never holds a box still when dragged. */
  .rise { animation: rise .4s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  /* Loading: grey shapes where the banner and the boxes will be, with a soft shimmer. */
  .skel { display: grid; gap: 16px; }
  .skel-banner { display: grid; align-content: center; gap: 16px; min-height: 230px; padding: 28px clamp(20px, 3vw, 36px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .skel-box { display: grid; align-content: start; gap: 14px; min-height: 200px; padding: 24px; background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-line { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, var(--panel-2) 50%, var(--line) 75%); background-size: 200% 100%; animation: skel-shine 1.4s ease-in-out infinite; }
  .skel-line.big { height: 32px; border-radius: 9px; }
  .skel-line.head { height: 18px; }
  .w25 { width: 25%; } .w35 { width: 35%; } .w45 { width: 45%; } .w55 { width: 55%; } .w70 { width: 70%; } .w85 { width: 85%; }
  @keyframes skel-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel-line { animation: none; } }
  /* Until the page is ready, nothing but the shapes: no bar, no note. */
  html:not(.ready) #topbar, html:not(.ready) .foot { display: none !important; }
  .skeleton { color: var(--ink-3); font-size: 17px; margin: 0; }

  /* ── The grid of boxes ───────────────────────────────────────────────── */
  /* Each box sits on a 12 column grid at the place its layout gives it, and draws itself
     small, medium or large by its own width (data-level). A list shows the rows that fit,
     then "+N more". */
  .grid { --row: 64px; --gap: 16px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); }
  .box { display: flex; flex-direction: column; min-width: 0; min-height: 0; transition: box-shadow .2s ease; }
  .box > .box-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .box-more { display: flex; justify-content: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: var(--page); color: var(--slate-ink); font-weight: 700; font-size: 14px; }
  .box-more:hover { background: var(--slate-tint); }
  .box .cards { padding: 8px; gap: 6px; }
  .box[data-level="M"] .money-card .mc-main { padding: 9px 12px; }
  .box[data-level="M"] .mc-foot { margin-top: 4px; }
  .box[data-level="M"] .mc-amount { font-size: 18px; }
  .box[data-level="M"] .mc-what { display: none; }

  /* Small: one number and one line under it. */
  .sum { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; }
  .sum .value { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .sum .value.none { color: var(--ink-3); }
  .sum .sub { color: var(--ink-3); font-size: 14px; }
  .sum .sub .hot { color: var(--terra-ink); font-weight: 700; }
  .sum .line { margin-top: 6px; color: var(--ink-2); font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ── The timesheet: the headline box is graph paper with the week's hours ── */
  .box.headline {
    position: relative; isolation: isolate; overflow: hidden; justify-content: flex-start;
    padding: 20px clamp(20px, 2.6vw, 36px) 20px; border-radius: 26px; color: var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(178deg, #fcfaf6 0%, #f4eee4 100%);
  }
  .hl-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .hl-name { display: inline-flex; align-items: center; gap: 9px; margin: 0; font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .hl-name .icon { width: 18px; height: 18px; color: var(--coral); }
  .hello { margin: 16px 0 4px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .hello b { font-weight: 700; color: var(--coral-ink); }
  .box.headline h2 { margin: 0; font-family: var(--display); font-size: clamp(36px, 4vw, 54px); line-height: 1; font-weight: 700; letter-spacing: -.035em; color: var(--ink); }
  .box.headline .lead { margin: 10px 0 0; font-size: 16.5px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .box.headline .lead b { color: var(--ink); font-weight: 700; }
  .box.headline .meta { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 14px; color: var(--ink-3); }
  .box.headline .meta .icon { width: 16px; height: 16px; }
  .box.headline .fine { margin: 6px 0 0; font-size: 15px; color: var(--ink-3); }
  /* The words keep clear of the hours; the status row runs the full width above them. */
  .box.headline .hello, .box.headline h2, .box.headline .lead, .box.headline .meta, .box.headline .fine { max-width: calc(100% - 420px); }
  .box.headline[data-level="S"] h2 { font-size: 28px; max-width: none; }
  .box.headline[data-level="S"] .hello, .box.headline[data-level="S"] .sheet { display: none; }
  .hello .calm { display: inline-flex; align-items: center; gap: 5px; margin-inline-start: 10px; font-weight: 700; color: var(--sage-ink); }
  .hello .calm .cheer { width: 15px; height: 15px; margin: 0; vertical-align: 0; stroke: currentColor; stroke-width: 4; }
  /* The week's client hours: one bar a day on the graph paper, today's in coral. */
  .box.headline > .sheet { position: absolute; right: clamp(22px, 3vw, 44px); top: 76px; bottom: 18px; width: 380px; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; display: grid; grid-template-rows: auto 1fr; }
  .sheet-total { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; margin: 0 0 6px; font-family: var(--display); color: var(--ink-3); font-size: 13.5px; font-weight: 600; }
  .sheet-total b { font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: stretch; min-height: 0; margin: 0; padding: 0; list-style: none; }
  .bars li { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-height: 0; font-family: var(--display); }
  .bars .stack { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .bars .h { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bars .col { flex: none; width: 100%; max-width: 34px; min-height: 3px; border-radius: 7px 7px 3px 3px; background: var(--charcoal); opacity: .82; }
  .bars .col.zero { background: var(--line-2); opacity: 1; }
  .bars .d { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .bars li.today .col:not(.zero) { background: var(--coral); opacity: 1; }
  .bars li.today .d { color: var(--coral-ink); }
  @media (max-width: 960px) { .sheet { display: none; } .box.headline .hello, .box.headline h2, .box.headline .lead, .box.headline .meta, .box.headline .fine { max-width: none; } .box.headline p.lead { -webkit-line-clamp: 5; } }
  .hl-status { flex: none; justify-content: flex-end; gap: 6px 14px; }
  .box.headline .hl-status .pill { min-height: 0; padding: 0; gap: 7px; background: none; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
  .box.headline .pill .dot { width: 7px; height: 7px; }
  .box.headline .pill .when { font-weight: 500; color: inherit; opacity: .85; margin-inline-start: 4px; }
  .box.headline .hl-status .btn[data-act="run"] { min-height: 32px; padding: 4px 8px; border: 0; background: none; box-shadow: none; color: var(--ink-2); font-size: 13.5px; }
  .box.headline .hl-status .btn[data-act="run"] .icon { width: 16px; height: 16px; }
  .box.headline .btn[data-act="ideas"], .box.headline .btn[data-act="edit-start"], .box.headline .btn[data-act="layout-menu"] { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .box.headline .btn:not(.primary) { background: #fff; border-color: var(--line-2); color: var(--ink); box-shadow: 0 1px 2px rgba(31, 29, 34, .06); }

  /* Add to your calendar: a short form, or the person's own words for the agent. */
  .box.addevent .box-body { display: grid; gap: 12px; align-content: start; padding: 0 20px 18px; overflow: auto; }
  .ae-tabs { display: inline-flex; gap: 4px; justify-self: start; padding: 3px; border: 1px solid var(--line-2); border-radius: 999px; }
  .ae-tabs button { min-height: 36px; padding: 6px 14px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ae-tabs button:hover { color: var(--ink); }
  .ae-tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .ae-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; align-items: end; }
  .box.addevent[data-level="M"] .ae-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .box.addevent[data-level="M"] .ae-what, .box.addevent[data-level="M"] .ae-day, .box.addevent[data-level="M"] .ae-where { grid-column: 1 / -1; }
  .box.addevent[data-level="S"] .ae-form { grid-template-columns: minmax(0, 1fr); }
  .ae-form label { display: grid; gap: 4px; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .ae-form input, .ae-form textarea { width: 100%; min-width: 0; min-height: 44px; box-sizing: border-box; border: 1px solid var(--line-2); border-radius: 12px; background: var(--page); color: var(--ink); padding: 9px 12px; font: inherit; font-size: 15px; font-weight: 400; }
  .ae-form textarea { grid-column: 1 / -1; min-height: 84px; resize: vertical; line-height: 1.45; }
  .ae-form input:focus, .ae-form textarea:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(24, 33, 47, .12); }
  .ae-form .ae-where { grid-column: span 2; }
  .ae-form label small { font-weight: 400; }
  .box.addevent[data-level="S"] .ae-where { grid-column: auto; }
  .ae-form .ae-allday { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
  .ae-form .ae-allday input { width: 18px; height: 18px; min-height: 0; margin: 0; accent-color: var(--ink); }
  .ae-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .ae-foot .note { margin: 0; font-size: 14px; color: var(--ink-3); }
  .ae-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0; font-size: 14px; color: var(--ink-2); }
  .ae-lock .icon { width: 16px; height: 16px; color: var(--ink-3); }
  /* Ask: the dark box. Small keeps only the field. */
  .box.ask { padding: 20px 22px; overflow: hidden; justify-content: center; }
  .box.ask h2 { font-size: 23px; }
  .box.ask .qs { margin-top: 10px; }
  .box.ask .note { margin-top: 8px; }
  .box.ask[data-level="S"] form { flex-direction: column; }

  /* An idea at the foot of a box, picked from today's mail. */
  .nudge { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--page); }
  .nudge > .icon { color: var(--ink-3); margin-top: 1px; }
  .nudge p { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .nudge-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .btn.small .icon { width: 17px; height: 17px; }
  .nudge-hide { margin-inline-start: auto; min-height: 38px; border: 0; background: transparent; color: var(--ink-3); font-size: 13.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px; }
  .nudge-hide:hover { background: var(--panel-2); color: var(--ink); }
  .box.ask .nudge { margin-top: 12px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; background: rgba(0, 0, 0, .14); }
  .box.ask .nudge > .icon { color: #f1d9a6; }
  .box.ask .nudge p { color: #fff; }
  .box.ask .nudge .btn:not(.primary) { background: transparent; border-color: rgba(255, 255, 255, .3); color: #fff; box-shadow: none; }
  .box.ask .nudge .btn:not(.primary):hover { background: rgba(255, 255, 255, .12); }
  .box.ask .nudge-hide { color: rgba(255, 255, 255, .72); }
  .box.ask .nudge-hide:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  .box.ask .qs-label { margin: 10px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }
  .box.ask .qs { margin-top: 6px; }

  /* The boxes you can add. */
  .box.nbox > .kpi { flex: 1; min-height: 0; justify-content: center; }
  .box-pad { padding: 14px 18px; flex: 1; min-height: 0; overflow: hidden; }
  .box-pad > p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .facts div { padding: 8px 12px; border-radius: 10px; background: var(--panel); }
  .facts dt { font-weight: 700; font-size: 14px; }
  .facts dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .facts dd.unset { color: var(--ink-3); font-style: italic; }
  .box[data-level="M"] .facts { grid-template-columns: minmax(0, 1fr); }
  .idea-rows > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .idea-rows > li:last-child { border-bottom: 0; }
  .idea-rows .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  .idea-rows b { display: block; font-size: 15px; }
  .idea-rows span[dir] { display: block; color: var(--ink-3); font-size: 14px; }
  .one-idea { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .one-idea .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .one-idea h3 { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.3; }
  .one-idea p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
  .one-idea .today { padding: 6px 10px; border-radius: 9px; background: var(--sage-tint); border: 1px solid var(--sage-line); color: var(--ink); font-weight: 600; font-size: 14px; }
  .one-idea .go { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

  /* Editing the page. */
  /* A small toolbar on the right while editing: just the four buttons. */
  .editbar { position: sticky; top: 8px; z-index: 20; align-self: flex-end; display: flex; padding: 5px; border-radius: 999px; background: var(--slate-tint); border: 1px solid #d5dbe6; box-shadow: var(--shadow-2); }
  .editbar-actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .editbar .btn { min-height: 36px; padding: 6px 14px; font-size: 13.5px; gap: 6px; box-shadow: none; }
  .editbar .btn .icon { width: 17px; height: 17px; }
  .editbar .btn.quiet { color: var(--ink-2); }

  /* The Layout button's two ways: by hand, or by asking the agent. */
  .menu { position: fixed; z-index: 40; width: min(300px, calc(100vw - 32px)); padding: 6px; display: grid; gap: 2px; background: var(--page); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow-2); }
  .menu button { display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; text-align: start; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--panel); outline: none; }
  .menu .icon { width: 18px; height: 18px; color: var(--ink-2); }
  .menu b { font-size: 14.5px; font-weight: 700; }
  .menu span { grid-column: 2; color: var(--ink-3); font-size: 13.5px; }

  /* The first sort, told as it happens: one line for each thing the agent finds. */
  .reading { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-width: 760px; padding: 26px clamp(20px, 3vw, 36px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .reading h2 { margin: 0; font-family: var(--display); font-size: clamp(28px, 3vw, 38px); font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
  .reading > p { margin: 0 0 10px; color: var(--ink-3); font-size: 15.5px; }
  .read-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .read-lines li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 16.5px; color: var(--ink-2); animation: line-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  .read-lines li b { color: var(--ink); }
  .read-lines li .icon { width: 20px; height: 20px; margin-top: 2px; color: var(--coral); stroke-width: 2.2; }
  .read-lines li.old { animation: none; }
  .read-lines li.now { color: var(--ink-3); }
  .read-lines li.now .pulse-dot { width: 9px; height: 9px; margin: 7px 0 0 5px; border-radius: 50%; background: var(--coral); animation: read-pulse 1.2s ease-in-out infinite; }
  .reading .fine { margin: 10px 0 0; color: var(--ink-3); font-size: 13.5px; }
  @keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes read-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .read-strip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: var(--page); box-shadow: var(--shadow-1); color: var(--ink-2); font-size: 14.5px; }
  .read-strip .pulse-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); animation: read-pulse 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .read-lines li, .pulse-dot, .welcome { animation: none !important; } }
  /* While the first sort reads, the reading is the whole page: no made-up example under it. */
  .first-read #ribbon, .first-read #grid, .first-read #grid-empty, .first-read #topbar, .first-read #gift-keep { display: none !important; }
  /* ...and it fills the page: the reading on the left, the gift on the right, on the canvas. */
  .first-read .wrap { min-height: 100vh; display: flex; flex-direction: column; padding-top: 28px; }
  .first-read .main, .first-read #hero { flex: 1; }
  .read-page { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 20px; }
  .read-page .reading { max-width: none; align-content: start; }
  @media (min-width: 980px) {
    .read-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); align-content: stretch; gap: 24px; min-height: calc(100vh - 72px); }
    .read-page.solo { grid-template-columns: minmax(0, 1fr); }
    .read-page .reading { padding: 40px clamp(28px, 3.4vw, 52px); }
    .read-page .reading h2 { font-size: clamp(34px, 3.4vw, 46px); }
    .read-page .read-lines li { font-size: 17.5px; }
    .read-page .gift { align-content: center; }
  }

  /* The gift: one thing in their week they can act on now, found while the agent reads. */
  .gift { display: grid; align-content: start; gap: 16px; padding: 40px clamp(24px, 3.4vw, 52px) 32px; background: var(--page); border-radius: 26px; box-shadow: var(--shadow-2); }
  .gift.arrive { animation: gift-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes gift-in { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
  .gift .eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--coral-ink); }
  .gift .eyebrow .icon { width: 18px; height: 18px; }
  .gift h3 { margin: 0; max-width: 24ch; font-family: var(--display); font-size: clamp(30px, 3.2vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -.02em; color: var(--ink); }
  .gift h3 b { font-weight: 700; }
  .gift h3 .n { white-space: nowrap; }
  .gift .about { margin: 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); display: grid; gap: 4px; max-width: 62ch; }
  .gift .about b { font-size: 15.5px; color: var(--ink); }
  .gift .about span { font-size: 16.5px; color: var(--ink-2); }
  .gift .why { margin: 0; max-width: 56ch; font-size: 17px; color: var(--ink-2); }
  .gift .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
  .gift .acts .btn { min-height: 48px; padding: 0 20px; font-size: 15.5px; }
  .gift .asked { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; font-size: 16px; font-weight: 600; color: var(--sage-ink); }
  .gift .asked .icon { color: var(--sage); }
  .gift .fine { margin: 0; font-size: 13.5px; color: var(--ink-3); }
  .gift.looking { align-content: center; justify-items: start; background: color-mix(in srgb, var(--page) 55%, transparent); box-shadow: none; }
  .gift.looking h3 { color: var(--ink-3); font-size: clamp(26px, 2.6vw, 34px); }
  .gift.looking .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); animation: read-pulse 1.2s ease-in-out infinite; }
  @media (max-width: 979px) { .gift.looking { display: none; } .gift { padding: 26px clamp(20px, 3vw, 36px); } }
  .gift-keep .gift { padding: 26px clamp(20px, 2.6vw, 34px) 22px; gap: 12px; }
  .gift-keep .gift h3 { font-size: clamp(24px, 2.4vw, 32px); max-width: 40ch; }
  @media (prefers-reduced-motion: reduce) { .gift.arrive, .gift.looking .pulse-dot { animation: none !important; } }

  /* "What your calendar says about your work": what the agent learned, confirmed with one press. */
  .welcome { display: grid; gap: 12px; padding: 22px clamp(20px, 2.6vw, 30px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-2); animation: line-in .6s cubic-bezier(.2, .8, .2, 1) both; }
  .welcome .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--coral-ink); }
  .welcome h3 { margin: 0; max-width: 60ch; font-family: var(--display); font-size: clamp(22px, 2.2vw, 28px); font-weight: 500; line-height: 1.25; letter-spacing: -.01em; color: var(--ink); }
  .welcome h3 b { font-weight: 700; }
  .welcome ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 22px; }
  .welcome li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; align-items: start; font-size: 15px; color: var(--ink-2); }
  .welcome li b { color: var(--ink); }
  .welcome li .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--coral); }
  .welcome .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
  .welcome .acts .fine { color: var(--ink-3); font-size: 13.5px; }

  /* What the agent suggests for the page, with Apply and No thanks. */
  .suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; background: var(--page); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .suggest p { flex: 1 1 320px; margin: 0; font-size: 15px; color: var(--ink-2); }
  .suggest p b { color: var(--ink); }
  .suggest .why { display: block; margin-top: 2px; color: var(--ink-3); font-size: 14px; }
  .suggest-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask .cancel { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }
  .grid.editing .box { position: relative; overflow: visible; outline: 2px dashed #c9c4b8; outline-offset: 5px; border-radius: 14px; }
  .grid.editing .box > :not(.box-x):not(.box-resize):not(.box-size) { pointer-events: none; user-select: none; }
  .grid .box { -webkit-touch-callout: none; }
  .grid.editing .box { cursor: grab; user-select: none; }
  .grid.editing .box:focus-visible { outline: 3px solid var(--slate); outline-offset: 5px; }
  body.is-moving, body.is-moving * { cursor: grabbing !important; user-select: none; }
  body.is-sizing, body.is-sizing * { cursor: nwse-resize !important; user-select: none; }
  .box.lifted { z-index: 30; box-shadow: 0 26px 50px -18px rgba(58, 62, 55, .42); will-change: transform; }
  .box.sizing { z-index: 30; }
  /* Motion: edit mode lifts the boxes a little, and the handles pop in once. */
  .grid.editing .box:not(.headline):not(.lifted) { box-shadow: 0 14px 30px -18px rgba(58, 62, 55, .32); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .grid.fresh .box-x, .grid.fresh .box-resize, .grid.fresh .box-size { animation: pop .45s var(--spring, ease-out) backwards; }
  .cheer { width: .82em; height: .82em; margin-inline-end: 12px; vertical-align: -.06em; fill: none; stroke: var(--sage); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .cheer circle { stroke-dasharray: 107; animation: draw-ring .7s ease-out both; }
  .cheer path { stroke-dasharray: 23; animation: draw-tick .45s .55s ease-out both; }
  @keyframes draw-ring { from { stroke-dashoffset: 107; } }
  @keyframes draw-tick { from { stroke-dashoffset: 23; } }
  .grid.stack.editing { gap: 36px; padding-top: 8px; }
  .grid.stack.editing .box.headline { padding-top: 24px; }
  .grid.stack.arranging .box:not(.lifted) { transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
  .drop-spot { z-index: 1; border: 2px dashed var(--slate); border-radius: 18px; background: color-mix(in srgb, var(--slate) 7%, transparent); pointer-events: none; }
  .size-tag { z-index: 31; place-self: center; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-2); }
  .size-tag:empty { display: none; }
  .box-resize { position: absolute; inset-inline-end: -11px; bottom: -11px; z-index: 3; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--slate); border-radius: 50%; background: var(--page); box-shadow: var(--shadow-1); cursor: nwse-resize; touch-action: none; transition: transform .15s ease; }
  .box-resize::after { content: ""; width: 8px; height: 8px; margin: 0 2px 2px 0; border-right: 2px solid var(--slate); border-bottom: 2px solid var(--slate); }
  .box-resize:hover { transform: scale(1.12); }
  .box-size { position: absolute; top: -16px; inset-inline-start: 12px; z-index: 3; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--ink); box-shadow: var(--shadow-2); }
  .box-size button { min-height: 30px; padding: 4px 10px; border: 0; border-radius: 999px; background: transparent; color: #c8ccd4; font-size: 13px; font-weight: 700; }
  .box-size button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .box-x { position: absolute; top: -14px; inset-inline-end: -14px; z-index: 3; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--page); border-radius: 50%; background: var(--ink); color: #fff; box-shadow: var(--shadow-2); transition: transform .15s ease, background .15s ease; }
  .box-x:hover { background: var(--terra); transform: scale(1.1); }
  .box-x .icon { width: 16px; height: 16px; stroke-width: 2.6; }
  .box.leaving { opacity: 0; transform: scale(.94); transition: opacity .2s ease, transform .2s ease; }
  .box.flash { animation: flash 1.4s ease; }
  @keyframes flash { 25% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--slate) 40%, transparent); } }
  .grid-empty { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 24px; border: 2px dashed var(--line-2); border-radius: 18px; color: var(--ink-2); }
  .grid-empty p { margin: 0; }

  /* The Add a box panel. */
  .pick-group h3 { margin: 6px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--page); }
  .pick.on { background: var(--panel); }
  .pick-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-2); }
  .pick b { display: block; font-size: 15px; }
  .pick span { display: block; color: var(--ink-3); font-size: 14px; }
  .pick em { display: block; margin-top: 2px; font-style: normal; font-size: 13px; font-weight: 700; color: var(--sage-ink); }
  .pick em.wait { color: var(--ink-3); font-weight: 600; }
  .pick-on { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--sage-tint); color: var(--sage-ink); }

  /* The Ideas panel, from the top bar. */
  .drawer { position: fixed; inset: 0; z-index: 40; }
  .drawer-scrim { position: absolute; inset: 0; background: rgba(16, 18, 23, .38); opacity: 0; transition: opacity .25s ease; }
  .drawer-panel { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: min(460px, 100%); display: flex; flex-direction: column; background: var(--page); box-shadow: -24px 0 60px -24px rgba(16, 18, 23, .4); transform: translateX(100%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); outline: none; }
  .drawer.open .drawer-scrim { opacity: 1; }
  .drawer.open .drawer-panel { transform: none; }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
  .drawer-head .lane-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--sage-tint); color: var(--sage-ink); flex: none; }
  .drawer-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .drawer-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 14.5px; }
  .drawer-close { margin-inline-start: auto; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 11px; background: transparent; color: var(--ink-2); }
  .drawer-close:hover { background: var(--panel); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .drawer .idea { box-shadow: none; }
  .drawer .idea.off { background: var(--panel); }
  .idea .today { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--sage-tint); border: 1px solid var(--sage-line); font-size: 14px; font-weight: 600; color: var(--ink); }
  .idea .off-note { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: var(--ink-3); }
  .idea .off-note .btn { min-height: 36px; padding: 4px 10px; font-size: 14px; }

  /* On a phone the boxes stack in their order and grow to fit. */
  .grid.stack { display: flex; flex-direction: column; gap: 16px; }
  .grid.stack .box { flex: none; }

  /* ── Narrow screens ──────────────────────────────────────────────────── */
  @media (max-width: 1100px) {
    .idea-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 920px) {
    .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "main" "side" "ask"; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .panel dl { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .bar-in { padding: 12px 16px; }
    .wrap { padding: 18px 16px 32px; }
    .main { gap: 20px; }
    .status { width: 100%; }
    .updated { display: none; }
    .hero h2 { font-size: 27px; }
    .hero .lead { font-size: 16.5px; }
    .kpi { padding: 13px 14px; }
    .kpi .value { font-size: 24px; }
    .card-hero { grid-template-columns: minmax(0, 1fr); padding: 22px 18px; gap: 14px; }
    .art { width: 104px; height: 82px; }
    .card-hero .btn.big { width: 100%; }
    .row-main { grid-template-columns: auto minmax(0, 1fr); padding: 14px 14px; }
    .when { grid-column: 1; grid-row: auto; flex-direction: row; align-items: center; gap: 10px; }
    .reply-btn { grid-column: 1; grid-row: auto; justify-self: start; }
    .row-body { padding: 0 14px 16px 14px; }
    .idea-grid { grid-template-columns: minmax(0, 1fr); }
    .ask { padding: 18px 16px; }
    .ask form { flex-direction: column; }
    .phone-only { display: inline; }
  }
  .phone-only { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── The calendar ────────────────────────────────────────────────────── */
  button.ev, .dayrow, .prow, .evtitle, .tag-ev { font: inherit; color: inherit; text-align: start; cursor: pointer; }
  button.ev, .dayrow, .prow, .evtitle { border: 0; background: none; padding: 0; }
  .h2-free { color: var(--sage-ink); }


  /* Today: now, next with its countdown, the rest of the day. */
  .today-body { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; }
  .allday { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-ev { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .tag-ev .icon { width: 15px; height: 15px; }
  .tagline { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .nowcard, .nextcard { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px 16px; border-radius: 16px; }
  .nowcard { background: var(--sage); color: #fff; }
  .nowcard .tagline, .nowcard .evmeta { color: rgba(255, 255, 255, .85); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: live 1.8s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .6); } 70% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
  .progress { align-self: stretch; height: 4px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .25); }
  .progress span { display: block; height: 100%; border-radius: 999px; background: #fff; }
  .nextcard { background: #f6f9f7; border: 1px solid var(--sage-line); }
  .nextcard .tagline { color: var(--sage-ink); }
  .evtitle { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
  .evtitle:hover { text-decoration: underline; text-underline-offset: 3px; }
  .evtime { font-size: 14px; font-weight: 700; color: var(--sage-ink); }
  .evmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; color: var(--ink-2); }
  .evmeta .icon { width: 15px; height: 15px; }
  .nextcard .nudge-actions { grid-column: auto; margin-top: 8px; }
  .dayrows, .weeklist, .freelist, .clashes, .quietlist, .plist, .hourlist { list-style: none; margin: 0; padding: 0; }
  .hourlist > li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 80px; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }
  .hourlist > li:last-child { border-bottom: 0; }
  .hourlist .hhead { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding-block: 6px; }
  .hourlist .hname { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .hourlist .hhead .hname { font-weight: 700; }
  .hourlist .hnum { text-align: end; font-size: 14px; color: var(--ink-2); }
  .hourlist .hnum b { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); }
  .hourlist .hbar { display: block; height: 4px; margin-top: 5px; border-radius: 99px; background: var(--panel); overflow: hidden; }
  .hourlist .hbar > span { display: block; height: 100%; border-radius: 99px; background: var(--sage); }
  .hourlist .htotal { background: var(--panel); }
  .dayrow { width: 100%; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 6px; border-radius: 10px; }
  .dayrow:hover { background: var(--panel); }
  .dayrow .t { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .dayrow .w { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .dayrow .w small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-3); }
  .dayrow.k-client .t { color: var(--sage-ink); }
  .dayrow.past { opacity: .55; }
  .dayrow.now { background: var(--sage-tint); }
  .today-end { display: flex; align-items: flex-start; gap: 8px; margin: 0; font-size: 14.5px; font-weight: 600; color: var(--sage-ink); }
  .today-end .icon { color: var(--sage); margin-top: 1px; }
  .earlier { margin: 0; font-size: 13px; color: var(--ink-3); }

  /* This week, as a list by day. */
  .weeklist { padding: 2px 10px 8px; }
  .weeklist .agday { display: flex; align-items: baseline; gap: 8px; padding: 12px 6px 4px; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .weeklist .agday.today { color: var(--sage); }
  .weeklist .agday small { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .weeklist .agnone { padding: 2px 6px 6px 92px; font-size: 13.5px; color: var(--ink-3); }

  /* This week, as seven columns. */
  .strip button.ev { width: 100%; padding: 2px 6px; }
  .strip .ev { font-size: 12.5px; }
  .strip .ev .num { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
  .strip .ev b { font-weight: 600; }
  .ev.k-client { background: var(--sage-tint); color: var(--sage-ink); }
  .ev.k-team { background: var(--slate-tint); color: var(--slate-ink); }
  .ev.k-personal { background: var(--panel); color: var(--ink-3); }
  .dayrow.k-personal .w { color: var(--ink-3); }
  .ev.k-other { background: var(--panel); color: var(--ink-2); }
  .ev.past { opacity: .5; }
  .ev.now { box-shadow: inset 0 0 0 2px var(--sage); }
  .ev.clash { box-shadow: inset 0 0 0 1px var(--terra); }
  .ev.now.clash { box-shadow: inset 0 0 0 2px var(--terra); }
  button.ev:hover { filter: brightness(.97); }
  .ev.freeslot { display: flex; align-items: center; gap: 6px; border: 1.5px dashed var(--sage-line); background: transparent; color: var(--sage-ink); font-weight: 600; }
  .ev.freeslot .icon { width: 14px; height: 14px; flex: none; }

  /* Send my free times: the message itself, each time a line you can leave out. */
  .lane.free .box-body { overflow-y: auto; }
  .send-msg { margin: 0; padding: 12px 16px 4px; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
  .send-msg p { margin: 0; }
  .sendlist { list-style: none; margin: 4px 0; padding: 0; }
  .sendlist button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 2px 6px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-weight: 600; text-align: start; cursor: pointer; }
  .sendlist button:hover { background: var(--panel-2); }
  .sendlist .tick { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border: 1.5px solid var(--sage-ink); border-radius: 6px; background: var(--sage-ink); color: #fff; }
  .sendlist .tick .icon { width: 13px; height: 13px; }
  .sendlist button[aria-pressed="false"] { color: var(--ink-3); font-weight: 400; text-decoration: line-through; }
  .sendlist button[aria-pressed="false"] .tick { background: transparent; border-color: var(--line-2); color: transparent; }
  .send-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px 14px; }
  .send-len { display: flex; flex-wrap: wrap; gap: 6px; }
  .send-len button { min-height: 32px; padding: 4px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .send-len button[aria-pressed="true"] { background: var(--ink-2); border-color: var(--ink-2); color: #fff; }
  .send-empty { margin: 0; padding: 12px 16px; color: var(--ink-3); }

  /* Double bookings. */
  .clashes > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .clashes .cday { font-size: 12.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--terra-ink); }
  .clashes .cwhat { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .clashes .cwhat i { font-style: normal; font-weight: 400; color: var(--ink-3); }
  .clashes small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-3); }
  .box[data-level="M"] .clashes > li { grid-template-columns: minmax(0, 1fr); }
  .box[data-level="M"] .clashes .btn { justify-self: start; }

  /* Your time. */
  .tbar { display: flex; gap: 2px; height: 14px; margin: 6px 0 14px; overflow: hidden; border-radius: 999px; background: var(--panel-2); }
  .tbar .k-client, .sw.k-client { background: var(--sage); }
  .tbar .k-team, .sw.k-team { background: var(--slate); }
  .tbar .k-personal, .sw.k-personal { background: var(--sand); }
  .tbar .k-other, .sw.k-other { background: var(--line-2); }
  .tbar .k-free, .sw.k-free { background: var(--sage-line); }
  .tlegend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; padding: 0; list-style: none; }
  .tlegend li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .tlegend b { margin-inline-start: auto; color: var(--ink); }
  .sw { width: 12px; height: 12px; flex: none; border-radius: 4px; }

  /* People you meet, and going quiet. */
  .ptools { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { min-height: 32px; padding: 4px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--page); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg .n { margin-inline-start: 6px; opacity: .7; }
  .phead, .plist.wide .prow { display: grid; grid-template-columns: minmax(0, 2.2fr) 1fr 1fr 1.4fr .9fr 1fr; gap: 12px; align-items: center; }
  .phead { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .plist > li, .quietlist > li { border-bottom: 1px solid var(--line); }
  .prow { width: 100%; padding: 10px 16px; font-size: 14.5px; }
  .prow:hover { background: var(--panel); }
  .plist:not(.wide) .prow { display: flex; flex-direction: column; gap: 4px; }
  .ptop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pline { font-size: 13.5px; color: var(--ink-3); }
  .pname { min-width: 0; }
  .pname b { display: block; font-weight: 700; overflow-wrap: anywhere; }
  .pname small { display: block; font-size: 13px; color: var(--ink-3); }
  .r { text-align: end; }
  .quietlist > li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }

  /* One event or person, opened. */
  .scrim { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 20px; background: rgba(16, 18, 23, .38); }
  .sheet { position: relative; width: min(520px, 100%); max-height: 86vh; overflow-y: auto; padding: 26px 24px 22px; border-radius: 24px; background: var(--page); box-shadow: var(--shadow-2); }
  .sheet .kicker { margin: 0 52px 4px 0; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--sage); }
  .sheet h2 { margin: 0 52px 6px 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .sheet .subtitle { margin: 0 0 12px; color: var(--ink-2); }
  .sfacts { display: grid; gap: 10px; margin: 12px 0 18px; padding: 0; list-style: none; }
  .sfacts li { display: flex; align-items: flex-start; gap: 10px; color: var(--ink-2); overflow-wrap: anywhere; }
  .sfacts .icon { margin-top: 2px; color: var(--ink-3); }
  .sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .close { position: absolute; top: 14px; inset-inline-end: 14px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--page); color: var(--ink-2); }
  .madeup { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: var(--sand-tint); color: var(--sand-ink); font-size: 14.5px; }
  @media (max-width: 600px) {
    .scrim { place-items: end center; padding: 0; }
    .sheet { width: 100%; border-radius: 24px 24px 0 0; }
  }

  /* Google Calendar's touches: its mark by the connection, today as a filled circle in the
     page's colour, the red line with a dot where now is, and events in Calendar's soft event
     colours (a solid fill, no stripe). */
  :root {
    --ev-peacock: #039be5; --ev-peacock-soft: #cdeafa; --ev-peacock-ink: #01579b;
    --ev-lavender: #7986cb; --ev-lavender-soft: #dde0f2; --ev-lavender-ink: #283593;
    --ev-banana: #f6bf26; --ev-banana-soft: #fcecbe; --ev-banana-ink: #6d4c00;
    --ev-flamingo: #e67c73; --ev-flamingo-soft: #f9dbd8; --ev-flamingo-ink: #8c2f26;
    --ev-graphite: #616161; --ev-graphite-soft: #ebebeb; --ev-graphite-ink: #3c3c3c;
    --now: #ea4335;
  }
  .gcal { width: 18px; height: 18px; flex: none; }
  .pill.ok .gcal + .dot { display: none; }
  .strip .col.today { background: none; }
  .strip .dnum { display: grid; place-items: center; width: 36px; height: 36px; margin: -6px 0 0 -6px; border-radius: 50%; }
  .strip .col.today .dname { color: var(--acc-ink); }
  .strip .col.today .dnum { background: var(--acc-strong); color: #fff; }
  .weeklist .agday.today { color: var(--acc-ink); }
  .ev { background: var(--ev-graphite-soft); color: var(--ev-graphite-ink); }
  .ev.k-client, .ev.in { background: var(--ev-peacock-soft); color: var(--ev-peacock-ink); }
  .ev.k-team { background: var(--ev-lavender-soft); color: var(--ev-lavender-ink); }
  .ev.k-personal { background: var(--ev-banana-soft); color: var(--ev-banana-ink); }
  .ev.k-other, .ev.auto { background: var(--ev-graphite-soft); color: var(--ev-graphite-ink); }
  .ev.person { background: var(--ev-flamingo-soft); color: var(--ev-flamingo-ink); }
  .ev.now { box-shadow: inset 0 0 0 2px var(--acc-strong); }
  .tag-ev { border: 0; background: var(--ev-peacock-soft); color: var(--ev-peacock-ink); }
  /* The day's list as Calendar's schedule: a dot in the event's colour before each time. */
  .dayrow { grid-template-columns: 10px 76px minmax(0, 1fr); position: relative; }
  .dayrow::before { content: ""; align-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--ev-graphite); }
  .dayrow.k-client::before { background: var(--ev-peacock); }
  .dayrow.k-team::before { background: var(--ev-lavender); }
  .dayrow.k-personal::before { background: var(--ev-banana); }
  .dayrow.now { background: none; }
  .weeklist .agnone { padding-inline-start: 110px; }
  .dayrow.now::after { content: ""; position: absolute; left: -2px; right: 0; top: -6px; height: 12px; pointer-events: none;
    background: radial-gradient(circle at 6px 6px, var(--now) 5px, transparent 5.5px), linear-gradient(var(--now), var(--now)) 6px 5px / 100% 2px no-repeat; }
  .nowline { position: relative; flex: none; display: block; height: 2px; margin: 3px 0 3px 4px; background: var(--now); }
  .nowline::before { content: ""; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--now); }
  .tbar .k-client, .sw.k-client { background: var(--ev-peacock); }
  .tbar .k-team, .sw.k-team { background: var(--ev-lavender); }
  .tbar .k-personal, .sw.k-personal { background: var(--ev-banana); }

  /* ── Freelancers' Google colour ─────────────────────────────────────────── */
  /* Grape: the buttons, the box icons, today's bar and circle, the event on now; the Ask box in
     a deep purple. Green stays for done, red for late. */
  :root { --acc: #8e24aa; --acc-strong: #8e24aa; --acc-ink: #6a1b9a; --acc-deep: #4a148c; --coral: #8e24aa; --coral-ink: #6a1b9a; }
  ::selection { background: color-mix(in srgb, var(--acc) 24%, transparent); }
  .btn.primary { background: var(--acc-strong); border-color: var(--acc-strong); color: #fff; box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--acc-strong) 80%, transparent); }
  .btn.primary:hover { background: var(--acc-deep); border-color: var(--acc-deep); }
  .btn.dark { background: var(--acc-strong); border-color: var(--acc-strong); color: #fff; }
  .btn.dark:hover { background: var(--acc-deep); border-color: var(--acc-deep); }
  .seg button[aria-pressed="true"], .send-len button[aria-pressed="true"] { background: var(--acc-ink); border-color: var(--acc-ink); color: #fff; }
  .ask, .box.ask { background: var(--acc-deep); }
  .ask .btn.primary, .box.ask .btn.primary { background: #fff; border-color: #fff; color: var(--acc-deep); box-shadow: none; }
  .ask .btn.primary:hover { background: color-mix(in srgb, var(--acc) 12%, #fff); border-color: transparent; }
  .lane-head .lane-icon { color: var(--acc-ink); }
  .nowcard { background: var(--acc-strong); }
  .nextcard { background: color-mix(in srgb, var(--acc) 5%, #fff); border-color: color-mix(in srgb, var(--acc) 26%, #fff); }
  .nextcard .tagline, .evtime { color: var(--acc-ink); }
  .read-lines li .icon, .welcome li .icon { color: var(--acc-strong); }
  .read-lines li.now .pulse-dot, .read-strip .pulse-dot, .gift.looking .pulse-dot { background: var(--acc); }
  .gift .eyebrow, .welcome .eyebrow { color: var(--acc-ink); }
  .hl-name .gcal { width: 20px; height: 20px; }
  .bars li.today .d { padding: 0 7px; border-radius: 999px; background: var(--acc); color: #fff; }
  /* The bars stood on the words on narrow screens (the hide rule lost to the placing rule). */
  @media (max-width: 960px) { .box.headline > .sheet { display: none; } }

  /* ── The loading screen: a live scene from the banner ──────────────────── */
  /* While the first sort reads, a small scene from the page's own banner sits on top of the
     reading and grows with every line; when the reading is done it is complete. Calendar's
     mark leads the title. The two sheets are as tall as their words, centred on the page. */
  .read-scene { position: relative; isolation: isolate; height: 172px; margin: 0 0 24px; border-radius: 18px; overflow: hidden; }
  .read-title { display: flex; align-items: center; gap: 14px; }
  .read-title .gcal { width: .74em; height: .74em; }
  .read-page .gift { background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 8%, var(--page)) 0, var(--page) 48%); }
  .read-page .gift.looking { background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 9%, transparent) 0, color-mix(in srgb, var(--page) 55%, transparent) 60%); }
  @media (min-width: 980px) {
    .read-page { align-content: center; }
    .read-page .reading { padding-top: 28px; }
  }
  @media (max-width: 979px) { .read-scene { height: 118px; margin-bottom: 16px; border-radius: 14px; } }
  @keyframes rs-grow { from { transform: scaleY(0); } }
  @keyframes rs-pop { from { transform: scale(.3); opacity: 0; } }
  /* Freelancers: a corner of the timesheet's graph paper; a day's bar grows for each line read,
     today's in grape, and the whole week stands when the reading is done. */
  .read-scene.timesheet {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; align-items: stretch; padding: 18px 24px 12px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(178deg, #fcfaf6 0%, #f4eee4 100%);
  }
  .rs-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; min-height: 0; font-family: var(--display); }
  .rs-col .bar { width: 100%; max-width: 34px; min-height: 3px; border-radius: 7px 7px 3px 3px; background: var(--line-2); transform-origin: bottom; }
  .rs-col .bar.on { background: var(--charcoal); opacity: .82; }
  .rs-col.today .bar.on { background: var(--acc); opacity: 1; }
  .rs-col .bar.fresh { animation: rs-grow .7s cubic-bezier(.2, .8, .2, 1) both; }
  .rs-col .d { font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
  .rs-col.today .d { padding: 0 7px; border-radius: 999px; background: var(--acc); color: #fff; }
  @media (min-width: 980px) { .read-page .reading h2.read-title { font-size: clamp(30px, 2.9vw, 40px); } }
  @media (max-width: 979px) { .read-scene.timesheet { gap: 8px; padding: 12px 14px 8px; } .rs-col .d { font-size: 11px; } }
</style>
</head>
