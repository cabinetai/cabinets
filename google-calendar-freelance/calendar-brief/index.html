    Array.prototype.forEach.call(body.children, function (child) {
      if (child.hidden) return;
      bottom = Math.max(bottom, child.offsetTop + child.offsetHeight + (parseFloat(getComputedStyle(child).marginBottom) || 0));
    });
    return bottom + (parseFloat(getComputedStyle(body).paddingBottom) || 0);
  }

  /**
   * A list shows the rows that fit its box, then "+N more". Opened (by that button, or by
   * opening one of its rows) it shows them all and the box grows to hold them.
   */
  function fitBox(el) {
    var id = el.getAttribute("data-box");
    var body = el.querySelector(".box-body");
    var more = el.querySelector(".box-more");
    if (!body || !more) return;
    var rows = Array.prototype.slice.call(body.querySelectorAll(".rows > li, .cards > li"));
    var open = !!state.expanded[id] || !!body.querySelector(".row.open, .mc-body:not([hidden])");
    var stack = phone();
    var cut = 0;
    rows.forEach(function (r) { r.hidden = false; });
    more.hidden = true;
    // In a short box the rows come first: the idea at its foot steps aside for them.
    var nudge = el.querySelector(".box-body ~ .nudge");
    if (nudge) {
      nudge.hidden = false;
      if (!open && !stack && rows.length && body.clientHeight < rows[0].offsetHeight + 8) nudge.hidden = true;
    }
    if (!open && stack) {
      var keepRows = el.getAttribute("data-level") === "L" ? rows.length : PHONE_ROWS;
      rows.forEach(function (r, i) { if (i >= keepRows) { r.hidden = true; cut++; } });
    } else if (!open && body.scrollHeight > body.clientHeight + 1) {
      more.hidden = false;
      for (var i = rows.length - 1; i > 0 && body.scrollHeight > body.clientHeight + 1; i--) { rows[i].hidden = true; cut++; }
    }
    more.hidden = !cut && !state.expanded[id];
    more.textContent = cut ? "+" + cut + " more" : "Show less";
    more.setAttribute("aria-expanded", String(!cut));

    var need = 0;
    if (open && !stack) {
      var total = 2;
      Array.prototype.forEach.call(el.children, function (child) {
        if (child.matches(".box-x, .box-resize, .box-size")) return;
        total += child === body ? rowsHeight(body) : child.hidden ? 0 : child.offsetHeight;
      });
      need = Math.ceil((total + GAP) / (ROW + GAP));
    }
    if ((state.need[id] || 0) !== need) {
      state.need[id] = need;
      placeBoxes();
    }
  }

  function boxHead(key, title, iconId, total, count) {
    return '<div class="lane-head"><span class="lane-icon" aria-hidden="true">' + icon(iconId) + '</span><h3 id="h-' + key + '">' + esc(title) + "</h3>" +
      (total ? '<span class="total num" dir="auto">' + esc(total) + "</span>" : "") +
      (count === null ? "" : '<span class="count num' + (count ? "" : " zero") + '">' + count + "</span>") + "</div>";
  }
  function listBox(key, title, iconId, total, count, rowsHtml, emptyText) {
    return boxHead(key, title, iconId, total, count) +
      '<div class="box-body">' + (count ? rowsHtml : '<p class="lane-empty">' + esc(emptyText) + "</p>") + "</div>" +
      '<button type="button" class="box-more" data-act="more-rows" hidden></button>';
  }
  /** The small level: one number, a line under it, and the one that matters most. */
  function sumBox(key, title, iconId, value, subHtml, lineHtml) {
    return boxHead(key, title, iconId, "", null) +
      '<div class="sum"><span class="value num' + (value ? "" : " none") + '" dir="auto">' + esc(value || "None") + "</span>" +
      '<span class="sub">' + subHtml + "</span>" + (lineHtml ? '<span class="line" dir="auto">' + lineHtml + "</span>" : "") + "</div>";
  }

  // ── Drawing the boxes ──────────────────────────────────────────────────

  /** "today", "tomorrow", "on Tuesday": a day inside a sentence. */
  function onDay(d, today) {
    var w = dayWord(d, today);
    return w === "Today" || w === "Tomorrow" ? w.toLowerCase() : "on " + w;
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function moreButton() { return '<button type="button" class="box-more" data-act="more-rows" hidden></button>'; }
  function kpi(iconId, label, value, sub, cls) {
    return '<div class="kpi' + (cls ? " " + cls : "") + '"><span class="label">' + icon(iconId) + esc(label) + "</span>" +
      '<span class="value num">' + esc(value) + '</span><span class="sub">' + esc(sub) + "</span></div>";
  }

  function numberCard(id) {
    var f = state.facts;
    var todayN = f.days[0].events.length;
    if (id === "n-events") return kpi("i-calendar", "Events this week", String(f.events), todayN ? count(todayN, "event", "events") + " today" : "Nothing today");
    if (id === "n-hours") return kpi("i-clock", "Hours in meetings", hoursWords(f.meetHours), "not counting personal time");
    if (id === "n-free") return kpi("i-sun", "Free hours", hoursWords(f.freeHours), f.best ? "Longest: " + f.bestWords : "Weekdays are full", "calm");
    return f.busiest
      ? kpi("i-chart", "Busiest day", dayWord(f.busiest.day.date, f.today), count(f.busiest.n, "event", "events"))
      : kpi("i-chart", "Busiest day", "None", "Nothing planned");
  }

  /** "Good afternoon, Tal. Sunday, 11 October." for the hour on the person's own clock. */
  function helloHtml(d) {
    var h = d.getHours();
    var hi = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
    var me = myName();
    var day = d.toLocaleDateString([], { weekday: "long" }) + ", " + d.getDate() + " " + d.toLocaleDateString([], { month: "long" });
    return "<b>" + esc(hi + (me ? ", " + me.split(" ")[0] : "")) + ".</b> " + esc(day) + ".";
  }
  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll("[data-hello]"), function (el) { el.innerHTML = helloHtml(new Date()); });
  }, 5 * 60 * 1000);
  /** "No double bookings" rides in the greeting line when the week has plans and none clash. */
  function calmHtml() {
    var f = state.facts;
    if (!f || !f.events || f.conflicts.length || state.example) return "";
    return '<span class="calm"><svg class="cheer" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" /><path d="M12.5 20.5l5 5 10-11" /></svg>No double bookings</span>';
  }
  /**
   * The timesheet on the graph paper: client hours on each of the seven days, today first,
   * and over them the hours this week and this month.
   */
  function sheetHtml() {
    var f = state.facts;
    var perDay = f.days.map(function (d) {
      var m = d.events.filter(function (e) { return e.kind === "client" && !e.allDay && e.day === d.key; })
        .reduce(function (n, e) { return n + endOf(e) - e.start; }, 0);
      return { d: d, h: m / 60 };
    });
    var top = Math.max.apply(null, perDay.map(function (x) { return x.h; }).concat([4]));
    var h = clientHours();
    var bars = perDay.map(function (x, i) {
      var pct = Math.round(x.h / top * 100);
      return '<li class="' + (i === 0 ? "today" : "") + '"><span class="stack"><span class="h">' + (x.h ? esc(hoursWords(x.h)) : "") + "</span>" +
        '<span class="col' + (x.h ? "" : " zero") + '" style="height:' + (x.h ? Math.max(pct * 0.8, 5) : 2) + '%"></span></span>' +
        '<span class="d">' + esc(i === 0 ? "Today" : x.d.date.toLocaleDateString([], { weekday: "short" })) + "</span></li>";
    }).join("");
    return '<div class="sheet" aria-label="Client hours on each of the next seven days"><p class="sheet-total">' + (state.example ? "Example · " : "") +
      "<b>" + esc(hoursWords(h.total.month)) + "</b> done this month · " + esc(hoursWords(h.total.booked)) + " booked this week</p>" +
      '<ol class="bars">' + bars + "</ol></div>";
  }
  /** The headline's first row: the page's mark, and on the right the connection and the buttons. */
  function headlineTop(h2) {
    return '<div class="hl-top"><p class="hl-name">' + GCAL_MARK + "<span>Timesheet</span></p>" +
      '<div class="status hl-status" aria-live="polite">' + statusHtml() + "</div></div>" +
      '<p class="hello"><span data-hello>' + helloHtml(new Date()) + "</span>" + calmHtml() + "</p>" + h2;
  }

  function drawHeadline(level) {
    var f = state.facts;
    var ex = state.example ? "Example: " : "";
    var billable = f.byKind.client / 60;
    var main = billable ? hoursWords(billable) + " with clients this week"
      : f.events ? count(f.events, "event", "events") + " this week" : "Nothing on your calendar this week";
    var top = headlineTop;
    if (level === "S") return "<div>" + top("<h2>" + esc(ex + main) + "</h2>") + "</div>";
    // A whole empty week is simply clear; naming one free day in it would add nothing.
    var free = f.events && f.best && f.best.slot.end - f.best.slot.start >= 120 ? " " + freeWords(f) + "." : "";
    var lead = "";
    if (f.conflicts.length) {
      var c = f.conflicts[0];
      lead = " <b>" + esc(dayWord(c.day.date, f.today)) + " at " + esc(clock(c.from)) + ":</b> " + bdi(shownTitle(c.a)) + " and " + bdi(shownTitle(c.b)) + " overlap.";
    } else if (state.data.note) {
      lead = " " + bdi(state.data.note);
    }
    // The title is the page's name; the week's count leads the line under it.
    lead = '<p class="lead"><b>' + esc(ex + main + ".") + "</b>" + (free ? '<span class="h2-free">' + esc(free) + "</span>" : "") + lead + "</p>";
    var meta = '<p class="meta">' + icon("i-clock") + esc(hoursWords(f.meetHours) + " in meetings · " + hoursWords(f.freeHours) + " free on weekdays, 8 to 5") + "</p>";
    return "<div>" + top("<h2>Your hours</h2>") + lead + meta + "</div>" + sheetHtml();
  }

  /**
   * The page is the person's own, so their events keep their titles. Only what goes to someone
   * else (the free times message, a report) says "busy" for a personal event.
   */
  function shownTitle(e) { return e.title || "Busy"; }

  /** One event as a row: its time, its name, who or what kind; a press opens it. */
  function dayRow(e, withDay) {
    var who = e.kind === "personal" ? "" : whoWords(e);
    var kind = e.kind !== "client" ? KIND_WORDS[e.kind] : "";
    var sub = who || kind;
    return '<button type="button" class="dayrow k-' + e.kind + (hasEnded(e) ? " past" : "") + (isNow(e) ? " now" : "") + '" data-act="event" data-id="' + esc(e.id) + '">' +
      '<span class="t num">' + esc(timeLabel(e)) + "</span>" +
      '<span class="w">' + bdi(shownTitle(e)) + (sub ? "<small>" + bdi(sub) + (withDay ? "" : "") + "</small>" : "") + "</span></button>";
  }

  function nowCard(e, nowM) {
    var end = endOf(e);
    var pct = Math.max(0, Math.min(100, Math.round((nowM - e.start) / Math.max(1, end - e.start) * 100)));
    return '<div class="nowcard"><span class="tagline"><span class="live"></span>Now</span>' +
      '<button type="button" class="evtitle" data-act="event" data-id="' + esc(e.id) + '">' + bdi(shownTitle(e)) + "</button>" +
      '<span class="evmeta">Until ' + esc(clock(end)) + " · " + esc(lengthWords(end - nowM)) + " left" + (e.place ? " · " + bdi(e.place) : "") + "</span>" +
      '<span class="progress" aria-hidden="true"><span style="width:' + pct + '%"></span></span></div>';
  }
  function nextCard(e, nowM) {
    var who = whoWords(e);
    var acts = "";
    if (withPeople(e) && canAsk()) acts += '<button type="button" class="btn small dark" data-act="prep" data-id="' + esc(e.id) + '">' + icon("i-doc") + "Prep me</button>";
    if (!state.example && canAsk() && changeAllowed(state.data)) acts += '<button type="button" class="btn small" data-act="reschedule" data-id="' + esc(e.id) + '">' + icon("i-move") + "Move it</button>";
    acts += '<button type="button" class="btn small" data-act="event" data-id="' + esc(e.id) + '">Details</button>';
    return '<div class="nextcard"><span class="tagline">Next · ' + esc(inWords(e.start - nowM)) + "</span>" +
      '<span class="evtime num">' + esc(clock(e.start)) + esc(untilWords(e)) + "</span>" +
      '<button type="button" class="evtitle" data-act="event" data-id="' + esc(e.id) + '">' + bdi(shownTitle(e)) + "</button>" +
      (who || e.place ? '<span class="evmeta">' + (who ? icon("i-users") + bdi(who) : "") + (e.place ? (who ? "<span>·</span>" : "") + icon("i-pin") + bdi(e.place) : "") + "</span>" : "") +
      '<div class="nudge-actions">' + acts + "</div></div>";
  }

  /** Today: what's on now, what's next with a live countdown, the rest, and when you're free. */
  function drawToday(level) {
    var f = state.facts;
    var nowM = nowMinutes();
    var n = f.days[0].events.length;
    if (level === "S") {
      var line = f.now.length ? "<b>Now:</b> " + bdi(shownTitle(f.now[0]))
        : f.next ? "<b>" + esc(cap(inWords(f.next.start - nowM))) + ":</b> " + bdi(shownTitle(f.next))
        : f.tomorrowFirst ? "<b>Tomorrow " + esc(clock(f.tomorrowFirst.start)) + ":</b> " + bdi(shownTitle(f.tomorrowFirst))
        : "Nothing else today";
      return sumBox("today", "Today", "i-clock", String(n), n ? plural(n, "event", "events") + " today" : "A free day", line);
    }
    var body = "";
    if (f.allDayToday.length) {
      body += '<div class="allday">' + f.allDayToday.map(function (e) {
        return '<button type="button" class="tag-ev" data-act="event" data-id="' + esc(e.id) + '">' + icon("i-calendar") + bdi(shownTitle(e)) + "</button>";
      }).join("") + "</div>";
    }
    f.now.forEach(function (e) { body += nowCard(e, nowM); });
    if (f.next) body += nextCard(f.next, nowM);
    var rows = f.later.map(function (e) { return "<li>" + dayRow(e) + "</li>"; }).join("");
    if (rows) body += '<ol class="rows dayrows">' + rows + "</ol>";
    if (!f.now.length && !f.next) {
      // The day is done (or empty): what helps now is a look at tomorrow.
      body += '<p class="today-end">' + icon("i-sun") + "<span>" + (n ? "Nothing else on your calendar today." : "Nothing on your calendar today.") + "</span></p>";
      var tomorrow = f.days[1].events;
      if (tomorrow.length) {
        body += '<p class="tagline">Tomorrow</p><ol class="rows dayrows">' + tomorrow.map(function (e) { return "<li>" + dayRow(e) + "</li>"; }).join("") + "</ol>";
      }
    } else {
      var lastEnd = Math.max.apply(null, f.now.concat(f.next ? [f.next] : [], f.later).map(endOf));
      if (lastEnd < 21 * 60) body += '<p class="today-end">' + icon("i-sun") + "<span>Free from <b>" + esc(clock(lastEnd)) + "</b>.</span></p>";
    }
    if (f.earlier.length) body += '<p class="earlier">' + esc(count(f.earlier.length, "event", "events")) + " earlier today</p>";
    return boxHead("today", "Today", "i-clock", longDate(f.today), null) + '<div class="box-body today-body">' + body + "</div>" +
      nudgeHtml(boxIdea("today")) + moreButton();
  }

  /** Free time: the free stretches of the week, the longest marked, each on its day's 8 to 5. */
  // ── Send my free times ─────────────────────────────────────────────────

  // The free stretches as a message to send when someone asks "when are you free?".
  var SEND_KEY = "calendar-freelance-send@1";
  var SEND_LENGTHS = [30,60,120];
  var SEND_MAX = 5;           // times in one message
  var SEND_LEAD = 60;         // minutes: a time today starts at least this far from now
  var LEN_WORDS = { 30: "30-minute", 60: "1-hour", 120: "2-hour", 180: "3-hour" };
  var LEN_SHORT = { 30: "30 min", 60: "1 h", 120: "2 h", 180: "3 h" };
  var sendIntro = function (len) { return "Here are some times I'm free for a " + LEN_WORDS[len] + " call:"; };

  function sendLength() { return SEND_LENGTHS.indexOf(state.sendLen) >= 0 ? state.sendLen : 60; }
  /** Times long enough for one meeting of `len` minutes, each starting on the hour or half hour. */
  function sendTimes(f, len) {
    var out = [];
    f.days.forEach(function (d, i) {
      openStretches(d, i === 0, len).forEach(function (s) {
        var start = Math.ceil(s.start / 30) * 30;
        if (i === 0) start = Math.max(start, Math.ceil((nowMinutes() + SEND_LEAD) / 30) * 30);
        if (s.end - start < len) return;
        out.push({ key: d.key + "@" + start, day: d, start: start, end: s.end });
      });
    });
    return out.slice(0, SEND_MAX);
  }
  /** "Tue 14 Oct, 2:00 PM to 4:00 PM": a full date, since the message is read later. */
  function sendWhen(t) { return DAYS[t.day.date.getDay()].slice(0, 3) + " " + shortDate(t.day.date) + ", " + clock(t.start) + " to " + clock(t.end); }
  /** The zone the times are in. The routine writes every time in the calendar's own zone and the
      page shows them as written (it does not convert them), so the label is the calendar's zone;
      the browser's only for the example, or a file without one. */
  function zoneName() {
    try {
      var tz = state.data && !state.data.example ? state.data.timeZone : null;
      var parts = new Intl.DateTimeFormat(undefined, tz ? { timeZone: tz, timeZoneName: "long" } : { timeZoneName: "long" }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) if (parts[i].type === "timeZoneName") return parts[i].value;
    } catch (e) { /* older browser */ }
    return "";
  }
  function sendText(times, len) {
    var zone = zoneName();
    return sendIntro(len) + "\n" + times.map(function (t) { return "- " + sendWhen(t); }).join("\n") + "\n" +
      (zone ? "Times are in " + zone + ". " : "") + "Let me know which suits you.";
  }
  function sendChosen(times) { return times.filter(function (t) { return !state.sendOff[t.key]; }); }

  function copyText(text) {
    var done = function () { toast("Copied. Paste it into your message."); };
    var fail = function () { toast("That could not be copied. Select the text and copy it yourself."); };
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(text).then(done, function () { if (copyByHand(text)) done(); else fail(); });
    } else if (copyByHand(text)) done();
    else fail();
  }
  /** For a frame the browser does not let use the clipboard API. */
  function copyByHand(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(area);
    return ok;
  }
  function saveSendLength() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(SEND_KEY, state.sendLen).catch(function () { /* the choice is only a convenience */ });
    }
  }

  function drawFree(level) {
    var f = state.facts;
    var len = sendLength();
    var times = sendTimes(f, len);
    var chosen = sendChosen(times);
    var copy = '<button type="button" class="btn small dark" data-act="send-copy"' + (chosen.length ? "" : " disabled") + ">" + icon("i-copy") + "Copy</button>";
    if (level === "S") {
      return sumBox("free", "Send my free times", "i-send", times.length ? String(chosen.length) : "",
        times.length ? (chosen.length === 1 ? "time ready to send" : "times ready to send") : "No free time for this length",
        times.length ? copy : "");
    }
    var head = boxHead("free", "Send my free times", "i-send", times.length ? count(chosen.length, "time", "times") : "", null);
    var lens = '<div class="send-len" role="group" aria-label="Call length">' + SEND_LENGTHS.map(function (m) {
      return '<button type="button" data-act="send-len" data-len="' + m + '" aria-pressed="' + (m === len) + '">' + LEN_SHORT[m] + "</button>";
    }).join("") + "</div>";
    if (!times.length) {
      return head + '<div class="box-body"><p class="send-empty">' + esc("No free time on weekdays, 8 to 5, for a " + LEN_WORDS[len] + " call this week. Try a shorter one.") + "</p></div>" +
        '<div class="send-foot">' + lens + "</div>";
    }
    var rows = times.map(function (t) {
      var on = !state.sendOff[t.key];
      return '<li><button type="button" data-act="send-toggle" data-key="' + esc(t.key) + '" aria-pressed="' + on + '"' +
        ' aria-label="' + esc((on ? "Leave out " : "Put back ") + sendWhen(t)) + '">' +
        '<span class="tick" aria-hidden="true">' + icon("i-check") + '</span><span class="num" dir="auto">' + esc(sendWhen(t)) + "</span></button></li>";
    }).join("");
    var zone = zoneName();
    return head + '<div class="box-body"><div class="send-msg" dir="auto"><p>' + esc(sendIntro(len)) + "</p>" +
      '<ol class="sendlist">' + rows + "</ol>" +
      "<p>" + esc((zone ? "Times are in " + zone + ". " : "") + "Let me know which suits you.") + "</p></div></div>" +
      '<div class="send-foot">' + lens + copy + "</div>" + nudgeHtml(boxIdea("free"));
  }

  /** This week: a count, a list by day, or a real week of seven columns when there is room. */
  function drawWeek(level) {
    var f = state.facts;
    if (level === "S") {
      return sumBox("week", "This week", "i-calendar", String(f.events), "events in 7 days",
        f.busiest ? "Busiest: <b>" + esc(dayWord(f.busiest.day.date, f.today)) + "</b>, " + esc(count(f.busiest.n, "event", "events")) : "");
    }
    var head = boxHead("week", "This week", "i-calendar", count(f.events, "event", "events"), null);
    if (level === "M") {
      var html = "";
      f.days.forEach(function (d, i) {
        html += '<li class="agday' + (i === 0 ? " today" : "") + '"><span>' + esc(dayWord(d.date, f.today)) + "</span><small>" + esc(shortDate(d.date)) + "</small></li>";
        if (d.outside) { html += '<li class="agnone">Not read yet. Refresh to read it.</li>'; return; }
        if (!d.events.length) html += '<li class="agnone">Nothing planned</li>';
        d.events.forEach(function (e) { html += "<li>" + dayRow(e) + "</li>"; });
      });
      return head + '<div class="box-body"><ol class="rows weeklist">' + html + "</ol></div>" + moreButton() + nudgeHtml(boxIdea("week"));
    }
    var clash = {};
    f.conflicts.forEach(function (c) { clash[c.a.id] = clash[c.b.id] = true; });
    var cols = f.days.map(function (d, i) {
      if (d.outside) {
        return '<div class="col"><span class="dname">' + esc(DAYS[d.date.getDay()].slice(0, 3)) + '</span><span class="dnum num">' + d.date.getDate() + '</span><span class="ev-more">Not read yet</span></div>';
      }
      var items = d.events.map(function (e) {
        return { at: e.allDay ? -1 : e.start, html: '<button type="button" class="ev k-' + e.kind + (hasEnded(e) ? " past" : "") + (isNow(e) ? " now" : "") + (clash[e.id] ? " clash" : "") + '" data-act="event" data-id="' + esc(e.id) + '"' + (clash[e.id] ? ' title="Overlaps another event"' : "") + ">" +
          '<span class="num">' + esc(timeLabel(e)) + "</span><b>" + bdi(shownTitle(e)) + "</b></button>" };
      });
      var best = f.best && f.best.day === d ? f.best : null;
      if (best) items.push({ at: best.slot.start - 0.5, html: '<span class="ev freeslot">' + icon("i-sun") + "Free " + esc(clock(best.slot.start)) + " to " + esc(clock(best.slot.end)) + "</span>" });
      items.sort(function (a, b) { return a.at - b.at; });
      var shownItems = items.slice(0, 6).map(function (it) { return it.html; }).join("");
      // Google Calendar's red now line, between today's events where now falls.
      if (i === 0 && items.length) {
        var nowAt = nowMinutes(), shown = items.slice(0, 6), k = 0;
        while (k < shown.length && shown[k].at <= nowAt) k++;
        var join = function (list) { return list.map(function (it) { return it.html; }).join(""); };
        shownItems = join(shown.slice(0, k)) + '<span class="nowline" aria-hidden="true"></span>' + join(shown.slice(k));
      }
      return '<div class="col' + (i === 0 ? " today" : "") + '"><span class="dname">' + esc(i === 0 ? "Today" : DAYS[d.date.getDay()].slice(0, 3)) + "</span>" +
        '<span class="dnum num">' + d.date.getDate() + "</span>" + (items.length ? shownItems : '<span class="ev-more">Nothing planned</span>') +
        (items.length > 6 ? '<span class="ev-more">+' + (items.length - 6) + " more</span>" : "") + "</div>";
    }).join("");
    return head + '<div class="strip">' + cols + "</div>" + nudgeHtml(boxIdea("week"));
  }

  /**
   * Hours with each client. This month is time already spent: the routine's count of meetings
   * that ended since the 1st, plus what ended today after it ran. Booked is what is still to
   * come in the next seven days. A meeting tomorrow is never billed today.
   */
  function clientHours() {
    var f = state.facts;
    var nowM = nowMinutes();
    // generatedAt has the helper machine's offset (a cloud runner may be on UTC): read it on
    // this browser's clock, the same one as the day keys and nowMinutes().
    var gen = new Date((state.data && state.data.generatedAt) || "");
    var runM = f.days.length && ymd(gen) === f.days[0].key ? gen.getHours() * 60 + gen.getMinutes() : 0;
    var seen = {}, booked = {}, since = {};
    f.days.forEach(function (d, i) {
      d.events.forEach(function (e) {
        if (seen[e.id] || e.allDay || e.kind !== "client") return;
        seen[e.id] = true;
        var key = e.client || e.title;
        var end = endOf(e);
        if (i === 0) {
          since[key] = (since[key] || 0) + Math.max(0, Math.min(end, nowM) - Math.max(e.start, runM)) / 60;
          booked[key] = (booked[key] || 0) + Math.max(0, end - Math.max(e.start, nowM)) / 60;
        } else {
          booked[key] = (booked[key] || 0) + (end - e.start) / 60;
        }
      });
    });
    var rows = state.data.clients.map(function (c) { return { id: c.id, name: c.name, booked: booked[c.id] || 0, month: c.hours + (since[c.id] || 0) }; });
    Object.keys(booked).forEach(function (k) {
      if (!rows.some(function (r) { return r.id === k; })) rows.push({ id: k, name: k, booked: booked[k], month: since[k] || 0 });
    });
    rows = rows.filter(function (r) { return r.booked > 0 || r.month > 0; });
    rows.sort(function (a, b) { return b.month - a.month || b.booked - a.booked; });
    var total = { booked: 0, month: 0 };
    rows.forEach(function (r) { total.booked += r.booked; total.month += r.month; });
    return { rows: rows, total: total };
  }

  /** Hours: what you spent with each client this month, ready for invoices, and what is booked. */
  function drawHours(level) {
    var h = clientHours();
    if (level === "S") {
      var top = h.rows[0];
      return sumBox("hours", "Hours", "i-receipt", hoursWords(h.total.month), "with clients this month",
        top ? "<b>" + bdi(top.name) + ":</b> " + esc(hoursWords(top.month)) : "");
    }
    var max = Math.max.apply(null, h.rows.map(function (r) { return r.month; }).concat([1]));
    var rows = h.rows.map(function (r) {
      return '<li><span class="hname">' + bdi(r.name) + '<span class="hbar" aria-hidden="true"><span style="width:' + Math.round(r.month / max * 100) + '%"></span></span></span>' +
        '<span class="hnum num">' + esc(r.booked ? hoursWords(r.booked) : "") + '</span><span class="hnum num"><b>' + esc(r.month ? hoursWords(r.month) : "") + "</b></span></li>";
    }).join("");
    var head = '<li class="hhead"><span class="hname">Client</span><span class="hnum">Booked</span><span class="hnum">This month</span></li>';
    var foot = h.rows.length ? '<li class="htotal"><span class="hname">Total</span><span class="hnum num">' + esc(hoursWords(h.total.booked)) + '</span><span class="hnum num"><b>' + esc(hoursWords(h.total.month)) + "</b></span></li>" : "";
    return listBox("hours", "Hours", "i-receipt", hoursWords(h.total.month) + " this month", h.rows.length,
      '<ol class="rows hourlist">' + head + rows + foot + "</ol>", "No client hours this month yet.") + nudgeHtml(boxIdea("hours"));
  }

  /** Double bookings: events on one day that overlap, with a press to sort it out. */
  function drawConflicts(level) {
    var f = state.facts;
    var list = f.conflicts;
    if (level === "S") {
      return sumBox("conflicts", "Double bookings", "i-overlap", String(list.length), list.length ? plural(list.length, "overlap", "overlaps") + " this week" : "None this week",
        list[0] ? "<b>" + esc(dayWord(list[0].day.date, f.today)) + ":</b> " + bdi(shownTitle(list[0].a)) : "");
    }
    var rows = list.map(function (c) {
      return '<li><span class="cday">' + esc(dayWord(c.day.date, f.today) + " " + clock(c.from)) + "</span>" +
        '<span class="cwhat">' + bdi(shownTitle(c.a)) + " <i>and</i> " + bdi(shownTitle(c.b)) + "<small>overlap by " + esc(lengthWords(c.minutes)) + "</small></span>" +
        '<button type="button" class="btn small" data-act="fix-overlap" data-a="' + esc(c.a.id) + '" data-b="' + esc(c.b.id) + '">Help me fix it</button></li>';
    }).join("");
    return listBox("conflicts", "Double bookings", "i-overlap", "", list.length, '<ol class="rows clashes">' + rows + "</ol>", "No double bookings this week.");
  }
  function fixAsk(a, b) {
    return "“" + a.title + "” and “" + b.title + "” overlap on " + longDate(parseDay(a.day)) + ". Suggest what to move and to when so both can still happen. Don't change anything; show me first.";
  }

  /** Your time: where the week's hours go, as one bar and a legend. */
  function drawBalance(level) {
    var f = state.facts;
    var k = f.byKind;
    if (level === "S") {
      return sumBox("balance", "Your time", "i-pie", hoursWords(f.meetHours), "in meetings this week", esc(hoursWords(k.personal / 60)) + " personal");
    }
    var parts = [
      { cls: "client", label: "With others", min: k.client },
      { cls: "team", label: "Team", min: k.team },
      { cls: "other", label: "Other", min: k.other },
      { cls: "personal", label: "Personal", min: k.personal },
      { cls: "free", label: "Free, weekdays", min: Math.round(f.freeHours * 60) }
    ];
    var bar = '<div class="tbar" aria-hidden="true">' + parts.filter(function (p) { return p.min > 0; }).map(function (p) {
      return '<span class="k-' + p.cls + '" style="flex:' + p.min + '" title="' + esc(p.label + ": " + lengthWords(p.min)) + '"></span>';
    }).join("") + "</div>";
    var legend = '<ul class="tlegend">' + parts.map(function (p) {
      return '<li><span class="sw k-' + p.cls + '"></span>' + esc(p.label) + '<b class="num">' + esc(hoursWords(p.min / 60)) + "</b></li>";
    }).join("") + "</ul>";
    return boxHead("balance", "Your time", "i-pie", "this week", null) + '<div class="box-pad">' + bar + legend + "</div>";
  }

  // People you meet: from the routine's list of everyone met in 90 days or booked in 30.
  var FILTERS = [
    { id: "all", label: "All" },
    { id: "quiet", label: "Going quiet" },
    { id: "new", label: "New" },
    { id: "active", label: "Regular" }
  ];
  function sortedPeople(data) {
    return data.clients.slice().sort(function (a, b) {
      var an = a.next ? a.next.day + "T" + pad(a.next.start || 0) : null;
      var bn = b.next ? b.next.day + "T" + pad(b.next.start || 0) : null;
      if (an && bn) return an < bn ? -1 : an > bn ? 1 : 0;
      if (an) return -1;
      if (bn) return 1;
      var al = a.lastMet || "", bl = b.lastMet || "";
      return al > bl ? -1 : al < bl ? 1 : 0;
    });
  }
  function statusChip(c) {
    var s = STATUS[c.status];
    return '<span class="chip ' + (c.status === "quiet" ? "wait" : c.status === "new" ? "lead" : "open") + '">' + esc(s.label) + "</span>";
  }
  function drawPeople(level) {
    var f = state.facts;
    var all = sortedPeople(state.data);
    if (level === "S") {
      return sumBox("people", "Clients", "i-users", String(all.length), "in the last 90 days",
        f.quiet.length ? '<span class="hot">' + f.quiet.length + " going quiet</span>" : "");
    }
    var counts = { all: all.length, quiet: 0, "new": 0, active: 0 };
    all.forEach(function (c) { counts[c.status] += 1; });
    if (state.filter !== "all" && !counts[state.filter]) state.filter = "all";
    var list = all.filter(function (c) { return state.filter === "all" || c.status === state.filter; });
    var seg = '<div class="seg" role="group" aria-label="Show people">' + FILTERS.map(function (fl) {
      return '<button type="button" data-act="filter" data-filter="' + fl.id + '" aria-pressed="' + (state.filter === fl.id) + '">' + esc(fl.label) + '<span class="n">' + (counts[fl.id] || 0) + "</span></button>";
    }).join("") + "</div>";
    var checkAll = f.quiet.length && canAsk() ? '<button type="button" class="btn small" data-act="checkin-all">' + icon("i-reply") + "Check in with everyone going quiet</button>" : "";
    var wide = level === "L";
    var rows = list.map(function (c) {
      var next = c.next ? whenShort(c.next.day, c.next.start, f.today) : "";
      var last = c.lastMet ? sinceWords(c.lastMet, f.today) : "";
      var name = '<span class="pname"><b>' + bdi(c.name) + "</b>" + (c.contact ? "<small>" + bdi(c.contact) + "</small>" : "") + "</span>";
      if (wide) {
        return '<li><button type="button" class="prow" data-act="person" data-id="' + esc(c.id) + '">' + name +
          '<span class="num r">' + c.meetings + "</span><span>" + esc(last || "Not yet") + "</span><span>" + esc(next || "Nothing booked") + "</span>" +
          '<span class="num r">' + esc(hoursWords(c.hours)) + "</span><span>" + statusChip(c) + "</span></button></li>";
      }
      return '<li><button type="button" class="prow" data-act="person" data-id="' + esc(c.id) + '"><span class="ptop">' + name + statusChip(c) + "</span>" +
        '<span class="pline">' + esc((next ? "Next: " + next : "Nothing booked") + " · " + (last ? "Last met " + (/^(Today|Yesterday)$/.test(last) ? last.toLowerCase() : last) : "Not met yet") + " · " + count(c.meetings, "meeting", "meetings") + " in 90 days") + "</span></button></li>";
    }).join("");
    var headRow = wide ? '<div class="phead"><span>Person or company</span><span class="r">Meetings, 90 days</span><span>Last met</span><span>Next</span><span class="r">Hours this month</span><span>Status</span></div>' : "";
    return boxHead("people", "Clients", "i-users", count(all.length, "client", "clients"), null) +
      '<div class="ptools">' + seg + checkAll + "</div>" +
      '<div class="box-body">' + (all.length ? headRow + '<ol class="rows plist' + (wide ? " wide" : "") + '">' + rows + "</ol>" : '<p class="lane-empty">No client meetings in the last 90 days.</p>') + "</div>" + moreButton() + nudgeHtml(boxIdea("people"));
  }

  function drawQuiet(level) {
    var f = state.facts;
    var list = f.quiet;
    if (level === "S") {
      return sumBox("quiet", "Going quiet", "i-hourglass", String(list.length), list.length ? plural(list.length, "client", "clients") + " to get back to" : "Nobody", list[0] ? bdi(list[0].name) : "");
    }
    var rows = list.map(function (c) {
      var last = c.lastMet ? sinceWords(c.lastMet, f.today) : "";
      return '<li><span class="pname"><b>' + bdi(c.name) + "</b><small>" + esc(last ? "Last met " + last : "Not met in 90 days") + "</small></span>" +
        (canAsk() ? '<button type="button" class="btn small" data-act="checkin" data-id="' + esc(c.id) + '">' + icon("i-reply") + "Draft a check-in</button>" : "") + "</li>";
    }).join("");
    return listBox("quiet", "Clients going quiet", "i-hourglass", "", list.length, '<ol class="rows quietlist">' + rows + "</ol>", "No client is going quiet. You've met everyone recently.");
  }

  // ── Before and after ───────────────────────────────────────────────────
  // Meetings with other people today and tomorrow to prepare for, and the ones that ended
  // today to follow up, each with its press ready. A tick takes it off for good (kept per
  // person in cabinet.mine) and the next one moves up.

  var DONE_KEY = "calendar-week-done@1";
  var ROUTINE_DAYS = 3;       // a title on this many days of the week is a routine
  function todayKey() { return ymd(new Date()); }
  function readyThings() {
    var f = state.facts;
    var pre = state.example ? "example:" : "";
    var out = [];
    // A routine that happens on three or more days this week (a daily standup) needs no
    // preparing or following up; and a meeting under way is past preparing for.
    var times = {};
    f.days.forEach(function (d) { d.events.forEach(function (e) { var k = e.title.toLowerCase(); times[k] = (times[k] || 0) + 1; }); });
    f.days.slice(0, 2).forEach(function (d, di) {
      d.events.forEach(function (e) {
        if (!withPeople(e) || e.day !== d.key || times[e.title.toLowerCase()] >= ROUTINE_DAYS || isNow(e)) return;
        var who = whoWords(e);
        if (!hasEnded(e)) {
          out.push({ key: pre + "prep:" + e.id + ":" + e.day, rank: 0, order: di * 1440 + e.start, title: "Prepare for " + e.title,
            why: whenShort(e.day, e.start, f.today) + (who ? ", with " + who : ""), action: { label: "Prep me", act: "prep", id: e.id } });
        } else {
          out.push({ key: pre + "follow:" + e.id + ":" + e.day, rank: 1, order: -endOf(e), title: "Follow up: " + e.title,
            why: "Ended at " + clock(endOf(e)) + (who ? ", with " + who : ""), action: { label: "Draft a follow-up", act: "follow", id: e.id } });
        }
      });
    });
    return out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
  }
  function drawReady(level) {
    var all = readyThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    if (level === "S") {
      return sumBox("ready", "Before and after", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "All done",
        open[0] ? "<b>" + bdi(open[0].title) + "</b>" : "");
    }
    var body = open.length
      ? '<ol class="rows things">' + open.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            (canAsk() ? '<button type="button" class="btn small" data-act="' + t.action.act + '" data-id="' + esc(t.action.id) + '">' + esc(t.action.label) + "</button>" : "<span></span>") + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else to prepare or follow up." : "Nothing to prepare or follow up today.") + "</p>";
    var foot = done ? '<div class="next-foot"><span></span><button type="button" class="btn quiet small" data-act="undone">' + done + " done · Bring back</button></div>" : "";
    return boxHead("ready", "Before and after", "i-check", "", open.length || null) + '<div class="box-body">' + body + "</div>" + foot + moreButton();
  }
  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.ready;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    readyThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }

  // ── Add to your calendar ───────────────────────────────────────────────

  // Fill in a new event, or write to the agent in your own words. Both go to the agent in
  // the chat beside this page, which changes the calendar through Cabinet's Google sign-in.
  var AE_EXAMPLE = { title: "Design review with Acme", where: "Video call", words: "For example: block Friday morning for the Acme project, or move my 2pm call to 4" };
  function aeDraft() {
    if (!state.ae) state.ae = { mode: "form", title: "", day: ymd(new Date()), from: "", to: "", allDay: false, where: "", words: "", note: "" };
    return state.ae;
  }
  function drawAddEvent(level) {
    var d = aeDraft();
    var tab = function (id, words) {
      return '<button type="button" role="tab" data-act="ae-mode" data-mode="' + id + '" aria-selected="' + (d.mode === id) + '">' + words + "</button>";
    };
    var lock = state.conn && state.conn.canChange === false && mode() === "connected"
      ? '<p class="ae-lock">' + icon("i-lock") + "<span>Right now Cabinet only reads your calendar.</span>" +
        '<button type="button" class="btn small" data-act="ae-allow">Let Cabinet add events</button></p>'
      : "";
    var note = d.note || (askReady() ? (d.mode === "agent" ? "A new event waits for your press on its card in the chat. Moving or deleting waits for your yes." : "The event opens as a card in the chat beside this page. Press Add to calendar there.") : askHint());
    var foot = function (button) {
      return '<div class="ae-foot"><button type="submit" class="btn primary">' + icon(d.mode === "agent" ? "i-send" : "i-plus") + button + "</button>" +
        '<p class="note" id="ae-note" role="status">' + esc(note) + "</p></div>";
    };
    var field = function (cls, label, input) { return '<label class="' + cls + '">' + label + input + "</label>"; };
    var form = d.mode === "agent"
      ? '<form class="ae-form" id="ae-form" autocomplete="off"><label for="ae-words" class="sr">What to do on your calendar</label>' +
        '<textarea id="ae-words" data-ae="words" dir="auto" maxlength="800" placeholder="' + esc(AE_EXAMPLE.words) + '">' + esc(d.words) + "</textarea>" +
        foot("Send to the agent") + "</form>"
      : '<form class="ae-form" id="ae-form" autocomplete="off" novalidate>' +
        field("ae-what", "What", '<input id="ae-title" data-ae="title" dir="auto" maxlength="200" placeholder="' + esc(AE_EXAMPLE.title) + '" value="' + esc(d.title) + '" />') +
        field("ae-day", "Day", '<input id="ae-day" data-ae="day" type="date" value="' + esc(d.day) + '" />') +
        (d.allDay ? "" :
          field("ae-from", "From", '<input id="ae-from" data-ae="from" type="time" step="300" value="' + esc(d.from) + '" />') +
          field("ae-to", "To", '<input id="ae-to" data-ae="to" type="time" step="300" value="' + esc(d.to) + '" />')) +
        field("ae-where", "<span>Where <small>(if anywhere)</small></span>", '<input id="ae-where" data-ae="where" dir="auto" maxlength="200" placeholder="' + esc(AE_EXAMPLE.where) + '" value="' + esc(d.where) + '" />') +
        '<label class="ae-allday"><input type="checkbox" data-ae="allDay"' + (d.allDay ? " checked" : "") + " />All day</label>" +
        foot("Prepare the event") + "</form>";
    return boxHead("addevent", "Add to your calendar", "i-plus", "", null) +
      '<div class="box-body"><div class="ae-tabs" role="tablist" aria-label="How to add">' + tab("form", "Fill it in") + tab("agent", "Tell the agent") + "</div>" +
      lock + form + "</div>";
  }
  function redrawAddEvent(focusId) {
    var el = boxEls.addevent;
    if (!el || !el.isConnected) return;
    // drawBox puts back what the first field held; here the draft decides, so a sent form clears.
    var first = el.querySelector("input[data-ae]");
    if (first && first.type !== "checkbox") first.value = aeDraft()[first.getAttribute("data-ae")] || "";
    drawBox(el);
    if (focusId && $(focusId)) $(focusId).focus();
  }
  function setAeNote(words) {
    aeDraft().note = words;
    if ($("ae-note")) $("ae-note").textContent = words;
  }
  /** One hour after a start time, never past midnight. */
  function aeHourLater(from) {
    var min = clockToMin(from);
    if (min === null) return "";
    min = Math.min(min + 60, 23 * 60 + 59);
    return pad(Math.floor(min / 60)) + ":" + pad(min % 60);
  }
  /** The words the agent gets, or null after saying what is missing. */
  function aeWords() {
    var d = aeDraft();
    if (d.mode === "agent") {
      var said = text(d.words, 800);
      if (!said) { setAeNote("Write what you want first."); return null; }
      return "From the Add to your calendar box on my page: " + said;
    }
    var title = text(d.title, 200);
    if (!title) { setAeNote("Give the event a name."); return null; }
    var day = parseDay(d.day);
    if (!day) { setAeNote("Pick a day."); return null; }
    var lines = ["Title: " + title, "Day: " + longDate(day) + " " + day.getFullYear() + " (" + d.day + ")" + (d.allDay ? ", all day" : "")];
    if (!d.allDay) {
      if (clockToMin(d.from) === null) { setAeNote("Pick a start time, or tick All day."); return null; }
      var to = clockToMin(d.to) === null ? aeHourLater(d.from) : d.to;
      if (clockToMin(to) <= clockToMin(d.from)) { setAeNote("The end must come after the start."); return null; }
      lines.push("Time: " + d.from + " to " + to + ", in my calendar's time zone");
    }
    var where = text(d.where, 200);
    if (where) lines.push("Where: " + where);

      lines.join("\n");
  }
  function sendAddEvent() {
    if (!V2) { toast("Open this cabinet in Cabinet to add to your calendar."); return; }
    if (!canAsk()) { toast("Only people who can edit this cabinet can add to it."); return; }
    if (!askReady()) {
      if (state.conn && state.conn.canConnect) { toast("Connect Google Calendar first. It takes a minute."); connect(); }
      else toast(mode() === "not-here" ? "Google Calendar can't connect here yet." : "Ask the owner of this cabinet to connect Google Calendar.");
      return;
    }
    var words = aeWords();
    if (!words) return;
    var d = aeDraft();
    setAeNote("Sending...");
    cab.ask(words, { send: true }).then(function () {
      if (d.mode === "agent") d.words = "";
      else { d.title = ""; d.from = ""; d.to = ""; d.where = ""; }
      d.note = d.mode === "agent" ? "Sent. The agent answers in the chat beside this page." : "Sent. Check the card in the chat beside this page and press Add to calendar.";
      redrawAddEvent();
      toast("Sent to the agent. The answer is in the chat.");

      setAeNote(e && e.message ? e.message : "That didn't go through. Try again.");
    });
  }
  document.addEventListener("input", aeField);
  document.addEventListener("change", aeField);
  function aeField(event) {

    if (!key) return;
    var d = aeDraft();
    if (key === "allDay") {
      if (event.type !== "change") return;
      d.allDay = !!el.checked;

      return;
    }
    d[key] = el.value;

    if (key === "from" && event.type === "change" && !d.to && $("ae-to")) { d.to = aeHourLater(d.from); $("ae-to").value = d.to; }

  }

  // ── Ask, and the ideas ─────────────────────────────────────────────────

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shownNow = shownIdeas();
    if (featured) shownNow[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shownNow[idea.id] && !state.hiddenIdeas[idea.id]; }).slice(0, level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask, or try an idea</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about your week, your free time, who you meet..." />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +

  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */

      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: hide the numbers, show my clients going quiet" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about your week</button></p>';
  }
  function askHint() {
    if (askReady()) return "The answer opens in the chat beside this page.";
    return mode() === "not-here"
      ? "Once Google Calendar works here, you can ask things like these."
      : "Connect Google Calendar first, then ask anything. A question here takes you to connecting.";
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shownList = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shownList.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }

    return listBox("ideas", "Ideas", "i-bulb", "", shownList.length,
      '<ul class="rows idea-rows">' + shownList.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }
  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (fit && fit.q ? ' data-q="' + esc(fit.q) + '"' : "") + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  // An idea offers itself in its box when this week says it would help, with the real
  // event, time or people, at most one per box. "Hide" takes it off the page for good (kept
  // per person in cabinet.mine); the Ideas panel in the top bar always has every one. On the
  // made-up example an idea shows what it would say, but asks only in general terms.

  var HIDDEN_IDEAS_KEY = "calendar-week-hidden-ideas@1";
  function ideaFacts() { return state.facts; }
  /** A meeting worth preparing or following up: with people, and not a routine on three or more days. */
  function worthHelp(f) {
    var times = {};
    f.days.forEach(function (d) { d.events.forEach(function (e) { var k = e.title.toLowerCase(); times[k] = (times[k] || 0) + 1; }); });
    return function (e) { return withPeople(e) && (times[e.title.toLowerCase()] || 0) < ROUTINE_DAYS; };
  }
  var IDEA_FITS = {
    prep: function (f) {
      // The next event already has its own Prep me on the Today box: offer the one after it.
      var e = f.later.filter(worthHelp(f))[0];
      if (!e) return null;
      return { line: "“" + e.title + "” is at " + clock(e.start) + ", " + inWords(e.start - nowMinutes()) + ".", act: "Prep me", q: state.example ? "" : prepAsk(e) };
    },
    follow: function (f) {
      var e = f.earlier.filter(worthHelp(f)).pop();
      if (!e) return null;
      return { line: "“" + e.title + "” ended at " + clock(endOf(e)) + ".", act: "Draft a follow-up", q: state.example ? "" : followAsk(e) };
    },
    overlap: function (f) {
      var c = f.conflicts[0];
      if (!c) return null;
      return { line: (f.conflicts.length === 1 ? "Two events overlap" : f.conflicts.length + " overlaps this week, the first") + " " + onDay(c.day.date, f.today) + " at " + clock(c.from) + ".",
        act: "Help me fix it", q: state.example ? "" : fixAsk(c.a, c.b) };
    },
    protect: function (f) {
      var b = f.best;
      if (!b || b.slot.end - b.slot.start < 120) return null;
      var when = f.bestWords.charAt(0).toLowerCase() + f.bestWords.slice(1);
      var range = clock(b.slot.start) + " to " + clock(b.slot.end);
      var change = changeAllowed(state.data);
      return { line: freeWords(f) + ": " + lengthWords(b.slot.end - b.slot.start) + ".", act: change ? "Keep it free" : "Plan it",
        q: state.example ? "" : change
          ? "Block " + when + " (" + longDate(b.day.date) + ", " + range + ") on my Google Calendar as focus time, so it stays free. Show me exactly what you'll add and wait for my yes."
          : "I'm free " + when + " (" + longDate(b.day.date) + ", " + range + "). Help me plan how to use it well." };
    },
    quiet: function (f) {
      var n = f.quiet.length;

    },
    weekly: function (f) {
      var t = f.today, dow = t.getDay();
      return !isWeekend(t) && (isWeekend(dayAfter(t, 1)) || isWeekend(dayAfter(t, 2))) ? { line: "It's " + DAYS[dow] + ". Sum up your week?", act: "Write it" } : null;
    },
    nextweek: function (f) {
      var t = f.today;
      return isWeekend(t) || isWeekend(dayAfter(t, 1)) ? { line: "Next week starts soon. Plan it now?", act: "Plan next week" } : null;
    },
    people: function () { return { line: "Your calendar already knows who you meet.", act: "List who I meet" }; },
    hours: function (f) {

  // ── One event or person, opened ────────────────────────────────────────

  var sheetFrom = null;
  function openSheet(what) {
    if (!state.sheet) sheetFrom = document.activeElement;
    state.sheet = what;
    paintSheet();
  }
  function closeSheet() {
    if (!state.sheet) return;

  function sheetButton(act, id, iconId, label, primary) {
    return '<button type="button" class="btn' + (primary ? " primary" : "") + '" data-act="' + act + '" data-id="' + esc(id) + '">' + icon(iconId) + esc(label) + "</button>";
  }
  function sheetEvent(e) {
    if (!e) return null;
    var today = startOfToday();
    var d = parseDay(e.day);
    var name = dayWord(d, today);
    var when = (name === DAYS[d.getDay()] ? longDate(d) : name + ", " + longDate(d)) +
      (e.allDay ? ", all day" : ", " + clock(e.start) + untilWords(e));
    var c = clientOf(state.data, e);
    var who = whoWords(e);
    var facts = '<ul class="sfacts"><li>' + icon("i-clock") + "<span>" + esc(when) + (isNow(e) ? ' <span class="chip ok">Now</span>' : "") + "</span></li>" +
      (who ? "<li>" + icon("i-users") + bdi(who) + "</li>" : "") +
      (e.place ? "<li>" + icon("i-pin") + bdi(e.place) + "</li>" : "") +
      "<li>" + icon("i-calendar") + "<span>" + esc(KIND_WORDS[e.kind]) + "</span></li></ul>";
    var acts = "";
    if (!state.example && canAsk()) {
      if (withPeople(e)) acts += hasEnded(e) ? sheetButton("follow", e.id, "i-reply", "Draft a follow-up", true) : sheetButton("prep", e.id, "i-doc", "Prep me", true);
      else acts += sheetButton("ask-event", e.id, "i-chat", "Ask about this", true);
      if (c) acts += sheetButton("about-person", c.id, "i-chat", "What should I know");
      if (changeAllowed(state.data) && !e.allDay) acts += sheetButton("reschedule", e.id, "i-move", "Reschedule");
    }
    if (e.link && !state.example) acts += '<a class="btn" href="' + esc(e.link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Google Calendar</a>";
    return { kicker: e.kind === "client" ? "Meeting with others" : KIND_WORDS[e.kind], title: e.title, sub: c ? c.name : null, facts: facts, acts: acts };
  }
  function sheetPerson(c) {
    if (!c) return null;
    var today = startOfToday();
    var next = c.next ? whenShort(c.next.day, c.next.start, today) : "";
    var facts = '<ul class="sfacts">' +
      (c.contact ? "<li>" + icon("i-users") + "<span>Main contact: " + bdi(c.contact) + "</span></li>" : "") +
      "<li>" + icon("i-calendar") + "<span>" + esc(count(c.meetings, "meeting", "meetings") + " in the last 90 days" + (c.lastMet ? ", last on " + longDate(parseDay(c.lastMet)) : "")) + "</span></li>" +
      "<li>" + icon("i-clock") + "<span>" + (next ? "Next: " + esc(next) + (c.next.title ? ", " + bdi(c.next.title) : "") : "Nothing booked") + "</span></li>" +
      "<li>" + icon("i-receipt") + "<span>" + esc(c.hours ? hoursWords(c.hours) + " of meetings this month" : "No meetings this month") + "</span></li></ul>";
    var acts = "";
    if (!state.example && canAsk()) {
      acts += sheetButton("about-person", c.id, "i-chat", "What should I know", true);

    }

  function paintSheet() {
    var layer = $("layer");
    if (!state.sheet || !state.data) { layer.innerHTML = ""; return; }

    var connectBtn = state.example && mode() === "not-connected" && state.conn && state.conn.canConnect ? connectButton() : "";

      '<button type="button" class="close" data-act="sheet-close" aria-label="Close">' + icon("i-x") + "</button>" +
      '<p class="kicker">' + esc(part.kicker) + '</p><h2 id="sheet-title">' + bdi(part.title) + "</h2>" +
      (part.sub ? '<p class="subtitle">' + bdi(part.sub) + "</p>" : "") +
      (state.example ? '<p class="madeup">This is from the made-up example. Connect Google Calendar and these buttons work on your own week: prep notes, follow-ups and check-ins.</p>' : "") +
      part.facts + (part.acts || connectBtn ? '<div class="acts">' + part.acts + connectBtn + "</div>" : "") + "</div></div>";

  function ideaById(id) {
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].id === id) return IDEAS[i];
    return null;
  }
  /** The idea with what fits today, or null when it is hidden or would not help now. */
  function fitted(idea, facts) {
    if (!idea || state.hiddenIdeas[idea.id] || !state.data) return null;
    var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts || ideaFacts()) : null;
    return fit ? { idea: idea, line: fit.line, act: fit.act, q: fit.q } : null;

  function onPage(boxId) {

  }
  /** The first idea of this box that fits today. */
  function boxIdea(boxId) {
    var facts = ideaFacts();
    for (var i = 0; i < IDEAS.length; i++) {
      if (IDEAS[i].box !== boxId) continue;
      var f = fitted(IDEAS[i], facts);
      if (f) return f;

  }
  /** Ideas the list boxes on the page are showing right now. */

      var el = boxEls[id];

      if (f) shown[f.idea.id] = true;

      if (best || shown[idea.id] || (idea.box !== "ask" && onPage(idea.box))) return;
      best = fitted(idea, facts);
    });
    return best;
  }

  /** "every Monday", "every month": the schedule as the end of "Do this ...". */
  function routineWords(idea) { return idea.when.charAt(0).toLowerCase() + idea.when.slice(1); }

  function nudgeHtml(fit, lead) {
    if (!fit) return "";
    var idea = fit.idea;

      '<div class="nudge-actions">' +
      '<button type="button" class="btn small ' + (lead ? "primary" : "dark") + '" data-act="idea-now" data-idea="' + idea.id + '"' + (fit.q ? ' data-q="' + esc(fit.q) + '"' : "") + (can ? "" : " disabled data-viewer-off") + ">" + esc(fit.act) + "</button>" +
      '<button type="button" class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>" +
      '<button type="button" class="nudge-hide" data-act="idea-hide" data-idea="' + idea.id + '" aria-label="Hide this idea from the page">Hide</button>' +
      "</div></div>";
  }

  function setIdeaHidden(id, hidden) {
    var before = snapshot();
    if (hidden) state.hiddenIdeas[id] = true;
    else delete state.hiddenIdeas[id];
    paintGrid();
    glide(before);
    // The idea that takes its place fades up.
    var idea = ideaById(id);
    var home = idea && boxEls[idea.box];
    if (home && home.isConnected) fadeIn(home.querySelector(".nudge"));
    if (state.drawerOpen) paintDrawer();
    toast(hidden ? "Hidden. You can always find it under Ideas." : "It’s back on your page when it fits your day.");
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(HIDDEN_IDEAS_KEY, Object.keys(state.hiddenIdeas)).catch(function () {

      });
    }
  }

  var DRAWERS = {
    ideas: { title: "Ideas", sub: "One tap to ask now, or to have it done for you on a schedule.", icon: "i-bulb", paint: paintIdeasPanel },

  };

    $("drawer-sub").textContent = kind.sub;
    $("drawer-icon").innerHTML = icon(kind.icon);

  // The Add a box panel: every box by group, the ones on the page ticked.

    var on = {};

      var ids = Object.keys(BOXES).filter(function (id) { return BOXES[id].group === group.id; });

          "<div><b>" + esc(box.title) + "</b><span>" + esc(box.desc) + "</span>" +
          (note ? "<em" + (ready ? "" : ' class="wait"') + ">" + esc(note) + "</em>" : "") + "</div>" +
          (on[id]
            ? '<span class="pick-on" aria-hidden="true">' + icon("i-check") + "</span>"
            : '<button type="button" class="btn small" data-act="add-this" data-add="' + id + '"' + (ready ? "" : " disabled") +
              ' aria-label="Add ' + esc(box.title) + '">' + icon("i-plus") + "Add</button>") +
          "</div>";
      }).join("") + "</section>";
    }).join("");
  }

  // ── Editing the page ───────────────────────────────────────────────────
  // Edit layout turns on a bar above the grid; each box gets a remove button and stops
  // reacting to presses. Every change is kept at once in cabinet.mine, and Undo steps back.

  function startEdit() {
    // Boxes show the size they were given while being arranged, not grown by an open list.
    state.open = {};
    state.expanded = {};
    state.need = {};
    state.editing = true;
    state.undo = [];
    // The page's opening fade ends here, so no box is caught half way into it while moving.
    Object.keys(boxEls).forEach(function (id) { boxEls[id].classList.remove("rise"); });
    paint();
    paintEditbar();
    // The remove and resize handles pop in once, as edit mode starts.
    var grid = $("grid");
    grid.classList.add("fresh");
    setTimeout(function () { grid.classList.remove("fresh"); }, 700);
    toast(phone() ? "Hold a box to move it. Pick its size on top." : "Drag a box to move it. Pull its corner to resize it.");
  }
  function doneEdit() {
    state.editing = false;

    closeDrawer();
    paint();
    paintEditbar();
  }
  function paintEditbar() {

    $("undo-btn").disabled = !state.undo.length;
  }

  function saveLayout() {
    if (!V2 || !cab.mine || typeof cab.mine.set !== "function") return;

    });
  }
  function changeLayout(next, easing) {

    saveLayout();
    paintGrid();
    glide(before, null, easing);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  function removeBox(id) {
    var el = boxEls[id];

    if (el) el.classList.add("leaving");

  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {

    closeDrawer();
    var el = boxEls[id];

  function resetLayout() {

  }

    paintGrid();
    glide(before);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  // ── Asking the agent to change the page ────────────────────────────────
  // The agent cannot reach a person's layout (it lives in cabinet.mine), so it writes what
  // to add and remove into data/layout-change.json. The page shows that with Apply and
  // No thanks, and remembers in cabinet.mine which change it last showed.

  var CHANGE_SEEN_KEY = "calendar-freelance-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {
    var menu = $("layout-menu");
    var r = button.getBoundingClientRect();
    state.menuOpen = true;
    menu.hidden = false;
    menu.style.top = r.bottom + 6 + "px";
    menu.style.left = Math.max(16, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 16)) + "px";
    button.setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();
  }
  function closeMenu() {
    if (!state.menuOpen) return;

    if (button) { button.setAttribute("aria-expanded", "false"); button.focus(); }
  }

  /** The words sent with a layout request: the boxes on the page now and who is asking. */
  function layoutWords(wish) {
    var on = placed().map(function (spot) { return BOXES[spot.id].title; });
    var me = myName();
    return "Change the boxes on my week page." + (me ? " I am " + me + "." : "") +
      " On it now: " + (on.length ? on.join(", ") : "no boxes") + ". What I want: " + wish;
  }
  function myName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    // Without a cloud sign-in Cabinet says "You": that is no name, so the greeting leaves it out.
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    return /^you$/i.test(name) ? "" : name;
  }
  /** The Ask box takes the request when it is on the page; otherwise the chat's own box does. */
  function askAboutLayout() {
    var el = boxEls.ask;
    if (onPage("ask") && el && el.isConnected) {
      state.layoutAsk = true;
      setAskNote("");
      drawBox(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if ($("ask-input")) $("ask-input").focus({ preventScroll: true });
      return;
    }
    cab.ask(layoutWords(""), { send: false }).then(function () {
      toast("Finish the sentence in the chat. The agent's suggestion shows up on this page.");
    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });
  }
  function sendLayoutAsk(wish) {
    var words = text(wish, 600);
    if (!words) return;
    setAskNote("Sending...");
    cab.ask(layoutWords(words), { send: true }).then(function () {
      state.layoutAsk = false;
      if ($("ask-input")) $("ask-input").value = "";
      setAskNote("Sent. The agent's suggestion shows up at the top of this page.");
      if (boxEls.ask) drawBox(boxEls.ask);
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
    });
  }
  function stopLayoutAsk() {
    state.layoutAsk = false;
    setAskNote("");
    if (boxEls.ask) drawBox(boxEls.ask);
  }

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    function ids(list) {
      return Array.isArray(list) ? list.filter(function (id, i) { return typeof id === "string" && BOXES[id] && list.indexOf(id) === i; }) : [];
    }
    return { at: d.at, for: text(d.for, 80), add: ids(d.add), remove: ids(d.remove), note: text(d.note, 300) };
  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {
    var c = state.change;
    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = myName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });
    if (!add.length && !remove.length && !c.note) return null;
    return { at: c.at, add: add, remove: remove, note: c.note };
  }
  // A number box can share its subject with a list ("Free hours"), so it says it is the number.
  function titles(ids) {
    return ids.map(function (id) { return BOXES[id].title + (BOXES[id].group === "numbers" ? " (number)" : ""); }).join(", ");
  }
  function paintSuggest() {
    var el = $("suggest");
    if (state.changeApplied) {
      el.hidden = false;
      el.innerHTML = "<p><b>Your page changed.</b></p>" +
        '<div class="suggest-actions"><button type="button" class="btn" data-act="change-undo">' + icon("i-undo") + "Undo</button>" +
        '<button type="button" class="btn dark" data-act="change-ok">OK</button></div>';
      return;
    }
    var c = state.loaded ? pendingChange() : null;
    el.hidden = !c;
    if (!c) { el.innerHTML = ""; return; }
    var parts = [];
    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");
    el.innerHTML = "<p>" + (parts.length ? "<b>The agent suggests:</b> " + esc(parts.join(", and ")) + "." : "<b>From the agent:</b>") +
      (why ? '<span class="why" dir="auto">' + esc(why) + "</span>" : "") + "</p>" +
      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">' + icon("i-check") + "Apply</button>" +
          '<button type="button" class="btn" data-act="change-skip">No thanks</button>'
        : '<button type="button" class="btn" data-act="change-skip">OK</button>') + "</div>";
  }
  function markChangeSeen(at) {
    state.changeSeen = at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(CHANGE_SEEN_KEY, at).catch(function () {});
  }
  function applyChange() {
    var c = pendingChange();
    if (!c) return;
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return c.remove.indexOf(b.id) < 0; });
    c.add.forEach(function (id) {
      var box = BOXES[id];
      var w = Math.min(box.w, COLS);
      var at = freeSpot(w, box.h, next);
      next.push({ id: id, x: at.x, y: at.y, w: w, h: box.h });
    });
    markChangeSeen(c.at);
    state.changeApplied = true;
    changeLayout(next);
    paintSuggest();
  }
  function skipChange() {
    var c = pendingChange();
    if (c) markChangeSeen(c.at);
    paintSuggest();
  }

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a
  // moment first, so the page still scrolls under a passing finger; outside edit mode the
  // hold also starts editing. While a box moves, the others make room live and an outline
  // shows where it lands. The corner handle resizes it on the grid, naming the size it
  // reaches. On a phone a box moves up and down its column; its size is a switch.

  var HOLD_MS = 600;
  var SLOP = 8;
  /** How far a mouse moves, pressed, before the box comes along: a slip of the hand is not a move. */
  var DRAG_START = 10;
  /** How far past a border (in cells) the moving box must be before the others make room. */
  var STICK = 0.8;
  var drag = null;
  var press = null;
  var hold = null;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function spotIn(spots, id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  function gridMetrics() {
    var r = $("grid").getBoundingClientRect();
    return { left: r.left, top: r.top, col: (r.width + GAP) / COLS, row: ROW + GAP };
  }
  /** The page with one box put at x, y and sized w by h, every other box making room. */
  function previewWith(id, x, y, w, h) {
    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }
      return b;
    }), id);
  }
  function showSpots(spots) {
    spots.forEach(function (s) {
      var el = boxEls[s.id];
      if (!el) return;
      el.style.gridColumn = s.x + 1 + " / span " + s.w;
      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {
    var at = {};
    spots.forEach(function (s) { at[s.id] = s; });
    var before = copyLayout(state.layout || DEFAULT_LAYOUT);
    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }
    changeLayout(next, easing);
    return true;
  }
  /** Nothing changed: every box glides back to the place it already had. */
  function settleBack(easing) {
    var before = snapshot();
    letGo();
    paintGrid();
    glide(before, null, easing);
  }

  // The outline where a moving box lands, and the size a resized box has reached.
  function overlay(cls) {
    var grid = $("grid");
    var el = grid.querySelector("." + cls);

      grid.appendChild(el);

  }
  /** Puts the outline (or the size label) on a spot; once shown, it glides from spot to spot. */
  function placeOverlay(el, s) {
    var was = el.style.gridColumn && motionOK() ? el.getBoundingClientRect() : null;
    if (was) el.getAnimations().forEach(function (a) { a.cancel(); });
    el.style.gridColumn = s.x + 1 + " / span " + s.w;
    el.style.gridRow = s.y + 1 + " / span " + s.h;

  function clearOverlays() {

  }
  /** "Medium: 3 rows": what a box shows at the size it has now. */
  function sizeWords(el) {
    var id = el.getAttribute("data-box");
    var level = el.getAttribute("data-level") || "M";
    var name = LEVEL_WORDS[level];
    if (!BOXES[id].list) return name;
    if (level === "S") return name + ": the total only";
    var n = el.querySelectorAll(".rows > li:not([hidden]), .cards > li:not([hidden])").length;
    return n ? name + ": " + n + " " + plural(n, "row", "rows") : name;
  }

  function beginDrag(kind, el, x, y, touch) {
    var id = el.getAttribute("data-box");
    var r = el.getBoundingClientRect();
    var spot = spotIn(placed(), id);
    if (!spot) return;
    drag = { kind: kind, id: id, el: el, touch: !!touch, x: x, y: y, x0: x, y0: y, scroll0: window.scrollY, spots: null };
    if (kind === "stack") {
      var boxes = Array.prototype.filter.call($("grid").children, function (c) { return c.hasAttribute("data-box"); });
      drag.boxes = boxes;
      drag.from = boxes.indexOf(el);
      drag.to = drag.from;
      drag.gap = parseFloat(getComputedStyle($("grid")).rowGap) || GAP;
      drag.step = r.height + drag.gap;
      drag.mids = boxes.map(function (b) { var br = b.getBoundingClientRect(); return br.top + window.scrollY + br.height / 2; });
    } else if (kind === "move") {
      drag.w = spot.w;
      drag.h = spot.h;
      drag.grabX = x - r.left;
      drag.grabY = y - r.top;
    } else {
      drag.sx = spot.x;
      drag.sy = spot.y;
      drag.pw0 = r.width;
      drag.ph0 = r.height;
    }
    // Whatever was still animating this box lets go of it, or it would hold the box still
    // while the hand moves.
    el.classList.remove("rise");
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.classList.add(kind === "size" ? "sizing" : "lifted");
    $("grid").classList.add("arranging");
    document.body.classList.add(kind === "size" ? "is-sizing" : "is-moving");
    if (touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* not allowed here */ } }

  function moveDrag(x, y) {
    drag.x = x;
    drag.y = y;
    if (drag.kind === "stack") moveInColumn();
    else if (drag.kind === "move") moveOnGrid();
