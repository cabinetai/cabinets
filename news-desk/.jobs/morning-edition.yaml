id: morning-edition
name: Morning Edition
enabled: true
schedule: 30 6 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: news-analyst
agentSlug: news-analyst
timeout: 900
prompt: |-
  Write this morning's edition.

  Your working directory is the cabinet root. Every edition lives in `editions/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-news-desk.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by name and
  opens the newest, so a name in any other shape is an edition nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there.

  1. Read your persona, then `setup.md`. The persona holds the file shape, the
     facts-vs-angle rule and the selection bar; setup.md holds the sites, topics,
     lens and skip list. This prompt repeats neither.
  2. Read this morning's front pages of the sites in setup.md — those sites and
     nowhere else — and pick the stories by the persona's selection bar.
  3. If the web is unreachable, STOP HERE. Write nothing, leave `editions/` exactly
     as you found it, example and all, and report: "I couldn't reach the news sites
     this morning — nothing was written. I'll try again tomorrow, or run me again
     now." Then exit. Never write an edition from memory of what the news probably
     is.
  4. If some sites load and others don't, write the edition from what loaded and
     mark the rest `unreachable` under Sources.
  5. On the first run that reads real sites, write your dated file and then delete
     `editions/EXAMPLE-news-desk.md`. It is a demo, not a morning's news. Never
     write `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: how many stories made the cut and
  which one leads.
