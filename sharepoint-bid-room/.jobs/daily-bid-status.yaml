id: daily-bid-status
name: Daily Bid Status
enabled: true
schedule: 30 7 * * 1-5
provider: codex-cli
adapterType: claude_local
ownerAgent: bid-captain
agentSlug: bid-captain
timeout: 900
prompt: |-
  Write this morning's bid status page.

  Your working directory is the cabinet root. Every page lives in `status/`, one file per
  run, named `<YYYY-MM-DD>T<HH-MM-SS>-bid-status.md`, the local time you ran and then that
  exact postfix. The page reads the folder, sorts by the name and opens the newest, so a
  name in any other shape is a page nobody will see. You only ever ADD a file: never
  overwrite, rename or delete one already sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the five
     columns, the `State` vocabulary, the row order, how the parts are worked out and the
     tone. This prompt does not repeat them.
  2. Find the connected SharePoint bid folder in this cabinet. It is the folder that is
     neither `status/` nor `bid-status/`, mounted view only by the SharePoint connector.
     Read it and work out where every part of the bid stands.
  3. This run is read only, and the folder is mounted so that it has to be. Do not create,
     edit, rename, move, copy or delete anything inside it, and do not mail, message or
     post about the bid. You write into `status/` and nowhere else.
  4. If there is no connected bid folder, STOP HERE. Write nothing. Leave `status/` exactly
     as you found it, example and all, and report: "The bid folder is not connected yet.
     Open Cabinet's integrations screen, connect SharePoint, and pick the folder. I would
     have listed every part of the bid with its state, its owner and its date." Then exit.
  5. Same if the folder is there but unreadable, or holds nothing that looks like a bid.
     Say which, touch no file, exit. A status page you could not read the folder for is
     worse than no page: never fall back to the example's contents, to yesterday's file, or
     to the parts a bid like this one usually has.
  6. A morning where nothing moved is a real result. Write the file, say so in the
     headline, and keep every row. Never drop a part because it did not change overnight.
  7. On the first run that does reach a real bid folder, write your dated file and then
     delete `status/EXAMPLE-bid-status.md`. It is a demo, not a past morning, and it must
     not sit in the date list beside real ones. Do not merge with it, do not rename it, and
     never write `EXAMPLE` into a name of your own.
cabinetPath: sharepoint-bid-room
createdAt: '2026-09-16T09:00:00.000Z'
updatedAt: '2026-09-16T09:00:00.000Z'
