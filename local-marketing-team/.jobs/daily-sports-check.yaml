id: daily-sports-check
name: Daily Sports Check
enabled: false
schedule: 0 7 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: local-researcher
agentSlug: local-researcher
timeout: 600
prompt: |-
  Check the sports schedule for the next 10 days. Use the local-event-research skill.
  1. Read the Sports section of /sources.md and the location list in /locations.md.
  2. For each team listed, confirm home games in the next 10 days on the team's official
     schedule page: date, kickoff time, opponent and broadcast.
  3. Update the matching file in /events/ (or create one following /events/index.md). When a
     kickoff time is announced, set time_status: confirmed and update start to the full datetime.
     Never guess a kickoff time or opponent; keep TBA until announced.
  4. If a kickoff time changed or was just announced and an opportunity in /opportunities/ or a
     campaign in /campaigns/ links to that event, add a dated note under "Risks and constraints"
     in the opportunity and tell the Marketing Lead which pickup windows or placeholders need
     updating.
  5. Set last_refreshed in /events/index.md to the current ISO datetime.
  Finish with a list of games found, what changed since the last check, and anything still TBA.
createdAt: '2026-10-02T00:00:00.000Z'
updatedAt: '2026-10-02T00:00:00.000Z'
