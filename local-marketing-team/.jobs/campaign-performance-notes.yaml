id: campaign-performance-notes
name: Campaign Performance Notes
enabled: false
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
ownerAgent: marketing-lead
agentSlug: marketing-lead
timeout: 900
prompt: |-
  Summarize how this week's campaigns performed and update the team's learnings.
  1. List every folder in /campaigns/ whose brief (index.md) has status live, or status done
     with an end date in the last 7 days.
  2. For each, read the Results section of the brief. If results are still blank, do not invent
     numbers: add a checklist line asking a human to fill them in, and skip to the next campaign.
  3. Where results exist, compare them with the brief's Goal and KPIs. Set status: done for
     campaigns whose end date has passed.
  4. Add one row per finished campaign to the Campaign log table in /learnings.md (campaign,
     dates, result, lesson) and add or refine at most two Standing lessons. Update last_updated.
  5. If a lesson changes how a promotion should be matched (timing, location, segment), add a
     short dated note under that promotion's Notes in /promotions.md. Do not change offers or
     prices.
  Finish with a short summary: campaigns reviewed, results missing, new lessons.
createdAt: '2026-10-02T00:00:00.000Z'
updatedAt: '2026-10-02T00:00:00.000Z'
