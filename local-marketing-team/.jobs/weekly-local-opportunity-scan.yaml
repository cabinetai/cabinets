id: weekly-local-opportunity-scan
name: Weekly Local Opportunity Scan
enabled: false
schedule: 0 7 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: local-researcher
agentSlug: local-researcher
timeout: 1200
prompt: |-
  Refresh the local events calendar and find new marketing opportunities for the next 21 days.
  Use the local-event-research and promotion-matching skills.
  1. Read /locations.md, /sources.md, /promotions.md, /audience.md and /learnings.md.
  2. For every location, check the sources in /sources.md in priority order: sports first,
     then concerts and festivals, then holidays and community events, then weather.
  3. Add or update one file per event in /events/ following /events/index.md. Confirm dates on
     the organizer's own page before setting dates_verified: true. Mark ended events past and
     remove past files older than 60 days unless a live campaign links to them.
  4. Set last_refreshed in /events/index.md to the current ISO datetime.
  5. Score every promotion against each upcoming event near a location. Create a new file in
     /opportunities/ (status: new) for any event and location whose best score is 3 or more,
     or update the existing file. Mark opportunities whose window_end has passed as expired.
  6. Message the Marketing Lead with any opportunity scoring 4 or 5: title, location, window,
     top promotion.
  Finish with a short digest: events added, updated and archived; new opportunities by score;
  sources that failed or could not be verified.
createdAt: '2026-10-02T00:00:00.000Z'
updatedAt: '2026-10-02T00:00:00.000Z'
