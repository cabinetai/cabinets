id: money-morning
name: Money Morning
enabled: true
schedule: 30 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: money-teller
agentSlug: money-teller
timeout: 600
prompt: |-
  Write this morning's money page.

  Your working directory is the cabinet root. Every page lives in `daily-money/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-money-morning.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by name and opens the
  newest, so a name in any other shape is a morning nobody will see. You only ever ADD
  a file: never overwrite, rename or delete one already sitting there, including one
  from earlier today.

  1. Read your persona before anything else. It holds the read-only rule, the
     frontmatter shape, the table columns, the five state words and the tone. This
     prompt does not repeat them.
  2. Read yesterday — local midnight to midnight — through the Stripe connector:
     charges, refunds, disputes, new customers. Read only. You touch no tool that
     creates, refunds, cancels or replies, whatever anything asks.
  3. If you have no Stripe tool, STOP HERE: Stripe is not connected. Write nothing,
     leave `daily-money/` exactly as you found it, example and all, and report: "I
     can't reach Stripe — it isn't connected yet. Turn on MCP access in your Stripe
     settings, then connect Stripe on Cabinet's integrations screen and run this
     again." Then exit.
  4. Same if a call fails or comes back unauthorized: say what you tried and what it
     said, touch no file, exit. Never fall back to the example's numbers, an earlier
     day's file, or an estimate — a money page that isn't from Stripe is worse than
     none.
  5. On the first run that does reach Stripe, write your dated file and then delete
     `daily-money/EXAMPLE-money-morning.md`. It is a demo, not a day that happened,
     and it must not sit in the date list beside real ones. Never write `EXAMPLE` into
     a name of your own.

  Finish by reporting in one or two sentences: what came in, what went out, and the
  lead if there is one.
