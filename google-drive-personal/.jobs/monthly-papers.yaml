id: monthly-papers
name: Important papers
enabled: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: file-helper
agentSlug: file-helper
timeout: 1500
prompt: |-
  Find the person's important papers in Google Drive, and the dates in them for the coming
  year: what expires, renews, ends or falls due.

  Your working directory is the cabinet root. Your persona's "The 1st of the month: important
  papers" holds the search, how to read a paper and the shape of the file.

  1. In one Bash call, run `eval "$(node my-files/first-sort.mjs window)"`, print `$NOW`,
     read `my-files/setup.md` and, if it is there, `my-files/data/papers.json`, and make
     `my-files/data/.work/`.
  2. If your Google Drive line says Drive is not connected through Sign in with Google, write
     only `my-files/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Search find-papers.json, then read at most six papers that may hold a date: a Google Doc or
     Sheet exported as text into `.work/`, any other file downloaded into `.work/` and read.
  4. In one Bash call, write `.work/papers-out.json`, run
     `node my-files/first-sort.mjs save papers @papers-out.json`, write
     `reports/<YYYY-MM>-papers.md` and `my-files/data/status.json` with `ok: true`, and run
     `node my-files/first-sort.mjs clean`.

  Only read Drive: never change, comment on or share a file.

  Finish in one plain sentence about the papers and nothing else: the next date, what it is
  and in which file.
createdAt: '2026-10-12T00:00:00.000Z'
updatedAt: '2026-10-12T00:00:00.000Z'
