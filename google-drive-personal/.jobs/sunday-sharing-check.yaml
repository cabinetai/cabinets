id: sunday-sharing-check
name: Sunday sharing check
enabled: true
cloudOnly: true
schedule: 0 9 * * 0
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: file-helper
agentSlug: file-helper
timeout: 900
prompt: |-
  Do this Sunday's sharing check: which of the person's files anyone with the link can open.

  Your working directory is the cabinet root. Your persona's "Sunday: the sharing check" holds
  the search, what counts as private and the shape of the file.

  1. In one Bash call, run `eval "$(node my-files/first-sort.mjs window)"`, print `$NOW`,
     read `my-files/setup.md` (what the person calls private) and make `my-files/data/.work/`.
  2. If your Google Drive line says Drive is not connected through Sign in with Google, write
     only `my-files/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Search about.json and anyone.json.
  4. In one Bash call, write `.work/sharing.json`, run
     `node my-files/first-sort.mjs save sharing @sharing.json`, write
     `reports/<YYYY-MM-DD>-sharing.md` and `my-files/data/status.json` with `ok: true`, and
     run `node my-files/first-sort.mjs clean`.

  Only read Drive: never change who can open a file, never share or unshare.

  Finish in one plain sentence about the files and nothing else: how many are open to anyone,
  and the most private one, if there is one.
createdAt: '2026-10-12T00:00:00.000Z'
updatedAt: '2026-10-12T00:00:00.000Z'
