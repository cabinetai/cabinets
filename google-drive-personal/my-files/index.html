<!DOCTYPE html>
<!--
  Drive for Personal: my files. The cabinet opens on this page.

  For anyone with a Google Drive at home: where their important papers are (passport, insurance,
  the lease, the car, taxes), the dates inside them (what expires, what renews), what family and
  friends shared with them, where they left off, what anyone with the link can open, and what
  fills their Drive. An Ideas gallery of everyday plays, each one tap to ask now or to switch on
  as a routine.

  Where the words come from: the morning routine reads Google Drive and writes data/latest.json
  next to this page; the Sunday routine writes data/sharing.json and the monthly one
  data/papers.json (their shapes are the data/EXAMPLE-*.json files: a made-up person, always
  labelled as an example here). A routine that could not read Drive writes data/status.json
  with ok:false and why. setup.md holds what the person told the cabinet.

  How it talks to Cabinet: window.cabinet v2 (connection state, connect, ask, run the routine,
  read files). In an older Cabinet it reads the same files over the page's own address and says
  to connect Google Drive from Integrations. It never changes anything in Drive: answers and
  routines go through the chat, where the agent asks first.

  One file on purpose: a sealed frame cannot load files next to it, so the banner picture is
  inside it. Literata for titles and Figtree for text, from Google Fonts with system fallbacks;
  icons are inline SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My files</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500..700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* "My files": a box of papers on a warm sand banner, the greeting by the hour on its left.
     Under it plain white sheets on a soft paper canvas. Ink blue is the page's own (buttons,
     the Ask box); clay marks the box titles. Red only for what is open to anyone or expires
     soon, amber only for what waits, green only for done. Every text color here passes WCAG AA
     on the color it sits on. */
  :root {
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --display: var(--serif);
    --canvas: #f1ece4;
    --page: #ffffff;
    --panel: #f7f3ed;
    --panel-2: #eee8de;
    --line: #ebe4d9;
    --line-2: #d8cfc1;
    --ink: #1f1c18;
    --ink-2: #3f3a33;
    --ink-3: #5f584e;
    --navy: #22324a;
    --brass: #a8552f;
    --brass-ink: #8a4220;

    /* The banner: the color the picture is painted on, so the two are one surface. */
    --banner: #e8d9c4;
    --banner-ink-2: #3a3128;

    --terra: #c4472a;
    --terra-ink: #9b3116;
    --terra-deep: #7d2510;
    --terra-tint: #fcefea;
    --terra-line: #f2d2c7;
    --slate: #4f5d67;
    --slate-ink: #36434c;
    --slate-tint: #ecf0f2;
    --sage: #2c4a7a;
    --sage-ink: #213a61;
    --sage-deep: #213a61;
    --sage-tint: #e9eff8;
    --sage-line: #cdd9ec;
    --sand: #9c7433;
    --sand-ink: #6f4f17;
    --sand-tint: #f6efe0;
    --done: #1f6b4f;

    --shadow-1: 0 1px 2px rgba(31, 28, 24, .05), 0 6px 18px -12px rgba(31, 28, 24, .18);
    --shadow-2: 0 2px 4px rgba(31, 28, 24, .05), 0 16px 34px -18px rgba(31, 28, 24, .28);
    --radius: 20px;
    --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  ::selection { background: color-mix(in srgb, var(--brass) 26%, transparent); }
  html { scrollbar-color: var(--line-2) transparent; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--slate-ink); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--sage) 50%, transparent); outline-offset: 2px; border-radius: 10px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .bar { border-bottom: 1px solid var(--line); background: var(--canvas); }
  .bar-in { max-width: 1280px; margin: 0 auto; padding: 16px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .mark .icon { width: 22px; height: 22px; stroke-width: 1.9; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--ink-3); font-size: 14px; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .status .btn { min-height: 40px; padding: 8px 15px; font-size: 14px; }
  .pill .when { font-weight: 500; opacity: .85; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px; border-radius: 999px; background: var(--panel); font-weight: 600; font-size: 14px; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
  .pill.ok { background: var(--sage-tint); color: var(--sage-ink); }
  .pill.ok .dot { background: var(--sage); }
  .pill.warn { background: var(--sand-tint); color: var(--sand-ink); }
  .pill.warn .dot { background: var(--sand); }
  .pill.off { background: var(--terra-tint); color: var(--terra-ink); }
  .pill.off .dot { background: var(--terra); }
  .updated { color: var(--ink-3); font-size: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
    border-radius: 999px; border: 1px solid var(--line-2); background: var(--page); color: var(--ink);
    font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
    box-shadow: var(--shadow-1); transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover { background: var(--panel); border-color: #c9c5bb; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { cursor: default; opacity: .6; transform: none; }
  .btn.primary { background: var(--sage); border-color: var(--sage); color: #fff; box-shadow: 0 8px 18px -10px rgba(34, 75, 58, .7); }
  .btn.primary:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.dark:hover { background: #2d3442; }
  .btn.big { min-height: 52px; padding: 13px 26px; font-size: 17px; }
  .btn.quiet { border-color: transparent; box-shadow: none; background: transparent; color: var(--slate-ink); padding-inline: 10px; }
  .btn.quiet:hover { background: var(--slate-tint); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 28px 40px; }
  .main { display: flex; flex-direction: column; gap: 26px; }

  /* ── Hero: the one answer and the numbers ────────────────────────────── */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .hero h2 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -.03em; }
  .hero .lead { margin: 10px 0 0; font-size: 18px; color: var(--ink-2); max-width: 70ch; }
  .hero .lead b { color: var(--ink); font-weight: 700; }
  .hero .fine { margin: 8px 0 0; font-size: 15px; color: var(--ink-3); }
  .hero .actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label value" "sub value"; align-items: center; gap: 4px 12px; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--page); text-decoration: none; color: inherit; min-height: 44px;
  }
  .kpi { transition: transform .15s ease, box-shadow .15s ease; }
  .kpi:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .kpi .label { grid-area: label; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .kpi .label .icon { width: 18px; height: 18px; color: var(--ink-3); }
  .kpi .value { grid-area: value; font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; text-align: end; }
  .kpi .sub { grid-area: sub; font-size: 14px; color: var(--ink-3); }
  .kpi.first { background: var(--terra-tint); border-color: var(--terra-line); }
  .kpi.first .value { color: var(--terra-ink); }
  .kpi.calm { background: var(--sage-tint); border-color: var(--sage-line); }
  .kpi.calm .value, .kpi.calm .sub { color: var(--sage-ink); }
  .kpi .value.none, .kpi.money .value.none { color: var(--ink-3); }
  .kpi .sub .hot { color: var(--terra-ink); font-weight: 700; }

  /* The panel under a connection problem or before the first sort. */
  .card-hero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center;
    padding: 26px 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--page);
    box-shadow: var(--shadow-2);
  }
  .art { width: 132px; height: 104px; }
  .card-hero h2 { font-size: clamp(24px, 2.8vw, 32px); }
  .steps { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 15px; }
  .steps li { display: flex; align-items: center; gap: 8px; }
  .steps .icon { color: var(--sage); width: 18px; height: 18px; }

  .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--terra-tint); color: var(--ink); border: 1px solid var(--terra-line); }
  .notice .icon { color: var(--terra-ink); margin-top: 2px; }
  .notice p { margin: 0; }
  .notice .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }

  #ribbon:empty { display: none; }
  .ribbon { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-radius: 12px; background: var(--sand-tint); border: 1px solid #eadfca; }
  .ribbon p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .tag-example { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

  /* ── Boxes with a list ───────────────────────────────────────────────── */
  /* Plain white sheets: no border, a soft shadow, and a list inside. */
  .lane { border: 0; border-radius: var(--radius); background: var(--page); overflow: hidden; box-shadow: var(--shadow-1); }
  /* A box title: a plain outline icon and a bold word, nothing around them. */
  .lane-head { display: flex; align-items: center; gap: 11px; margin: 0 20px 2px; padding: 18px 0 10px; }
  .lane-head .lane-icon { display: inline-grid; place-items: center; color: var(--brass); }
  .lane-head .lane-icon .icon { width: 22px; height: 22px; stroke-width: 1.8; }
  .lane-head h3 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.015em; color: var(--ink); flex: 1; }
  .lane-head .count { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-3); }
  .lane-head .total { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-2); }
  .lane.waiting .count:not(.zero) { color: var(--terra-ink); }
  /* Nobody waiting is done, not pending: the accent turns sage. */

  /* Your next 3 things: a numbered list to tick off. Terracotta while something waits,
     sage once all is done. */
  .things > li.thing { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .things > li.thing:last-child { border-bottom: 0; }
  .thing .tick { width: 28px; height: 28px; flex: none; display: grid; place-items: center; padding: 0; border: 2px solid var(--line-2); border-radius: 50%; background: var(--page); color: transparent; transition: border-color .15s ease, color .15s ease, background .15s ease; }
  .thing .tick .icon { width: 15px; height: 15px; stroke-width: 2.8; }
  .thing .tick:hover { border-color: var(--sage); color: var(--sage); }
  .thing .tick.ticked { background: var(--sage); border-color: var(--sage); color: #fff; }
  .thing .n { min-width: 14px; font-size: 14px; font-weight: 800; color: var(--ink-3); }
  .thing .what { min-width: 0; }
  .thing .what b { display: block; font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; }
  .thing .what span { display: block; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .thing .btn { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .box[data-level="M"] .thing { grid-template-columns: auto minmax(0, 1fr); }
  .box[data-level="M"] .thing .n { display: none; }
  .box[data-level="M"] .thing .btn { grid-column: 2; justify-self: start; margin-top: 4px; }
  .next-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 4px 8px 4px 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13.5px; }
  .next-foot .btn { min-height: 32px; padding: 4px 10px; font-size: 13.5px; }
  .all-done { display: flex; align-items: center; gap: 10px; color: var(--sage-ink); font-weight: 600; }
  .all-done .icon { color: var(--sage); }

  /* This week: a list by day, or a strip of seven days when there is room. */
  .agenda > li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .agenda > li:last-child { border-bottom: 0; }
  .agenda .day { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .agenda .t { min-width: 0; overflow-wrap: anywhere; }
  .agenda .t small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .agenda .amt { font-weight: 700; }
  .agenda .quote .amt { color: var(--sage-ink); }
  .agenda .person .t small { color: var(--terra-ink); }
  .strip { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .strip .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 8px; border-inline-end: 1px solid var(--line); }
  .strip .col:last-child { border-inline-end: 0; }
  .strip .col.today { background: #f6f9f7; }
  .strip .dname { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .strip .dnum { margin-top: -4px; font-size: 20px; font-weight: 800; }
  .strip .col.today .dnum, .strip .col.today .dname { color: var(--sage); }
  .ev { display: block; padding: 6px 8px; border-radius: 10px; background: var(--slate-tint); color: var(--slate-ink); font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .ev b { display: block; font-weight: 700; }
  .ev.quote { background: var(--sage-tint); color: var(--sage-ink); }
  .ev.person { background: var(--terra-tint); color: var(--terra-ink); }
  .ev-more { font-size: 12px; color: var(--ink-3); padding-inline-start: 4px; }
  .lane.waiting .count.zero { color: var(--ink-3); }
  .lane-empty { padding: 18px; color: var(--ink-3); margin: 0; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  /* A row is a line in a note: the name in bold, then plain words. No faces, no badges. */
  .row-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: start; width: 100%; text-align: start; padding: 13px 20px; border: 0; background: transparent; }
  .row-main:hover { background: var(--panel); }
  .row.open .row-main { background: var(--panel); }
  .avatar { display: none; }
  .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .who b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .who .co { color: var(--ink-3); font-size: 14px; }
  .when { font-size: 14px; color: var(--ink-3); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; grid-row: span 2; }
  .drafted { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--sage-ink); }
  .drafted .icon { width: 14px; height: 14px; }
  .gist { grid-column: 1; color: var(--ink-2); font-size: 15.5px; overflow-wrap: anywhere; }
  /* Labels are words, not pills: grey for what kind of mail it is, red only when it is late. */
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 0; border-radius: 0; font-size: 13px; font-weight: 600; background: none; color: var(--ink-3); white-space: nowrap; }
  .chip .icon { width: 13px; height: 13px; stroke-width: 2.2; }
  .chip.hot, .chip.wait, .chip.soon { color: var(--terra-ink); }
  .chip.hot { font-weight: 700; }
  .chip.ok { color: var(--sage-ink); }

  .row-body { padding: 0 20px 18px; background: var(--panel); }
  .row-body .short { margin: 0; color: var(--ink); font-size: 16px; line-height: 1.55; }
  .row-body .subject { margin: 0 0 8px; font-size: 14px; color: var(--ink-3); }
  .draft { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--page); border: 1px solid var(--line); }
  .draft h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .draft p { margin: 0; white-space: pre-line; font-size: 16px; }
  .draft mark { background: var(--sand-tint); box-shadow: inset 0 -2px 0 var(--sand); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .draft .hint { margin-top: 10px; font-size: 14px; color: var(--ink-3); white-space: normal; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .reply-btn { grid-column: 3; grid-row: 2; justify-self: end; }

  .cards { list-style: none; margin: 0; padding: 0 6px 6px; display: grid; gap: 0; }
  .money-card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
  .money-card:last-child { border-bottom: 0; }
  .money-card .mc-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; text-align: start; padding: 14px 14px 12px; border: 0; background: transparent; border-radius: 12px; }
  .money-card .mc-main:hover { background: var(--panel); }
  .mc-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .mc-what { color: var(--ink-3); font-size: 14px; grid-column: 1; overflow-wrap: anywhere; }
  .mc-amount { font-family: var(--serif); font-size: 21px; font-weight: 600; grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: end; }
  .mc-foot { grid-column: 1 / -1; margin-top: 6px; }
  .money-card.overdue .mc-amount { color: var(--terra-ink); }
  .money-card.paid .mc-amount { color: var(--sage-ink); }
  .mc-body { padding: 0 14px 14px; }
  .mc-body p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .mc-body .row-actions { margin-top: 12px; }

  .mini { list-style: none; margin: 0; padding: 6px 18px 14px; }
  .mini li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .mini li:last-child { border-bottom: 0; }
  .mini b { font-weight: 700; white-space: nowrap; }
  .mini span { color: var(--ink-2); }
  .lane.quiet .mini li { flex-direction: column; align-items: stretch; gap: 2px; }
  .lane.quiet .mini b { white-space: normal; }
  .lane.quiet .mini .co { color: var(--ink-3); font-weight: 500; }
  .quiet-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-inline-start: -10px; margin-top: 2px; }

  /* ── Ideas ───────────────────────────────────────────────────────────── */
  .idea { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--page); box-shadow: var(--shadow-1); }
  .idea:hover { box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .idea .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
  .idea h3 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .idea p { margin: 0; color: var(--ink-2); font-size: 15px; flex: 1; }
  .idea .go { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin-top: 4px; }
  .idea .go .btn { min-height: 44px; padding: 8px 12px; font-size: 14px; }
  /* Idea icons are plain outline drawings, never a coloured tile. */
  .ic, .idea .ic, .idea-rows .ic, .one-idea .ic { background: none !important; color: var(--ink-2); width: auto; height: auto; border-radius: 0; }
  .ic .icon { width: 22px; height: 22px; stroke-width: 1.8; }

  /* ── Ask ─────────────────────────────────────────────────────────────── */
  /* Ask: the navy box, the one dark sheet on the page. */
  .ask { padding: 22px; border-radius: var(--radius); background: var(--navy); color: #fff; }
  .ask h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
  .ask > p { margin: 0 0 14px; color: rgba(255, 255, 255, .8); font-size: 15px; }
  .ask form { display: flex; gap: 10px; }
  .ask input { flex: 1; min-width: 0; min-height: 50px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .09); color: #fff; padding: 10px 18px; font-size: 16px; }
  .ask input::placeholder { color: rgba(255, 255, 255, .62); }
  .ask input:focus { outline: none; border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .22); }
  .ask .btn.primary { min-height: 50px; background: #fff; border-color: #fff; color: var(--navy); box-shadow: none; }
  .ask .btn.primary:hover { background: #eef4f0; border-color: #eef4f0; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .q { min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .06); color: #fff; font-size: 14.5px; font-weight: 600; text-align: start; }
  .q:hover { background: rgba(255, 255, 255, .14); }
  .ask .note { margin: 12px 0 0; font-size: 14px; color: rgba(255, 255, 255, .75); min-height: 1.5em; }
  .ask.waiting .q, .ask.waiting input, .ask.waiting .btn { opacity: .5; cursor: default; }
  .ask.waiting .note { color: #fff; font-weight: 600; }

  .foot { display: flex; gap: 10px; align-items: flex-start; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 14px; }
  .foot .icon { color: var(--sage); }
  .foot p { margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-2); transition: opacity .2s ease, transform .2s ease; z-index: 50; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* "backwards": hidden until its turn, then it lets go, so it never holds a box still when dragged. */
  .rise { animation: rise .4s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  /* Loading: grey shapes where the banner and the boxes will be, with a soft shimmer. */
  .skel { display: grid; gap: 16px; }
  .skel-banner { display: grid; align-content: center; gap: 16px; min-height: 230px; padding: 28px clamp(20px, 3vw, 36px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .skel-box { display: grid; align-content: start; gap: 14px; min-height: 200px; padding: 24px; background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-line { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, var(--panel-2) 50%, var(--line) 75%); background-size: 200% 100%; animation: skel-shine 1.4s ease-in-out infinite; }
  .skel-line.big { height: 32px; border-radius: 9px; }
  .skel-line.head { height: 18px; }
  .w25 { width: 25%; } .w35 { width: 35%; } .w45 { width: 45%; } .w55 { width: 55%; } .w70 { width: 70%; } .w85 { width: 85%; }
  @keyframes skel-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel-line { animation: none; } }
  /* Until the page is ready, nothing but the shapes: no bar, no note. */
  html:not(.ready) #topbar, html:not(.ready) .foot { display: none !important; }
  .skeleton { color: var(--ink-3); font-size: 17px; margin: 0; }

  /* ── The grid of boxes ───────────────────────────────────────────────── */
  /* Each box sits on a 12 column grid at the place its layout gives it, and draws itself
     small, medium or large by its own width (data-level). A list shows the rows that fit,
     then "+N more". */
  .grid { --row: 64px; --gap: 16px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); }
  .box { display: flex; flex-direction: column; min-width: 0; min-height: 0; transition: box-shadow .2s ease; }
  .box > .box-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .box-more { display: flex; justify-content: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: var(--page); color: var(--slate-ink); font-weight: 700; font-size: 14px; }
  .box-more:hover { background: var(--slate-tint); }
  .box .cards { padding: 8px; gap: 6px; }
  .box[data-level="M"] .money-card .mc-main { padding: 9px 12px; }
  .box[data-level="M"] .mc-foot { margin-top: 4px; }
  .box[data-level="M"] .mc-amount { font-size: 18px; }
  .box[data-level="M"] .mc-what { display: none; }

  /* Small: one number and one line under it. */
  .sum { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; }
  .sum .value { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .sum .value.none { color: var(--ink-3); }
  .sum .sub { color: var(--ink-3); font-size: 14px; }
  .sum .sub .hot { color: var(--terra-ink); font-weight: 700; }
  .sum .line { margin-top: 6px; color: var(--ink-2); font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }


  /* ── The banner: the greeting by the hour, on the picture's own sand ──── */
  /* The painted box of papers fills the right of the banner; the words sit on the plain sand
     on the left, where the picture leaves room. The banner is the picture's own color, so
     there is no edge to hide. On a phone the picture steps back behind the words. */
  .box.headline {
    position: relative; isolation: isolate; overflow: hidden; justify-content: flex-start;
    padding: 20px clamp(20px, 2.6vw, 36px) 20px; border-radius: 26px; color: var(--ink); background: var(--banner);
  }
  .box.headline > .hl-text { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100%; max-width: min(660px, 58%); }
  .banner-art { position: absolute; z-index: 0; top: 0; bottom: 0; inset-inline-end: 0; width: min(60%, 760px); pointer-events: none;
    background: var(--banner-img, none) right center / cover no-repeat; }
  [dir="rtl"] .banner-art { transform: scaleX(-1); }
  .banner-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  @media (max-width: 760px) {
    .box.headline > .hl-text { max-width: none; }
    .banner-art { width: 100%; opacity: .16; }
  }
  .hl-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .hl-status { flex: none; justify-content: flex-start; gap: 6px 14px; }
  .hello { margin: 14px 0 2px; font-size: 15px; font-weight: 500; color: var(--banner-ink-2); }
  .hello b { font-weight: 700; color: var(--ink); }
  .hello .calm { display: inline-flex; align-items: center; gap: 5px; margin-inline-start: 10px; font-weight: 700; color: var(--ink); }
  .hello .calm .cheer { width: 15px; height: 15px; margin: 0; vertical-align: 0; stroke: currentColor; stroke-width: 4; }
  .box.headline h2 {
    margin: 0; max-width: 20ch; font-family: var(--display); font-size: clamp(34px, 3.8vw, 52px); line-height: 1.02;
    font-weight: 600; letter-spacing: -.02em; font-variation-settings: "opsz" 60; color: var(--ink);
  }
  .box.headline .lead { margin: 10px 0 0; font-size: 16.5px; color: var(--banner-ink-2); max-width: 58ch; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .box.headline .lead b { color: var(--ink); font-weight: 700; }
  .box.headline .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 8px 0 0; font-size: 14px; color: var(--banner-ink-2); }
  .box.headline .meta .icon { width: 16px; height: 16px; }
  .box.headline .fine { margin: 6px 0 0; font-size: 15px; color: var(--banner-ink-2); }
  .box.headline[data-level="S"] h2 { font-size: 26px; }
  .box.headline[data-level="S"] .hello, .box.headline[data-level="S"] .store { display: none; }
  .box.headline[data-level="S"] > .hl-text { max-width: none; }
  .box.headline[data-level="S"] .banner-art { display: none; }
  /* The connection is quiet words, not a pill: a small dot, then the time. */
  .box.headline .hl-status .pill { min-height: 0; padding: 0; gap: 7px; background: none; color: var(--banner-ink-2); font-weight: 600; font-size: 13.5px; }
  .box.headline .pill .dot { width: 7px; height: 7px; }
  .box.headline .pill .when { font-weight: 500; color: inherit; opacity: .9; margin-inline-start: 4px; }
  .box.headline .hl-status .btn[data-act="run"] { min-height: 36px; padding: 4px 8px; border: 0; background: none; box-shadow: none; color: var(--banner-ink-2); font-size: 13.5px; }
  .box.headline .hl-status .btn[data-act="run"]:hover { background: rgba(255, 255, 255, .45); }
  .box.headline .hl-status .btn[data-act="run"] .icon { width: 16px; height: 16px; }
  .box.headline .btn[data-act="ideas"], .box.headline .btn[data-act="edit-start"], .box.headline .btn[data-act="layout-menu"] { min-height: 38px; padding: 6px 14px; font-size: 14px; }
  .box.headline .btn:not(.primary) { background: rgba(255, 255, 255, .82); border-color: rgba(255, 255, 255, .95); color: var(--ink); box-shadow: 0 1px 2px rgba(22, 32, 26, .08); }
  .box.headline .btn:not(.primary):hover { background: #fff; }
  .box.headline .updated, .box.headline .status > span:not(.pill) { color: var(--banner-ink-2); }

  /* Storage: one line, filled to how much is used, with the words beside it. */
  .store { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 14px; max-width: 470px; font-size: 13.5px; font-weight: 600; color: var(--banner-ink-2); }
  .store .track { position: relative; flex: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .75); box-shadow: inset 0 0 0 1px rgba(22, 32, 26, .1); overflow: hidden; }
  .store .track i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--sage); }
  [dir="rtl"] .store .track i { inset: 0 0 0 auto; }
  .store.full .track i { background: var(--terra); }
  .store.full .words b { color: #5c1607; }
  .store .words { white-space: nowrap; }

  /* ── Files in a box ─────────────────────────────────────────────────── */
  /* One line per file: its kind as a small outline drawing, the name (a link to Drive), and
     plain words under it. Labels are words, never coloured pills. */
  .files > li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .files > li:last-child { border-bottom: 0; }
  .files .kind { display: grid; place-items: center; color: var(--ink-3); margin-top: 1px; }
  .files .kind .icon { width: 20px; height: 20px; stroke-width: 1.8; }
  .files .what { min-width: 0; }
  .fname { display: inline; font-weight: 700; font-size: 15.5px; color: var(--ink); overflow-wrap: anywhere; }
  a.fname { text-decoration: none; }
  a.fname:hover { text-decoration: underline; text-underline-offset: 3px; }
  a.fname .ext { display: inline-block; width: 13px; height: 13px; margin-inline-start: 5px; vertical-align: -1px; color: var(--ink-3); stroke-width: 2.2; }
  .files .meta { display: block; margin-top: 1px; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .files .meta b { color: var(--ink-2); font-weight: 600; }
  .files .t { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; text-align: end; }
  .files .note { grid-column: 2 / -1; margin: 3px 0 0; color: var(--ink-2); font-size: 14.5px; overflow-wrap: anywhere; }
  .files .quote { grid-column: 2 / -1; margin: 5px 0 0; padding-inline-start: 10px; border-inline-start: 2px solid var(--line-2); color: var(--ink-3); font-size: 13.5px; font-style: italic; overflow-wrap: anywhere; }
  .files .acts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .files .older { grid-column: 2 / -1; list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; font-size: 13.5px; color: var(--ink-3); }
  .files .older li { overflow-wrap: anywhere; }
  .files .older li::before { content: "Older: "; font-weight: 600; }
  .box[data-level="M"] .files > li { padding: 10px 16px; }
  .box[data-level="M"] .files .quote, .box[data-level="M"] .files .older { display: none; }

  /* Contract dates: a small calendar leaf for the day, then what happens and where it says so. */
  .dates > li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 14px; align-items: start; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .dates > li:last-child { border-bottom: 0; }
  .leaf { display: grid; justify-items: center; padding: 5px 0 6px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); line-height: 1.1; }
  .leaf span { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .leaf b { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); }
  .dates .soon .leaf { background: var(--terra-tint); border-color: var(--terra-line); }
  .dates .soon .leaf span, .dates .soon .leaf b { color: var(--terra-ink); }
  .dates .what { min-width: 0; }
  .dates .whatday { display: block; font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
  .dates .meta { display: block; margin-top: 1px; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .dates .meta a { color: var(--ink-2); }
  .dates .t { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; text-align: end; }
  .dates .quote { grid-column: 2 / -1; margin: 5px 0 0; padding-inline-start: 10px; border-inline-start: 2px solid var(--line-2); color: var(--ink-3); font-size: 13.5px; font-style: italic; overflow-wrap: anywhere; }
  .box[data-level="M"] .dates > li { grid-template-columns: 50px minmax(0, 1fr); padding: 10px 16px; }
  .box[data-level="M"] .dates .t, .box[data-level="M"] .dates .quote { display: none; }

  /* The Ask box keeps its padding at the foot too, so the last row of ideas never touches the edge. */
  .box.ask { padding: 18px 22px 20px; }
  .box.ask h2 { margin-bottom: 2px; line-height: 1.2; }
  .box.ask .q { min-height: 36px; padding: 6px 14px; }
  .box.ask .nudge .btn.small { min-height: 36px; }
  .box.ask .nudge { margin-top: 10px; padding: 10px 18px; }
  .box.ask .nudge-actions { margin-top: 6px; }
  .box.ask .qs-label { margin-top: 8px; }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 60; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }

  /* Done is green, never the page's blue. */
  .thing .tick:hover { border-color: var(--done); color: var(--done); }
  .thing .tick.ticked { background: var(--done); border-color: var(--done); }
  .all-done .icon, .gift .asked .icon { color: var(--done); }
  .hello .calm { color: #17533d; }
  .cheer { stroke: var(--done); }

  /* Important papers: what each one is, in words, then the file and where it lives. */
  .papers > li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .papers > li:last-child { border-bottom: 0; }
  .papers .kind { display: grid; place-items: center; color: var(--ink-3); margin-top: 1px; }
  .papers .kind .icon { width: 20px; height: 20px; stroke-width: 1.8; }
  .papers .what { min-width: 0; }
  .papers .type { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .papers .meta { display: block; margin-top: 1px; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .papers .t { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; text-align: end; }
  .box[data-level="M"] .papers > li { padding: 10px 16px; }

  /* What fills your Drive: each big file with a thin bar for its share of the space. */
  .space-top { padding: 4px 20px 10px; color: var(--ink-2); font-size: 14.5px; }
  .space-top b { color: var(--ink); }
  .space .files .t { font-weight: 700; color: var(--ink-2); }
  .files .bar { grid-column: 2 / -1; height: 4px; margin-top: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .files .bar i { display: block; height: 100%; border-radius: inherit; background: #8c8478; }
  [dir="rtl"] .files .bar i { margin-inline-start: auto; }
  /* Ask: the dark box. Small keeps only the field. */
  .box.ask { padding: 20px 22px; overflow: hidden; justify-content: flex-start; }
  .box.ask h2 { font-size: 23px; }
  .box.ask .qs { margin-top: 10px; }
  .box.ask .note { margin-top: 8px; }
  .box.ask[data-level="S"] form { flex-direction: column; }

  /* An idea at the foot of a box, picked from today's mail. */
  .nudge { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--page); }
  .nudge > .icon { color: var(--ink-3); margin-top: 1px; }
  .nudge p { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .nudge-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .btn.small .icon { width: 17px; height: 17px; }
  .nudge-hide { margin-inline-start: auto; min-height: 38px; border: 0; background: transparent; color: var(--ink-3); font-size: 13.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px; }
  .nudge-hide:hover { background: var(--panel-2); color: var(--ink); }
  .box.ask .nudge { margin-top: 12px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; background: rgba(0, 0, 0, .14); }
  .box.ask .nudge > .icon { color: #f1d9a6; }
  .box.ask .nudge p { color: #fff; }
  .box.ask .nudge .btn:not(.primary) { background: transparent; border-color: rgba(255, 255, 255, .3); color: #fff; box-shadow: none; }
  .box.ask .nudge .btn:not(.primary):hover { background: rgba(255, 255, 255, .12); }
  .box.ask .nudge-hide { color: rgba(255, 255, 255, .72); }
  .box.ask .nudge-hide:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  .box.ask .qs-label { margin: 10px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }
  .box.ask .qs { margin-top: 6px; }

  /* The boxes you can add. */
  .box.nbox > .kpi { flex: 1; min-height: 0; justify-content: center; }
  .box-pad { padding: 14px 18px; flex: 1; min-height: 0; overflow: hidden; }
  .box-pad > p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .facts div { padding: 8px 12px; border-radius: 10px; background: var(--panel); }
  .facts dt { font-weight: 700; font-size: 14px; }
  .facts dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14.5px; }
  /* Write an email: who and what go in, the email comes back to change before it goes. */
  .box.write .box-pad { display: flex; flex-direction: column; overflow: auto; padding-top: 6px; }
  .write { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .wf { display: grid; gap: 6px; }
  .wf > span { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  .wf.grow { flex: 1; min-height: 0; grid-template-rows: auto 1fr; }
  .write input, .write textarea { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--page); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
  .write textarea { resize: none; min-height: 84px; }
  .write input::placeholder, .write textarea::placeholder { color: var(--ink-3); opacity: .8; }
  .write input:focus, .write textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 14%, transparent); }
  .write .wsubj { font-weight: 700; }
  .write .wbody { flex: 1; min-height: 150px; }
  .write .acts, .write-wait .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .write .fine, .write-wait .fine { margin: 0; font-size: 13.5px; color: var(--ink-3); }
  .write .hint { margin: -4px 0 0; font-size: 14px; color: var(--sand-ink); }
  .write .said, .write-wait .said { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--line-2); color: var(--ink-2); font-size: 15.5px; overflow-wrap: anywhere; white-space: pre-line; }

<div class="wrap">

    <div id="ribbon"></div>
    <div class="editbar" id="editbar" role="region" aria-label="Editing your page" hidden>
      <div class="editbar-actions">
        <button type="button" class="btn primary" data-act="add-box"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>Add a box</button>
        <button type="button" class="btn" data-act="undo" id="undo-btn" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo" /></svg>Undo</button>
        <button type="button" class="btn quiet" data-act="reset-layout">Reset to default</button>
        <button type="button" class="btn dark" data-act="edit-done"><svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>Done</button>
      </div>
    </div>
    <div class="gift-keep" id="gift-keep" role="region" aria-label="One thing for you" hidden></div>
    <div class="welcome" id="welcome" role="region" aria-label="What it learned about you" hidden></div>
    <div class="suggest" id="suggest" role="region" aria-label="A change to your page" aria-live="polite" hidden></div>
    <section class="grid" id="grid" aria-label="Your files, by what needs you" tabindex="-1" hidden></section>
    <div class="grid-empty" id="grid-empty" hidden>
      <p><b>Your page has no boxes.</b> Add the ones you want to see.</p>
      <button type="button" class="btn primary" data-act="add-box"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>Add a box</button>
    </div>
    <footer class="foot">
      <svg class="icon" aria-hidden="true"><use href="#i-shield" /></svg>
      <p>This page only reads your Drive. It never changes, moves, shares or deletes a file. When something needs fixing, it shows you where, and you do it in Drive.</p>
    </footer>
  </main>
</div>

    var link = g.fileId ? driveLink(g.fileId, g.fileKind) : "";
    var asked = state.giftAsked === g.at;
    var arrive = where === "reading" && state.giftShownAt !== g.at;
    if (where === "reading") state.giftShownAt = g.at;
    return '<section class="gift' + (arrive ? " arrive" : "") + '" aria-live="polite">' +
      '<p class="eyebrow">' + icon("i-star") + (where === "reading" ? "While I read, I found this for you" : "Found while reading your Drive") + "</p>" +
      "<h3>" + p.head + "</h3>" +
      (g.gist ? '<p class="about"><span dir="auto">' + esc(g.gist) + "</span></p>" : "") +
      (p.why ? '<p class="why">' + esc(p.why) + "</p>" : "") +
      (asked
        ? '<p class="asked">' + icon("i-check") + "Asked. The answer is coming in the chat.</p>"
        : '<div class="acts">' + (canAsk() ? '<button type="button" class="btn primary" data-act="gift-do">' + icon(p.icon) + esc(p.button) + "</button>" : "") +
          (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Drive</a>" : "") +
          (where === "keep" ? '<button type="button" class="btn quiet" data-act="gift-skip">Not now</button>' : "") + "</div>") +
      '<p class="fine">Nothing changes in Drive. You see every word first.</p></section>';
  }
  /** After the reading: the gift stays on top for a few days, until used or put away. */
  function paintGiftKeep() {
    var el = $("gift-keep");
    if (!el) return;
    var g = state.reading && state.reading.gift;
    var at = g ? writtenAt(g.at) : null;
    var show = !!(g && at && state.mineReady && state.giftDone !== g.at && (Date.now() - at.getTime()) < GIFT_KEEP_DAYS * DAY_MS &&
      !state.example && !readingNow() && !revealing());
    el.hidden = !show;
    el.innerHTML = show ? giftHtml(g, "keep") : "";
  }
  function giftDone(g) {
    state.giftDone = g.at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(GIFT_KEY, g.at).catch(function () {});
  }
  /** The agent is still reading: the file says so, and it is fresh. */
  function readingNow() {
    var r = state.reading;
    // A run that ended without saying done is not still reading.
    if (!r || r.done || !state.running) return false;
    var at = writtenAt(r.startedAt);
    return !!at && (Date.now() - at.getTime()) / 60000 < READ_FRESH_MIN;
  }
  // Lines that arrive together are still told one by one, so the reading never jumps to the
  // page with lines nobody saw. Only once this page has shown the reading.
  var REVEAL_MS = 1200;
  function freshLines() {
    var at = state.reading ? writtenAt(state.reading.startedAt) : null;
    return at && (Date.now() - at.getTime()) / 60000 < READ_FRESH_MIN ? state.reading.lines : [];
  }
  function revealing() { return !!(state.sawReading && state.reading && state.readShown < freshLines().length + (state.reading.done ? 1 : 0)); }
  setInterval(function () {
    if (!revealing()) return;
    state.readShown++;
    if (revealing()) paintHero(); else paint();
  }, REVEAL_MS);
  /** A new read (another startedAt) starts its lines from the first one. */
  function setReading(r) {
    if (r && r.startedAt !== state.readStartedAt) { state.readShown = 0; state.readStartedAt = r.startedAt; }
    state.reading = r;
  }
  /** A line may mark its finding in **bold**; everything else is plain text. */
  function lineHtml(line) { return esc(line).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
  function readingHtml() {
    // The last lines come with done: keep them on screen until the page itself is ready.
    var done = !!(state.reading && state.reading.done);
    var all = freshLines();
    state.sawReading = true;
    var lines = all.slice(0, Math.min(state.readShown, all.length));
    done = done && lines.length === all.length;
    var gift = giftNow();
    return '<div class="read-page' + (!gift && done ? " solo" : "") + '"><div class="reading" aria-live="polite"><h2>Reading your Drive</h2>' +
      "<p>Getting to know you and your files. A minute or two. You don't need to do anything.</p>" +
      '<ul class="read-lines">' + lines.map(function (l, i) { return "<li" + (i < lines.length - 1 ? ' class="old"' : "") + ">" + icon("i-check") + "<span>" + lineHtml(l) + "</span></li>"; }).join("") +
      '<li class="now"><i class="pulse-dot" aria-hidden="true"></i><span>' + (done ? "Putting your page together" : lines.length ? "Reading on" : "Opening your Drive") + "...</span></li></ul>" +
      '<p class="fine">Only reads. Nothing in Drive changes, and it all stays in your cabinet.</p></div>' +
      (gift ? giftHtml(gift, "reading")
        : done ? ""
        : '<section class="gift looking"><i class="pulse-dot" aria-hidden="true"></i><h3>Looking for one thing I can take off your plate right now.</h3></section>') +
      "</div>";
  }

  /** A count, as a number, whether the helper wrote it as one or as words ("1,240", "at least 10,000"). */
  function countOf(v) {
    if (typeof v === "number" && isFinite(v) && v >= 0) return { n: v, more: false };
    var m = typeof v === "string" ? /^(at least )?(\d[\d,]*)/.exec(v.trim()) : null;
    return m ? { n: Number(m[2].replace(/,/g, "")), more: !!m[1] } : null;
  }
  function cleanProfile(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    var names = function (x, n) { return Array.isArray(x) ? x.map(function (v) { return text(v, 60); }).filter(Boolean).slice(0, n) : []; };
    var st = d.storage && typeof d.storage === "object" && typeof d.storage.used === "number" ? d.storage : null;
    return {
      at: d.at, name: text(d.name, 40),
      people: names(d.people, 4), papers: names(d.papers, 6),
      files: countOf(d.files), folders: countOf(d.folders), photos: countOf(d.photos),
      storage: st
    };
  }
  function profileSentence(pr) {
    return pr.name ? "Here is what your Drive says about you, " + esc(pr.name) + "." : "Here is what your Drive says about you.";
  }
  function countWords(c, one, many) { return (c.more ? "at least " : "") + c.n.toLocaleString() + " " + plural(c.n, one, many); }
  function paintWelcome() {
    var el = $("welcome");
    var pr = state.profile;
    // Only when it learned something about *them*: counts alone are not "This is you".
    var known = pr && (pr.people.length || pr.papers.length);
    var show = !!(state.mineReady && known && state.loaded && !state.example && canAsk() && !state.editing && pr.at !== state.profileSeen && !readingNow() && !revealing());
    el.hidden = !show;
    if (!show) { el.innerHTML = ""; return; }
    var facts = [];
    if (pr.people.length) facts.push(["i-users", "Sharing files with you: <b>" + esc(pr.people.join(", ")) + "</b>"]);
    if (pr.papers.length) facts.push(["i-id", "Papers it found: <b>" + esc(pr.papers.join(", ")) + "</b>"]);
    var parts = [];
    if (pr.files) parts.push(countWords(pr.files, "file", "files"));
    if (pr.folders) parts.push(countWords(pr.folders, "folder", "folders"));
    if (pr.photos && pr.photos.n) parts.push(countWords(pr.photos, "photo or video", "photos and videos"));
    if (parts.length) facts.push(["i-drive", "Your Drive: <b>" + esc(parts.join(", ")) + "</b>"]);
    if (pr.storage) facts.push(["i-gauge", "<b>" + esc(bytesWords(pr.storage.used)) + "</b> used" + (pr.storage.limit ? " of " + esc(bytesWords(pr.storage.limit)) : "")]);
    el.innerHTML = '<p class="eyebrow">I read your Drive. This is what I learned.</p>' +
      "<h3>" + profileSentence(pr) + "</h3>" +
      (facts.length ? "<ul>" + facts.map(function (f) { return "<li>" + icon(f[0]) + "<span>" + f[1] + "</span></li>"; }).join("") + "</ul>" : "") +
      '<div class="acts"><button type="button" class="btn primary" data-act="profile-ok">' + icon("i-check") + "That’s me</button>" +
      '<button type="button" class="btn" data-act="profile-fix">Fix something</button>' +
      '<span class="fine">You see this once. If something is off, press Fix something and tell me.</span></div>';
  }
  function markProfileSeen() {
    var pr = state.profile;
    if (!pr) return;
    state.profileSeen = pr.at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(PROFILE_SEEN_KEY, pr.at).catch(function () {});
    paintWelcome();
  }

  /** What the page shows while it loads: the shapes of the page, no words. */
  var SKELETON = '<div class="skel" role="status" aria-label="Loading your page"><div class="skel-banner"><i class="skel-line w25"></i><i class="skel-line w45 big"></i><i class="skel-line w55"></i><i class="skel-line w35"></i></div><div class="skel-row"><div class="skel-box"><i class="skel-line w35 head"></i><i class="skel-line w85"></i><i class="skel-line w70"></i><i class="skel-line w55"></i></div><div class="skel-box"><i class="skel-line w35 head"></i><i class="skel-line w85"></i><i class="skel-line w70"></i><i class="skel-line w55"></i></div></div></div>';

  function paint() {
    document.documentElement.classList.toggle("ready", !!state.loaded);
    document.documentElement.classList.toggle("first-read", !!((state.running && (state.example || !state.data)) || revealing()));
    paintStatus();
    paintGiftKeep();
    paintWelcome();
    paintSuggest();
    paintHero();
    paintRibbon();
    paintGrid();
    if (state.drawerOpen) paintDrawer();
    if (state.loaded && state.data) state.animate = false;
  }

  /**
   * The connection and the page's buttons. They sit in the banner; only when that box is not
   * on the page (removed, or nothing loaded yet) do they show in a slim bar of their own, so
   * Layout can always be reached.
   */
  function paintStatus() {
    var inHeadline = !!(state.loaded && state.data && onPage("headline"));
    $("topbar").hidden = inHeadline;
    $("status").innerHTML = inHeadline ? "" : statusHtml();
  }
  function statusHtml() {
    var s = driveState();
    var pill;
    // An older Cabinet cannot say whether Drive is connected: plain words, no state dot.
    if (!V2) pill = '<span class="updated">Connect Google Drive from Integrations in Cabinet.</span>';
    else if (!state.drive) pill = '<span class="pill"><span class="dot pulse"></span>Checking Drive</span>';
    else if (s === "connected") pill = '<span class="pill ok"><span class="dot"></span>Drive connected</span>';
    else if (s === "not-available-here") pill = '<span class="pill"><span class="dot"></span>Drive not available here</span>';
    else if (s === "needs-sign-in" || s === "needs-you") pill = '<span class="pill warn"><span class="dot"></span>Drive needs you</span>';
    else pill = '<span class="pill off"><span class="dot"></span>Drive not connected</span>';

    // When Drive was last read rides in the status pill: "Drive connected · 7:02 AM".
    var updated = "";
    var g = state.data && !state.example ? writtenAt(state.data.generatedAt) : null;
    if (g) {
      var read = daysBetween(g, new Date()) === 0 ? clock(g) : whenWords(g, new Date());
      if (s === "connected") pill = pill.replace("Drive connected</span>", 'Drive connected<span class="when"><span class="sr">, read </span>· ' + esc(read) + "</span></span>");
      else updated = '<span class="updated">Read ' + esc(whenWords(g, new Date())) + "</span>";
    }
    var button = "";
    if (s === "connected" && canRun() && state.data && !state.example) {
      button = state.running
        ? '<button class="btn" disabled>' + icon("i-refresh", "spin") + "Reading...</button>"
        : '<button class="btn" data-act="run">' + icon("i-refresh") + "Read again</button>";
    }
    var ideas = '<button class="btn" data-act="ideas" aria-haspopup="dialog">' + icon("i-bulb") + "Ideas</button>";
    // Someone who can ask chooses between arranging by hand and asking the agent.
    var edit = !(state.loaded && state.data && !state.editing) ? ""
      : canAsk()
        ? '<button class="btn" data-act="layout-menu" aria-haspopup="menu" aria-expanded="' + state.menuOpen + '">' + icon("i-layout") + "Layout</button>"
        : '<button class="btn" data-act="edit-start">' + icon("i-layout") + "Edit layout</button>";
    return pill + updated + button + ideas + edit;
  }

  /** A folder, with a badge that matches the state: a tick once connected, an alert when it needs fixing. */
  function artDrive(badge) {
    var mark = badge === "check"
      ? '<circle cx="108" cy="24" r="14" fill="#1f6b4f"/><path d="M101 24l5 5 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
      : badge === "alert"
        ? '<circle cx="108" cy="24" r="14" fill="#c4472a"/><path d="M108 16.5v9M108 30.5v.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>'
        : "";

      '<rect x="8" y="14" width="116" height="82" rx="14" fill="#e9eff8"/>' +
      '<path d="M22 40a6 6 0 0 1 6-6h20l7 8h49a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z" fill="#fff" stroke="#2c4a7a" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M22 50h88" stroke="#2c4a7a" stroke-width="3"/>' +
      mark + "</svg>";
  }

  function paintHero() {
    var hero = $("hero");
    if (!state.loaded) { hero.innerHTML = SKELETON; return; }
    var s = driveState();
    var g = state.drive;
    var html;
    var told = false;

    if (V2 && s === "not-available-here") {
      var why = g && g.problem && g.problem.text ? g.problem.text : "";
      var cloud = state.here && state.here.place === "cloud";
      html = cardHero(icon("i-cloud"), "Google Drive can’t be connected here yet",
        (why ? '<p class="lead">' + esc(why) + "</p>" : "") +
        "<p class=\"fine\">" + (cloud ? "For now, Google Drive works in the Cabinet app on a computer." : "For now, Google Drive works when this cabinet runs on this computer with your own AI.") +
        " Below is an example from a made-up person.</p>");
    } else if (V2 && (s === "needs-sign-in" || s === "needs-you")) {
      html = cardHero("alert", "Google Drive needs you",
        '<p class="lead">' + esc(g && g.problem && g.problem.text ? g.problem.text : "Google stopped letting Cabinet into your Drive.") + "</p>" +
        (g && g.canConnect
          ? '<div class="actions"><button class="btn primary big" data-act="connect">' + icon(state.connecting ? "i-refresh" : "i-drive", state.connecting ? "spin" : "") + (state.connecting ? "Fixing..." : "Fix the connection") + "</button></div>"
          : '<p class="fine">Ask the person who owns this cabinet to fix the Google Drive connection.</p>') +

    } else if (V2 && s === "not-added") {

      html = cardHero(null, "Know where your important papers are, and what fills your Drive",
        '<p class="lead">Connect Google Drive and My files reads it every morning: where your passport, insurance and lease are, what expires soon, what family and friends shared with you, and what takes the space.</p>' +
        (canConnect
          ? '<div class="actions"><button class="btn primary big" data-act="connect"' + (state.connecting ? " disabled" : "") + ">" +
            icon(state.connecting ? "i-refresh" : "i-drive", state.connecting ? "spin" : "") + (state.connecting ? "Connecting..." : "Connect Google Drive") + "</button>" +
            '<span class="fine">' + (state.connecting ? "Finish on Google’s page." : "You sign in with Google, once.") + "</span></div>"
          : '<p class="fine"><b>Ask the person who owns this cabinet to connect Google Drive.</b></p>') +
        (state.connectNote ? '<p class="fine">' + esc(state.connectNote) + "</p>" : "") +
        '<ul class="steps"><li>' + icon("i-check") + "Only reads, never changes a file</li><li>" + icon("i-check") + "Every morning at 7</li><li>" + icon("i-check") + "Below: an example from a made-up person</li></ul>");
    } else if ((state.running && (state.example || !state.data)) || revealing()) {

    } else if (V2 && s === "connected" && state.example && failureInfo()) {
      // The very first read did not work: that is the news, told once, with its fixes.
      var first = failureInfo();
      html = cardHero("alert", "Your first read didn’t work",
        '<p class="lead">' + esc(first.why) + "</p>" + '<div class="actions">' + failureButtons(true) + "</div>");

    } else if (V2 && s === "connected" && state.example) {
      var sched = scheduleWords();
      html = cardHero("check", "Google Drive is connected. Let’s read your files.",
        '<p class="lead">Your first read takes a few minutes.' +
        (sched ? " After that it happens by itself, " + esc(sched) + "." : " After that, press Read again whenever you want a fresh one.") + "</p>" +
        (canRun() ? '<div class="actions"><button class="btn primary big" data-act="run">' + icon("i-drive") + "Read my Drive now</button></div>" : "") + runNoteHtml());
    } else if (!state.data) {
      html = cardHero(null, "Your files show up here", '<p class="lead">Nothing could be read yet. Try again in a moment.</p>');
    } else {
      // The banner is a box on the grid now; up here only what went wrong.
      html = runNoteHtml();
    }
    html += told ? "" : failureHtml();
    hero.innerHTML = html;
    hero.hidden = !html;
  }

  /** `art` is an icon for the picture, or "check", "alert" or null for the folder's badge. */
  function cardHero(art, title, body, busy) {
    var picture = busy
      ? '<div class="art" aria-hidden="true" style="display:grid;place-items:center">' + icon("i-refresh", "spin") + "</div>"

  function runNoteHtml() { return state.runNote ? '<div class="notice" style="margin-top:14px">' + icon("i-alert") + "<p>" + esc(state.runNote) + "</p></div>" : ""; }
  function dataAgeHtml() {
    var g = state.data && !state.example ? writtenAt(state.data.generatedAt) : null;
    return g ? '<p class="fine">The files below were read ' + esc(whenWords(g, new Date())) + ".</p>" : "";

  /** The numbers a person looks for first, each a card; shown for the example too, labelled by the ribbon. */
  function kpiCards() {
    var sh = shared();
    var unopened = sh.filter(function (x) { return x.opened === false; }).length;
    var o = openFiles();
    var priv = o.filter(function (x) { return x.sensitive === true; }).length;
    var st = storage();
    var pct = st && st.limit ? Math.round(st.used / st.limit * 100) : null;

    var first = ds[0];
    var days = first ? daysBetween(startOfDay(refDate()), parseTime(first.date)) : 0;
    return {
      shared: '<a class="kpi" href="#lane-shared"><span class="label">' + icon("i-share") + "Shared with you</span>" +
        '<span class="value num">' + sh.length + '</span><span class="sub">' + (unopened ? unopened + " not opened yet" : sh.length ? "shared with you" : "Nothing new") + "</span></a>",
      open: '<a class="kpi' + (priv ? " first" : "") + '" href="#lane-open"><span class="label">' + icon("i-globe") + "Open to anyone</span>" +
        '<span class="value num">' + o.length + '</span><span class="sub">' + (priv ? priv + " look private" : o.length ? "none look private" : "All your files are private") + "</span></a>",
      storage: '<a class="kpi' + (pct !== null && pct >= 90 ? " first" : "") + '" href="#lane-space"><span class="label">' + icon("i-gauge") + "Storage</span>" +
        (st ? '<span class="value num">' + (pct !== null ? pct + "%" : esc(bytesWords(st.used))) + '</span><span class="sub">' + esc(bytesWords(st.used) + (st.limit ? " of " + bytesWords(st.limit) : " used")) + "</span>"
          : '<span class="value none">?</span><span class="sub">Shows after the next read</span>') + "</a>",
      dates: '<a class="kpi' + (first && days <= 30 ? " first" : "") + '" href="#lane-dates"><span class="label">' + icon("i-calendar") + "Next date</span>" +
        (first ? '<span class="value num">' + esc(dayCount(days).replace(/^in /, "")) + '</span><span class="sub">' + esc((WHAT_WORDS[first.what] || "A date") + ": " + (text(first.who, 40) || text(first.file, 40))) + "</span>"
          : '<span class="value none">None</span><span class="sub">No dates in your papers this year</span>') + "</a>"
    };
  }

  /** The last read that could not reach Drive: when, and why, or null. */
  function failureInfo() {
    if (state.running) return null;
    var tryAt = state.lastTry && state.lastTry.ok === false ? writtenAt(state.lastTry.at) : null;
    var shownAt = state.data && !state.example ? writtenAt(state.data.generatedAt) : null;
    var job = morningJob();
    var jobFail = job && job.lastRun && job.lastRun.ok === false ? parseTime(job.lastRun.at) : null;
    var why = "";
    if (tryAt && (!shownAt || tryAt > shownAt)) why = text(state.lastTry.why, 240) || "The last read could not reach your Drive.";
    else if (jobFail && (!shownAt || jobFail > shownAt)) why = "The last read did not finish.";
    // With a connection problem the hero already says what to do; an older Cabinet cannot tell, so it shows.
    if (!why || (V2 && driveState() !== "connected")) return null;
    var at = tryAt || jobFail;
    var words = at ? whenWords(at, new Date()) : "";
    return { why: why, head: !words ? "The last read didn’t work." : "The read " + (/^\d/.test(words) ? "at " : "") + words + " didn’t work." };
  }
  function failureButtons(primary) {
    return (canRun() ? '<button class="btn' + (primary ? " primary big" : "") + '" data-act="run">' + icon("i-refresh") + "Try again</button>" : "") +
      (state.drive && state.drive.canConnect ? '<button class="btn' + (primary ? " big" : "") + '" data-act="connect">' + icon("i-drive") + "Connect Google Drive again</button>" : "");
  }
  /** A read that could not reach Drive says so, with the presses that fix it. */
  function failureHtml() {
    var fail = failureInfo();
    if (!fail) return "";
    var buttons = failureButtons(false);
    return '<div class="notice">' + icon("i-alert") + "<div><p><b>" + esc(fail.head) + "</b> " + esc(fail.why) + "</p>" +
      (buttons ? '<div class="actions">' + buttons + "</div>" : "") + "</div></div>";
  }

  function paintRibbon() {
    var el = $("ribbon");
    if (!state.loaded || !state.data || !state.example) { el.innerHTML = ""; return; }
    var who = text(state.data.person, 80);
    el.innerHTML = '<div class="ribbon"><span class="tag-example">Example</span><p>' +
      (who ? "<b>" + esc(who) + "</b>, a made-up person. " : "A made-up person. ") +
      "None of these are your files. Connect Google Drive and your own page replaces it.</p></div>";
  }

  // ── Rows ───────────────────────────────────────────────────────────────

  /** One file on one line: its kind, its name (a link to Drive), and what to know under it. */
  function fileRow(o) {
    return "<li>" + kindIcon(o.kind) + '<div class="what">' + fileLinkHtml(o.name, o.fileId, o.kind) +
      (o.meta ? '<span class="meta" dir="auto">' + o.meta + "</span>" : "") + "</div>" +
      '<span class="t">' + (o.time || "") + "</span>" + (o.extra || "") + "</li>";

  // ── The banner ─────────────────────────────────────────────────────────

  /** What matters most today: the agent's lead, else the first thing to do, else a calm word. */

  /** "Good afternoon, Jenna" for the hour on the person's own clock. */

  // ── Your next 3 things ─────────────────────────────────────────────────
  // Everything that asks something of the person, from all the boxes, in the order to do it,
  // each with its press ready. "Done" takes a thing off the list for good (kept per person in
  // cabinet.mine) and the next one moves up.

  var DONE_KEY = "my-files-done@1";
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  /** The same thing keeps the same key from one morning's read to the next. */
  function thingKey(kind, item) {
    var f = fileOf(item);
    var ref = (f && f.id ? f.id : text(item.name || item.file, 80)) + "|" + text(item.date || item.sharedAt || item.what, 40);
    return (state.example ? "example:" : "") + kind + ":" + ref;
  }
  var WHAT_WORDS = { expires: "Expires", renews: "Renews", ends: "Ends", due: "Due", notice: "Last day to say" };
  function dayCount(days) { return days <= 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days"; }

  /**
   * The order: a private file open to anyone, a date in your papers in the next 30 days, a

   */
  function nextThings() {
    var ref = refDate();
    var out = [];
    function add(rank, order, key, title, why, action) {
      out.push({ rank: rank, order: order, key: key, title: title, why: why, action: action });
    }
    openFiles().forEach(function (o, i) {
      if (o.sensitive !== true) return;

        { label: "Show me how", act: "close-help", id: text(o.id, 60) || "o" + i });
    });
    contractDates().forEach(function (d, i) {
      var days = daysBetween(startOfDay(ref), parseTime(d.date));
      if (days > 60) return;
      add(days <= 30 ? 1 : 4, days, thingKey("date", d), (WHAT_WORDS[d.what] || "A date") + ": " + (text(d.who, 50) || text(d.file, 50)),
        dayCount(days) + (text(d.gist) ? ", " + text(d.gist, 70) : ""),
        { label: "Open the paper", act: "open-file", id: text(d.id, 60) || "d" + i });
    });
    var st = storage();
    if (st && st.limit && st.used / st.limit >= 0.9) {
      var pct = Math.round(st.used / st.limit * 100);
      add(2, 0, (state.example ? "example:" : "") + "space:" + todayKey().slice(0, 7), "Free up space in your Drive", "it is " + pct + "% full",
        { label: "Find what to let go", act: "ask", q: ideaById("space").ask });

      if (s.opened !== false) return;

        "from " + (text(s.from, 50) || "someone") + ", " + (rowTime(s.sharedAt, ref) || "lately").toLowerCase(),
        { label: "Open it", act: "open-file", id: text(s.id, 60) || "s" + i });

  }

  function actionButton(a) {

      (a.q ? ' data-q="' + esc(a.q) + '"' : "") + (canAsk() || a.act === "copy" ? "" : " disabled") + ">" + esc(a.label) + "</button>";
  }

  function drawNext(level) {
    var all = nextThings();

    var done = all.length - open.length;
    var top = open.slice(0, 3);
    if (level === "S") {
      return sumBox("next", "Do next", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "Nothing needs you",

  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
