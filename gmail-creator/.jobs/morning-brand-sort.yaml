id: morning-brand-sort
name: Morning brand sort
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: brand-manager
agentSlug: brand-manager
timeout: 900
prompt: |-
  Sort this morning's email for the Brand desk app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Gmail, what counts as a deal, a payment, a fake and a fan question, the shape of each
  file, honest money, and how to spend little. Follow its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `brand-desk/setup.md` and, if it is there, `brand-desk/data/latest.json` (the last sort).
  2. If your Gmail line says Gmail is not connected, write only
     `brand-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Read Gmail with at most five searches and five opened emails. Save the results inside
     `brand-desk/data/.work/`, never `/tmp`, and delete that folder in your last call.
  4. In one Bash call, write `brand-desk/data/latest.json` (and check it parses),
     `reports/<YYYY-MM-DD>-brand-desk.md` and `brand-desk/data/status.json` with `ok: true`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one or two plain sentences: how many brands are waiting, how much money is
  late, and the one offer to answer first, if there is one.
createdAt: '2026-10-12T00:00:00.000Z'
updatedAt: '2026-10-12T00:00:00.000Z'
