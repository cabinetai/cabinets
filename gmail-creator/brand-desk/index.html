<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #f3efe8;
    --sheet: #fffdf9;
    --ink: #1d1a22;
    --ink-2: #4a4552;
    --muted: #6a6473;
    --line: #e4ddd2;
    --line-2: #d6cdbf;
    --night: #17141d;
    --night-2: #241f2c;
    --cream: #f7efe2;
    --gold: #c9973f;
    --gold-soft: #f6e6c4;
    --red: #b5402f;
    --red-soft: #f8e1dc;
    --amber: #9a6512;
    --amber-soft: #fbeed3;
    --green: #2f6b4f;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Example note and connect ─────────────────────────────── */
  .notice {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 28px; background: var(--night); color: #cfc7d8; font-size: 13.5px;
    border-bottom: 1px solid #2c2634;
  }
  .notice b { color: var(--cream); font-weight: 600; }
  .notice .grow { flex: 1; min-width: 200px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
    padding: 8px 16px; border: 1px solid var(--line-2); background: var(--sheet);
    font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .15s;
  }
  a.btn { text-decoration: none; }
  .btn:hover { border-color: var(--ink-2); }
  .btn:active { transform: scale(.98); }
  .btn.dark { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .btn.dark:hover { background: #000; }
  .btn.gold { background: var(--gold); color: #1b1408; border-color: var(--gold); }
  .btn.gold:hover { background: #d8a64c; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding-left: 8px; padding-right: 8px; }
  .btn.quiet:hover { color: var(--ink); border-color: transparent; text-decoration: underline; }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* ── Banner: the stage ────────────────────────────────────── */
  .stage {
    position: relative; overflow: hidden; color: var(--cream);
    background:
      radial-gradient(1100px 420px at 78% -10%, rgba(232, 178, 92, .13), transparent 60%),
      radial-gradient(700px 300px at 10% 120%, rgba(146, 92, 160, .10), transparent 70%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    padding: 34px 28px 30px;
  }
  .stage-inner { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 36px; align-items: end; }
  .hello { display: flex; align-items: center; gap: 12px; color: #c9bfd3; font-size: 14px; letter-spacing: .02em; }
  .onair {
    display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px;
    color: #c9bfd3; font-size: 13px; font-weight: 500; padding-left: 0;
  }
  .onair i { width: 7px; height: 7px; border-radius: 50%; background: #e8836f; }
  .big {
    font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 9vw, 116px); font-feature-settings: "lnum";
    line-height: .95; letter-spacing: -.02em; margin: 18px 0 10px; font-variant-numeric: lining-nums;
    font-optical-sizing: auto;
  }
  .big small { font-size: .42em; font-weight: 400; letter-spacing: 0; color: #d9cbb4; margin-right: .08em; vertical-align: .62em; }
  .big-words { font-size: clamp(17px, 2vw, 21px); color: #ece2d2; max-width: 620px; }
  .big-words .soft { color: #a99fb4; }
  .stats { display: grid; gap: 0; border-top: 1px solid rgba(255,255,255,.14); }
  .stat { display: grid; gap: 4px; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.14); }
  .stat .n { font-family: var(--serif); font-size: 34px; font-weight: 400; font-feature-settings: "lnum"; color: var(--cream); line-height: 1; }
  .stat .n.hot { color: #f0b7a8; }
  .stat .w { color: #c9bfd3; font-size: 14px; line-height: 1.35; }

  .move { max-width: 1240px; margin: 26px auto 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); }
  .move .label { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
  .move .say { flex: 1; min-width: 240px; font-size: 16.5px; color: #f2e9db; }
  .move .say b { color: #fff; }

  /* ── Sheets ───────────────────────────────────────────────── */
  main { max-width: 1296px; margin: 0 auto; padding: 26px 28px 60px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 22px; }
  .sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 8px; min-width: 0; }
  .w8 { grid-column: span 8; } .w4 { grid-column: span 4; } .w12 { grid-column: span 12; }
  .col { grid-column: span 4; display: grid; gap: 22px; align-content: start; }
  .head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; }
  .head h2 { font-family: var(--serif); font-size: 32px; font-weight: 400; margin: 0; letter-spacing: -.01em; }
  .head .total { margin-left: auto; font-family: var(--serif); font-size: 24px; font-weight: 400; font-feature-settings: "lnum"; }
  .head .total.hot { color: var(--red); }
  .head .count { margin-left: auto; color: var(--muted); font-size: 14px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 2px; }
  .empty { color: var(--muted); padding: 18px 0 14px; }

  .row { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-top { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: start; }
  .face {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-weight: 400; font-size: 20px; color: var(--ink-2);
    border: 1px solid var(--line-2); background: var(--canvas);
  }
  .who { font-weight: 600; font-size: 16.5px; line-height: 1.25; }
  .who .by { font-weight: 400; color: var(--muted); font-size: 14px; }
  .ask { margin-top: 2px; color: var(--ink-2); }
  .fit { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .amt { text-align: right; }
  .amt .v { font-family: var(--serif); font-weight: 400; font-size: 31px; font-feature-settings: "lnum"; line-height: 1.05; white-space: nowrap; }
  .amt .v.none { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--red); }
  .amt .rate { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; }
  .amt .extra { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 10px 0 0 56px; }
  .chip { display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .chip + .chip::before { content: "·"; margin: 0 8px 0 2px; color: var(--line-2); }
  .chip.hot { color: var(--red); }
  .chip.warn { color: var(--amber); }
  .chip.ok { color: var(--green); }
  .watch { list-style: none; margin: 10px 0 0 56px; padding: 0; display: grid; gap: 6px; }
  .watch li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
  .watch li .icon { color: var(--amber); margin-top: 2px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0 56px; }
  .row.lead { position: relative; }
  .row.lead .who::after { content: "Answer first"; margin-left: 10px; vertical-align: 2px; font: 600 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }

  .pay .row-top, .simple .row-top { grid-template-columns: minmax(0, 1fr) auto; }
  .pay .chips, .pay .acts, .simple .acts { margin-left: 0; }
  .pay .amt .v { font-size: 22px; }
  .scam .from { font-weight: 600; }
  .scam .addr { font: 12.5px ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); word-break: break-all; }
  .scam .subj { margin-top: 4px; color: var(--ink-2); }
  .scam .why { margin-top: 6px; display: flex; gap: 8px; color: var(--ink-2); font-size: 14px; }
  .scam .why .icon { color: var(--red); }
  .scam .why .icon { margin-top: 2px; }

  .q { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start; }
  .q .n { font-family: var(--serif); font-size: 44px; font-weight: 400; font-feature-settings: "lnum"; line-height: .9; text-align: right; }
  .q .t { font-weight: 600; }
  .q .t .soft { font-weight: 400; color: var(--muted); }
  .q .idea { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .kind { font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* ── The reply ────────────────────────────────────────────── */
  .veil { position: fixed; inset: 0; background: rgba(23, 20, 29, .38); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .veil.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--sheet); z-index: 21;
    transform: translateX(104%); transition: transform .38s cubic-bezier(.2, .9, .25, 1); display: flex; flex-direction: column;
    border-left: 1px solid var(--line-2); box-shadow: -20px 0 60px rgba(23, 20, 29, .18);
  }
  .drawer.on { transform: none; }
  .d-head { padding: 22px 64px 14px 24px; border-bottom: 1px solid var(--line); }
  .d-head .kind { color: var(--amber); }
  .d-head h3 { font-family: var(--serif); font-weight: 400; font-size: 32px; margin: 4px 0 2px; line-height: 1.1; }
  .d-head .re { color: var(--muted); font-size: 14px; }
  .d-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); display: grid; place-items: center; }
  .langs { display: inline-flex; margin-top: 14px; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .langs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .d-body { flex: 1; overflow: auto; padding: 20px 24px; }
  .draft { white-space: pre-wrap; font-size: 16px; line-height: 1.65; outline: none; min-height: 200px; }
  .draft[contenteditable="true"]:focus { box-shadow: 0 0 0 2px var(--gold-soft); border-radius: 6px; }
  .draft mark { background: var(--gold-soft); color: #6a4a10; border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -3px; margin-left: 1px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .d-tip { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
  .d-tip mark { background: var(--gold-soft); color: #6a4a10; border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .d-foot { padding: 16px 24px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .d-foot .note { flex-basis: 100%; color: var(--muted); font-size: 13px; }


  /* Ask, or try an idea: a piece of the stage, like the Ask box of the main templates. */
  .askbox {
    border-radius: var(--radius); padding: 22px 22px 18px; color: var(--cream);
    background: radial-gradient(600px 220px at 90% 120%, rgba(217, 165, 79, .22), transparent 70%), linear-gradient(180deg, #17141d, #241f2c);
  }
  .askbox h2 { margin: 0 0 4px; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; }
  .askbox > p { margin: 0 0 14px; color: #c9bfd3; font-size: 14.5px; }
  .askbox form { display: flex; gap: 8px; }
  .askbox input { flex: 1; min-width: 0; min-height: 46px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .07); color: #fff; padding: 10px 18px; font: inherit; font-size: 15.5px; }
  .askbox input::placeholder { color: rgba(255, 255, 255, .6); }
  .askbox input:focus { outline: none; border-color: var(--cream); box-shadow: 0 0 0 3px rgba(255, 255, 255, .16); }
  .askbox button[type=submit] { min-height: 46px; padding: 0 20px; }
  .askbox .qs-label { margin: 16px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #a99fb4; }
  .askbox .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .askbox .qchip { min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .05); color: #f2e9db; font-size: 14px; font-weight: 500; text-align: start; }
  .askbox .qchip:hover { background: rgba(255, 255, 255, .12); }
  .askbox .note { margin: 12px 0 0; min-height: 1.4em; color: #c9bfd3; font-size: 13.5px; }
  @media (max-width: 600px) { .askbox form { flex-direction: column; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 40;
    background: var(--ink); color: var(--cream); padding: 10px 18px; border-radius: 999px; font-size: 14px;
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* The page builds itself: rows arrive one after another. */
  .rise { opacity: 0; transform: translateY(10px); animation: rise .55s cubic-bezier(.2, .9, .25, 1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .loading { max-width: 1240px; margin: 0 auto; padding: 60px 28px; color: var(--muted); }

  /* ── The first sort: reading on the left, the gift on the right ── */
  #read[hidden], #tops[hidden], #gift-keep[hidden], #welcome[hidden] { display: none !important; }
  .first-read #stage, .first-read #main, .first-read #tops, .first-read #notice { display: none !important; }
  #read { max-width: 1296px; margin: 0 auto; padding: 28px 28px 40px; }
  .read-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  @media (min-width: 980px) {
    .read-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); min-height: calc(100vh - 110px); }
    .read-page.solo { grid-template-columns: minmax(0, 1fr); }
  }
  .reading { background: var(--sheet); border: 1px solid var(--line); border-radius: 22px; padding: 40px clamp(24px, 3.4vw, 52px); display: grid; align-content: start; gap: 8px; }
  .reading h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(36px, 3.8vw, 52px); line-height: 1.05; letter-spacing: -.01em; }
  .reading > p { margin: 0 0 14px; color: var(--muted); font-size: 16px; }
  .read-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .read-lines li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 17.5px; color: var(--ink-2); animation: line-in .55s cubic-bezier(.2, .8, .2, 1) both; }
  .read-lines li b { color: var(--ink); font-weight: 600; }
  .read-lines li .icon { width: 20px; height: 20px; margin-top: 3px; color: var(--amber); stroke-width: 2.2; }
  .read-lines li.old { animation: none; }
  .read-lines li.now { color: var(--muted); }
  .pulse-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: read-pulse 1.2s ease-in-out infinite; }
  .read-lines li.now .pulse-dot { margin: 8px 0 0 6px; }
  .reading .fine { margin: 16px 0 0; color: var(--muted); font-size: 13.5px; }
  @keyframes line-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes read-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }

  /* The gift is a little piece of the stage: the same night and warm light as the banner. */
  .gift {
    position: relative; display: grid; align-content: center; gap: 16px; color: var(--cream); border-radius: 22px;
    padding: 44px clamp(24px, 3.4vw, 56px) 34px;
    background:
      radial-gradient(700px 320px at 85% -10%, rgba(232, 178, 92, .14), transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  }
  .gift.arrive { animation: gift-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes gift-in { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
  .gift .eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .gift h3 { margin: 0; max-width: 22ch; font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 3.6vw, 50px); line-height: 1.08; letter-spacing: -.01em; }
  .gift h3 b { font-weight: 400; color: #fff; font-style: italic; }
  .gift h3 .n { white-space: nowrap; font-style: normal; color: var(--gold-soft); }
  .gift .about { margin: 0; padding: 2px 0 2px 16px; border-left: 1px solid rgba(255, 255, 255, .22); display: grid; gap: 2px; max-width: 60ch; }
  .gift .about b { font-weight: 600; color: var(--cream); font-size: 15.5px; }
  .gift .about span { color: #cfc5d8; font-size: 16px; }
  .gift .why { margin: 0; max-width: 54ch; color: #d8cfe0; font-size: 17px; }
  .gift .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 0; }
  .gift .acts .btn { min-height: 46px; padding: 0 20px; font-size: 15px; }
  .gift .acts .btn.ghost { background: transparent; color: var(--cream); border-color: rgba(255, 255, 255, .28); }
  .gift .acts .btn.ghost:hover { border-color: var(--cream); }
  .gift .asked { margin: 6px 0 0; display: flex; align-items: center; gap: 10px; color: var(--gold-soft); font-weight: 600; }
  .gift .fine { margin: 0; color: #a99fb4; font-size: 13.5px; }
  .gift.looking { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
  .gift.looking h3 { color: var(--muted); font-size: clamp(26px, 2.6vw, 34px); }
  @media (max-width: 979px) { .gift.looking { display: none; } .gift { padding: 28px 22px; } }

  /* After the reading: the gift and "This is you" wait on top of the page. */
  #tops { max-width: 1296px; margin: 0 auto; padding: 22px 28px 0; display: grid; gap: 18px; }
  #tops + main { padding-top: 22px; }
  #gift-keep .gift { padding: 26px clamp(22px, 2.6vw, 34px) 22px; gap: 12px; }
  #gift-keep .gift h3 { font-size: clamp(26px, 2.6vw, 34px); max-width: 40ch; }
  .welcome { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px clamp(20px, 2.6vw, 30px); display: grid; gap: 12px; animation: line-in .6s cubic-bezier(.2, .8, .2, 1) both; }
  .welcome .eyebrow { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  .welcome h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15; max-width: 50ch; }
  .welcome h3 b { font-weight: 400; font-style: italic; }
  .welcome ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 24px; }
  .welcome li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; color: var(--ink-2); font-size: 15px; }
  .welcome li b { color: var(--ink); font-weight: 600; }
  .welcome li .icon { margin-top: 2px; color: var(--amber); }
  .welcome .acts { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 4px 0 0; }
  .welcome .acts .fine { color: var(--muted); font-size: 13.5px; }
  .read-strip { max-width: 1240px; margin: 14px auto 0; display: flex; gap: 10px; align-items: center; color: #c9bfd3; font-size: 14.5px; }
  /* While it reads, the whole page is the stage: the banner's night, warm light and plum. */
  html.first-read, html.first-read body {
    min-height: 100%;
    background:

<script>
(function () {
  "use strict";

  var cab = window.cabinet;
  var V2 = !!(cab && cab.connectors && cab.files && cab.jobs);
  var MORNING = "morning-brand-sort";
  var DAY = 86400000;
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = {
    appPath: appPathFromUrl(),
    here: null,
    gmail: null,
    jobs: [],
    loaded: false,
    data: null,
    example: true,
    setup: null,
    running: false,
    connecting: false,
    note: "",
    drawer: null,     // { list, id, lang }
    counted: false,
    reading: null,
    sawReading: false,
    readShown: 0,
    readStartedAt: null,
    profile: null,
    profileSeen: "",
    giftDone: "",
    giftAsked: "",
    giftShownAt: "",
    mineReady: false
  };

  var $ = function (id) { return document.getElementById(id); };

  // ── Small helpers ──────────────────────────────────────────────────────

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function icon(id) { return '<svg class="icon" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function str(v) { return typeof v === "string" ? v.trim() : ""; }
  function list(v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === "object"; }) : []; }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function appPathFromUrl() {
    var parts = location.pathname.split("/").filter(Boolean);
    var at = parts.length - 2;
    return at >= 0 ? decodeURIComponent(parts[at]) : "brand-desk";
  }
  var toastTimer = 0;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3400);
  }
  function parseTime(v) {
    if (!v) return null;
    var s = String(v);
    // A plain date is that day in the person's own time, not midnight in London.
    var d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T12:00:00") : new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY); }
  /** "Now" for the page: the example is always read as if it came in this morning. */
  function now() {
    var g = state.example && state.data ? parseTime(state.data.generatedAt) : null;
    return g || new Date();
  }
  function dayWords(d) {
    var gap = daysBetween(now(), d);
    if (gap === 0) return "today";
    if (gap === 1) return "tomorrow";
    if (gap > 1 && gap < 7) return d.toLocaleDateString("en-GB", { weekday: "long" });
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function currency() { return str(state.data && state.data.currency) || "INR"; }
  function money(n) {
    if (typeof n !== "number" || !isFinite(n)) return "";
    var cur = currency();
    try {
      return new Intl.NumberFormat(cur === "INR" ? "en-IN" : undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n);
    } catch (e) { return cur + " " + Math.round(n).toLocaleString(); }
  }
  /** The symbol and the digits apart, so the banner can set the symbol smaller. */
  function moneyParts(n) {
    var s = money(n);
    var m = /^([^\d]*)(.*)$/.exec(s);
    return { sym: m ? m[1].trim() : "", num: m ? m[2] : s };
  }
  function amountOf(x) { return typeof x.amount === "number" && isFinite(x.amount) && x.amount > 0 ? x.amount : null; }

  function myName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    if (/^you$/i.test(name)) name = "";
    return name ? name.split(/\s+/)[0] : "";
  }
  function greeting() {
    var h = new Date().getHours();
    var part = h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    var n = myName();
    return part + (n ? ", " + n : "");
  }

  // ── Reading the files ──────────────────────────────────────────────────

  function notFound() { var e = new Error("not written yet"); e.code = "not-found"; return e; }
  function readText(rel) {
    if (V2) return cab.files.read(state.appPath + "/" + rel);
    return fetch(rel, { cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 404) throw notFound();
      if (!r.ok) throw new Error("Could not read " + rel + ".");
      return r.text();
    });
  }
  function readJson(rel) { return readText(rel).then(function (t) { return JSON.parse(t); }); }
  function maybe(p) { return p.catch(function (e) { if (e && e.code === "not-found") return null; throw e; }); }
  function quiet(p) { return p.catch(function () { return null; }); }
  function usable(d) { return d && typeof d === "object" && Array.isArray(d.deals); }

  var loading = null;
  function load() {
    if (loading) return loading;
    loading = Promise.all([
      quiet(maybe(readJson("data/latest.json"))),
      quiet(maybe(readJson("data/status.json"))),
      quiet(maybe(readJson("data/reading.json"))),
      quiet(maybe(readJson("data/profile.json")))
    ]).then(function (got) {
      state.status = got[1] && typeof got[1] === "object" ? got[1] : null;
      setReading(cleanReading(got[2]));
      state.profile = cleanProfile(got[3]);
      if (usable(got[0]) && got[0].example !== true) {
        state.data = got[0];
        state.example = false;
        return null;
      }
      if (state.data && !state.example) return null;
      return maybe(readJson("data/EXAMPLE-latest.json")).then(function (ex) {
        state.data = usable(ex) ? ex : null;
        state.example = true;
      });
    }).catch(function () {}).then(function () {
      state.loaded = true;
      loading = null;
      paint();
    });
    return loading;
  }

  // ── The first sort: getting to know the creator ────────────────────────
  // The first sort reads further back than the morning ones. As it reads, the agent adds a
  // line to data/reading.json for each thing it finds (through first-sort.mjs, which counts
  // every number), and the page tells them one by one. Early on it also leaves one gift:
  // the thing the creator can act on right now. At the end it writes data/profile.json,
  // shown once as "This is you".

  var READ_FRESH_MIN = 20;
  var REVEAL_MS = 1200;
  var GIFT_KEY = "brand-desk-gift-done@1";
  var GIFT_KEEP_DAYS = 3;
  var PROFILE_SEEN_KEY = "brand-desk-profile-seen@1";

  /** A time the agent wrote: real, and not in the future. */
  function writtenAt(v) {
    var d = parseTime(v);
    return d && d.getTime() <= Date.now() + 5 * 60000 ? d : null;
  }
  function cleanReading(d) {
    if (!d || typeof d !== "object" || !Array.isArray(d.lines)) return null;
    var lines = d.lines.map(function (l) { return str(typeof l === "string" ? l : l && l.text).slice(0, 200); }).filter(Boolean).slice(-14);
    return { startedAt: d.startedAt, done: d.done === true, lines: lines, gift: cleanGift(d.gift) };
  }
  function cleanGift(g) {
    if (!g || typeof g !== "object" || !writtenAt(g.at)) return null;
    var kind = ["deal", "late", "fake", "calm"].indexOf(g.kind) >= 0 ? g.kind : null;
    var t = function (v, n) { return str(v).slice(0, n); };
    var gift = { kind: kind, at: g.at, who: t(g.who, 80), subject: t(g.subject, 140), gist: t(g.gist, 140),
      since: writtenAt(g.since), threadId: t(g.threadId, 30), amount: t(g.amount, 30) };
    if (!kind || (kind !== "calm" && !gift.who) || ((kind === "deal" || kind === "late") && !gift.since) || (kind === "late" && !gift.amount)) return null;
    return gift;
  }
  function freshReading() {
    var at = state.reading ? writtenAt(state.reading.startedAt) : null;
    return !!at && (Date.now() - at.getTime()) / 60000 < READ_FRESH_MIN;
  }
  function freshLines() { return freshReading() ? state.reading.lines : []; }
  function giftNow() { return freshReading() ? state.reading.gift : null; }
  /** The agent is still reading: the file says so, it is fresh, and the sort runs. */
  function readingNow() { return !!(state.reading && !state.reading.done && state.running && freshReading()); }
  /** Lines that came together are still told one by one; then one beat on "Putting your page together". */
  function revealing() { return !!(state.sawReading && state.reading && state.readShown < freshLines().length + (state.reading.done ? 1 : 0)); }
  function firstRead() { return !!((state.running && (state.example || !state.data)) || revealing()); }
  setInterval(function () {
    if (!revealing()) return;
    state.readShown++;
    if (revealing()) paintRead(); else paint();
  }, REVEAL_MS);
  function setReading(r) {
    if (r && r.startedAt !== state.readStartedAt) { state.readShown = 0; state.readStartedAt = r.startedAt; }
    state.reading = r;
  }
  function lineHtml(line) { return esc(line).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }

  function waitedWords(since) {
    var days = Math.max(0, daysBetween(since, new Date()));
    if (days === 0) return { b: "today", plain: true };
    if (days === 1) return { b: "since yesterday", plain: true };
    return { b: days + " days", plain: false };
  }
  function giftParts(g) {
    var who = "<b>" + esc(g.who) + "</b>";
    var thread = g.threadId ? " (Gmail thread " + g.threadId + ")" : "";
    var about = g.subject ? '"' + g.subject + '"' : "their last email";
    var money = g.amount ? ' <b class="n">' + esc(g.amount) + "</b>" : "";
    if (g.kind === "deal") {
      var w = waitedWords(g.since);
      return {
        head: g.amount
          ? who + " offered you" + money + (w.plain ? ", and wrote " + w.b + "." : ' and has waited <b class="n">' + w.b + "</b> for your answer.")
          : w.plain ? who + " wants to work with you. They wrote " + w.b + "." : who + ' wants to work with you, and has waited <b class="n">' + w.b + "</b> for your answer.",
        button: "Write my reply", icon: "i-pen",
        ask: "Write my reply to " + g.who + " about " + about + thread + ". Read the whole conversation first. Use my rates and how my replies sound from brand-desk/setup.md; when a rate is not set, write [your rate]. If the email asks for usage rights, long exclusivity or late payment, push back politely. Put [brackets] around anything I need to decide. Show it to me here. Put it in my Gmail drafts only if I say yes, and never send it."
      };
    }
    if (g.kind === "late") {
      var l = waitedWords(g.since);
      return {
        head: who + " still owes you" + money + ". You sent the invoice " + (l.plain ? l.b : '<b class="n">' + l.b + " ago</b>") + ".",
        button: "Write a polite reminder", icon: "i-pen",
        ask: "Write a short, polite payment reminder to " + g.who + " about " + about + thread + ". Read the conversation first and use the invoice number and amount written there. Write it the way I write. Show it to me here. Put it in my Gmail drafts only if I say yes, and never send it."
      };
    }
    if (g.kind === "fake") {
      return {
        head: "Careful: " + who + " wrote to you, and it looks fake.",
        why: "Don’t click anything in it. I can show you what gives it away, and how to report it.",
        button: "Show me why", icon: "i-shield",
        ask: "The email from " + g.who + " about " + about + thread + " looks fake. Without opening any link or attachment in it, tell me in a few plain lines what gives it away, and how I report it to Gmail and to the platform it pretends to be. Change nothing in Gmail."
      };
    }
    return {
      head: "No brand is waiting on you. A good place to be.",
      why: "Want a short list of brands that fit what you make, with a pitch ready for each?",
      button: "Find brands for me", icon: "i-bulb",
      ask: "Look at what I make (brand-desk/setup.md and the brands I worked with in my email) and suggest 5 kinds of brands that fit me, each with one real reason from my content and a short pitch email in my voice with [brackets] for what I decide. Send nothing."
    };
  }
  function giftHtml(g, where) {
    var p = giftParts(g);
    var link = g.threadId && g.kind !== "fake" ? "https://mail.google.com/mail/u/0/#all/" + encodeURIComponent(g.threadId) : "";
    var asked = state.giftAsked === g.at;
    var arrive = where === "reading" && state.giftShownAt !== g.at;
    if (where === "reading") state.giftShownAt = g.at;
    return '<section class="gift' + (arrive && !REDUCED ? " arrive" : "") + '" aria-live="polite">' +
      '<p class="eyebrow">' + icon("i-star") + (where === "reading" ? "While I read, I found this for you" : "Found while reading your email") + "</p>" +
      "<h3>" + p.head + "</h3>" +
      (g.subject || g.gist ? '<p class="about">' + (g.subject ? "<b>" + esc(g.subject) + "</b>" : "") + (g.gist ? "<span>" + esc(g.gist) + "</span>" : "") + "</p>" : "") +
      (p.why ? '<p class="why">' + esc(p.why) + "</p>" : "") +
      (asked
        ? '<p class="asked">' + icon("i-check") + "Asked. Your brand manager is on it in the chat.</p>"
        : '<div class="acts">' + (canAct() ? '<button type="button" class="btn gold" data-act="gift-do">' + icon(p.icon) + esc(p.button) + "</button>" : "") +
          (link ? '<a class="btn ghost" href="' + esc(link) + '" target="_blank" rel="noopener">' + icon("i-out") + "Open in Gmail</a>" : "") +
          (where === "keep" ? '<button type="button" class="btn ghost" data-act="gift-skip">Not now</button>' : "") + "</div>") +
      '<p class="fine">' + (g.kind === "fake" ? "Nothing changes in Gmail." : "Nothing is sent. You see every word first.") + "</p></section>";
  }
  function giftDoneNow(g) {
    state.giftDone = g.at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") Promise.resolve(cab.mine.set(GIFT_KEY, g.at)).catch(function () {});
  }

  function readingHtml() {
    var all = freshLines();
    state.sawReading = true;
    var lines = all.slice(0, Math.min(state.readShown, all.length));
    var done = !!(state.reading && state.reading.done) && lines.length === all.length;
    var gift = giftNow();
    return '<div class="read-page' + (!gift && done ? " solo" : "") + '"><div class="reading" aria-live="polite"><h2>Reading your email</h2>' +
      "<p>Getting to know you and your brand deals. About a minute. You don’t need to do anything.</p>" +
      '<ul class="read-lines">' + lines.map(function (l, i) { return "<li" + (i < lines.length - 1 ? ' class="old"' : "") + ">" + icon("i-check") + "<span>" + lineHtml(l) + "</span></li>"; }).join("") +
      '<li class="now"><i class="pulse-dot" aria-hidden="true"></i><span>' + (done ? "Putting your brand desk together" : lines.length ? "Reading on" : "Opening your Gmail") + "...</span></li></ul>" +
      '<p class="fine">Only reads. Nothing is sent, and it all stays in your cabinet.</p></div>' +
      (gift ? giftHtml(gift, "reading")
        : done ? ""
        : '<section class="gift looking"><i class="pulse-dot" aria-hidden="true"></i><h3>Looking for one thing I can take off your plate right now.</h3></section>') +
      "</div>";
  }
  function paintRead() {
    var on = firstRead();
    document.documentElement.classList.toggle("first-read", on);
    $("read").hidden = !on;
    $("read").innerHTML = on ? readingHtml() : "";
  }

  function cleanProfile(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    var c = d.creator && typeof d.creator === "object" ? d.creator : {};
    var num = function (v) { return typeof v === "number" && isFinite(v) && v >= 0 ? v : null; };
    var brands = Array.isArray(d.brands) ? d.brands.map(function (v) { return str(v).slice(0, 60); }).filter(Boolean).slice(0, 5) : [];
    return {
      at: d.at, name: str(d.name).slice(0, 40),
      creator: { what: str(c.what).slice(0, 120), where: str(c.where).slice(0, 60) },
      brands: brands, brandsMore: num(d.brandsMore) || 0,
      replyHours: num(d.replyHours), signOff: str(d.signOff).slice(0, 60), mail30: num(d.mail30)
    };
  }
  function replyWords(h) {
    if (h < 1) return "within the hour";
    if (h < 36) { var r = Math.round(h); return "in about " + r + " " + plural(r, "hour", "hours"); }
    var dd = Math.round(h / 24);
    return "in about " + dd + " " + plural(dd, "day", "days");
  }
  function paintTops() {
    // The gift stays on top for a few days after the reading, until it is used or put away.
    var g = state.reading && state.reading.gift;
    var at = g ? writtenAt(g.at) : null;
    var keep = !!(g && at && state.mineReady && state.giftDone !== g.at && (Date.now() - at.getTime()) < GIFT_KEEP_DAYS * DAY &&
      !state.example && !readingNow() && !revealing());
    $("gift-keep").hidden = !keep;
    $("gift-keep").innerHTML = keep ? giftHtml(g, "keep") : "";

    // "This is you", once, and only when it learned something about them, not counts alone.
    var pr = state.profile;
    var known = pr && (pr.creator.what || pr.brands.length || pr.signOff);
    var show = !!(state.mineReady && known && state.loaded && !state.example && canAct() && pr.at !== state.profileSeen && !readingNow() && !revealing());
    var el = $("welcome");
    el.hidden = !show;
    if (show) {
      var facts = [];

      '<div class="d-tip">Words in <mark>gold</mark> are your choices: a price, a date, a name. Tap the text to change anything before you send.</div></div>' +
      '<div class="d-foot"><button class="btn dark" data-act="drafts">' + icon("i-mail") + "Put in Gmail drafts</button>" +
      '<button class="btn" data-act="copy">' + icon("i-copy") + "Copy</button>" +
      '<button class="btn quiet" data-act="close">Not now</button>' +
      '<div class="note">Nothing is sent. You send it from Gmail when you are happy with it.</div></div>';
    writeDraft(type);
  }
  /** The reply types itself the first time, then it is the person's to edit. */
  function writeDraft(type) {
    clearInterval(typing);
    var el = $("draft");
    var t = draftText();
    el.removeAttribute("contenteditable");
    if (!type || REDUCED) { el.innerHTML = marked(t); el.setAttribute("contenteditable", "true"); return; }
    var i = 0;
    typing = setInterval(function () {
      i = Math.min(t.length, i + 3 + Math.floor(Math.random() * 3));
      // Never stop inside a [choice]: it would show a half-open bracket.
      var cut = t.slice(0, i);
      if (cut.lastIndexOf("[") > cut.lastIndexOf("]")) { var close = t.indexOf("]", i); if (close > 0) { i = close + 1; cut = t.slice(0, i); } }
      el.innerHTML = marked(cut) + (i < t.length ? '<span class="caret"></span>' : "");
      if (i >= t.length) { clearInterval(typing); el.setAttribute("contenteditable", "true"); }
    }, 18);
  }
  function currentDraft() {
    var el = $("draft");
    return el ? el.innerText.replace(/ /g, " ").trim() : "";
  }
  function copyDraft() {
    var t = currentDraft();
    var done = function () { toast("Copied. Paste it in your reply in Gmail."); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
    } else { fallbackCopy(t); done(); }
  }
  function fallbackCopy(t) {
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* nothing more to try */ }
    ta.remove();
  }
  function toDrafts() {
    var dr = state.drawer, x = dr && findItem(dr.list, dr.id);
    if (!x) return;
    if (state.example) { toast("This is the example inbox. Connect Gmail and this puts the reply in your Gmail drafts."); return; }
    if (!canAct()) { toast("Only the owner of this cabinet can do that."); return; }
    var t = currentDraft();
    ask("Put this reply in my Gmail drafts, as a reply in the thread " + (str(x.threadId) || "with " + (x.brand || x.from)) +
      ". Do not send it. Here is the text:\n\n" + t).then(function (ok) { if (ok) closeReply(); });
  }


  // ── Ask, or try an idea ────────────────────────────────────────────────
  var ASK_IDEAS = [{"title":"Make my rate card","ask":"Make me a one-page rate card from my past brand deals in my email: what I made (reels, stories, YouTube parts), what brands paid for each, and a fair rate for each from that. Use [brackets] where my email has no answer. Save it as a page in reports."},{"title":"Brands I worked with this year","ask":"List every brand I worked with this year from my email: what I made for them, what they paid, and whether they paid on time. Save it as a page in reports."},{"title":"Chase every late payment","ask":"Find every invoice I sent that is still not paid after its due date. For each, write a short polite reminder in my voice. Show them to me one by one, and send nothing."},{"title":"Turn fan questions into video ideas","ask":"Read the questions my fans sent me in the last 30 days and turn the most asked ones into 5 video ideas, each with a title and an opening line."},{"title":"Is this offer real?","ask":"I want to check if a brand offer in my email is real. Ask me which one, then tell me in a few plain lines what looks real and what looks fake, without opening any link in it."}];
  var askNote = "";
  function askBoxHtml() {
    return '<h2 id="h-ask">Ask, or try an idea</h2><p>Your brand manager reads your email and answers in the chat. Nothing is sent.</p>' +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" style="position:absolute;left:-9999px">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about brands, offers, payments..." />' +
      '<button type="submit" class="btn gold">Ask</button></form>' +
      '<p class="qs-label">Ideas</p><div class="qs">' + ASK_IDEAS.map(function (idea, i) {
        return '<button type="button" class="qchip" data-act="ask-idea" data-i="' + i + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" +
      '<p class="note" id="ask-note" aria-live="polite">' + esc(askNote) + "</p>";
  }
  function setAskNote(words) { askNote = words; if ($("ask-note")) $("ask-note").textContent = words; }
  /** Before Gmail is connected there is nothing to read: the question leads to connecting first. */
  function askFromBox(words) {
    var q = str(words).slice(0, 3900);
    if (!q) return;
    var s = gmailState();
    if (V2 && s && s !== "connected" && s !== "needs-you" && s !== "needs-sign-in") {
      if (state.gmail && state.gmail.canConnect) { toast("Connect Gmail first. It takes a minute or two."); connect(); }
      else toast("Gmail can’t be connected here yet.");
      return;
    }
    setAskNote("Asking...");
    Promise.resolve(ask(q)).then(function (ok) {
      setAskNote(ok ? "Asked. The answer is coming in the chat next to this page." : "");
      if (ok && $("ask-input")) $("ask-input").value = "";
    });
  }
  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    askFromBox($("ask-input").value);
  });
  document.addEventListener("click", function (event) {
    var el = event.target.closest('[data-act="ask-idea"]');
    if (!el) return;
    var idea = ASK_IDEAS[+el.getAttribute("data-i")];
    if (idea) askFromBox(idea.ask);
  });

  // ── Clicks ─────────────────────────────────────────────────────────────

  document.addEventListener("click", function (event) {
    var el = event.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "connect") connect();
    else if (act === "run") runNow();
    else if (act === "reply") openReply(el.getAttribute("data-list"), el.getAttribute("data-id"));
    else if (act === "close") closeReply();
    else if (act === "copy") copyDraft();
    else if (act === "drafts") toDrafts();
    else if (act === "gift-do" || act === "gift-skip") {
      var g = state.reading && state.reading.gift;
      if (!g) return;
      if (act === "gift-skip") { giftDoneNow(g); paintTops(); return; }
      ask(giftParts(g).ask).then(function (ok) {
        if (!ok) return;
        state.giftAsked = g.at;
        giftDoneNow(g);
        if (firstRead()) paintRead(); else { $("gift-keep").innerHTML = giftHtml(g, "keep"); }
      });
    }
    else if (act === "profile-ok") markProfileSeen();
    else if (act === "profile-fix") {
      markProfileSeen();
      if (V2) cab.ask("About me, please fix this: ", { send: false }).catch(function () {});
    }
    else if (act === "lang" && state.drawer) {
      state.drawer.lang = el.getAttribute("data-lang");
      paintDrawer(true);
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.drawer) closeReply(); });

  // ── Start ──────────────────────────────────────────────────────────────

  if (V2) {
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var seen = mine ? mine.get(PROFILE_SEEN_KEY) : null;
      if (typeof seen === "string") state.profileSeen = seen;
      var gd = mine ? mine.get(GIFT_KEY) : null;
      if (typeof gd === "string") state.giftDone = gd;
      state.mineReady = true;
      if (state.loaded) paint();
    }).catch(function () {});
    cab.connectors.list().then(function (items) {
      state.gmail = pickGmail(items) || { id: "gmail", state: "not-available-here", canConnect: false };
      paintNotice();
    }).catch(function () {});
    cab.connectors.onChange(function (items) { var g = pickGmail(items); if (g) { state.gmail = g; paintNotice(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
  }
})();
</script>
</body>
</html>
