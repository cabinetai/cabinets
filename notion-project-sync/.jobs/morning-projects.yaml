id: morning-projects
name: Morning projects
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: project-tracker
agentSlug: project-tracker
timeout: 900
prompt: |-
  Write this morning's projects brief.

  Your working directory is the cabinet root. Your persona holds the rules: where Cabinet
  keeps the Notion pages, how to read a task database, and what the brief holds. Follow its
  order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and list `projects/`.
  2. Find the Notion line in "Connections this cabinet uses". If it says Notion is not
     connected, or names no folder, or the folder it names cannot be read, write only
     `this-week/data/status.json` as `{"at":"<now>","ok":false,"why":"<why, in plain
     words>"}`, add `NEEDS_CONNECTION: notion | <why, in plain words>` to your cabinet block,
     and stop.
  3. Run `node this-week/read-notion.mjs "<folder>"` (every Notion folder, each quoted). It
     writes the This week page's data. If it fails, say why in one sentence and go on.
  4. Find the task databases and read them as your persona's "The morning read" says.
  5. Write `projects/<YYYY-MM-DD>.md` with the five sections your persona lists, in that
     order.
  6. On the first run that writes a brief, delete `projects/EXAMPLE-brief.md`.

  This routine only reads. Never change a database or a page in the Notion copy here.

  Finish in one or two plain sentences and nothing else: how many tasks are open, how many
  are overdue, and the one task that matters most today.
createdAt: '2026-11-03T00:00:00.000Z'
updatedAt: '2026-11-04T00:00:00.000Z'
