id: file-new-documents
name: File New Documents
enabled: true
schedule: 0 20 * * *
provider: codex-cli
adapterType: claude_local
ownerAgent: filing-clerk
agentSlug: filing-clerk
timeout: 1800
prompt: |-
  Bring the list of documents up to date.

  Your working directory is the cabinet root. The list is one file, `whats-in-here.md`,
  and you rewrite it in place. It describes the folder as it is right now, so there is no
  history and no second copy: overwrite it, and never write a dated version beside it.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the rules about dates and duplicates, and what you may and may not write
     down about a private document. This prompt does not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out. If more than one Drive folder is here, list them all in one
     page, one section per folder.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `whats-in-here.md` exactly as you found it, example and all, and report: "There is
     no Google Drive folder in this cabinet yet. Connect Google Drive from Integrations
     and pick the folder your documents are in, then run this again." Then exit.
  4. Read `whats-in-here.md` first. Every row in it that still points at a file that is
     still there is a row you keep as it is: it was read properly once and reading it
     again changes nothing. Spend this run on what is new, and drop the rows whose file
     has gone.
  5. Open each new document far enough to fill in four columns, which is usually its
     first page. A folder with hundreds of new files is a folder to group, not a folder
     to read one by one.
  6. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. Never fall back to the example's contents
     or to what a normal documents folder would hold.
  7. On the first run that does read a folder, replace the whole of `whats-in-here.md`,
     example banner and all. Never leave a made-up document sitting in a real list.
  8. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder, however untidy it looks. Write only `whats-in-here.md`.
cabinetPath: google-drive-my-documents
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
