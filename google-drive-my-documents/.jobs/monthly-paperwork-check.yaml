id: monthly-paperwork-check
name: Monthly Paperwork Check
enabled: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
ownerAgent: filing-clerk
agentSlug: filing-clerk
timeout: 1200
prompt: |-
  Write what is coming up in the paperwork.

  Your working directory is the cabinet root. Coming up is one file, `coming-up.md`, and
  you rewrite it in place. It is what is ahead as of today, so there is no history and no
  second copy: overwrite it, and never write a dated version beside it.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the twelve-month horizon and what you may and may not write down about a
     private document. This prompt does not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `coming-up.md` exactly as you found it, example and all, and report: "There is no
     Google Drive folder in this cabinet yet. Connect Google Drive from Integrations and
     pick the folder your documents are in, then run this again." Then exit.
  4. Read `whats-in-here.md` first and use it to choose where to look. The documents with
     dates in them are leases, policies, contracts, licences, warranties, letters that
     ask for a reply and anything with a notice period. Receipts almost never carry one.
  5. Every row needs a date you actually read inside a document, and the last column
     names the document it came from. A thing that usually renews annually is not a date.
     A blank page with a line saying nothing is due in the next twelve months is a good
     answer.
  6. Anything whose date has already gone and that nothing in the folder shows was dealt
     with goes under "Gone by". That is the section that earns the page.
  7. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. Never invent a renewal date.
  8. On the first run that does read a folder, replace the whole of `coming-up.md`,
     example banner and all.
  9. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder. Write only `coming-up.md`.
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
