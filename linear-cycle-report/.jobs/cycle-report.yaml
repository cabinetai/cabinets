id: cycle-report
name: Cycle report
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: delivery-analyst
agentSlug: delivery-analyst
timeout: 900
prompt: |-
  Write this week's cycle report and refresh the Cycle report app.

  Your working directory is the cabinet root. Your persona holds the rules: where the copy
  of Linear is, which pages to read, how to count scope and risk, and the shape of every
  file. Follow its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, list
     `cycle-report/data/` and `reports/`, and, if it is there, read
     `cycle-report/data/latest.json` (last week's work, with each cycle's starting scope).
  2. Find the line from Cabinet that starts "The files under /data/" and says they are a
     view-only copy of the person's Linear workspace. If there is no such line, or the
     folder it names cannot be read, write only `cycle-report/data/status.json` with
     `ok: false` and a plain `why`, change nothing else, and stop.
  3. Read the copy as your persona's "The Friday read" says: the cycle pages in `Cycles/`,
     the issue pages they list only as far as you need, and the projects in `Projects/`.
  4. In one Bash call, write `reports/<YYYY-MM-DD> cycle.md`,
     `cycle-report/data/latest.json` (and check it parses) and
     `cycle-report/data/status.json` with `ok: true`. When a cycle ended since the last
     report, also write `reports/<its last day> <TEAM> cycle <number> retro draft.md`, once per cycle.
  5. On the first run that writes `latest.json`, delete
     `cycle-report/data/EXAMPLE-latest.json` and `cycle-report/data/EXAMPLE-latest.he.json`.
     They are a made-up company, not your data. Never copy anything from them.

  You only read. Never edit a page in the Linear copy, and never try to reach Linear in
  any other way: you hold no Linear key.

  Finish in one or two plain sentences about the cycles and nothing else: how far along
  each team is, and the one thing most likely to slip, if there is one.
createdAt: '2026-10-20T00:00:00.000Z'
updatedAt: '2026-10-20T00:00:00.000Z'
