<!DOCTYPE html>
<!--
  Cycle Report: the home of a cabinet that writes a team's weekly Linear cycle report. The
  cabinet opens on it.

  What it shows: every team's current cycle on a charcoal sheet, four numbers (cycle done,
  scope added, issues at risk, projects at risk), then one section per team's cycle (done of
  total as a thin bar, scope added since the start, the issues at risk and why) and the
  projects with their health and latest update. The Ask box sends questions to the Delivery Analyst.

  Where the words come from: the Cycle report routine reads the copy Cabinet keeps of
  the Linear workspace every Friday and writes data/latest.json beside this page (DATA.md has
  the shape; data/EXAMPLE-latest.json and EXAMPLE-latest.he.json are a made-up company, always
  labelled as an example here, deleted on the first real run). data/status.json says when a
  run failed.

  How it talks to Cabinet: window.cabinet v2 (connection state, connect, ask, run the routine,
  read files). It never changes anything in Linear. One file on purpose: a sealed frame cannot
  load files next to it. Inter and Source Serif 4 from Google Fonts; icons are Lucide, inline.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cycle report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500..700&display=swap" rel="stylesheet" />
<style>
  /* Linear's monochrome palette keeps the hero distinct from the neutral sheets.
     Workflow states and warnings retain their semantic colours. */
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --desk: #f4f4f5;
    --sheet: oklch(1 0 0);
    --wash: #f7f7f8;
    --ink: #222326;
    --ink-2: #414247;
    --muted: #6b6c72;
    --line: #e3e3e5;
    --primary: #222326;
    --primary-fg: oklch(1 0 0);
    --ring: #72737a;
    --ln: #55565c;
    --ln-ink: #414247;
    --ln-wash: color-mix(in oklch, #222326 6%, var(--sheet));
    --night-top: #171719;
    --night-low: #333336;
    --night-ink: #f5f5f5;
    --night-ink-2: rgba(245, 245, 245, 0.78);
    --track: color-mix(in oklch, var(--ink) 10%, transparent);
    --green: #6fa45a;
    --amber: #e08a3c;
    --terra: #e2725b;
    --green-ink: color-mix(in oklch, var(--green) 62%, var(--ink));
    --amber-ink: color-mix(in oklch, var(--amber) 58%, var(--ink));
    --terra-ink: color-mix(in oklch, var(--terra) 62%, var(--ink));
    --shadow: 0 4px 10px -6px rgb(0 0 0 / 0.16);
    --radius: 0.625rem;
    --sheet-radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #171719; --sheet: #222326; --wash: #2b2c30;
      --ink: #f5f5f5; --ink-2: #d6d6d8; --muted: #aaaab0;
      --line: oklch(1 0 0 / 9%); --primary: #ededee; --primary-fg: #171719;
      --ring: #ededee; --ln: #b6b6bc; --ln-ink: #d6d6d8; --ln-wash: color-mix(in oklch, #ffffff 8%, var(--sheet));
      --track: rgba(255, 255, 255, 0.1);
      --shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 5px 12px -7px rgb(0 0 0 / 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #171719; --sheet: #222326; --wash: #2b2c30;
    --ink: #f5f5f5; --ink-2: #d6d6d8; --muted: #aaaab0;
    --line: oklch(1 0 0 / 9%); --primary: #ededee; --primary-fg: #171719;
    --ring: #ededee; --ln: #b6b6bc; --ln-ink: #d6d6d8; --ln-wash: color-mix(in oklch, #ffffff 8%, var(--sheet));
    --track: rgba(255, 255, 255, 0.1);
    --shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 5px 12px -7px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  a { color: inherit; text-decoration: none; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 8px; }
  ::selection { background: color-mix(in oklch, var(--ln) 26%, transparent); }
  .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  .page { container-type: inline-size; max-width: 1180px; margin: 0 auto; padding: 18px 24px 40px; }

  /* ── Top bar ─────────────────────────────────────────────── */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; padding: 4px 0 18px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .plate { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ln-wash); flex: none; }
  .plate img { width: 32px; height: 32px; border-radius: 7px; display: block; }
  .brand h1 { margin: 0; font: 600 22px/1.15 var(--serif); letter-spacing: -0.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand > div { min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 12px; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill.ok .dot { background: var(--green); }
  .pill.warn .dot { background: var(--amber); }
  .pill.bad .dot { background: var(--terra); }
  .pill.busy .dot { background: var(--ln); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 6px 13px; border-radius: var(--radius); border: 0; background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--wash); }
  .btn.primary { background: var(--primary); color: var(--primary-fg); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in oklch, var(--primary) 88%, black); }
  .btn:disabled { opacity: 0.55; }
  .btn .icon { width: 16px; height: 16px; }
  .quiet { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 4px; color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
  .quiet:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .quiet .icon { width: 15px; height: 15px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── A line above the hero: example, problem, connect ─────────────────── */
  .notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; padding: 11px 14px; border-radius: var(--sheet-radius); background: var(--sheet); box-shadow: var(--shadow); font-size: 14px; }
  .notice p { margin: 0; flex: 1 1 260px; color: var(--ink-2); }
  .notice.bad { background: color-mix(in oklch, var(--terra) 12%, var(--sheet)); }
  .tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--ln-wash); color: var(--ln-ink); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }

  /* ── The hero: a charcoal sheet with a soft glow in one corner ─────────── */
  .hero { padding: 28px 30px; border-radius: 18px; color: var(--night-ink);
    background: radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 38%, transparent 62%), linear-gradient(180deg, var(--night-top) 0%, var(--night-low) 100%);
    box-shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.9); }
  [dir="rtl"] .hero { background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 38%, transparent 62%), linear-gradient(180deg, var(--night-top) 0%, var(--night-low) 100%); }
  .hero .eyebrow { margin: 0 0 6px; color: var(--night-ink-2); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .hero h2 { margin: 0; font: 600 32px/1.12 var(--serif); letter-spacing: -0.015em; }
  .hero .lead { margin: 10px 0 0; color: var(--night-ink-2); font-size: 15.5px; max-width: 65ch; }
  .room { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .room-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 7px 14px; border-radius: var(--radius); border: 0; background: rgba(245, 245, 245, 0.12); color: var(--night-ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .room-btn:hover:not(:disabled) { background: rgba(245, 245, 245, 0.2); }
  .room-btn.light { background: var(--night-ink); color: var(--night-top); }
  .room-btn.light:hover:not(:disabled) { background: #ffffff; }
  .room-btn:disabled { opacity: 0.55; }
  .room-btn .icon { width: 16px; height: 16px; }
  .hero :focus-visible { outline-color: var(--night-ink); }
  /* ── Tiles ────────────────────────────────────────────────────────────── */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
  .tile { padding: 14px 16px; border-radius: var(--sheet-radius); background: var(--sheet); box-shadow: var(--shadow); min-width: 0; }
  .tile .tl { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .tile .tl .icon { width: 15px; height: 15px; color: var(--ln-ink); }
  .tile .tv { margin-top: 4px; font: 600 30px/1.1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile .ts { margin-top: 2px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Boxes and rows ───────────────────────────────────────────────────── */
  .box { min-width: 0; padding: 14px 8px 8px; border-radius: var(--sheet-radius); background: var(--sheet); box-shadow: var(--shadow); }
  .box-h { display: flex; align-items: center; gap: 8px; padding: 0 8px 8px; }
  .box-h h3 { margin: 0; font: 600 17px/1.2 var(--serif); }
  .box-h .icon { color: var(--ln-ink); }
  .box-h .count { color: var(--muted); font-size: 13px; font-weight: 600; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .risk, .project { padding: 7px 8px; overflow-wrap: anywhere; }
  .rows a { font-weight: 600; }
  .rows a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .risk bdi { margin-inline-end: 4px; font-weight: 600; }
  .rows p { margin: 0; color: var(--muted); font-size: 13px; }
  .risk .reason { color: var(--terra-ink); }
  .project .update { color: var(--ink-2); }
  .project-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .empty { margin: 0; padding: 10px 8px 12px; color: var(--muted); font-size: 14px; }
  .health { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
  .health i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .health.onTrack { color: var(--green-ink); } .health.onTrack i { background: var(--green); }
  .health.atRisk { color: var(--amber-ink); } .health.atRisk i { background: var(--amber); }
  .health.offTrack { color: var(--terra-ink); } .health.offTrack i { background: var(--terra); }
  .health.none { color: var(--muted); font-weight: 500; }

  .ask { margin-top: 12px; padding: 18px; border-radius: var(--sheet-radius); background: var(--sheet); box-shadow: var(--shadow); }
  .ask h3 { margin: 0 0 10px; font: 600 18px/1.2 var(--serif); }
  .ask form { display: flex; gap: 8px; }
  .ask input { flex: 1 1 auto; min-width: 0; min-height: 40px; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--sheet); }
  .ask input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { min-height: 32px; padding: 5px 12px; border-radius: 999px; border: 0; background: var(--wash); color: var(--ink-2); font-size: 13.5px; font-weight: 500; text-align: start; }
  .chip:hover:not(:disabled) { background: color-mix(in oklch, var(--ln) 14%, var(--wash)); color: var(--ink); }
  .chip:disabled { opacity: 0.55; }
  .ask .why { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .foot { margin: 22px 2px 0; color: var(--muted); font-size: 13px; max-width: 80ch; }
  .foot p { margin: 0 0 4px; }
  .toast { position: fixed; inset-inline: 0; bottom: 18px; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 10px; background: var(--ink); color: var(--sheet); font-size: 14px; box-shadow: var(--shadow); }

  @container (max-width: 760px) {
    .hero { padding: 22px 20px; }
    .hero h2 { font-size: 27px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @container (max-width: 520px) {
    .bar { align-items: flex-start; }
    .actions { width: 100%; }
    .tile .tv { font-size: 26px; }
  }
  @media (max-width: 520px) { .page { padding: 12px 16px 32px; } }

  .team-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 0 8px 4px; }
  .team-h h3 { margin: 0; font: 600 18px/1.25 var(--serif); min-width: 0; }
  .team-h h3 .key { color: var(--muted); font: 600 13px/1 var(--font); margin-inline-end: 6px; }
  .team-h h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .team-h .dates { color: var(--muted); font-size: 13.5px; }
  .team-h .left { margin-inline-start: auto; color: var(--ln-ink); font-size: 13.5px; font-weight: 600; }
  .pace { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px 24px; padding: 10px 8px 6px; }
  .pace .done { font-size: 15px; color: var(--ink-2); }
  .pace .done b { font: 600 26px/1.1 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
  .pace .stat { text-align: end; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .pace .stat b { display: block; color: var(--ink); font: 600 20px/1.1 var(--font); font-variant-numeric: tabular-nums; }
  .pace .stat.hot b { color: var(--amber-ink); }
  .pace .wide-bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .pace .wide-bar i { display: block; height: 100%; border-radius: inherit; background: var(--ln); }
  .note { margin: 2px 8px 6px; color: var(--ink-2); font-size: 14px; }
  .teams { display: grid; gap: 12px; }
  .projects { margin-top: 12px; }
  .papers { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; color: var(--night-ink-2); font-size: 13px; }
  .papers span { display: inline-flex; align-items: center; gap: 6px; }
  .papers .icon { width: 14px; height: 14px; }
  @container (max-width: 520px) {
    .pace { grid-template-columns: minmax(0, 1fr) auto; }
    .pace .done { grid-column: 1 / -1; }
    .pace .stat { text-align: start; }
  }
</style>
</head>

<main class="page">

      starter1: "כמה היקף נוסף במחזור הזה?",

      connected: "מחובר",
      checked: "נבדק ב-{time}",

      daysLeft_other: "נותרו {n} ימים",
      lastDay: "יום אחרון", ended: "הסתיים",
      doneOf: "{done} מתוך {total}",
      cyclesOff: "אין מחזורים פעילים בעותק הנוכחי.",
      priority0: "ללא עדיפות", priority1: "דחוף", priority2: "גבוהה", priority3: "בינונית", priority4: "נמוכה",
      onTrack: "בזמן", atRisk: "בסיכון", offTrack: "באיחור", noHealth: "עוד אין עדכון",
      dueOn: "יעד למשימה {day}", target: "יעד {day}",
      firstRun: "עוד אין כאן כלום. העדכון הראשון ימלא את הדף, בדרך כלל תוך כמה דקות.",
      notAffiliated: "Cabinet אינו קשור ל-Linear."
    }
  };

  var DAY = 86400000;
  var LANG = pickLang();
  var S = STRINGS[LANG];
  var APP_DIR = "cycle-report", JOB_ID = "cycle-report";
  function pickLang() {
    var forced = /[?&]lang=(he|en)\b/.exec(location.search);
    if (forced) return forced[1];
    var stored = null;
    try { stored = localStorage.getItem("cabinet-locale"); } catch (e) { /* storage blocked in a sealed frame */ }
    var v = String(stored || navigator.language || "").toLowerCase();
    return v.indexOf("he") === 0 || v.indexOf("iw") === 0 ? "he" : "en";
  }
  function t(key, vars) {
    var text = S[key] != null ? S[key] : key;
    if (vars) Object.keys(vars).forEach(function (k) { text = text.split("{" + k + "}").join(String(vars[k])); });
    return text;
  }
  function tn(key, n) { return t(key + (n === 1 ? "_one" : "_other"), { n: n }); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function icon(name, cls) {
    return '<svg class="icon' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }
  function safeUrl(u) { return /^https:\/\/([a-z0-9-]+\.)*linear\.app\//i.test(String(u || "")) ? String(u) : ""; }
  function el(id) { return document.getElementById(id); }

  function followTheme() {
    var forced = /[?&]theme=(dark|light)\b/.exec(location.search);
    if (forced) { document.documentElement.setAttribute("data-theme", forced[1]); return; }
    try {
      var root = window.parent !== window ? window.parent.document.documentElement : null;
      if (root) document.documentElement.setAttribute("data-theme", root.classList.contains("dark") ? "dark" : "light");
    } catch (e) { /* a sealed frame: the system setting decides */ }
  }
  function watchTheme() {
    followTheme();
    try {
      if (window.parent !== window && window.MutationObserver)
        new MutationObserver(followTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ["class"] });
    } catch (e) { /* a sealed frame */ }
  }

  // ── Dates ─────────────────────────────────────────────────────────────
  var LOCALE = function () { return LANG === "he" ? "he-IL" : "en-GB"; };
  function parse(v) {
    if (!v) return NaN;
    var s = String(v);
    return Date.parse(s.length === 10 ? s + "T12:00:00" : s);
  }
  function startOfDay(ms) { var d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function dayDiff(ms, now) { return Math.round((startOfDay(ms) - startOfDay(now)) / DAY); }
  function fmt(ms, opts) { try { return new Intl.DateTimeFormat(LOCALE(), opts).format(new Date(ms)); } catch (e) { return new Date(ms).toDateString(); } }
  function fmtTime(ms) { return fmt(ms, { hour: "2-digit", minute: "2-digit" }); }
  function fmtDay(ms) { return fmt(ms, { day: "numeric", month: "short" }); }
  function fmtLong(ms) { return fmt(ms, { weekday: "long", day: "numeric", month: "long" }); }
  function daysLeft(endsAt, now) {
    var ms = parse(endsAt);
    if (isNaN(ms)) return "";
    var d = dayDiff(ms, now);
    if (d < 0) return t("ended");
    if (d === 0) return t("lastDay");
    return tn("daysLeft", d);
  }

  // ── Linear's things, drawn Cabinet's way ──────────────────────────────
  function healthBadge(h) {
    var key = h === "onTrack" || h === "atRisk" || h === "offTrack" ? h : null;
    return '<span class="health ' + (key || "none") + '"><i></i>' + esc(t(key || "noHealth")) + "</span>";
  }
  function riskRow(issue) {
    var url = safeUrl(issue.url);
    var due = parse(issue.due);
    var priority = Number(issue.priority);
    var details = [issue.assignee, issue.state, t("priority" + ([1, 2, 3, 4].includes(priority) ? priority : 0)),
      isNaN(due) ? "" : t("dueOn", { day: fmtDay(due) })].filter(Boolean).join(" · ");
    var title = '<bdi>' + esc(issue.identifier) + '</bdi> <span dir="auto">' + esc(issue.title) + "</span>";
    return '<li class="risk">' +
      (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + title + "</a>" : title) +
      (issue.why ? '<p class="reason" dir="auto">' + esc(issue.why) + "</p>" : "") +
      '<p dir="auto">' + esc(details) + "</p></li>";
  }
  function rowsOrEmpty(list, emptyText, draw) {
    if (!list || !list.length) return '<p class="empty">' + esc(emptyText) + "</p>";
    return '<ul class="rows">' + list.map(draw).join("") + "</ul>";
  }
  function tile(ic, label, value, sub) {
    return '<div class="tile"><div class="tl">' + icon(ic) + esc(label) + '</div><div class="tv"><span dir="ltr">' + esc(value) + '</span></div><div class="ts" dir="auto">' + esc(sub || " ") + "</div></div>";
  }
  function projectRow(p) {
    var url = safeUrl(p.url);
    var target = parse(p.targetDate);
    var updateAt = parse(p.updateAt);
    var by = [p.updateBy, isNaN(updateAt) ? "" : fmtDay(updateAt)].filter(Boolean).join(", ");
    var update = p.update ? p.update + (by ? " (" + by + ")" : "") : "";
    var details = [p.lead, isNaN(target) ? "" : t("target", { day: fmtDay(target) }),
      Math.round((p.progress || 0) * 100) + "%"].filter(Boolean).join(" · ");
    var name = '<bdi>' + esc(p.name) + "</bdi>";
    return '<li class="project"><div class="project-h">' +
      (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + name + "</a>" : name) +
      healthBadge(p.health) + "</div>" +
      (update ? '<p class="update" dir="auto">' + esc(update) + "</p>" : "") +
      '<p dir="auto">' + esc(details) + "</p></li>";
  }

  // ── The bridge ────────────────────────────────────────────────────────
  var C = window.cabinet && window.cabinet.connectors ? window.cabinet : null;
  var APP = {
    conn: null, jobs: [], role: "owner", data: null, status: null, example: false,
    firstReadStarted: false, jobsLoaded: false, toastTimer: 0
  };
  function toast(text) {
    var node = el("toast");
    node.textContent = text;
    node.hidden = false;
    clearTimeout(APP.toastTimer);
    APP.toastTimer = setTimeout(function () { node.hidden = true; }, 3800);
  }
  function job() { var id = JOB_ID; return APP.jobs.filter(function (j) { return j.id === id; })[0] || null; }
  /** Why asking cannot happen here, or "" when it can. */
  function askBlock() {
    if (!C) return t("outsideWhy");
    if (APP.role === "viewer") return t("viewerWhy");
    var l = APP.conn;
    if (!l || l.state !== "connected") return t("connectWhy");
    return "";
  }
  /** Resolves true when the ask reached the chat, so the caller keeps typed text on a failure. */
  function ask(text) {
    if (!C || !text) return Promise.resolve(false);
    return C.ask(text).then(function () { toast(t("asked")); return true; }, function (e) { toast(e.message); return false; });
  }
  function runNow() {
    if (!C) return;
    C.jobs.run(JOB_ID).then(function () { toast(t("started")); }, function (e) { toast(e.message); });
  }
  function maybeRunExample() {
    var connection = APP.conn;
    var j = job();
    if (
      !C ||
      !APP.jobsLoaded ||
      APP.role === "viewer" ||
      !APP.example ||
      // A run that already reported, even a failed one, waits for a press.
      APP.status ||
      APP.firstReadStarted ||
      !connection ||
      connection.state !== "connected" ||
      (j && j.running)
    ) return;
    APP.firstReadStarted = true;
    runNow();
  }
  function connect() {
    if (!C) return;
    C.connectors.connect("linear").catch(function (e) { toast(e.message); });
  }
  function workspaceUrl() { return safeUrl(APP.data && APP.data.workspaceUrl) || "https://linear.app/"; }

  function pill() {
    var l = APP.conn;
    var j = job();
    var busy = (l && l.busy) || (j && j.running);
    if (!C) return ["", t("outside")];
    if (!l) return ["", t("notConnected")];
    if (busy) return ["busy", t("updating")];
    if (l.state === "not-added") return ["", t("notConnected")];
    if (l.state === "needs-sign-in") return ["warn", t("needsSignIn")];
    if (l.state === "not-available-here") return ["", t("notHere")];
    if (l.state === "needs-you") return ["warn", (l.problem && l.problem.text) || t("notConnected")];
    if (APP.status && APP.status.ok === false)
      return ["bad", t("unreachable")];
    var at = (j && j.lastRun && j.lastRun.at) || (APP.status && APP.status.at) || (!APP.example && APP.data && APP.data.generatedAt);
    var ms = parse(at);
    return ["ok", t("connected") + (isNaN(ms) ? "" : " · " + t("checked", { time: dayDiff(ms, Date.now()) === 0 ? fmtTime(ms) : fmtDay(ms) }))];
  }
  function paintBar() {
    var p = pill();
    var l = APP.conn;
    var j = job();
    var running = j && j.running;
    var html = '<span class="pill ' + p[0] + '" role="status"><span class="dot"></span><span dir="auto">' + esc(p[1]) + "</span></span>";
    var canRun = C && APP.role !== "viewer" && l && l.state === "connected" && !running;
    if (C && l && (l.state === "not-added" || l.state === "needs-sign-in" || l.state === "needs-you") && l.canConnect) {
      html += '<button type="button" class="btn primary" data-act="connect">' + esc(l.state === "needs-sign-in" ? t("signInAgain") : t("connect")) + "</button>";
    } else if (C && l && l.state === "connected") {
      html += '<button type="button" class="btn" data-act="run"' + (canRun ? "" : " disabled") +
        (APP.role === "viewer" ? ' title="' + esc(t("viewerWhy")) + '"' : "") + ">" + icon("refresh-cw", running ? "spin" : "") + esc(t("updateNow")) + "</button>";
    }
    html += '<a class="quiet" href="' + esc(workspaceUrl()) + '" target="_blank" rel="noopener noreferrer">' + esc(t("openInLinear")) + icon("external-link") + "</a>";
    var actions = el("actions");
    var held = actions.contains(document.activeElement) ? document.activeElement.getAttribute("data-act") : null;
    actions.innerHTML = html;
    var again = held ? actions.querySelector('[data-act="' + held + '"]:not(:disabled)') : null;
    if (again) again.focus();

    el("sub").textContent = APP.data.workspace || "";

    var notice = el("notice");
    var n = "";
    if (APP.status && APP.status.ok === false && l && l.state === "connected") {
      n = (APP.example ? '<span class="tag">' + esc(t("example")) + '</span>' : "") + '<p dir="auto">' + esc(APP.status.why || t("failedLine")) + "</p>" +
        (canRun ? '<button type="button" class="btn" data-act="run">' + esc(t("tryAgain")) + "</button>" : "");
      notice.className = "notice bad";
    } else if (!APP.example && !(APP.data && APP.data.generatedAt)) {
      n = '<p dir="auto">' + esc(t("firstRun")) + "</p>";
      notice.className = "notice";
    } else if (APP.example) {
      var ws = (APP.data && APP.data.workspace) || "Northwind";
      var line = !C ? t("outsideLine") : l && l.state === "connected" ? t("exampleLine", { workspace: ws }) : t("exampleNoConn", { workspace: ws });
      n = '<span class="tag">' + esc(t("example")) + '</span><p dir="auto">' + esc(line) + "</p>";
      notice.className = "notice";
    } else if (C && l && l.problem && l.state !== "connected") {
      n = '<p dir="auto">' + esc(l.problem.text) + "</p>";
      notice.className = "notice";
    }
    notice.innerHTML = n;
    notice.hidden = !n;
  }

  function paintAsk() {
    var why = askBlock();
    var input = el("ask-input");
    input.disabled = !!why;
    el("ask-send").disabled = !!why;
    Array.prototype.forEach.call(document.querySelectorAll("[data-ask]"), function (b) { b.disabled = !!why; });
    var line = el("ask-why");
    line.textContent = why;
    line.hidden = !why;
  }

  function paint() {
    if (!APP.data) return;
    paintBar();
    render(APP.data, APP.example ? parse(APP.data.generatedAt) || Date.now() : Date.now());
    paintAsk();
  }

  // ── Files ─────────────────────────────────────────────────────────────
  function readJson(path) {
    if (C) return C.files.read(path).then(JSON.parse);
    // Opened on its own or in an older Cabinet: read the file beside the page.
    return fetch(path.slice(APP_DIR.length + 1)).then(function (r) { if (!r.ok) throw new Error("missing"); return r.json(); });
  }
  var loadSeq = 0;
  function load() {
    var seq = ++loadSeq;
    var dir = APP_DIR + "/data/";
    var example = false;
    var real = APP.data && !APP.example ? APP.data : null;
    var data = readJson(dir + "latest.json").catch(function () {
      // Real data already on screen stays when a later read fails.
      if (real) return real;
      example = true;
      var ex = readJson(dir + (LANG === "he" ? "EXAMPLE-latest.he.json" : "EXAMPLE-latest.json"));
      if (LANG === "he") ex = ex.catch(function () { return readJson(dir + "EXAMPLE-latest.json"); });
      return ex;
    }).catch(function () { example = false; return {}; });
    var status = readJson(dir + "status.json").catch(function () { return null; });
    return Promise.all([data, status]).then(function (r) {
      // A read that started earlier never replaces a newer one.
      if (seq !== loadSeq) return;
      APP.example = example;
      APP.data = r[0] || {};
      APP.status = r[1];
      paint();
      maybeRunExample();
    });
  }

  function boot() {
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
    document.title = t("title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (node) { node.textContent = t(node.getAttribute("data-t")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-t-placeholder]"), function (node) { node.setAttribute("placeholder", t(node.getAttribute("data-t-placeholder"))); });
    watchTheme();

    document.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-act],[data-ask]") : null;
      if (!b || b.disabled) return;
      var act = b.getAttribute("data-act");
      if (b.hasAttribute("data-ask")) ask(t(b.getAttribute("data-ask")));
      else if (act === "run") runNow();
      else if (act === "connect") connect();
    });
    el("ask-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var text = el("ask-input").value.trim();
      if (!text || askBlock()) return;
      ask(text).then(function (sent) { if (sent) el("ask-input").value = ""; });
    });
    // Relative days ("Tomorrow", "2 days left") follow the clock when the person comes back.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) paint(); });

    if (C) {
      C.here().then(function (here) {
        if (here && here.role) APP.role = here.role;
        paint();
        maybeRunExample();
      }, function () { /* the defaults hold */ });
      C.connectors.list().then(function (list) {
        APP.conn = list.filter(function (c) { return c.id === "linear"; })[0] || null;
        paint();
        maybeRunExample();
      }, function () { paint(); });
      C.connectors.onChange(function (list) {
        APP.conn = list.filter(function (c) { return c.id === "linear"; })[0] || null;
        paint();
        maybeRunExample();
      });
      C.jobs.list().then(function (list) {
        APP.jobs = list || [];
        APP.jobsLoaded = true;
        paint();
        maybeRunExample();
      }, function () { /* no routines */ });
      C.jobs.onChange(function (list) { APP.jobs = list || []; paint(); });
      C.files.onChange(APP_DIR + "/data", load);
    }
    load();
  }

  function teamSection(c, now) {
    var url = safeUrl(c.url);
    var name = '<span class="key" dir="ltr">' + esc(c.team) + "</span> " + esc(c.teamName || "") + " · " + esc(c.name || "");
    var from = parse(c.startsAt), to = parse(c.endsAt);
    var pct = c.total > 0 ? Math.round((c.done / c.total) * 100) : 0;
    var added = Number(c.scopeAdded) || 0;
    var since = parse(c.baselineFrom);
    var risk = c.atRisk || [];
    return '<section class="box" aria-label="' + esc((c.teamName || c.team) + " " + (c.name || "")) + '">' +
      '<div class="team-h"><h3 dir="auto">' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + name + "</a>" : name) + "</h3>" +
      (isNaN(from) || isNaN(to) ? "" : '<span class="dates">' + esc(t("dates", { from: fmtDay(from), to: fmtDay(to) })) + "</span>") +
      '<span class="left">' + esc(daysLeft(c.endsAt, now)) + "</span></div>" +
      '<div class="pace"><span class="done"><b>' + esc(t("doneOf", { done: c.done || 0, total: c.total || 0 })) + "</b>" + esc(t("doneWord")) + " · " + pct + "%</span>" +
      '<span class="stat' + (added > 0 ? " hot" : "") + '"><b><span dir="ltr">+' + added + "</span></b>" + esc(isNaN(since) ? t("scope") : t("scopeSince", { day: fmtDay(since) })) + "</span>" +
      '<span class="stat' + (risk.length ? " hot" : "") + '"><b>' + risk.length + "</b>" + esc(t("riskCount")) + "</span>" +
      '<span class="wide-bar" aria-hidden="true"><i style="width:' + (Math.max(0, Math.min(pct, 100)) || 0) + '%"></i></span></div>' +
      (c.note ? '<p class="note" dir="auto">' + esc(c.note) + "</p>" : "") +
      rowsOrEmpty(risk, t("nothingAtRisk"), riskRow) + "</section>";
  }

  function render(d, now) {
    var counts = d.counts || {};
    var cycles = d.cycles || [], projects = d.projects || [];
    var at = parse(d.generatedAt);
    el("week").textContent = isNaN(at) ? "" : t("weekOf", { day: fmtLong(at) });
    el("hero-h").textContent = d.headline || t("heroPlain");
    el("summary").textContent = d.summary || "";
    el("summary").hidden = !d.summary;
    var papers = [];
    if (d.report) papers.push('<span dir="auto">' + icon("file-text") + esc(t("report", { path: d.report })) + "</span>");
    if (d.retro) papers.push('<span dir="auto">' + icon("file-text") + esc(t("retro", { path: d.retro })) + "</span>");
    el("papers").innerHTML = papers.join("");
    el("papers").hidden = !papers.length;

    var total = counts.total || 0, done = counts.done || 0;
    var risky = projects.filter(function (p) { return p.health === "atRisk" || p.health === "offTrack"; }).length;
    var atRisk = counts.atRisk != null ? counts.atRisk : cycles.reduce(function (n, c) { return n + (c.atRisk || []).length; }, 0);
    el("tiles").innerHTML =
      tile("gauge", t("tileDone"), total ? Math.round((done / total) * 100) + "%" : "0%", total ? t("doneOf", { done: done, total: total }) : t("noCycle")) +
      tile("plus", t("tileScope"), "+" + (counts.scopeAdded || 0), t(cycles.some(function (c) { return c.baselineFrom; }) ? "scopeSubLate" : "scopeSub")) +
      tile("triangle-alert", t("tileRisk"), atRisk, tn("riskSub", atRisk)) +
      tile("folder-kanban", t("tileProjects"), counts.projectsAtRisk != null ? counts.projectsAtRisk : risky, tn("projectsSub", projects.length));

    el("teams").innerHTML = cycles.length ? cycles.map(function (c) { return teamSection(c, now); }).join("") :
      d.cycles ? '<p class="empty">' + esc(t("cyclesOff")) + "</p>" : "";
    el("projects").innerHTML = '<div class="box-h">' + icon("folder-kanban") +
      '<h3 id="projects-h">' + esc(t("boxProjects")) + '</h3><span class="count num">' + projects.length + "</span></div>" +
      rowsOrEmpty(projects, t("emptyProjects"), projectRow);
  }

  boot();
})();
</script>
</body>
</html>
