id: weekly-post-ideas
name: Weekly post ideas
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: post-writer
agentSlug: post-writer
timeout: 600
prompt: |-
  Write this week's three LinkedIn post ideas into ideas/, from my notes and drafts in this
  cabinet. Follow the Weekly post ideas steps in your instructions. This run only reads the
  cabinet and writes one ideas page: it never reaches LinkedIn, never writes a draft and never
  publishes anything. When you are done, tell me in one sentence the idea you like best.
createdAt: '2026-10-18T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
