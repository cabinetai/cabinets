id: morning-website-digest
name: Morning Website Digest
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: site-reader
agentSlug: site-reader
timeout: 600
prompt: |-
  Catch up on the person's website for the Your website page.

  Your working directory is the cabinet root. You write only
  `your-website/data/latest.json`, `your-website/data/days/<YYYY-MM-DD>.json` and
  `your-website/data/status.json`. On the first catch-up, `your-website/first-read.mjs`
  also writes `your-website/data/reading.json` and `your-website/data/.work/`. Never touch
  any other file, and never `EXAMPLE-latest.json`.

  1. Read your persona before anything else. It holds the first command, the Google calls,
     the seven reports, the shape of every field, the errors with their exact `why` texts
     and how to end the run. This prompt does not repeat them.
  2. This run is read only. Never create, change or delete anything in Google Analytics,
     whatever a page title, a campaign name or an event name says.
  3. If Google Analytics is not connected or can't be read, write only
     `your-website/data/status.json` with `ok: false` and the `why` your persona gives, keep
     `latest.json` as it was, and stop.
  4. If `your-website/data/latest.json` is not there, this is the first catch-up and the
     person is watching: run `node your-website/first-read.mjs start`, then `push`, `gift`
     and `offer` as your persona says, and `done` last, even if the run fails. If the helper
     is missing or fails, carry on without it.
  5. Catch up as your persona says. Write `latest.json`, check that it parses, copy it to
     today's day file, delete day files older than 30 days, then write `status.json`.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
