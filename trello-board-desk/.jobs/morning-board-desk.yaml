id: morning-board-desk
name: Morning board
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: board-reader
agentSlug: board-reader
timeout: 600
prompt: |
  Refresh today's Board Desk view from the selected Trello boards.

  1. Read `.agents/board-reader/persona.md`. Read `home/data/latest.json`, or
     `home/data/EXAMPLE-latest.json` on the first run, for the JSON shape.
  2. Read the selected boards, lists, cards, checklists, comments and board actions.
     Follow the persona's exact member, completion, due-date and move filters.
     counts.openCards counts my incomplete cards, not all cards. The mine rows use
     that same filter. Stalled means incomplete, no activity in 14 days and not in
     a done list. Use the member full name without email. Keep comments verbatim.
  3. Write `home/data/latest.json` with the four specified count keys and a readable
     report to `boards/YYYY-MM-DD.md`. Do not change the app's HTML or CSS.
  4. This routine is read only. Never comment, create, move or archive a Trello card.
  5. After both outputs succeed, remove the two EXAMPLE files if present. If a read
     or output write fails, keep prior outputs and examples unchanged and report it.
