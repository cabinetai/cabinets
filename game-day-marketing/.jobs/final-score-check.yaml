id: final-score-check
name: Final Score Check
enabled: false
schedule: 0 8,23 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: sports-desk
agentSlug: sports-desk
timeout: 600
prompt: |-
  Check final scores and verify wins. Use the game-tracking skill (Procedure B).
  1. Select games from today or yesterday (New York dates) that are not final, plus final games with verified: false.
  2. If there are none, say "Nothing to check" in one line and stop.
  3. For each, check the primary and secondary sources and append to sources_checked. Set status, score and
     result when final. Set verified: true only when two sources agree on the final score and the winner.
  4. Set last_score_check in /games/index.md.
  5. Do not contact other agents. The Promo Check job runs fifteen minutes later and picks up every verified win
     from the game files.
  Finish with: games checked, finals recorded, newly verified wins.
