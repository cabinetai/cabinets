id: game-day-prep
name: Game Day Prep
enabled: false
schedule: 0 10 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: sports-desk
agentSlug: sports-desk
timeout: 900
prompt: |-
  Get today's home games ready for promotion. Use the game-tracking skill (Procedure C).
  1. Look in /games/ for games whose New York date is today, with home: true and status: scheduled.
  2. If there are none, say "No home game today" in one line and stop.
  3. For each one, fill its weather (summary, temp_c, precip_pct) from the weather source in /teams.md.
  4. Do not contact other agents. The Promo Check job (10:15) reads today's game files and fires the
     game-day promotion; the weather you write is what it uses.
  Finish with the games prepared and their weather.
