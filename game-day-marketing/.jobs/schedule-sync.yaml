id: schedule-sync
name: Schedule Sync
enabled: false
schedule: 30 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: sports-desk
agentSlug: sports-desk
timeout: 900
prompt: |-
  Sync the game calendar for the next 7 days. Use the game-tracking skill (Procedure A).
  1. Read /teams.md for the teams and their schedule sources.
  2. For each team, read the primary schedule source and keep games from yesterday through the next 7 days.
  3. Create or update one file per game in /games/, matched by game_id. Never change score, result,
     verified, sources_checked or promotions_fired during a sync.
  4. Mark games that disappeared from the schedule as postponed instead of deleting them.
  5. Set last_synced in /games/index.md.
  Finish with: games added, games updated, and any source that failed.
createdAt: '2026-10-05T00:00:00.000Z'
updatedAt: '2026-10-05T00:00:00.000Z'
