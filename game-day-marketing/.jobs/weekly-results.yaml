id: weekly-results
name: Weekly Results
enabled: false
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: results-analyst
agentSlug: results-analyst
timeout: 900
prompt: |-
  Measure last week's promotions. Use the results-analysis skill.
  1. Read /store-data/sales-daily.csv and every plan in /campaigns/.
  2. For each plan whose live window has ended and whose Results section is empty, find its sales row,
     compute redemptions against the cap and the day against a normal day, write the Results section,
     and set status: done (or note that no sales data exists yet).
  3. Add one row per measured campaign to the campaign log in /learnings.md, update standing lessons only
     when two or more campaigns agree, and set last_updated.
  4. Do not contact other agents. The Shop Manager reads /learnings.md for its 9:30 plan.
  If there is nothing to measure, say "Nothing to measure" in one line and stop.
createdAt: '2026-10-05T00:00:00.000Z'
updatedAt: '2026-10-05T00:00:00.000Z'
