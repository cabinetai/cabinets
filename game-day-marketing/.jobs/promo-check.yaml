id: promo-check
name: Promo Check
enabled: false
schedule: 15 8,10,23 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: promo-manager
agentSlug: promo-manager
timeout: 900
prompt: |-
  Check the files for promotion work. Use the promo-triggers skill (queue scan).
  1. Find candidates in /games/: games with status final, result win and verified true, and home games whose
     New York date is today with status scheduled. Skip any game whose promotions_fired already lists the promotion.
  2. For each candidate, run the firing procedure for every promotion in /promotions.md. Fire at most once per game,
     write the plan first and the promotions_fired marker last, and log every decision in one line
     (fired, already fired, outside window, held).
  3. Review: for every campaign plan with status draft whose post.svg, story.svg and caption.md all exist,
     check them against the plan and /brand.md, then set status: ready-for-review (or note what to fix).
  4. Do not contact other agents. The Creative Queue job picks up new plans from the files.
  If there are no candidates and nothing to review, say "Nothing to do" in one line and stop.
createdAt: '2026-10-05T00:00:00.000Z'
updatedAt: '2026-10-05T00:00:00.000Z'
