id: monthly-papers
name: Important papers
enabled: true
cloudOnly: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: file-helper
agentSlug: file-helper
timeout: 1500
prompt: |-
  Find the person's important papers in OneDrive, and the dates in them for the coming year:
  what expires, renews, ends or falls due.

  Your working directory is the cabinet root. Your persona's "The 1st of the month: important
  papers" holds the search, how to read a paper and the shape of the file.

  1. In one Bash call, run `eval "$(node my-files/first-sort.mjs window)"`, print `$NOW`,
     read `my-files/setup.md` and, if it is there, `my-files/data/papers.json`.
  2. If your OneDrive line says OneDrive is not connected through Sign in with Microsoft,
     write only `my-files/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Run `node my-files/first-sort.mjs get papers`, then read at most six papers that may hold
     a date with `node my-files/first-sort.mjs read <fileId>`, and look at each one.
  4. In one Bash call, write `.work/papers-out.json`, run
     `node my-files/first-sort.mjs save papers @papers-out.json`, write
     `reports/<YYYY-MM>-papers.md` and `my-files/data/status.json` with `ok: true`, and run
     `node my-files/first-sort.mjs clean`.

  Only read OneDrive: never change, comment on or share a file.

  Finish in one plain sentence about the papers and nothing else: the next date, what it is
  and in which file.
createdAt: '2026-10-18T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
