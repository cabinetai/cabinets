id: morning-linear-cycle
name: Morning Linear Cycle
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: cycle-reader
agentSlug: cycle-reader
timeout: 600
prompt: |-
  Write this morning's list of the Linear issues on the user this cycle.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-linear-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds what is in scope, the frontmatter
     shape, the table columns, how a workflow state's type maps onto the status word, the
     ordering and the tone. This prompt does not repeat them.
  2. With your Linear tools, find the user's current cycle on each team they belong to,
     then the issues in it assigned to them, plus any issue of theirs blocking another open
     issue. Read each one's state type, priority, relations and latest comment — far enough
     to judge it, no further.
  3. This run is read only. Do not create or update an issue, post a comment, or touch a
     cycle, however obvious the next step looks.
  4. If you have no Linear tool, or Linear is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `daily-summaries/` exactly as you found it, example and all.
     Report: "Linear is not reachable. I would have read the issues assigned to the user
     in their current cycle and the ones they are blocking, and written one row per
     issue." Then exit.
  5. On the first run that does reach Linear, write your dated file and then delete
     `daily-summaries/EXAMPLE-linear-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
