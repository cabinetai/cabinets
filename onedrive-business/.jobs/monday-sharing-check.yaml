id: monday-sharing-check
name: Monday sharing check
enabled: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: file-keeper
agentSlug: file-keeper
timeout: 900
prompt: |-
  Do this Monday's sharing check: which of the owner's files anyone with the link can open,
  and which are shared outside the company.

  Your working directory is the cabinet root. Your persona's "Monday: the sharing check" holds
  the searches, what counts as sensitive and the shape of the file.

  1. In one Bash call, run `eval "$(node file-room/first-sort.mjs window)"`, print `$NOW`,
     read `file-room/setup.md` (what the owner calls private).
  2. If your OneDrive line says OneDrive is not connected through Sign in with Microsoft,
     write only `file-room/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Run `node file-room/first-sort.mjs get sharing`.
  4. In one Bash call, write `.work/sharing.json`, run
     `node file-room/first-sort.mjs save sharing @sharing.json`, write
     `reports/<YYYY-MM-DD>-sharing.md` and `file-room/data/status.json` with `ok: true`, and
     run `node file-room/first-sort.mjs clean`.

  Only read OneDrive: never change who can open a file, never share or unshare.

  Finish in one plain sentence about the files and nothing else: how many are open to anyone,
  and the most sensitive one, if there is one.
createdAt: '2026-10-18T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
