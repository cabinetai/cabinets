id: monthly-contract-dates
name: Contract dates
enabled: true
cloudOnly: true
schedule: 0 8 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: file-keeper
agentSlug: file-keeper
timeout: 1500
prompt: |-
  Find the dates in the owner's contracts for the coming year: when each one ends, renews, or
  needs notice, and what falls due.

  Your working directory is the cabinet root. Your persona's "The 1st of the month: contract
  dates" holds the search, how to read a document and the shape of the file.

  1. In one Bash call, run `eval "$(node file-room/first-sort.mjs window)"`, print `$NOW`,
     read `file-room/setup.md` and, if it is there, `file-room/data/dates.json`.
  2. If your OneDrive line says OneDrive is not connected through Sign in with Microsoft,
     write only `file-room/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Run `node file-room/first-sort.mjs get contracts`, then read at most six contracts with
     `node file-room/first-sort.mjs read <fileId>`, and look at each one.
  4. In one Bash call, write `.work/dates.json`, run
     `node file-room/first-sort.mjs save dates @dates.json`, write
     `reports/<YYYY-MM>-contract-dates.md` and `file-room/data/status.json` with `ok: true`,
     and run `node file-room/first-sort.mjs clean`.

  Only read OneDrive: never change, comment on or share a file.

  Finish in one plain sentence about the contracts and nothing else: the next date, what it
  is and in which file.
createdAt: '2026-10-18T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
