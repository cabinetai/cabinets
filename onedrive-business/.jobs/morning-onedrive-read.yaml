id: morning-onedrive-read
name: Morning OneDrive read
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: file-keeper
agentSlug: file-keeper
timeout: 1200
prompt: |-
  Read this morning's OneDrive for the File room app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  OneDrive, the searches, the shape of each file, and how to spend little. Follow its order:

  1. In one Bash call, run `eval "$(node file-room/first-sort.mjs window)"`, print `$NOW`,
     read `file-room/setup.md` and, if it is there, `file-room/data/latest.json` (the last
     read), and check with `ls file-room/data` (from the cabinet root, never `cd`) whether
     `profile.json` is there.
  2. If your OneDrive line says OneDrive is not connected through Sign in with Microsoft,
     write only `file-room/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. If `profile.json` is not there, this is the first read: follow "The first read" in your
     persona, starting with `node file-room/first-sort.mjs start` and the gift. Otherwise
     follow "The morning read", starting with `node file-room/first-sort.mjs get morning`.
  4. Every file the page shows goes through the helper: `latest @latest.json` (and on the
     first read `gift`, `profile`, `save sharing`, `save dates`, then `done`). The helper
     saves every answer in `file-room/data/.work/`; end with `clean` (or `done`).

  Only read OneDrive: never create, change, move, rename, share, comment on or delete a file.

  Finish in one or two plain sentences about the files and nothing else: how many comments
  wait on the owner, what a client shared, and the one thing that matters most, if there is one.
createdAt: '2026-10-18T00:00:00.000Z'
updatedAt: '2026-10-18T00:00:00.000Z'
