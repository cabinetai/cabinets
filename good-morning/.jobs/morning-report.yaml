id: morning-report
name: Morning Report
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: morning-reporter
agentSlug: morning-reporter
timeout: 900
prompt: |-
  Write this morning's page.

  Your working directory is the cabinet root. Every report lives in `reports/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-good-morning.md`: the local time you
  ran, then that exact postfix. The page reads the folder, sorts by name and opens
  the newest, so a name in any other shape is a morning nobody will see. You only
  ever ADD a file: never overwrite, rename or delete one already sitting there.

  1. Read your persona, then `setup.md`. The persona holds the file shape, the
     read-only rule and the section rules; setup.md holds the person's own answers.
     This prompt repeats neither.
  2. Read `report/.data/shared.json`, key `morningApps`: the apps the person picked on
     the Report page. Read exactly those apps, as skills (such as Gmail or Google
     Calendar) or as the service's own connection: overnight mail, today's calendar,
     yesterday's money, whatever each one holds. Leave every other app alone. With no
     pick saved yet, read every app that is connected. Read only, everywhere.
  3. If every app you try fails, say what you tried and what each one said, write
     nothing, leave `reports/` exactly as you found it, example and all, and stop.
  4. If some apps work and others fail, write the page from what worked
     and say plainly in `## Checked` what couldn't be reached. Never fill a gap with
     the example's contents, an earlier day, or a guess.
  5. On the first run that reads at least one real app, write your dated file and
     then delete `reports/EXAMPLE-good-morning.md`. It is a demo, not a morning that
     happened. Never write `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: what you checked, and the one thing
  most worth the person's attention.
