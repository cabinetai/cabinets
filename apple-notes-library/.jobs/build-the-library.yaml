id: build-the-library
name: Build The Library
enabled: true
schedule: 0 10 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: notes-librarian
agentSlug: notes-librarian
timeout: 1800
prompt: |-
  Build or rebuild the person's library from their Apple Notes.

  Your working directory is the cabinet root. You write only your own topic pages in
  `topics/` (never `topics/index.md`), and `latest.json` and `status.json` in
  `your-library/data/`. On the first build you also write `reading.json` and files in
  `your-library/data/.work/`, only through `node your-library/first-read.mjs`. Never touch
  any other file, and never `EXAMPLE-latest.json`.

  1. Read your persona before anything else. It holds where the notes are, how a build
     goes, the topics, the topic pages, the tidy-up list and the shape of every file. This
     prompt does not repeat them.
  2. If `your-library/data/latest.json` is not there, this is the first build and the
     person is watching: run `first-read.mjs start` in your first Bash call, `push` a line
     per finding, give the `gift` and up to two `offer`s, then `latest` and `done` last,
     all as your persona says.
  3. Their notes are read only on this run. Never create, change, move, merge or delete a
     note, with any tool, however much tidier it would make them.
  4. If there are no notes to read or the build cannot finish, write `status.json` with
     `ok: false` and a `why` as your persona says, run `done` on the first build, and stop.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-18T12:00:00.000Z'
