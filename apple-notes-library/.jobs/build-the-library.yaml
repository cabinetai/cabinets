id: build-the-library
name: Build The Library
enabled: true
schedule: 0 10 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: notes-librarian
agentSlug: notes-librarian
timeout: 1800
prompt: |-
  Build or rebuild the person's library from their Apple Notes.

  Your working directory is the cabinet root. You write only topic pages in `topics/`
  (never `topics/index.md`), `your-library/data/latest.json` and
  `your-library/data/status.json`, and on the first build `your-library/data/reading.json`
  and files in `your-library/data/.work/`, through `node your-library/first-read.mjs`.
  Never touch any other file, never `EXAMPLE-latest.json`, and never a note.

  1. Read your persona before anything else. It holds where the notes are, the topic page
     shape, the five-to-twenty rule and the shape of every field. This prompt does not
     repeat them. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and
     run `ls your-library/data/`. If `latest.json` is not there, this is the first build:
     the person is watching the page. Follow "The first build" in your persona, and run
     `node your-library/first-read.mjs start` in this same call.
  2. Find the `Apple Notes` folder as your persona says. If there is none, write only
     `your-library/data/status.json` with `ok: false` and `why` "Your notes haven't been
     brought in yet.", run `node your-library/first-read.mjs done` on the first build, and
     stop.
  3. List every note with its title, folders and edit date first. On the first build, push
     the first line and give the gift and the offers right after this list (your persona
     says how). Then read the notes, newest first. With many notes, read every note from
     the last two years in full, and only the title and first lines of older ones. On the
     first build, push a line as each topic becomes clear, in the same Bash call that read
     its notes.
  4. Group the notes into topics as your persona says, and spot the tidy-up list.
  5. Write the topic pages. Delete a page in `topics/` that you made on an earlier run
     (it has `madeBy: notes-librarian` in its frontmatter) when this run has no such topic.
     Never delete or change a page without that line.
  6. In one Bash call, write `your-library/data/latest.json` (and check it parses), then
     `your-library/data/status.json`. On the first build, write it as
     `your-library/data/.work/latest.json` instead and run
     `node your-library/first-read.mjs latest @latest.json` (it writes both files), then
     `node your-library/first-read.mjs done` last. If the first build cannot finish, still
     write `status.json` with `ok: false` and run `done`.

  Finish in one plain sentence about the person's notes and nothing else: how many notes
  went into how many topics, and the biggest topic.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-16T12:00:00.000Z'
