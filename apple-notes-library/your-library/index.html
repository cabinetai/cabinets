<!DOCTYPE html>
<!--
  Notes Library: Your Library. The cabinet opens on this page.

  For someone with years of Apple Notes and no structure: the topics their notes keep
  coming back to, each one tap from a question to the cabinet's agent, plus a short list
  of notes worth tidying up, an Ask box and Ideas they can ask for once, switch on as a
  routine, or add as a box.

  The page is a grid of boxes, the same way the digests work: 12 columns, each box moved,
  resized, added and removed by mouse, finger or keyboard, with Undo. Each person's layout
  is kept in cabinet.mine, so it follows them.

  Where the words come from: the Build The Library routine reads the notes Cabinet copied
  in from Apple Notes, writes a page per topic into topics/, and writes data/latest.json
  next to this page (the shape is data/EXAMPLE-latest.json: a made-up library, always
  labelled as an example here), and data/status.json with ok:false and why when it could
  not finish. On the very first build, first-read.mjs also writes data/reading.json: one
  line for each thing the agent finds as it reads, one thing the person can do now (the
  gift) and up to two more (the offers). The page tells those lines as they come.

  How it talks to Cabinet: window.cabinet v2 (connection state, bring the notes in, ask,
  run the routine, read files, the person's own layout). In an older Cabinet it reads the
  same files over the page's own address. It never changes a note: Apple Notes is a one-way
  copy.

  One file on purpose: a sealed frame cannot load files next to it. System fonts; icons are
  inline SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Library</title>
<style>
  :root {
    --page: #fffdf7;
    --panel: #ffffff;
    --line: #ece5d3;
    --ink: #1f1d1a;
    --muted: #6f6a60;
    --faint: #a59f92;
    --yellow: #f5c518;
    --yellow-ink: #7a5d00;
    --yellow-tint: #fff5cf;
    --red-ink: #b42318;
    --red-tint: #fdecea;
    --blue-ink: #1d5fa8;
    --blue-tint: #e9f1fb;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31, 29, 26, .05), 0 10px 28px -16px rgba(31, 29, 26, .18);
    --shadow-2: 0 2px 4px rgba(31, 29, 26, .08), 0 14px 32px -14px rgba(31, 29, 26, .26);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font: 15px/1.5 var(--font); padding: 36px 24px 72px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14.5px; }
  /* The made-up notes say so first, with the same Example tag the other templates use. */
  .tag-example { display: inline-flex; align-items: center; margin-right: 2px; padding: 1px 8px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; vertical-align: 1px; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--yellow-tint); }
  .fine { color: var(--muted); font-size: 13px; margin: 0; }

  .banner {
    margin-top: 22px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
    background: var(--yellow-tint); color: var(--yellow-ink); display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.err { background: var(--red-tint); color: var(--red-ink); }
  .banner .icon { margin-top: 3px; }
  .banner > div { flex: 1; min-width: 0; }
  .banner b { font-weight: 650; }
  .banner .btn { margin-left: auto; }

  .hero { margin-top: 22px; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 24px; }
  .hero h2 { margin: 0 0 6px; font-size: 19px; }
  .hero p { margin: 0 0 14px; color: var(--muted); }

  section { margin-top: 28px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  /* ── Boxes with a list ───────────────────────────────────────────────── */
  .lane { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .lane-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 18px 10px; }
  .lane-head .lane-icon { display: inline-grid; place-items: center; color: var(--yellow-ink); }
  .lane-head h3 { margin: 0; flex: 1; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lane-head .count { min-width: 24px; padding: 1px 8px; border-radius: 999px; background: var(--yellow-tint); color: var(--yellow-ink); font-size: 12.5px; font-weight: 700; text-align: center; }
  .lane-empty { padding: 4px 18px 18px; color: var(--muted); margin: 0; }

  /* Small: one number and one line under it. */
  .sum { display: flex; flex-direction: column; gap: 2px; padding: 0 18px 14px; }
  .sum .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .sum .value.none { color: var(--faint); }
  .sum .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .sum .line { margin-top: 4px; font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .box-pad { padding: 0 18px 16px; display: flex; flex-wrap: wrap; gap: 8px; }

  /* Topics: cards on a large box, rows on a medium one. */
  .topics { list-style: none; margin: 0; padding: 0 0 6px; }
  .topics.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 2px 16px 16px; }
  .topic {
    display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--page); border: 0; border-radius: 12px; padding: 14px 16px; border-top: 4px solid var(--yellow);
  }
  .topic:hover { box-shadow: var(--shadow-2); }
  .topics:not(.cards) .topic { border-radius: 0; border-top: 1px solid var(--line); background: none; padding: 10px 18px; }
  .topics:not(.cards) .topic:hover { box-shadow: none; background: var(--yellow-tint); }
  .topic h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .gist { margin: 6px 0 10px; font-size: 14.5px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: auto; display: flex; justify-content: space-between; gap: 8px; }
  .meta .go { color: var(--yellow-ink); font-weight: 650; white-space: nowrap; }

  .tidy { list-style: none; margin: 0; padding: 0; }
  .tidy-row { display: flex; align-items: baseline; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .kind { flex: none; width: 96px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .tidy-text { flex: 1; min-width: 0; }
  .folder { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .more { color: var(--faint); font-size: 13px; margin: 0; padding: 8px 18px 12px; }

  .ask { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .ask form { display: flex; gap: 8px; }
  .ask input {
    flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--page); color: var(--ink);
  }
  .ask input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-tint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--page); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--yellow); background: var(--yellow-tint); }
  #ask-note { margin-top: 10px; min-height: 1em; }
  .box.ask { overflow: hidden; }
  .box.ask[data-level="S"] form { flex-direction: column; }

  /* ── Ideas ───────────────────────────────────────────────────────────── */
  .idea { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .idea h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .idea p { margin: 0; color: var(--muted); }
  .idea .go, .one-idea .go { display: flex; flex-wrap: wrap; gap: 8px; }
  .idea .on-page { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--yellow-ink); }
  /* Each idea's picture: a note on the page's yellow, drawn inline so it shows anywhere. */
  .art-img { aspect-ratio: 16 / 8; border-radius: 10px; overflow: hidden; background: var(--yellow-tint); }
  .art-img svg { width: 100%; height: 100%; display: block; }
  .idea-rows { list-style: none; margin: 0; padding: 0; }
  .idea-rows > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 18px; border-top: 1px solid var(--line); }
  .idea-rows b { display: block; font-size: 14.5px; font-weight: 650; }
  .idea-rows span { display: block; color: var(--muted); font-size: 13px; }
  .one-idea { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
  .one-idea .art-img { flex: none; aspect-ratio: 16 / 6; }
  .one-idea h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .one-idea p { margin: 0; color: var(--muted); font-size: 14px; }
  .one-idea .go { margin-top: auto; }

  /* ── The grid of boxes ───────────────────────────────────────────────── */
  /* Each box sits on a 12 column grid at the place its layout gives it, and draws itself
     small, medium or large by its own width (data-level). A list shows the rows that fit,
     then "+N more". */
  .grid { --row: 64px; --gap: 16px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); margin-top: 22px; }
  .box { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 0; transition: box-shadow .2s ease; }
  .box > .box-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .box-more { flex: none; display: flex; justify-content: center; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid var(--line); background: var(--panel); color: var(--yellow-ink); font: inherit; font-weight: 650; font-size: 13.5px; cursor: pointer; }
  .box-more:hover { background: var(--yellow-tint); }
  .box.nbox > .sum { flex: 1; justify-content: center; }
  /* On a phone the boxes stack in their order and grow to fit. */
  .grid.stack { display: flex; flex-direction: column; gap: 16px; }
  .grid.stack .box { flex: none; }
  /* A list box is as tall as its rows, up to the size its layout gives it: no empty white
     under a short list, and its foot sits right under the rows. */
  .grid:not(.editing):not(.stack) > .box.lane:not(.nbox):not([data-box^="idea-"]) { align-self: start; max-height: 100%; }

  /* Editing the page: a small bar of buttons, handles on every box. */
  .editbar { position: sticky; top: 8px; z-index: 20; width: fit-content; margin: 22px 0 0 auto; display: flex; padding: 5px; border-radius: 999px; background: var(--yellow-tint); border: 1px solid var(--yellow); box-shadow: var(--shadow-2); }
  .editbar-actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .editbar .btn { padding: 6px 14px; font-size: 13.5px; gap: 6px; }
  .grid.editing .box { position: relative; overflow: visible; outline: 2px dashed var(--yellow); outline-offset: 5px; }
  .grid.editing .box > :not(.box-x):not(.box-resize):not(.box-size) { pointer-events: none; user-select: none; }
  .grid .box { -webkit-touch-callout: none; }
  .grid.editing .box { cursor: grab; user-select: none; }
  .grid.editing .box:focus-visible { outline: 3px solid var(--yellow-ink); outline-offset: 5px; }
  .grid.editing .box:not(.lifted) { box-shadow: 0 14px 30px -18px rgba(31, 29, 26, .32); }
  body.is-moving, body.is-moving * { cursor: grabbing !important; user-select: none; }
  body.is-sizing, body.is-sizing * { cursor: nwse-resize !important; user-select: none; }
  .box.lifted { z-index: 30; box-shadow: 0 26px 50px -18px rgba(31, 29, 26, .42); will-change: transform; }
  .box.sizing { z-index: 30; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .grid.fresh .box-x, .grid.fresh .box-resize, .grid.fresh .box-size { animation: pop .45s var(--spring, ease-out) backwards; }
  .grid.stack.editing { gap: 36px; padding-top: 8px; }
  /* On a phone the size switch sits on the box's top edge: the title moves down out of its way. */
  .grid.stack.editing .lane-head { padding-top: 28px; }
  .grid.stack.editing .box.ask { padding-top: 34px; }
  .grid.stack.arranging .box:not(.lifted) { transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
  .drop-spot { z-index: 1; border: 2px dashed var(--yellow-ink); border-radius: var(--radius); background: color-mix(in srgb, var(--yellow) 12%, transparent); pointer-events: none; }
  .size-tag { z-index: 31; place-self: center; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 650; font-size: 14px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-2); }
  .size-tag:empty { display: none; }
  .box-resize { position: absolute; right: -11px; bottom: -11px; z-index: 3; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--yellow-ink); border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); cursor: nwse-resize; touch-action: none; transition: transform .15s ease; }
  .box-resize::after { content: ""; width: 8px; height: 8px; margin: 0 2px 2px 0; border-right: 2px solid var(--yellow-ink); border-bottom: 2px solid var(--yellow-ink); }
  .box-resize:hover { transform: scale(1.12); }
  .box-size { position: absolute; top: -16px; left: 12px; z-index: 3; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--ink); box-shadow: var(--shadow-2); }
  .box-size button { padding: 5px 10px; border: 0; border-radius: 999px; background: transparent; color: #d8d3c8; font: inherit; font-size: 13px; font-weight: 650; }
  .box-size button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .box-x { position: absolute; top: -14px; right: -14px; z-index: 3; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--page); border-radius: 50%; background: var(--ink); color: #fff; box-shadow: var(--shadow-2); cursor: pointer; transition: transform .15s ease, background .15s ease; }
  .box-x:hover { background: var(--red-ink); transform: scale(1.1); }
  .box-x .icon { stroke-width: 2.6; }
  .box.leaving { opacity: 0; transform: scale(.94); transition: opacity .2s ease, transform .2s ease; }
  .box.flash { animation: flash 1.4s ease; }
  @keyframes flash { 25% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--yellow) 60%, transparent); } }
  .grid-empty { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
  .grid-empty p { margin: 0; }

  /* The Add a box and Ideas panels. */
  .pick-group h3 { margin: 6px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .pick.on { background: var(--page); }
  .pick-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--yellow-tint); color: var(--yellow-ink); }
  .pick b { display: block; font-size: 14.5px; font-weight: 650; }
  .pick span { display: block; color: var(--muted); font-size: 13px; }
  .pick em { display: block; margin-top: 2px; font-style: normal; font-size: 12.5px; font-weight: 650; color: var(--yellow-ink); }
  .pick-on { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--yellow-tint); color: var(--yellow-ink); }
  .drawer { position: fixed; inset: 0; z-index: 40; }
  .drawer-scrim { position: absolute; inset: 0; background: rgba(31, 29, 26, .38); opacity: 0; transition: opacity .25s ease; }
  .drawer-panel { position: absolute; top: 0; bottom: 0; right: 0; width: min(440px, 100%); display: flex; flex-direction: column; background: var(--page); box-shadow: -24px 0 60px -24px rgba(31, 29, 26, .4); transform: translateX(100%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); outline: none; }
  .drawer.open .drawer-scrim { opacity: 1; }
  .drawer.open .drawer-panel { transform: none; }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
  .drawer-head .lane-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--yellow-tint); color: var(--yellow-ink); flex: none; }
  .drawer-head h2 { margin: 0; font-size: 19px; }
  .drawer-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .drawer-close { margin-left: auto; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
  .drawer-close:hover { background: var(--yellow-tint); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* The first build, told as it happens: one line for each thing the agent finds. */
  .read-page { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .reading { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
  .reading h2 { margin: 0 0 4px; font-size: 19px; }
  .reading > p { margin: 0 0 14px; color: var(--muted); }
  .read-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .read-lines li { display: flex; gap: 10px; align-items: flex-start; overflow-wrap: anywhere; animation: line-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  .read-lines li .icon { margin-top: 3px; color: var(--yellow-ink); }
  .read-lines li b { font-weight: 650; }
  .read-lines li.old { animation: none; }
  .read-lines li.now { color: var(--muted); }
  .pulse-dot { flex: none; width: 8px; height: 8px; margin: 7px 4px 0; border-radius: 50%; background: var(--yellow); animation: read-pulse 1.2s ease-in-out infinite; }
  .reading .fine { margin-top: 14px; }
  @keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes read-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }

  /* While I read, you can...: the gift first, then up to two more things to do now. */
  .side-list { display: grid; align-content: start; gap: 12px; }
  .side-list > .label { margin: 0; }
  .offers { list-style: none; margin: 0; padding: 0 18px; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); }
  .offer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .offer:first-child { border-top: 0; }
  .offer.arrive { animation: line-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  .offer > .icon { color: var(--yellow-ink); }
  .offer b { display: block; font-size: 14.5px; font-weight: 650; overflow-wrap: anywhere; }
  .offer span.sub { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .offer .asked { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--yellow-ink); white-space: nowrap; }
  .btn.small { padding: 6px 11px; font-size: 13px; }

  /* The gift: one thing the person can do now, found while the agent reads. */
  .gift { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 16px; border-top: 4px solid var(--yellow); }
  .gift.arrive { animation: line-in .7s cubic-bezier(.2, .8, .2, 1) both; }
  .gift .label { margin-bottom: 6px; }
  .gift h3 { margin: 0; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .gift h3 b { font-weight: 700; }
  .gift .why { margin: 8px 0 0; color: var(--muted); }
  .gift .actions { margin-top: 14px; }
  .gift .asked { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0 0; font-weight: 600; color: var(--yellow-ink); }
  .gift .asked .icon { margin-top: 3px; }
  .gift .fine { margin-top: 10px; }

<script>
(function () {
  "use strict";

  var cab = window.cabinet;

  var AGENT = "notes-librarian";
  var POLL_MS = 60000;
  var DAY_MS = 86400000;

    "Which notes look like duplicates?",
    "What questions do my notes never answer?",
    "Find my notes about recipes"
  ];

  /**
   * Library plays: one tap to ask now, to switch on as a routine, or to add as a box. Each one

  var MARK = 'stroke="#7a5d00" stroke-width="6"';

      art: art('<rect x="190" y="92" width="58" height="50" rx="8" fill="#fff" ' + MARK + '/><path d="M190 108h58M205 84v14M233 84v14" ' + MARK + '/><circle cx="219" cy="124" r="6" fill="#7a5d00" stroke="none"/>') },
    { id: "people", title: "Who you write about",

      when: "Every month", at: "on the 15th of every month at 10 am",
      art: art('<circle cx="204" cy="100" r="13" fill="#fff" ' + MARK + '/><path d="M180 144a24 24 0 0 1 48 0" fill="#fff" ' + MARK + '/><circle cx="242" cy="108" r="10" fill="#fff" ' + MARK + '/><path d="M232 144a20 20 0 0 1 30-17" ' + MARK + '/>') },
    { id: "lists", title: "Every list you keep",

      when: "Every month", at: "on the first day of every month at 10:30 am",

      when: "Every Friday", at: "every Friday at 4 pm",
      art: art('<circle cx="222" cy="116" r="28" fill="#f5c518" ' + MARK + '/><path d="m209 116 9 9 17-18" ' + MARK + '/>') }

  var state = {
    appPath: appPathFromUrl(),
    here: null,
    data: null,
    example: true,
    lastTry: null,
    loaded: false,
    notes: null,
    jobs: [],
    running: false,
    runNote: "",
    connecting: false,
    connectNote: "",
    jobsKnown: false,
    looked: false,
    reading: null,
    readStartedAt: null,
    readShown: 0,
    sawReading: false,
    giftShownAt: null,
    giftAsked: null,
    giftDone: null,
    offersShown: {},
    offersAsked: {},
    offersDone: {},
    mineReady: false,
    askNote: "",
    /** The boxes on this person's page, from cabinet.mine; null is the default page. */
    layout: null,
    drawerOpen: false,
    drawerKind: "ideas",
    editing: false,
    undo: [],

  function $(id) { return document.getElementById(id); }

  var toastTimer = 0;

  // ── Dates, in the person's own clock ───────────────────────────────────

  function parseTime(value) {

  function day(value) {

  }

  // ── Reading the files the routine writes ───────────────────────────────

  function notFound() { var e = new Error("not written yet"); e.code = "not-found"; return e; }
  function readText(rel) {
    if (V2) return cab.files.read(state.appPath + "/" + rel);
    // An older Cabinet: the files sit next to this page on the same address.
    return fetch(rel, { cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 404) throw notFound();
      if (!r.ok) throw new Error("Could not read " + rel + ".");
      return r.text();
    });
  }
  function readJson(rel) { return readText(rel).then(function (t) { return JSON.parse(t); }); }
  function maybe(promise) {
    return promise.catch(function (e) { if (e && e.code === "not-found") return null; throw e; });
  }
  function quiet(promise) { return promise.catch(function () { return null; }); }
  function usable(d) { return d && typeof d === "object" && Array.isArray(d.topics); }

  var loading = null;
  function load() {
    if (loading) return loading;
    loading = Promise.all([
      maybe(readJson("data/latest.json")).catch(function () { return "broken"; }),
      quiet(maybe(readJson("data/status.json"))),
      quiet(maybe(readJson("data/reading.json")))
    ]).then(function (got) {
      var latest = got[0];
      setReading(cleanReading(got[2]));
      state.lastTry = got[1] && typeof got[1] === "object" ? got[1] : null;
      if (usable(latest) && latest.example !== true) {
        state.data = latest;
        state.example = false;
        return null;
      }
      // A file half written a moment ago keeps what is on screen; the next change reloads it.
      if (latest === "broken" && state.data && !state.example) return null;
      return maybe(readJson("data/EXAMPLE-latest.json")).then(function (ex) {
        state.data = usable(ex) ? ex : null;
        state.example = true;
      });
    }).catch(function () {
      if (!state.data) state.data = null;
    }).then(function () {
      var made = state.example && state.data ? parseTime(state.data.generatedAt) : null;
      shift = made ? Math.max(0, daysBetween(made, new Date())) : 0;
      state.loaded = true;
      loading = null;
      paint();
      firstLook();
    });
    return loading;
  }

  // ── Talking to Cabinet ─────────────────────────────────────────────────

  function role() { return state.here && state.here.role ? state.here.role : "owner"; }
  function canAct() { return V2 && role() !== "viewer"; }
  function pickNotes(items) {
    if (!Array.isArray(items)) return null;
    for (var i = 0; i < items.length; i++) if (items[i] && items[i].id === "apple-notes") return items[i];
    return null;
  }
  function notesState() { return state.notes ? state.notes.state : null; }
  function job() {
    for (var i = 0; i < state.jobs.length; i++) if (state.jobs[i].id === JOB) return state.jobs[i];
    return null;
  }

  function setJobs(items) {
    if (!Array.isArray(items)) return;
    var wasRunning = state.running;
    state.jobs = items;
    var j = job();
    state.running = !!(j && j.running);
    state.jobsKnown = true;
    if (wasRunning && !state.running) load();
    paint();
    firstLook();
  }

  /**
   * The owner opens the page with Apple Notes already brought in, and only the example on it:
   * the first build starts by itself, once, as it does right after bringing the notes in. Not
   * after a build that went wrong (that shows its own Try again), and not for anyone else.
   */
  function firstLook() {
    if (state.looked || !V2 || role() !== "owner" || !state.loaded || !state.jobsKnown) return;
    if (notesState() !== "connected" || !state.example || state.lastTry || state.running || !job()) return;
    state.looked = true;
    runNow();
  }

  /** Bring the notes in, or fresh ones: Cabinet's own Apple Notes step, then a look straight away. */
  function bringIn() {
    if (!V2 || state.connecting) return;
    state.connecting = true;
    state.connectNote = "";
    paint();
    cab.connectors.connect("apple-notes").then(function (result) {
      state.connecting = false;
      return cab.connectors.list().then(function (items) {
        state.notes = pickNotes(items) || state.notes;
        paint();
        if (result === "connected") { state.looked = true; runNow(); }
      });
    }).catch(function (e) {
      state.connecting = false;
      state.connectNote = e && e.message ? e.message : "That did not work. Try again.";
      paint();
    });
  }

  function runNow() {
    if (!V2 || state.running) return;
    state.running = true;
    state.runNote = "";
    paint();
    cab.jobs.run(JOB).then(function () {
      watchRun();
    }).catch(function (e) {
      if (e && e.code === "busy") { watchRun(); return; }
      state.running = false;
      state.runNote = e && e.message ? e.message : "That did not start. Try again.";
      paint();
    });
  }

  // jobs.onChange says when the run ends; this is the fallback if a change is ever missed.
  var runTimer = 0;
  function watchRun() {
    clearInterval(runTimer);
    runTimer = setInterval(function () {
      if (!state.running) { clearInterval(runTimer); return; }
      cab.jobs.list().then(setJobs).catch(function () {});
    }, 8000);
  }

  function ask(question) {
    var q = text(question, 3900);
    if (!q) return;
    if (!V2) { toast("Open this cabinet in Cabinet to ask about your notes."); return; }
    setAskNote("Asking...");
    cab.ask(q, { agent: AGENT, send: true }).then(function () {
      setAskNote("Asked. The answer is coming in the chat next to this page.");
      if ($("ask-input")) $("ask-input").value = "";
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
      toast(state.askNote);
    });
  }
  /** The line under the Ask box; it lives in state because the box can be drawn again. */
  function setAskNote(words) {
    state.askNote = words;
    if ($("ask-note")) $("ask-note").textContent = words;
  }

  // ── The first build, told as it happens ────────────────────────────────
  // On the very first build the agent adds a line to data/reading.json for each thing it finds
  // as it reads (first-read.mjs push), and the page shows them one by one. While it reads, it
  // also gives one thing the person can do now (first-read.mjs gift) and up to two more
  // (first-read.mjs offer): notes nobody touched in a year, the biggest folders, or meeting
  // notes to turn into to-dos. A press asks the agent in the chat beside the page; no note
  // changes. Any later build is told the way it always was, and so is a first build whose
  // reading.json never comes (an older helper): it says "Opening your notes" until it ends.

  // The routine stops a build at 30 minutes (its timeout), so a reading this young can still be this build's.
  var READ_FRESH_MIN = 35;
  var REVEAL_MS = 1200;
  var GIFT_KEY = "your-library-gift-done@1";
  var OFFERS_KEY = "your-library-offers-done@1";
  var GIFT_KEEP_DAYS = 3;

  function cleanReading(d) {
    if (!d || typeof d !== "object" || !Array.isArray(d.lines) || !parseTime(d.startedAt)) return null;
    var lines = d.lines.map(function (l) { return text(l, 200); }).filter(Boolean).slice(-14);
    var offers = list(d.offers).map(function (o) { return cleanKind(o, false); }).filter(Boolean).slice(0, 2);
    return { startedAt: d.startedAt, done: d.done === true, lines: lines, gift: cleanKind(d.gift, true), offers: offers };
  }
  /** A gift or an offer as the helper wrote it: old, folders, meetings, or (a gift only) calm. */
  function cleanKind(g, isGift) {
    if (!g || typeof g !== "object" || !parseTime(g.at)) return null;
    if (g.kind === "old") {
      var n = count(g.count);
      return n ? { kind: "old", at: g.at, count: n } : null;
    }
    if (g.kind === "folders") {
      var folders = list(g.folders).map(function (f) { return { name: text(f.name, 40), notes: count(f.notes) }; })
        .filter(function (f) { return f.name && f.notes; }).slice(0, 3);
      return folders.length > 1 ? { kind: "folders", at: g.at, folders: folders } : null;
    }
    if (g.kind === "meetings") {
      var notes = (Array.isArray(g.notes) ? g.notes : []).map(function (t) { return text(t, 60); }).filter(Boolean).slice(0, 5);
      return notes.length > 1 ? { kind: "meetings", at: g.at, notes: notes } : null;
    }
    return isGift && g.kind === "calm" ? { kind: "calm", at: g.at } : null;
  }
  /** What changed in a reading, in one string: a new line, the gift, an offer, done. */
  function readingSig(r) {
    return [r.startedAt, r.done, r.lines.join("\n"), r.gift && r.gift.at, r.offers.map(function (o) { return o.at; }).join(",")].join("|");
  }
  /** A reading that started in the last 35 minutes: an older one is not this build's. */
  function fresh(r) {
    var at = r ? parseTime(r.startedAt) : null;
    return !!at && (Date.now() - at.getTime()) / 60000 < READ_FRESH_MIN;
  }
  /** The agent is still reading: the file says so, it is fresh, and the routine runs. */
  function readingNow() { var r = state.reading; return !!(r && !r.done && state.running && fresh(r)); }
  function freshLines() { return fresh(state.reading) ? state.reading.lines : []; }
  // Lines that arrive together are still told one by one, and once done, one more beat on
  // "Putting your library together" before the page. Only once this page has shown the reading.
  function revealing() { return !!(state.sawReading && state.reading && state.readShown < freshLines().length + (state.reading.done ? 1 : 0)); }
  /** A new read (another startedAt) starts its lines from the first one. */
  function setReading(r) {

  }

  /** "Home, Work and Recipes". */
  function andList(words) { return words.length > 1 ? words.slice(0, -1).join(", ") + " and " + words[words.length - 1] : words.join(""); }
  function quoted(words) { return words.map(function (w) { return '"' + w + '"'; }); }
  /** The question a gift or an offer asks in the chat. Every one only reads. */
  function askOf(g) {

      return "Go through my meeting notes in Apple Notes, like " + andList(quoted(g.notes)) + ", and others like them. Put every to-do in them on one list, with the note each came from and any date. Leave out what looks done, and only list them.";
    }

  function giftParts(g) {
    if (g.kind === "old") {
      return { head: "You have <b>" + g.count + " " + plural(g.count, "note", "notes") + "</b> nobody touched in a year.",
        why: "Want a list of the ones worth tidying?", button: "List them to tidy" };
    }
    if (g.kind === "folders") {
      return { head: "Your " + g.folders.length + " biggest folders: " + andList(g.folders.map(function (f) { return "<b>" + esc(f.name) + "</b>"; })) + ".",

  function offerParts(o) {

    return { icon: "i-list", title: "Meeting notes into to-dos", sub: "Like " + andList(quoted(o.notes.slice(0, 2))) + ".", button: "Make the list" };
  }
  function giftHtml(g, where) {
    var p = giftParts(g);
    var asked = state.giftAsked === g.at;
    var arrive = where === "reading" && state.giftShownAt !== g.at;
    if (where === "reading") state.giftShownAt = g.at;
    return '<section class="gift' + (arrive ? " arrive" : "") + '" aria-live="polite">' +
      '<p class="label">' + (where === "reading" ? "Start here" : "Found while reading your notes") + "</p>" +
      "<h3>" + p.head + "</h3>" +
      '<p class="why">' + esc(p.why) + "</p>" +
      (asked
        ? '<p class="asked">' + icon("i-check") + "Asked. The answer is coming in the chat next to this page.</p>"
        : '<div class="actions">' + (canAct() ? '<button type="button" class="btn primary" data-act="gift-do">' + icon("i-send") + esc(p.button) + "</button>" : "") +

  function offerKey(o) { return o.at + "|" + o.kind; }
  function offersHtml(offers, where) {

      var key = offerKey(o);

        (state.offersAsked[key] ? '<span class="asked">' + icon("i-check") + "Asked</span>"

        "</li>";

  }
  /** After the reading: the gift and the offers stay on top for a few days, until used or put away (once used, they say so until the page reloads). */
  function giftKeepHtml() {
    var r = state.reading;
    var at = r ? parseTime(r.startedAt) : null;
    if (!r || !at || !state.mineReady || state.giftDone === "all:" + r.startedAt || state.example || readingNow() || revealing() ||
      Date.now() - at.getTime() >= GIFT_KEEP_DAYS * DAY_MS) return "";
    var g = r.gift && (state.giftDone !== r.gift.at || state.giftAsked === r.gift.at) ? r.gift : null;
    var offers = r.offers.filter(function (o) { var k = offerKey(o); return !state.offersDone[k] || state.offersAsked[k]; });
    if (!g && !offers.length) return "";
    var skip = g && state.giftAsked !== g.at ? "" : '<p class="fine"><button type="button" class="btn small" data-act="gift-skip">Not now</button></p>';
    return '<div class="keep">' + (g ? giftHtml(g, "keep") : '<p class="label" style="margin:0">Found while reading your notes</p>') + offersHtml(offers, "keep") + skip + "</div>";
  }
  /** Kept for this person on any computer, when Cabinet can. */
  function remember(key, value) {

  }
  /** The gift was used (`all` false), or the person put the gift and the offers away. */
  function giftDone(all) {

  /** A line may mark its finding in **bold**; everything else is plain text. */

      '<li class="now"><i class="pulse-dot" aria-hidden="true"></i><span>' + (done ? "Putting your library together" : lines.length ? "Reading on" : "Opening your notes") + "...</span></li></ul>" +
      '<p class="fine">Only reads. Nothing in Apple Notes changes, and it all stays in your cabinet.</p></div>' +

  }
  /**
   * The reading fills the page from the moment the first build starts until it says done: no

  function showReading() { return (state.running && (state.example || !state.data)) || (state.sawReading && readingNow()) || revealing(); }

  // ── Painting ───────────────────────────────────────────────────────────

      var newest = day(d.newestNote);

    var html = "";
    var s = notesState();
    if (canAct() && s === "connected" && !(state.example && !state.lastTry)) {
      html += '<button class="btn" data-act="run"' + (state.running ? " disabled" : "") + ">" +
        icon("i-refresh", state.running ? "spin" : "") + (state.running ? "Building..." : "Rebuild") + "</button>";

  /** The first thing under the header: what is missing, what went wrong, or that this is an example. */
  function topHtml() {
    var s = notesState();

      return state.example
        ? banner("i-info", "", "<b>This is a made-up library.</b> Open this cabinet in the Cabinet app on your Mac to bring in your own notes.")
        : "";
    }
    // The first build said it is done: its page is here while the routine wraps up.

      return banner("i-refresh", "", "<b>Building your library.</b> With many notes this can take a while.");
    }
    if (state.example && s && s !== "connected") {
      if (s === "not-available-here" || !state.notes.canConnect) {

        '<div class="actions"><button class="btn primary" data-act="bring"' + (state.connecting ? " disabled" : "") + ">" +

  }
  function banner(iconId, cls, inner, action) {

  // Topics: each one tap from a question to the agent. Cards on a large box, rows on a medium one.

  // ── The grid of boxes ──────────────────────────────────────────────────

  });
  var GROUPS = [
    { id: "library", title: "Your library" },
    { id: "numbers", title: "Numbers" },
    { id: "ask", title: "Ask and ideas" },
    { id: "single", title: "One idea" }

  var PHONE = window.matchMedia ? window.matchMedia("(max-width: 720px)") : null;

  /** One layout entry: its place on the grid, and on a phone its order (o) and size (p). */

    if (whole(b.o)) out.o = b.o;

  /**
   * Where the boxes land: each keeps its columns, is pushed down past any box above it that
   * it would overlap (an opened list grows), then rises into the space left above it, so a
   * hidden or shorter box never leaves a hole. A pinned box (the one being moved or resized)
   * is placed first, exactly where it was put, and the others make room around it.
   */
  function placed(source, pinId) {
    var out = [];
    function hits(b, y, h) {

    }

      .filter(function (b) { return !BOXES[b.id].show || BOXES[b.id].show(); })
      .slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    boxes.forEach(function (b) {

  // ── Motion ─────────────────────────────────────────────────────────────
  // Boxes glide to new places on a spring with a small, quick bounce. Before a change the
  // page notes where every box is (and stops what is still moving); after it, each box
  // starts where it was and glides to where it is now. A box that changes size grows or
  // shrinks for real, so its words never stretch. People who asked their system for less

  /** Puts every box in its place and order, without drawing what is inside. */
  function placeBoxes() {

    grid.style.setProperty("--row", ROW + "px");
    grid.style.setProperty("--gap", GAP + "px");
    var spots = stack ? phoneOrder(placed()) : placed();
    var keep = {};
    spots.forEach(function (spot, i) {
      keep[spot.id] = true;
      var el = boxEl(spot.id);
      if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      el.style.gridColumn = stack ? "" : spot.x + 1 + " / span " + spot.w;
      el.style.gridRow = stack ? "" : spot.y + 1 + " / span " + spot.h;

      if (state.editing) {

    });

  }

  function paintGrid() {
    var grid = $("grid");

    grid.hidden = !show;

    var spots = placeBoxes();
    $("grid-empty").hidden = spots.length > 0;
    spots.forEach(function (spot) { drawBox(boxEl(spot.id)); });
  }

  /** Draws one box at the level its width gives it; what someone was typing survives. */
  function drawBox(el) {

    if (state.editing) {
      html += '<button type="button" class="box-x" data-act="remove-box" aria-label="Remove ' + esc(BOXES[id].title) + '">' + icon("i-x") + "</button>";
      html += phone()
        ? '<div class="box-size" role="group" aria-label="Size of ' + esc(BOXES[id].title) + '">' + ["S", "M", "L"].map(function (size) {
            return '<button type="button" data-act="phone-size" data-size="' + size + '" aria-pressed="' + (level === size) + '">' + LEVEL_WORDS[size] + "</button>";

  /**

  function fitBox(el) {

  function boxHead(key, title, iconId, n) {

    if (state.drawerOpen) paintDrawer();

  function removeBox(id) {

    if (el) el.classList.add("leaving");
    setTimeout(function () {
      if (el) el.classList.remove("leaving");

    }, 200);
  }
  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {
    var spots = placed(source);

      for (var x = 0; x + w <= COLS; x++) {
        var hit = spots.some(function (o) { return x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h; });

    closeDrawer();
    var el = boxEls[id];

    } else if (act === "idea-routine") {
      var it = ideaById(el.getAttribute("data-idea"));
      if (it) { closeDrawer(); ask("Set this up as a routine that runs " + it.at + ": " + it.ask + " Show me the routine so I can approve it before it starts."); }
    } else if (act === "ideas") {

    } else if (act === "add-box") {
      openDrawer("add");
    } else if (act === "add-this") {

    } else if (act === "phone-size") {

      Object.keys(boxEls).forEach(function (id) { if (boxEls[id].isConnected) fitBox(boxEls[id]); });
    });
  }

  if (V2) {
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    var unavailable = { id: "apple-notes", state: "not-available-here", problem: null, canConnect: false };
    cab.connectors.list().then(function (items) {
      state.notes = pickNotes(items) || unavailable;
      paint();
      firstLook();
    }).catch(function () { state.notes = unavailable; paint(); });
    cab.connectors.onChange(function (items) { var n = pickNotes(items); if (n) { state.notes = n; paint(); } });
    // Whether this person already used or put away the gift and the offers, on any computer,
    // and their own layout, if they changed it.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var clean = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (clean) state.layout = clean;
      var seen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof seen === "string") state.giftDone = seen;
      var offersSeen = mine ? mine.get(OFFERS_KEY) : null;
      if (Array.isArray(offersSeen)) offersSeen.forEach(function (k) { if (typeof k === "string") state.offersDone[k] = true; });
    }).catch(function () {}).then(function () {
      state.mineReady = true;
      paint();
    });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
  }
})();
</script>

</html>
