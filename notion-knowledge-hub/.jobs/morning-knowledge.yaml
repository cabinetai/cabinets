id: morning-knowledge
name: Morning knowledge brief
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: knowledge-curator
agentSlug: knowledge-curator
timeout: 900
prompt: |-
  Write this morning's knowledge brief.

  Your working directory is the cabinet root. Your persona holds the rules: where Cabinet
  keeps the Notion pages, how to read them cheaply, and what the brief holds. Follow its
  order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and list `hub/`.
  2. Find the Notion line in "Connections this cabinet uses". If it says Notion is not
     connected, or names no folder, or the folder it names cannot be read, write nothing,
     add `NEEDS_CONNECTION: notion | <why, in plain words>` to your cabinet block, and stop.
  3. Read the copy as your persona's "The morning read" says: frontmatter first, bodies only
     where a section needs them.
  4. Write `hub/<YYYY-MM-DD>.md` with the five sections your persona lists, in that order.
  5. On the first run that writes a brief, delete `hub/EXAMPLE-brief.md`.

  You only read. Never edit, create or delete a page in the Notion copy.

  Finish in one or two plain sentences and nothing else: how many pages changed, how many
  need a review, and the one page most worth a look today.
createdAt: '2026-11-03T00:00:00.000Z'
updatedAt: '2026-11-03T00:00:00.000Z'
