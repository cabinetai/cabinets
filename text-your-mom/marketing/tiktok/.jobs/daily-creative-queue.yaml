id: daily-creative-queue
name: Daily Creative Queue
enabled: false
schedule: 0 10 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: script-writer
agentSlug: script-writer
timeout: 600
prompt: |-
  Review content-ideas.csv. Keep its columns and their order: Title, Format, Hook, Status, Priority, Notes, Post date, Brief.
  Status is one of Idea, Research, Script Ready, Made, Posted, spelled exactly.
  1. Keep the next two weeks filled. Every Monday, Wednesday and Friday from today needs a post. Fill an empty day from the rows with no Post date, highest Priority first (Critical, High, Medium, Low), and write the date in Post date as YYYY-MM-DD. Never move a post that already has a date.
  2. Work on the rows still in Idea or Research, earliest Post date first. Prioritize ideas that feel immediately relatable, funny, and easy to visualize in 5 to 7 slides.
  3. For each one you finish, write briefs/<slug>.md with the hook, the slides or script, and the call to action. The slug is the Title in lowercase with every run of other characters turned into one hyphen. If another row already uses that path, add -2, -3 and so on to the slug. Put that path in Brief and set Status to Script Ready.
  Quote any field with a comma or a quote in it. Do not post anything to TikTok.
cabinetPath: Cabinet/cabinets/text-your-mom/marketing/tiktok
createdAt: '2026-04-11T00:00:00.000Z'
updatedAt: '2026-04-11T00:00:00.000Z'
