id: daily-trend-scan
name: Daily Trend Scan
enabled: false
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: trend-scout
agentSlug: trend-scout
timeout: 600
prompt: |-
  Review the current TikTok cabinet backlog and identify 3 to 5 fresh content angles for Text Your Mom.
  Focus on:
  - missed reply guilt
  - mom texting patterns
  - group chat avoidance
  - wholesome but funny accountability
  Add them to content-ideas.csv as new rows. Keep its columns and their order: Title, Format, Hook, Status, Priority, Notes, Post date, Brief.
  Set Status to Idea, spelled exactly, and leave Brief empty.
  Leave Post date empty. The creative queue dates the whole backlog by Priority, so a new idea does not jump ahead of an older, more important one.
  Quote any field with a comma or a quote in it.
cabinetPath: Cabinet/cabinets/text-your-mom/marketing/tiktok
createdAt: '2026-04-11T00:00:00.000Z'
updatedAt: '2026-04-11T00:00:00.000Z'
