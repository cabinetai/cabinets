id: monthly-style-read
name: Monthly Style Read
enabled: true
schedule: 0 10 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: style-reader
agentSlug: style-reader
timeout: 1800
prompt: |-
  Write this month's read of how they prompt.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-your-style.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns and the tone. This prompt does not repeat them.
  2. Read every imported transcript. Skip `.agents`, `.jobs`, `.cabinet-state`,
     `summaries` and `your-style` — that last one is this cabinet's own app folder,
     not imported history. Everything else is a real imported transcript.
  3. Categorise the prompts you find into the kinds the persona describes, and count
     each kind.
  4. Write your dated file, following the persona's frontmatter and table shape
     exactly.
  5. If nothing has been imported yet — no transcripts on disk, the normal state
     before the first import — STOP HERE. Write nothing. Leave `summaries/` exactly
     as you found it, example and all. Report: "Claude Code history has not been
     imported yet. I would have read every transcript and written a category-by-
     category read of how they prompt." Then exit.
  6. On the first run that finds real imported transcripts, write your dated file
     and then delete `summaries/EXAMPLE-your-style.md`. It is a demo, not a past
     summary, and it must not sit in the picker beside real ones. Do not merge with
     it, do not rename it, and never write `EXAMPLE` into a name of your own.
