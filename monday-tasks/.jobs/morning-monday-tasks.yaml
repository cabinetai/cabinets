id: morning-monday-tasks
name: Morning monday.com Tasks
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: item-reader
agentSlug: item-reader
timeout: 600
prompt: |-
  Write this morning's list of what is on the user in monday.com.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-monday-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Status` vocabulary, how to map each board's own status labels onto it,
     the ordering and the tone. This prompt does not repeat them.
  2. With your monday.com tools, search the boards the user can see for the open items
     assigned to them, and for any item where they are the reason someone else is held up.
     Read each board's own status column so you can map it. Open an item only far enough
     to say in one short line what happens next.
  3. This run is read only. Do not create an item, update an item, change a status or post
     an update, however obvious the one-line answer looks.
  4. If you have no monday.com tool, or monday.com is not connected, or the call fails,
     STOP HERE. Write nothing. Leave `daily-summaries/` exactly as you found it, example
     and all. Report: "monday.com is not reachable. I would have read the open items
     assigned to the user across their boards and written one row per item." Then exit.
  5. On the first run that does reach monday.com, write your dated file and then delete
     `daily-summaries/EXAMPLE-monday-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
