<!DOCTYPE html>
<!--
  Notes To-Dos: Your To-Dos. The cabinet opens on this page.

  For someone whose to-dos are scattered across Apple Notes: every one on one page, grouped
  by the note it came from, with anything dated pulled up into "Coming up".

  Where the words come from: the Gather My To-Dos routine reads the notes Cabinet copied in
  from Apple Notes and writes data/latest.json next to this page (the shape is
  data/EXAMPLE-latest.json: made-up notes, always labelled as an example here), and
  data/status.json with ok:false and why when it could not finish. On the very first look,
  first-read.mjs also writes data/reading.json: one line per note it finds to-dos in, and
  one thing the person can do now (the gift). The page tells those lines as they come.

  How it talks to Cabinet: window.cabinet v2 (connection state, bring the notes in, ask,
  run the routine, read files). In an older Cabinet it reads the same files over the page's
  own address. It never changes a note: Apple Notes is a one-way copy.

  One file on purpose: a sealed frame cannot load files next to it. System fonts; icons are
  inline SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your To-Dos</title>
<style>
  :root {
    --page: #fffdf7;
    --panel: #ffffff;
    --line: #ece5d3;
    --ink: #1f1d1a;
    --muted: #6f6a60;
    --faint: #a59f92;
    --yellow: #f5c518;
    --yellow-ink: #7a5d00;
    --yellow-tint: #fff5cf;
    --red-ink: #b42318;
    --red-tint: #fdecea;
    --blue-ink: #1d5fa8;
    --blue-tint: #e9f1fb;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31, 29, 26, .05), 0 10px 28px -16px rgba(31, 29, 26, .18);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font: 15px/1.5 var(--font); padding: 36px 24px 72px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14.5px; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .fine { color: var(--muted); font-size: 13px; margin: 0; }

  .banner {
    margin-top: 22px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
    background: var(--yellow-tint); color: var(--yellow-ink); display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.err { background: var(--red-tint); color: var(--red-ink); }
  .banner .icon { margin-top: 3px; }
  .banner > div { flex: 1; min-width: 0; }
  .banner b { font-weight: 650; }
  .banner .btn { margin-left: auto; }

  .hero { margin-top: 22px; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 24px; }
  .hero h2 { margin: 0 0 6px; font-size: 19px; }
  .hero p { margin: 0 0 14px; color: var(--muted); }

  section { margin-top: 28px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  .coming { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px 0; }
  .due-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; }
  .due-row + .due-row { border-top: 1px solid var(--line); }
  .when { flex: none; width: 112px; font-size: 13px; font-weight: 650; color: var(--blue-ink); }
  .when.late { color: var(--red-ink); }
  .due-text { flex: 1; min-width: 0; }
  .from { color: var(--faint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .note { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 12px; border-top: 4px solid var(--yellow); }
  .note h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .items { list-style: none; margin: 10px 0 0; padding: 0; }
  .items li { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 14.5px; }
  .box { flex: none; width: 16px; height: 16px; margin-top: 3px; border: 1.5px solid var(--faint); border-radius: 50%; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .tag.date { background: var(--blue-tint); color: var(--blue-ink); }
  .tag.date.late { background: var(--red-tint); color: var(--red-ink); }
  .tag.promise { background: var(--yellow-tint); color: var(--yellow-ink); }
  .more { color: var(--faint); font-size: 13px; margin: 14px 2px 0; }

  .ask { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .ask form { display: flex; gap: 8px; }
  .ask input {
    flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--page); color: var(--ink);
  }
  .ask input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-tint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--page); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--yellow); background: var(--yellow-tint); }
  #ask-note { margin-top: 10px; min-height: 1em; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* The first look, told as it happens: one line for each note the agent finds to-dos in. */
  .read-page { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .reading { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
  .reading h2 { margin: 0 0 4px; font-size: 19px; }
  .reading > p { margin: 0 0 14px; color: var(--muted); }
  .read-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .read-lines li { display: flex; gap: 10px; align-items: flex-start; animation: line-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  .read-lines li .icon { margin-top: 3px; color: var(--yellow-ink); }
  .read-lines li b { font-weight: 650; }
  .read-lines li.old { animation: none; }
  .read-lines li.now { color: var(--muted); }
  .pulse-dot { flex: none; width: 8px; height: 8px; margin: 7px 4px 0; border-radius: 50%; background: var(--yellow); animation: read-pulse 1.2s ease-in-out infinite; }
  .reading .fine { margin-top: 14px; }
  @keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes read-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }

  /* The gift: one thing the person can do now, found while the agent reads. */
  .gift { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 16px; border-top: 4px solid var(--yellow); }
  .gift.arrive { animation: line-in .7s cubic-bezier(.2, .8, .2, 1) both; }
  .gift .label { margin-bottom: 6px; }
  .gift h3 { margin: 0; font-size: 17px; line-height: 1.35; }
  .gift h3 b { font-weight: 700; }
  .gift .items { margin-top: 8px; }
  .gift .why { margin: 8px 0 0; color: var(--muted); }
  .gift .actions { margin-top: 14px; }
  .gift .asked { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0 0; font-weight: 600; color: var(--yellow-ink); }
  .gift .asked .icon { margin-top: 3px; }
  .gift .fine { margin-top: 10px; }
  .gift.looking { background: none; box-shadow: none; border: 1.5px dashed var(--line); padding: 22px 20px; display: flex; gap: 10px; align-items: flex-start; }
  .gift.looking h3 { color: var(--muted); font-weight: 600; }
  .keep { margin-top: 22px; }
  @media (min-width: 760px) {
    .read-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .read-page.solo { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 640px) {
    body { padding: 22px 16px 64px; }
    h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .when { width: 88px; }
    .from { display: none; }
    .ask form { flex-direction: column; }
    .banner { flex-wrap: wrap; }
    .banner .btn { margin-left: 26px; }
    .gift.looking { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .spin, .read-lines li, .pulse-dot, .gift.arrive { animation: none; } .toast { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>
<div class="wrap">
  <header>
    <div class="title">
      <img class="mark" id="mark" alt="" hidden />
      <div>
        <h1>Your to-dos</h1>
        <p class="sub" id="sub">Every to-do you wrote down in Apple Notes, gathered on one page.</p>
      </div>
    </div>
    <div class="actions" id="actions"></div>
  </header>

  <div id="body"></div>

  <section>
    <p class="label">Ask about your notes</p>
    <div class="ask">
      <form id="ask-form">
        <input id="ask-input" maxlength="3900" placeholder="What did I promise Dana?" autocomplete="off" />
        <button class="btn primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Ask</button>
      </form>
      <div class="chips" id="chips"></div>
      <p class="fine" id="ask-note"></p>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var cab = window.cabinet;
  var V2 = !!(cab && cab.connectors && cab.files && cab.jobs);
  var JOB = "gather-todos";
  var AGENT = "todo-finder";
  var POLL_MS = 60000;
  var DAY_MS = 86400000;

  var QUESTIONS = [
    "What's due this week?",
    "What did I promise someone?",
    "Make me a plan for today",
    "Which to-dos are the oldest?"
  ];

  var state = {
    appPath: appPathFromUrl(),
    here: null,
    data: null,
    example: true,
    lastTry: null,
    loaded: false,
    notes: null,
    jobs: [],
    running: false,
    runNote: "",
    connecting: false,
    connectNote: "",
    jobsKnown: false,
    looked: false,
    reading: null,
    readStartedAt: null,
    readShown: 0,
    sawReading: false,
    giftShownAt: null,
    giftAsked: null,
    giftDone: null,
    mineReady: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function icon(id, cls) {
    return '<svg class="icon' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function text(value, max) {
    var s = typeof value === "string" ? value.trim() : "";
    return max && s.length > max ? s.slice(0, max - 1) + "…" : s;
  }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function list(value) { return Array.isArray(value) ? value.filter(function (x) { return x && typeof x === "object"; }) : []; }
  function count(value) { return typeof value === "number" && isFinite(value) && value >= 0 ? Math.round(value) : null; }

  function appPathFromUrl() {
    // /api/assets/<cabinet path>/<app folder>/index.html: the folder before the file.
    var parts = location.pathname.split("/").filter(Boolean);
    var at = parts.length - 2;
    return at >= 0 ? decodeURIComponent(parts[at]) : "your-todos";
  }

  var toastTimer = 0;
  function toast(message) {
    var el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3200);
  }

  // ── Dates, in the person's own clock ───────────────────────────────────

  function parseTime(value) {
    if (typeof value !== "string" || !value) return null;
    // A bare date is a calendar day, not midnight in another zone.
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    // "+0300" as `date +%z` prints it is read like "+03:00".
    var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(value.replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
    return isNaN(d.getTime()) ? null : d;
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS); }
  function shortDate(d) { return d.toLocaleDateString([], { month: "short", day: "numeric" }); }
  function ago(d, now) {
    var gap = daysBetween(d, now);
    if (gap <= 0) return "today";
    if (gap === 1) return "yesterday";
    if (gap < 7) return d.toLocaleDateString([], { weekday: "long" });
    return shortDate(d);
  }
  /** "Today", "Tomorrow", "Friday", "Oct 24", or "Was due Oct 13". */
  function dueWords(d, now) {
    var gap = daysBetween(now, d);
    if (gap < 0) return { words: "Was due " + shortDate(d), late: true };
    if (gap === 0) return { words: "Today", late: false };
    if (gap === 1) return { words: "Tomorrow", late: false };
    if (gap < 7) return { words: d.toLocaleDateString([], { weekday: "long" }), late: false };
    return { words: shortDate(d), late: false };
  }

  /** The example keeps its shape over time: its dates move with today, so it never looks stale. */
  var shift = 0;
  function day(value) {
    var d = parseTime(value);
    return d && shift ? new Date(d.getTime() + shift * DAY_MS) : d;
  }

  // ── Reading the files the routine writes ───────────────────────────────

  function notFound() { var e = new Error("not written yet"); e.code = "not-found"; return e; }
  function readText(rel) {
    if (V2) return cab.files.read(state.appPath + "/" + rel);
    // An older Cabinet: the files sit next to this page on the same address.
    return fetch(rel, { cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 404) throw notFound();
      if (!r.ok) throw new Error("Could not read " + rel + ".");
      return r.text();
    });
  }
  function readJson(rel) { return readText(rel).then(function (t) { return JSON.parse(t); }); }
  function maybe(promise) {
    return promise.catch(function (e) { if (e && e.code === "not-found") return null; throw e; });
  }
  function quiet(promise) { return promise.catch(function () { return null; }); }
  function usable(d) { return d && typeof d === "object" && Array.isArray(d.notes); }

  var loading = null;
  function load() {
    if (loading) return loading;
    loading = Promise.all([
      maybe(readJson("data/latest.json")).catch(function () { return "broken"; }),
      quiet(maybe(readJson("data/status.json"))),
      quiet(maybe(readJson("data/reading.json")))
    ]).then(function (got) {
      var latest = got[0];
      setReading(cleanReading(got[2]));
      state.lastTry = got[1] && typeof got[1] === "object" ? got[1] : null;
      if (usable(latest) && latest.example !== true) {
        state.data = latest;
        state.example = false;
        return null;
      }
      // A file half written a moment ago keeps what is on screen; the next change reloads it.
      if (latest === "broken" && state.data && !state.example) return null;
      return maybe(readJson("data/EXAMPLE-latest.json")).then(function (ex) {
        state.data = usable(ex) ? ex : null;
        state.example = true;
      });
    }).catch(function () {
      if (!state.data) state.data = null;
    }).then(function () {
      var made = state.example && state.data ? parseTime(state.data.generatedAt) : null;
      shift = made ? Math.max(0, daysBetween(made, new Date())) : 0;
      state.loaded = true;
      loading = null;
      paint();
      firstLook();
    });
    return loading;
  }

  // ── Talking to Cabinet ─────────────────────────────────────────────────

  function role() { return state.here && state.here.role ? state.here.role : "owner"; }
  function canAct() { return V2 && role() !== "viewer"; }
  function pickNotes(items) {
    if (!Array.isArray(items)) return null;
    for (var i = 0; i < items.length; i++) if (items[i] && items[i].id === "apple-notes") return items[i];
    return null;
  }
  function notesState() { return state.notes ? state.notes.state : null; }
  function job() {
    for (var i = 0; i < state.jobs.length; i++) if (state.jobs[i].id === JOB) return state.jobs[i];
    return null;
  }

  function setJobs(items) {
    if (!Array.isArray(items)) return;
    var wasRunning = state.running;
    state.jobs = items;
    var j = job();
    state.running = !!(j && j.running);
    state.jobsKnown = true;
    if (wasRunning && !state.running) load();
    paint();
    firstLook();
  }

  /**
   * The owner opens the page with Apple Notes already brought in, and only the example on it:
   * the first look starts by itself, once, as it does right after bringing the notes in. Not
   * after a look that went wrong (that shows its own Try again), and not for anyone else.
   */
  function firstLook() {
    if (state.looked || !V2 || role() !== "owner" || !state.loaded || !state.jobsKnown) return;
    if (notesState() !== "connected" || !state.example || state.lastTry || state.running || !job()) return;
    state.looked = true;
    runNow();
  }

  /** Bring the notes in, or fresh ones: Cabinet's own Apple Notes step, then a look straight away. */
  function bringIn() {
    if (!V2 || state.connecting) return;
    state.connecting = true;
    state.connectNote = "";
    paint();
    cab.connectors.connect("apple-notes").then(function (result) {
      state.connecting = false;
      return cab.connectors.list().then(function (items) {
        state.notes = pickNotes(items) || state.notes;
        paint();
        if (result === "connected") { state.looked = true; runNow(); }
      });
    }).catch(function (e) {
      state.connecting = false;
      state.connectNote = e && e.message ? e.message : "That did not work. Try again.";
      paint();
    });
  }

  function runNow() {
    if (!V2 || state.running) return;
    state.running = true;
    state.runNote = "";
    paint();
    cab.jobs.run(JOB).then(function () {
      watchRun();
    }).catch(function (e) {
      if (e && e.code === "busy") { watchRun(); return; }
      state.running = false;
      state.runNote = e && e.message ? e.message : "That did not start. Try again.";
      paint();
    });
  }

  // jobs.onChange says when the run ends; this is the fallback if a change is ever missed.
  var runTimer = 0;
  function watchRun() {
    clearInterval(runTimer);
    runTimer = setInterval(function () {
      if (!state.running) { clearInterval(runTimer); return; }
      cab.jobs.list().then(setJobs).catch(function () {});
    }, 8000);
  }

  function ask(question) {
    var q = text(question, 3900);
    if (!q) return;
    if (!V2) { toast("Open this cabinet in Cabinet to ask about your notes."); return; }
    var note = $("ask-note");
    note.textContent = "Asking...";
    cab.ask(q, { agent: AGENT, send: true }).then(function () {
      note.textContent = "Asked. The answer is coming in the chat next to this page.";
      $("ask-input").value = "";
    }).catch(function (e) {
      note.textContent = e && e.message ? e.message : "That did not go through. Try again.";
      toast(note.textContent);
    });
  }

  // ── The first look, told as it happens ─────────────────────────────────
  // On the very first look the agent adds a line to data/reading.json for each note it finds
  // to-dos in (first-read.mjs push), and the page shows them one by one. While it reads, it
  // also finds one thing the person can do now (first-read.mjs gift): a plan for today from
  // what is due soonest, a promise to keep, or, when there is nothing to do, ideas worth doing.
  // A press asks the agent in the chat beside the page; no note changes. Without reading.json
  // (an older helper, or any later look) the page is as it always was.

  var READ_FRESH_MIN = 20;
  var REVEAL_MS = 1200;
  var GIFT_KEY = "your-todos-gift-done@1";
  var GIFT_KEEP_DAYS = 3;

  function cleanReading(d) {
    if (!d || typeof d !== "object" || !Array.isArray(d.lines) || !parseTime(d.startedAt)) return null;
    var lines = d.lines.map(function (l) { return text(l, 200); }).filter(Boolean).slice(-14);
    return { startedAt: d.startedAt, done: d.done === true, lines: lines, gift: cleanGift(d.gift) };
  }
  function cleanGift(g) {
    if (!g || typeof g !== "object" || !parseTime(g.at)) return null;
    if (g.kind === "plan") {
      var items = list(g.items).map(function (it) {
        return { text: text(it.text, 140), due: parseTime(it.due), note: text(it.note, 60) };
      }).filter(function (it) { return it.text; }).slice(0, 3);
      return items.length ? { kind: "plan", at: g.at, items: items } : null;
    }
    if (g.kind === "promise") {
      var t = text(g.text, 140);
      return t ? { kind: "promise", at: g.at, text: t, note: text(g.note, 60) } : null;
    }
    return g.kind === "calm" ? { kind: "calm", at: g.at } : null;
  }
  /** A reading that started in the last 20 minutes: an older one is not this look's. */
  function fresh(r) {
    var at = r ? parseTime(r.startedAt) : null;
    return !!at && (Date.now() - at.getTime()) / 60000 < READ_FRESH_MIN;
  }
  /** The agent is still reading: the file says so, it is fresh, and the routine runs. */
  function readingNow() { var r = state.reading; return !!(r && !r.done && state.running && fresh(r)); }
  function freshLines() { return fresh(state.reading) ? state.reading.lines : []; }
  // Lines that arrive together are still told one by one, and once done, one more beat on
  // "Putting your page together" before the page. Only once this page has shown the reading.
  function revealing() { return !!(state.sawReading && state.reading && state.readShown < freshLines().length + (state.reading.done ? 1 : 0)); }
  /** A new read (another startedAt) starts its lines from the first one. */
  function setReading(r) {
    if (r && r.startedAt !== state.readStartedAt) { state.readShown = 0; state.readStartedAt = r.startedAt; }
    state.reading = r;
  }
  function giftNow() { return fresh(state.reading) ? state.reading.gift : null; }

  function giftParts(g) {
    var now = new Date();
    var from = function (note) { return note ? ' (from my note "' + note + '")' : ""; };
    if (g.kind === "plan") {
      var first = g.items[0];
      return {
        head: "Next up: <b>" + esc(first.text) + "</b>" + (first.due ? ", " + esc(dueTail(first.due, now)) : "") + ".",
        rest: g.items.slice(1),
        why: "I can turn what's due soonest into a short plan for today.",
        button: "Make me a plan for today",
        ask: "Make me a plan for today from my to-dos in Apple Notes. Start with the ones due soonest: " +
          g.items.map(function (it) { return '"' + it.text + '"' + (it.due ? ", due " + ymd(it.due) : "") + from(it.note); }).join("; ") +
          ". Pick at most five things, say why each, and keep it short."
      };
    }
    if (g.kind === "promise") {
      return {
        head: "You promised: <b>" + esc(g.text) + "</b>.",
        why: "A promise kept is one less thing on your mind. I can help you do it now.",
        button: "Help me do it now",
        ask: 'I promised: "' + g.text + '"' + from(g.note) + ". Help me do it now: tell me the first step, and if it needs a message, write it for me to send myself."
      };
    }
    return {
      head: "No to-dos in your notes right now. A good place to be.",
      why: "Want me to look for ideas you wrote down and never acted on?",
      button: "Find ideas worth doing",
      ask: "Look through my Apple Notes for ideas or plans I wrote down and never acted on. Tell me the three that look most worth doing, newest first, and the note each came from."
    };
  }
  /** "today", "tomorrow", "due Friday", "due Oct 24", "was due Oct 13": after a comma. */
  function dueTail(d, now) {
    var w = dueWords(d, now);
    if (w.late) return "was due " + shortDate(d);
    return w.words === "Today" || w.words === "Tomorrow" ? w.words.toLowerCase() : "due " + w.words;
  }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function giftHtml(g, where) {
    var p = giftParts(g);
    var now = new Date();
    var asked = state.giftAsked === g.at;
    var arrive = where === "reading" && state.giftShownAt !== g.at;
    if (where === "reading") state.giftShownAt = g.at;
    var rest = (p.rest || []).map(function (it) {
      var tags = "";
      if (it.due) { var w = dueWords(it.due, now); tags = '<span class="tag date' + (w.late ? " late" : "") + '">' + esc(w.words) + "</span>"; }
      return '<li><span class="box" aria-hidden="true"></span><span>' + esc(it.text) + tags + "</span></li>";
    }).join("");
    return '<section class="gift' + (arrive ? " arrive" : "") + '" aria-live="polite">' +
      '<p class="label">' + (where === "reading" ? "While I read, I found this for you" : "Found while reading your notes") + "</p>" +
      "<h3>" + p.head + "</h3>" +
      (rest ? '<ul class="items">' + rest + "</ul>" : "") +
      '<p class="why">' + esc(p.why) + "</p>" +
      (asked
        ? '<p class="asked">' + icon("i-check") + "Asked. The answer is coming in the chat next to this page.</p>"
        : '<div class="actions">' + (canAct() ? '<button type="button" class="btn primary" data-act="gift-do">' + icon("i-send") + esc(p.button) + "</button>" : "") +
          (where === "keep" ? '<button type="button" class="btn" data-act="gift-skip">Not now</button>' : "") + "</div>") +
      '<p class="fine">Nothing in Apple Notes changes.</p></section>';
  }
  /** After the reading: the gift stays on top for a few days, until used or put away (once used, it says so until the page reloads). */
  function giftKeepHtml() {
    var g = state.reading && state.reading.gift;
    var at = g ? parseTime(g.at) : null;
    var show = !!(g && at && state.mineReady && (state.giftDone !== g.at || state.giftAsked === g.at) && (Date.now() - at.getTime()) < GIFT_KEEP_DAYS * DAY_MS &&
      !state.example && !readingNow() && !revealing());
    return show ? '<div class="keep">' + giftHtml(g, "keep") + "</div>" : "";
  }
  function giftDone(g) {
    state.giftDone = g.at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(GIFT_KEY, g.at).catch(function () {});
  }
  /** A line may mark its finding in **bold**; everything else is plain text. */
  function lineHtml(line) { return esc(line).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
  function readingHtml() {
    var all = freshLines();
    state.sawReading = true;
    var lines = all.slice(0, Math.min(state.readShown, all.length));
    // The last lines come with done: keep them on screen until the page itself is ready.
    var done = !!(state.reading && state.reading.done) && lines.length === all.length;
    var gift = giftNow();
    return '<div class="read-page' + (!gift && done ? " solo" : "") + '"><div class="reading" aria-live="polite"><h2>Reading your notes</h2>' +
      "<p>Finding every to-do you wrote down. A minute or two. You don't need to do anything.</p>" +
      '<ul class="read-lines">' + lines.map(function (l, i) {
        return "<li" + (i < lines.length - 1 ? ' class="old"' : "") + ">" + icon("i-check") + "<span>" + lineHtml(l) + "</span></li>";
      }).join("") +
      '<li class="now"><i class="pulse-dot" aria-hidden="true"></i><span>' + (done ? "Putting your page together" : lines.length ? "Reading on" : "Opening your notes") + "...</span></li></ul>" +
      '<p class="fine">Only reads. Nothing in Apple Notes changes, and it all stays in your cabinet.</p></div>' +
      (gift ? giftHtml(gift, "reading")
        : done ? ""
        : '<section class="gift looking"><i class="pulse-dot" aria-hidden="true"></i><h3>Looking for one thing I can take off your plate right now.</h3></section>') +
      "</div>";
  }
  /** The reading is the whole page while it lasts: no made-up example under it. */
  function showReading() { return ((state.running && state.example && fresh(state.reading)) || revealing()); }

  setInterval(function () {
    if (!revealing()) return;
    state.readShown++;
    paint();
  }, REVEAL_MS);
  setInterval(function () {
    if (!V2 || (!state.running && !readingNow())) return;
    quiet(maybe(readJson("data/reading.json"))).then(function (d) {
      var r = cleanReading(d);
      var was = state.reading;
      if (!r || (was && r.lines.join("\n") === was.lines.join("\n") && r.done === was.done && (r.gift && r.gift.at) === (was.gift && was.gift.at))) return;
      setReading(r);
      paint();
      if (r.done) load();
    });
  }, 2500);

  // ── Painting ───────────────────────────────────────────────────────────

  function paint() {
    paintHeader();
    paintBody();
  }

  function paintHeader() {
    var mark = $("mark");
    if (state.notes && state.notes.logo) { mark.src = state.notes.logo; mark.hidden = false; }

    var d = state.data;
    var sub = "Every to-do you wrote down in Apple Notes, gathered on one page.";
    if (d && state.loaded && !showReading()) {
      var t = d.totals || {};
      var items = count(t.items), notes = count(t.withTodos);
      if (items === 0) sub = "Nothing to do in your notes. Enjoy it.";
      else if (items != null && notes != null) sub = items + " " + plural(items, "thing", "things") + " to do in " + notes + " " + plural(notes, "note", "notes") + ".";
      var newest = day(d.newestNote);
      if (state.example) sub += " Made-up notes, to show you the page.";
      else if (newest) sub += " From your notes as of " + shortDate(newest) + ".";
    }
    $("sub").textContent = sub;

    var html = "";
    var s = notesState();
    if (canAct() && s === "connected" && !(state.example && !state.lastTry)) {
      html += '<button class="btn" data-act="run"' + (state.running ? " disabled" : "") + ">" +
        icon("i-refresh", state.running ? "spin" : "") + (state.running ? "Looking..." : "Look again") + "</button>";
      if (state.notes && state.notes.canConnect) {
        html += '<button class="btn" data-act="bring"' + (state.connecting ? " disabled" : "") + ">" +
          icon("i-download") + "Bring in fresh notes</button>";
      }
    }
    $("actions").innerHTML = html;
  }

  /** The first thing under the header: what is missing, what went wrong, or that this is an example. */
  function topHtml() {
    var s = notesState();
    if (!V2) {
      return state.example
        ? banner("i-info", "", "<b>These are made-up notes.</b> Open this cabinet in the Cabinet app on your Mac to bring in your own.")
        : "";
    }
    // The first look said it is done: its page is here while the routine wraps up.
    if (state.running && !(fresh(state.reading) && state.reading.done && !state.example)) {
      return banner("i-refresh", "", "<b>Looking through your notes.</b> This takes a few minutes the first time.");
    }
    if (state.example && s && s !== "connected") {
      if (s === "not-available-here" || !state.notes.canConnect) {
        return hero("Apple Notes needs your Mac",
          "Notes can only be brought in on a Mac, in the Cabinet app. Until then, below are made-up notes to show you the page.", "");
      }
      if (!canAct()) {
        return hero("Your notes aren't here yet", "Ask the person who owns this cabinet to bring in their Apple Notes.", "");
      }
      return hero("Bring in your Apple Notes",
        "Your Mac asks once whether Cabinet may read Notes. Every note is copied in, nothing in Apple Notes changes, and the page fills with your own to-dos.",
        '<div class="actions"><button class="btn primary" data-act="bring"' + (state.connecting ? " disabled" : "") + ">" +
          icon(state.connecting ? "i-refresh" : "i-download", state.connecting ? "spin" : "") +
          (state.connecting ? "Bringing them in..." : "Bring in your notes") + "</button>" +
          '<span class="fine">Below are made-up notes until then.</span></div>' +
          (state.connectNote ? '<p class="fine" style="margin-top:10px">' + esc(state.connectNote) + "</p>" : ""));
    }
    var failed = state.lastTry && state.lastTry.ok === false;
    var shown = state.data && !state.example ? parseTime(state.data.generatedAt) : null;
    var tried = state.lastTry ? parseTime(state.lastTry.at) : null;
    if (failed && (!shown || !tried || tried >= shown)) {
      return banner("i-alert", "err", "<b>" + esc(text(state.lastTry.why, 200) || "The last look didn't finish.") + "</b>",
        canAct() ? '<button class="btn" data-act="run">Try again</button>' : "");
    }
    if (state.runNote) return banner("i-alert", "err", esc(state.runNote));
    if (state.connectNote) return banner("i-alert", "err", esc(state.connectNote));
    if (state.example && s === "connected") {
      return banner("i-info", "", "<b>These are made-up notes.</b> Your own to-dos appear after the first look.",
        canAct() ? '<button class="btn" data-act="run">Look now</button>' : "");
    }
    return "";
  }
  function banner(iconId, cls, inner, action) {
    return '<div class="banner' + (cls ? " " + cls : "") + '">' + icon(iconId, iconId === "i-refresh" ? "spin" : "") +
      "<div>" + inner + "</div>" + (action || "") + "</div>";
  }
  function hero(title, body, actions) {
    return '<div class="hero"><h2>' + esc(title) + "</h2><p>" + esc(body) + "</p>" + actions + "</div>";
  }

  function paintBody() {
    if (!state.loaded) { $("body").innerHTML = '<p class="fine" style="margin-top:22px">Loading...</p>'; return; }
    if (showReading()) { $("body").innerHTML = readingHtml(); return; }
    var html = topHtml() + giftKeepHtml();
    var d = state.data;
    if (!d) {
      $("body").innerHTML = html || '<p class="fine" style="margin-top:22px">Nothing to show yet.</p>';
      return;
    }
    var now = new Date();
    var notes = list(d.notes).slice(0, 30);

    // Coming up: every dated item across the notes, soonest first.
    var dated = [];
    notes.forEach(function (n) {
      list(n.items).forEach(function (it) {
        var due = day(it.due);
        if (due && text(it.text)) dated.push({ due: due, text: text(it.text, 120), note: text(n.title, 60) });
      });
    });
    dated.sort(function (a, b) { return a.due - b.due; });
    if (dated.length) {
      html += '<section><p class="label">Coming up</p><div class="coming">' + dated.slice(0, 8).map(function (x) {
        var w = dueWords(x.due, now);
        return '<div class="due-row"><span class="when' + (w.late ? " late" : "") + '">' + esc(w.words) + "</span>" +
          '<span class="due-text">' + esc(x.text) + '</span><span class="from">' + esc(x.note) + "</span></div>";
      }).join("") + "</div></section>";
    }

    if (notes.length) {
      html += '<section><p class="label">By note</p><div class="grid">' + notes.map(function (n) {
        var edited = day(n.edited);
        var meta = [text(n.folder, 60), edited ? "edited " + ago(edited, now) : ""].filter(Boolean).join(" · ");
        var items = list(n.items).slice(0, 12).map(function (it) {
          var t = text(it.text, 140);
          if (!t) return "";
          var due = day(it.due), tags = "";
          if (due) { var w = dueWords(due, now); tags += '<span class="tag date' + (w.late ? " late" : "") + '">' + esc(w.words) + "</span>"; }
          if (it.promise === true) tags += '<span class="tag promise">promised</span>';
          return '<li><span class="box" aria-hidden="true"></span><span>' + esc(t) + tags + "</span></li>";
        }).join("");
        return '<article class="note"><h3>' + esc(text(n.title, 80) || "Untitled note") + "</h3>" +
          (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") + '<ul class="items">' + items + "</ul></article>";
      }).join("") + "</div>";
      var t = d.totals || {};
      var withTodos = count(t.withTodos);
      if (withTodos != null && withTodos > notes.length) {
        var rest = withTodos - notes.length;
        html += '<p class="more">' + rest + " more " + plural(rest, "note has", "notes have") + " to-dos. Ask about them below.</p>";
      }
      html += "</section>";
    } else if (!state.example) {
      html += '<div class="hero"><h2>Nothing to do</h2><p>No to-dos in your notes right now. New ones show up after you bring in fresh notes.</p></div>';
    }
    $("body").innerHTML = html;
  }

  function paintQuestions() {
    $("chips").innerHTML = QUESTIONS.map(function (q) {
      return '<button class="chip" type="button" data-q="' + esc(q) + '">' + esc(q) + "</button>";
    }).join("");
  }

  // ── Events ─────────────────────────────────────────────────────────────

  document.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act],[data-q]") : null;
    if (!el) return;
    if (el.getAttribute("data-q")) { ask(el.getAttribute("data-q")); return; }
    var act = el.getAttribute("data-act");
    if (act === "run") runNow();
    else if (act === "bring") bringIn();
    else if (act === "gift-do") {
      var gift = state.reading && state.reading.gift;
      if (gift) {
        ask(giftParts(gift).ask);
        state.giftAsked = gift.at;
        giftDone(gift);
        paint();
      }
    } else if (act === "gift-skip") {
      if (state.reading && state.reading.gift) giftDone(state.reading.gift);
      paint();
    }
  });
  $("ask-form").addEventListener("submit", function (event) {
    event.preventDefault();
    ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paintQuestions();
  paint();

  if (V2) {
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    var unavailable = { id: "apple-notes", state: "not-available-here", problem: null, canConnect: false };
    cab.connectors.list().then(function (items) {
      state.notes = pickNotes(items) || unavailable;
      paint();
      firstLook();
    }).catch(function () { state.notes = unavailable; paint(); });
    cab.connectors.onChange(function (items) { var n = pickNotes(items); if (n) { state.notes = n; paint(); } });
    // Whether this person already used or put away the gift, on any computer.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var seen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof seen === "string") state.giftDone = seen;
    }).catch(function () {}).then(function () {
      state.mineReady = true;
      paint();
    });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
  }
})();
</script>
</body>
</html>
