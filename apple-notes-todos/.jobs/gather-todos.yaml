id: gather-todos
name: Gather My To-Dos
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: todo-finder
agentSlug: todo-finder
timeout: 900
prompt: |-
  Gather the person's to-dos from their Apple Notes for the Your To-Dos page.

  Your working directory is the cabinet root. You write only `latest.json` and
  `status.json` in `your-todos/data/`. On the first look you also write `reading.json` and
  files in `your-todos/data/.work/`, only through `node your-todos/first-read.mjs`. Never
  touch any other file, and never `EXAMPLE-latest.json`.

  1. Read your persona before anything else. It holds where the notes are, how a look
     goes, what counts as a to-do and the shape of every file. This prompt does not
     repeat them.
  2. If `your-todos/data/latest.json` is not there, this is the first look and the person
     is watching: run `first-read.mjs start` in your first Bash call, `push` a line per
     note with to-dos, give the `gift`, then `latest` and `done` last, all as your persona
     says.
  3. Their notes are read only on this run. Never create, change, move or delete a note,
     or tick off a to-do, with any tool, however done it looks.
  4. If there are no notes to read or the look cannot finish, write `status.json` with
     `ok: false` and a `why` as your persona says, run `done` on the first look, and stop.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-18T12:00:00.000Z'
