id: gather-todos
name: Gather My To-Dos
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: todo-finder
agentSlug: todo-finder
timeout: 900
prompt: |-
  Gather the person's to-dos from their Apple Notes for the Your To-Dos page.

  Your working directory is the cabinet root. You write only `your-todos/data/latest.json`
  and `your-todos/data/status.json`. Never touch any other file, never
  `EXAMPLE-latest.json`, and never a note.

  1. Read your persona before anything else. It holds where the notes are, the shape of
     every field and the tone. This prompt does not repeat them. In one Bash call, print
     the time with `date '+%Y-%m-%dT%H:%M:%S%z'`.
  2. Find the `Apple Notes` folder as your persona says. If there is none, write only
     `your-todos/data/status.json` with `ok: false` and `why` "Your notes haven't been
     brought in yet.", and stop.
  3. Find the candidates with search before reading: list items (`- `, `* `, `1. `,
     `- [ ]`), and lines with words like "todo", "to do", "remember", "need to", "don't
     forget", "call", "email", "book", "buy", "pay", "send", "by Friday", or a date. Then
     read every note those searches hit that was edited in the last 12 months, and every
     note edited in the last 30 days whatever it holds.
  4. Decide what is a to-do as your persona says. A recipe's ingredients, a packing list
     for a trip that is over, a poem and meeting minutes are not, unless a line in them
     asks the person to do something.
  5. In one Bash call, write `your-todos/data/latest.json` (and check it parses), then
     `your-todos/data/status.json`.

  Finish in one plain sentence about the person's to-dos and nothing else: how many things
  to do in how many notes, and the next one with a date, if there is one.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-14T00:00:00.000Z'
