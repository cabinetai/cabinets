id: close-the-day
name: Close the Day
enabled: true
schedule: 0 21 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: food-scribe
agentSlug: food-scribe
timeout: 900
prompt: |-
  Close today's diary page.

  Your working directory is the cabinet root. Day files live in `days/`, one per
  day, named `<YYYY-MM-DD>-food-diary.md`. Today's file is the only one you may
  touch — closed days are sealed forever.

  1. Read your persona, then `setup.md`. The persona holds the file shape, the
     estimating rules, the kindness rules and the suggestion rules; setup.md holds
     the person's target, tastes and trusted sites. This prompt repeats neither.
  2. If today's file exists, total the meals and write the frontmatter close:
     total, target, headline. If "don't count at me" is in setup.md, close without
     totals — meals and suggestion only.
  3. If today has no file, create it with an empty `## Meals` and the headline
     "Nothing logged today." — no invented meals, no guilt. The evening suggestion
     still happens; quiet days deserve dinner ideas too.
  4. Find tomorrow's suggestion: search the food sites listed in setup.md for one
     real dish that fits their loves and their recent logging. Verify the URL loads
     before writing it into the frontmatter. If the web is unreachable, close the
     day without a suggestion and say so in your report — never invent a dish or a
     link.
  5. On the first evening you close a real day, delete
     `days/EXAMPLE-food-diary.md`. It is a demo, not a day anyone ate. Never write
     `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: the day's total against target (or
  "nothing logged"), and tomorrow's dish.
cabinetPath: cabinet/cabinets/food-diary
createdAt: '2026-08-15T18:00:00.119Z'
updatedAt: '2026-08-15T18:00:00.119Z'
