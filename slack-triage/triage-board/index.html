  function ownerNote() {
    return '<p class="fine"><b>Ask the person who owns this cabinet to connect Slack.</b></p>';
  }

  function connectNoteHtml() {
    return st.connectNote ? '<p class="fine">' + esc(st.connectNote) + '</p>' : '';
  }

  /* The routine line under the headline: last update and schedule, or the update running now. */
  function routineLine() {
    var html = '';
    if (!V2) return esc(nextRunText());
    if (st.running) {
      html = '<i class="pulse-dot" aria-hidden="true"></i>' + (st.catchingUp
        ? 'Catching up on the ' + clock(st.catchingUp) + ' update you missed'
        : 'Reading Slack') + '... ';
    } else {
      var j = findJob(PASS_JOB), last = newestPass();
      /* The newest pass, not the last run: a run that could not reach Slack writes nothing. */
      if (last) html += 'Updated ' + esc(dayAtMid(last)) + '. ';
      if (paused(j)) html += 'Support Triage is paused. ';
      else if (j && j.when) html += esc(j.when) + '. ';
    }
    if (connected() && canConnect()) {
      html += '<button type="button" class="link" data-act="channels" data-viewer-off>Choose channels</button>';
    }
    if (canAsk()) {
      html += '<button type="button" class="link" data-act="rules" data-viewer-off>Edit desk rules</button>';
    }
    return html;
  }

  /* The one press for everything past the limit. Only on the newest real pass. */
  function nudgeHtml() {
    var c = st.current;
    if (!c || c.example || !canAsk() || c.name !== c.files[0]) return '';
    var list = c.list.filter(function (it) { return overdue(it) && it.item && it.opened; });
    if (!list.length) return '';
    return '<div class="actions"><button type="button" class="btn primary" data-act="nudge" data-viewer-off>Draft a nudge</button>' +
      '<p class="fine">Past your ' + esc(limitHours) + ' hour limit.</p></div>';
  }

  /* What the band says under its first row. */
  function bandHtml() {
    if (showReading()) return '';
    if (!st.loaded || (V2 && !st.slackKnown)) return '<p class="skeleton">Opening your board...</p>';
    var s = slackState(), g = st.slack, problem = g && g.problem && g.problem.text ? g.problem.text : '';
    var first = failInfo();
    if (V2 && s === 'not-available-here') {
      return '<h2>Slack can’t be connected here yet</h2>' + (problem ? '<p class="lead">' + esc(problem) + '</p>' : '');
    }
    if (V2 && (s === 'needs-sign-in' || s === 'needs-you')) {
      return '<h2>Slack needs you</h2><p class="lead">' + esc(problem || 'Slack stopped letting Cabinet in.') + '</p>' +
        (canConnect() ? '<div class="actions">' + connectButton('Fix the connection') + '</div>' : ownerNote()) + connectNoteHtml();
    }
    if (V2 && s === 'not-added') {
      return '<h2>See what your support channel still owes</h2>' +
        (canConnect() ? '<div class="actions">' + connectButton('Connect Slack') + '<p class="fine">' +
          (st.connecting ? 'Finish in the window Cabinet opened.' : 'Cabinet signs in as you and reads only the channels you choose, private ones too.') + '</p></div>' : ownerNote()) +
        connectNoteHtml();
    }
    if (V2 && connected() && !newestPass()) {
      if (first && !st.running) {
        return '<h2>Your first update didn’t work</h2><p class="lead">The update ' + esc(dayAtMid(first.at)) + ' did not finish.</p>' +
          (canRun() ? '<div class="actions">' + runButton(' primary', 'Try again') + '</div>' : '');
      }
      var sched = scheduleWords();
      return '<h2>Slack is connected</h2><p class="lead">Your first update takes a few minutes.' +
        (sched ? ' Then ' + esc(sched.charAt(0).toLowerCase() + sched.slice(1)) + '.' : '') + '</p>' +
        (canRun() ? '<div class="actions">' + runButton(' primary', 'Update the board') + '</div>' : '');
    }
    var c = st.current;
    if (!c) return '<h2>No updates yet</h2>';
    var open = c.list.filter(function (it) { return it.key !== 'done'; }).length;
    var head = c.meta.headline || (open ? plural(open, 'open request', 'open requests') : c.list.length ? 'Everything is done' : 'Nothing on the board');
    var line = routineLine();
    return '<h2 dir="auto">' + esc(head) + '</h2>' + nudgeHtml() + (line ? '<p class="fine">' + line + '</p>' : '');
  }

  function paintRibbon() {
    var c = st.current;
    if (!c || !c.example) { ribbonEl.innerHTML = ''; return; }
    var rest = !V2 ? 'Connect Slack from Integrations in Cabinet and your own board replaces it.'
      : st.running ? 'Reading your Slack now. Your own board replaces it when this first update is done.'
      : connected() ? 'Your first update replaces it.'
      : 'Connect Slack and your own board replaces it.';
    ribbonEl.innerHTML = '<div class="ribbon"><p><b>Example.</b> Northwind is a made-up team. ' + rest + '</p></div>';
  }

  /* An update that failed after the newest pass was written, or null. */
  function failInfo() {
    if (!V2) return null;
    if (st.slack && !connected()) return null;
    var j = findJob(PASS_JOB);
    if (!j || !j.lastRun || j.lastRun.ok !== false) return null;
    var at = new Date(j.lastRun.at), shown = newestPass();
    if (isNaN(at) || (shown && at - shown < 60000)) return null;
    return { at: at, shown: shown };
  }

  /* Says so, with Try again, instead of letting the board look fresh. */
  function failHtml() {
    if (!V2) return '';
    if (st.runNote) return '<div class="notice"><p dir="auto">' + esc(st.runNote) + '</p></div>';
    var f = st.running ? null : failInfo();
    /* With no pass yet, the band says it. */
    if (!f || !f.shown) return '';
    return '<div class="notice"><p>The update ' + esc(dayAtMid(f.at)) + ' did not finish. The board below is from ' +
      esc(dayAtMid(f.shown).replace(/^on /, '')) + '.</p>' + (canRun() ? runButton('', 'Try again') : '') + '</div>';
  }

  /* Everything outside the board, from state. Cheap, so it runs on every change. */
  function paintStatus() {
    document.documentElement.setAttribute('data-role', V2 ? role() : 'owner');
    var active = document.activeElement;
    var focused = active && active.closest && active.closest('#status') ? active : null;
    var focusKey = focused ? (focused.id === 'pick' ? '#pick' : focused.getAttribute('data-menu') || focused.getAttribute('data-act')) : '';
    connEl.innerHTML = connHtml();
    statusEl.innerHTML = controlsHtml();
    bandBody.innerHTML = bandHtml();
    paintRibbon();
    failEl.innerHTML = failHtml();
    askBox.hidden = !canAsk() || showReading();
    /* Repainting replaces the buttons, so a keyboard user keeps their place. */
    if (focusKey) {
      var again = focusKey === '#pick' ? $('pick') : statusEl.querySelector('[data-menu="' + focusKey + '"]') ||
                  statusEl.querySelector('[data-act="' + focusKey + '"]');
      if (again) again.focus();
    }
    paintReading();
  }

  /* A change in who this is or how the page is laid out redraws everything. */
  function paint() {
    renderPatterns();
    draw();
  }

  /* ---- what the person keeps, in cabinet.mine --------------------------------------- */

  function mine() {
    return cab && cab.mine && typeof cab.mine.get === 'function' ? cab.mine : null;
  }

  function loadMine() {
    try {
      var m = mine();
      var saved = m && m.get(LAYOUT_KEY);
      if (saved && Array.isArray(saved.hide)) {
        st.hidden = {};
        saved.hide.forEach(function (k) {
          if (SECTIONS.some(function (s) { return s[0] === k; })) st.hidden[k] = true;
        });
      }
      var kept = m && m.get(KEPT_KEY);
      if (kept && typeof kept === 'object') {
        st.kept = { done: String(kept.done || ''), asked: kept.asked && typeof kept.asked === 'object' ? kept.asked : {} };
      }
    } catch (e) { /* the defaults stand */ }
  }

  function saveLayout() {
    try {
      var m = mine();
      if (!m || typeof m.set !== 'function') return;
      var p = Object.keys(st.hidden).length ? m.set(LAYOUT_KEY, { hide: Object.keys(st.hidden) })
                                             : (typeof m.remove === 'function' ? m.remove(LAYOUT_KEY) : m.set(LAYOUT_KEY, { hide: [] }));
      if (p && typeof p.catch === 'function') {
        p.catch(function () { toast('Your layout could not be saved. It holds until you leave this page.'); });
      }
    } catch (e) { /* kept for this visit only */ }
  }

  /* ---- presses ------------------------------------------------------------------------ */

  function closeMenu(refocusButton) {
    if (!st.menu) return;
    var which = st.menu;
    st.menu = '';
    paintStatus();
    if (refocusButton) {
      var b = statusEl.querySelector('[data-menu="' + which + '"]');
      if (b) b.focus();
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    var inMenu = e.target && e.target.closest && e.target.closest('#menu');
    if (st.menu && !inMenu && !(el && el.getAttribute('data-act') === 'menu')) closeMenu(false);
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'menu') {
      var which = el.getAttribute('data-menu');
      st.menu = st.menu === which ? '' : which;
      paintStatus();
      var first = document.querySelector('#menu .row');
      if (first) first.focus();
    } else if (act === 'idea') {
      var q = IDEAS[+el.getAttribute('data-i')];
      closeMenu(true);
      ask(q);
    } else if (act === 'layout-reset') {
      st.hidden = {};
      saveLayout();
      paint();
      var firstBox = document.querySelector('#menu input');
      if (firstBox) firstBox.focus();
    } else if (act === 'ask') {
      ask(el.getAttribute('data-q'));
    } else if (act === 'nudge') {
      ask(nudgeAsk(st.current.list.filter(function (it) { return overdue(it) && it.item && it.opened; })));
    } else if (act === 'rules') {
      ask(RULES_ASK);
    } else if (act === 'run') {
      runNow();
    } else if (act === 'connect') {
      connect('');
    } else if (act === 'channels') {
      connect('choose-chats');
    } else if (act === 'fold') {
      view.doneOpen = !view.doneOpen;
      draw();
      refocus('fold');
    } else if (st.reading && act === 'gift-do' && st.reading.gift) {
      ask(giftParts(st.reading.gift).ask);
      st.giftAsked = st.reading.gift.at;
      if (!showReading()) keep(st.reading.gift.at);
      st.readHtml = '';
      paintReading();
    } else if (st.reading && act === 'gift-skip') {
      keep('all:' + st.reading.startedAt);
      paintReading();
    } else if (st.reading && act === 'offer-do') {
      var key = el.getAttribute('data-key');
      var o = st.reading.offers.filter(function (x) { return offerKey(x) === key; })[0];
      if (!o) return;
      ask(offerParts(o).ask);
      st.kept.asked[key] = true;
      keep(st.kept.done);
      st.readHtml = '';
      paintReading();
    }
  });

  document.addEventListener('change', function (e) {
    var box = e.target;
    if (!box || !box.getAttribute) return;
    if (box.id === 'pick') {
      var c = st.current;
      /* The newest pass is "whatever is newest", so a new pass replaces it on screen;
         an older one picked by hand stays put. */
      st.picked = box.value === c.files[0] ? '' : box.value;
      show(box.value, c.files).then(function () { refocus('pick'); });
    } else if (box.id === 'show') {
      view.show = box.value;
      draw();
      refocus('show');
    } else if (box.id === 'owner') {
      view.owner = box.value;
      draw();
      refocus('owner');
    } else if (box.getAttribute('data-sec')) {
      var key = box.getAttribute('data-sec');
      if (box.checked) delete st.hidden[key];
      else st.hidden[key] = true;
      saveLayout();
      paint();
      var again = document.querySelector('#menu input[data-sec="' + key + '"]');
      if (again) again.focus();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && st.menu) closeMenu(true);
  });

  askBox.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = askInput.value;
    if (!q.trim()) { askNote.textContent = 'Type a question first.'; return; }
    askNote.textContent = 'Asking...';
    ask(q, function () {
      askInput.value = '';
      askNote.textContent = 'Asked. The answer is coming in the chat beside this page.';
    }, function (text) {
      askNote.textContent = text;
    });
  });

  /* ---- start ------------------------------------------------------------------------- */

  paintStatus();
  if (cab && cab.ready) {
    Promise.resolve(cab.ready).then(function () { loadMine(); paint(); }, function () {});
  }
  if (V2) {
    Promise.resolve(cab.here()).then(function (here) {
      st.here = here || null;
    }, function () {
      st.here = null;
    }).then(function () {
      st.hereKnown = true;
      paint();
      catchUp();
    });
    [DIR, PATTERNS].forEach(function (dir) {
      try { cab.files.onChange(dir, loadSoon); } catch (e) { /* an older bridge */ }
    });
    cab.connectors.list().then(setSlack, function () {
      /* Not here: no panel, the board still shows. */
      st.slackKnown = true;
      paint();
    });
    try { cab.connectors.onChange(setSlack); } catch (e) { /* an older bridge */ }
    cab.jobs.list().then(setJobs, function () {});
    try { cab.jobs.onChange(setJobs); } catch (e) { /* an older bridge */ }
  }
  load();
  readReading();
  readSchedule();
})();
</script>
</body>
</html>
