id: weekly-patterns
name: Weekly Patterns
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: triage-desk
agentSlug: triage-desk
timeout: 900
prompt: |-
  Look back at this week's requests and say which kinds keep coming back.

  Your working directory is the cabinet root. Each week's look back lives in `patterns/`,
  one file per week, named `<YYYY-MM-DD>-patterns.md` with today's local date. You only ever
  ADD a file: never overwrite, rename or delete one already sitting there. If today's file
  already exists, STOP HERE, write nothing and report "This week is already written."

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, what counts as a kind and how to measure the wait. This prompt does not repeat
     them.
  2. Read the frontmatter of `desk-rules.md` for `claimed` and `channels`. Use the default
     for anything missing or unreadable.
  3. Read every dated file in `triage/` from Monday of this week up to now. Ignore any file
     whose name starts with `EXAMPLE-`. Collect each request once, by its URL, with its
     `Opened` time, and the first pass that showed an owner for it. Keep only requests
     opened this week.
  4. With your Slack tools, open the thread of each request that got an owner, to find the
     time of a reply where someone said they would take it. Read only channels you are
     allowed to read, and never a direct or group message.
  5. If you have no Slack tool, or Slack is not connected, or the call fails, STOP HERE.
     Write nothing. Report: "Slack is not reachable. I would have looked back at this
     week's requests and found the ones that repeat." Then exit.
  6. Group the requests into kinds and write `patterns/<today>-patterns.md`. A week with no
     kind that came in twice is a real answer: write the file with an empty table and say
     so in the headline.
  7. This run is read only. Do not post, reply in a thread, react, or mark anything read.
     Never touch the board in `triage/` or the records in `nudges/`.
  8. On the first run that does reach Slack, after writing your file, delete every file
     whose name starts with `EXAMPLE-` in `patterns/`. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
createdAt: '2026-10-29T00:00:00.000Z'
updatedAt: '2026-10-29T00:00:00.000Z'
