id: support-triage
name: Support Triage
enabled: true
schedule: 0 9,13,17 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: triage-desk
agentSlug: triage-desk
timeout: 600
prompt: |-
  Bring the triage board up to date.

  Your working directory is the cabinet root. Every pass lives in `triage/`, one file per
  run, named `<YYYY-MM-DD>T<HH-MM-SS>-triage.md`, the local time you ran and then that exact
  postfix. The page reads the folder, sorts by the name and opens the newest, so a name in
  any other shape is a pass nobody will see. You only ever ADD a file: never overwrite,
  rename or delete one already sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the closed vocabularies, who counts as an owner and what counts as done. This
     prompt does not repeat them.
  2. Read the frontmatter of `desk-rules.md`: the `claimed` and `done` emoji,
     `nudgeAfterHours` and `channels`. Use the default for anything missing or unreadable.
  3. Read the newest file already in `triage/` and carry its board forward. This file is the
     whole board, not what arrived since. Keep every unfinished item with its `Opened` value
     unchanged, move the ones the channel moved, and drop only what has been Done for a full
     day.
  4. With your Slack tools, read the channels you are allowed to read since the `generated`
     time of the newest dated file, thread replies included, so Monday morning picks up
     everything since Friday. If there is no dated file yet, read the last 3 days. If
     `channels` names some, read only those. Read a private channel only if the person added
     it on Cabinet's channel screen. Skip direct and group messages entirely.
  5. For every row that is not Done, new or carried, fetch the reactions on the message that
     raised it. A `done` emoji makes it Done. A `claimed` emoji makes the first person who
     added it the owner, so a New row becomes Owned. Then check its thread for an owner or a
     finish said in words. Fill `Opened` from the raising message's own timestamp.
  6. This run is read only, and it assigns nothing. Do not post, reply in a thread, react,
     or mark anything read.
  7. If you have no Slack tool, or Slack is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `triage/` exactly as you found it, example and all. Report:
     "Slack is not reachable. I would have read the channels you allowed since the last pass
     and brought the board up to date." Then exit.
  8. On the first run that does reach Slack, write your dated file and then delete every
     file whose name starts with `EXAMPLE-` in `triage/` and in `patterns/`. They are a
     demo, not past work, and they must not sit in the lists beside real ones. Do not merge
     with them, do not rename them, and never write `EXAMPLE` into a name of your own.
