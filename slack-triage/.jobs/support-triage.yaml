id: support-triage
name: Support Triage
enabled: true
schedule: 0 9,13,17 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: triage-desk
agentSlug: triage-desk
timeout: 600
prompt: |-
  Bring the triage board up to date.

  Your working directory is the cabinet root. Every pass lives in `triage/`, one file per
  run, named `<YYYY-MM-DD>T<HH-MM-SS>-triage.md`, the local time you ran and then that exact
  postfix. The page reads the folder, sorts by the name and opens the newest, so a name in
  any other shape is a pass nobody will see. You only ever ADD a file: never overwrite,
  rename or delete one already sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the closed vocabularies and the tone. This prompt does not repeat them.
  2. Read the newest file already in `triage/` and carry its board forward. This file is the
     whole board, not what arrived since. Keep every unfinished item, move the ones the
     channel moved, and drop only what has been Done for a full day.
  3. With your Slack tools, read the channels you are allowed to read since the last pass,
     thread replies included. Skip direct messages and private channels entirely.
  4. This run is read only, and it assigns nothing. An owner goes in a row only when that
     person said in the channel that they would take it. Do not post, reply in a thread,
     react, or mark anything read.
  5. If you have no Slack tool, or Slack is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `triage/` exactly as you found it, example and all. Report:
     "Slack is not reachable. I would have read the channels you allowed since the last pass
     and brought the board up to date." Then exit.
  6. On the first run that does reach Slack, write your dated file and then delete
     `triage/EXAMPLE-triage.md`. It is a demo, not a past pass, and it must not sit in the
     list beside real ones. Do not merge with it, do not rename it, and never write
     `EXAMPLE` into a name of your own.
