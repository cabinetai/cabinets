id: morning-briefing
name: Morning Briefing
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: mail-reader
agentSlug: mail-reader
timeout: 600
prompt: |-
  Write this morning's briefing.

  Your working directory is the cabinet root. Every briefing lives in
  `daily-briefings/`, one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-morning-mail.md`
  — the local time you ran, then that exact postfix. The page reads the folder, sorts
  by name and opens the newest, so a name in any other shape is a briefing nobody will
  see. You only ever ADD a file: never overwrite, rename or delete one already sitting
  there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the three urgency words, the calm-day rule and the tone. This prompt does
     not repeat them.
  2. Read the last 24 hours of the user's inbox through the Gmail connector
     (`mcp__claude_ai_Gmail__*` tools). Inbox only — skip spam and promotions.
  3. If you have no Gmail tool, STOP HERE: Gmail is not connected. Write nothing, leave
     `daily-briefings/` exactly as you found it, example and all, and report: "I can't
     reach Gmail — it isn't connected yet. Open Cabinet's integrations screen and
     connect Gmail, then run this again." Then exit.
  4. Same if the call fails or comes back unauthorized: say what you tried and what it
     said, touch no file, exit. Never fall back to the example's contents, an earlier
     day's file, or what a normal inbox would probably hold — a briefing you didn't
     read the mail for is worse than none.
  5. On the first run that does reach Gmail, write your dated file and then delete
     `daily-briefings/EXAMPLE-morning-mail.md`. It is a demo, not a morning that
     happened, and it must not sit in the date list beside real ones. Never write
     `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: how many messages arrived, how many need
  the user, and the lead if there is one.
