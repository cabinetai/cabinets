id: morning-shoot-brief
name: Morning shoot brief
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: shoot-planner
agentSlug: shoot-planner
timeout: 900
prompt: |-
  Update the Shoot week page from the person's Google Calendar (and their Gmail, when it is
  connected too).

  Your working directory is the cabinet root. Your persona holds the rules: how to reach the
  calendar and Gmail, the kinds, the places, the deals, and the shape of latest.json.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, run `ls shoot-week/data`
     (from the cabinet root, never `cd`) and read `shoot-week/data/latest.json` if it is there.
  2. If no Connections line says Google Calendar is connected, write only `status` (one plain
     sentence) and `checkedAt` into `shoot-week/data/latest.json`, keeping everything else,
     and stop.
  3. If `shoot-week/data/profile.json` is not there, this is the first read: follow "The first
     read" in your persona. Run `node shoot-week/first-sort.mjs start` in your first Bash call,
     read the coming days first and give the gift right after, push one line per call with
     every number counted from the saved files, write the profile with `profile`, then
     `latest @latest.json`, then `done`.
     Otherwise read the calendar from midnight today to midnight 30 days ahead into
     `shoot-week/data/.work/events.json`, and, with Gmail connected, the brand deal emails
     of the last 30 days.
  4. Write `shoot-week/data/latest.json` (on the first read through the helper; otherwise in
     one Bash call, and check it parses), then delete `shoot-week/data/.work/`.

  Only read: never create, move, change or answer an event, and never send, draft or change
  an email.

  Finish in one or two plain sentences: what goes live this week, the next shoot, and a
  clash if there is one.
createdAt: '2026-10-12T00:00:00.000Z'
updatedAt: '2026-10-12T00:00:00.000Z'
