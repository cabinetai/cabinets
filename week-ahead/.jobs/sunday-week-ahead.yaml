id: sunday-week-ahead
name: Sunday Week Ahead
enabled: true
schedule: 0 17 * * 0
provider: claude-code
adapterType: claude_local
ownerAgent: week-planner
agentSlug: week-planner
timeout: 600
prompt: |-
  Lay out the coming week.

  Your working directory is the cabinet root. Every plan lives in `week-plans/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-week-ahead.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by name and opens
  the newest, so a name in any other shape is a week nobody will see. You only ever
  ADD a file: never overwrite, rename or delete one already sitting there.

  1. Read your persona before anything else. It holds the frontmatter shape, the two
     bullet sections, the table columns and the judgement rules. This prompt does not
     repeat them.
  2. Read Monday through Sunday of the coming week through the Google Calendar
     connector (`mcp__claude_ai_Google_Calendar__*` tools), every calendar the
     account shows. Read only — you create, move, accept and decline nothing.
  3. If you have no calendar tool, STOP HERE: Google Calendar is not connected.
     Write nothing, leave `week-plans/` exactly as you found it, example and all,
     and report: "I can't reach Google Calendar — it isn't connected yet. Open
     Cabinet's integrations screen and connect Google Calendar, then run this
     again." Then exit.
  4. Same if the call fails or comes back unauthorized: say what you tried and what
     it said, touch no file, exit. Never fall back to the example's contents or to
     what a typical week probably holds.
  5. On the first run that does reach the calendar, write your dated file and then
     delete `week-plans/EXAMPLE-week-ahead.md`. It is a demo, not a week that
     happened, and it must not sit in the picker beside real ones. Never write
     `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: how many commitments the week holds,
  the biggest one, and anything you flagged under Watch out.
