id: morning-day-brief
name: Morning Day Brief
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: day-briefer
agentSlug: day-briefer
timeout: 600
prompt: |-
  Write this morning's day brief.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-microsoft-365-summary.md` — the local
  time you ran, then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You only
  ever ADD a file: never overwrite, rename or delete one already sitting there, including
  one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Kind` vocabulary, the row order and the tone. This prompt does not
     repeat them.
  2. With your Microsoft 365 tools, gather today from all four places: today's calendar
     events, Outlook mail since yesterday, Teams messages since yesterday, and files
     changed in SharePoint or OneDrive since yesterday. Skip declined events and Junk.
  3. This run is read only. Do not send mail, reply, create or move a calendar event, or
     post to Teams, however obvious the one-line answer looks.
  4. If you have no Microsoft 365 tool, or the account is not connected, or the call
     fails, STOP HERE. Write nothing. Leave `daily-summaries/` exactly as you found it,
     example and all. Report: "Microsoft 365 is not reachable. I would have read today's
     calendar, Outlook, Teams and recently changed files, and written one row per thing."
     Then exit.
  5. On the first run that does reach Microsoft 365, write your dated file and then delete
     `daily-summaries/EXAMPLE-microsoft-365-summary.md`. It is a demo, not a past summary,
     and it must not sit in the date list beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
