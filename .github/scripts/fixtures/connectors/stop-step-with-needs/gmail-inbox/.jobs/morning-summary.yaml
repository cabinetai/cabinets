id: morning-summary
name: Morning Summary
enabled: true
schedule: 0 7 * * *
ownerAgent: summarizer
agentSlug: summarizer
prompt: |-
  Write this morning's summary into `summaries/`.

  1. Read the last 24 hours of mail with the `mcp__claude_ai_Gmail__*` tools.
  2. If you have no way in, STOP HERE: Gmail is not connected. Report: "Open Cabinet's
     integrations screen and connect Gmail, then run this again." Then exit.
