name: Build manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manifest.json'
      - 'details/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'RELEASE-INDEX.md'
      - 'RELEASE-WORKFLOW.md'
      - 'ECOSYSTEM-ARCHITECTURE.md'
      - 'COVER-IMAGE-GENERATION.md'
      - 'COMPLETE-SETUP-SUMMARY.md'
      - 'MOM-BABY-CABINET-SERIES.md'
      - 'TODO.local.md'
      - 'STYLE-GUIDE/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.gitignore'
      - 'covers-backup/**'
      - 'CABINET-TOP-100-X.csv'
      - 'CABINET-PERSONAS.csv'
      - 'QUICK-START-IMAGE-GENERATION.md'
  # Pull requests only validate: connector declarations, prompts and the
  # builder's own tests. Nothing is written or committed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: build-manifest-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install manifest deps
        working-directory: .github/scripts
        # The check needs no browser; puppeteer is for local cover tooling.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Test the manifest builder
        working-directory: .github/scripts
        run: npm test

      - name: Check cabinet declarations
        run: node .github/scripts/build-manifest.mjs --check

  manifest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-manifest
      cancel-in-progress: false
    steps:
      # Push via a deploy key: main is PR-only by ruleset, and the DeployKey
      # bypass is the sanctioned path for this bot's manifest commit-back.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.MANIFEST_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install manifest deps
        working-directory: .github/scripts
        run: npm ci

      - name: Build manifest.json
        run: node .github/scripts/build-manifest.mjs

      - name: Commit manifest and details if changed
        run: |
          # Stage first: the detail files for a brand new cabinet are untracked,
          # and a plain `git diff` does not see those.
          git add -A manifest.json details
          if git diff --cached --quiet; then
            echo "manifest and details unchanged"
            exit 0
          fi
          git config user.name "cabinet-bot"
          git config user.email "bot@runcabinet.com"
          git commit -m "chore: rebuild manifest.json and details [skip ci]"
          git push
