id: morning-pipeline-digest
name: Morning Pipeline Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: pipeline-reader
agentSlug: pipeline-reader
timeout: 900
prompt: |-
  Catch up on my Salesforce pipeline since the last catch-up and update the Your pipeline page.
  Follow the Morning catch-up steps in your instructions. This run only reads Salesforce: it
  never adds, changes or deletes anything there. When you are done, tell me in one or two
  sentences what moved since yesterday and what needs me today.
createdAt: '2026-10-15T00:00:00.000Z'
updatedAt: '2026-10-15T00:00:00.000Z'
