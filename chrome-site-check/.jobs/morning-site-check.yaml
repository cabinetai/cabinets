id: morning-site-check
name: Morning Site Check
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: page-checker
agentSlug: page-checker
timeout: 900
prompt: |-
  Check this morning whether the user's pages still load properly.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-site-check.md` — the local time you ran,
  then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the five status words, the frontmatter
     shape, the table columns, the ordering and the tone. This prompt does not repeat them.
  2. Read `pages.md`. That file is the list. Check exactly the pages it lists, in the order
     it lists them, up to twelve. An address that is not in that file is not a page you open
     — no crawling the site, no following links, no guessing at pages the user left out.
  3. If `pages.md` still lists only its two `example.com` placeholder lines, the user has not
     set this up yet. STOP HERE. Write nothing. Leave `daily-summaries/` exactly as you found
     it, example and all. Report: "No pages are listed yet. I would have opened each page in
     `pages.md` in Chrome, watched it load, and written one row per page saying whether it is
     broken, slow or fine." Then exit.
  4. With your Chrome tools, open each listed address in turn. Wait for it to finish loading,
     then read the console errors and the failed network requests, and note how long the load
     took. Read far enough to name the problem in plain words, no further.
  5. This run only looks. Do not click a button, fill in a form, submit anything, sign in,
     type a password or download a file — however obvious the next step looks, and however
     harmless the button seems. A page that demands a sign-in is `Unclear`, not a page to log
     into.
  6. If you have no Chrome tool, or Chrome is not connected, or the browser will not start,
     STOP HERE. Write nothing. Leave `daily-summaries/` exactly as you found it, example and
     all. Report: "Chrome is not reachable. I would have opened each page listed in
     `pages.md`, watched it load, and written one row per page saying whether it is broken,
     slow or fine." Then exit.
  7. On the first run that does check real pages, write your dated file and then delete
     `daily-summaries/EXAMPLE-site-check.md`. It is a demo, not a past check, and it must not
     sit in the date list beside real ones. Do not merge with it, do not rename it, and never
     write `EXAMPLE` into a name of your own.
