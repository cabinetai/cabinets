id: morning-stand-up
name: Morning stand-up
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: issue-keeper
agentSlug: issue-keeper
timeout: 900
prompt: |-
  Write this morning's stand-up and refresh the Issue desk app.

  Your working directory is the cabinet root. Your persona holds the rules: where the copy
  of Linear is, which pages to read, the shape of every file and the words to use. Follow
  its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, list
     `issue-desk/data/` and, if it is there, read `issue-desk/data/latest.json` (the last
     run's work). If it was generated today, also read today's stand-up and retain its
     recorded changes when merging new changes.
  2. Find the line from Cabinet that starts "The files under /data/" and says they are a
     view-only copy of the person's Linear workspace. If there is no such line, or the
     folder it names cannot be read, write only `issue-desk/data/status.json` with
     `ok: false` and a plain `why`, change nothing else, and stop.
  3. Read the copy as your persona's "The morning read" says: `My issues.md`, `Triage.md`,
     the current cycles in `Cycles/`, the projects in `Projects/`, and only the issue pages
     you need, frontmatter first.
  4. In one Bash call, write `standup/<YYYY-MM-DD>.md`, `issue-desk/data/latest.json`
     (and check it parses) and `issue-desk/data/status.json` with `ok: true`. Replace
     today's stand-up if one is already there, retaining earlier changes from today
     as your persona specifies. Never touch an earlier day's.
  5. On the first run that writes `latest.json`, delete
     `issue-desk/data/EXAMPLE-latest.json` and `issue-desk/data/EXAMPLE-latest.he.json`.
     They are a made-up team, not your data. Never copy anything from them.

  You only read. Never edit a page in the Linear copy, and never try to reach Linear in
  any other way: you hold no Linear key. A new issue, a comment or a move is something the
  person presses in Cabinet.

  Finish in one or two plain sentences about the work and nothing else: how many issues
  are on the person, what is due soonest, and the one stuck issue that matters most, if
  there is one.
createdAt: '2026-10-20T00:00:00.000Z'
updatedAt: '2026-10-20T00:00:00.000Z'
