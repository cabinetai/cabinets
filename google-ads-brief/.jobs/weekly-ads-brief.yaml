id: weekly-ads-brief
name: Weekly Ads Brief
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: spend-reader
agentSlug: spend-reader
timeout: 600
prompt: |-
  Write this week's Google Ads brief.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-google-ads-brief.md` — the local
  time you ran, then that exact postfix. The page reads the folder, sorts by the
  name and opens the newest, so a name in any other shape is a summary nobody will
  see. You only ever ADD a file: never overwrite, rename or delete one already
  sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns, the change vocabulary and the tone. This prompt does not repeat
     them.
  2. With your Google Ads tools, read the last seven days across every campaign in
     the account, and the seven days before that for comparison.
  3. This run is read only. Do not change a bid, budget, status or target.
  4. If you have no Google Ads tool, or it is not connected, or the call fails, STOP
     HERE. Write nothing. Leave `summaries/` exactly as you found it, example and
     all. Report: "Google Ads is not reachable. I would have read the last seven
     days across every campaign and written one row per campaign." Then exit.
  5. On the first run that does reach Google Ads, write your dated file and then
     delete `summaries/EXAMPLE-google-ads-brief.md`. Never write `EXAMPLE` into a
     name of your own.
