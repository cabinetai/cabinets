id: morning-jira-tasks
name: Morning Jira Tasks
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: ticket-reader
agentSlug: ticket-reader
timeout: 600
prompt: |-
  Write this morning's list of the tickets on the user.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-jira-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds what is in scope, the frontmatter
     shape, the table columns, how Jira's own statuses and priorities map onto the closed
     vocabularies, the ordering and the tone. This prompt does not repeat them.
  2. With your Jira tools, search for issues assigned to the user across every project they
     can see, and for any issue of theirs that blocks another open issue. Read each one's
     status category, priority, links and latest comment — far enough to judge it, no
     further.
  3. This run is read only. Do not create an issue, update or transition one, add a
     comment, or touch anything in bulk, however obvious the next step looks.
  4. If you have no Jira tool, or Jira is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `daily-summaries/` exactly as you found it, example and all.
     Report: "Jira is not reachable. I would have read the issues assigned to the user and
     the ones they are blocking, and written one row per ticket." Then exit.
  5. On the first run that does reach Jira, write your dated file and then delete
     `daily-summaries/EXAMPLE-jira-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
