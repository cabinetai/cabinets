id: monday-drive-brief
name: Monday Drive Brief
enabled: true
schedule: 0 8 * * 1
provider: codex-cli
adapterType: claude_local
ownerAgent: week-watcher
agentSlug: week-watcher
timeout: 900
prompt: |-
  Write this week's page about the shared Drive folder.

  Your working directory is the cabinet root. Every page lives in `weekly/`, one file per
  run, named `<YYYY-MM-DD>-drive-week.md`, where the date is the Monday you ran. You only
  ever ADD a file: never overwrite, rename or delete one already sitting there.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the Change vocabulary and the tone. This prompt does not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out. If more than one Drive folder is here, cover them all in
     one page and name each in the Where column.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `weekly/` exactly as you found it, example and all, and report: "There is no Google
     Drive folder in this cabinet yet. Connect Google Drive from Integrations and pick
     the shared folder, then run this again." Then exit.
  4. Read the folder's modified dates, top to bottom, and keep everything whose modified
     time falls inside the last seven days. Read the newest earlier page in `weekly/`
     first, so you can tell what has gone away since.
  5. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. A page you could not read the folder for is
     worse than no page. Never fall back to the example's contents, to an earlier week,
     or to what a normal week would look like.
  6. On the first run that does read a folder, write your dated file and then delete
     `weekly/EXAMPLE-drive-week.md`. It is a demo, not a past week, and it must not sit
     in the list beside real ones. Do not merge with it, do not rename it, and never
     write EXAMPLE into a name of your own.
  7. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder, however tempting the tidy-up looks. Write only inside `weekly/`.
cabinetPath: google-drive-team-drive
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
