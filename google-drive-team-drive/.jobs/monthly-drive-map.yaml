id: monthly-drive-map
name: Monthly Drive Map
enabled: true
schedule: 0 6 1 * *
provider: codex-cli
adapterType: claude_local
ownerAgent: drive-librarian
agentSlug: drive-librarian
timeout: 1800
prompt: |-
  Redraw the map of the shared Drive folder.

  Your working directory is the cabinet root. The map is one file, `where-things-are.md`,
  and you rewrite it in place. It describes the folder as it is right now, so there is no
  history and no second copy: overwrite it, and never write a dated version beside it.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the rules for picking the current version and the tone. This prompt does
     not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out. If more than one Drive folder is here, map them all in one
     page, one section per folder.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `where-things-are.md` exactly as you found it, example and all, and report: "There
     is no Google Drive folder in this cabinet yet. Connect Google Drive from Integrations
     and pick the shared folder, then run this again." Then exit.
  4. Walk the folder. Open files only as far as you need to say what a folder holds: a
     name and a date are often enough, and on a big folder they have to be. Go at most
     three levels deep, and for a folder with more than fifty files describe the pile
     rather than the files.
  5. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. Never fall back to the example's contents
     or to what a normal shared drive would look like.
  6. On the first run that does read a folder, replace the whole of
     `where-things-are.md`, example banner and all. Never leave a made-up row sitting in
     a real map.
  7. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder, however obviously it needs tidying. What you would tidy goes under
     "Watch out for". Write only `where-things-are.md`.
cabinetPath: google-drive-team-drive
createdAt: '2026-09-16T00:00:00.000Z'
updatedAt: '2026-09-16T00:00:00.000Z'
