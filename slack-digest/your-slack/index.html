    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return b.id !== id; });
    if (el) el.classList.add("leaving");
    setTimeout(function () {
      if (el) el.classList.remove("leaving");
      changeLayout(next);
      toast(BOXES[id].title + " removed. Undo brings it back.");
    }, 200);
  }
  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {
    var spots = placed(source);
    for (var y = 0; ; y++) {
      for (var x = 0; x + w <= COLS; x++) {
        var hit = spots.some(function (o) { return x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h; });
        if (!hit) return { x: x, y: y };
      }
    }
  }
  function addBox(id) {
    var box = BOXES[id];
    var w = Math.min(box.w, COLS);
    var at = freeSpot(w, box.h);
    changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).concat({ id: id, x: at.x, y: at.y, w: w, h: box.h }));
    closeDrawer();
    var el = boxEls[id];
    if (el && el.isConnected) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    toast(box.title + " added.");
  }
  function resetLayout() {
    changeLayout(copyLayout(DEFAULT_LAYOUT));
    toast("Back to the default layout. Undo brings yours back.");
  }
  function undoLayout() {
    if (!state.undo.length) return;
    var before = snapshot();
    state.layout = state.undo.pop();
    saveLayout();
    paintGrid();
    glide(before);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  // ── Asking the agent to change the page ────────────────────────────────
  // The agent cannot reach a person's layout (it lives in cabinet.mine), so it writes what
  // to add and remove into data/layout-change.json. The page shows that with Apply and
  // No thanks, and remembers in cabinet.mine which change it last showed.

  var CHANGE_SEEN_KEY = "slack-digest-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {
    var menu = $("layout-menu");
    var r = button.getBoundingClientRect();
    state.menuOpen = true;
    menu.hidden = false;
    menu.style.top = r.bottom + 6 + "px";
    menu.style.left = Math.max(16, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 16)) + "px";
    button.setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();
  }
  function closeMenu() {
    if (!state.menuOpen) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) { button.setAttribute("aria-expanded", "false"); button.focus(); }
  }

  /** The words sent with a layout request: the boxes on the page now and who is asking. */
  function layoutWords(wish) {
    var on = placed().map(function (spot) { return BOXES[spot.id].title; });
    var me = cabName();
    return "Change the boxes on my Your Slack page." + (me ? " I am " + me + "." : "") +
      " On it now: " + (on.length ? on.join(", ") : "no boxes") + ". What I want: " + wish;
  }
  function cabName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    // Without a cloud sign-in Cabinet says "You": that is no name, so the greeting leaves it out.
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    return /^you$/i.test(name) ? "" : name;
  }
  /** The Ask box takes the request when it is on the page; otherwise the chat's own box does. */
  function askAboutLayout() {
    var el = boxEls.ask;
    if (onPage("ask") && el && el.isConnected) {
      state.layoutAsk = true;
      setAskNote("");
      drawBox(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if ($("ask-input")) $("ask-input").focus({ preventScroll: true });
      return;
    }
    cab.ask(layoutWords(""), { agent: AGENT, send: false }).then(function () {
      toast("Finish the sentence in the chat. The agent's suggestion shows up on this page.");
    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });
  }
  function sendLayoutAsk(wish) {
    var words = text(wish, 600);
    if (!words) return;
    setAskNote("Sending...");
    cab.ask(layoutWords(words), { agent: AGENT, send: true }).then(function () {
      state.layoutAsk = false;
      if ($("ask-input")) $("ask-input").value = "";
      setAskNote("Sent. The agent's suggestion shows up at the top of this page.");
      if (boxEls.ask) drawBox(boxEls.ask);
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
    });
  }
  function stopLayoutAsk() {
    state.layoutAsk = false;
    setAskNote("");
    if (boxEls.ask) drawBox(boxEls.ask);
  }

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    function ids(list) {
      return Array.isArray(list) ? list.filter(function (id, i) { return typeof id === "string" && BOXES[id] && list.indexOf(id) === i; }) : [];
    }
    return { at: d.at, for: text(d.for, 80), add: ids(d.add), remove: ids(d.remove), note: text(d.note, 300) };
  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {
    var c = state.change;
    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = cabName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });
    if (!add.length && !remove.length && !c.note) return null;
    return { at: c.at, add: add, remove: remove, note: c.note };
  }
  // A number box shares its title with a list ("Waiting on you"), so it says it is the number.
  function titles(ids) {
    return ids.map(function (id) { return BOXES[id].title + (BOXES[id].group === "numbers" ? " (number)" : ""); }).join(", ");
  }
  function paintSuggest() {
    var el = $("suggest");
    if (state.changeApplied) {
      el.hidden = false;
      el.innerHTML = "<p><b>Your page changed.</b></p>" +
        '<div class="suggest-actions"><button type="button" class="btn" data-act="change-undo">Undo</button>' +
        '<button type="button" class="btn" data-act="change-ok">OK</button></div>';
      return;
    }
    var c = state.loaded ? pendingChange() : null;
    el.hidden = !c;
    if (!c) { el.innerHTML = ""; return; }
    var parts = [];
    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");
    el.innerHTML = "<p>" + (parts.length ? "<b>The agent suggests:</b> " + esc(parts.join(", and ")) + "." : "<b>From the agent:</b>") +
      (why ? '<span class="why" dir="auto">' + esc(why) + "</span>" : "") + "</p>" +
      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">Apply</button>' +
          '<button type="button" class="btn" data-act="change-skip">No thanks</button>'
        : '<button type="button" class="btn" data-act="change-skip">OK</button>') + "</div>";
  }
  function markChangeSeen(at) {
    state.changeSeen = at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(CHANGE_SEEN_KEY, at).catch(function () {});
  }
  function applyChange() {
    var c = pendingChange();
    if (!c) return;
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return c.remove.indexOf(b.id) < 0; });
    c.add.forEach(function (id) {
      var box = BOXES[id];
      var w = Math.min(box.w, COLS);
      var at = freeSpot(w, box.h, next);
      next.push({ id: id, x: at.x, y: at.y, w: w, h: box.h });
    });
    markChangeSeen(c.at);
    state.changeApplied = true;
    changeLayout(next);
    paintSuggest();
  }
  function skipChange() {
    var c = pendingChange();
    if (c) markChangeSeen(c.at);
    paintSuggest();
  }

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a
  // moment first, so the page still scrolls under a passing finger; outside edit mode the
  // hold also starts editing. While a box moves, the others make room live and an outline
  // shows where it lands. The corner handle resizes it on the grid, naming the size it
  // reaches. On a phone a box moves up and down its column; its size is a switch.

  var HOLD_MS = 600;
  var SLOP = 8;
  /** How far a mouse moves, pressed, before the box comes along: a slip of the hand is not a move. */
  var DRAG_START = 10;
  /** How far past a border (in cells) the moving box must be before the others make room. */
  var STICK = 0.8;
  var drag = null;
  var press = null;
  var hold = null;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function spotIn(spots, id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  function gridMetrics() {
    var r = $("grid").getBoundingClientRect();
    return { left: r.left, top: r.top, col: (r.width + GAP) / COLS, row: ROW + GAP };
  }
  /**
   * The page with one box put at x, y and sized w by h, every other box making room. The
   * layout is read at the rows the page shows, so a place on screen is a place in the layout.
   */
  function previewWith(id, x, y, w, h, sizing) {
    var now = placed();
    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      var s = spotIn(now, b.id);
      if (s) { b.y = s.y; b.h = s.h; }
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }
      return b;
    }), id, sizing);
  }
  function showSpots(spots) {
    spots.forEach(function (s) {
      var el = boxEls[s.id];
      if (!el) return;
      el.style.gridColumn = s.x + 1 + " / span " + s.w;
      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {
    var at = {};
    spots.forEach(function (s) { at[s.id] = s; });
    var before = copyLayout(state.layout || DEFAULT_LAYOUT);
    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }
    changeLayout(next, easing);
    return true;
  }
  /** Nothing changed: every box glides back to the place it already had. */
  function settleBack(easing) {
    var before = snapshot();
    letGo();
    paintGrid();
    glide(before, null, easing);
  }

  // The outline where a moving box lands, and the size a resized box has reached.
  function overlay(cls) {
    var grid = $("grid");
    var el = grid.querySelector("." + cls);
    if (!el) {
      el = document.createElement("div");
      el.className = cls;
      el.setAttribute("aria-hidden", "true");
      grid.appendChild(el);
    }
    return el;
  }
  /** Puts the outline (or the size label) on a spot; once shown, it glides from spot to spot. */
  function placeOverlay(el, s) {
    var was = el.style.gridColumn && motionOK() ? el.getBoundingClientRect() : null;
    if (was) el.getAnimations().forEach(function (a) { a.cancel(); });
    el.style.gridColumn = s.x + 1 + " / span " + s.w;
    el.style.gridRow = s.y + 1 + " / span " + s.h;
    if (was) glideFrom(el, was, false, 300, SMOOTH);
  }
  function clearOverlays() {
    Array.prototype.slice.call($("grid").querySelectorAll(".drop-spot, .size-tag")).forEach(function (el) { el.parentNode.removeChild(el); });
  }
  /** "Medium: 3 rows": what a box shows at the size it has now. */
  function sizeWords(el) {
    var id = el.getAttribute("data-box");
    var level = el.getAttribute("data-level") || "M";
    var name = LEVEL_WORDS[level];
    if (!BOXES[id].list) return name;
    if (level === "S") return name + ": the total only";
    var n = el.querySelectorAll(".rows > li:not([hidden])").length;
    return n ? name + ": " + n + " " + plural(n, "row", "rows") : name;
  }

  function beginDrag(kind, el, x, y, touch) {
    var id = el.getAttribute("data-box");
    var r = el.getBoundingClientRect();
    var spot = spotIn(placed(), id);
    if (!spot) return;
    drag = { kind: kind, id: id, el: el, touch: !!touch, x: x, y: y, x0: x, y0: y, scroll0: window.scrollY, spots: null };
    if (kind === "stack") {
      var boxes = Array.prototype.filter.call($("grid").children, function (c) { return c.hasAttribute("data-box"); });
      drag.boxes = boxes;
      drag.from = boxes.indexOf(el);
      drag.to = drag.from;
      drag.gap = parseFloat(getComputedStyle($("grid")).rowGap) || GAP;
      drag.step = r.height + drag.gap;
      drag.mids = boxes.map(function (b) { var br = b.getBoundingClientRect(); return br.top + window.scrollY + br.height / 2; });
    } else if (kind === "move") {
      drag.w = spot.w;
      drag.h = spot.h;
      drag.grabX = x - r.left;
      drag.grabY = y - r.top;
    } else {
      drag.sx = spot.x;
      drag.sy = spot.y;
      drag.pw0 = r.width;
      drag.ph0 = r.height;
    }
    // Whatever was still animating this box lets go of it, or it would hold the box still
    // while the hand moves.
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.classList.add(kind === "size" ? "sizing" : "lifted");
    $("grid").classList.add("arranging");
    document.body.classList.add(kind === "size" ? "is-sizing" : "is-moving");
    if (touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* not allowed here */ } }
    moveDrag(x, y);
    drag.raf = requestAnimationFrame(edgeScroll);
  }

  function moveDrag(x, y) {
    drag.x = x;
    drag.y = y;
    if (drag.kind === "stack") moveInColumn();
    else if (drag.kind === "move") moveOnGrid();
    else resizeOnGrid();
  }

  function moveOnGrid() {
    var m = gridMetrics();
    var left = drag.x - drag.grabX;
    var top = drag.y - drag.grabY;
    // The spot only changes once the box is well past a border (four fifths of a cell),
    // so a hand resting near the line does not flip it back and forth.
    var fx = (left - m.left) / m.col;
    var fy = (top - m.top) / m.row;
    var tx = drag.spots && Math.abs(fx - drag.tx) < STICK ? drag.tx : clamp(Math.round(fx), 0, COLS - drag.w);
    var ty = drag.spots && Math.abs(fy - drag.ty) < STICK ? drag.ty : Math.max(0, Math.round(fy));
    if (!drag.spots || drag.tx !== tx || drag.ty !== ty) {
      drag.tx = tx;
      drag.ty = ty;
      var before = snapshot(drag.el);
      drag.spots = previewWith(drag.id, tx, ty, drag.w, drag.h);
      showSpots(drag.spots);
      glide(before, drag.el, SMOOTH);
      placeOverlay(overlay("drop-spot"), spotIn(drag.spots, drag.id));
    }
    drag.el.style.transform = "translate(" + (left - (m.left + tx * m.col)) + "px," + (top - (m.top + ty * m.row)) + "px)";
  }

  // The box follows the hand pixel by pixel; the outline shows the grid size it will take,
  // the neighbours make room for that size, and letting go glides the box into it.
  function resizeOnGrid() {
    var m = gridMetrics();
    var min = minSize(drag.id);
    var dy = drag.y - drag.y0 + (window.scrollY - drag.scroll0);
    var pw = clamp(drag.pw0 + drag.x - drag.x0, min.w * m.col - GAP, (COLS - drag.sx) * m.col - GAP);
    var ph = clamp(drag.ph0 + dy, min.h * m.row - GAP, 40 * m.row - GAP);
    drag.el.style.width = pw + "px";
    drag.el.style.height = ph + "px";
    var fw = (pw + GAP) / m.col;
    var fh = (ph + GAP) / m.row;
    var w = drag.spots && Math.abs(fw - drag.w) < STICK ? drag.w : clamp(Math.round(fw), min.w, COLS - drag.sx);
    var h = drag.spots && Math.abs(fh - drag.h) < STICK ? drag.h : clamp(Math.round(fh), min.h, 40);
    if (drag.spots && drag.w === w && drag.h === h) return;
    drag.w = w;
    drag.h = h;
    var before = snapshot(drag.el);
    drag.spots = previewWith(drag.id, drag.sx, drag.sy, w, h, true);
    showSpots(drag.spots);
    glide(before, drag.el, SMOOTH);
    var spot = spotIn(drag.spots, drag.id);
    placeOverlay(overlay("drop-spot"), spot);
    placeOverlay(overlay("size-tag"), spot);
  }
  /** The label names what the box shows at the size it has under the hand. */
  function sizeTag(el) {
    var tag = drag && drag.kind === "size" && drag.el === el ? $("grid").querySelector(".size-tag") : null;
    if (tag) tag.textContent = sizeWords(el);
  }

  function moveInColumn() {
    var dy = drag.y - drag.y0 + (window.scrollY - drag.scroll0);
    drag.el.style.transform = "translateY(" + dy + "px) scale(1.02)";
    // The edge leading the move passes a box once it crosses that box's middle, so a tall
    // box does not have to travel its own height before the others make room.
    var top = drag.mids[drag.from] - (drag.step - drag.gap) / 2 + dy;
    var bottom = top + drag.step - drag.gap;
    var to = drag.from;
    drag.mids.forEach(function (mid, i) {
      if (i > drag.from && bottom > mid + 24) to++;
      if (i < drag.from && top < mid - 24) to--;
    });
    drag.to = to;
    drag.boxes.forEach(function (b, i) {
      if (b === drag.el) return;
      var shift = drag.from < to && i > drag.from && i <= to ? -drag.step : drag.from > to && i >= to && i < drag.from ? drag.step : 0;
      b.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
  }

  /**
   * Near the top or bottom of the window, the page scrolls while something is held: only
   * after it has rested there for a moment, slowly at first and never fast, so a box carried
   * past the edge does not send the page racing.
   */
  var EDGE = 56;
  var EDGE_WAIT_MS = 300;
  var EDGE_MAX = 7;
  function edgeScroll(now) {
    if (!drag) return;
    var into = drag.y < EDGE ? -(EDGE - drag.y) : drag.y > window.innerHeight - EDGE ? drag.y - window.innerHeight + EDGE : 0;
    if (!into) drag.edgeSince = 0;
    else if (!drag.edgeSince) drag.edgeSince = now || performance.now();
    var waited = drag.edgeSince ? (now || performance.now()) - drag.edgeSince : 0;
    if (into && waited > EDGE_WAIT_MS) {
      // Speed grows with how deep into the edge the hand is and how long it has stayed.
      var ramp = Math.min(1, (waited - EDGE_WAIT_MS) / 600);
      var v = Math.max(1, Math.round(Math.min(EDGE_MAX, Math.abs(into) / 6) * ramp));
      window.scrollBy(0, into < 0 ? -v : v);
      moveDrag(drag.x, drag.y);
    }
    drag.raf = requestAnimationFrame(edgeScroll);
  }

  function endDrag(cancelled) {
    if (!drag) return;
    var d = drag;
    drag = null;
    cancelAnimationFrame(d.raf);
    clearOverlays();
    $("grid").classList.remove("arranging");
    document.body.classList.remove("is-moving", "is-sizing");
    d.el.classList.remove("lifted", "sizing");
    // The held box and the ones that made room keep their offsets until the glide takes over.
    if (d.kind === "stack") {
      if (cancelled || d.to === d.from) { settleBack(SMOOTH); return; }
      var ids = d.boxes.map(function (b) { return b.getAttribute("data-box"); });
      ids.splice(d.to, 0, ids.splice(d.from, 1)[0]);
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
        var at = ids.indexOf(b.id);
        if (at >= 0) b.o = at;
        return b;
      }), SMOOTH);
      return;
    }
    if (cancelled || !d.spots) { settleBack(SMOOTH); return; }
    if (keepSpots(d.spots, SMOOTH) && d.kind === "size") {
      requestAnimationFrame(function () { toast(BOXES[d.id].title + ": " + sizeWords(d.el)); });
    }
  }

  // Mouse and pen: press on a box and move a little; the corner handle resizes at once
  // (for a finger too: it never scrolls the page).
  document.addEventListener("pointerdown", function (e) {
    if (!state.editing || drag || e.button !== 0) return;
    var el = e.target.closest ? e.target.closest("#grid > .box") : null;
    if (!el) return;
    if (e.target.closest(".box-resize")) {
      e.preventDefault();
      beginDrag("size", el, e.clientX, e.clientY, false);
      return;
    }
    if (e.pointerType === "touch" || e.target.closest(".box-x, .box-size")) return;
    press = { el: el, x: e.clientX, y: e.clientY };
  });
  document.addEventListener("pointermove", function (e) {
    if (drag && !drag.touch) { moveDrag(e.clientX, e.clientY); return; }
    if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > DRAG_START) {
      var p = press;
      press = null;
      beginDrag(phone() ? "stack" : "move", p.el, e.clientX, e.clientY, false);
      // The grab point is where the press began, not where the move was noticed.
      if (drag && drag.kind === "move") { drag.grabX -= e.clientX - p.x; drag.grabY -= e.clientY - p.y; moveDrag(e.clientX, e.clientY); }
      if (drag && drag.kind === "stack") { drag.y0 = p.y; moveDrag(e.clientX, e.clientY); }
    }
  });
  document.addEventListener("pointerup", function () { press = null; if (drag && !drag.touch) endDrag(false); });
  document.addEventListener("pointercancel", function () { press = null; if (drag && !drag.touch) endDrag(true); });

  // A finger: hold still on a box for a moment, then drag.
  document.addEventListener("touchstart", function (e) {
    if (drag || e.touches.length !== 1 || !state.data) return;
    var el = e.target.closest ? e.target.closest("#grid > .box") : null;
    if (!el || e.target.closest(".box-x, .box-size, .box-resize")) return;
    var t = e.touches[0];
    hold = { el: el, x: t.clientX, y: t.clientY, timer: setTimeout(function () {
      var h = hold;
      hold = null;
      if (!h || !h.el.isConnected) return;
      if (!state.editing) startEdit();
      beginDrag(phone() ? "stack" : "move", h.el, h.x, h.y, true);
    }, HOLD_MS) };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (hold && t && Math.abs(t.clientX - hold.x) + Math.abs(t.clientY - hold.y) > SLOP) {
      clearTimeout(hold.timer);
      hold = null;
    }
    if (drag && drag.touch && t) {
      e.preventDefault();
      moveDrag(t.clientX, t.clientY);
    }
  }, { passive: false });
  function touchOver(e, cancelled) {
    if (hold) { clearTimeout(hold.timer); hold = null; }
    if (drag && drag.touch) {
      // No tap reaches what was under the finger when it lets go of a box.
      if (e.cancelable) e.preventDefault();
      endDrag(cancelled);
    }
  }
  document.addEventListener("touchend", function (e) { touchOver(e, false); }, { passive: false });
  document.addEventListener("touchcancel", function (e) { touchOver(e, true); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { if (drag || hold) e.preventDefault(); });

  // The keyboard: arrows move the box in focus, Shift and arrows resize it.
  var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  function keyMove(el, d, resize) {
    var id = el.getAttribute("data-box");
    if (phone()) {
      if (!d[1]) return;
      var ids = phoneOrder(placed()).map(function (s) { return s.id; });
      var from = ids.indexOf(id);
      var to = clamp(from + d[1], 0, ids.length - 1);
      if (to === from) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
        var at = ids.indexOf(b.id);
        if (at >= 0) b.o = at;
        return b;
      }));
      el.focus();
      toast(BOXES[id].title + " moved " + (d[1] < 0 ? "up" : "down") + ".");
      return;
    }
    var s = spotIn(placed(), id);
    if (!s) return;
    var min = minSize(id);
    if (resize) {
      var w = clamp(s.w + d[0], min.w, COLS - s.x);
      var h = clamp(s.h + d[1], min.h, 40);
      if (keepSpots(previewWith(id, s.x, s.y, w, h, true))) {
        el.focus();
        requestAnimationFrame(function () { toast(BOXES[id].title + ": " + sizeWords(el)); });
      }
      return;
    }
    // Down past empty space would only float back up, so it goes as far as it takes to move.
    for (var step = 1; step <= 40; step++) {
      var x = clamp(s.x + d[0] * step, 0, COLS - s.w);
      var y = Math.max(0, s.y + d[1] * step);
      if (x === s.x && y === s.y) return;
      if (keepSpots(previewWith(id, x, y, s.w, s.h))) {
        el.focus();
        toast(BOXES[id].title + " moved.");
        return;
      }
      if (d[0]) return;
    }
  }
  document.addEventListener("keydown", function (e) {
    if (!state.editing || drag || !ARROWS[e.key]) return;
    var el = document.activeElement;
    if (!el || !el.matches || !el.matches("#grid > .box")) return;
    e.preventDefault();
    keyMove(el, ARROWS[e.key], e.shiftKey);
  });
  var drawerTimer = 0;
  var drawerFrom = null;
  function openDrawer(kind) {
    var el = $("drawer");
    clearTimeout(drawerTimer);
    drawerFrom = document.activeElement;
    state.drawerOpen = true;
    state.drawerKind = kind;
    el.querySelector(".drawer-body").scrollTop = 0;
    paintDrawer();
    el.hidden = false;
    document.body.style.overflow = "hidden";
    // One frame on screen closed first, so the panel slides in rather than appearing.
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("open"); }); });
    el.querySelector(".drawer-panel").focus();
  }
  function closeDrawer() {
    var el = $("drawer");
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    el.classList.remove("open");
    document.body.style.overflow = "";
    drawerTimer = setTimeout(function () { el.hidden = true; }, 360);
    if (drawerFrom && drawerFrom.focus) drawerFrom.focus();
  }

  // ── Presses ────────────────────────────────────────────────────────────

  // A press anywhere outside the Layout menu closes it.
  document.addEventListener("pointerdown", function (event) {
    if (!state.menuOpen || !event.target.closest) return;
    if (event.target.closest("#layout-menu, [data-act='layout-menu']")) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) button.setAttribute("aria-expanded", "false");
  });
  window.addEventListener("resize", function () { if (state.menuOpen) { state.menuOpen = false; $("layout-menu").hidden = true; } });

  var OFFERS_KEY = "slack-digest-offers-done@1";
  function saveOffersAsked() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(OFFERS_KEY, Object.keys(state.offersAsked)).catch(function () {});
  }

  document.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var item = id ? findItem(id) : null;
    if (act === "toggle") {
      var was = snapshot();
      state.open[id] = !state.open[id];
      paintGrid();
      glide(was);
      var again = document.querySelector('[data-act="toggle"][data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (again) again.focus();
    } else if (act === "quiet-list") {
      var shownQ = snapshot();
      state.showQuietList = !state.showQuietList;
      paintGrid();
      glide(shownQ);
      var foot = document.querySelector('[data-act="quiet-list"]');
      if (foot) foot.focus();
    } else if (act === "connect") connect();
    else if (act === "run") runNow();
    else if (act === "more-rows") {
      var boxId = el.closest(".box").getAttribute("data-box");
      var shown = snapshot();
      state.expanded[boxId] = !state.expanded[boxId];
      fitBox(boxEl(boxId));
      glide(shown);
    }
    else if (act === "ask") ask(el.getAttribute("data-q"));
    else if (act === "reply" && item) {
      ask("Write my reply to " + (text(item.who, 80) || "this person") + " in " + (whereWords(item.where) || "Slack").replace(/^Direct message$/, "our direct messages") +
        (text(item.gist) ? " about this: " + text(item.gist, 160) : "") + ". Read the whole thread first. Write it the way I write in Slack, short, with [brackets] around anything I need to decide. Show it to me here as a draft I can copy. Never post it in Slack.");
    } else if (act === "channel" && item) {
      ask("Catch me up on " + (text(item.name, 60) || "this channel") + " from the last day: what happened, what was decided, and what is still open, in a few short lines.");
    } else if (act === "promise") {
      var pr = promises()[+el.getAttribute("data-i")];
      if (pr) ask("I said in Slack that I would " + text(pr.what, 160).replace(/^./, function (c) { return c.toLowerCase(); }) + (text(pr.to) ? " (to " + whereWords(pr.to) + ")" : "") + ". Help me get it done: what is needed, and a short update I can copy. Do not post anything in Slack.");
    } else if (act === "idea-now") {
      var idea = ideaById(el.getAttribute("data-idea"));
      var fit = idea && el.getAttribute("data-fit") ? fitted(idea, null, true) : null;
      if (idea) { closeDrawer(); ask(fit && fit.ask ? fit.ask : idea.ask); }
    } else if (act === "idea-routine") {
      var r = ideaById(el.getAttribute("data-idea"));
      if (r) { closeDrawer(); ask("Set this up as a routine that runs " + r.at + ": " + r.ask + " Show me the routine so I can approve it before it starts."); }
    } else if (act === "idea-hide") {
      setIdeaHidden(el.getAttribute("data-idea"), true);
    } else if (act === "idea-unhide") {
      setIdeaHidden(el.getAttribute("data-idea"), false);
    } else if (act === "ideas") {
      openDrawer("ideas");
    } else if (act === "add-box") {
      openDrawer("add");
    } else if (act === "add-this") {
      var add = el.getAttribute("data-add");
      if (BOXES[add]) addBox(add);
    } else if (act === "phone-size") {
      var sized = el.closest(".box").getAttribute("data-box");
      var size = el.getAttribute("data-size");
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) { if (b.id === sized) b.p = size; return b; }));
      if (boxEls[sized]) { var btn = boxEls[sized].querySelector('[data-size="' + size + '"]'); if (btn) btn.focus(); }
    } else if (act === "remove-box") {
      removeBox(el.closest(".box").getAttribute("data-box"));
    } else if (act === "layout-menu") {
      if (state.menuOpen) closeMenu(); else openMenu(el);
    } else if (act === "layout-edit") {
      closeMenu();
      startEdit();
    } else if (act === "layout-ask") {
      closeMenu();
      askAboutLayout();
    } else if (act === "layout-ask-cancel") {
      stopLayoutAsk();
    } else if (act === "change-apply") {
      applyChange();
    } else if (act === "change-skip") {
      skipChange();
    } else if (act === "change-undo") {
      state.changeApplied = false;
      undoLayout();
      paintSuggest();
      toast("Your page is back to how it was.");
    } else if (act === "change-ok") {
      state.changeApplied = false;
      paintSuggest();
    } else if (act === "gift-do") {
      var gift = state.reading && state.reading.gift;
      if (gift) {
        ask(giftParts(gift).ask);
        state.giftAsked = gift.at;
        if (showReading()) paintHero();
        else { giftDone(); paintGiftKeep(); }
      }
    } else if (act === "gift-skip") {
      giftDone(true);
      paintGiftKeep();
    } else if (act === "offer-do") {
      var key = el.getAttribute("data-key");
      var offer = state.reading ? state.reading.offers.filter(function (o) { return offerKey(o) === key; })[0] : null;
      if (offer) {
        ask(offerParts(offer).ask);
        state.offersAsked[key] = true;
        saveOffersAsked();
        if (showReading()) paintHero(); else paintGiftKeep();
      }
    } else if (act === "edit-start") {
      startEdit();
    } else if (act === "edit-done") {
      doneEdit();
    } else if (act === "undo") {
      undoLayout();
    } else if (act === "reset-layout") {
      resetLayout();
    } else if (act === "drawer-close") {
      closeDrawer();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (drag) endDrag(true);
    else if (state.menuOpen) closeMenu();
    else if (state.drawerOpen) closeDrawer();
    else if (state.editing) doneEdit();
  });

  document.addEventListener("change", function (event) {
    if (event.target && event.target.id === "day-pick") {
      state.day = event.target.value;
      state.open = {};
      load();
    }
  });

  // The Ask box is drawn again as it changes size, so its form is listened to from here.
  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    if (state.layoutAsk) sendLayoutAsk($("ask-input").value);
    else ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paint();

  if (PHONE) {
    var onPhoneChange = function () { if (state.loaded && state.data) paintGrid(); };
    if (PHONE.addEventListener) PHONE.addEventListener("change", onPhoneChange);
    else if (PHONE.addListener) PHONE.addListener(onPhoneChange);
  }
  // Rows are measured to fit their boxes; the web font changes their height once it arrives.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      Object.keys(boxEls).forEach(function (id) { if (boxEls[id].isConnected) fitBox(boxEls[id]); });
    });
  }

  if (V2) {
    // This person's own layout, if they changed it; the default otherwise.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var clean = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (clean) state.layout = clean;
      var giftSeen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof giftSeen === "string") state.giftDone = giftSeen;
      var offersSeen = mine ? mine.get(OFFERS_KEY) : null;
      if (Array.isArray(offersSeen)) offersSeen.forEach(function (k) { if (typeof k === "string") state.offersAsked[k] = true; });
      var seen = mine ? mine.get(CHANGE_SEEN_KEY) : null;
      if (typeof seen === "string") state.changeSeen = seen;
      var hidden = mine ? mine.get(HIDDEN_IDEAS_KEY) : null;
      if (Array.isArray(hidden)) hidden.forEach(function (id) { if (ideaById(id)) state.hiddenIdeas[id] = true; });
      state.mineReady = true;
      paint();
    }).catch(function () {});
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      // The routine's data lives in this app's folder.
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    cab.connectors.list().then(function (items) {
      state.slack = pickSlack(items) || { id: "slack", state: "not-available-here", problem: null, canConnect: false };
      paint();
      catchUp();
    }).catch(function () {
      state.slack = { id: "slack", state: "not-available-here", problem: null, canConnect: false };
      paint();
    });
    cab.connectors.onChange(function (items) { var g = pickSlack(items); if (g) { state.slack = g; paint(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
    readSchedule();
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }
})();
</script>
</body>
