id: morning-slack-digest
name: Morning Slack Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: channel-reader
agentSlug: channel-reader
timeout: 600
prompt: |-
  Write this morning's Slack digest.

  Include direct messages: yes
  (The line above is the person's own switch. Change "yes" to "no" to leave direct and
  group messages out of the digest.)

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-slack-summary.md`: the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the urgency vocabulary and the tone. This prompt does not repeat them.
  2. Find what moved with a search, not a channel list. Slack's `after:` date filter
     excludes the date it names, so search with `after:` set to the day before yesterday,
     then keep only messages from the last 24 hours. A search with only the date filter
     returns nothing, so always pair it with a broad, non-empty search phrase and sort by
     newest first. Page through the results until they are older than 24 hours, or ten
     pages, whichever comes first. The channels those messages sit in are the channels
     that moved; a channel with no message in that window has nothing to report and gets
     no row. Never look channels up by searching their names one letter at a time: Slack
     rate-limits it long before the sweep is done.
  3. For each channel that moved, read its last 24 hours, thread replies included, one
     channel at a time. If your search covers only public channels, that is fine and not
     a `status` issue.
  4. If "Include direct messages" above says yes, also search the last 24 hours of the
     person's direct and group messages the same way, using the search that covers
     private conversations too (not the public-only one), and read each conversation
     that moved. If it says no, leave them out entirely. If Slack refuses access to direct
     messages, the Slack connection was made before it allowed them: skip them, write the
     channels, and set `status` to "Direct messages not included: reconnect Slack to
     allow them".
  5. This run is read only. Do not post, reply in a thread, react, or mark anything read,
     however obvious the one-line answer looks.
  6. If Slack rate-limits a call, wait about a minute and try that call again, up to three
     times, and no more than five minutes of waiting in the whole run. If some channels
     still can't be read, write the digest from the ones you did read and set `status` to
     a short phrase naming what is missing, for example "2 channels could not be read
     (Slack rate limit)". A partial digest is better than none.
  7. If Slack can't be reached at all, or even the first search stays rate-limited after
     its retries, say what you tried and what it said, touch no file, and stop. Leave
     `daily-summaries/` exactly as you found it, example and all.
  8. On the first run that does reach Slack, write your dated file and then delete
     `daily-summaries/EXAMPLE-slack-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
