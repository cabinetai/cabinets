id: morning-slack-digest
name: Morning Slack Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: channel-reader
agentSlug: channel-reader
timeout: 900
prompt: |-
  Catch up on the person's Slack for the Your Slack page.

  Include direct messages: yes
  (The line above is the person's own switch. Change "yes" to "no" to leave direct and
  group messages out of the catch-up.)

  Your working directory is the cabinet root. You write only `your-slack/data/latest.json`,
  `your-slack/data/days/<YYYY-MM-DD>.json`, `your-slack/data/status.json` and new rows in
  `decisions/index.md`. Never touch any other file, and never `EXAMPLE-latest.json`.

  1. Read your persona before anything else. It holds the shape of every field, the
     urgency words, the Decision log and the tone. This prompt does not repeat them. In one
     Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `your-slack/data/latest.json` if it is there.
  2. If Slack is not connected, write only `your-slack/data/status.json` with `ok: false`
     and `why` "Slack isn't connected yet.", and stop.
  3. Find out who the person is in Slack: their display name and their user id (`U...`).
     Run the search that covers private conversations with only the filter
     `is:dm after:<a week ago>`: every result lists its participants with their ids, and
     the person is the one in every direct message. If they have no direct messages that
     week, find them with the user search tool by the name your memory or the cabinet
     gives. You need the id for the searches below; never show it to them.
  4. Find what moved with searches that use filters only, no search words. A single
     common word ("the", "a", "you") matches almost nothing, and a date filter alone
     returns nothing, but a date filter together with a person or conversation filter
     returns every message. Slack's `after:` excludes the date it names, so set it to the
     day before yesterday, sort by newest first, and keep only messages from the last 24
     hours. Page through each search until the results are older than 24 hours, or ten
     pages, whichever comes first:
     - Other people's messages: `after:<date> -from:<@USER_ID>`. The channels and
       conversations these sit in are what moved; one with no message in the window gets
       no row.
     - The person's own messages: `after:<date> from:<@USER_ID>`. These are where
       promises come from, and they tell you which questions they already answered.
     Never look channels up by searching their names one letter at a time: Slack
     rate-limits it long before the sweep is done.
  5. For each channel that moved, read its last 24 hours, thread replies included, one
     channel at a time. From that, write its channel row, and note anything waiting on the
     person and any decision.
  6. If "Include direct messages" above says yes, use the search that covers private
     conversations too (not the public-only one) for the searches in step 4, and also run
     `is:dm after:<date>` and `is:mpim after:<date>` so no direct or group message is
     missed. Read each conversation that moved. A conversation waiting on them goes in
     `waiting`. If it says no, use the public-only search and leave direct and group
     messages out entirely. If Slack refuses access to direct messages, the Slack
     connection was made before it allowed them: skip them, write the rest, and set `why`
     in status.json to "Direct messages not included: reconnect Slack to allow them" with
     `ok: true`.
  7. This run is read only. Do not post, reply in a thread, react, or mark anything read,
     however obvious the one-line answer looks.
  8. If Slack rate-limits a call, wait about a minute and try that call again, up to three
     times, and no more than five minutes of waiting in the whole run. If some channels
     still can't be read, write the catch-up from the ones you did read and put a short
     `why` in status.json, for example "2 channels could not be read (Slack rate limit)".
     A partial catch-up is better than none.
  9. If Slack can't be reached at all, or even the first search stays rate-limited after
     its retries, write only `your-slack/data/status.json` with `ok: false` and a plain
     `why`, keep `latest.json` as it was, and stop.
  10. In one Bash call, write `your-slack/data/latest.json` (and check it parses), copy it
      to `your-slack/data/days/<today's local date>.json`, delete day files older than 30
      days, write `your-slack/data/status.json`, and add today's new decisions to the top
      of the table in `decisions/index.md`.

  Finish in one or two plain sentences about the person's Slack and nothing else: how many
  people are waiting on them, and the one that matters most, if there is one.
