id: morning-slack-digest
name: Morning Slack Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: channel-reader
agentSlug: channel-reader
timeout: 900
prompt: |-
  Catch up on my Slack since the last catch-up and update the Your Slack page. Follow the
  Morning catch-up steps in your instructions. When you are done, tell me in one or two
  sentences what moved.

  Include direct messages: yes (change it to no to leave direct and group messages out)
