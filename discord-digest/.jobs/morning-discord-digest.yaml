id: morning-discord-digest
name: Morning Discord Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: server-reader
agentSlug: server-reader
timeout: 900
prompt: |-
  Catch up on the person's Discord server for the Your Discord page.

  Your working directory is the cabinet root. You write only `your-discord/data/latest.json`,
  `your-discord/data/days/<YYYY-MM-DD>.json` and `your-discord/data/status.json`. Never touch
  any other file, and never `EXAMPLE-latest.json`.

  1. Read your persona before anything else. It holds the shape of every field, the
     urgency words and the tone. This prompt does not repeat them. In one Bash call, print
     the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read `your-discord/data/latest.json`
     if it is there.
  2. If you have no Discord tools (none named `discord_list_channels`), Discord is not
     connected: write only `your-discord/data/status.json` with `ok: false` and `why`
     "Discord isn't connected yet.", and stop.
  3. Work out the window. It starts 24 hours ago, or at the last catch-up's `generatedAt`
     when that is earlier (the computer slept through a morning), but never more than 7
     days back. Turn the start into a Discord id with
     `(<start in ms since 1970> - 1420070400000) * 4194304` (a quick `node -e` with BigInt):
     reading with `after` set to that id returns only messages from the window.
  4. Call `discord_list_channels` once. Every channel it returns is one the person allowed;
     there is nothing else to look for. Never ask for a channel by guessing its id.
  5. Find the threads and forum posts: call `discord_list_threads` for each text,
     announcement and forum channel. It lists active and recently archived threads, and
     every post in a forum. Keep every one that is not archived, and archived ones that
     started in the window; step 6 tells you which of them moved. If `discord_list_threads` errors for a
     channel, fall back for that channel: a thread is found from a message in the window
     that carries a `thread` field, or from the last catch-up's `known` list, and a forum
     channel is counted as quiet.
  6. Read each text and announcement channel, and each thread or forum post from step 5,
     with `discord_read_channel`, `limit` 100 and `after` the window's id. If 100 come back,
     read again with `after` the newest id you got, at most 5 pages per channel; if a channel
     still had more, say so in `why`, for example "A very busy day in #general: some
     messages may be missing". A channel or thread with no message in the window gets no
     row. From what you read, write its row, with the `link` of its newest message in the
     window as `link`.
  7. This run is read only. Do not post, reply, react, pin, start a thread or edit anything,
     however obvious the one-line answer looks.
  8. If one channel cannot be read, skip it, write the rest and put a short `why` in
     status.json, for example "2 channels could not be read". A partial catch-up is better
     than none. If Discord can't be reached at all, write only `your-discord/data/status.json`
     with `ok: false` and a plain `why`, keep `latest.json` as it was, and stop.
  9. In one Bash call, write `your-discord/data/latest.json` (and check it parses), copy it
     to `your-discord/data/days/<today's local date>.json`, delete day files older than 30
     days, and write `your-discord/data/status.json`.

  Finish in one or two plain sentences about the person's server and nothing else: how many
  messages moved in how many channels, and the one most worth their time, if there is one.
