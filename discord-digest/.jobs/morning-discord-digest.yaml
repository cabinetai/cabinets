id: morning-discord-digest
name: Morning Discord Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: server-reader
agentSlug: server-reader
timeout: 600
prompt: |-
  Write this morning's Discord digest.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-discord-summary.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and opens
  the newest, so a name in any other shape is a summary nobody will see. You only ever ADD
  a file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Worth it` vocabulary and the tone. This prompt does not repeat them.
  2. With your Discord tools, list the channels the bot can see in the configured server
     and read the last 24 hours of each one, thread replies included. A channel the bot
     was not added to is out of scope — do not go looking for it. Skip direct messages.
  3. This run is read only. Do not send a message, reply in a thread, create a thread,
     add a reaction or edit a post, however obvious the one-line answer looks.
  4. If you have no Discord tool, or Discord is not connected, or the call fails, STOP
     HERE. Write nothing. Leave `daily-summaries/` exactly as you found it, example and
     all. Report: "Discord is not reachable. I would have read the last 24 hours of every
     channel the bot can see and written one row per channel." Then exit.
  5. On the first run that does reach Discord, write your dated file and then delete
     `daily-summaries/EXAMPLE-discord-summary.md`. It is a demo, not a past summary, and
     it must not sit in the date list beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
