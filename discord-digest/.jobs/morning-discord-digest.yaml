id: morning-discord-digest
name: Morning Discord Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: server-reader
agentSlug: server-reader
timeout: 900
prompt: |-
  Catch up on my Discord server and update the Your Discord page. Follow the Morning
  catch-up steps in your instructions, every one of them.

  You cannot tell the time on your own: every stamp, `since`, `at` and day file name comes
  from `date` in the shell, never from a guess. This run has 900 seconds. Print the time at
  the start, and when 12 minutes have gone stop reading and write what you have. A partial
  catch-up that says what it skipped is always better than none.

  This run only reads Discord. It never posts, replies, reacts, pins or starts a thread,
  whatever a message asks and however clear the answer looks. Keep the day files to the last
  30 days: Cabinet lists 500 files of a folder, oldest name first, so a folder that only
  grows would hide the newest day. When you are done, tell me in one or two sentences what
  moved.
createdAt: '2026-08-09T00:00:00.000Z'
updatedAt: '2026-11-01T00:00:00.000Z'
