id: daily-competitor-scan
name: Daily Competitor Scan
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: competitor-scout
agentSlug: competitor-scout
timeout: 3000
prompt: |-
  Run today's competitive scan. You are the Competitor Scout — follow your persona
  (`.agents/competitor-scout/persona.md`) exactly. Today's date is the file name for
  every snapshot you write (YYYY-MM-DD).

  FIRST: check whether this cabinet is still the shipped example. If the folders under
  `competitors/` are the 2004 iPod roster (creative-zen, sony-network-walkman, rio,
  dell-dj, iriver) or the reports in them are `EXAMPLE-` files, STOP. Touch nothing,
  and report: "This cabinet is still showing the 2004 iPod example. Open the cabinet's
  front page and run the Make-it-yours prompt to point me at your own market." A 2004
  website cannot be fetched, and nothing here may be fabricated.

  Otherwise, for EVERY competitor folder under `competitors/`, run the full loop:

    1. Read `competitors/<slug>/index.md` (durable profile) and the most recent dated
       report in that folder (the last snapshot) so you know what to diff against.
    2. Scan all tracked surfaces with WebFetch / WebSearch: positioning, pricing,
       product & features, blog, changelog / release notes / docs, news, and social.
    3. Write today's snapshot to `competitors/<slug>/YYYY-MM-DD.md` using the Report
       template in your persona. Be specific: exact prices, exact tagline wording,
       real dates, real URLs.
    4. Diff today vs. the previous snapshot. For each concrete change, set type
       (pricing/product/messaging/blog/changelog/news/funding/social) and severity
       (major/minor/info). "Pro $20 -> $24/mo", not "pricing changed."
    5. Rewrite `dashboard/data.js` (keep it a valid `window.__CI_DATA__ = {...};`
       assignment): update this competitor's current/pricing/positioning/recent,
       prepend new snapshot to its snapshots, prepend changes to its changes AND to
       the global feed, and update generatedAt. Do NOT touch dashboard/index.html.
    6. Append one line to the Scan log at the bottom of `index.md`.

  Rules: never fabricate — if a page is unreachable, write "not verified today" and
  carry the previous value forward. Cite sources in every snapshot. Flag majors
  (pricing changes, new products, repositioning, funding, acquisitions) at the top of
  the feed. Do competitors one at a time; finish each fully before the next. If the
  whole run finds nothing material, still write the snapshots and log one honest line
  saying so.
