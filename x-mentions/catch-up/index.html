<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Onest:wght@400;500;600;700&display=swap">
<!--
  X Digest: the Catch up page.

  X shows every notification: likes, follows, bots and the few people who actually wrote to
  you. This page shows only those people, with a reply in your voice that opens on X ready
  to post. It is laid out like X itself: a black "Lights out" banner where Cabinet's morning
  note is drawn as a post, the people waiting as a feed in the middle, and a right rail with
  the numbers and the Ask box. Cabinet's brown marks what Cabinet does; X's blue marks what
  happens on X.

  Data: data/latest.json (see DATA.md), written only through first-sort.mjs. Until it exists
  the page shows data/EXAMPLE-latest.json, marked as an example.
-->
<style>
:root {
  --page: #f7f9f9;
  --sheet: #ffffff;
  --ink: #0f1419;
  --ink-2: #536471;
  --ink-3: #8b98a5;
  --line: #eff3f4;
  --line-2: #cfd9de;
  --blue: #1d9bf0;
  --blue-deep: #1a8cd8;
  --blue-soft: #e8f5fd;
  --red: #f4212e;
  --night: #000000;
  --night-ink: #e7e9ea;
  --night-2: #71767b;
  --night-line: #2f3336;
  --brown: #6e4127;
  --brown-deep: #4a2a18;
  --brown-soft: #f6eee8;
  --amber: #ffd400;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sheet: 16px;
  --r-pill: 9999px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.fill { fill: currentColor; stroke: none; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.app { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }

/* ── Buttons ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 0 16px; border-radius: var(--r-pill);
  border: 1px solid var(--line-2); background: var(--sheet); color: var(--ink);
  font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: #f2f4f5; text-decoration: none; }
.btn .icon { width: 16px; height: 16px; }
.btn.x { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.x:hover { background: var(--blue-deep); }
.btn.cab { background: var(--brown); border-color: var(--brown); color: #fff; }
.btn.cab:hover { background: var(--brown-deep); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--line); }
.btn.big { min-height: 44px; padding: 0 22px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }

/* ── Setup, reading and notices (above the page) ──────────────────────── */
.card-hero {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet);
  padding: 24px; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 20px; align-items: start;
}
.card-hero h2 { margin: 2px 0 6px; font: 400 30px/1.1 var(--serif); letter-spacing: -.01em; }
.card-hero .lead { margin: 0; color: var(--ink-2); max-width: 60ch; }
.card-hero .fine, .fine { color: var(--ink-3); font-size: 13px; margin: 8px 0 0; }
.card-hero .actions, .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.art { width: 88px; height: 88px; border-radius: 22px; background: var(--night); display: grid; place-items: center; position: relative; }
.art .xmark { width: 40px; height: 40px; color: #fff; }
.art .badge { position: absolute; right: -6px; top: -6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 3px solid var(--sheet); }
.art .badge.ok { background: #00ba7c; }
.art .badge.bad { background: var(--red); }
.art .badge .icon { width: 14px; height: 14px; stroke-width: 3; }
.costs { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.costs b { color: var(--ink); font-weight: 600; }

.notice {
  display: flex; gap: 12px; align-items: flex-start; background: #fff8e1; border: 1px solid #f5dfa3;
  border-radius: 12px; padding: 12px 14px; color: #5c4400;
}
.notice .icon { color: #b07d00; margin-top: 2px; }
.notice p { margin: 0; }
.notice .actions { margin-top: 10px; }

.ribbon {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--blue-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: #0b4a75;
}
.ribbon .tag { background: var(--blue); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: var(--r-pill); }
.ribbon p { margin: 0; flex: 1 1 260px; }

/* The first reading: lines arrive one by one beside the gift. */
.read-page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.read-page.solo { grid-template-columns: minmax(0, 1fr); }
.reading { background: var(--night); color: var(--night-ink); border-radius: var(--r-sheet); padding: 24px; }
.reading h2 { margin: 0 0 6px; font: 400 32px/1.1 var(--serif); color: #fff; }
.reading > p { margin: 0; color: var(--night-2); }
.read-lines { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.read-lines li { display: flex; gap: 10px; align-items: flex-start; }
.read-lines li .icon { color: var(--blue); margin-top: 2px; }
.read-lines li.old { color: var(--night-2); }
.read-lines li.old b { color: var(--night-ink); }
.read-lines b { color: #fff; font-weight: 600; }
.read-lines li.now { color: var(--night-2); }
.reading .fine { color: var(--night-2); margin-top: 18px; }
.pulse-dot { width: 10px; height: 10px; margin: 5px 4px 0; border-radius: 50%; background: var(--blue); flex-shrink: 0; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 50% { opacity: .35; transform: scale(.8); } }
/* While the first reading runs, it is the whole page: no made-up example under it, and it
   fills the window: the reading on the left in Lights out, the gift on the right. */
.first-read #ribbon, .first-read #page, .first-read #gift-keep, .first-read #welcome { display: none !important; }
.first-read .app { min-height: 100vh; max-width: none; padding-inline: clamp(16px, 2.2vw, 28px); }
.first-read #hero { flex: 1; display: flex; flex-direction: column; }
.first-read .read-page { flex: 1; }
@media (min-width: 900px) {
  .read-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 20px; min-height: calc(100vh - 110px); }
  .read-page .reading { display: flex; flex-direction: column; padding: 40px clamp(28px, 3.4vw, 52px); }
  .read-page .reading h2 { font-size: clamp(40px, 4vw, 56px); }
  .read-page .read-lines li { font-size: 17.5px; }
  .read-page .gift { justify-content: center; padding: 40px clamp(24px, 3.4vw, 52px); }
  .read-page .gift h3 { font-size: clamp(30px, 3vw, 42px); max-width: 22ch; }
  .read-page .gift.looking { flex-direction: column; background: transparent; border-style: dashed; }
  .read-page .gift.looking h3 { color: var(--ink-3); font-size: clamp(26px, 2.6vw, 34px); }
}
@media (max-width: 899px) { .read-page .gift.looking { display: none; } }
/* The night fills up as it reads: more mentions light up with every line, the ones for you in blue. */
.read-sky { margin-top: auto; padding-top: 28px; display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 10px 4px; align-items: end; }
.read-sky i { width: 8px; height: 8px; border-radius: 50%; justify-self: center; background: #1d1f22; transition: background .6s, box-shadow .6s; }
.read-sky i.lit { background: #4a4e52; }
.read-sky i.you { background: var(--blue); box-shadow: 0 0 0 3px rgba(29, 155, 240, .25); }
.read-strip { display: flex; gap: 8px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--ink-2); }

.gift { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.gift.looking { flex-direction: row; align-items: flex-start; color: var(--ink-2); }
.gift.looking h3 { margin: 0; font: 400 22px/1.2 var(--serif); color: var(--ink); }
.gift .found { margin: 0; color: var(--brown); font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.gift h3 { margin: 0; font: 400 26px/1.15 var(--serif); }
.gift .post { border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 14px; }
.gift .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.gift .asked { margin: 0; color: #00805a; display: flex; gap: 6px; align-items: center; font-weight: 600; }
.gift .fine { margin: 0; }
.gift.arrive { animation: arrive .5s ease-out both; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } }

.welcome { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 22px; }
.welcome .found { margin: 0 0 6px; color: var(--brown); font-weight: 600; font-size: 14px; }
.welcome h3 { margin: 0; font: 400 28px/1.15 var(--serif); max-width: 46ch; text-wrap: balance; }
.welcome ul { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 10px; }
.welcome li { display: flex; gap: 10px; align-items: flex-start; }
.welcome li .icon { color: var(--ink-2); margin-top: 2px; }
.welcome .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.welcome .fine { margin: 0; }

/* ── Lights out: Cabinet's morning note, drawn as a post ──────────────── */
.night { background: var(--night); color: var(--night-ink); border-radius: var(--r-sheet); padding: 16px 20px 18px; overflow: hidden; }
.night-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.since { font-size: 13px; color: var(--night-2); margin-right: auto; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: var(--r-pill);
  border: 1px solid var(--night-line); font-size: 13px; color: var(--night-ink);
}
.pill .xmark { width: 13px; height: 13px; }
.pill .when { color: var(--night-2); }
.pill.off { color: var(--night-2); }
.pill.warn { border-color: #6b2a2f; color: #ffb4b9; }
.night .btn { background: transparent; color: var(--night-ink); border-color: var(--night-line); min-height: 30px; padding: 0 12px; font-size: 13px; }
.night .btn:hover { background: #16181c; }
.cab-post { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; margin-top: 16px; }
.cab-face { width: 48px; height: 48px; border-radius: 50%; background: var(--brown); display: grid; place-items: center; color: #fff; }
.cab-face .icon { width: 24px; height: 24px; stroke-width: 1.7; }
.post-head { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; font-size: 15px; }
.post-head .name { font-weight: 700; color: inherit; }
.post-head .handle, .post-head .dotsep, .post-head .ago { color: var(--ink-2); }
.night .post-head .handle, .night .post-head .dotsep, .night .post-head .ago { color: var(--night-2); }
.cab-post h1 { margin: 4px 0 0; font: 400 clamp(32px, 4.6vw, 50px)/1.02 var(--serif); letter-spacing: -.015em; color: #fff; text-wrap: balance; }
.cab-post .hello { margin: 2px 0 0; color: var(--night-2); font-size: 14px; }
.cab-post .say { margin: 10px 0 0; font-size: 17px; line-height: 1.45; max-width: 62ch; color: var(--night-ink); }
.cab-post .tally { margin: 10px 0 0; font-size: 14px; color: var(--night-2); }
.cab-post .tally b { color: var(--night-ink); font-weight: 600; }

/* The night as dots: one column per hour, a dot per mention, blue for the ones that want you. */
.pulse { margin: 18px 0 0 60px; }
.pulse-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 3px; height: 66px; }
.pulse-col { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
.pulse-col i { width: 8px; height: 8px; border-radius: 50%; background: #3e4144; }
.pulse-col i.you { background: var(--blue); box-shadow: 0 0 0 3px rgba(29, 155, 240, .25); }
.pulse-col i.more { background: #5b6065; }
.pulse-col.empty i { background: #1d1f22; width: 4px; height: 4px; }
.pulse-legend { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--night-2); }
.pulse-legend .key { display: inline-flex; align-items: center; gap: 6px; }
.pulse-legend .key i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); display: inline-block; }
@media (prefers-reduced-motion: no-preference) {
  .night.enter .pulse-col i { animation: pop .4s ease-out both; animation-delay: calc(var(--i) * 18ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } }
}

/* ── The feed and the rail ────────────────────────────────────────────── */
.columns { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.feed { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); overflow: hidden; }
.feed-head { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.feed-head h2 { margin: 0; font: 400 28px/1.1 var(--serif); }
.feed-head .n { font: 400 28px/1.1 var(--serif); color: var(--blue); font-variant-numeric: tabular-nums; }
.feed-head .sub { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.empty-feed { padding: 28px 18px; color: var(--ink-2); }
.empty-feed h3 { margin: 0 0 4px; font: 400 24px/1.2 var(--serif); color: var(--ink); }
.empty-feed p { margin: 0; }

.post { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px 18px 16px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; background: #8b98a5; }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.verified { width: 17px; height: 17px; color: var(--blue); align-self: center; }
.post .ctx { margin: 1px 0 0; font-size: 14px; color: var(--ink-2); }
.post .ctx a { color: var(--blue); }
.post .said { margin: 4px 0 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.post .said .tag { color: var(--blue); }
.today { margin-left: auto; align-self: center; font-size: 12px; font-weight: 700; color: var(--red); border: 1px solid #fbc5c9; padding: 1px 8px; border-radius: var(--r-pill); }
.quoted { margin-top: 10px; border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.quoted .post-head { font-size: 14px; }
.quoted .mini { width: 20px; height: 20px; border-radius: 50%; background: var(--brown-soft); color: var(--brown); display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; align-self: center; margin-right: 2px; }
.quoted p { margin: 2px 0 0; color: var(--ink); overflow-wrap: anywhere; }
.metrics { display: flex; gap: 22px; margin-top: 10px; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.metrics span { display: inline-flex; align-items: center; gap: 5px; }
.metrics .icon { width: 17px; height: 17px; }

/* Cabinet's part of a row: what they want, and a reply that is not posted yet. */
.wants { margin: 12px 0 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--brown-deep); }
.wants .icon { color: var(--brown); margin-top: 1px; width: 16px; height: 16px; }
.composer { margin-top: 10px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--sheet); }
.composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.composer label { display: block; padding: 9px 12px 0; font-size: 12px; color: var(--ink-2); }
.composer textarea {
  display: block; width: 100%; border: 0; outline: 0; resize: vertical; min-height: 48px;
  padding: 4px 12px 8px; font: 15px/1.4 var(--sans); color: var(--ink); background: transparent;
}
.composer-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px 10px 12px; border-top: 1px solid var(--line); }
.composer-foot .hint { margin-right: auto; font-size: 12px; color: var(--ink-3); }
.ring { width: 22px; height: 22px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 2.2; }
.ring .track { stroke: var(--line-2); }
.ring .fill { stroke: var(--blue); }
.ring.near .fill { stroke: var(--amber); }
.ring.over .fill { stroke: var(--red); }
.left { font-size: 12px; color: var(--ink-2); min-width: 22px; font-variant-numeric: tabular-nums; }
.left.over { color: var(--red); }
.composer-foot .btn { min-height: 32px; padding: 0 14px; font-size: 13px; }
.more-row { padding: 12px 18px; border-top: 1px solid var(--line); }

.rail { display: flex; flex-direction: column; gap: 16px; }
.side { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 14px 16px; }
.side h2 { margin: 0 0 6px; font: 400 24px/1.15 var(--serif); }
.stats { list-style: none; margin: 0; padding: 0; }
.stats li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.stats li:last-child { border-bottom: 0; }
.stats b { color: var(--ink); font: 400 21px/1 var(--serif); font-variant-numeric: tabular-nums; }
.cost-line { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
.cost-line b { color: var(--ink); font-weight: 600; }

.ask { background: var(--brown-deep); color: #f6eee8; border-radius: var(--r-sheet); padding: 16px; }
.ask h2 { margin: 0 0 10px; font: 400 26px/1.1 var(--serif); color: #fff; }
.ask form { display: flex; flex-direction: column; gap: 8px; }
.ask textarea {
  width: 100%; min-height: 70px; resize: vertical; border-radius: 14px; border: 1px solid #7a5640;
  background: #5a3721; color: #fff; padding: 10px 12px; font: 15px/1.4 var(--sans);
}
.ask textarea::placeholder { color: #c9ad9b; }
.ask textarea:focus { outline: 2px solid #f3d3bd; outline-offset: 1px; }
.ask .btn.send { align-self: flex-end; background: #fff; border-color: #fff; color: var(--brown-deep); }
.ask .note { margin: 0; font-size: 13px; color: #d9c0b0; min-height: 1em; }
.ideas { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.ideas p { margin: 0; font-size: 13px; color: #d9c0b0; }
.idea { text-align: left; border: 1px solid #7a5640; background: transparent; color: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
.idea:hover { background: #5a3721; }

/* ── More boxes ───────────────────────────────────────────────────────── */
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.box { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); overflow: hidden; }
.box-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.box-head h2 { margin: 0; font: 400 26px/1.1 var(--serif); }
.box-head .n { font: 400 26px/1.1 var(--serif); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.box-head .sub { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.rail .box-head { padding: 14px 16px 8px; }
.rail .box-head h2 { font-size: 24px; }
.box-empty { margin: 0; padding: 16px 18px; color: var(--ink-2); }
.mine-face { width: 40px; height: 40px; border-radius: 50%; background: var(--brown-soft); color: var(--brown); display: grid; place-items: center; font-weight: 700; }
.post.compact { padding: 12px 18px 14px; }
.open-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--blue); }
.done-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.done-chip .icon, .open-chip .icon { width: 15px; height: 15px; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.people li:last-child { border-bottom: 0; }
.people .face { width: 36px; height: 36px; font-size: 13px; }
.people .who { min-width: 0; font-size: 14px; }
.people .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.people .who span { color: var(--ink-2); }
.people .state { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.people .state.calm { color: var(--ink-3); font-weight: 500; }
.skip-sum { padding: 6px 16px 4px; }
.skip-sum .big { font: 400 44px/1 var(--serif); font-variant-numeric: tabular-nums; }
.skip-sum p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.skip-why { list-style: none; margin: 8px 0 0; padding: 0 16px; }
.skip-why li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.skip-why b { color: var(--ink); font-variant-numeric: tabular-nums; }
.skip-ex { list-style: none; margin: 4px 0 0; padding: 0 16px 6px; }
.skip-ex li { padding: 6px 0; font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skip-ex a { color: var(--ink-2); }
.box-idea { display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.box-idea .icon { color: var(--brown); width: 16px; height: 16px; }
.box-idea span { flex: 1; min-width: 0; }
.box-idea .btn { min-height: 30px; padding: 0 12px; font-size: 13px; }

/* Edit layout: every box can be moved or hidden; hidden ones wait as dashed cards. */
.edit-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--sheet); border: 1px solid var(--blue); border-radius: 12px; padding: 10px 14px; margin-top: 16px; }
.edit-bar p { margin: 0; flex: 1 1 240px; font-size: 14px; }
.box-tools { display: none; margin-left: auto; gap: 4px; }
.editing .box-tools { display: inline-flex; }
.editing .box-head .sub { display: none; }
.tool { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--sheet); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.tool:hover { background: #f2f4f5; }
.tool[disabled] { opacity: .35; cursor: default; }
.tool .icon { width: 16px; height: 16px; }
.tool.hide { width: auto; padding: 0 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; }
.editing .box, .editing .feed { box-shadow: 0 0 0 1px var(--blue-soft); }
.offered { border: 1.5px dashed var(--line-2); border-radius: var(--r-sheet); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.offered div { flex: 1 1 200px; min-width: 0; }
.offered h3 { margin: 0; font: 400 22px/1.15 var(--serif); }
.offered p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }

/* Ideas: a panel from the right, every idea with Ask now and Do this regularly. */
.drawer-back { position: fixed; inset: 0; background: rgba(15, 20, 25, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--sheet); z-index: 21; overflow-y: auto; padding: 20px; box-shadow: -8px 0 32px rgba(15, 20, 25, .18); }
.drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.drawer-head h2 { margin: 0; font: 400 32px/1.1 var(--serif); flex: 1; }
.drawer > p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
.idea-card { border-top: 1px solid var(--line); padding: 14px 0; }
.idea-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.idea-card p { margin: 3px 0 0; font-size: 14px; color: var(--ink-2); }
.idea-card .go { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.idea-card .go .btn { min-height: 32px; padding: 0 14px; font-size: 13px; }

.foot { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); font-size: 13px; max-width: 80ch; }
.foot .icon { width: 16px; height: 16px; margin-top: 1px; }
.foot p { margin: 0; }

.skel { display: flex; flex-direction: column; gap: 16px; }
.skel-night { background: var(--night); border-radius: var(--r-sheet); height: 240px; }
.skel-feed { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sheet); height: 360px; }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--blue); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
  transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .columns { grid-template-columns: minmax(0, 1fr); }
  .read-page { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .app { padding: 12px 10px 28px; }
  .card-hero { grid-template-columns: minmax(0, 1fr); }
  .pulse { margin-left: 0; }
  .post { padding: 12px 14px 14px; }
  .metrics { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse-dot, .spin, .gift.arrive { animation: none; }
}

    } else if (s === "needs-sign-in" || s === "needs-you") pill = '<span class="pill warn">' + xMark() + "X needs you</span>";
    else if (s === "not-available-here") pill = '<span class="pill off">' + xMark() + "X not available here</span>";
    else pill = '<span class="pill off">' + xMark() + "X not connected</span>";
    var button = "";
    if (s === "connected" && canRun() && state.data && !state.example)
      button = state.running ? '<button class="btn" disabled>' + icon("i-refresh", "spin") + "Reading...</button>"
        : '<button class="btn" data-act="run">' + icon("i-refresh") + "Read again</button>";
    var tools = '<button class="btn" data-act="ideas" aria-haspopup="dialog">' + icon("i-bulb") + "Ideas</button>" +
      (state.editing ? "" : '<button class="btn" data-act="layout">' + icon("i-layout") + "Edit layout</button>");
    return pill + button + tools;
  }

  function sinceWords() {
    var since = state.data && writtenAt(state.data.since);
    if (!since) return "Since your last morning";
    var ref = refDate();
    var days = Math.round((startOfDay(ref) - startOfDay(since)) / DAY_MS);
    if (days <= 0) return "Since " + clock(since) + " today";
    if (days === 1) return "Since yesterday at " + clock(since);
    return "Since " + since.toLocaleDateString([], { weekday: "long" }) + " at " + clock(since);
  }

  function nightHtml() {
    var d = state.data;
    var t = totals();
    var rows = list(d.waiting).length;
    var name = d.person && text(d.person.name, 40);
    var gen = writtenAt(d.generatedAt) || new Date();
    var big = rows ? rows + " " + plural(rows, "person wants", "people want") + " an answer from you."
      : "Nobody is waiting for you on X.";
    if (state.example) big = "Example: " + big.charAt(0).toLowerCase() + big.slice(1);
    var tally = [];
    if (num(t.mentions)) tally.push("<b>" + num(t.mentions) + "</b> " + plural(num(t.mentions), "post", "posts") + " mentioned you");
    if (num(t.answered)) tally.push("you answered <b>" + num(t.answered) + "</b>");
    if (num(t.skipped)) tally.push("<b>" + num(t.skipped) + "</b> can wait or be skipped");
    return '<section class="night' + (state.entered ? "" : " enter") + '" aria-label="This morning on X">' +
      '<div class="night-top"><span class="since">' + esc(sinceWords()) + "</span>" + statusHtml() + "</div>" +
      '<article class="cab-post"><div class="cab-face" aria-hidden="true">' + icon("i-cabinet") + "</div><div>" +
      '<div class="post-head"><span class="name">Cabinet</span><span class="handle">@cabinet</span><span class="dotsep">·</span><span class="ago">' + esc(clock(gen)) + "</span></div>" +
      (name ? '<p class="hello">Good morning, ' + esc(name) + ".</p>" : "") +
      "<h1>" + esc(big) + "</h1>" +
      (text(d.headline, 300) ? '<p class="say">' + esc(text(d.headline, 300)) + "</p>" : "") +
      (tally.length ? '<p class="tally">' + tally.join(", ").replace(/^./, function (c) { return c.toUpperCase(); }) + ".</p>" : "") +
      "</div></article>" + pulseHtml() + "</section>";
  }

  function pulseHtml() {
    var p = state.data.pulse;
    if (!p || !Array.isArray(p.counts) || !p.counts.length) return "";
    var start = writtenAt(p.start);
    var step = num(p.stepHours) || 1;
    var you = Array.isArray(p.you) ? p.you : [];
    var MAXDOTS = 6;
    var k = 0;
    var cols = p.counts.map(function (c, i) {
      c = num(c);
      var y = Math.min(num(you[i]), c);
      if (!c) return '<div class="pulse-col empty"><i style="--i:' + i + '"></i></div>';
      var dots = "";
      var shown = Math.min(c, MAXDOTS);
      for (var j = 0; j < shown; j++) {
        var cls = j < y ? "you" : j === MAXDOTS - 1 && c > MAXDOTS ? "more" : "";
        dots += "<i" + (cls ? ' class="' + cls + '"' : "") + ' style="--i:' + (k++) + '"></i>';
      }
      return '<div class="pulse-col" title="' + c + " " + plural(c, "mention", "mentions") + (y ? ", " + y + " for you" : "") + '">' + dots + "</div>";
    }).join("");
    var startWords = start ? (step >= 24 ? start.toLocaleDateString([], { weekday: "short" }) : start.toLocaleDateString([], { weekday: "short" }) + " " + clock(start)) : "";
    return '<div class="pulse" aria-hidden="true"><div class="pulse-row">' + cols + "</div>" +
      '<div class="pulse-legend"><span>' + esc(startWords) + '</span><span class="key"><i></i>wants you</span><span>' + esc(clock(writtenAt(state.data.generatedAt) || new Date())) + "</span></div></div>";
  }

  function faceHtml(who) {
    var name = who.name || who.username || "?";
    var pic = who.pic && PIC.test(who.pic) ? '<img src="' + esc(who.pic) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : "";
    return '<div class="face" style="background:' + colorFor(name) + '" aria-hidden="true">' + esc(initials(name)) + pic + "</div>";
  }

  function ctxHtml(item, me) {
    if (item.kind === "reply") return '<p class="ctx">Replying to <a href="https://x.com/' + esc(me) + '" target="_blank" rel="noopener">@' + esc(me) + "</a></p>";
    if (item.kind === "quote") return '<p class="ctx">Quoted your post</p>';
    return "";
  }

  function aboutHtml(item, me) {
    var a = item.about && typeof item.about === "object" && text(item.about.text, 400) ? item.about : null;
    if (!a) return "";
    var name = state.data.person && text(state.data.person.name, 40);
    var link = xLink(a.link);
    var inner = '<div class="post-head"><span class="mini" aria-hidden="true">' + esc(initials(name || me)) + '</span><span class="name">' + esc(name || "You") +
      '</span><span class="handle">@' + esc(me) + "</span>" + (a.at ? '<span class="dotsep">·</span><span class="ago">' + esc(xAgo(a.at, refDate())) + "</span>" : "") + "</div>" +
      '<p dir="auto">' + postText(text(a.text, 400)) + "</p>";
    return link ? '<a class="quoted" style="display:block;color:inherit;text-decoration:none" href="' + esc(link) + '" target="_blank" rel="noopener">' + inner + "</a>"
      : '<div class="quoted">' + inner + "</div>";
  }

  function ringHtml(len) {
    var r = 9, c = 2 * Math.PI * r;
    var part = Math.min(1, len / REPLY_MAX);
    var cls = len > REPLY_MAX ? "over" : len > REPLY_MAX - 20 ? "near" : "";
    return '<svg class="ring ' + cls + '" viewBox="0 0 22 22" aria-hidden="true"><circle class="track" cx="11" cy="11" r="' + r + '"/>' +
      '<circle class="fill" cx="11" cy="11" r="' + r + '" stroke-dasharray="' + (c * part).toFixed(1) + " " + c.toFixed(1) + '"/></svg>';
  }
  function leftHtml(len) {
    var left = REPLY_MAX - len;
    return left <= 20 ? '<span class="left' + (left < 0 ? " over" : "") + '">' + left + "</span>" : '<span class="left"></span>';
  }
  function draftOf(item) { return Object.prototype.hasOwnProperty.call(state.drafts, rowKey(item)) ? state.drafts[rowKey(item)] : text(item.reply, 600); }

  function postHtml(item, me) {
    var who = item.who && typeof item.who === "object" ? item.who : {};
    var key = rowKey(item);
    var link = xLink(item.link);
    var m = item.metrics && typeof item.metrics === "object" ? item.metrics : {};
    var draft = draftOf(item);
    var len = draft.length;
    var id = "draft-" + String(key).replace(/[^A-Za-z0-9_-]/g, "");
    return '<article class="post" data-key="' + esc(key) + '">' + faceHtml(who) + "<div>" +
      '<div class="post-head"><span class="name">' + esc(text(who.name, 60) || "Someone on X") + "</span>" +
      (who.verified ? '<svg class="verified" viewBox="0 0 22 22" aria-label="Verified"><use href="#i-verified"/></svg>' : "") +
      '<span class="handle">@' + esc(text(who.username, 30)) + '</span><span class="dotsep">·</span>' +
      (link ? '<a class="ago" href="' + esc(link) + '" target="_blank" rel="noopener" style="color:var(--ink-2)">' + esc(xAgo(item.at, refDate())) + "</a>" : '<span class="ago">' + esc(xAgo(item.at, refDate())) + "</span>") +
      (item.urgent ? '<span class="today">Today</span>' : "") + "</div>" +
      ctxHtml(item, me) +
      '<p class="said" dir="auto">' + postText(text(item.said, 600)) + "</p>" +
      aboutHtml(item, me) +
      '<div class="metrics" aria-label="On X">' +
      "<span>" + icon("i-reply") + compact(num(m.replies)) + "</span><span>" + icon("i-repost") + compact(num(m.reposts)) + "</span>" +
      "<span>" + icon("i-heart") + compact(num(m.likes)) + "</span>" + (num(m.views) ? "<span>" + icon("i-views") + compact(num(m.views)) + "</span>" : "") + "</div>" +
      (text(item.gist, 200) ? '<p class="wants">' + icon("i-cabinet") + "<span>" + esc(text(item.gist, 200)) + "</span></p>" : "") +
      '<div class="composer"><label for="' + id + '">Your reply, not posted yet</label>' +
      '<textarea id="' + id + '" data-draft="' + esc(key) + '" rows="2" dir="auto">' + esc(draft) + "</textarea>" +
      '<div class="composer-foot"><span class="hint">' + (/\[[^\]]+\]/.test(draft) ? "Fill in the [brackets] first" : "Edit it here, or on X") + "</span>" +
      '<span class="count" data-count="' + esc(key) + '">' + ringHtml(len) + leftHtml(len) + "</span>" +
      '<button type="button" class="btn quiet" data-act="done" data-key="' + esc(key) + '">Done</button>' +
      '<button type="button" class="btn" data-act="copy" data-key="' + esc(key) + '">' + icon("i-copy") + "Copy</button>" +
      '<button type="button" class="btn x" data-act="reply" data-key="' + esc(key) + '"' + (len > REPLY_MAX || !len ? " disabled" : "") + ">Reply on X</button>" +
      "</div></div></div></article>";
  }

  function feedHtml() {
    var me = (state.data.person && text(state.data.person.username, 30).replace(/^@/, "")) || (state.x && state.x.account && String(state.x.account.label || "").replace(/^@/, "")) || "you";
    var rows = waiting();
    var all = list(state.data.waiting).length;
    var t = totals();
    var shown = state.showAll ? rows : rows.slice(0, SHOW_ROWS);
    var body = rows.length
      ? shown.map(function (w) { return postHtml(w, me); }).join("") +
        (rows.length > shown.length ? '<div class="more-row"><button class="btn" data-act="show-all">Show ' + (rows.length - shown.length) + " more</button></div>" : "")
      : '<div class="empty-feed"><h3>' + (all ? "You answered everyone. Nice." : "Nobody is waiting for you.") + "</h3><p>" +
        (num(t.mentions) ? num(t.mentions) + " " + plural(num(t.mentions), "post", "posts") + " mentioned you, and none of them asks you anything." : "No one mentioned you since the last morning.") + "</p></div>";
    return '<section class="feed" aria-labelledby="feed-title"><header class="feed-head"><h2 id="feed-title">Waiting on you</h2>' +
      (rows.length ? '<span class="n">' + rows.length + "</span>" : "") +
      '<span class="sub">Oldest wait first' + (state.example ? ", made up" : "") + "</span></header>" + body + boxIdeaHtml("waiting") + "</section>";
  }

  // ── Layout ─────────────────────────────────────────────────────────────

  function cleanLayout(value) {
    if (!value || typeof value !== "object" || !Array.isArray(value.order)) return null;
    var order = value.order.filter(function (id, i, all) { return BOXES[id] && all.indexOf(id) === i; });
    Object.keys(BOXES).forEach(function (id) { if (order.indexOf(id) < 0) order.push(id); });
    var off = {};
    if (value.off && typeof value.off === "object") Object.keys(value.off).forEach(function (id) { if (BOXES[id] && !BOXES[id].fixed && value.off[id]) off[id] = true; });
    return { order: order, off: off };
  }
  function layout() { return state.layout || cleanLayout(DEFAULT_LAYOUT); }
  function columnIds(col) {
    var l = layout();
    var ids = l.order.filter(function (id) { return BOXES[id].col === col; });
    // Waiting on you always opens the middle, Ask always closes the side.
    ids.sort(function (a, b) { return (a === "waiting" ? -1 : a === "ask" ? 1 : 0) - (b === "waiting" ? -1 : b === "ask" ? 1 : 0); });
    return ids;
  }
  function saveLayout(next) {
    state.layout = cleanLayout(next);
    remember(LAYOUT_KEY, state.layout);
    paintPage();
  }
  function moveBox(id, step) {
    var l = layout();
    var col = columnIds(BOXES[id].col).filter(function (x) { return !BOXES[x].fixed; });
    var i = col.indexOf(id);
    var j = i + step;
    if (i < 0 || j < 0 || j >= col.length) return;
    var other = col[j];
    var order = l.order.slice();
    var a = order.indexOf(id), b = order.indexOf(other);
    order[a] = other; order[b] = id;
    saveLayout({ order: order, off: l.off });
  }
  function setBoxOff(id, off) {
    var l = layout();
    var next = {};
    Object.keys(l.off).forEach(function (k) { next[k] = true; });
    if (off) next[id] = true; else delete next[id];
    saveLayout({ order: l.order, off: next });
    toast(off ? BOXES[id].title + " is off your page." : BOXES[id].title + " is on your page.");
  }

  function toolsHtml(id) {
    if (BOXES[id].fixed) return "";
    var col = columnIds(BOXES[id].col).filter(function (x) { return !BOXES[x].fixed && !layout().off[x]; });
    var i = col.indexOf(id);
    return '<span class="box-tools">' +
      '<button type="button" class="tool" data-act="box-up" data-box="' + id + '" aria-label="Move ' + esc(BOXES[id].title) + ' up"' + (i <= 0 ? " disabled" : "") + ">" + icon("i-up") + "</button>" +
      '<button type="button" class="tool" data-act="box-down" data-box="' + id + '" aria-label="Move ' + esc(BOXES[id].title) + ' down"' + (i >= col.length - 1 ? " disabled" : "") + ">" + icon("i-down") + "</button>" +
      '<button type="button" class="tool hide" data-act="box-off" data-box="' + id + '">Hide</button></span>';
  }
  function boxHead(id, count, sub) {
    return '<header class="box-head"><h2 id="h-' + id + '">' + esc(BOXES[id].title) + "</h2>" +
      (count ? '<span class="n">' + count + "</span>" : "") + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") + toolsHtml(id) + "</header>";
  }
  function offeredHtml(id) {
    return '<div class="offered"><div><h3>' + esc(BOXES[id].title) + "</h3><p>" + esc(BOXES[id].about) + "</p></div>" +
      '<button type="button" class="btn" data-act="box-on" data-box="' + id + '">Add to page</button></div>';
  }
  /** The idea that belongs to a box, at its foot. */
  function boxIdeaHtml(id) {
    if (state.editing || !canAsk()) return "";
    var idea = null;
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].box === id) { idea = IDEAS[i]; break; }
    if (!idea) return "";
    return '<div class="box-idea">' + icon("i-bulb") + "<span>" + esc(idea.title) + "</span>" +
      '<button type="button" class="btn" data-act="idea-now" data-idea="' + idea.id + '">Ask</button></div>';
  }

  // ── The boxes ──────────────────────────────────────────────────────────

  function me() {
    return (state.data.person && text(state.data.person.username, 30).replace(/^@/, "")) ||
      (state.x && state.x.account && String(state.x.account.label || "").replace(/^@/, "")) || "you";
  }
  function metricsHtml(m, quotes) {

    return '<div class="metrics" aria-label="On X">' +
      "<span>" + icon("i-reply") + compact(num(m.replies)) + "</span><span>" + icon("i-repost") + compact(num(m.reposts)) + "</span>" +

  function postsBox() {
    var rows = list(state.data.posts);

  function quotedBox() {

        '<span class="handle">@' + esc(text(who.username, 30)) + '</span><span class="dotsep">·</span><span class="ago">' + esc(xAgo(q.at, refDate())) + "</span></div>" +
        '<p class="said" dir="auto">' + postText(text(q.said, 500)) + "</p>" + metricsHtml(q.metrics) +

  function skipBox() {

      (ex.length ? '<ul class="skip-ex">' + ex.map(function (e) {

  function askBox() {

    }).join("") + '<button type="button" class="idea" data-act="ideas" style="border-style:dashed">More ideas</button></div>' : "";
    return '<section class="ask" aria-labelledby="ask-title"><h2 id="ask-title">Ask about your X</h2>' +
      '<form id="ask-form"><textarea id="ask-input" placeholder="Who asked me something this week?" aria-label="Ask about your X"></textarea>' +
      '<button type="submit" class="btn send">Ask</button><p class="note" id="ask-note">' + esc(state.askNote) + "</p></form>" + chips + "</section>";
  }

  var DRAW = { waiting: feedHtml, posts: postsBox, quoted: quotedBox, stats: statsBox, regulars: regularsBox, skip: skipBox, ask: askBox };

  function columnHtml(col) {
    var off = layout().off;
    var on = columnIds(col).filter(function (id) { return !off[id]; }).map(function (id) { return DRAW[id](); });
    var offered = state.editing ? columnIds(col).filter(function (id) { return off[id]; }).map(offeredHtml) : [];
    return '<div class="col' + (col === "rail" ? " rail" : "") + '">' + on.join("") + offered.join("") + "</div>";
  }

  function editBarHtml() {
    if (!state.editing) return "";
    return '<div class="edit-bar" role="region" aria-label="Edit layout">' + icon("i-layout") +
      "<p><b>Edit layout.</b> Move boxes up or down, hide the ones you don’t need, and add others from the dashed cards. It is saved for you only.</p>" +
      '<button type="button" class="btn quiet" data-act="layout-reset">Reset</button>' +
      '<button type="button" class="btn x" data-act="layout-done">Done</button></div>';
  }

  function drawerHtml() {
    if (!state.drawerOpen) return "";
    var can = canAsk();
    return '<div class="drawer-back" data-act="drawer-close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="ideas-title">' +
      '<div class="drawer-head"><h2 id="ideas-title">Ideas for your X</h2><button type="button" class="tool" data-act="drawer-close" aria-label="Close">' + icon("i-close") + "</button></div>" +
      "<p>Ask once now, or set it up to happen by itself. Each one reads X when it runs, so it uses a little of your X credits. Nothing is ever posted.</p>" +
      IDEAS.map(function (idea) {
        return '<div class="idea-card"><h3>' + esc(idea.title) + "</h3><p>" + esc(idea.text) + "</p>" +
          '<div class="go"><button type="button" class="btn cab" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">Ask now</button>" +
          '<button type="button" class="btn" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button></div></div>";
      }).join("") + "</aside>";
  }

  function paintPage() {
    var el = $("page");
    var reading = (state.running && state.example) || revealing();
    if (!state.loaded || !state.data || reading) { el.innerHTML = ""; return; }
    var focus = document.activeElement && document.activeElement.id;
    var caret = focus && document.activeElement.selectionStart;
    el.innerHTML = nightHtml() + editBarHtml() + '<div class="columns' + (state.editing ? " editing" : "") + '" style="margin-top:16px">' +
      columnHtml("main") + columnHtml("rail") + "</div>" + drawerHtml();
    state.entered = true;
    if (focus && $(focus)) { $(focus).focus(); try { $(focus).setSelectionRange(caret, caret); } catch (e) { /* not a text field */ } }
  }

  function paint() {
    document.documentElement.classList.toggle("first-read", !!((state.running && (state.example || !state.data)) || revealing()));
    paintHero();
    paintGiftKeep();
    paintWelcome();
    paintRibbon();
    paintPage();
  }

  // ── Presses ────────────────────────────────────────────────────────────

  function findRow(key) {
    var all = state.data ? list(state.data.waiting) : [];
    for (var i = 0; i < all.length; i++) if (String(rowKey(all[i])) === String(key)) return all[i];
    return null;
  }
  function plainReply(value) { return String(value).replace(/\[([^\]]{1,160})\]/g, "$1").trim(); }

  document.addEventListener("input", function (event) {
    var area = event.target;
    if (!area || !area.dataset || !area.dataset.draft) return;
    var key = area.dataset.draft;
    state.drafts[key] = area.value;
    var len = area.value.length;
    var count = document.querySelector('[data-count="' + CSS.escape(key) + '"]');
    if (count) count.innerHTML = ringHtml(len) + leftHtml(len);
    var post = area.closest(".post");
    var btn = post && post.querySelector('[data-act="reply"]');
    if (btn) btn.disabled = len > REPLY_MAX || !len;
    var hint = post && post.querySelector(".hint");
    if (hint) hint.textContent = /\[[^\]]+\]/.test(area.value) ? "Fill in the [brackets] first" : "Edit it here, or on X";
  });

  document.addEventListener("click", function (event) {
    var el = event.target.closest("[data-act]");
    if (!el) return;
    var act = el.dataset.act;
    if (act === "connect") connect();
    else if (act === "run") runNow();
    else if (act === "show-all") { state.showAll = true; paintPage(); }
    else if (act === "idea-now") { var idea = ideaById(el.dataset.idea); if (idea) { closeDrawer(); ask(idea.ask); } }
    else if (act === "idea-routine") {
      var r = ideaById(el.dataset.idea);
      if (r) { closeDrawer(); ask("Set this up as a routine that runs " + r.at + ": " + r.ask + " Show me the routine so I can approve it before it starts."); }
    }
    else if (act === "ideas") { state.drawerOpen = true; paintPage(); var close = document.querySelector('.drawer [data-act="drawer-close"]'); if (close) close.focus(); }
    else if (act === "drawer-close") closeDrawer();
    else if (act === "layout") { state.editing = true; paintPage(); }
    else if (act === "layout-done") { state.editing = false; paintPage(); }
    else if (act === "layout-reset") { saveLayout(DEFAULT_LAYOUT); toast("Back to the first layout."); }
    else if (act === "box-up") moveBox(el.dataset.box, -1);
    else if (act === "box-down") moveBox(el.dataset.box, 1);
    else if (act === "box-off") setBoxOff(el.dataset.box, true);
    else if (act === "box-on") setBoxOff(el.dataset.box, false);
    else if (act === "copy" || act === "reply" || act === "done") {
      var row = findRow(el.dataset.key);
      if (!row) return;
      var draft = draftOf(row);
      if (act === "copy") copyText(plainReply(draft), "Reply copied. Paste it under the post on X.");
      else if (act === "done") {
        state.done[rowKey(row)] = new Date().toISOString();
        remember(DONE_KEY, state.done);
        toast("Marked done. It stays off this page.");
        paintPage();
      } else {
        if (/\[[^\]]+\]/.test(draft)) {
          toast("Fill in the [brackets] first, then press Reply on X.");
          var area = document.querySelector('[data-draft="' + CSS.escape(String(rowKey(row))) + '"]');
          if (area) { area.focus(); var at = draft.indexOf("["); area.setSelectionRange(at, draft.indexOf("]", at) + 1); }
          return;
        }
        if (state.example) { toast("This is a made-up post. Connect X to reply to your own."); return; }
        var url = "https://x.com/intent/post?in_reply_to=" + encodeURIComponent(row.postId) + "&text=" + encodeURIComponent(draft.trim());
        window.open(url, "_blank", "noopener");
        toast("X opens with your reply. Press Post there when it looks right.");
      }
    } else if (act === "gift-do") {
      var g = state.reading && state.reading.gift;
      if (!g) return;
      var askWords = g.kind === "waiting"
        ? "Write a reply to @" + g.username + " on X. They wrote: \"" + g.said + "\". Read the thread first. Write it the way I write on X, under 280 characters, with [brackets] for anything I need to decide. Show it to me here. Never post anything."
        : IDEAS[1].ask;
      state.giftAsked = g.at;
      giftDone(g);
      ask(askWords);
      paint();
    } else if (act === "gift-skip") {
      var gs = state.reading && state.reading.gift;
      if (gs) giftDone(gs);
      paintGiftKeep();
    } else if (act === "profile-ok" || act === "profile-fix") {
      if (state.profile) { state.profileSeen = state.profile.at; remember(PROFILE_SEEN_KEY, state.profile.at); }
      if (act === "profile-fix") ask("You read my X and learned some things about me. Some of it is not right. Ask me what to fix, then remember it.");
      paintWelcome();
    }
  });

  function closeDrawer() {
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    paintPage();
  }
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (state.drawerOpen) closeDrawer();
    else if (state.editing) { state.editing = false; paintPage(); }
  });

  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paint();
  if (V2) {
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var saved = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (saved) state.layout = saved;
      var seen = mine ? mine.get(PROFILE_SEEN_KEY) : null;
      if (typeof seen === "string") state.profileSeen = seen;
      var giftSeen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof giftSeen === "string") state.giftDone = giftSeen;
      var done = mine ? mine.get(DONE_KEY) : null;
      var fresh = new Date(Date.now() - 14 * DAY_MS);
      if (done && typeof done === "object") Object.keys(done).forEach(function (k) {
        var at = parseTime(done[k]);
        if (at && at >= fresh) state.done[k] = done[k];
      });
      state.mineReady = true;
      paint();
    }).catch(function () {});
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    cab.connectors.list().then(function (items) {
      state.x = pickX(items) || { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    }).catch(function () {
      state.x = { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    });
    cab.connectors.onChange(function (items) { var x = pickX(items); if (x) { state.x = x; paint(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    state.mineReady = true;
    load();
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
  }
})();
</script>
</body>
</html>
