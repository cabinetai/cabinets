id: morning-x-mentions
name: Morning X Mentions
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: mentions-reader
agentSlug: mentions-reader
timeout: 600
prompt: |-
  Write this morning's page of mentions.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-x-summary.md` — the local time you ran,
  then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Needs you` vocabulary, the ordering, and what to do with abuse and
     spam. This prompt does not repeat them.
  2. With your X tools, search the last 24 hours of mentions, replies and quotes directed
     at the connected account, and read enough of each thread to say what the person
     wants. The user's own timeline is out of scope — do not read the feed.
  3. This run is read only. Do not publish a post or a reply, do not bookmark anything and
     do not touch a list, however obvious the one-line answer looks.
  4. If you have no X tool, or X is not connected, or the call fails, STOP HERE. Write
     nothing. Leave `daily-summaries/` exactly as you found it, example and all. Report:
     "X is not reachable. I would have read the last 24 hours of mentions and replies
     aimed at the account and written one row per mention." Then exit.
  5. On the first run that does reach X, write your dated file and then delete
     `daily-summaries/EXAMPLE-x-summary.md`. It is a demo, not a past summary, and it must
     not sit in the date list beside real ones. Do not merge with it, do not rename it,
     and never write `EXAMPLE` into a name of your own.
