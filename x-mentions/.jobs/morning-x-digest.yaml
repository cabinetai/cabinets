id: morning-x-digest
name: Morning X Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: x-reader
agentSlug: x-reader
timeout: 900
prompt: |-
  Catch up on X for the Catch up app.

  Your working directory is the cabinet root. Your persona holds the rules: who is waiting,
  the helper's commands, and every field the page reads. X is read and every file the page
  reads is written through `node catch-up/first-sort.mjs` (from the cabinet root, never `cd`).
  Every X read costs the person money: do not call the X API any other way.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `catch-up/setup.md`, and run `ls catch-up/data/profile.json`.
  2. If your X line says X is not connected, run the helper's `fail` with
     'X is not connected. Press Connect X.' and stop.
  3. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  4. If the helper exits 2 or 4, it already wrote why: stop. If anything else fails after
     `start`, still run `done`.

  Only read X: never post, reply, like, repost, follow or send anything.

  Finish in one or two plain sentences and nothing else: how many people wait for an answer,
  the one that matters most this morning, and what the reading cost.
