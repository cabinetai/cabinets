id: weekly-market-read
name: Weekly market read
enabled: true
schedule: 0 20 * * 6
provider: claude-code
adapterType: claude_local
ownerAgent: apartment-scout
agentSlug: apartment-scout
timeout: 1500
prompt: |-
  Write this week's market read for the person's search, and check the places they saved.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-it-works.md` and `playbooks/method.md`.
  2. Read `search/brief.md`. If it does not exist, or its `status` is not `ready`, write
     nothing and finish with: "Tell me what you are looking for first. Press I want to rent
     or I want to buy on the map." Stop there. Otherwise read the playbook for the brief's `country`
     (`playbooks/israel.md` or `playbooks/united-states.md`).
  3. Read `hunt/.data/shared.json`, every file in `listings/` that does not start with
     `EXAMPLE-`, and every run in `search/runs.json` from the last 7 days. Read a file that
     does not exist as empty.
  4. For each listing the person saved: open its ad. Mark it `gone` only when you saw the ad
     taken down or the apartment let. If the page is blocked, refuses you or times out, leave
     its `status` and name the site in the run. Note any price change in its file.
  5. For each of the person's areas, find this week's fair price for what they want: Madlan's
     area figures (Madlan in Israel; Zillow, Redfin or StreetEasy in the US), the live ads
     you saw this week, and for buying, real sales since last year (nadlan.gov.il in Israel,
     public records in the US). Name each source and how many you compared.
  6. Read the person's reasons for passing this week. If they show a pattern, propose one
     change to the brief. Do not make it; ask.
  7. Write `search/market.md`, in the person's language, with this frontmatter on top:
     `title`, `updated` (today, YYYY-MM-DD) and `headline` (one sentence). Then: what places
     like theirs cost now in each area, and against last week if there is a last week; how
     fast the good ones went; whether the budget fits the brief, honestly; one change that
     would find better places, if there is one.
  8. Add a run with `kind: market` to `search/runs.json`. Create the file if it does not
     exist.

  Finish in three or four plain sentences: what the money buys now, what moved this week,
  and the one thing worth changing or doing.
