id: find-apartments
name: Find apartments
enabled: true
schedule: 0 8,19 * * 0-5
provider: claude-code
adapterType: claude_local
ownerAgent: apartment-scout
agentSlug: apartment-scout
timeout: 1800
prompt: |-
  Search for apartments that fit the person's brief and put the ones worth seeing on the map.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-it-works.md` and `playbooks/method.md`, in full.
  2. Read `search/brief.md`. If it does not exist, or its `status` is not `ready`, write
     nothing and finish with: "Tell me what you are looking for first. Press Start on the
     map." Stop there.
  3. Read `hunt/.data/shared.json` (it may not exist yet), every file in `listings/` that does
     not start with `EXAMPLE-`, and the newest three runs in `search/runs.json`.
  4. Follow `playbooks/method.md` from step 1 to step 9. Search every site that has ads in the
     person's areas, newest first, back to the last run. Open and read every ad that passes
     the site's filters. Gate, score, check the fair price, and run the smell test.
  5. Write a listing file for each apartment that scores 50 or more and is not on the map yet.
     Update the ones already on the map whose price or state changed. Mark `gone` the ones
     whose ad is down.
  6. Add this run to `search/runs.json`, with every site and whether it worked.

  Every number comes from an ad you opened or a source you name. Never sign in, never pay,
  never send a message.

  Finish with the answer from step 10 of the method, in the person's language. This is what
  the person reads first.
