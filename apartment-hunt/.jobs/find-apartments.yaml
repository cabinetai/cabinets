id: find-apartments
name: Find apartments
enabled: true
schedule: 0 8,19 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: apartment-scout
agentSlug: apartment-scout
timeout: 1800
prompt: |-
  Search for apartments that fit the person's brief and put the ones worth seeing on the map.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-it-works.md` and `playbooks/method.md`, in full.
  2. Read `search/brief.md`. If it does not exist, or its `status` is not `ready`, write
     nothing and finish with: "Tell me what you are looking for first. Press I want to rent
     or I want to buy on the map." Stop there. Otherwise read the playbook for the brief's `country`
     (`playbooks/israel.md` or `playbooks/united-states.md`).
  3. Read `hunt/.data/shared.json`, every file in `listings/` that does not start with
     `EXAMPLE-`, and the newest three runs in `search/runs.json`. Neither file exists before
     the person's first action and the first search: read a missing one as empty.
  4. Follow `playbooks/method.md` from step 1 to step 9. Search every site that has ads in the
     person's areas, newest first, as far back as "Every search" in the method says for each
     site. Open and read every ad that passes the site's filters. Gate, score, check the
     fair price, and run the smell test.
  5. Write a listing file for each apartment that scores 50 or more and is not on the map yet.
     Update the ones already on the map whose price or state changed. Mark `gone` only the
     ones whose ad you saw taken down, never one whose page you could not open.
  6. Add this run to `search/runs.json`, with every site and whether it worked. Create the
     file if it does not exist.

  Every number comes from an ad you opened or a source you name. Never sign in, never pay,
  never send a message.

  Finish with the answer from step 10 of the method, in the person's language. This is what
  the person reads first.
