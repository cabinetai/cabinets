<!DOCTYPE html>
<!--
  Apartment Hunt: the places worth seeing, as pins on a map. The cabinet opens here.

  What it reads (all through window.cabinet.files, written by the Apartment Scout):
    search/brief.md     what the person is looking for (frontmatter + words)
    listings/*.md       one apartment each (frontmatter + "Why it fits", "Watch out", "Ask before you visit")
    search/runs.json    what each search looked at and found
    search/market.md    the weekly market read
  While search/brief.md does not exist the EXAMPLE- versions show instead, labelled.

  What it writes: only what the person does with a listing (save, contacted, visit, not for
  me and why), in the app's store (window.cabinet.store, kept by Cabinet in hunt/.data/shared.json)
  under "l:<listing file name>". The Scout reads it before every search.
  playbooks/how-it-works.md is the same contract in words.

  Two countries: Israel and the United States. The brief's `country` decides the money, the
  units (m² or sq ft, rooms or bedrooms, km or mi) and which example set shows before it exists.

  The map is MapLibre (from a CDN) drawing VersaTiles (free and open, no key, OpenStreetMap
  data), with labels in the page's language where the map has them. If MapLibre cannot
  start, the list works alone. One file on purpose: a sealed
  frame cannot load files next to it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apartment Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F5F1; --surface: #FFFFFF; --surface-muted: #F4F1EC; --surface-press: #EAE6DF;
    --ink: #1D2024; --ink-2: #41464D; --ink-muted: #70757C;
    --brand: #0F5A5E; --brand-deep: #0A4245; --on-brand: #FFFFFF; --brand-tint: #E3F0EF;
    --border: #E3DFD7; --border-soft: rgba(227,223,215,.75);
    --top: #23845A; --good: #3566B0; --maybe: #B47A1F; --gone: #9AA0A8; --anchor: #22262B;
    --ok: #23845A; --ok-tint: #E5F3EB; --warn: #A86A12; --warn-tint: #FBF1DD; --bad: #BF3B2B; --bad-tint: #FBEAE6;
    --on-pin: #FFFFFF;
    --radius: 18px;
    --shadow-1: 0 1px 2px rgba(40,32,24,.06), 0 6px 18px -10px rgba(40,32,24,.2);
    --shadow-2: 0 2px 4px rgba(40,32,24,.08), 0 18px 40px -16px rgba(40,32,24,.34);
    --font: Geist, Heebo, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --ring: 0 0 0 3px rgba(15,90,94,.25);
    --ease: cubic-bezier(.23, 1, .32, 1);
    --map-bg: #ECE7DE;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #121416; --surface: #1B1E21; --surface-muted: #222528; --surface-press: #2B2F33;
    --ink: #ECEDEE; --ink-2: #C8CBCF; --ink-muted: #969BA2;
    --brand: #7CC7C4; --brand-deep: #A3DAD7; --on-brand: #0B2526; --brand-tint: #17302F;
    --border: #33373B; --border-soft: rgba(70,74,80,.6);
    --top: #5EC08F; --good: #80A6E3; --maybe: #DDAA5C; --gone: #6E747C; --anchor: #E6E8EA;
    --ok: #5EC08F; --ok-tint: #16301F; --warn: #E5B866; --warn-tint: #33290F; --bad: #FF8E7E; --bad-tint: #3A1C18;
    --on-pin: #111416;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
    --shadow-2: 0 2px 4px rgba(0,0,0,.35), 0 18px 40px -16px rgba(0,0,0,.8);
    --ring: 0 0 0 3px rgba(124,199,196,.35);
    --map-bg: #1B1C1D;
    color-scheme: dark;
  }
  :root[lang="he"] { --font: Heebo, Geist, system-ui, -apple-system, "Segoe UI", sans-serif; --serif: Heebo, Georgia, serif; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ── Frame ─────────────────────────────────────────────────────────────── */
  #app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; flex-wrap: wrap; }
  .brand { min-width: 0; margin-inline-end: auto; display: flex; align-items: center; gap: 10px; }
  .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex: none; }
  .mark svg { width: 20px; height: 20px; }
  .brand h1 { margin: 0; font: 600 22px/1.15 var(--serif); letter-spacing: -.02em; }
  .brand p { margin: 2px 0 0; color: var(--ink-muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }
  .brand p b { color: var(--ink-2); font-weight: 600; }
  .brand > div { min-width: 0; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .16s var(--ease), background .16s, border-color .16s; }
  .btn:hover { background: var(--surface-muted); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-1); }
  .btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { background: var(--surface-press); }
  .btn.small { min-height: 32px; padding: 4px 11px; font-size: 13.5px; border-radius: 10px; }
  .btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.wide { width: 100%; }
  .btn[disabled] { opacity: .55; cursor: default; transform: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-press); color: var(--ink-2); white-space: nowrap; }
  .tag.ex { background: var(--warn-tint); color: var(--warn); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  .mapwrap { position: relative; min-height: 0; margin-inline-start: 14px; margin-bottom: 14px; border-radius: 22px; overflow: hidden; background: var(--map-bg); box-shadow: var(--shadow-2); border: 1px solid var(--border-soft); isolation: isolate; }
  .rail { min-height: 0; overflow-y: auto; padding: 0 14px 28px; scrollbar-width: thin; }

  /* ── The map ───────────────────────────────────────────────────────────── */
  #map { position: absolute; inset: 0; }
  #map canvas { outline: none; }
  .map-ui { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .map-ui > * { pointer-events: auto; }
  .ctrl { position: absolute; inset-inline-end: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .ctrl button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-1); }
  .ctrl button:hover { background: var(--surface-muted); }
  .legend { position: absolute; inset-inline-start: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow-1); font-size: 12.5px; font-weight: 600; color: var(--ink-2); backdrop-filter: blur(6px); }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .attr { position: absolute; inset-inline-end: 8px; bottom: 6px; font-size: 10.5px; color: var(--ink-muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 1px 6px; border-radius: 6px; }
  .attr a { color: inherit; text-decoration: none; }
  .map-off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-muted); }
  .pin, .anchor { border: 0; background: none; padding: 0; }
  .pin-in { position: relative; display: flex; align-items: center; gap: 5px; transform: translate(-50%, calc(-100% - 9px)); transform-origin: 50% calc(100% + 9px); padding: 4px 10px 4px 5px; border-radius: 999px; background: var(--c); color: var(--on-pin); font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: 0 1px 2px rgba(20,16,12,.25), 0 8px 18px -8px rgba(20,16,12,.55); transition: transform .22s var(--ease), box-shadow .22s; animation: drop .5s var(--ease) both; animation-delay: var(--d, 0ms); }
  [dir="rtl"] .pin-in { padding: 4px 5px 4px 10px; }
  .pin-in::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 11px; height: 11px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 0 0 3px 0; z-index: -1; }
  .pin-ic { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
  :root[data-theme="dark"] .pin-ic { background: rgba(0,0,0,.14); }
  .pin-ic svg { width: 13px; height: 13px; stroke-width: 2.3; }
  .pin.example .pin-in { opacity: .92; }
  .pin:hover, .pin.sel { z-index: 5; }
  .pin:hover .pin-in { transform: translate(-50%, calc(-100% - 9px)) scale(1.07); }
  .pin.sel .pin-in { transform: translate(-50%, calc(-100% - 9px)) scale(1.14); box-shadow: 0 0 0 3px var(--surface), 0 12px 26px -8px rgba(20,16,12,.6); }
  .pin.dim .pin-in { opacity: .35; }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, calc(-100% - 30px)); } }
  .anchor-in { display: flex; align-items: center; gap: 6px; transform: translate(-50%, -50%); padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--anchor); color: var(--bg); font-size: 12.5px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow-1); }
  [dir="rtl"] .anchor-in { padding: 4px 4px 4px 10px; }
  .anchor-in span.dot { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); color: var(--anchor); display: grid; place-items: center; }
  .anchor-in svg { width: 12px; height: 12px; stroke-width: 2.4; }
  .hover { position: absolute; left: 0; top: 0; width: 280px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-2); border: 1px solid var(--border-soft); padding: 12px 14px; pointer-events: none; opacity: 0; transition: opacity .14s; z-index: 6; }
  .hover.show { opacity: 1; }
  .hover h3 { margin: 0 0 2px; font-size: 14.5px; line-height: 1.3; }
  .hover .price { font-weight: 700; font-size: 17px; }
  .hover p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }

  /* ── The rail ──────────────────────────────────────────────────────────── */
  .card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font: 600 18px/1.25 var(--serif); letter-spacing: -.01em; }
  .card p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; }
  .start { background: linear-gradient(160deg, var(--brand-tint), var(--surface) 70%); }
  .start h2 { font-size: 22px; }
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-press); border-radius: 13px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 7px 8px; font-weight: 600; font-size: 14px; color: var(--ink-muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .start .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .muted { color: var(--ink-muted); font-size: 13px; }
  .brief-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--border-soft); font-size: 13px; color: var(--ink-2); }
  .chip.must { background: var(--brand-tint); border-color: transparent; color: var(--brand-deep); font-weight: 600; }
  :root[data-theme="dark"] .chip.must { color: var(--brand); }
  .chip.no { background: var(--bad-tint); border-color: transparent; color: var(--bad); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .card-head h2 { margin: 0; }
  .run { display: flex; gap: 10px; align-items: flex-start; }
  .dotline { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .dotline span { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-muted); }
  .dotline i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dotline i.bad { background: var(--bad); }
  .busy { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-press); border-radius: 13px; margin: 4px 0 12px; position: sticky; top: 0; z-index: 2; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 7px 8px; font-weight: 600; font-size: 13.5px; color: var(--ink-muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .tabs b { font-size: 12px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--surface-muted); color: var(--ink-2); }
  .tabs button.on b { background: var(--brand-tint); color: var(--brand-deep); }

  .item { position: relative; display: block; width: 100%; text-align: start; border: 1px solid var(--border-soft); background: var(--surface); border-radius: 16px; padding: 13px 14px 12px; margin-bottom: 9px; box-shadow: var(--shadow-1); transition: border-color .16s, transform .16s var(--ease); overflow: hidden; }
  .item::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px; background: var(--c); }
  .item:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
  .item:active { transform: scale(.99); }
  .item.hot { border-color: var(--c); }
  .item .l1 { display: flex; align-items: baseline; gap: 8px; }
  .item .price { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .item .per { color: var(--ink-muted); font-size: 12.5px; font-weight: 500; }
  .item .score { margin-inline-start: auto; font-weight: 700; font-size: 13px; color: var(--c); display: inline-flex; align-items: center; gap: 4px; }
  .item .h3, .item .meta, .item .why { display: block; }
  .item .h3 { margin: 2px 0 1px; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .item .meta { color: var(--ink-muted); font-size: 13px; }
  .item .why { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .foot { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .f { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--ok-tint); color: var(--ok); }
  .f.q { background: var(--warn-tint); color: var(--warn); }
  .f.x { background: var(--bad-tint); color: var(--bad); }
  .f svg { width: 12px; height: 12px; stroke-width: 2.6; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--c); color: var(--on-pin); }
  .st { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .src { margin-inline-start: auto; font-size: 12px; color: var(--ink-muted); }
  .empty { text-align: center; padding: 26px 12px; color: var(--ink-muted); font-size: 14px; }

  /* ── One listing ───────────────────────────────────────────────────────── */
  .detail .back { margin: 0 0 10px -6px; }
  [dir="rtl"] .detail .back { margin: 0 -6px 10px 0; }
  .d-photo { height: 180px; border-radius: 16px; background: var(--surface-press) center/cover no-repeat; margin-bottom: 12px; }
  .d-head .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .d-head h2 { margin: 6px 0 2px; font: 600 21px/1.25 var(--serif); letter-spacing: -.01em; }
  .d-price { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .facts div { background: var(--surface-muted); border-radius: 12px; padding: 8px 10px; }
  .facts small { display: block; font-size: 11.5px; color: var(--ink-muted); }
  .facts b { font-size: 15px; }
  .whyline { font-size: 15px; color: var(--ink); background: var(--brand-tint); border-radius: 14px; padding: 10px 12px; margin: 0 0 12px; }
  .fair { margin: 0 0 12px; }
  .fair .bar { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--ok), var(--surface-press) 50%, var(--bad)); margin: 22px 4px 6px; }
  [dir="rtl"] .fair .bar { background: linear-gradient(-90deg, var(--ok), var(--surface-press) 50%, var(--bad)); }
  .fair .mk { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); transform: translate(-50%, -50%); }
  [dir="rtl"] .fair .mk { transform: translate(50%, -50%); }
  .fair .mid { position: absolute; top: -18px; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
  [dir="rtl"] .fair .mid { transform: translateX(50%); }
  .fair .mid::after { content: ""; position: absolute; left: 50%; top: 16px; width: 1px; height: 12px; background: var(--ink-muted); }
  .sec { margin: 14px 0 0; }
  .sec h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); }
  :root[lang="he"] .sec h4 { text-transform: none; letter-spacing: 0; font-size: 14px; }
  .sec ul { margin: 0; padding-inline-start: 18px; }
  .sec li { margin: 3px 0; font-size: 14px; color: var(--ink-2); }
  .sec p { margin: 4px 0; font-size: 14px; color: var(--ink-2); }
  .dist { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .reasons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .reasons button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
  .reasons button.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  textarea { width: 100%; min-height: 64px; border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; background: var(--surface); resize: vertical; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  a.btn { text-decoration: none; color: inherit; }
  .market-body { margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); z-index: 50; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Narrow: the map on top, the list under it, the page scrolls ──────── */
  @media (max-width: 899px) {
    body { overflow: auto; }
    #app { height: auto; min-height: 100dvh; display: block; }
    .main { display: block; }
    .mapwrap { height: 46vh; min-height: 280px; margin: 0 12px 12px; }
    .rail { overflow: visible; padding: 0 12px 28px; }
    .brand p { max-width: calc(100vw - 80px); }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .hover { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .pin-in { animation: none; } * { transition-duration: 0s !important; } }
</style>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6"/></svg></div>
      <div><h1 id="h1">Apartment Hunt</h1><p id="line"></p></div>
    </div>
    <div class="actions" id="actions"></div>
  </header>
  <div class="main">
    <section class="mapwrap" id="mapwrap">
      <div id="map"></div>
      <div class="map-ui">
        <div class="legend" id="legend"></div>
        <div class="ctrl" id="ctrl"></div>

      var diff = l.price - l.fairPrice, pct = diff / l.fairPrice, pos = Math.max(4, Math.min(96, 50 + pct * 250));
      var say = Math.abs(pct) < .02 ? t("fair_at") : t(diff < 0 ? "fair_under" : "fair_over", { money: money(Math.abs(diff)) });
      out += '<div class="sec fair"><h4>' + esc(t("fair_h")) + '</h4><div style="font-weight:600">' + esc(say) + '</div><div class="bar"><span class="mid" style="' + (lang === "he" ? "right" : "left") + ':50%">' + esc(t("fair_mid", { money: money(l.fairPrice) })) + '</span><span class="mk" style="' + (lang === "he" ? "right" : "left") + ":" + pos.toFixed(1) + '%"></span></div>' + (l.fairBasis ? '<p class="muted" dir="auto">' + esc(l.fairBasis) + "</p>" : "") + "</div>";
    }
    if (b && b.anchors.length && l.onMap) out += '<div class="sec"><h4>' + esc(t("dist_h")) + '</h4><div class="dist">' + b.anchors.map(function (an) { return '<span class="chip">' + icon(anchorIcon(an)) + esc(distText(l, an)) + "</span>"; }).join("") + "</div></div>";
    out += sections(l.body).map(function (s) { return '<div class="sec" dir="auto">' + (s.h ? "<h4>" + esc(s.h) + "</h4>" : "") + blockHtml(s.lines) + "</div>"; }).join("");
    if (l.url || l.alsoOn) out += '<div class="sec links">' + (l.url ? '<a class="btn" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + icon("link") + esc(t("open_ad", { site: l.source || "the site" })) + "</a>" : "") + (l.alsoOn ? '<span class="muted" style="align-self:center">' + esc(t("also_on", { sites: l.alsoOn })) + "</span>" : "") + "</div>";
    out += "</div>";
    // What the person does with it.
    if (canWrite() || canAsk()) {
      out += '<div class="card">';
      if (canWrite()) {
        if (ui.rejecting === l.file) {
          out += '<p style="font-weight:600;margin:0">' + esc(t("reject_q")) + '</p><div class="reasons">' + REASONS.map(function (r) { return '<button class="' + (ui.reasons[r] ? "on" : "") + '" data-act="reason" data-id="' + r + '">' + esc(t("r_" + r)) + "</button>"; }).join("") + "</div>" +
            '<textarea id="note" placeholder="' + esc(t("note_ph")) + '">' + esc(ui.note) + '</textarea><div class="acts" style="margin-top:8px"><button class="btn primary" data-act="reject-done">' + esc(t("done")) + '</button><button class="btn ghost" data-act="reject-cancel">' + esc(t("undo")) + "</button></div>";
        } else if (a && a.status === "rejected") {
          out += '<div class="acts"><span class="st" style="align-self:center">' + esc(t("st_rejected")) + (a.reason ? " · " + esc(t("r_" + a.reason)) : "") + '</span><button class="btn small" data-act="status" data-id="">' + esc(t("undo")) + "</button></div>";
        } else {
          var cur = a && a.status;
          out += '<div class="acts">' + [["saved", "save"], ["contacted", "contacted"], ["visiting", "visiting"], ["visited", "visited"], ["applied", "applied"]].map(function (p) {
            return '<button class="btn small' + (cur === p[0] ? " on" : "") + '" data-act="status" data-id="' + (cur === p[0] ? "" : p[0]) + '">' + (p[0] === "saved" ? icon("star") : "") + esc(cur === p[0] && p[0] === "saved" ? t("saved") : t(p[1])) + "</button>";
          }).join("") + '<button class="btn small ghost" style="color:var(--bad)" data-act="reject">' + icon("x") + esc(t("reject")) + "</button></div>";
        }
      }
      if (canAsk() && ui.rejecting !== l.file) out += '<div class="acts" style="margin-top:' + (canWrite() ? "10px" : "0") + '"><button class="btn small" data-act="owner">' + icon("send", "flip") + esc(t("write_owner")) + '</button><button class="btn small" data-act="ask-about">' + icon("chat") + esc(t("ask_about")) + "</button></div>";
      out += "</div>";
    }
    return out + "</div>";
  }
  function anchorIcon(an) { var k = (an.key + " " + an.label).toLowerCase(); return /work|office|עבודה|משרד/.test(k) ? "work" : /school|kinder|gan|בית ספר|גן/.test(k) ? "school" : /family|parent|mom|home|משפחה|הורים/.test(k) ? "heart" : "pin"; }

  // ── The map ─────────────────────────────────────────────────────────────
  var gl = null, glReady = false, markers = [], fitted = false, mapEl = $("map");
  // Hebrew and Arabic place names come out backwards without this plugin. Loaded before the first label,
  // because a label drawn before it arrives stays backwards.
  var RTL_TEXT = "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js";
  function startGl() {
    if (gl !== null) return;
    var dark = document.documentElement.dataset.theme === "dark";
    try {
      if (!window.maplibregl) throw new Error("no maplibre");
      try { if (window.maplibregl.getRTLTextPluginStatus() === "unavailable") { var rtl = window.maplibregl.setRTLTextPlugin(RTL_TEXT, false); if (rtl && rtl.catch) rtl.catch(function () {}); } } catch (e) { /* the names stay as they are */ }
      gl = new window.maplibregl.Map({ container: mapEl, style: STYLE_URL + (dark ? "colorful-dark" : "colorful") + "/style.json", bounds: BOUNDS[country()], fitBoundsOptions: { padding: 20 }, minZoom: 5, maxZoom: 18, maxPitch: 0, dragRotate: false, pitchWithRotate: false, attributionControl: false, fadeDuration: 120 });
      gl.touchZoomRotate.disableRotation(); gl.keyboard.disableRotation();
      gl.on("move", placeHover);
      // Fitting needs only the map's size, not its style, so it never waits for the tiles.
      glReady = true;
      var labelled = false;
      gl.on("styledata", function () { if (!labelled && gl.isStyleLoaded()) { labelled = true; localLabels(); } });
    } catch (e) { gl = false; $("mapoff").innerHTML = '<div class="map-off">' + esc(t("no_map")) + "</div>"; }
    $("ctrl").innerHTML = gl ? '<button data-act="zin" aria-label="Zoom in">' + icon("plus") + '</button><button data-act="zout" aria-label="Zoom out">' + icon("minus") + '</button><button data-act="fit" aria-label="' + esc(t("fit")) + '" title="' + esc(t("fit")) + '">' + icon("fit") + "</button>" : "";
  }
  // The map's labels in the page's language where the map has a name in it, else the local name.
  function localLabels() {
    var want = ["coalesce", ["get", "name_" + lang], ["get", "name"]];
    gl.getStyle().layers.forEach(function (ly) {
      if (ly.type !== "symbol" || !ly.layout) return;
      var tf = ly.layout["text-field"];
      if (Array.isArray(tf) && tf[0] === "get" && tf[1] === "name") { try { gl.setLayoutProperty(ly.id, "text-field", want); } catch (e) { /* keep the local name */ } }
    });
  }
  function fit(instant) {
    if (!gl) return;
    var pts = onMapList().map(function (l) { return [l.lng, l.lat]; });
    if (data.brief) data.brief.anchors.forEach(function (a) { pts.push([a.lng, a.lat]); });
    if (!pts.length) { gl.fitBounds(BOUNDS[country()], { padding: 20, duration: instant ? 0 : 800 }); return; }
    var bb = new window.maplibregl.LngLatBounds(); pts.forEach(function (p) { bb.extend(p); });
    var w = mapEl.clientWidth, h = mapEl.clientHeight;
    gl.fitBounds(bb, { padding: { top: Math.min(80, h / 4), bottom: Math.min(40, h / 5), left: Math.min(60, w / 5), right: Math.min(70, w / 5) }, maxZoom: 15, duration: instant ? 0 : 800 });
    fitted = true;
  }
  var holder = document.createElement("div");
  function addMarker(html, lng, lat, z) {
    holder.innerHTML = html; var el = holder.firstChild, label = el.getAttribute("aria-label");
    var m = new window.maplibregl.Marker({ element: el, anchor: "top-left" }).setLngLat([lng, lat]).addTo(gl);
    if (label) el.setAttribute("aria-label", label);
    if (z) el.style.zIndex = z;
    markers.push(m);
  }
  var pinKey = "";
  function buildPins() {
    if (!gl) return;
    var ls = onMapList(), key = lang + "|" + ui.open + "|" + ls.map(function (l) { var a = actionOf(l); return l.file + l.price + (a ? a.status : ""); }).join(",") + "|" + (data.brief ? JSON.stringify(data.brief.anchors) : "");
    if (key === pinKey) return;
    var first = !pinKey; pinKey = key;
    markers.forEach(function (m) { m.remove(); }); markers = [];
    if (data.brief) data.brief.anchors.forEach(function (an) {
      addMarker('<div class="anchor" aria-label="' + esc(an.label) + '"><div class="anchor-in"><span class="dot">' + icon(anchorIcon(an)) + "</span>" + esc(an.label) + "</div></div>", an.lng, an.lat, 1);
    });
    ls.slice().sort(function (a, b) { return (a.score || 0) - (b.score || 0); }).forEach(function (l, i) {
      var a = actionOf(l), saved = a && STATUSES.indexOf(a.status) >= 0;
      addMarker('<button class="pin' + (l.file === ui.open ? " sel" : "") + (ui.open && l.file !== ui.open ? " dim" : "") + (l.example ? " example" : "") + '" data-act="open" data-id="' + esc(l.file) + '" style="--c:' + colorOf(l) + ";--d:" + (first ? Math.min(i * 60, 600) : 0) + 'ms" aria-label="' + esc(l.title + ", " + money(l.price)) + '"><div class="pin-in"><span class="pin-ic">' + icon(saved || l.verdict === "top" ? "star" : "house") + "</span>" + esc(short(l.price)) + "</div></button>", l.lng, l.lat, 2 + (l.score || 0));
    });
    var legend = ["top", "good", "maybe"].filter(function (v) { return ls.some(function (l) { return l.verdict === v; }); });
    $("legend").innerHTML = legend.map(function (v) { return '<span><i style="--c:' + VERDICTS[v] + '"></i>' + esc(t(v)) + "</span>"; }).join("");
  }
  function setHover(file) {
    if (ui.hover === file) return; ui.hover = file;
    var el = $("hover"), l = file && byFile(file);
    document.querySelectorAll(".item.hot").forEach(function (x) { x.classList.remove("hot"); });
    if (file) { var it = document.querySelector('.item[data-hot="' + (window.CSS && CSS.escape ? CSS.escape(file) : file) + '"]'); if (it) it.classList.add("hot"); }
    if (!l || !gl || !l.onMap) { el.classList.remove("show"); return; }
    el.innerHTML = '<div class="price">' + esc(money(l.price)) + ' <span class="muted" style="font-weight:500;font-size:12.5px">' + esc(per(l)) + '</span></div><h3 dir="auto">' + esc(l.title) + '</h3><div class="muted">' + esc(metaLine(l)) + "</div>" + (l.why ? '<p dir="auto">' + esc(l.why) + "</p>" : "");
    el.classList.add("show"); placeHover();
  }
  function placeHover() {
    var l = ui.hover && byFile(ui.hover); if (!l || !gl || !l.onMap) return;
    var el = $("hover"), p = gl.project([l.lng, l.lat]), w = el.offsetWidth, h = el.offsetHeight, W = mapEl.clientWidth;
    var x = Math.max(8, Math.min(W - w - 8, p.x - w / 2)), y = p.y - 50 - h;
    if (y < 8) y = p.y + 14;
    el.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }
  mapEl.addEventListener("mouseover", function (e) { var pin = e.target.closest(".pin"); if (pin) setHover(pin.dataset.id); });
  mapEl.addEventListener("mouseout", function (e) { var pin = e.target.closest(".pin"); if (pin && !pin.contains(e.relatedTarget)) setHover(null); });
  new ResizeObserver(function () { if (gl) gl.resize(); }).observe(mapEl);

  // ── Presses ─────────────────────────────────────────────────────────────
  function open(file) {
    ui.open = file; ui.rejecting = null; setHover(null); paint();
    var l = byFile(file);
    if (l && l.onMap && gl) gl.easeTo({ center: [l.lng, l.lat], zoom: Math.max(gl.getZoom(), 14), duration: 700 });
    var rail = $("rail"); rail.scrollTop = 0;
    if (window.matchMedia("(max-width: 899px)").matches) rail.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id, l = ui.open && byFile(ui.open);
    if (act === "open") return open(id);
    if (act === "back") { ui.open = null; ui.rejecting = null; paint(); return; }
    if (act === "tab") { ui.tab = id; paint(); return; }
    if (act === "fit") return fit(false);
    if (act === "zin" && gl) return gl.zoomIn();
    if (act === "zout" && gl) return gl.zoomOut();
    if (act === "market") { ui.marketOpen = !ui.marketOpen; paintRail(); return; }
    if (act === "start-rent") return ask(t("ask_rent", { country: t("c_" + ui.exCountry) }));
    if (act === "start-buy") return ask(t("ask_buy", { country: t("c_" + ui.exCountry) }));
    if (act === "country") {
      if (id !== "il" && id !== "us" || id === ui.exCountry) return;
      ui.exCountry = id; ui.open = null; fitted = false; pinKey = "";
      if (cab && cab.mine && cab.mine.set) cab.mine.set("country", id).catch(function () {});
      (loading || Promise.resolve()).then(function () { return refresh(); }).then(function () { fit(false); });
      return;
    }
    if (act === "go-on") return ask(t("ask_go_on"));
    if (act === "change") return ask(t("ask_change"));
    if (act === "run") {
      var j = searchJob(); if (!j || !cab.jobs) return;
      jobs.running = true; paint();
      cab.jobs.run(j.id).catch(function (err) { if (!err || err.code !== "busy") { jobs.running = false; paint(); } toast((err && err.message) || "Try again."); });
      return;
    }
    if (!l) return;
    if (act === "status") { var a = actionOf(l); setAction(l.file, id ? { status: id, at: new Date().toISOString() } : null); if (id === "saved") toast(t("saved_toast")); if (!id && a) ui.rejecting = null; return; }
    if (act === "reject") { ui.rejecting = l.file; ui.reasons = {}; ui.note = ""; paintRail(); return; }
    if (act === "reason") { ui.note = ($("note") || {}).value || ui.note; ui.reasons = {}; ui.reasons[id] = true; paintRail(); return; }
    if (act === "reject-cancel") { ui.rejecting = null; paintRail(); return; }
    if (act === "reject-done") {
      var reason = Object.keys(ui.reasons)[0] || "", note = String((($("note") || {}).value || "")).trim().slice(0, 500);
      var v = { status: "rejected", at: new Date().toISOString() }; if (reason) v.reason = reason; if (note) v.note = note;
      ui.rejecting = null; setAction(l.file, v); toast(t("rejected_toast")); ui.open = null; paint(); return;
    }
    if (act === "owner") return ask(t("ask_owner", { title: l.title, file: l.file }));
    if (act === "ask-about") return ask(t("ask_about_t", { title: l.title, file: l.file }), { send: false });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ui.open) { ui.open = null; ui.rejecting = null; paint(); } });
  $("rail").addEventListener("mouseover", function (e) { var it = e.target.closest(".item"); setHover(it ? it.dataset.hot : null); });
  $("rail").addEventListener("mouseleave", function () { setHover(null); });

  // ── Start ───────────────────────────────────────────────────────────────
  function readJobs(listNow) {
    jobs.list = Array.isArray(listNow) ? listNow : [];
    var j = searchJob(), was = jobs.running; jobs.running = !!(j && j.running);
    if (was && !jobs.running) refresh(); else paint();
  }
  function refresh() { return load().then(function () { if (ui.open && !byFile(ui.open)) ui.open = null; paint(); if (!fitted && glReady) fit(true); }); }
  function start() {
    var hereP = cab && cab.here ? Promise.resolve(cab.here()).catch(function () { return null; }) : Promise.resolve(null);
    return hereP.then(function (h) {
      here = h;
      lang = h && /^he/i.test(h.locale || "") ? "he" : (!h && /^he/i.test(navigator.language || "") ? "he" : "en");
      document.documentElement.lang = lang; document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
      var dark = h && h.theme ? h.theme === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.dataset.theme = "dark";
      shared = hasStore ? JSON.parse(JSON.stringify(kept.all() || {})) : {};
      var picked = cab && cab.mine && cab.mine.get ? cab.mine.get("country") : null;
      if (picked === "il" || picked === "us") ui.exCountry = picked;
      else if (lang === "he") ui.exCountry = "il";
      startGl(); paint();
      if (!V2) return;
      if (hasStore && kept.onChange) kept.onChange(function () { shared = JSON.parse(JSON.stringify(kept.all() || {})); paint(); });
      cab.files.onChange("listings", refresh);
      cab.files.onChange("search", refresh);
      if (cab.jobs) { cab.jobs.list().then(readJobs, function () {}); cab.jobs.onChange(readJobs); }
      return refresh();
    });
  }
  paintTop();
  if (cab && cab.ready && typeof cab.ready.then === "function") {
    var began = false, go = function () { if (!began) { began = true; start(); } };
    cab.ready.then(go, go); setTimeout(go, 3000);
  } else start();
})();
</script>
