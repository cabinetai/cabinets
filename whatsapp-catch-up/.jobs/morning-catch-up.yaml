id: morning-catch-up
name: Morning Catch-Up
enabled: true
schedule: 30 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: chat-keeper
agentSlug: chat-keeper
timeout: 900
prompt: |-
  Write this morning's catch-up from the WhatsApp chats this cabinet reads.

  Your working directory is the cabinet root. Everything you write goes in `today/data/`:
  a readable page named `<YYYY-MM-DD>T<HH-MM-SS>-catch-up.md` in this computer's local
  time, and `latest.json`, which the Today app shows. Never overwrite or rename an earlier
  page, and never touch `today/data/EXAMPLE-latest.json`. Only step 9 deletes.

  1. Read your persona first. It holds the saved chat format, whose line is whose, how
     to name people, and the exact shape of both files. This prompt does not repeat them.
  2. Read `today/setup.md`. Leave out every chat it says to skip. Chats that always
     matter come first in every section they appear in. Its "What counts as waiting for
     me" narrows the waiting list.
  3. List the chat folders: every folder under `whatsapp/` with an `index.md` whose
     frontmatter has a `whatsapp` block. Never open `whatsapp/all-conversations/`.
     If there are no chat folders, write nothing, delete nothing, and say: "No chats are
     picked for this cabinet yet, so there is nothing to catch up on. Choose chats on the
     WhatsApp page in Integrations." Then stop.
  4. Read, in every chat folder: the month pages changed in the last day, and the newest
     month page even when it did not change. Also read `today/data/latest.json` when it
     is there, to carry open rows forward.
  5. Work out the six parts. Every row names its chat and the date of the line it came
     from.
     - **Today's chats:** each chat with lines from the last 24 hours. Who, how many
       lines, what it is about in six words, the time of its newest line. Busiest first.
     - **Waiting on your reply:** a direct chat whose newest line (the last line of its
       newest month page) is not the person's own, and is not only `[sticker]` or
       `[message deleted]`. A group only when that newest line names the person.
       Who, what they want in six words and whether it is a quote, an appointment, a
       question or a problem, a few words quoted from that line, and when it was sent.
       Oldest first. A chat whose newest line is the person's own is never
       here, however long ago someone else wrote.
     - **Plans and dates:** times, places and dates agreed in the lines you read, from
       either side, with who and when it was said. Keep plans from the previous
       catch-up whose time is still ahead. A plan a later line cancels is left out; a
       plan a later line moves shows the new time. Soonest first.
     - **Quotes and prices:** every amount in the lines you read, with who, what it is
       for, the amount and currency exactly as written, and when. Keep rows from the
       previous catch-up that are not agreed yet and are at most 14 days old. A row is
       agreed when a later line of the person's own accepts that amount. Newest first.
     - **Files and photos shared:** lines from the last 24 hours that start with
       `[photo]`, `[video]`, `[voice note]` or `[file]`, with the caption or file name
       after the label. Leave out `[sticker]`. Newest first.
     - **You said you would:** the person's own lines that promise something, in any
       language: to call back, to send a file, to check a price, to pay, to come by.
       Who it was promised to, what, and when. Keep open rows from the previous
       catch-up. Drop a promise once a later own line or file line shows it done (the
       file was sent, the call happened, the price was confirmed). Oldest first.
  6. Write the readable page: frontmatter with `headline`, `generated`, `status: ok` and
     `chats` (the number of chat folders you read), then the six sections in order. The
     headline is the one thing to know first, in the person's language, with no number
     copied from a chat.
  7. Write `today/data/latest.json` last, in one go, with the same rows in the shape
     your persona gives: `example` false, `generatedAt` now, the same headline,
     `chatsRead`, and the lists `waiting`, `promises`, `plans`, `prices` and `chats`.
     Dates are `YYYY-MM-DDTHH:MM` in local time, worked out from the lines.
  8. Check that `today/data/latest.json` is valid JSON, for example with
     `node -e "JSON.parse(require('fs').readFileSync('today/data/latest.json','utf8'))"`
     or `python3 -m json.tool today/data/latest.json`. If it is not, fix it and check
     again.
  9. Tidy `today/data/`. Among the files named `<YYYY-MM-DD>T<HH-MM-SS>-catch-up.md` or
     `<YYYY-MM-DD>T<HH-MM-SS>-week-ahead.md`, keep the newest 30 and delete the rest.
     Then look at `keptFor` in every chat's `index.md`: when the shortest is `30 days`
     or `90 days`, also delete those files dated more than that many days ago, so a price
     or a promise never outlives the chat page it came from. `forever` sets no limit.
     Never delete any other file.

  Finish with one or two sentences: how many chats moved, who is waiting on the person,
  and the one thing to do first. Name people the way your persona says.
