id: morning-catch-up
name: Morning Catch-Up
enabled: true
schedule: 30 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: chat-keeper
agentSlug: chat-keeper
timeout: 900
prompt: |-
  Write this morning's catch-up from the WhatsApp chats this cabinet reads, for the
  Conversations app: who is waiting and a short reply drafted for each, the quotes,
  appointments and promises in the chats. It runs every day on the person's money, so
  do it in three moves: the one shell command step 1 gives, one command that writes the
  file and checks it, then your answer. Keep what yesterday's catch-up already worked
  out; never read a file twice.

  Your working directory is the cabinet root. Your persona above says how to read a
  saved chat line and how to name people. Never send or propose a message, and never
  touch the `whatsapp/all-conversations/EXAMPLE-*` files.

  1. Read everything with this one command, as it is: the date and time,
     `whatsapp/setup.md`, the chat folders, yesterday's catch-up
     (`whatsapp/all-conversations/catch-up.json`) and the last 40 lines of every month
     page written after it (with no catch-up yet, of every chat's newest page):
     `date '+%Y-%m-%dT%H:%M'; cat whatsapp/setup.md; ls whatsapp; C=whatsapp/all-conversations/catch-up.json; if [ -f $C ]; then echo "== $C"; cat $C; find whatsapp -path whatsapp/all-conversations -prune -o -name '20*.md' -newer $C -exec sh -c 'echo "== $1"; tail -n 40 "$1"' _ {} \;; else for d in whatsapp/*/; do f=$(ls "$d"20*.md 2>/dev/null | tail -n 1); [ -n "$f" ] && { echo "== $f"; tail -n 40 "$f"; }; done; fi`
     A chat is a folder under `whatsapp/`; `whatsapp/all-conversations/` is not one, and
     leave out every chat `whatsapp/setup.md` says to skip. If there are no chat folders,
     write nothing and say: "No chats are picked for this cabinet yet, so there is
     nothing to catch up on. Choose chats on the WhatsApp page in Integrations." Then stop.
  2. Work out the catch-up. A chat you did not read keeps yesterday's rows as they
     were. For a chat you read:
     - **waiting**: a direct chat whose newest line is not the person's own, and is not
       only `[sticker]` or `[message deleted]`; a group only when its newest line names
       the person. A chat whose newest line is the person's own is not waiting.
       `whatsapp/setup.md` says what counts, and which chats come first. For each one,
       draft the reply the person would send: short, in the chat's own language, in the
       tone `whatsapp/setup.md` asks for. Never claim a price, a time, a service or a
       promise the chats do not show: where the reply needs one, ask it back or leave it
       in [brackets] for the person to fill.
     - **plans**: times, places and dates agreed, from either side. A later line that
       cancels a plan removes it; one that moves it changes the time. Drop plans whose
       time has passed.
     - **prices**: every amount, exactly as written, with what it is for. Agreed when a
       later line of the person's own accepts it. Drop rows older than 14 days that
       are not agreed.
     - **promises**: the person's own lines that promise something (to call back, to
       send, to check, to pay, to come by). Drop one once a later line shows it done.
  3. Write `whatsapp/all-conversations/catch-up.json` in one go: valid JSON, plain
     words, times in this computer's local time as `YYYY-MM-DDTHH:MM` (a plan with no
     time: `YYYY-MM-DD`, worked out from the line; "Friday" in a line from Tue 22 Sep is
     `2026-09-25`). `chatsRead` is how many chats this cabinet reads (its chat folders).
     Every list is present, `[]` when empty, at most 12 rows. The shape:
     `{"version":1,"generatedAt":"2026-09-25T07:30","status":"ok","headline":"...","chatsRead":7,`
     `"waiting":[{"who":"Dana Levi","kind":"person","chat":"dana-levi","topic":"quote","wants":"A price for front brakes","quote":"How much for the brakes?","since":"2026-09-24T09:14","draft":"Hi Dana, front brakes come to ..."}],`
     `"promises":[{"to":"Dana Levi","kind":"person","chat":"dana-levi","what":"Send a photo of the pads","said":"2026-09-23T17:20"}],`
     `"plans":[{"when":"2026-09-26T08:30","what":"Oil change","where":"At the shop","who":"Moshe Levi","kind":"person","chat":"moshe-levi","said":"2026-09-22T10:31"}],`
     `"prices":[{"who":"Parts Direct","kind":"person","chat":"parts-direct","for":"Clutch kit","amount":"$389","agreed":false,"said":"2026-09-24T07:05"}]}`
     - `who`/`to` as your persona names people. `kind` is `person`, `group`, or
       `number` for a chat with no saved name.
     - `chat` is the folder name exactly, except a `chat-<number>` or `group-<id>`
       folder, written with only its last four digits: `chat-...4410`. Never a full
       number, anywhere. The app finds each chat by it.
     - `topic` is `quote`, `appointment`, `question`, `problem` or `other`.
     - `headline`: one sentence of at most 20 words, the thing to know first, in the
       person's language, no number copied from a chat. `wants`, `what`, `for`: six
       words or so. `quote`: at most 12 words from that chat's newest line, in its own
       language, or `""`. `since`: when the oldest line still unanswered was written.
       `draft`: at most 60 words. `amount` exactly as written. `agreed`: true/false.
     - Order: waiting and promises oldest first, plans soonest first, prices newest
       first.
     Then check it is valid JSON (`python3 -m json.tool whatsapp/all-conversations/catch-up.json > /dev/null`
     or `node -e` with JSON.parse) and fix it if not.

  Finish with one or two sentences: who is waiting on the person, and the one thing to
  do first.
createdAt: '2026-09-15T00:00:00.000Z'
updatedAt: '2026-09-25T00:00:00.000Z'
