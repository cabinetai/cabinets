<!DOCTYPE html>
<!--
  WhatsApp Catch-Up: the customer line. Who is waiting for an answer and for how
  long, quotes and appointments agreed in chats, promises to keep, and ideas for
  the business, from the WhatsApp chats the person picked.

  Reads data/latest.json (the morning routine) and data/week.json (Sunday's week
  ahead) in this app folder; data/EXAMPLE-latest.json is a made-up business shown
  until WhatsApp is connected. DATA.md beside this file has the shape.

  Talks to Cabinet only through window.cabinet (v2): the connection state and
  Cabinet's own connect flow, the routine (Refresh), files, and ask (drafts,
  questions and ideas go to the cabinet's chat, where nothing is sent without a
  yes). An older Cabinet has no v2: the page reads its files by URL and says how
  to connect. One file on purpose: a sealed frame loads nothing beside it.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp Catch-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f6f2e8;
    --surface: #ffffff;
    --surface-2: #faf8f2;
    --ink: #10231c;
    --ink-2: #3d564b;
    --ink-3: #66796f;
    --line: #e4ddcd;
    --line-2: #eee9dc;
    --brand: #0d4a35;
    --brand-2: #13694b;
    --brand-ink: #ffffff;
    --brand-soft: #e2efe7;
    --wa: #25d366;
    --hero: #0e3a2c;
    --hero-2: #145240;
    --hero-ink: #f6f2e8;
    --hero-muted: #b9d1c5;
    --red: #a3392b;
    --red-soft: #f8e4df;
    --amber: #8a5a0b;
    --amber-soft: #f8ecd2;
    --blue: #245479;
    --blue-soft: #e3ecf4;
    --shadow: 0 1px 2px rgba(16, 35, 28, 0.05), 0 10px 28px -16px rgba(16, 35, 28, 0.18);
    --radius: 16px;
    --sans: "Inter", "Heebo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --serif: "Newsreader", "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-scheme="light"]) {
      --bg: #0b1713; --surface: #11211b; --surface-2: #142820; --ink: #eef3ef; --ink-2: #b7c9c0; --ink-3: #8aa197;
      --line: #22382f; --line-2: #1c3129; --brand: #3fb27c; --brand-2: #52c28c; --brand-ink: #06140f; --brand-soft: #173a2c;
      --hero: #0f3327; --hero-2: #164536; --hero-ink: #f2efe6; --hero-muted: #a9c6b8;
      --red: #f09a8b; --red-soft: #3a1d18; --amber: #e8c27a; --amber-soft: #36290f; --blue: #9cc3e6; --blue-soft: #16283a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-scheme="dark"] {
    --bg: #0b1713; --surface: #11211b; --surface-2: #142820; --ink: #eef3ef; --ink-2: #b7c9c0; --ink-3: #8aa197;
    --line: #22382f; --line-2: #1c3129; --brand: #3fb27c; --brand-2: #52c28c; --brand-ink: #06140f; --brand-soft: #173a2c;
    --hero: #0f3327; --hero-2: #164536; --hero-ink: #f2efe6; --hero-muted: #a9c6b8;
    --red: #f09a8b; --red-soft: #3a1d18; --amber: #e8c27a; --amber-soft: #36290f; --blue: #9cc3e6; --blue-soft: #16283a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }
  bdi { unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 10px; }
  .num { font-variant-numeric: tabular-nums; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 28px 0; }

  /* Top bar */
  .top { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; margin-inline-end: auto; min-width: 0; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; }
  .mark svg { width: 24px; height: 24px; }
  .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: 1px 0 0; font: 500 30px/1.1 var(--serif); letter-spacing: -0.01em; }
  .state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; font-weight: 500; color: var(--ink-2);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #b3bdb7; }
  .pill.on .dot { background: var(--wa); box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.18); }
  .pill.warn .dot { background: #d99a2b; box-shadow: 0 0 0 3px rgba(217, 154, 43, 0.18); }
  .btn {
    min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px;
    border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: 15px; font-weight: 600; white-space: nowrap; transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--brand); padding-inline: 10px; }
  :root[data-scheme="dark"] .btn.quiet { color: var(--brand-2); }
  .btn.quiet:hover { background: var(--brand-soft); }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Notices */
  .notice {
    margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px;
    border-radius: 12px; background: var(--amber-soft); color: var(--ink); border: 1px solid rgba(138, 90, 11, 0.18);
  }
  .notice.plain { background: var(--surface); border-color: var(--line); }
  .notice svg { width: 20px; height: 20px; color: var(--amber); }
  .notice .t { flex: 1 1 240px; font-weight: 500; }

  /* Hero, for connecting */
  .hero {
    margin-top: 22px; border-radius: 22px; padding: 34px 36px; color: var(--hero-ink);
    background: radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero) 55%);
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 28px; align-items: center; overflow: hidden;
  }
  .hero .kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-muted); }
  .hero h2 { margin: 10px 0 0; font: 500 clamp(30px, 4vw, 44px)/1.08 var(--serif); letter-spacing: -0.015em; max-width: 17ch; }
  .hero p { margin: 14px 0 0; font-size: 17px; color: var(--hero-muted); max-width: 44ch; }
  .hero .btn.big { margin-top: 24px; min-height: 52px; padding: 12px 22px; font-size: 16.5px; border-radius: 12px; background: var(--hero-ink); color: #0e3a2c; border-color: var(--hero-ink); }
  .hero .btn.big:hover { background: #ffffff; }
  .hero .btn.big svg { width: 22px; height: 22px; }
  .hero .how { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--hero-muted); }
  .hero .how svg { width: 18px; height: 18px; }
  .preview { background: rgba(246, 242, 232, 0.06); border: 1px solid rgba(246, 242, 232, 0.14); border-radius: 16px; padding: 10px; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 11px; }
  .prow + .prow { border-top: 1px solid rgba(246, 242, 232, 0.1); }
  .prow .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #0e3a2c; }
  .prow .nm { font-weight: 600; font-size: 15px; }
  .prow .sb { font-size: 13.5px; color: var(--hero-muted); }
  .prow .tag { margin-inline-start: auto; font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(246, 242, 232, 0.12); color: var(--hero-ink); white-space: nowrap; }
  .prow .tag.hot { background: #f1c5bd; color: #5c1a10; }
  .card-soft {
    margin-top: 22px; border-radius: 20px; padding: 28px 30px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
  }
  .card-soft .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
  .card-soft .ic svg { width: 26px; height: 26px; }
  .card-soft .tx { flex: 1 1 320px; }
  .card-soft h2 { margin: 0; font: 500 26px/1.2 var(--serif); }
  .card-soft p { margin: 6px 0 0; color: var(--ink-2); }
  .typing { display: inline-flex; gap: 5px; align-items: center; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); opacity: .35; animation: pulse 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  /* Example label */
  .example-bar {
    margin-top: 26px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 16px; border-radius: 12px;
    background: var(--surface); border: 1px dashed #c9bfa8; color: var(--ink-2); font-size: 15px;
  }
  :root[data-scheme="dark"] .example-bar { border-color: #3a5146; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); }

  /* Summary */
  .summary { margin-top: 26px; }
  .summary h2 { margin: 0; font: 500 clamp(24px, 2.7vw, 30px)/1.25 var(--serif); letter-spacing: -0.01em; max-width: 46ch; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-3); font-size: 14.5px; }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .meta svg { width: 16px; height: 16px; }
  .kpis { margin-top: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kpi { padding: 18px 20px; min-width: 0; }
  .kpi + .kpi { border-inline-start: 1px solid var(--line-2); }
  .kpi .v { font: 500 40px/1 var(--serif); letter-spacing: -0.02em; }
  .kpi .l { margin-top: 8px; font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
  .kpi .s { margin-top: 2px; font-size: 14px; color: var(--ink-3); }
  .kpi .s.hot { color: var(--red); font-weight: 600; }

  /* Layout */
  .grid { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
  .sec-h h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .sec-h .c { font-size: 14px; color: var(--ink-3); }
  .sec-h .badge { margin-inline-start: auto; }
  .stack { display: grid; gap: 12px; }

  /* One card per customer conversation */
  .cust { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .cust.waiting { border-inline-start: 3px solid var(--red); }
  .cust.waiting.mild { border-inline-start-color: #d99a2b; }
  .cust.waiting.fresh { border-inline-start-color: var(--brand-2); }
  .cust-h { display: flex; align-items: center; gap: 12px; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14.5px; font-weight: 700; color: #10231c; }
  .av svg { width: 20px; height: 20px; }
  .who { min-width: 0; flex: 1; }
  .who .n { font-weight: 600; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
  .who .k { margin-top: 1px; font-size: 13.5px; color: var(--ink-3); }
  .wait { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); }
  .wait svg { width: 15px; height: 15px; }
  .wait.hot { background: var(--red-soft); color: var(--red); border-color: transparent; }
  .wait.mild { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
  .wait.ok { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
  .wants { margin: 12px 0 0; font-size: 16.5px; font-weight: 500; overflow-wrap: anywhere; }
  .said { margin: 8px 0 0; padding: 8px 12px; border-inline-start: 3px solid var(--line); background: var(--surface-2); border-radius: 0 10px 10px 0; color: var(--ink-2); font-size: 15.5px; overflow-wrap: anywhere; }
  [dir="rtl"] .said { border-radius: 10px 0 0 10px; }
  .facts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }
  .facts li { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); min-width: 0; }
  .facts li svg { width: 17px; height: 17px; color: var(--ink-3); }
  .facts li .x { min-width: 0; overflow-wrap: anywhere; }
  .facts li b { color: var(--ink); font-weight: 600; }
  .st { margin-inline-start: auto; flex: none; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
  .st.open { background: var(--amber-soft); color: var(--amber); }
  .st.done { background: var(--brand-soft); color: var(--brand); }
  .cust-f { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cust-f .last { font-size: 14px; color: var(--ink-3); margin-inline-end: auto; }
  .more { margin-top: 4px; }

  /* Side panels */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px 18px 12px; }
  .side > * + * { margin-top: 24px; }
  .panel .sec-h { margin-top: 12px; }
  .day-h { margin: 12px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .appt { display: flex; gap: 14px; padding: 9px 0; }
  .appt + .appt { border-top: 1px solid var(--line-2); }
  .appt .tm { flex: none; min-width: 74px; white-space: nowrap; font-weight: 600; color: var(--blue); font-size: 15px; padding-top: 1px; }
  .appt .d { min-width: 0; }
  .appt .w { font-weight: 600; overflow-wrap: anywhere; }
  .appt .p { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
  .promise { display: flex; gap: 12px; padding: 11px 0; }
  .promise + .promise { border-top: 1px solid var(--line-2); }
  .promise svg { width: 20px; height: 20px; color: var(--brand-2); margin-top: 2px; }
  .promise .w { font-weight: 500; overflow-wrap: anywhere; }
  .promise .p { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
  .panel .foot { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line-2); }
  .empty { color: var(--ink-3); padding: 12px 0; }

  /* Ideas */
  .ideas { margin-top: 40px; }
  .ideas-h h2 { margin: 0; font: 500 28px/1.15 var(--serif); letter-spacing: -0.01em; }
  .ideas-h p { margin: 4px 0 0; color: var(--ink-2); }
  .idea-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1180px) { .idea-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .idea .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
  :root[data-scheme="dark"] .idea .ic { color: var(--brand-2); }
  .idea .ic svg { width: 20px; height: 20px; }
  .idea h4 { margin: 0; font: 500 19px/1.25 var(--serif); }
  .idea p { margin: 0; font-size: 15px; color: var(--ink-2); flex: 1; }
  .idea .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
  .idea .acts .btn { min-height: 44px; padding: 8px 12px; font-size: 14px; gap: 6px; }
  .idea .acts .btn.quiet { padding-inline: 8px; }
  .idea .acts .btn svg { width: 16px; height: 16px; }

  .foot-links { margin: 36px 0 0; padding: 18px 0 6px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14.5px; color: var(--ink-3); }
  .foot-links a { color: var(--ink-2); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; min-height: 44px; display: inline-flex; align-items: center; }
  .foot-links a:hover { color: var(--brand); text-decoration-color: currentColor; }

  /* Question bar */
  .spacer { height: 150px; }
  .bar { position: fixed; inset-inline: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 max(12px, env(safe-area-inset-bottom)); }
  .bar .inner { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) { .chips { flex-wrap: wrap; overflow: visible; } }
  .chip { flex: none; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .chip:hover { border-color: var(--brand-2); color: var(--ink); }
  .ask { display: flex; gap: 10px; align-items: center; }
  .ask input { flex: 1; min-width: 0; min-height: 50px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; font-size: 16.5px; color: var(--ink); box-shadow: var(--shadow); }
  .ask input::placeholder { color: var(--ink-3); opacity: 1; }
  .ask input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--brand-soft); }
  .send { width: 50px; height: 50px; border-radius: 13px; border: 0; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
  .send:hover { background: var(--brand-2); }
  .send svg { width: 22px; height: 22px; }

  .toast { position: fixed; z-index: 9; inset-inline: 0; margin: 0 auto; bottom: 140px; width: max-content; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; padding: 11px 18px; border-radius: 11px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  .toast.on { opacity: 1; transform: none; }
  .in { animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .idea-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    .wrap { padding: 16px 16px 0; }
    h1 { font-size: 26px; }
    .state { width: 100%; }
    .state .pill { flex: 1; }
    .btn .rt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #refresh { width: 44px; padding: 0; }
    .hero { padding: 24px 20px; border-radius: 18px; }
    .hero .preview { display: none; }
    .hero .btn.big { width: 100%; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-inline-start: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line-2); }

    var w = wa(), html = "";
    if (!V2) html += '<div class="notice">' + icon("alert") + '<div class="t">' + esc(T.oldCabinet) + "</div></div>";
    else if (w && S.data && !S.example && w.state !== "connected") {
      var line = w.state === "not-available-here" ? (w.problem && w.problem.text) || T.notHereLine : (w.problem && w.problem.text) || T.notConnected;
      var fix = w.canConnect && w.state !== "not-available-here" ? '<button class="btn" type="button" data-act="connect">' + esc(w.state === "not-added" ? T.connect : T.fix) + "</button>" : "";
      html += '<div class="notice">' + icon("alert") + '<div class="t" dir="auto">' + esc(line) + "</div>" + fix + "</div>";
    } else if (w && w.state === "connected" && w.busy === "catching-up") {
      html += '<div class="notice plain">' + icon("clock") + '<div class="t">' + esc(T.catchingUp) + "</div></div>";
    }
    if (S.job && S.job.lastRun && S.job.lastRun.ok === false && !S.job.running && linked()) html += '<div class="notice">' + icon("alert") + '<div class="t">' + esc(T.runFailed) + "</div></div>";
    else if (S.readError) html += '<div class="notice">' + icon("alert") + '<div class="t">' + esc(T.readError) + "</div></div>";
    $("notice").innerHTML = html;
  }

  function hero(w) {
    var btn = w.canConnect
      ? '<button class="btn big" type="button" data-act="connect"' + (S.busyConnect ? " disabled" : "") + ">" + icon("waInk") + "<span>" + esc(S.busyConnect ? T.connecting : T.connect) + "</span></button>" +
        '<div class="how">' + icon("phone") + "<span>" + esc(T.heroHow) + "</span></div>"
      : "<p>" + esc(T.ownerOnly) + "</p>";
    var tints = ["#f1d7b5", "#cfe3d3", "#d8e0ef"];
    var preview = '<div class="preview" aria-hidden="true">' + T.preview.map(function (row, i) {
      var sub = row[2] === "appt" ? T.apptRow : T.topic[row[2]];
      return '<div class="prow"><span class="av" style="background:' + tints[i] + '">' + esc(row[0]) + '</span><div><div class="nm">' + esc(row[1]) +
        '</div><div class="sb">' + esc(sub) + '</div></div><span class="tag' + (row[4] ? " hot" : "") + '">' + esc(row[3]) + "</span></div>";
    }).join("") + "</div>";
    return '<section class="hero in"><div><div class="kicker">' + esc(T.heroKicker) + "</div><h2>" + esc(T.heroTitle) + "</h2><p>" + esc(T.heroLine) + "</p>" + btn + "</div>" + preview + "</section>";
  }
  function soft(iconName, title, line, button, act) {
    return '<section class="card-soft in"><span class="ic">' + icon(iconName) + '</span><div class="tx"><h2 dir="auto">' + esc(title) + "</h2>" +
      (line ? '<p dir="auto">' + esc(line) + "</p>" : "") + "</div>" +
      (button ? '<button class="btn primary" type="button" data-act="' + act + '"' + (S.busyConnect ? " disabled" : "") + ">" + esc(button) + "</button>" : "") + "</section>";
  }

  /* What sits at the top when there is no catch-up of the person's own yet. */
  function lead() {
    var w = wa();
    if (!V2 || !w) return "";
    var mine = S.data && !S.example;
    if (w.state === "connected") {
      if (S.saved && S.saved.length === 0) return soft("chats", T.chooseTitle, T.chooseLine, w.canConnect ? T.choose : "", "connect");
      if (mine) return "";
      if (S.job && S.job.running) {
        return '<section class="card-soft in"><span class="ic">' + icon("chats") + '</span><div class="tx"><h2>' + esc(T.runningTitle) +
          '</h2><p><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span> ' + esc(T.runningLine) + "</p></div></section>";
      }
      var whenText = S.job && S.job.when ? String(S.job.when).charAt(0).toLowerCase() + String(S.job.when).slice(1) : "";
      return soft("chats", T.firstTitle, whenText ? fill(T.firstLine, { when: whenText }) : T.firstLineNoWhen, canEdit() && S.job ? T.firstButton : "", "refresh");
    }
    if (mine) return "";
    if (w.busy === "linking") return soft("phone", T.linkingTitle, "", w.canConnect ? T.connect : "", "connect");
    if (w.state === "not-available-here") return soft("laptop", T.notHereTitle, (w.problem && w.problem.text) || T.notHereLine, "", "");
    if (w.state === "needs-you" || w.state === "needs-sign-in") {
      return soft("alert", (w.problem && w.problem.text) || T.needsYou, w.canConnect ? "" : T.ownerOnly, w.canConnect ? T.fix : "", "connect");
    }
    return hero(w);
  }

  function kpis(d, now) {
    var waiting = rows(d.waiting).filter(function (r) { return str(r.who); });
    var longest = null;
    waiting.forEach(function (r) { var x = duration(r.since, now); if (x && (!longest || x.mins > longest.mins)) longest = x; });
    var quotes = rows(d.prices).filter(function (r) { return str(r.amount); });
    var open = quotes.filter(function (r) { return r.agreed !== true; });
    var sum = sumAmounts(open);
    var week = rows(d.plans).filter(function (r) { var p = parseWhen(r.when); if (!p) return false; var k = daysBetween(now, p.date); return k >= 0 && k < 7; })
      .sort(function (a, b) { return parseWhen(a.when).date - parseWhen(b.when).date; });
    var promises = rows(d.promises).filter(function (r) { return str(r.what); });
    var oldest = promises.map(function (r) { return parseWhen(r.said); }).filter(Boolean).sort(function (a, b) { return a.date - b.date; })[0];
    function tile(v, label, sub, hot) {
      return '<div class="kpi"><div class="v num">' + esc(String(v)) + '</div><div class="l">' + esc(label) + '</div><div class="s' + (hot ? " hot" : "") + '">' + esc(sub) + "</div></div>";
    }
    return '<div class="kpis">' +
      tile(waiting.length, T.kWaiting, longest ? fill(T.kLongest, { d: longest.text }) : T.kNone, !!longest && longest.mins >= 24 * 60) +
      tile(open.length, T.kQuotes, sum ? fill(T.kQuotesSum, { sum: sum }) : quotes.length - open.length === 1 ? T.kQuotesAgreed1 : quotes.length > open.length ? fill(T.kQuotesAgreed, { n: quotes.length - open.length }) : "", false) +
      tile(week.length, T.kAppts, week.length ? fill(T.kNext, { when: when(week[0].when, now) }) : T.kNoAppts, false) +
      tile(promises.length, T.kPromises, oldest ? fill(T.kOldest, { when: fmtWeekday.format(oldest.date) }) : T.kNoPromises, false) + "</div>";
  }

  function summary(d, now, running) {
    var meta = [];
    if (!S.example) {
      if (d.generatedAt) meta.push("<span>" + esc(fill(T.updated, { when: when(d.generatedAt, new Date()) })) + "</span>");
      if (S.job && S.job.when) meta.push("<span>" + icon("clock") + esc(S.job.when) + "</span>");
      if (typeof d.chatsRead === "number") meta.push("<span>" + esc(d.chatsRead === 1 ? T.chatsRead1 : fill(T.chatsRead, { n: d.chatsRead })) + "</span>");
    }
    var status = str(d.status);
    var headline = running ? T.runningTitle : str(d.headline, 260);
    return '<section class="summary in">' + (headline ? '<h2 dir="auto">' + esc(headline) + "</h2>" : "") +
      (running ? '<div class="meta"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span><span>' + esc(T.runningLine) + "</span></div>" : "") +
      (status && status !== "ok" ? '<div class="meta" dir="auto">' + esc(status) + "</div>" : "") +
      (meta.length ? '<div class="meta">' + meta.join("") + "</div>" : "") + kpis(d, now) + "</section>";
  }

  function secHead(title, count) {
    return '<div class="sec-h"><h3>' + esc(title) + "</h3>" + (count ? '<span class="c">' + esc(count) + "</span>" : "") +
      (S.example ? '<span class="badge">' + esc(T.example) + "</span>" : "") + "</div>";
  }

  function customerSection(d, now) {
    var list = customers(d, now);
    if (!list.length) return "";
    var mode = S.example ? "example" : V2 && canEdit() ? "live" : "look";
    var shown = S.showAll ? list : list.slice(0, 6);
    return "<section>" + secHead(T.customers, fill(T.customersCount, { n: list.length })) + '<div class="stack">' +
      shown.map(function (c, i) { return card(c, i, now, mode); }).join("") + "</div>" +
      (list.length > shown.length ? '<div class="more"><button class="btn quiet" type="button" data-act="all">' + esc(fill(T.showAll, { n: list.length })) + icon("arrow") + "</button></div>" : "") + "</section>";
  }

  function weekPanel(d, week, now) {
    var list = rows(d.plans).slice();
    if (week && !S.example) {
      var seen = {};
      list.forEach(function (r) { seen[str(r.when) + "|" + str(r.what)] = true; });
      rows(week.plans).forEach(function (r) { if (!seen[str(r.when) + "|" + str(r.what)]) list.push(r); });
    }
    list = list.filter(function (r) { var p = parseWhen(r.when); if (!str(r.what) || !p) return false; var k = daysBetween(now, p.date); return k >= 0 && k < 8; })
      .sort(function (a, b) { return parseWhen(a.when).date - parseWhen(b.when).date; });
    var html = '<section class="panel">' + secHead(T.thisWeek, "");
    if (!list.length) html += '<div class="empty">' + esc(T.noWeek) + "</div>";
    var lastDay = null;
    list.forEach(function (r) {
      var p = parseWhen(r.when), day = dayStart(p.date);
      if (day !== lastDay) {
        var k = daysBetween(now, p.date);
        html += '<div class="day-h">' + esc(k === 0 ? T.today : k === 1 ? T.tomorrow : fmtWeekdayLong.format(p.date)) + "</div>";
        lastDay = day;
      }
      var place = [str(r.who, 80), str(r.where, 80)].filter(Boolean);
      html += '<div class="appt"><div class="tm num">' + esc(p.hasTime ? fmtTime.format(p.date) : "") + '</div><div class="d"><div class="w" dir="auto">' + esc(str(r.what, 140)) +
        "</div>" + (place.length ? '<div class="p">' + place.map(function (x) { return '<bdi dir="auto">' + esc(x) + "</bdi>"; }).join(" · ") + "</div>" : "") + "</div></div>";
    });
    var c = cal(), act = "";
    if (list.length && V2 && canEdit() && !S.example && c) {
      if (c.state === "connected" && c.canChange !== false) act = '<button class="btn quiet" type="button" data-act="calendar">' + icon("calendar") + esc(T.toCalendar) + "</button>";
      else if (c.state === "not-added" && c.canConnect) act = '<button class="btn quiet" type="button" data-act="connect-calendar">' + icon("calendar") + esc(T.connectCalendar) + "</button>";
    }
    return html + (act ? '<div class="foot">' + act + "</div>" : "") + "</section>";
  }

  function promisePanel(d, now) {
    var list = rows(d.promises).filter(function (r) { return str(r.what); });
    var html = '<section class="panel">' + secHead(T.promises, "");
    if (!list.length) return html + '<div class="empty">' + esc(T.noPromises) + "</div></section>";
    list.forEach(function (r) {
      html += '<div class="promise">' + icon("circle") + '<div><div class="w" dir="auto">' + esc(str(r.what, 160)) + '</div><div class="p"><bdi dir="auto">' +
        esc(fill(T.to, { who: str(r.to, 80) })) + "</bdi>" + (r.said ? " · " + esc(when(r.said, now)) : "") + "</div></div></div>";
    });
    return html + "</section>";
  }

  function ideas() {
    var live = V2 && canEdit();
    return '<section class="ideas"><div class="ideas-h"><h2>' + esc(T.ideasTitle) + "</h2><p>" + esc(T.ideasLine) + "</p></div>" +
      '<div class="idea-grid">' + T.ideas.map(function (idea, i) {
        var every = idea.when ? T[idea.when] : "";
        return '<article class="idea"><span class="ic">' + icon(idea.icon) + "</span><h4>" + esc(idea.title) + "</h4><p>" + esc(idea.line) + "</p>" +
          (live ? '<div class="acts"><button class="btn primary" type="button" data-act="idea" data-i="' + i + '">' + esc(T.askNow) + "</button>" +
            (every ? '<button class="btn quiet" type="button" data-act="routine" data-i="' + i + '">' + icon("repeat") + esc(every) + "</button>" : "") + "</div>" : "") +
          "</article>";
      }).join("") + "</div></section>";
  }

  function footer() {
    if (!V2 || S.example) return "";
    var links = [];
    if (S.saved && S.saved.length) links.push('<a href="#" data-act="open" data-to="' + CHATS + '/all-conversations">' + esc(T.allChats) + "</a>");
    if (canEdit()) links.push('<a href="#" data-act="prefs">' + esc(T.preferences) + "</a>");
    return links.length ? '<div class="foot-links">' + links.join("") + "</div>" : "";
  }

  function render() {
    pill(); refreshButton(); bar();
    if (!S.loaded) { $("main").innerHTML = '<div class="summary"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div>'; return; }
    notices();
    var d = S.data, w = wa();
    var html = lead();
    var mine = d && !S.example;
    if (d && (mine || !V2 || !w || w.state !== "connected")) {
      var now = S.example ? (parseWhen(d.generatedAt) || { date: new Date() }).date : new Date();
      if (S.example) {
        var biz = str(d.business, 60);
        html += '<div class="example-bar in"><span class="badge">' + esc(T.example) + "</span><span>" + esc(biz ? fill(T.exampleBar, { business: biz }) : T.exampleBarPlain) + "</span></div>";
      }
      var running = !!(S.job && S.job.running) && !S.example;
      html += summary(d, now, running) + '<div class="grid"><div>' + customerSection(d, now) + '</div><aside class="side">' + weekPanel(d, S.week, now) + promisePanel(d, now) + "</aside></div>";
    }
    html += ideas() + footer();
    $("main").innerHTML = html;
  }

  /* ── Presses ─────────────────────────────────────────────────────── */
  function findCard(k) {
    return customers(S.data || {}, new Date()).filter(function (c) { return c.key === k; })[0] || null;
  }
  document.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act"), i = parseInt(el.getAttribute("data-i"), 10);
    if (act === "connect") connect("whatsapp");
    else if (act === "connect-calendar") connect("google-calendar");
    else if (act === "refresh") refresh();
    else if (act === "all") { S.showAll = true; render(); }
    else if (act === "example") toast(T.exampleOnly);
    else if (act === "draft" || act === "about") {
      var c = findCard(el.getAttribute("data-k"));
      if (!c) return;
      if (act === "draft" && c.waiting) ask(fill(T.draftAsk, { who: c.who, wants: clause(c.waiting.wants, 160) || clause(c.waiting.quote, 160) }));
      else ask(fill(T.aboutAsk, { who: c.who }));
    } else if (act === "idea" || act === "routine") {
      var idea = T.ideas[i];
      if (!idea) return;
      if (!linked()) {
        toast(T.connectFirst);
        if (wa() && wa().canConnect) connect("whatsapp");
        return;
      }
      ask(act === "idea" ? idea.ask : fill(T.routineAsk, { when: T.runs[idea.when] || "", what: idea.ask }));
    } else if (act === "calendar") ask(T.calendarAsk);
    else if (act === "prefs") {
      event.preventDefault();
      if (V2) cab.ask(T.prefsAsk, { send: false }).then(function () { toast(T.opening); }, said);
    } else if (act === "open") {
      event.preventDefault();
      openInCabinet(el.getAttribute("data-to"), event);
    }
  });
  $("ask").addEventListener("submit", function (event) {
    event.preventDefault();
    var input = $("ask-input"), q = input.value.trim();
    if (!q) { input.focus(); return; }
    if (!V2) return;
    cab.ask(q).then(function () { input.value = ""; toast(T.opening); }, said);
  });

  /* ── Start ───────────────────────────────────────────────────────── */
  $("title").textContent = T.title;
  $("ask-label").textContent = T.askLabel;
  $("ask-input").placeholder = T.askPlaceholder;
  $("ask-send").setAttribute("aria-label", T.askSend);
  Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function (el) { el.innerHTML = icon(el.getAttribute("data-icon")); });
  $("chips").innerHTML = T.questions.map(function (q) { return '<button class="chip" type="button" data-q="' + esc(q) + '">' + esc(q) + "</button>"; }).join("");
  $("chips").addEventListener("click", function (event) {
    var chip = event.target.closest ? event.target.closest("[data-q]") : null;
    if (chip) ask(chip.getAttribute("data-q"));
  });

  function watchJobs(jobs) {
    var job = (jobs || []).filter(function (j) { return j.id === JOB; })[0] || (jobs || [])[0] || null;
    var wasRunning = S.job && S.job.running;
    S.job = job;
    if (wasRunning && job && !job.running) loadData();
    render();
  }

  if (V2) {
    Promise.resolve(cab.ready).catch(function () {}).then(function () {
      return Promise.all([
        cab.here().then(function (h) {
          S.appPath = (h && h.appPath) || S.appPath;
          S.cabinetPath = (h && h.cabinetPath) || "";
          S.role = (h && h.role) || "owner";
        }, function () {}),
        cab.connectors.list().then(function (l) { S.connectors = l; }, function () { S.connectors = []; }),
        cab.jobs.list().then(watchJobs, function () {})
      ]);
    }).then(function () {
      cab.connectors.onChange(function (l) { S.connectors = l; loadSaved(); render(); });
      cab.jobs.onChange(watchJobs);
      cab.files.onChange(S.appPath + "/data", function () { loadData(); });
      cab.files.onChange(CHATS, loadSaved);
      loadSaved();
      return loadData();
    });
  } else {
    loadData();
  }
})();
</script>
</body>
</html>
