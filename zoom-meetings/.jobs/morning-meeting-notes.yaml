id: morning-meeting-notes
name: Morning meeting notes
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: meeting-reader
agentSlug: meeting-reader
timeout: 600
prompt: |-
  Write this morning's meeting note.

  Your working directory is the cabinet root. Your persona says where Cabinet keeps the Zoom
  pages and what the note holds.

  1. Print the date with `date '+%Y-%m-%d'`.
  2. Find the Zoom folder in this workspace (the folder whose `.origin.yaml` says
     `service: zoom`). If there is none, or it holds no meeting from yesterday and nothing in
     `Upcoming.md` for today, stop and say so in one sentence.
  3. Read yesterday's meeting pages under `Meetings/` and their summaries under `Summaries/`,
     and today's lines in `Upcoming.md`.
  4. Write `notes/<today>.md` with "Yesterday" and "Today" as the persona describes.

  Finish in one plain sentence: how many meetings yesterday and how many today.
createdAt: '2026-10-15T00:00:00.000Z'
updatedAt: '2026-10-15T00:00:00.000Z'
