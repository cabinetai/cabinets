id: friday-open-items
name: Friday Open Items
enabled: true
schedule: 0 16 * * 5
provider: claude-code
adapterType: claude_local
ownerAgent: account-reader
agentSlug: account-reader
timeout: 1200
prompt: |-
  Write what is still open on this account.

  Your working directory is the cabinet root. Open items is one file, `open-items.md`,
  and you rewrite it in place. It is a list of what is outstanding right now, so there is
  no history and no second copy: overwrite it, and never write a dated version beside it.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns and the tone. This prompt does not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `open-items.md` exactly as you found it, example and all, and report: "There is no
     Google Drive folder in this cabinet yet. Connect Google Drive from Integrations and
     pick the client's folder, then run this again." Then exit.
  4. An open item is something the folder shows was asked for or promised, and shows no
     sign of being done. Read `summary.md` first if it exists: what was agreed is where
     most open items come from. Then look for the rest in notes, reports and any file
     whose date stopped moving.
  5. Say who owes it, us or them, and since when. Where you cannot tell who owes it,
     write "unclear" rather than guessing, and put the file in the last column so a
     person can settle it in ten seconds.
  6. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. Never fall back to the example's contents
     or to what a normal account would have open.
  7. On the first run that does read a folder, replace the whole of `open-items.md`,
     example banner and all. An empty table with a line saying nothing is outstanding is
     a good answer; a made-up row is not.
  8. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder. Write only `open-items.md`.
