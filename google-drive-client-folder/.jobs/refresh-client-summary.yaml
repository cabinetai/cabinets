id: refresh-client-summary
name: Refresh Client Summary
enabled: true
schedule: 30 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: account-reader
agentSlug: account-reader
timeout: 1800
prompt: |-
  Rewrite the summary of this client folder.

  Your working directory is the cabinet root. The summary is one file, `summary.md`, and
  you rewrite it in place. It describes the account as it is right now, so there is no
  history and no second copy: overwrite it, and never write a dated version beside it.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     sections, the Stage vocabulary and the rules about what counts as agreed. This
     prompt does not repeat them.
  2. Find the Drive folder. It is a folder in this cabinet's sidebar that came from
     Google Drive, so it is a real directory on this computer. List what is in this
     cabinet and pick it out.
  3. If there is no Drive folder in this cabinet, STOP HERE. Write nothing, leave
     `summary.md` exactly as you found it, example and all, and report: "There is no
     Google Drive folder in this cabinet yet. Connect Google Drive from Integrations and
     pick the client's folder, then run this again." Then exit.
  4. If more than one Drive folder is here, this cabinet is being asked to be about two
     clients at once, which is what it is not for. Summarize the first folder, and say in
     the opening sentence which one you read and which you left alone.
  5. Read the folder. Signed documents first: contract, statement of work, order form,
     amendments. Then notes, reports and anything with a date. Read enough to be right,
     and stop when another file will not change a sentence.
  6. If the folder is there but cannot be read, say so and stop: name the folder, say
     what the error was, touch no file, exit. A summary you could not read the folder for
     is worse than no summary. Never fall back to the example's contents or to what a
     normal client folder would hold.
  7. On the first run that does read a folder, replace the whole of `summary.md`, example
     banner and all. Never leave a made-up client sitting in a real summary.
  8. This run is read only. Do not create, edit, rename, move or delete anything inside
     the Drive folder. Write only `summary.md`.
