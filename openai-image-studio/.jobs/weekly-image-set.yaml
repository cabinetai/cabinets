id: weekly-image-set
name: Weekly Image Set
# Ships switched off. Every other routine in this showcase set only reads; this one
# generates, and every generation bills the user's own OpenAI key — there is no free
# allowance for agents. A routine that costs money on a timer has to be switched on by
# the person paying. The Studio page reads this file and says "Routine paused" until
# they do.
enabled: false
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: image-maker
agentSlug: image-maker
timeout: 900
prompt: |-
  Make this week's set of four images.

  Your working directory is the cabinet root.

  1. Read your persona before anything else. It holds the naming shape, the default
     subject, and the rules about what you may not generate. This prompt does not
     repeat them.
  2. Write four prompts around the default subject in your persona — four different
     angles on it, not four rewordings of one.
  3. For each, call `openai_generate_image` with `path` set to
     `images/<short-slug>-<YYYY-MM-DD>T<HH-MM-SS>.png`, then write the prompt you
     used to a `.txt` beside it with the same base name.
  4. If the image tool is not available, or the call fails, STOP. Write nothing —
     no image, no .txt. Leave `images/` exactly as you found it, examples and all.
     Report: "OpenAI Image is not connected. I would have generated four images
     around: <the default subject>." Then exit.
  5. On the first run that does succeed, delete the four files matching
     `images/EXAMPLE-*` and their `.txt` companions. They are demos, not past work,
     and they must not sit in the gallery beside real images. Never write `EXAMPLE`
     into a name of your own.
