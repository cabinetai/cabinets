id: morning-calendar-brief
name: Morning Calendar Brief
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: calendar-briefer
agentSlug: calendar-briefer
timeout: 600
prompt: |-
  Write this morning's calendar brief.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-calendar-summary.md` — the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and opens
  the newest, so a name in any other shape is a summary nobody will see. You only ever ADD
  a file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Day` vocabulary and the tone. This prompt does not repeat them.
  2. Read the user's calendar with your Google Calendar tools: every event from today
     through the end of this week, on the primary calendar. Skip anything already
     declined.
  3. This run is read only. Do not create, move, shorten, cancel or respond to anything,
     however obvious the fix looks — acting on the calendar happens only when the user
     asks for it in chat.
  4. If you have no calendar tool, or Google Calendar is not connected, or the call fails,
     STOP HERE. Write nothing. Leave `daily-summaries/` exactly as you found it, example
     and all. Report: "Google Calendar is not reachable. I would have read today's events
     and the rest of this week, and written one row per event." Then exit.
  5. On the first run that does reach the calendar, write your dated file and then delete
     `daily-summaries/EXAMPLE-calendar-summary.md`. It is a demo, not a past summary, and
     it must not sit in the date list beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
