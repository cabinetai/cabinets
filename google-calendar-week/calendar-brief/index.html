<!DOCTYPE html>
<!--
  Calendar Brief: the Google Calendar Week cabinet's app, for a small business.

  Draws data/latest.json, which the cabinet's morning routine writes: the week ahead and
  a client list built from the calendar. Until the first real update it shows
  data/EXAMPLE-latest.json, a made-up heating and cooling company, always labelled.
  It never calls Google: the routine reads the calendar, and a change to an event only
  ever happens in the chat, where the agent asks first. DATA.md describes the file.

  Talks to Cabinet through window.cabinet v2: the connection state and its Connect
  button, Refresh (runs the routine), asks (only from a press), and file reads. An older
  Cabinet without v2 still gets the week, read from the files beside this page.

  One file on purpose: a sealed frame (anyone but the owner) cannot load files next to
  it. Fonts come from Google Fonts, with system fallbacks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your week in business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-2: #f3f5f8;
    --line: #e2e6ec;
    --line-2: #cfd6df;
    --ink: #0e1b3d;
    --ink-2: #334060;
    --ink-3: #566178;
    --blue: #1a73e8;
    --blue-ink: #1558c0;
    --blue-soft: #eaf1fd;
    --blue-line: #c6d9fa;
    --amber: #f2a93b;
    --amber-ink: #8a5300;
    --amber-soft: #fdf3e1;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(14, 27, 61, .04), 0 10px 28px -16px rgba(14, 27, 61, .16);
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page { max-width: 1320px; margin: 0 auto; padding: 28px 32px 64px; }
  @media (max-width: 700px) { .page { padding: 22px 16px 48px; } }

  /* Icons are drawn here, never emoji. */
  .ic { display: inline-flex; width: 1em; height: 1em; flex: none; }
  .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Header ─────────────────────────────────────────── */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 28px; }
  .eyebrow { margin: 0 0 8px; font-weight: 600; font-size: 16px; line-height: 1.3; color: var(--blue-ink); letter-spacing: .01em; }
  .eyebrow .tag { display: inline-block; margin-left: 10px; padding: 0 9px; border-radius: 6px; background: var(--amber-soft); color: var(--amber-ink); }
  h1 { margin: 0; font: 500 46px/1.04 var(--serif); letter-spacing: -.015em; color: var(--ink); }
  .dates { margin: 10px 0 0; color: var(--ink-3); font-size: 17px; }
  @media (max-width: 560px) { h1 { font-size: 36px; } }

  .status { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px 6px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .pill b { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--ink); }
  .pill small { display: block; font-size: 16px; line-height: 1.25; color: var(--ink-3); }
  .pill small .ic { font-size: 14px; margin-right: 4px; vertical-align: -1px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    font-weight: 600; font-size: 16px; line-height: 1; text-decoration: none; white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .btn:hover { border-color: #b7c1ce; background: #fbfcfd; }
  .btn .ic { font-size: 18px; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1765cc; border-color: #1765cc; }
  .btn.light { background: #fff; border-color: #fff; color: var(--ink); }
  .btn.light:hover { background: #eef3fb; }
  .btn.big { min-height: 56px; padding: 0 22px; font-size: 17px; border-radius: 14px; }
  .btn.blue-line { border-color: var(--blue-line); color: var(--blue-ink); background: #fff; }
  .btn.blue-line:hover { background: var(--blue-soft); }
  .btn[disabled] { opacity: .7; cursor: default; }
  .btn img { width: 26px; height: 26px; }
  .btn:focus-visible, .q:focus-visible, .seg button:focus-visible, .ev-main:focus-visible, .cl-name:focus-visible,
  .ask-input:focus-visible, .send:focus-visible, .close:focus-visible, .ccard:focus-visible {
    outline: 3px solid rgba(26, 115, 232, .45); outline-offset: 2px;
  }
  .spin { display: inline-block; width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
  @media (prefers-reduced-motion: no-preference) { .spin { animation: turn .8s linear infinite; } }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ── Banners ────────────────────────────────────────── */
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin: 22px 0 0; padding: 18px 22px;
    border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .banner .words { flex: 1 1 380px; min-width: 0; }
  .banner h2 { margin: 0 0 4px; font: 500 24px/1.2 var(--serif); color: var(--ink); }
  .banner p { margin: 0; color: var(--ink-2); font-size: 16.5px; }
  .banner p + p { margin-top: 4px; }
  .banner.example { background: var(--ink); border-color: var(--ink); }
  .banner.example h2 { color: #fff; }
  .banner.example p { color: #c9d2e3; }
  .banner .label {
    display: inline-block; margin-right: 12px; padding: 0 10px; border-radius: 6px; vertical-align: 3px;
    background: var(--amber); color: #2b1a00; font: 700 16px/1.6 var(--sans); letter-spacing: .05em; text-transform: uppercase;
  }
  .banner.alert { border-left: 4px solid var(--amber); }
  .banner.calm { background: var(--blue-soft); border-color: var(--blue-line); }
  .banner .note { flex-basis: 100%; margin: 0; font-size: 16px; }
  @media (max-width: 560px) { .banner .btn.big { width: 100%; } }

  /* ── The week in numbers ────────────────────────────── */
  .kpis {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 22px 0 0; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .kpi { padding: 20px 22px 18px; border-left: 1px solid var(--line); min-width: 0; }
  .kpi:first-child { border-left: 0; }
  .kpi .label { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-weight: 500; font-size: 16px; }
  .kpi .label .ic { font-size: 18px; color: var(--blue); }
  .kpi .value { margin-top: 8px; font-weight: 600; font-size: 38px; line-height: 1.05; letter-spacing: -.025em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .value.words { font: 500 27px/1.15 var(--serif); letter-spacing: -.005em; }
  .kpi .sub { margin-top: 6px; color: var(--ink-3); font-size: 16px; }
  .kpi.open { background: var(--blue-soft); }
  .kpi.open .value { color: var(--blue-ink); }
  @media (max-width: 960px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-left: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  }
  /* A phone reads the numbers as rows: the figure, then what it means. */
  @media (max-width: 560px) {
    .kpis { grid-template-columns: minmax(0, 1fr); }
    .kpi {
      display: grid; grid-template-columns: 84px minmax(0, 1fr); grid-template-areas: "value label" "value sub";
      align-items: center; column-gap: 12px; padding: 14px 16px; border-left: 0; border-top: 1px solid var(--line);
    }
    .kpi:first-child { border-top: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
    .kpi .label { grid-area: label; }
    .kpi .label .ic { display: none; }
    .kpi .value { grid-area: value; margin-top: 0; font-size: 32px; }
    .kpi .sub { grid-area: sub; margin-top: 0; }
    .kpi.open { grid-template-columns: minmax(0, 1fr); grid-template-areas: "label" "value" "sub"; row-gap: 4px; }
    .kpi.open .value.words { font-size: 24px; }
  }

  .worth {
    display: flex; align-items: flex-start; gap: 12px; margin: 14px 0 0; padding: 14px 18px;
    background: var(--amber-soft); border: 1px solid #f1dcb3; border-radius: 12px; color: #4a3200; font-size: 16.5px;
  }
  .worth .ic { font-size: 20px; color: #b56d00; margin-top: 2px; }
  .worth b { color: #3a2700; }

  /* ── Ask ────────────────────────────────────────────── */
  .ask { margin: 18px 0 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .ask form { display: flex; gap: 10px; }
  .ask-input {
    flex: 1; min-width: 0; min-height: 58px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 12px;
    background: #fff; color: var(--ink); font-size: 18px;
  }
  .ask-input::placeholder { color: #69738a; }
  .ask-input:focus { border-color: var(--blue); }
  .send { width: 58px; min-height: 58px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--blue); color: #fff; }
  .send:hover { background: #1765cc; }
  .send .ic { font-size: 24px; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .q {
    min-height: 44px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff;
    color: var(--ink-2); font-weight: 500; font-size: 16px; text-align: start; transition: background-color .15s ease, border-color .15s ease;
  }
  .q:hover { border-color: var(--blue-line); background: var(--blue-soft); color: var(--blue-ink); }
  .asknote { margin: 10px 2px 0; color: var(--ink-3); font-size: 16px; }
  .asknote:empty { display: none; }
  .asknote.bad { color: #a4291f; font-weight: 500; }
  .quiet-line { margin: 0; color: var(--ink-3); font-size: 16px; }

  /* ── Layout ─────────────────────────────────────────── */
  .main {
    display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(340px, 1fr); gap: 24px; align-items: start; margin-top: 24px;
    grid-template-areas: "week ideas" "clients clients";
  }
  #week { grid-area: week; }
  #ideas { grid-area: ideas; }
  #clients { grid-area: clients; }
  @media (max-width: 1100px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "week" "clients" "ideas"; }
  }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; padding: 22px 22px 14px; }
  .panel-head h2 { margin: 0; font: 500 29px/1.12 var(--serif); letter-spacing: -.01em; color: var(--ink); }
  .panel-head p { margin: 4px 0 0; color: var(--ink-3); font-size: 16px; }

  /* ── This week ──────────────────────────────────────── */
  .day { padding: 14px 22px 16px; border-top: 1px solid var(--line); }
  .dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
  .dayhead .name { font-weight: 600; font-size: 17px; color: var(--ink); }
  .dayhead .name.today { color: var(--blue-ink); }
  .dayhead .date { color: var(--ink-3); font-size: 16px; }
  .dayhead .count { margin-left: auto; color: var(--ink-3); font-size: 16px; }
  .items { display: flex; flex-direction: column; gap: 8px; }

  .ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 14px; }
  .ev-main {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 14px; align-items: start; width: 100%;
    padding: 0; border: 0; background: none; text-align: start; min-height: 44px;
  }
  .ev .time { color: var(--ink-2); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .ev .what { display: block; font-size: 16px; color: var(--ink-2); overflow-wrap: anywhere; }
  .ev .kindword { color: var(--ink-3); }

  .ev.client {
    padding: 12px 14px 12px 12px; border: 1px solid var(--blue-line); border-left: 3px solid var(--blue);
    border-radius: 12px; background: #fbfdff; transition: background-color .15s ease;
  }
  .ev.client:hover { background: #f3f7fe; }
  .ev.client .co { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-weight: 600; font-size: 17px; color: var(--ink); line-height: 1.3; }
  .ev.client .sub { display: block; margin-top: 2px; color: var(--ink-2); font-size: 16px; overflow-wrap: anywhere; }
  .ev.client .place { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--ink-3); font-size: 16px; overflow-wrap: anywhere; }
  .ev.client .place .ic { font-size: 16px; }
  .ev.client .time { color: var(--ink); font-weight: 600; }
  .ev.quiet { padding: 0 14px 0 15px; }
  .ev.quiet .ev-main { align-items: center; }
  .ev.past { opacity: .6; }
  .ev .now { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 600; font-size: 14.5px; line-height: 1.6; vertical-align: 1px; }
  .open-slot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 44px; padding: 8px 14px 8px 15px;
    border: 1px dashed var(--line-2); border-radius: 12px; color: var(--ink-3); font-size: 16px;
  }
  .open-slot .ic { font-size: 18px; }
  .open-slot.best { border-color: var(--blue-line); background: #f7faff; color: var(--blue-ink); }
  .open-slot.best .ic { color: var(--blue); }
  .open-slot.best b { font-weight: 600; }
  .none { margin: 0; color: var(--ink-3); font-size: 16px; }
  .notyet { margin: 0; padding: 12px 14px; border: 1px dashed var(--line-2); border-radius: 12px; color: var(--ink-3); font-size: 16px; }
  @media (max-width: 640px) {
    .ev.client { grid-template-columns: minmax(0, 1fr); }
    .ev.client .act { width: 100%; }
    .ev-main { grid-template-columns: 78px minmax(0, 1fr); }
    .day { padding: 12px 16px 14px; }
    .panel-head { padding: 18px 16px 12px; }
  }

  /* ── Ideas ──────────────────────────────────────────── */
  .ideas .idea { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 14px; padding: 16px 22px; border-top: 1px solid var(--line); }
  .idea .ico { grid-row: span 3; width: 40px; height: 40px; border-radius: 10px; background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; }
  .idea .ico .ic { font-size: 20px; }
  .idea h3 { margin: 0; font-weight: 600; font-size: 16.5px; line-height: 1.35; color: var(--ink); }
  .idea p { margin: 2px 0 10px; color: var(--ink-3); font-size: 16px; }
  .idea .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .idea .acts .btn { min-height: 44px; padding: 0 14px; border-radius: 10px; }
  .idea .acts .btn .ic { font-size: 17px; }
  @media (max-width: 640px) { .ideas .idea { padding: 14px 16px; } }

  /* ── Clients ────────────────────────────────────────── */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff;
    color: var(--ink-2); font-weight: 500; font-size: 16px;
  }
  .seg button .n { margin-left: 6px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg button[aria-pressed="true"] .n { color: #c9d2e3; }
  .cl-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px 16px; }
  .cl-tools > .btn { white-space: normal; text-align: start; line-height: 1.3; padding: 10px 16px; max-width: 100%; }
  @media (max-width: 900px) { .cl-tools > .btn { width: 100%; justify-content: flex-start; } }
  .ctable { width: 100%; border-collapse: separate; border-spacing: 0; }
  .ctable th {
    padding: 12px 16px; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    color: var(--ink-3); font-weight: 500; font-size: 16px; text-align: start;
  }
  .ctable th:first-child, .ctable td:first-child { padding-left: 22px; }
  .ctable th:last-child, .ctable td:last-child { padding-right: 22px; }
  .ctable td { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 16px; vertical-align: middle; }
  .ctable tr:last-child td { border-bottom: 0; }
  .ctable .r { text-align: end; font-variant-numeric: tabular-nums; }
  .ctable tbody tr:hover td { background: #fafbfd; }
  .cl-name { display: block; min-height: 44px; padding: 2px 0; border: 0; background: none; text-align: start; }
  .cl-name b { display: block; font-weight: 600; font-size: 16.5px; color: var(--ink); line-height: 1.35; }
  .cl-name span { display: block; color: var(--ink-3); font-size: 16px; }
  .cl-name:hover b { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
  .muted { color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; font-weight: 600; font-size: 16px; line-height: 1.65; white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.new { background: var(--blue-soft); color: var(--blue-ink); }
  .chip.active { background: #edf0f4; color: var(--ink-2); }
  .chip.quiet { background: var(--amber-soft); color: var(--amber-ink); }
  .cl-empty { margin: 0; padding: 18px 22px 22px; color: var(--ink-3); font-size: 16px; border-top: 1px solid var(--line); }
  .ccards { display: none; }
  @media (max-width: 900px) {
    .ctable { display: none; }
    .ccards { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
    .cl-tools { padding: 0 16px 14px; }
  }
  .ccard { display: block; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: start; }
  .ccard .top-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ccard b { font-weight: 600; font-size: 17px; color: var(--ink); }
  .ccard .who { display: block; margin-top: 2px; color: var(--ink-2); font-size: 16px; }
  .ccard .facts2 { display: block; margin-top: 6px; color: var(--ink-3); font-size: 16px; }

  .foot { margin: 36px 0 0; text-align: center; color: var(--ink-3); font-size: 16px; }
  .foot b { color: var(--ink-2); font-weight: 600; }

  /* ── One thing, opened ──────────────────────────────── */
  .scrim { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(14, 27, 61, .42); }
  .sheet {
    position: relative; width: min(540px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 26px 24px 22px;
    background: #fff; border-radius: 20px; box-shadow: 0 30px 80px -20px rgba(14, 27, 61, .45);
  }
  @media (max-width: 600px) {
    .scrim { align-items: flex-end; padding: 0; }
    .sheet { width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; }
  }
  .sheet .kicker { margin: 0 56px 6px 0; color: var(--blue-ink); font-weight: 600; font-size: 16px; }
  .sheet h2 { margin: 0 56px 14px 0; font: 500 30px/1.15 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
  .sheet .subtitle { margin: -8px 0 14px; color: var(--ink-2); font-size: 16.5px; }
  .facts { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 10px; }
  .facts li { display: flex; gap: 12px; align-items: flex-start; color: var(--ink-2); font-size: 16.5px; overflow-wrap: anywhere; }
  .facts .ic { font-size: 20px; margin-top: 2px; color: var(--ink-3); }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .sheet .acts .btn { flex: 1 1 220px; }
  .close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink-2); }

  function hasWeek(d) { return !!(d && d.generatedAt && d.today); }

  function readFile(name) {

  // ── Talking to Cabinet ──────────────────────────────────────

  function setConnectors(list) {

    if (!S.job && list && list.length) S.job = list[0];

    if (wasRunning && !S.running) {

  function role() { return (S.here && S.here.role) || "owner"; }

    if (S.connecting) return;

  function runNow() {

  function ask(request, opts) {

  // ── What to show ────────────────────────────────────────────

  /** The connection in one word, for the header and the banner. */
  function mode() {
    if (!V2) return "old";
    var c = S.conn;
    if (!c) return "unknown";
    if (c.state === "not-available-here") return "not-here";
    if (S.connecting) return "connecting";
    if (c.state === "not-added") return "not-connected";
    if (c.state === "needs-sign-in" || c.state === "needs-you") return "needs";

  /** Offer "Reschedule" only when the connection can change events. Cabinet's word wins;

  function changeAllowed(data) {
    if (S.conn && typeof S.conn.canChange === "boolean") return S.conn.canChange;
    return !!(data && data.canChange === true);

  /** What went wrong with the last update, in the routine's or Cabinet's own words. */
  function updateProblem() {
    if (S.runNote) return S.runNote;

  function clientOf(data, e) {
    if (!e.client) return null;
    for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === e.client) return data.clients[i];
    return null;
  }

  /** The seven days from today, each with its events; a day the file does not reach says so. */
  function weekOf(data) {
    var today = startOfToday();
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(today, i);
      var key = ymd(d);
      var outside = !data.example && !!data.today && (key < data.today || daysBetween(parseDay(data.today), d) > 6);
      days.push({
        date: d, key: key, outside: outside,
        events: outside ? [] : data.events.filter(function (e) {
          return e.day === key || (e.allDay && e.day < key && e.lastDay >= key);
        })
      });
    }
    return days;
  }

  /** Free stretches between 8:00 and 17:00 on a weekday, from now on for today. */
  function openStretches(day, isToday) {
    var dow = day.date.getDay();
    if (dow === 0 || dow === 6 || day.outside) return [];
    var busy = day.events.filter(function (e) { return !e.allDay; })
      .map(function (e) { return [e.start, endOf(e)]; })
      .sort(function (a, b) { return a[0] - b[0]; });
    var from = WORK_FROM;
    if (isToday) from = Math.max(from, Math.ceil(nowMinutes() / 15) * 15);
    var out = [];
    var cursor = from;
    busy.forEach(function (b) {
      if (b[1] <= cursor) return;
      if (b[0] > cursor && Math.min(b[0], WORK_TO) - cursor >= MIN_OPEN) out.push({ start: cursor, end: Math.min(b[0], WORK_TO) });
      cursor = Math.max(cursor, b[1]);
    });
    if (WORK_TO - cursor >= MIN_OPEN) out.push({ start: cursor, end: WORK_TO });
    return out;
  }

  function stretchWords(day, slot, today) {
    var part = slot.end <= 12 * 60 + 30 ? "morning" : slot.start >= 12 * 60 ? "afternoon" : "";
    var name = dayWord(day.date, today);
    if (name === "Today") return part ? "This " + part : "Today";
    if (!part) return name;
    return name + " " + part;
  }

  /** The week in numbers, worked out from what is shown. */
  function numbers(data, days) {
    var today = startOfToday();
    var meetings = 0, minutes = 0, seen = {}, met = {};
    days.forEach(function (d) {
      d.events.forEach(function (e) {
        if (e.kind !== "client" || e.allDay || seen[e.id]) return;
        seen[e.id] = true;
        meetings += 1;
        minutes += endOf(e) - e.start;
        met[e.client || e.title] = true;
      });
    });
    var best = null;
    days.forEach(function (d, i) {
      openStretches(d, i === 0).forEach(function (s) {
        if (!best || s.end - s.start > best.slot.end - best.slot.start) best = { day: d, slot: s };
      });
    });
    return {
      meetings: meetings,
      hours: minutes / 60,
      clientCount: Object.keys(met).length,
      fresh: data.clients.filter(function (c) { return c.status === "new"; }).length,
      quiet: data.clients.filter(function (c) { return c.status === "quiet"; }).length,
      best: best,
      bestWords: best ? stretchWords(best.day, best.slot, today) : null
    };
  }

    if (!client && e.people.length > 1) who = peopleNodes({ people: e.people.slice(1), more: e.more });
    var main = h("button", { class: "ev-main", type: "button", onclick: openEvent(e) },
      h("span", { class: "time" }, timeWords(e), isNow(e) ? h("span", { class: "now", text: "Now" }) : null),
      h("span", null,
        h("span", { class: "co" }, own(name), client && client.status === "new" ? h("span", { class: "chip new", text: "New" }) : null),
        h("span", { class: "sub" }, who.length ? [who, " · "] : null, own(e.title)),
        e.place ? h("span", { class: "place" }, icon("pin"), own(e.place)) : null));
    var act = null;
    var label = ended ? "Draft follow-up" : "Prep me";
    if (data.example) {
      // On the example the buttons show what is possible; a press explains instead.
      act = h("button", { class: "btn blue-line act", type: "button", onclick: openEvent(e) }, icon(ended ? "reply" : "notes"), label);
    } else if (canAsk()) {
      act = h("button", { class: "btn blue-line act", type: "button", onclick: function () {
        ask(ended ? followAsk(e, client) : prepAsk(e, client));
      } }, icon(ended ? "reply" : "notes"), label);
    }
    return h("div", { class: "ev client" + (ended ? " past" : "") }, main, act);
  }

  function quietRow(e) {
    return h("div", { class: "ev quiet" + (hasEnded(e) ? " past" : "") },
      h("button", { class: "ev-main", type: "button", onclick: openEvent(e) },
        h("span", { class: "time" }, timeWords(e)),
        h("span", { class: "what" }, own(e.title), h("span", { class: "kindword", text: " · " + KIND_WORDS[e.kind] }))));
  }

  function paintWeek(data, days, nums, today) {
    var box = document.getElementById("week");
    box.textContent = "";
    box.appendChild(h("div", { class: "panel-head" },
      h("div", null,
        h("h2", { id: "week-title", text: "This week" }),
        data ? h("p", { text: "Prep notes before each client meeting, a follow-up after it." }) : null)));
    if (!data) {
      box.appendChild(h("div", { class: "loading", text: "Nothing to show yet. Your week appears here after the first morning update." }));
      return;
    }
    days.forEach(function (day, i) {
      var sec = h("div", { class: "day" });
      var clientCount = day.events.filter(function (e) { return e.kind === "client"; }).length;
      var name = dayWord(day.date, today);
      sec.appendChild(h("div", { class: "dayhead" },
        h("span", { class: "name" + (i === 0 ? " today" : ""), text: name }),
        h("span", { class: "date", text: name === DAYS[day.date.getDay()] ? dayDate(day.date) : DAYS[day.date.getDay()] + " " + dayDate(day.date) }),
        clientCount ? h("span", { class: "count", text: plural(clientCount, "client meeting", "client meetings") }) : null));
      var list = h("div", { class: "items" });
      if (day.outside) {
        list.appendChild(h("p", { class: "notyet", text: "Not in this list yet. Refresh to read it." }));
      } else {
        var rows = day.events.map(function (e) { return { at: e.allDay ? -1 : e.start, ev: e }; });
        openStretches(day, i === 0).forEach(function (s) {
          var isBest = nums.best && nums.best.day === day && nums.best.slot.start === s.start;
          if (isBest || s.end - s.start >= MIN_SHOWN) rows.push({ at: s.start - 0.5, slot: s });
        });
        rows.sort(function (a, b) { return a.at - b.at; });
        rows.forEach(function (r) {
          if (r.slot) {
            var best = nums.best && nums.best.day === day && nums.best.slot.start === r.slot.start;
            list.appendChild(h("div", { class: "open-slot" + (best ? " best" : "") },
              icon("phone"),
              best ? h("b", { text: "Best time for sales calls" }) : null,
              h("span", { text: "Open " + clock(r.slot.start) + " to " + clock(r.slot.end) })));
          } else {
            list.appendChild(r.ev.kind === "client" ? clientRow(data, r.ev) : quietRow(r.ev));
          }
        });
        if (!rows.length) list.appendChild(h("p", { class: "none", text: "No meetings." }));
      }
      sec.appendChild(list);
      box.appendChild(sec);
    });
  }

  // ── Ideas ───────────────────────────────────────────────────

  function paintIdeas() {
    var box = document.getElementById("ideas");
    box.textContent = "";
    box.appendChild(h("div", { class: "panel-head" },
      h("div", null,
        h("h2", { id: "ideas-title", text: "What Cabinet can do with your calendar" }),
        h("p", { text: canAsk() ? "Ask once, or make it a routine. You approve every routine in the chat." : "Ask any of these in this cabinet's chat." }))));
    IDEAS.forEach(function (idea) {
      var acts = null;
      if (canAsk()) {
        acts = h("div", { class: "acts" },
          h("button", { class: "btn blue-line", type: "button", onclick: function () { ask(idea.ask); } }, icon("chat"), "Ask now"),
          idea.routine ? h("button", { class: "btn", type: "button", onclick: function () { askRoutine(idea); } }, icon("repeat"), idea.every) : null);
      }
      box.appendChild(h("div", { class: "idea" },
        h("span", { class: "ico" }, icon(idea.icon)),
        h("h3", { text: idea.title }),
        h("p", { text: idea.line }),
        acts));
    });
  }

  // ── Clients ─────────────────────────────────────────────────

  var FILTERS = [
    { id: "all", label: "All" },
    { id: "quiet", label: "Going quiet" },
    { id: "new", label: "New this month" },
    { id: "active", label: "Active" }
  ];

  function sortedClients(data) {
    return data.clients.slice().sort(function (a, b) {
      var an = a.next ? a.next.day + "T" + pad(a.next.start || 0) : null;
      var bn = b.next ? b.next.day + "T" + pad(b.next.start || 0) : null;
      if (an && bn) return an < bn ? -1 : an > bn ? 1 : 0;
      if (an) return -1;
      if (bn) return 1;
      var al = a.lastMet || "", bl = b.lastMet || "";
      return al > bl ? -1 : al < bl ? 1 : 0;
    });
  }

  function nextWords(c, today) { return c.next ? whenShort(c.next.day, c.next.start, today) : null; }

  function statusChip(c) {
    var s = STATUS[c.status];
    return h("span", { class: "chip " + s.cls, text: s.label });
  }

  function checkInAsk(list) {
    return "Draft a short, friendly check-in email for each client going quiet: " + list.map(function (c) {
      return c.name + (c.contact ? " (" + c.contact + ")" : "");
    }).join(", ") + ". Mention when we last met and offer a time to catch up. Write them as drafts; don't send anything.";
  }

  function paintClients(data, today) {
    var box = document.getElementById("clients");
    box.textContent = "";
    if (!data) return;
    var all = sortedClients(data);
    var counts = { all: all.length, quiet: 0, "new": 0, active: 0 };
    all.forEach(function (c) { counts[c.status] += 1; });
    if (S.filter !== "all" && !counts[S.filter]) S.filter = "all";
    var list = all.filter(function (c) { return S.filter === "all" || c.status === S.filter; });
    var quiet = all.filter(function (c) { return c.status === "quiet"; });

    box.appendChild(h("div", { class: "panel-head" },
      h("div", null,
        h("h2", { id: "clients-title", text: "Clients" }),
        h("p", { text: "Built from your calendar: everyone from outside your business you met in the last 90 days." }))));

    var seg = h("div", { class: "seg", role: "group", "aria-label": "Show clients" });
    FILTERS.forEach(function (f) {
      seg.appendChild(h("button", {
        type: "button", "aria-pressed": S.filter === f.id ? "true" : "false",
        onclick: function () { S.filter = f.id; render(); }
      }, f.label, h("span", { class: "n", text: String(counts[f.id] || 0) })));
    });
    var action = null;
    if (quiet.length && (data.example || canAsk())) {
      action = h("button", { class: "btn blue-line", type: "button", onclick: data.example
        ? function () { S.open = { client: quiet[0] }; paintSheet(); }
        : function () { ask(checkInAsk(quiet)); } }, icon("reply"), "Draft check-in emails for everyone going quiet");
    }
    box.appendChild(h("div", { class: "cl-tools" }, seg, action));

    if (!all.length) {
      box.appendChild(h("p", { class: "cl-empty", text: "No meetings with anyone outside your business in the last 90 days." }));
      return;
    }

    var body = h("tbody");
    var cards = h("div", { class: "ccards" });
    list.forEach(function (c) {
      var open = function () { S.open = { client: c }; paintSheet(); };
      var next = nextWords(c, today);
      body.appendChild(h("tr", null,
        h("td", null, h("button", { class: "cl-name", type: "button", onclick: open },
          h("b", null, own(c.name)),
          c.contact ? h("span", null, own(c.contact)) : null)),
        h("td", { class: "r", text: String(c.meetings) }),
        h("td", null, c.lastMet ? sinceWords(c.lastMet, today) : h("span", { class: "muted", text: "Not yet" })),
        h("td", null, next || h("span", { class: "muted", text: "Nothing booked" })),
        h("td", { class: "r", text: hoursWords(c.hours) }),
        h("td", null, statusChip(c))));
      var last = c.lastMet ? sinceWords(c.lastMet, today) : null;
      cards.appendChild(h("button", { class: "ccard", type: "button", onclick: open },
        h("span", { class: "top-line" }, h("b", null, own(c.name)), statusChip(c)),
        c.contact ? h("span", { class: "who" }, own(c.contact)) : null,
        h("span", { class: "facts2" },
          next ? "Next: " + next : "Nothing booked",
          " · ",
          last ? "Last met " + (/^(Today|Yesterday)$/.test(last) ? last.toLowerCase() : last) : "Not met yet",
          " · ",
          plural(c.meetings, "meeting", "meetings") + " in 90 days")));
    });
    box.appendChild(h("table", { class: "ctable" },
      h("thead", null, h("tr", null,
        h("th", { scope: "col", text: "Client" }),
        h("th", { scope: "col", class: "r", text: "Meetings, 90 days" }),
        h("th", { scope: "col", text: "Last met" }),
        h("th", { scope: "col", text: "Next meeting" }),
        h("th", { scope: "col", class: "r", text: "Hours this month" }),
        h("th", { scope: "col", text: "Status" }))),
      body));
    box.appendChild(cards);
  }

  // ── One thing, opened ───────────────────────────────────────

  var lastFocus = null;

  function closeSheet() {
    S.open = null;
    paintSheet();
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  function aboutAsk(client) {
    return "What should I know about " + client.name + "? Our meetings in the last 90 days, what they were about, and what's coming up.";
  }

  function sheetEvent(data, e) {
    var today = startOfToday();
    var d = parseDay(e.day);
    var client = clientOf(data, e);
    var name = dayWord(d, today);
    var when = (name === DAYS[d.getDay()] ? longDate(d) : name + ", " + longDate(d)) +
      (e.allDay ? ", all day" : ", " + clock(e.start) + (e.end !== null ? " to " + clock(e.end) : ""));
    var facts = h("ul", { class: "facts" },
      h("li", null, icon("clock"), h("span", { text: when })),
      client && client.contact ? h("li", null, icon("users"), h("span", null, own(client.contact), " at ", own(client.name))) : null,
      !client && (e.people.length || e.more) ? h("li", null, icon("people"), h("span", null, peopleNodes(e))) : null,
      e.place ? h("li", null, icon("pin"), own(e.place)) : null);
    var acts = h("div", { class: "acts" });
    if (!data.example && canAsk()) {
      if (e.kind === "client") {
        acts.appendChild(hasEnded(e)
          ? h("button", { class: "btn primary", type: "button", onclick: function () { ask(followAsk(e, client)); closeSheet(); } }, icon("reply"), "Draft follow-up")
          : h("button", { class: "btn primary", type: "button", onclick: function () { ask(prepAsk(e, client)); closeSheet(); } }, icon("notes"), "Prep me"));
        if (client) acts.appendChild(h("button", { class: "btn", type: "button", onclick: function () { ask(aboutAsk(client)); closeSheet(); } }, icon("chat"), "About this client"));
      } else {
        acts.appendChild(h("button", { class: "btn primary", type: "button", onclick: function () {
          ask("Tell me about “" + e.title + "” on " + longDate(d) + (e.allDay ? "" : " at " + clock(e.start)) + ".");
          closeSheet();
        } }, icon("chat"), "Ask about this"));
      }
      if (changeAllowed(data) && !e.allDay) {
        acts.appendChild(h("button", { class: "btn", type: "button", onclick: function () {
          ask("Move my “" + e.title + "”" + (client ? " with " + client.name : "") + " on " + longDate(d) + " at " + clock(e.start) + " to ", { send: false });
          closeSheet();
        } }, icon("move"), "Reschedule"));
      }
    }
    if (e.link && !data.example) acts.appendChild(h("a", { class: "btn", href: e.link, target: "_blank", rel: "noopener noreferrer" }, icon("out"), "Open in Google Calendar"));
    return { kicker: e.kind === "client" ? "Client meeting" : KIND_WORDS[e.kind], title: client ? client.name : e.title, sub: client ? e.title : null, facts: facts, acts: acts };
  }

  function sheetClient(data, c) {
    var today = startOfToday();
    var next = nextWords(c, today);
    var facts = h("ul", { class: "facts" },
      c.contact ? h("li", null, icon("users"), h("span", null, "Main contact: ", own(c.contact))) : null,
      h("li", null, icon("calendar"), h("span", { text: plural(c.meetings, "meeting", "meetings") + " in the last 90 days" + (c.lastMet ? ", last on " + longDate(parseDay(c.lastMet)) : "") })),
      h("li", null, icon("clock"), h("span", null, next ? ["Next: ", next, c.next.title ? [", ", own(c.next.title)] : null] : "Nothing booked")),
      h("li", null, icon("receipt"), h("span", { text: c.hours ? hoursWords(c.hours) + " of meetings this month" : "No meetings this month" })));
    var acts = h("div", { class: "acts" });
    if (!data.example && canAsk()) {
      acts.appendChild(h("button", { class: "btn primary", type: "button", onclick: function () { ask(aboutAsk(c)); closeSheet(); } }, icon("chat"), "What should I know"));
      if (c.status === "quiet") {
        acts.appendChild(h("button", { class: "btn", type: "button", onclick: function () {
          ask("Draft a short, friendly check-in email to " + (c.contact || "the main contact") + " at " + c.name + ". Mention when we last met and offer a time to catch up. Write it as a draft; don't send anything.");
          closeSheet();
        } }, icon("reply"), "Draft a check-in"));
      } else if (c.next) {
        acts.appendChild(h("button", { class: "btn", type: "button", onclick: function () {
          ask("Prep me for my next meeting with " + c.name + (c.contact ? " (" + c.contact + ")" : "") + ": who they are, what we did last time, and what to bring.");
          closeSheet();
        } }, icon("notes"), "Prep me for the next one"));
      }
    }
    var kicker = c.status === "quiet" ? "Client going quiet" : c.status === "new" ? "New client" : "Active client";
    return { kicker: kicker, title: c.name, sub: null, facts: facts, acts: acts };
  }

  function paintSheet() {
    var layer = document.getElementById("layer");
    if (!S.open) { layer.textContent = ""; return; }
    if (!layer.childNodes.length) lastFocus = document.activeElement;
    layer.textContent = "";
    var data = shown();
    if (!data) return;
    var part = S.open.event ? sheetEvent(data, S.open.event) : sheetClient(data, S.open.client);
    if (data.example && mode() === "not-connected" && S.conn && S.conn.canConnect) part.acts.appendChild(connectButton(false, false));
    var sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sheet-title" },
      h("button", { class: "close", type: "button", "aria-label": "Close", onclick: closeSheet }, icon("close")),
      h("p", { class: "kicker", text: part.kicker }),
      h("h2", { id: "sheet-title" }, own(part.title)),
      part.sub ? h("p", { class: "subtitle" }, own(part.sub)) : null,
      data.example ? h("p", { class: "madeup", text: "This is from the made-up example. Connect Google Calendar and these buttons work on your own clients: prep notes, follow-ups and check-ins." }) : null,
      part.facts,
      part.acts.childNodes.length ? part.acts : null);
    var scrim = h("div", { class: "scrim", onclick: function (ev) { if (ev.target === scrim) closeSheet(); } }, sheet);
    layer.appendChild(scrim);
    var first = sheet.querySelector(".acts .btn") || sheet.querySelector(".close");
    if (first) first.focus();
  }

  document.addEventListener("keydown", function (ev) {
    if (!S.open) return;
    if (ev.key === "Escape") { ev.preventDefault(); closeSheet(); return; }
    if (ev.key !== "Tab") return;
    // Keep the keyboard inside the open sheet.
    var items = Array.prototype.slice.call(document.querySelectorAll("#layer button, #layer a[href]"));
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  function paintFoot() {
    var foot = document.getElementById("foot");
    foot.textContent = "";
    var when = S.job && S.job.when ? S.job.when : "Every morning at 7";
    // The bridge's words for the schedule can be "Paused" too, so they stand as a label.
    add(foot, [h("b", { text: "Updates: " }), when, ". Cabinet reads your Google Calendar and updates this page and your client list. It never changes your calendar on its own."]);
  }

  // ── Start ───────────────────────────────────────────────────

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { paintHeader(shown(), startOfToday()); }, 150);
  });

  // Meetings end and open time moves on as the day goes.
  setInterval(function () { if (!S.open) render(); }, 5 * 60 * 1000);

  function start() {
    if (!V2) {
      loadData().then(render);
      // No change events in an older Cabinet: look again when the page comes back into view.
      document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData().then(render); });
      return;
    }
    Promise.resolve(cab.here()).then(function (here) {
      S.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath && here.appPath.indexOf("..") < 0) appDir = here.appPath;
    }, function () {}).then(function () {
      return Promise.all([
        cab.connectors.list().then(setConnectors, function () {}),
        cab.jobs.list().then(setJobs, function () {}),
        loadData()
      ]);
    }).then(function () {
      render();
      cab.connectors.onChange(function (list) { setConnectors(list); render(); });
      cab.jobs.onChange(function (list) { setJobs(list); render(); });
      cab.files.onChange(appDir + "/data", function () { loadData().then(render); });
    });
  }

  start();
})();
</script>
</body>
</html>
