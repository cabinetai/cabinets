id: daily-bucket-contents
name: Daily Bucket Contents
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: bucket-reader
agentSlug: bucket-reader
timeout: 900
prompt: |-
  Write today's bucket contents summary.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-contents.md`, the local time you
  ran and then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns and the tone. This prompt does not repeat them.
  2. Find the copied bucket folder in this cabinet. It is the folder that is none of
     `.agents`, `.jobs`, `.cabinet-state`, `summaries` or `contents`, and it is named
     after the bucket. `contents` is this cabinet's own app folder, not copied
     content. Walk it with your file tools and work out what is in there.
  3. This run is read only, and the folder is mounted so that it has to be. Do not
     create, edit, rename, move, copy or delete anything inside it, and do not try to
     write anything back to S3. You write into `summaries/` and nowhere else.
  4. If there is no copied folder, or it is effectively empty of user content, STOP
     HERE. That is the normal state before the first copy. Write nothing, leave
     `summaries/` exactly as you found it, example and all, and report: "The bucket
     has not been copied down yet. Open Cabinet's integrations screen, connect AWS S3,
     and pick a bucket and a prefix. I would have read whatever landed and written up
     to twenty rows, most recently modified first." Then exit.
  5. Same if the folder is there but unreadable. Say so, touch no file, exit. A
     summary you could not read the files for is worse than no summary: never fall
     back to the example's contents, to yesterday's file, or to what a bucket like
     this one usually holds.
  6. A morning where nothing moved is a real result. Write the file and say so in the
     headline. Never pad the table to look busy.
  7. On the first run that does find real copied files, write your dated file and then
     delete `summaries/EXAMPLE-contents.md`. It is a demo, not a past morning, and it
     must not sit in the picker beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
