          '<span class="bw" aria-hidden="true">' + whereHtml(raw) + "</span>" +
          '<span class="bs" aria-hidden="true">' + esc(status) + (join ? '<a class="join" href="' + esc(join) + '" target="_blank" rel="noopener">' + icon("i-video") + "Join</a>" : "") + "</span></li>";
      }).join("") + "</ol>";
    }
    return '<div class="board" role="group" aria-label="Today’s meetings">' +
      '<div class="board-top"><h3>' + icon("i-board") + "Today</h3>" + flaps(hh(now)) + "</div>" + body + boardFoot(now, later) + "</div>";
  }
  /** No calendar to read: the page can't know the free time, so it says nothing about it. */
  function calendarUnknown() { return !state.example && !events().length && V2 && !calendarOn(); }
  function boardFoot(now, later) {
    if (calendarUnknown()) return "";
    var today = sameDay(now, dayDate());
    var next = null;
    freeStretches().forEach(function (f) {
      if (next || f.end <= now || minutesBetween(f.start < now && today ? now : f.start, f.end) < 15) return;
      next = f;
    });
    var words;
    if (next) {
      var from = next.start < now && today ? now : next.start;
      var fits = next.replies.filter(function (id) { return findItem(id); }).length;
      words = (from <= now ? "<b>Free now</b> until " + esc(clock(next.end)) : "Free next: <b>" + esc(clock(from)) + " to " + esc(clock(next.end)) + "</b>") +
        (fits ? ", " + fits + " " + plural(fits, "reply fits", "replies fit") : "");
    } else {
      words = events().length ? "No free time left today" : esc(lengthWords(freeLeft())) + " free";
    }
    if (later > 0) words += ". " + later + " more later today";
    return '<p class="board-foot">' + icon("i-focus") + "<span>" + words + "</span>" +
      (onPage("day") ? '<button type="button" class="btn quiet small" data-act="jump" data-to="day">Your day</button>' : "") + "</p>";
  }

  function drawHeadline(level) {
    var now = refDate();
    var n = waiting().length;
    if (level === "S") {
      return headlineTop() + '<div class="hl-left"><h2>' + esc((state.example ? "Example: " : "") + (n ? n + " waiting on you" : "Nobody is waiting")) + "</h2></div>";
    }
    return headlineTop() +
      '<div class="hl-left"><p class="hello">' + helloHtml() + "</p><h2>Your workday</h2>" + leadHtml() + mailMeta() + workdayHtml(now) + "</div>" +
      boardHtml(level, now);
  }

  /** The first time the board is on screen, its letters flip into place, row by row. */
  var FLAP_CHARS = "0123456789";
  function flipBoard() {
    var box = boxEls.headline;
    if (state.flipped || !box || !box.isConnected || !motionOK()) { state.flipped = state.flipped || !!(box && box.isConnected); return; }
    state.flipped = true;
    var tiles = Array.prototype.slice.call(box.querySelectorAll(".flaps i:not(.sep)"));
    var start = performance.now();
    tiles.forEach(function (el, n) {
      var final = el.textContent;
      var row = el.closest(".brow");
      var delay = (row ? Array.prototype.indexOf.call(row.parentNode.children, row) + 1 : 0) * 140 + (n % 5) * 40;
      el.animate([{ transform: "rotateX(-80deg)", opacity: .4 }, { transform: "none", opacity: 1 }], { duration: 260, delay: delay + 180, easing: "cubic-bezier(.3, 1.4, .6, 1)", fill: "backwards" });
      (function tick(t) {
        if (!el.isConnected) return;
        if (t - start < delay + 360) {
          el.textContent = FLAP_CHARS.charAt(Math.floor(Math.random() * FLAP_CHARS.length));
          requestAnimationFrame(tick);
        } else el.textContent = final;
      })(start);
      // A page that draws no frames still ends on the real time.
      setTimeout(function () { el.textContent = final; }, delay + 900);
    });
  }

  // ── The boxes ──────────────────────────────────────────────────────────

  /** The numbers someone looks for first, each a card. */
  function numberCards() {
    var evs = events();
    var mins = meetingMinutes();
    var free = freeLeft();
    var w = waiting();
    var boss = w.filter(function (x) { return x.kind === "manager"; }).length;
    return {
      meetings: '<a class="kpi" href="#lane-day"><span class="label">' + icon("i-video") + "In meetings today</span>" +
        '<span class="value num">' + esc(evs.length ? lengthWords(mins) : "0 min") + '</span><span class="sub">' + evs.length + " " + plural(evs.length, "meeting", "meetings") + "</span></a>",
      free: '<a class="kpi calm" href="#lane-day"><span class="label">' + icon("i-focus") + "Free time left</span>" +
        '<span class="value num">' + esc(lengthWords(free)) + '</span><span class="sub">between meetings today</span></a>',
      waiting: w.length

          '<span class="value num">' + w.length + '</span><span class="sub">' + (boss ? "Your manager is one" : plural(w.length, "person", "people") + " to answer") + "</span></a>"
        : '<a class="kpi calm" href="#lane-waiting"><span class="label">' + icon("i-check") + "Waiting on you</span>" +
          '<span class="value num">0</span><span class="sub">Everyone has an answer</span></a>'
    };
  }

  /** Each meeting still to come today with other people in it, and the one thing to know. */
  function prepItems() {
    var now = refDate();
    return events().filter(function (e) { return e.end > now && (people(e.raw).length || text(e.raw.prep)); });
  }
  function drawPrep(level) {
    var items = prepItems();
    var now = refDate();
    if (level === "S") {
      var n0 = items[0];
      return sumBox("prep", "Before your meetings", "i-briefcase", String(items.length), items.length ? plural(items.length, "meeting", "meetings") + " still today" : "No more meetings",
        n0 ? "<b>" + esc(clock(n0.start)) + "</b> " + esc(text(n0.raw.title, 80)) : "");
    }

        var mail = typeof raw.prepMailId === "string" && waits[raw.prepMailId] ? waits[raw.prepMailId] : null;
        var join = safeLink(raw.joinUrl);
        var acts = [];
        if (canAsk()) acts.push('<button type="button" class="btn quiet small" data-act="prep" data-id="' + esc(raw.id) + '">' + icon("i-briefcase") + "Get me ready</button>");
        if (mail) acts.push('<button type="button" class="btn quiet small" data-act="open-waiting" data-id="' + esc(mail.id) + '">' + icon("i-mail") + esc(firstName(mail.from)) + "’s email</button>");
        if (join) acts.push('<a class="btn quiet small" href="' + esc(join) + '" target="_blank" rel="noopener">' + icon("i-video") + "Join</a>");
        return '<li class="' + (soon ? "soon" : "") + '"><span class="t">' + esc(bareClock(e.start)) + "<small>" + esc(e.start <= now ? "now" : soon ? "in " + minutesBetween(now, e.start) + " min" : lengthWords(minutesBetween(e.start, e.end))) + "</small></span>" +
          '<div class="m"><b dir="auto">' + esc(text(raw.title, 100) || "Busy") + "</b>" +
          (who.length || text(raw.where) ? '<span class="with" dir="auto">' + esc([who.length ? "with " + names(who) : "", text(raw.where, 60)].filter(Boolean).join(", ")) + "</span>" : "") +
          (text(raw.prep) ? '<p dir="auto">' + icon("i-bulb") + esc(text(raw.prep, 220)) + "</p>" : "") +
          (acts.length ? '<div class="acts">' + acts.join("") + "</div>" : "") + "</div></li>";
      }).join("") + "</ol>",
      calendarOn() || state.example ? "No more meetings with other people today." : "Connect Outlook Calendar and your meetings show up here.").replace(calendarUnknown() ? /<span class="count[^"]*">0<\/span>/ : /$^/, "") + nudgeHtml(boxIdea("prep"));
  }

  // The priority lane: people waiting on an answer.
  function waitingRow(item, index, ref) {
    var id = text(item.id) || "w" + index;
    var open = !!state.open[id];
    var name = text(item.from, 80) || "Someone";
    var chips = [];
    var kind = KIND_WORDS[item.kind] || "";
    if (kind) chips.push('<span class="chip ' + esc(item.kind) + '">' + esc(kind) + "</span>");
    var days = waitingDays(item.waitingSince || item.receivedAt, ref);
    if (item.urgent === true) chips.push('<span class="chip hot">Answer today</span>');
    else if (text(item.due)) chips.push(dueChip(item.due, ref));
    if (days >= 2) chips.push('<span class="chip wait">Waiting ' + days + " days</span>");
    var ev = typeof item.eventId === "string" ? eventById(item.eventId) : null;
    if (ev && ev.end > ref) chips.push('<span class="chip tie">' + icon("i-calendar") + "Before " + esc(bareClock(ev.start)) + " " + esc(text(ev.raw.title, 40)) + "</span>");
    var link = safeLink(item.webLink);
    var hasReply = !!text(item.reply);
    var actions = [];
    if (hasReply) actions.push('<button class="btn dark" data-act="copy" data-id="' + esc(id) + '">' + icon("i-copy") + "Copy the reply</button>");
    if (hasReply && canAsk() && !state.example) actions.push('<button class="btn" data-act="draft" data-id="' + esc(id) + '">' + icon("i-send") + "Put it in my Drafts</button>");
    if (canAsk()) actions.push('<button class="btn quiet" data-act="reply" data-id="' + esc(id) + '">' + icon("i-pen") + (hasReply ? "Change it" : "Draft a reply") + "</button>");
    if (link) actions.push('<a class="btn quiet" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Outlook</a>");
    var style = state.animate ? ' style="--d:' + Math.min(index, 6) * 50 + 'ms"' : "";
    return '<li class="row' + (open ? " open" : "") + (state.animate ? " rise" : "") + '" id="w-' + esc(id) + '"' + style + ">" +

      '<span class="who"><b dir="auto">' + esc(name) + "</b>" + (text(item.company) ? '<span class="co" dir="auto">' + esc(text(item.company, 60)) + "</span>" : "") +
      '<span class="chips">' + chips.join("") + "</span></span>" +
      '<span class="when">' + esc(rowTime(item.receivedAt, ref)) + (hasReply ? '<span class="drafted">' + icon("i-pen") + "Reply drafted</span>" : "") + "</span>" +
      '<span class="gist" dir="auto">' + esc(text(item.gist, 160) || text(item.subject, 160)) + "</span>" +
      "</button>" +
      '<div class="row-body" id="body-' + esc(id) + '"' + (open ? "" : " hidden") + ">" +
      (text(item.subject) ? '<p class="subject">Subject: <span dir="auto">' + esc(text(item.subject, 160)) + "</span></p>" : "") +
      (typeof item.minutes === "number" ? '<p class="short">About ' + esc(lengthWords(item.minutes)) + " to answer.</p>" : "") +
      (hasReply ? draftHtml(text(item.reply, 1500)) : "") +
      (actions.length ? '<div class="row-actions">' + actions.join("") + "</div>" : "") +
      "</div></li>";
  }
  function draftHtml(value) {
    var safe = esc(value).replace(/\[([^\]]{1,120})\]/g, "<mark>$1</mark>");
    var marked = /\[[^\]]{1,120}\]/.test(value);

  }
  function drawWaiting(level) {
    var w = waiting();
    var ref = refDate();
    if (level === "S") {
      var urgent = w.filter(function (x) { return x.urgent === true; }).length;

      return sumBox("waiting", "Waiting on you", "i-reply", String(w.length),
        urgent ? '<span class="hot">' + urgent + " to answer today</span>" : w.length ? plural(w.length, "person", "people") + " waiting" : "Everyone has an answer",
        top ? "<b>" + esc(text(top.from, 60)) + ":</b> " + esc(text(top.gist, 120)) : "");
    }
    return listBox("waiting", "Waiting on you", "i-reply", "", w.length,
      '<ol class="rows">' + w.map(function (item, i) { return waitingRow(item, i, ref); }).join("") + "</ol>",
      "Nobody is waiting on an answer from you.") + nudgeHtml(boxIdea("waiting"));
  }

  /** The day as a list: meetings, and the free stretches with the replies that fit in them. */
  function drawDay(level) {
    var now = refDate();
    var today = sameDay(now, dayDate());
    var free = freeLeft();
    if (calendarUnknown()) {
      return level === "S"
        ? sumBox("day", "Your day", "i-clock", "", "Connect Outlook Calendar", "")
        : listBox("day", "Your day", "i-clock", "", 0, "", "Connect Outlook Calendar and your day shows here: the meetings, the free time between them, and the replies that fit.").replace(/<span class="count[^"]*">0<\/span>/, "");
    }
    if (level === "S") {
      var nx = null;
      events().forEach(function (e) { if (!nx && e.start > now) nx = e; });
      return sumBox("day", "Your day", "i-clock", lengthWords(free), "free between meetings",
        nx ? "Next: <b>" + esc(clock(nx.start)) + "</b> " + esc(text(nx.raw.title, 60)) : "");
    }
    var waits = {};
    waiting().forEach(function (w) { waits[w.id] = w; });
    var rows = [];
    events().forEach(function (e) { rows.push({ kind: "event", at: e.start, e: e }); });
    freeStretches().forEach(function (f) { rows.push({ kind: "gap", at: f.start, f: f }); });
    rows.sort(function (x, y) { return x.at - y.at || (x.kind === "event" ? -1 : 1); });
    // What is over leaves the top, one row kept for context, so the rest of the day shows.
    if (today) {
      var ahead = 0;
      while (ahead < rows.length && (rows[ahead].kind === "event" ? rows[ahead].e.end : rows[ahead].f.end) <= now) ahead++;
      rows = rows.slice(Math.max(0, Math.min(ahead - 1, rows.length - 3)));
    }
    var html = rows.map(function (r) {
      if (r.kind === "event") {

          '<span><b dir="auto">' + esc(text(raw.title, 90) || "Busy") + "</b>" +

      }
      var f = r.f;
      var start = today && f.start < now && f.end > now ? now : f.start;
      var gone = today && f.end <= now;
      var mins = minutesBetween(start, f.end);
      if (mins < 15 && !gone) return "";
      var fits = f.replies.filter(function (id) { return waits[id]; });
      var total = fits.reduce(function (s, id) { return s + (typeof waits[id].minutes === "number" ? waits[id].minutes : 5); }, 0);
      return '<li class="gap' + (gone ? " past" : "") + '"><span class="t">' + esc(bareClock(start)) + "</span>" +
        "<span><b>" + esc(gone ? "Free" : lengthWords(mins) + " free") + "</b>" +
        (fits.length && !gone ? '<span class="sub">Enough for ' + fits.length + " " + plural(fits.length, "reply", "replies") + (total ? ", about " + esc(lengthWords(total)) : "") + "</span>" +
          '<span class="fits">' + fits.map(function (id) {
            var w = waits[id];
            return '<button type="button" class="fit" data-act="open-waiting" data-id="' + esc(id) + '">' + esc(w.kind === "leadership" || w.kind === "external" && !/s/.test(text(w.from)) ? text(w.from, 24) : firstName(w.from)) + (typeof w.minutes === "number" ? "<small>" + esc(w.minutes) + " min</small>" : "") + "</button>";
          }).join("") + "</span>" : "") + "</span></li>";
    }).join("");
    // The free time is the number that matters here, not how many rows there are.
    return listBox("day", "Your day", "i-clock", free ? lengthWords(free) + " free" : "", rows.length,
      '<ol class="rows day-rows">' + html + "</ol>", "Nothing on your calendar today. The whole day is yours.").replace(/<span class="count[^"]*">\d+<\/span>/, "") + nudgeHtml(boxIdea("day"));
  }

  function dueChip(value, ref) {
    var d = parseTime(value);
    if (!d) return '<span class="chip">No date given</span>';

    if (gap === 0) return '<span class="chip hot">Due today</span>';
    if (gap === 1) return '<span class="chip soon">Due tomorrow</span>';
    if (gap < 7) return '<span class="chip">Due ' + esc(d.toLocaleDateString([], { weekday: "long" })) + "</span>";
    return '<span class="chip">Due ' + esc(shortDate(d)) + "</span>";
  }
  function drawPromises(level) {

        p[0] ? "<b>" + esc(text(p[0].what, 70)) + "</b>" : "");
