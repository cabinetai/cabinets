id: write-script
name: Write my script
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 600
prompt: |-
  Write the script for the idea the person picked in the Studio.

  Your working directory is the cabinet root. Follow "Writing a script" in your persona and
  the short-video skill.

  1. Fold in the person's profile changes, as "Changes from the Studio" says.
  2. Read `studio/.data/shared.json`: `picked` is the idea's id. Find it in
     `studio/data/ideas.json`. If nothing is picked, stop and say so in one sentence.
  3. Read `profile.md` and the pages the idea's `source` names. Look for the business's own
     photos, as "Real photos" in your persona says.
  4. Write `studio/data/videos/<id>/video.json` with the script. Each scene's `onScreen` is
     exactly its `said`: the captions show the spoken words. No `brand` field. Older videos
     in the folder may differ; follow the persona, not them. Make no voice, no picture and no
     video.

  Finish in one plain sentence: the script's title and how many scenes it has.
