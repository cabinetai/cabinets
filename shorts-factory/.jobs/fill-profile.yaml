id: fill-profile
name: Fill in my profile
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 600
prompt: |-
  Fill in the brand profile in `profile.md` from what this cabinet already says.

  Your working directory is the cabinet root. Your persona holds the rules for every part of
  the profile: follow "Filling the profile" there.

  1. List the cabinet's pages with one `find . -name '*.md'` call, leaving out `profile.md`,
     `index.md`, `studio/` and every hidden folder. Read the pages that describe the
     business, its customers, its offer, its story and its voice.
  2. Read `profile.md`. Fill only the parts that still say "Not filled yet". Never change a
     part the person already wrote, even if the cabinet says something else.
  3. Write each part in one or two plain sentences, from facts in the pages only. Under it,
     add `Source: <page>` with the page it came from. A part the pages do not answer stays
     "Not filled yet": never guess, never invent numbers, results or customers.
  4. Save `profile.md`.

  Finish in one or two plain sentences: how many parts are filled, and which ones still
  need the person.
