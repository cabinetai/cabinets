id: make-ideas
name: Get video ideas
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 600
prompt: |-
  Make a new set of short video ideas for the Studio.

  Your working directory is the cabinet root. Follow "Making ideas" in your persona and the
  short-video skill.

  1. Fold in the person's changes from the Studio, as "Changes from the Studio" in your
     persona says.
  2. Read `profile.md`. If any part says "Not filled yet", write
     `studio/data/ideas.json` with `"blocked"` naming those parts and no ideas, and stop.
  3. Read the pages the profile names in its `Source:` lines, and any other page that has
     facts for a video (customers, services, process, story).
  4. Write exactly 6 ideas to `studio/data/ideas.json` in the shape `studio/DATA.md` gives.
     Each idea rests on one true fact and names the page it came from. Use a different hook
     pattern for each idea.

  Finish in one plain sentence: how many ideas, and the one you think will do best.
