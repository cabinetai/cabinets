id: update-video
name: Update my video
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 1500
prompt: |-
  Apply the person's changes to a video and make it again.

  Your working directory is the cabinet root. Follow "Making a video" in your persona.

  1. Read `studio/.data/shared.json`: `render` is the id of the video to update, and
     `videos.<id>` holds the person's changes.
  2. Copy those changes into `studio/data/videos/<id>/video.json`, then remove `videos.<id>`
     and `render` from `shared.json`, keeping every other key as it was.
  3. Remake the voiceover or the picture only for scenes whose `said` or `picture` changed,
     with `replace: true`, and make any a scene is still missing. If one cannot be made,
     keep what the video already has. Never delete a voiceover or picture file.
  4. Render with `node studio/render.mjs <id>`.

  Finish in one plain sentence: what changed and how long the video is now.
