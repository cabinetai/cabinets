id: make-video
name: Make my video
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 1500
prompt: |-
  Make the video for the idea the person picked in the Studio.

  Your working directory is the cabinet root. Follow "Making a video" in your persona and
  the short-video skill.

  1. Fold in the person's profile changes, as "Changes from the Studio" says.
  2. Read `studio/.data/shared.json`: `picked` is the idea's id. Find it in
     `studio/data/ideas.json`. If nothing is picked, stop and say so in one sentence.
  3. Read `profile.md` and the pages the idea's `source` names.
  4. Write `studio/data/videos/<id>/video.json`, make the voice and pictures you can, and
     render with `node studio/render.mjs <id>`.

  Finish in one plain sentence: the video's title, how long it is, and anything that could
  not be made.
