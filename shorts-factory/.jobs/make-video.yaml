id: make-video
name: Make my video
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: producer
agentSlug: producer
timeout: 1500
prompt: |-
  Make the video for the script the person finished in the Studio.

  Your working directory is the cabinet root. Follow "Making a video" in your persona.

  1. Read `studio/.data/shared.json`: `render` is the video's id. If it is missing, stop and
     say so in one sentence.
  2. Run `node studio/apply.mjs <id>` to copy the person's changes into the plan.
  3. Make the voices and pictures together in one turn, then the moving clips in another,
     only what the plan asks for and does not have yet.
  4. Render with `node studio/render.mjs <id>`, in the foreground with a 10 minute timeout.
     Wait for it to end before you finish.

  Finish in one plain sentence: the video's title, how long it is, and anything that could
  not be made.
