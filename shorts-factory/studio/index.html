<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700;800;900&family=Heebo:wght@400;500;600;700&family=TikTok+Sans:wght@800&family=Montserrat:wght@900&family=Luckiest+Guy&family=Playfair+Display:wght@800&family=Space+Grotesk:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<script src="compose.js"></script>
<style>
  /* Each step has its own colour. It fills the block at the top of the page, where a few big
     words say what to do. The rest of the page is that colour let down to a tint, and the
     working parts sit on white. */
  :root {
    --lemon: #ffd43b; --gum: #ff6f9c; --sky: #74b9ff; --lilac: #b197fc; --tang: #ff8f4d; --mint: #51d6a0; --hot: #ff4f93; --white: #fff;
    --field: var(--lemon); --block: var(--field); --on-block: var(--ink);
    --ink: #17161c; --on-ink: #ffffff; --ink-hover: #34323d;
    --ground: color-mix(in srgb, var(--field) 13%, #fff);
    --canvas: var(--ground); --surface: #ffffff;
    --muted: color-mix(in srgb, var(--ink) 68%, #fff); --faint: color-mix(in srgb, var(--ink) 54%, #fff);
    --well: color-mix(in srgb, var(--field) 22%, #fff); --hover: color-mix(in srgb, var(--field) 36%, #fff); --row-hover: color-mix(in srgb, var(--field) 9%, #fff);
    --line: color-mix(in srgb, var(--ink) 9%, #fff); --line-strong: color-mix(in srgb, var(--ink) 18%, #fff);
    --pick: var(--ink); --on-pick: #ffffff; --pick-soft: #ffffff; --pick-ink: var(--ink);
    --ghost-a: color-mix(in srgb, var(--field) 20%, #fff); --ghost-b: color-mix(in srgb, var(--field) 42%, #fff);
    --switch-off: color-mix(in srgb, var(--ink) 22%, #fff); --live-wash: #ffe1ea; --live-ink: #c4113f;
    --tally: #ff2e63; --ok: #0f9d6c; --ok-wash: #dcf7ea; --need: #a85600; --need-wash: #fff0d6;
    --hook: #ff4f93; --point: #f0a000; --proof: #12a37a; --cta: #3b82f6;
    --r-s: 10px; --r-m: 18px; --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --lift: 0 1px 0 rgb(23 22 28 / 0.04), 0 18px 36px -26px rgb(23 22 28 / 0.4);
    --ring: 0 14px 28px -14px rgb(23 22 28 / 0.55);
    /* Cabinet's own faces: Instrument Serif for the big words, Inter for the rest, Heebo for Hebrew. */
    --head: "Instrument Serif", Heebo, Georgia, serif; --display: Inter, Heebo, -apple-system, system-ui, sans-serif;
  }
  :root[data-step="idea"] { --field: var(--tang); }
  :root[data-step="script"] { --field: var(--sky); }
  :root[data-step="look"] { --field: var(--lilac); }
  :root[data-step="make"] { --field: var(--gum); }
  :root[data-step="post"] { --field: var(--mint); }
  :root[data-step="library"] { --field: #cfcbe6; --block: var(--ink); --on-block: #fff; }
  /* On the colour block: text is the ink let down with the colour itself, never grey. */
  .hero, .make { --muted: color-mix(in srgb, var(--on-block) 78%, var(--block)); --faint: color-mix(in srgb, var(--on-block) 56%, var(--block)); color: var(--on-block); }
  .panel, .card, .tl, .menu, .premake, .stages { --muted: color-mix(in srgb, var(--ink) 68%, #fff); --faint: color-mix(in srgb, var(--ink) 54%, #fff); color: var(--ink); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; scrollbar-gutter: stable; scrollbar-color: color-mix(in srgb, var(--ink) 40%, transparent) transparent; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/1.45 Inter, Heebo, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; transition: background-color 520ms var(--ease); }
  ::selection { background: var(--ink); color: #fff; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; caret-color: var(--hot); }
  ::placeholder { color: var(--faint); opacity: 1; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .shell { max-width: 1080px; margin: 0 auto; padding: 14px 28px 40px; }

  /* top: the six steps, numbered because they run in order */
  .top { display: flex; align-items: center; gap: 8px 12px; min-height: 40px; }
  .tiktok { color: #000; } .instagram { color: #ff0069; } .youtube { color: #ff0000; } .x { color: #000; } .facebook { color: #0866ff; }
  .am { display: inline-grid; place-items: center; flex: none; }
  .am svg.brand { width: 14px; height: 14px; }
  .reel { flex: none; }
  .frames { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: 0 10px 24px -16px rgb(23 22 28 / 0.5); }
  .st { flex: none; height: 32px; padding: 0 10px 0 5px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; color: var(--ink); font: 500 13.5px/1 var(--display); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .st .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 9%, #fff); font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .st .n svg.i { width: 12px; height: 12px; stroke-width: 3; }
  .st:not([disabled]):not(.here):hover { background: color-mix(in srgb, var(--field) 40%, #fff); }
  .st[disabled] { color: color-mix(in srgb, var(--ink) 45%, #fff); cursor: default; }
  .st.done .n { background: var(--mint); }
  .st.here, .st.here[disabled] { background: var(--ink); color: #fff; font-weight: 600; }
  .st.here .n { background: var(--field); color: var(--ink); transition: background-color 520ms var(--ease); }
  .st .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  @keyframes rec { 50% { opacity: 0.35; } }
  .tright { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
  .vsw { position: relative; min-width: 0; flex: 0 1 auto; }
  .vsw:not([hidden]) { display: inline-flex; align-items: center; }
  .vsw > button { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px 0 14px; border-radius: 999px; font-weight: 500; font-size: 13px; max-width: 220px; background: #fff; box-shadow: 0 10px 24px -16px rgb(23 22 28 / 0.5); }
  .vsw > button:hover { background: var(--well); }
  .vsw > button { min-width: 0; width: 100%; }
  .vsw > button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu { position: absolute; inset-inline-end: 0; top: 46px; z-index: 20; width: 290px; padding: 6px; border-radius: 20px; background: var(--surface); box-shadow: 0 24px 48px -18px rgb(23 22 28 / 0.55); animation: pop 160ms var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
  .menu .mi { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 8px; border-radius: 14px; text-align: start; }
  .menu .mi:hover { background: var(--hover); }
  .menu .mi[aria-current="true"] { background: var(--well); }
  .menu .mi strong { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .mi small { color: var(--muted); font-size: 12px; }
  .menu .th { width: 26px; aspect-ratio: 9 / 16; border-radius: 6px; }
  .menu .mnew { width: 26px; height: 26px; border-radius: 50%; background: var(--well); display: grid; place-items: center; }
  .modes { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; flex: none; box-shadow: 0 10px 24px -16px rgb(23 22 28 / 0.5); }
  .modes button { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; font: 500 14px/1 var(--display); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .modes button:hover { background: color-mix(in srgb, var(--field) 40%, #fff); }
  .modes button[aria-selected="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .modes button svg.i { width: 14px; height: 14px; }
  .modes .n { font-size: 12px; font-variant-numeric: tabular-nums; opacity: 0.7; }

  /* the hero: a block in the step's colour, a few big words, and the one thing to press */
  .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; align-items: center; margin: 14px 0 24px; padding: 38px 36px 36px; border-radius: 28px; background: var(--block); }
  .hero h1 { margin: 0; font: 400 clamp(46px, 8.2vw, 78px)/0.94 var(--head); letter-spacing: -0.02em; text-wrap: balance; }
  .hero .sub { margin: 14px 0 0; font-size: 16px; line-height: 1.4; max-width: 40ch; color: var(--muted); text-wrap: pretty; }
  .hero .cta { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hero .art { position: relative; align-self: stretch; min-height: 150px; }
  .hero.tight { overflow: visible; grid-template-columns: minmax(0, 1fr) auto; padding: 22px 22px 22px 30px; margin-bottom: 18px; border-radius: 24px; }
  .hero.tight h1 { font-size: clamp(34px, 5.4vw, 46px); }
  .hero.tight .sub { margin-top: 6px; font-size: 14.5px; max-width: 44ch; }
  .hero.tight .art { width: 130px; min-height: 64px; }
  .hero .side { position: relative; min-width: 0; }
  /* flat shapes in the page's colours, and one dark disc that carries a number */
  .stk { position: absolute; fill: var(--c); overflow: visible; }
  .badge { position: absolute; width: var(--s, 120px); aspect-ratio: 1; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; align-content: center; text-align: center; }
  .badge b { font-family: var(--head); line-height: 1; } .badge small { font-family: var(--display); line-height: 1; }
  .badge b { font-weight: 400; font-size: calc(var(--s, 120px) * 0.38); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .badge b.word { font-size: calc(var(--s, 120px) * 0.27); }
  .badge small { font-weight: 600; font-size: calc(var(--s, 120px) * 0.115); margin-top: 4px; opacity: 0.8; }
  .enter .hero h1 { animation: slap 240ms var(--ease); }
  @keyframes slap { from { opacity: 0; transform: translateY(14px); } }
  .enter .stk, .enter .badge { animation: stick 300ms var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms + 40ms); }
  @keyframes stick { from { opacity: 0; scale: 0.7; } }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: #fff; box-shadow: 0 0 0 1px rgb(23 22 28 / 0.07), 0 1px 2px rgb(23 22 28 / 0.06); font: 600 14px/1 var(--display); text-decoration: none; color: var(--ink); transition: background 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease); white-space: nowrap; }
  .btn:hover { background: color-mix(in srgb, var(--field) 30%, #fff); }
  .btn:active { transform: scale(0.96); }
  .panel .btn, .card .btn, .stages .btn { background: var(--well); }
  .panel .btn:hover, .card .btn:hover { background: var(--hover); }
  .btn.primary, .btn.quiet, .dock .btn, .panel .btn, .card .btn { box-shadow: none; }
  .btn.primary, .panel .btn.primary, .card .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover, .panel .btn.primary:hover, .card .btn.primary:hover { background: var(--ink-hover); }
  .btn.quiet, .panel .btn.quiet, .card .btn.quiet { background: transparent; }
  .btn.quiet:hover, .panel .btn.quiet:hover, .card .btn.quiet:hover { background: var(--hover); }
  .btn.big { height: 48px; padding: 0 24px; font-size: 17px; }
  .btn.big svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.sm svg.i { width: 13px; height: 13px; }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ico { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); }
  .ico:hover { background: var(--hover); color: var(--ink); }
  .ico[disabled] { opacity: 0.3; cursor: default; background: none; }
  .ico svg.i { width: 15px; height: 15px; }

  .note { margin-top: 14px; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 16px; font-size: 13px; background: #fff; }
  .note.warn { background: var(--need-wash); }
  .note svg.i { color: var(--need); }

  /* the brand: six answers on two white sheets */
  .group { margin-top: 22px; }
  .group:first-of-type { margin-top: 0; }
  .group h2 { margin: 0 0 8px 6px; font: 400 26px/1.1 var(--head); letter-spacing: -0.01em; }
  .panel { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); overflow: hidden; }
  .item + .item { border-top: 1px solid var(--line); }
  .row { width: 100%; display: grid; grid-template-columns: 32px 108px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 18px 12px 14px; text-align: start; min-height: 58px; }
  button.row:hover { background: var(--row-hover); }
  .tile { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--c, var(--well)); color: var(--ink); }
  .tile svg.i { width: 16px; height: 16px; }
  .label { font: 600 15px/1.2 var(--display); display: inline-flex; align-items: center; gap: 8px; }
  .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview.unset { color: var(--faint); }
  .item.open .preview { visibility: hidden; }
  .end { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); }
  .end .chev { transition: transform 200ms var(--ease); }
  .item.open .end .chev { transform: rotate(90deg); }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 12.5px/1 var(--display); }
  .add .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--field); }
  .saving { font: 400 12px/1 Inter, sans-serif; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .saving svg.i { width: 13px; height: 13px; }
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease); }
  .item.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .detail .inner { padding: 0 18px 16px 58px; }
  .full { margin: 0; max-width: 62ch; white-space: pre-line; font-size: 15px; }
  .meta { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .file { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--well); color: var(--muted); font-size: 12px; }
  .file svg.i { width: 13px; height: 13px; }
  .meta .btn { height: 28px; font-size: 13px; margin-inline-start: auto; }
  .meta .btn svg.i { width: 13px; height: 13px; }
  .editor textarea { width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; border: 0; border-radius: 16px; background: var(--well); font-size: 15px; }
  .editor textarea:focus { outline: 3px solid var(--ink); outline-offset: 0; background: var(--surface); }
  .editor .acts { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .editor .acts .sp { flex: 1; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .opt { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--well); font: 500 14px/1 var(--display); transition: background 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease); }
  .opt:hover { background: var(--hover); }
  .opt:active { transform: scale(0.95); }
  .opt[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .opt[aria-pressed="true"] .am { color: var(--on-ink); }
  .opt .brand { width: 14px; height: 14px; flex: none; }
  .row.choice, .row.field { grid-template-columns: 32px 108px minmax(0, 1fr); }
  .hint { grid-column: 3; justify-self: end; font-size: 12px; color: var(--muted); margin-top: -6px; }

  .empty { margin: 34px auto 0; text-align: center; display: grid; justify-items: center; gap: 12px; }
  .empty .big { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 14px 26px -14px rgb(23 22 28 / 0.5); }
  .empty .big svg.i { width: 38px; height: 38px; stroke-width: 2; }
  .empty h3 { margin: 8px 0 0; font: 400 38px/1 var(--head); letter-spacing: -0.015em; }
  .empty p { margin: 0; color: var(--muted); max-width: 36ch; font-size: 15px; }
  .empty .btn { margin-top: 6px; }

  /* ideas: six little phones, stuck on the page */
  .ideas { margin-top: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 30px 22px; padding: 6px; }
  .idea { position: relative; display: grid; gap: 6px; align-content: start; }
  .idea .btn::after { content: ""; position: absolute; inset: -6px; border-radius: 26px; }
  .idea:hover .btn:not([disabled]) { background: var(--ink); color: #fff; }
  .phone { position: relative; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; isolation: isolate; container-type: inline-size; box-shadow: var(--ring); transition: rotate 320ms var(--ease), scale 320ms var(--ease); background: #1d1c22; }
  .idea:hover .phone { scale: 1.02; }
  .phone .bg { position: absolute; inset: 0; z-index: -1; }
  .idea .cap { position: absolute; left: 9%; right: 9%; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; font: 800 clamp(15px, 11.5cqw, 24px)/1.1 var(--display); letter-spacing: -0.025em; text-wrap: balance; text-shadow: 0 2px 10px rgb(0 0 0 / 0.35); }
  .idea .cap .w { display: inline-block; padding: 0 0.14em; border-radius: 0.24em; }
  .idea .cap .w.on { background: var(--field); color: var(--ink); text-shadow: none; }
  .idea h3 { margin: 10px 0 0; font: 600 16px/1.25 var(--display); letter-spacing: -0.005em; }
  .idea .src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); max-width: 100%; }
  .idea .src span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idea .src svg.i { width: 12px; height: 12px; }
  .idea .btn { justify-self: start; height: 32px; margin-top: 4px; }
  .idea .btn svg.i { width: 14px; height: 14px; }
  .idea.on .phone { box-shadow: 0 0 0 3px var(--ground), 0 0 0 6px var(--ink); }
  .ghost-phone { aspect-ratio: 9 / 16; border-radius: 16px; background: linear-gradient(100deg, var(--ghost-a) 30%, var(--ghost-b) 50%, var(--ghost-a) 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .ghost-line { height: 12px; border-radius: 6px; background: var(--ghost-a); margin-top: 4px; }
  .sk { height: 58px; border-top: 1px solid var(--line); background: linear-gradient(100deg, var(--surface) 30%, var(--ghost-b) 50%, var(--surface) 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .sk:first-child { border-top: 0; }
  @keyframes sh { to { background-position: -150% 0; } }

  /* the editor: the phone, its settings beside it, the scenes as a timeline below */
  .stu { margin-top: 0; display: grid; grid-template-columns: minmax(0, 1fr) min(380px, 48%); gap: 22px; align-items: start; }
  .stu > * { min-width: 0; }
  .monitor { position: sticky; top: 14px; padding: 6px 0 0; display: grid; justify-items: center; gap: 14px; }
  .monitor .pv { width: min(100% - 12px, 290px, max(190px, calc((100vh - 420px) * 9 / 16))); }
  .monitor .transport { width: min(100%, 290px); }
  .transport { display: flex; align-items: center; gap: 10px; padding: 5px 16px 5px 5px; border-radius: 999px; background: #fff; }
  .transport .btn.round { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; background: var(--ink); color: var(--on-ink); }
  .transport .btn.round:hover { background: var(--ink-hover); }
  .transport .btn.round svg.i { width: 14px; height: 14px; fill: currentColor; }
  .transport .t { flex: 1; font-size: 13px; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--ink) 70%, #fff); }
  .transport .t b { color: var(--ink); font: 600 14px/1 var(--display); }
  .help { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .hintline { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .hintline svg.i { width: 14px; height: 14px; margin-top: 1px; }
  .pv { position: relative; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; isolation: isolate; container-type: inline-size; background: #1d1c22; box-shadow: var(--ring); user-select: none; -webkit-user-select: none; }
  .pv .field { position: absolute; inset: 0; transition: background 300ms var(--ease); }
  .pv .orb { position: absolute; width: 90%; aspect-ratio: 1; left: 5%; top: 20%; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / 0.14), rgb(255 255 255 / 0) 65%); animation: drift 9s ease-in-out infinite alternate; }
  .pv .orb.two { width: 110%; left: -24%; top: 54%; mix-blend-mode: screen; opacity: 0.55; animation-duration: 12s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-6%, 4%) scale(0.92); } to { transform: translate(8%, -6%) scale(1.12); } }
  .pv .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.15), rgb(0 0 0 / 0.05) 40%, rgb(0 0 0 / 0.35)); }
  .pv .cap { transform: translate(-50%, -50%); cursor: default; }
  .pv.edit .cap { cursor: grab; touch-action: none; }
  .pv.edit .cap.drag { cursor: grabbing; }
  .pv.edit .cap:hover { outline: 2px dashed rgb(255 255 255 / 0.7); outline-offset: 6px; }
  .pv.edit .cap .w { cursor: pointer; }
  .pv .guide { position: absolute; background: rgb(255 255 255 / 0.6); pointer-events: none; opacity: 0; transition: opacity 120ms; }
  .pv .guide.v { top: 0; bottom: 0; left: 50%; width: 1px; } .pv .guide.h { left: 0; right: 0; top: 50%; height: 1px; }
  .pv .guide.on { opacity: 1; }
  .pv .making { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: #fff; font: 600 15px/1.2 var(--display); background: rgb(23 22 28 / 0.6); }
  .pv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

  /* the timeline: a time ruler, the scenes as clips on a track, a voice track, and a playhead */
  .tl { margin-top: 20px; position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); padding: 8px 14px 14px 8px; }
  .tl .gut { display: grid; grid-template-rows: 22px 60px auto; align-items: center; justify-items: center; color: var(--faint); }
  .tl .gut svg.i { width: 14px; height: 14px; }
  .tl .lanes { position: relative; display: grid; grid-template-rows: 22px 60px auto; gap: 0; min-width: 0; }
  .ruler { position: relative; height: 22px; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ruler i { position: absolute; bottom: 3px; width: 1px; height: 4px; background: var(--line-strong); }
  .ruler i.big { height: 8px; background: var(--faint); }
  .ruler span { position: absolute; top: 1px; transform: translateX(-50%); }
  .ruler span:first-of-type { transform: none; margin-left: 8px; }
  .lane { position: relative; display: flex; gap: 4px; height: 60px; }
  .clip { position: relative; min-width: 0; flex: 1 1 0; height: 100%; padding: 8px 10px; border-radius: 12px; text-align: start; background: color-mix(in srgb, var(--k) 20%, #fff); display: grid; align-content: space-between; cursor: pointer; overflow: hidden; transition: box-shadow 140ms var(--ease), background 140ms var(--ease); }
  .clip:hover { background: color-mix(in srgb, var(--k) 30%, #fff); }
  .clip[aria-current="true"] { box-shadow: inset 0 0 0 2.5px var(--ink); background: color-mix(in srgb, var(--k) 32%, #fff); }
  .clip .kt { display: flex; align-items: center; gap: 5px; padding-inline-end: 30px; font: 600 11.5px/1 var(--display); color: color-mix(in srgb, var(--k) 45%, var(--ink)); white-space: nowrap; overflow: hidden; }
  .clip .kt svg.i { width: 11px; height: 11px; flex: none; }
  .clip b { font-size: 12.5px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .clip.add { flex: 0 0 42px; display: grid; place-items: center; background: var(--well); color: var(--ink); padding: 0; }
  .clip.add:hover { background: var(--ink); color: #fff; }
  .vlane { display: flex; gap: 4px; height: 20px; margin-top: 5px; }
  .vlane i { flex: 1 1 0; min-width: 0; border-radius: 6px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 34%, transparent) 0 2px, transparent 2px 5px) center / 100% 56% no-repeat, var(--well); }
  .vlane i.off { background: var(--well); }
  .ph { position: absolute; top: 0; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; z-index: 3; }
  .ph::before { content: ""; position: absolute; top: -1px; left: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }

  /* what the apps cover: their buttons on the right and the caption at the foot */
  .safe { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .safe .rc { position: absolute; right: 3.5%; top: 47%; display: grid; gap: 4.5cqw; justify-items: center; }
  .safe .rc i { width: 9cqw; height: 9cqw; border-radius: 50%; background: rgb(255 255 255 / 0.82); box-shadow: 0 1px 4px rgb(0 0 0 / 0.3); }
  .safe .rc i:first-child { width: 10.5cqw; height: 10.5cqw; background: rgb(255 255 255 / 0.95); }
  .safe .bt { position: absolute; left: 4.5%; bottom: 6.5%; width: 66%; display: grid; gap: 1.8cqw; }
  .safe .bt i { height: 2.6cqw; border-radius: 2cqw; background: rgb(255 255 255 / 0.8); }
  .safe .bt i:first-child { width: 42%; height: 3.2cqw; }
  .safe .bt i:last-child { width: 78%; }
  .safe .zone { position: absolute; background: repeating-linear-gradient(135deg, rgb(255 90 95 / 0.22) 0 6px, transparent 6px 12px); }
  .safe .zone.r { right: 0; top: 44%; width: 17%; bottom: 20%; border-radius: 10px 0 0 10px; }
  .safe .zone.b { left: 0; right: 0; bottom: 0; height: 21%; }
  .trim { position: absolute; top: 6px; bottom: 6px; right: 2px; width: 8px; border-radius: 4px; cursor: ew-resize; display: grid; place-items: center; opacity: 0; transition: opacity 140ms var(--ease); touch-action: none; }
  .trim::after { content: ""; width: 3px; height: 18px; border-radius: 2px; background: var(--ink); }
  .clip:hover .trim, .clip[aria-current="true"] .trim, .trim.on { opacity: 1; }
  .clip .secs { position: absolute; right: 12px; top: 8px; font-size: 10.5px; color: color-mix(in srgb, var(--ink) 70%, #fff); font-variant-numeric: tabular-nums; }
  .clip { container-type: inline-size; }
  @container (max-width: 96px) { .clip .secs { display: none; } .clip .kt { padding-inline-end: 0; } }
  .clip.drop-before { box-shadow: inset 4px 0 0 var(--ink); }
  .clip.dragging { opacity: 0.45; }
  .count { font-variant-numeric: tabular-nums; }
  .count.over { color: var(--live-ink); font-weight: 600; }

  /* settings */
  .insp { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .insp > *, .post > *, .make > * { min-width: 0; }
  .card { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); overflow: hidden; }
  .scbar { display: flex; align-items: center; gap: 2px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
  .scbar .ttl { font: 600 17px/1.2 var(--display); flex: 1; }
  .scbar .ttl small { color: var(--muted); font: 400 13px/1 Inter, sans-serif; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }
  .fld { display: grid; gap: 8px; padding: 14px 18px; }
  .fld + .fld { border-top: 1px solid var(--line); }
  .fld > .lab { display: flex; align-items: center; gap: 8px; font: 600 14px/1.2 var(--display); }
  .fld > .lab svg.i { width: 15px; height: 15px; color: var(--faint); }
  .fld > .lab .r { margin-inline-start: auto; color: var(--muted); font: 400 12px/1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
  .fld input[type="text"], .fld textarea, .fld select { width: 100%; border: 0; border-radius: 14px; padding: 10px 14px; background: var(--well); resize: none; font-size: 15px; line-height: 1.4; }
  .fld textarea { field-sizing: content; min-height: 2.6lh; }
  .popr { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .popr img { width: 40px; height: 40px; object-fit: cover; border-radius: var(--r-s); background: #fff; }
  .popr span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { outline: 3px solid var(--ink); outline-offset: 0; background: var(--surface); }
  .kinds4 { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--well); }
  .k4 { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 6px; border-radius: 999px; font: 500 13px/1 var(--display); color: var(--muted); white-space: nowrap; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .k4:hover { color: var(--ink); }
  .k4[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .k4 svg.i { width: 14px; height: 14px; }
  .k4[data-kind4="hook"] svg.i { color: var(--hook); } .k4[data-kind4="point"] svg.i { color: var(--point); } .k4[data-kind4="proof"] svg.i { color: var(--proof); } .k4[data-kind4="cta"] svg.i { color: var(--cta); }
  .k4[aria-pressed="true"] svg.i { color: var(--field); }
  .seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--well); }
  .seg button { flex: 1; height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border-radius: 999px; color: var(--muted); font: 500 13px/1 var(--display); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .seg .n { font-variant-numeric: tabular-nums; opacity: 0.7; }
  .card .seg { display: flex; }
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pre { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #34323d, #17161c); border: 0; transition: box-shadow 160ms var(--ease), transform 160ms var(--ease); }
  .pre:hover { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--line-strong); }
  .pre:active { transform: scale(0.96); }
  .pre[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--ink); }
  .pre .cap { pointer-events: none; }
  .pre small { position: absolute; left: 9px; bottom: 6px; font: 600 11.5px/1 var(--display); color: rgb(255 255 255 / 0.85); }
  .fonts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .fontb { height: 42px; border-radius: 14px; background: var(--well); font-size: 18px; display: grid; place-items: center; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .fontb:hover { background: var(--hover); }
  .fontb[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .range { width: 100%; accent-color: var(--ink); }
  .swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sw { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(23 22 28 / 0.16); transition: transform 160ms var(--ease), box-shadow 160ms var(--ease); }
  .sw:hover { transform: scale(1.12); }
  .sw[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgb(23 22 28 / 0.16), 0 0 0 2px var(--surface), 0 0 0 5px var(--ink); }
  .colorin { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
  .colorin::-webkit-color-swatch-wrapper { padding: 0; } .colorin::-webkit-color-swatch { border: 1px solid rgb(23 22 28 / 0.18); border-radius: 50%; }
  .pal { display: flex; height: 28px; width: 58px; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(23 22 28 / 0.16); }
  .pal i { flex: 1; }
  .pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--ink); }
  .tog { display: flex; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: start; }
  .tog + .tog { border-top: 1px solid var(--line); }
  .tog .tx { flex: 1; min-width: 0; font: 600 14px/1.25 var(--display); }
  .tog .tx small { display: block; font: 400 12px/1.35 Inter, sans-serif; color: var(--muted); margin-top: 2px; }
  .sw2 { width: 40px; height: 24px; border-radius: 999px; background: var(--switch-off); position: relative; transition: background 200ms var(--ease); flex: none; }
  .sw2::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(23 22 28 / 0.3); transition: transform 240ms var(--ease); }
  .tog[aria-pressed="true"] .sw2 { background: var(--ink); }
  .tog[aria-pressed="true"] .sw2::after { transform: translateX(16px); }
  [dir="rtl"] .tog[aria-pressed="true"] .sw2::after { transform: translateX(-16px); }
  .sec { border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; }
  .sec > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 14px; font: 600 16px/1.2 var(--display); text-align: start; }
  .sec > button:hover { background: var(--row-hover); }
  .sec > button .chev { margin-inline-start: auto; color: var(--faint); transition: transform 200ms var(--ease); }
  .sec.open > button .chev { transform: rotate(90deg); }
  .sec .detail .body { padding: 2px 16px 18px; display: grid; gap: 14px; }
  .sec.open .detail { grid-template-rows: 1fr; }
  .sec .tog { padding-inline: 0; }
  .sub2 { display: grid; gap: 8px; }
  .sub2 > .lab { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  /* voices: pick one, hear it first */
  .voices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vo { position: relative; }
  .vo [data-voice] { width: 100%; display: grid; gap: 1px; padding: 8px 10px 8px 44px; border-radius: 16px; text-align: start; color: var(--muted); background: var(--well); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .vo [data-voice] b { font: 600 14px/1.2 var(--display); color: var(--ink); }
  .vo [data-voice] span { font-size: 12px; }
  .vo [data-voice]:hover { background: var(--hover); }
  .vo [data-voice][aria-pressed="true"] { background: var(--ink); color: rgb(255 255 255 / 0.78); }
  .vo [data-voice][aria-pressed="true"] b { color: #fff; }
  .vo [data-hear] { position: absolute; inset-inline-start: 9px; top: 50%; translate: 0 -50%; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); transition: transform 160ms var(--ease); }
  .vo [data-hear] svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
  .vo [data-hear]:hover { transform: scale(1.12); }
  .vo [data-hear][aria-pressed="true"] { background: var(--field); }

  /* make: the phone on one side, what is being made on the other */
  .make { margin: 14px 0 0; padding: 40px; border-radius: 28px; background: var(--block); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 44px; align-items: center; }
  .acts2 { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .make .monitor { position: relative; top: 0; }
  .make .monitor .pv { width: min(100%, 250px); }
  .make h2 { margin: 12px 0 8px; font: 400 clamp(40px, 6.4vw, 62px)/0.94 var(--head); letter-spacing: -0.02em; text-wrap: balance; }
  .make p.s { margin: 0 0 20px; color: var(--muted); font-size: 16px; }
  .rolling { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--ink); font: 600 13px/1 var(--display); color: #fff; }
  .rolling i { width: 8px; height: 8px; border-radius: 50%; background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  .stages { display: grid; background: #fff; border-radius: var(--r-m); padding: 4px 18px; }
  .stg { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); color: var(--faint); }
  .stg:first-child { border-top: 0; }
  .stg b { font: 600 15px/1.2 var(--display); display: block; color: inherit; }
  .stg small { color: var(--faint); font-size: 12.5px; }
  .stg .tile { width: 30px; height: 30px; background: var(--well); color: var(--faint); }
  .stg.now { color: var(--ink); } .stg.now small { color: var(--muted); } .stg.now .tile { color: var(--ink); background: var(--field); }
  .stg.done { color: var(--ink); } .stg.done small { color: var(--muted); } .stg.done .tile { color: var(--ink); background: var(--mint); }
  .stg.done .tile svg.i { stroke-width: 3; width: 14px; height: 14px; }
  .bar2 { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; margin-top: 8px; }
  .bar2 i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width 400ms var(--ease); }

  .post { margin-top: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 34px; align-items: start; }
  .post .sticky { position: sticky; top: 14px; display: grid; gap: 12px; justify-items: center; padding: 6px; }
  .post .sticky .pv { width: 100%; }
  .pcard + .pcard { margin-top: 14px; }
  .pcard .ttl { display: inline-flex; align-items: center; gap: 9px; }
  .pcard .ttl .am svg.brand { width: 17px; height: 17px; }
  .pcard .tags { margin-top: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 13px; color: var(--ink); background: var(--well); padding: 4px 11px; border-radius: 999px; }
  .notes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .notes li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 9px 12px; border-radius: 14px; background: var(--need-wash); }
  .notes li svg.i { width: 14px; height: 14px; color: var(--need); margin-top: 2px; }

  /* the next thing to do: a dark pill beside the headline */
  .dock { position: relative; z-index: 20; width: fit-content; max-width: 100%; margin-inline-start: auto; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--ink); color: #fff; box-shadow: 0 18px 30px -16px rgb(23 22 28 / 0.7); }
  .dock .msg { font-size: 13.5px; color: rgb(255 255 255 / 0.82); display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; font-variant-numeric: tabular-nums; margin-inline-end: 10px; }
  .dock .msg svg.i { color: rgb(255 255 255 / 0.6); }
  .dock .btn { height: 40px; padding: 0 18px; font-size: 15px; background: var(--field); color: var(--ink); transition: background-color 520ms var(--ease), transform 160ms var(--ease); }
  .dock .btn:hover { background: #fff; }
  .dock .btn.quiet { background: transparent; color: #fff; padding: 0 12px; }
  .dock .btn.quiet:hover { background: rgb(255 255 255 / 0.16); }

  .enter .fade > :not(.hero) { animation: fadein 180ms var(--ease) backwards; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } }

  /* library */
  .libbar { margin-top: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .libbar .seg { background: #fff; }
  .find { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; color: var(--muted); width: 220px; }
  .find:focus-within { box-shadow: 0 0 0 3px var(--ink); }
  .find input { border: 0; outline: 0; background: none; width: 100%; font-size: 14px; color: var(--ink); }
  .lib { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 30px 20px; padding: 6px; }
  .vc { display: grid; gap: 10px; text-align: start; align-content: start; }
  .vc .cvb { display: block; width: 100%; border-radius: 14px; }
  .vc .player { max-width: none; border-radius: 14px; }
  .vc .player .pt { display: none; }
  .vc .player .pp { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  .vc .player .pbar { padding: 20px 6px 6px; gap: 2px; }
  .vc .va { display: flex; gap: 6px; }
  .note + .post { margin-top: 18px; }
  .vc .va .btn { background: #fff; }
  .vc .va .btn.ic { width: 32px; padding: 0; justify-content: center; }
  /* A cover that is still loading is a dark frame, never a pale one with white words. */
  .cvw { position: relative; border-radius: 14px; background: #1d1c22; transition: rotate 320ms var(--ease); }
  .cv { position: relative; z-index: 1; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; container-type: inline-size; isolation: isolate; box-shadow: var(--ring); }
  .cv .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.12), rgb(0 0 0 / 0) 40%, rgb(0 0 0 / 0.4)); }
  .cv .cap { transform: translate(-50%, -50%); margin: 0; pointer-events: none; }
  .cv .chip { position: absolute; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: rgb(23 22 28 / 0.7); color: #fff; font: 600 11.5px/1 var(--display); font-variant-numeric: tabular-nums; }
  .cv .chip.dur { bottom: 8px; inset-inline-end: 8px; }
  .cv .chip.st { top: 8px; inset-inline-start: 8px; background: var(--lemon); color: var(--ink); }
  .cv .chip.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .cv .chip.st.making i { background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  .cv .chip.ed { top: 8px; inset-inline-end: 8px; padding: 0 6px; }
  .cv .chip svg.i { width: 11px; height: 11px; stroke-width: 2.2; }
  .cv .hov { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 180ms var(--ease); }
  .cv .hov span { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgb(0 0 0 / 0.3); }
  .cv .hov svg.i { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-inline-start: 2px; }
  .vc:hover .cv .hov { opacity: 1; }
  .vc .tt { font: 600 15px/1.25 var(--display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }
  .vc .mt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: -4px; }
  .vc .mt .am svg.brand { width: 11px; height: 11px; }
  .vc .mt .pmk { display: inline-flex; gap: 6px; margin-inline-start: auto; }

  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
  .libempty { margin-top: 10px; display: grid; justify-items: center; text-align: center; gap: 12px; padding: 30px 20px 48px; }
  .libempty .ghosts { display: flex; gap: 14px; margin-bottom: 14px; }
  .libempty .ghosts i { width: 64px; aspect-ratio: 9 / 16; border-radius: 12px; background: var(--gum); rotate: -8deg; }
  .libempty .ghosts i:nth-child(2) { translate: 0 -10px; rotate: 2deg; background: var(--lemon); }
  .libempty .ghosts i:nth-child(3) { rotate: 9deg; background: var(--mint); }
  .libempty h2 { margin: 0; font: 400 44px/1 var(--head); letter-spacing: -0.015em; }
  .libempty p { margin: 0; color: var(--muted); font-size: 15px; max-width: 38ch; }
  .libempty .btn { margin-top: 6px; }

  /* Integrations: one row per integration Cabinet uses to make the video. */
  .links { display: grid; gap: 6px; }
  .motion { display: grid; gap: 6px; }
  .motion button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 14px; border-radius: 14px; text-align: start; font-size: 13.5px; color: var(--ink); background: var(--well); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .motion button:hover { background: var(--hover); }
  .motion button svg.i { width: 15px; height: 15px; }
  .motion button small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .motion button[aria-checked="true"] { background: var(--ink); color: #fff; font-weight: 500; }
  .motion button[aria-checked="true"] small { color: rgb(255 255 255 / 0.75); }
  .pv .field video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #pvbg, #pvfg { display: contents; }
  .monitor .pv { cursor: pointer; }
  .pv .pvplay { position: absolute; top: 50%; left: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); box-shadow: 0 6px 18px rgb(0 0 0 / 0.3); opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease); z-index: 3; }
  .pv .pvplay svg.i { width: 20px; height: 20px; fill: currentColor; stroke: none; margin-inline-start: 3px; }
  .monitor .pv:hover .pvplay { opacity: 0.92; }
  .monitor .pv.edit .cap:hover ~ .pvplay { opacity: 0; }
  /* The player: a vertical frame that fits the window, controls on a soft shade. */
  .player { position: relative; width: 100%; max-width: max(200px, min(100%, calc((100vh - 360px) * 9 / 16))); aspect-ratio: 9 / 16; margin-inline: auto; border-radius: 20px; overflow: hidden; background: #000; outline-offset: 4px; box-shadow: var(--ring); }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; cursor: pointer; }
  .player .pp { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); box-shadow: 0 10px 24px rgb(0 0 0 / 0.35); transition: opacity 160ms var(--ease), transform 160ms var(--ease); }
  .player .pp:hover { transform: scale(1.08); }
  .player .pp svg.i { width: 22px; height: 22px; fill: currentColor; stroke: none; margin-inline-start: 3px; }
  .player.on .pp { opacity: 0; transform: scale(0.9); pointer-events: none; }
  .player .pbar { position: absolute; inset-inline: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 26px 10px 10px; background: linear-gradient(180deg, transparent, rgb(0 0 0 / 0.55)); color: #fff; transition: opacity 200ms var(--ease); }
  .player.on .pbar { opacity: 0; }
  .player.on:hover .pbar, .player.on:focus-within .pbar { opacity: 1; }
  .player .pk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
  .player .pk:hover { background: rgb(255 255 255 / 0.2); }
  .player .pk svg.i { width: 17px; height: 17px; }
  .player .seek { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; }
  .player .seek::before, .player .seek i { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgb(255 255 255 / 0.3); }
  .player .seek i { background: #fff; transform-origin: left; transform: scaleX(0); }
  [dir="rtl"] .player .seek i { transform-origin: right; }
  .player .seek:hover::before, .player .seek:hover i { height: 6px; margin-top: -3px; }
  .player .pt { font-size: 11.5px; font-variant-numeric: tabular-nums; opacity: 0.9; white-space: nowrap; }
  .player:fullscreen { max-width: none; border-radius: 0; box-shadow: none; }
  .link { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 12px 9px 10px; border-radius: 16px; background: var(--well); }
  .link .lt { min-width: 0; font-size: 13px; line-height: 1.3; }
  .link .lt b { font: 600 14px/1.2 var(--display); }
  .link .lt small { display: block; color: var(--muted); font-size: 12px; }
  .link .wait { color: var(--muted); display: grid; place-items: center; width: 26px; }
  .link .end { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--b, var(--ink)); }
  .link .end img { width: 18px; height: 18px; object-fit: contain; }
  .link .end svg.i { width: 16px; height: 16px; }
  .link .ok { position: absolute; top: -4px; inset-inline-end: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; transform: scale(0.4); opacity: 0; transition: transform 240ms var(--ease), opacity 160ms var(--ease); }
  .link .ok svg.i { width: 9px; height: 9px; stroke-width: 3.2; }
  .link.on { background: var(--ok-wash); }
  .link.on .ok { transform: scale(1); opacity: 1; }
  .link.busy .end { animation: breathe 1.2s var(--ease) infinite alternate; }
  @keyframes breathe { to { box-shadow: 0 0 0 4px color-mix(in srgb, var(--b, var(--ink)) 25%, transparent); } }
  .link.off .end { opacity: 0.55; }
  .needdot { width: 8px; height: 8px; border-radius: 50%; background: var(--tally); margin-inline-start: 2px; flex: none; }
  .st .needdot { margin-inline-start: 0; }
  .premake { position: absolute; top: calc(100% + 10px); inset-inline-end: 0; z-index: 30; width: min(340px, calc(100vw - 28px)); padding: 14px 0 4px; border-radius: 22px; background: var(--surface); box-shadow: 0 24px 48px -16px rgb(23 22 28 / 0.6); animation: pop 180ms var(--ease); transform-origin: top right; }
  .premake h3 { margin: 0 12px 10px 18px; font: 600 17px/1.2 var(--display); display: flex; align-items: center; gap: 8px; }
  .premake h3 .grow { flex: 1; }
  .premake .links { margin: 0 10px 8px; }
  .premake .foot { display: flex; justify-content: flex-end; padding: 0 10px 8px; }
  .premake .btn.primary { background: var(--ink); color: #fff; height: 30px; padding: 0 12px; font-size: 13px; }
  .premake .btn.quiet { color: var(--ink); height: 34px; font-size: 14px; }
  .premake .btn.quiet:hover { background: var(--hover); }

  /* the party: paper bits fall once, when a video has just been made */
  .party { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
  .party i { position: absolute; top: -24px; width: var(--w); height: var(--h); background: var(--c); border-radius: var(--br); animation: fall var(--t) cubic-bezier(0.3, 0, 0.7, 0.6) var(--d) both; }
  @keyframes fall { from { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; } 85% { opacity: 1; } to { transform: translate3d(var(--x), 108vh, 0) rotate(var(--rot)); opacity: 0; } }

  /* Cabinet shows the team beside the page, so the Studio is often about 800px wide. */
  @media (max-width: 800px) {
    .st:not(.here) { padding-inline-end: 5px; }
    .st:not(.here) span.t { display: none; }
  }
  @media (max-width: 1000px) {
    .vsw > button { max-width: 150px; }
  }
  @media (max-width: 720px) {
    .stu { grid-template-columns: minmax(0, 1fr); }
    .monitor { position: static; }
    .hero, .hero.tight { grid-template-columns: minmax(0, 1fr); }
    .hero .art { display: none; }
    .hero .side { margin-top: 10px; }
    .dock { margin-inline-start: 0; }
  }
  @media (max-width: 680px) {
    .shell { padding: 12px 16px 24px; }
    .top { flex-wrap: wrap; }
    .tright { flex: 1 0 auto; }
    .vsw > button { max-width: 140px; }
    .make, .post { grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .make, .hero { padding: 26px 22px; }
    .make .monitor, .make > .phone { justify-self: center; width: 230px; }
    .post .sticky { position: static; max-width: 280px; margin-inline: auto; }
    .row { grid-template-columns: 32px minmax(0, 1fr) auto; }
    .row .preview { grid-column: 2 / 4; grid-row: 2; margin-top: -8px; }
    .row.choice, .row.field { grid-template-columns: 32px minmax(0, 1fr); }
    .row.choice .opts { grid-column: 1 / -1; justify-content: flex-start; }
    .hint { grid-column: 1 / -1; justify-self: start; margin-top: 0; }
    .detail .inner { padding-inline-start: 18px; }
    .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .find { width: 100%; order: 3; }
    .dock { border-radius: 26px; flex-wrap: wrap; padding: 8px; }
    .dock .msg { flex: 1 1 100%; margin: 4px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .party { display: none; } }
</style>

    wirePlayers();
    if (c.canWrite && !c.canWrite()) document.querySelectorAll("[data-choice],[data-edit],[data-save]").forEach((b) => { b.disabled = true; });
    // Only buttons inside the screen: the page itself carries the step's name for its colour.
    $("main").querySelectorAll("[data-step]").forEach((b) => { b.onclick = () => go(b.dataset.step); });
    document.querySelectorAll("[data-toggle]").forEach((b) => { b.onclick = () => { const name = PARTS[+b.dataset.toggle].name; open = open === name ? null : name; editing = null; paint(); const ta = $("ta" + b.dataset.toggle); if (ta) ta.focus(); }; });
    document.querySelectorAll("[data-edit]").forEach((b) => { b.onclick = () => { editing = PARTS[+b.dataset.edit].name; paint(); const ta = $("ta" + b.dataset.edit); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }; });
    document.querySelectorAll("[data-close]").forEach((b) => { b.onclick = () => { editing = null; open = null; paint(); }; });
    document.querySelectorAll("[data-save]").forEach((b) => { b.onclick = () => { const i = +b.dataset.save, ta = $("ta" + i), val = ta.value.trim(); if (!val) { ta.focus(); return; } editing = null; open = null; tell(PARTS[i].name, val); }; });
    document.querySelectorAll("[data-quick]").forEach((b) => { b.onclick = () => { const ta = $("ta" + b.dataset.quick); ta.value = ta.value.trim() ? ta.value.trim().replace(/\.?$/, ". ") + b.textContent + "." : b.textContent + "."; ta.focus(); }; });
    document.querySelectorAll("[data-choice]").forEach((b) => {
      b.onclick = () => {
        const p = PARTS[+b.dataset.part]; const val = b.dataset.choice;
        if (b.getAttribute("aria-pressed") === "true") return;
        const rest = restLines(p.name); tell(p.name, rest ? val + "\n" + rest : val);
      };
    });
    const fill = $("fill"); if (fill) fill.onclick = () => { running = true; say(""); paint(); c.jobs.run("fill-profile").catch((e) => { running = false; say(e && e.message ? e.message : "Reading your pages could not start. Try again."); paint(); }); };
    const gi = $("getIdeas"); if (gi) gi.onclick = () => { ideasRunning = true; say(""); paint(); c.jobs.run("make-ideas").catch((e) => { ideasRunning = false; say(e && e.message ? e.message : "Ideas could not start. Try again."); paint(); }); };
    document.querySelectorAll("[data-use]").forEach((b) => { b.onclick = () => useIdea(b.dataset.use); });
    document.querySelectorAll("[data-open]").forEach((b) => { b.onclick = () => { currentVideo = b.dataset.open; sel = 0; const x = cur(); go(x && stateOf(x) === "ready" ? "post" : "script"); }; });
    const mk = $("makeBtn"); if (mk) mk.onclick = () => { const v = cur(); if (v && !premake && missing().length) { premake = true; if (view === "look" || view === "script") paint(); else go("look"); return; } premake = false; makeVideo(); };
    const pc = $("pmClose"); if (pc) pc.onclick = () => { premake = false; paint(); };
    const ps = $("pmStill"); if (ps) ps.onclick = () => { const v = cur(); (vEdits[v.id] = vEdits[v.id] || {}).motion = "still"; premake = false; makeVideo(); };
    document.querySelectorAll("[data-motion]").forEach((b) => { b.onclick = () => { const v = cur(); (vEdits[v.id] = vEdits[v.id] || {}).motion = b.dataset.motion; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-connect]").forEach((b) => { b.onclick = () => connectNeed(b.dataset.connect); });
    const un = $("undo"); if (un) un.onclick = () => { const v = cur(); if (!v) return; delete vEdits[v.id]; saveEdits(); sel = 0; paint(); };
    wireScenes();
    wireInspector();
    document.querySelectorAll("[data-post]").forEach((f) => {
      f.oninput = () => {
        const v = cur(); const e = (vEdits[v.id] = vEdits[v.id] || {}); e.post = e.post || {}; e.post[f.dataset.post] = e.post[f.dataset.post] || {}; e.post[f.dataset.post][f.dataset.pfield] = f.value; saveEdits();
        const lab = f.parentElement.querySelector("[data-count]"), p = postOf(v, f.dataset.post);
        if (lab) lab.outerHTML = countOf(f.dataset.post, f.dataset.pfield, f.value, f.dataset.pfield === "caption" ? p.hashtags : []);
      };
    });
    document.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = () => {
        const v = cur(); if (!v) return; const post = postOf(v, b.dataset.copy); const text = post.caption + "\n\n" + post.hashtags.join(" ");
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { b.innerHTML = icon("check") + "Copied"; }, () => { b.innerHTML = icon("alert") + "Select and copy it instead"; });
      };
    });
  }
  function wireInspector() {
    const v = cur(); if (!v || (view !== "script" && view !== "look")) return;
    document.querySelectorAll("[data-field]").forEach((f) => {
      f.oninput = () => {
        const s = editable(v).scenes[sel]; if (!s) return;
        const k = f.dataset.field; s[k] = k === "seconds" ? Number(f.value) : f.value;
        // The words are said and shown alike: one line for both.
        if (k === "said") { s.onScreen = f.value; const n = $("f-said-n"); if (n) n.textContent = C.words(f.value).length + " words"; delete s.key; }
        if (k === "seconds") { const n = $("f-sec-n"); if (n) n.textContent = (Math.round(Number(f.value) * 10) / 10) + " sec"; }
        saveEdits(); drawPreview(); refreshScenes();
      };
    });
    const popOff = $("popOff"); if (popOff) popOff.onclick = () => { editable(v).scenes[sel].pop = false; saveEdits(); paint(); };
    document.querySelectorAll("[data-kind4]").forEach((b) => { b.onclick = () => { editable(v).scenes[sel].kind = b.dataset.kind4; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-sec]").forEach((b) => { b.onclick = () => { secOpen[b.dataset.sec] = !secOpen[b.dataset.sec]; const s = b.closest(".sec"); s.classList.toggle("open", secOpen[b.dataset.sec]); b.setAttribute("aria-expanded", String(secOpen[b.dataset.sec])); }; });
    document.querySelectorAll("[data-preset]").forEach((b) => { b.onclick = () => { const p = C.PRESETS[b.dataset.preset], patch = { preset: b.dataset.preset }; ["style", "font", "upper", "size", "color", "accent", "y"].forEach((k) => { patch[k] = p[k]; }); patch.x = 50; setLook(v, patch); paint(); }; });
    document.querySelectorAll("[data-cstyle]").forEach((b) => { b.onclick = () => { setLook(v, { style: b.dataset.cstyle }); paint(); }; });
    document.querySelectorAll("[data-font]").forEach((b) => { b.onclick = () => { setLook(v, { font: b.dataset.font }); paint(); }; });
    const size = $("f-size"); if (size) size.oninput = () => { setLook(v, { size: Number(size.value) }); $("size-n").textContent = size.value; drawPreview(); };
    document.querySelectorAll("[data-accent]").forEach((b) => { b.onclick = () => { setLook(v, { accent: b.dataset.accent }); paint(); }; });
    const acc = $("f-accent"); if (acc) acc.oninput = () => { setLook(v, { accent: acc.value }); drawPreview(); };
    document.querySelectorAll("[data-place]").forEach((b) => { b.onclick = () => { const e = editable(v); e.scenes.forEach((s) => { delete s.pos; }); setLook(v, { y: Number(b.dataset.place), x: 50 }); paint(); }; });
    const all = $("allScenes"); if (all) all.onclick = () => { const e = editable(v), p = e.scenes[sel].pos; e.scenes.forEach((s) => { delete s.pos; }); setLook(v, { x: p.x, y: p.y }); paint(); };
    document.querySelectorAll("[data-pal]").forEach((b) => { b.onclick = () => { const e = (vEdits[v.id] = vEdits[v.id] || {}); e.palette = PALETTES[+b.dataset.pal]; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-tog]").forEach((b) => {
      b.onclick = () => {
        const k = b.dataset.tog;
        if (k === "safe") { showSafe = !showSafe; paint(); return; }
        const e = (vEdits[v.id] = vEdits[v.id] || {});
        if (k === "speak") e.speak = !speakOf(v);
        else setLook(v, { [k]: !lookOf(v)[k] });
        saveEdits(); paint();
      };
    });
    document.querySelectorAll("[data-voice]").forEach((b) => { b.onclick = () => { (vEdits[v.id] = vEdits[v.id] || {}).voice = b.dataset.voice; saveEdits(); paint(); }; });
  }

  /* Each voice has a short sample in studio/voices, so the person hears it before choosing. */
  const sample = new Audio();
  sample.preload = "none";
  function showHearing() {
    document.querySelectorAll("[data-hear]").forEach((b) => {
      const on = b.dataset.hear === hearing;
      b.setAttribute("aria-pressed", String(on));
      b.innerHTML = icon(on ? "pause" : "play");
    });
  }
  sample.onended = sample.onerror = () => { hearing = ""; showHearing(); };
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-hear]");
    if (!b) return;
    const name = b.dataset.hear;
    if (hearing === name) { sample.pause(); hearing = ""; showHearing(); return; }
    hearing = name;
    sample.src = "voices/" + name.toLowerCase() + ".m4a";
    sample.play().catch(() => { hearing = ""; showHearing(); });
    showHearing();
  });

  /* ---------- data ---------- */
  function loadIdeas() {
    return c.files.read("studio/data/ideas.json").then((t) => { try { ideas = JSON.parse(t); } catch (e) { ideas = null; } }, () => { ideas = null; });
  }
  function loadVideos() {
    if (!c.files.list) return Promise.resolve();
    return c.files.list("studio/data/videos").then((entries) => {
      const dirs = (entries || []).filter((e) => e.isDir);
      return Promise.all(dirs.map((d) => {
        const base = "studio/data/videos/" + d.name + "/";
        return Promise.all([c.files.read(base + "video.json").then(JSON.parse, () => null), c.files.read(base + "render.json").then(JSON.parse, () => null)])
          .then((r) => r[0] && Array.isArray(r[0].scenes) ? { id: d.name, plan: r[0], render: r[1] } : null);
      }));
    }, () => []).then((list) => {
      videos = (list || []).filter(Boolean).sort((a, b) => String(b.plan.createdAt || "").localeCompare(String(a.plan.createdAt || "")));
      // The handlers hold the old video objects: rebuild once so they hold the new ones.
      lastHTML = "";
    });
  }
  function watchJobs(list) {
    videoJobs = videoJobs || {};
    (list || []).forEach((job) => {
      if (job.id === "fill-profile") {
        const was = running; running = !!job.running;
        if (was && !running && job.lastRun && job.lastRun.ok === false) say("Reading your pages stopped early. Try again, or add the parts yourself.");
      }
      if (job.id === "write-script") {
        // Only a run seen going and then stopping ends "Writing", so a click that has not
        // reached the routine yet is not undone by the last run's old result.
        const was = videoJobs[job.id]; videoJobs[job.id] = !!job.running;
        if (was && !job.running) {
          if (job.lastRun && job.lastRun.ok === false) say("The script stopped before it was done. Try again.");
          const id = scriptingId; scriptingId = null;
          loadVideos().then(() => { if (id && hasVideo(id)) { currentVideo = id; sel = 0; if (view === "script") { /* stay */ } } paint(); });
        }
        if (job.running && !scriptingId && pickedIdea) scriptingId = pickedIdea;
      }
      if (job.id === "make-video") {
        const was = videoJobs[job.id]; videoJobs[job.id] = !!job.running;
        if (was && !job.running) {
          if (job.lastRun && job.lastRun.ok === false) say("The video stopped before it was done. Try again.");
          const id = makingId; makingId = null;
          loadVideos().then(() => {
            // A made video has taken the person's changes in, so the saved copy of them is done with.
            const v = id ? videoById(id) : cur();
            if (v && stateOf(v) === "ready" && vEdits[v.id]) { delete vEdits[v.id]; if (canSave) c.store.set("videos", vEdits).catch(() => {}); }
            if (v && stateOf(v) === "ready" && view === "make") view = "post";
            if (v && stateOf(v) === "ready" && job.lastRun && job.lastRun.ok !== false) cheer();
            paint();
          });
        }
        if (job.running && !makingId) { const r = canSave && c.store.get ? c.store.get("render") : null; makingId = typeof r === "string" && r ? r : currentVideo; }
      }
      if (job.id === "make-ideas") {
        const was = ideasRunning; ideasRunning = !!job.running;
        if (was && !ideasRunning && job.lastRun && job.lastRun.ok === false) say("Writing ideas stopped early. Try again.");
      }
    });
    paint();
  }
  function load() {
    if (!inCabinet) { say("Open Shorts Factory in Cabinet to use the Studio."); return; }
    Promise.all([
      c.files.read("profile.md").then((t) => { file = parse(t); }, () => { file = {}; say("profile.md is missing. Fill from my pages makes a new one."); }),
      loadIdeas(), loadVideos(),
    ]).then(() => { readEdits(); if (!loaded) firstView(); loaded = true; paint(); });
  }
  /** Open on the step the person is at: the newest video, the picked idea, else the brand. */
  function firstView() {
    const v = videos[0];
    if (v) { currentVideo = v.id; view = stateOf(v) === "ready" ? "post" : stateOf(v) === "making" ? "make" : "script"; }
    else if (profileDone() && pickedIdea) view = "idea";
    else if (profileDone()) view = "idea";
    else view = "brand";
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && premake && !linking) { premake = false; paint(); return; }
    if (e.key === "Escape" && mode === "library" && libSel) { libSel = null; paint(); }
  });
  document.addEventListener("click", (e) => { const pm = $("premake"); if (premake && pm && !linking && e.target.isConnected && !e.composedPath().includes(pm) && !e.composedPath().includes($("makeBtn"))) { premake = false; paint(); } });
  document.addEventListener("click", (e) => { if (menuOpen && !e.composedPath().includes($("vsw"))) { menuOpen = false; paintSwitch(); } });
  if (inCabinet) {
    c.files.onChange("", load);
    c.jobs.list().then(watchJobs, () => {});
    c.jobs.onChange(watchJobs);
    if (c.connectors) { const take = (list) => { conns = list || []; settle(); paint(); }; c.connectors.list().then(take, () => {}); c.connectors.onChange(take); }
    if (c.store && c.store.onChange) c.store.onChange(() => { const keep = vEdits; readEdits(); if (vSaveTimer) vEdits = keep; paint(); });
  }
  // The store's first values arrive with Cabinet's hello.
  (inCabinet && c.ready ? c.ready : Promise.resolve()).then(load, load);
})();
</script>
</body>
</html>
