<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #faf8f5; --surface: #ffffff; --ink: #1f1b18; --muted: #776d65; --faint: #a79d94;
    --line: #ece6df; --line-strong: #ddd5cc; --wood: #8a5a3b; --wood-ink: #6e4529; --wood-wash: #f3ebe3;
    --ok: #3d7a4c; --need: #b4690e; --need-wash: #fdf3e4; --hover: #f6f2ed;
    --r-s: 8px; --r-m: 12px; --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --shadow: 0 1px 2px rgb(31 27 24 / 0.04), 0 1px 3px rgb(31 27 24 / 0.06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; }
  ::selection { background: #ecdccd; }
  :focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  textarea { font: inherit; color: inherit; caret-color: var(--wood); }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .shell { max-width: 820px; margin: 0 auto; padding: 22px 28px 72px; }

  .bar { display: flex; align-items: center; gap: 12px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; }
  .logo svg.i { width: 17px; height: 17px; }
  .name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .seg { margin-inline-start: auto; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f1ece6; }
  .seg button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 13px; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--need); }

  .head { margin-top: 34px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .meter { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .meter .track { display: flex; gap: 3px; }
  .meter .track i { width: 14px; height: 5px; border-radius: 3px; background: var(--ok); transition: background 300ms var(--ease); }
  .meter .track i.off { background: #e9dfd3; }
  .head .grow { flex: 1; }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 13px; box-shadow: var(--shadow); transition: background 160ms var(--ease), border-color 160ms var(--ease); }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: #3a332e; }
  .btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); }
  .btn.quiet:hover { color: var(--ink); background: var(--hover); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .note { margin-top: 14px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-m); font-size: 13px; background: #f1ece6; }
  .note.warn { background: var(--need-wash); }

  .group { margin-top: 26px; }
  .group h2 { margin: 0 0 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; }
  .item + .item { border-top: 1px solid var(--line); }
  .row { width: 100%; display: grid; grid-template-columns: 30px 120px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px; text-align: start; min-height: 54px; }
  button.row:hover { background: #fcfbf9; }
  .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
  .tile svg.i { width: 15px; height: 15px; }
  .label { font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview.unset { color: var(--faint); }
  .item.open .preview { visibility: hidden; }
  .end { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); }
  .end .chev { transition: transform 200ms var(--ease); }
  .item.open .end .chev { transform: rotate(90deg); }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--need-wash); color: var(--need); font-size: 12px; font-weight: 600; }
  .add .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .saving { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }
  .saving svg.i { width: 13px; height: 13px; }

  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease); }
  .item.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .detail .inner { padding: 0 14px 14px 56px; }
  .full { margin: 0; max-width: 62ch; white-space: pre-line; }
  .meta { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .file { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: #f4f0ea; color: var(--muted); font-size: 12px; }
  .file svg.i { width: 13px; height: 13px; }
  .meta .btn { height: 26px; font-size: 12px; margin-inline-start: auto; }
  .meta .btn svg.i { width: 13px; height: 13px; }
  .editor textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--surface); }
  .editor textarea:focus { outline: 2px solid var(--wood); outline-offset: -1px; }
  .editor .acts { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .editor .acts .sp { flex: 1; }

  .opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .opt { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; transition: border-color 160ms var(--ease), background 160ms var(--ease), color 160ms var(--ease); }
  .opt:hover { border-color: #cbbfb2; }
  .opt[aria-pressed="true"] { background: var(--wood-wash); border-color: var(--wood); color: var(--wood-ink); font-weight: 500; }
  .opt .brand { width: 14px; height: 14px; flex: none; }
  .row.choice { grid-template-columns: 30px 120px minmax(0, 1fr); }
  .switch { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #f1ece6; justify-self: end; }
  .switch button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .switch button svg.i { width: 14px; height: 14px; }
  .switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .hint { grid-column: 3; justify-self: end; font-size: 12px; color: var(--faint); margin-top: -6px; }

  .empty { margin-top: 64px; text-align: center; display: grid; justify-items: center; gap: 10px; }
  .empty .big { width: 48px; height: 48px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--muted); }
  .empty .big svg.i { width: 22px; height: 22px; }
  .empty h3 { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
  .empty p { margin: 0; color: var(--muted); max-width: 40ch; }

  /* ideas */
  .ideas { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 26px 18px; }
  .idea { display: grid; gap: 8px; align-content: start; }
  .phone { position: relative; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; isolation: isolate; container-type: inline-size; box-shadow: 0 1px 2px rgb(31 27 24 / 0.18), 0 14px 28px -16px rgb(31 27 24 / 0.5); transition: transform 220ms var(--ease), box-shadow 220ms var(--ease); }
  .idea:hover .phone { transform: translateY(-2px); }
  .phone .bg { position: absolute; inset: 0; z-index: -1; }
  .cap { position: absolute; left: 9%; right: 9%; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; font: 700 clamp(14px, 10.5cqw, 22px)/1.15 Inter, sans-serif; letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 10px rgb(0 0 0 / 0.3); }
  .cap .w { display: inline-block; padding: 0 0.12em; border-radius: 0.18em; }
  .cap .w.on { background: #e0336f; }
  .marks { position: absolute; left: 9px; bottom: 9px; display: flex; gap: 4px; }
  .marks span { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / 0.16); color: #fff; backdrop-filter: blur(6px); }
  .marks .brand { width: 12px; height: 12px; }
  .picked-badge { position: absolute; top: 9px; right: 9px; height: 22px; padding: 0 8px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .picked-badge svg.i { width: 12px; height: 12px; }
  .idea h3 { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .idea .src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); max-width: 100%; }
  .idea .src span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idea .src svg.i { width: 12px; height: 12px; }
  .idea .btn { justify-self: start; height: 28px; font-size: 12.5px; }
  .idea .btn svg.i { width: 14px; height: 14px; }
  .idea.on .phone { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--wood), 0 14px 28px -16px rgb(31 27 24 / 0.5); }
  .ghost-phone { aspect-ratio: 9 / 16; border-radius: 16px; background: linear-gradient(100deg, #efe9e2 30%, #f7f3ee 50%, #efe9e2 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .ghost-line { height: 10px; border-radius: 5px; background: #efe9e2; }

  /* videos */
  .vwrap { margin-top: 22px; display: grid; grid-template-columns: 200px 270px minmax(0, 1fr); gap: 28px; align-items: start; }
  .vwrap > * { min-width: 0; }
  .vlist { display: grid; gap: 4px; position: sticky; top: 16px; }
  .vitem { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px; border-radius: var(--r-s); text-align: start; }
  .vitem:hover { background: var(--hover); }
  .vitem[aria-current="true"] { background: var(--surface); box-shadow: var(--shadow); }
  .vitem .th { width: 34px; aspect-ratio: 9 / 16; border-radius: 6px; }
  .vitem strong { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .vitem small { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .vitem small.ok { color: var(--ok); }
  .vitem small svg.i { width: 12px; height: 12px; }
  .stage { position: sticky; top: 16px; display: grid; gap: 10px; }
  .stage .phone video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .making { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: #fff; font-weight: 600; font-size: 13px; background: rgb(0 0 0 / 0.35); }
  .making svg.i { width: 22px; height: 22px; }
  .stage .row2 { display: flex; gap: 8px; align-items: center; }
  .stage .row2 .meta2 { font-size: 12px; color: var(--muted); margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  a.btn { text-decoration: none; color: var(--ink); }
  .vhead h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
  .vhead p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .notes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .notes li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; border-radius: var(--r-s); background: var(--need-wash); }
  .notes li svg.i { width: 14px; height: 14px; color: var(--need); margin-top: 2px; }
  .vtabs { margin-top: 16px; }
  .scenes { margin-top: 12px; display: grid; gap: 8px; }
  .sc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px 12px; }
  .sc .n { width: 22px; height: 22px; border-radius: 6px; background: #f4f0ea; color: var(--muted); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .sc .fields { display: grid; gap: 8px; }
  .fl { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }
  .fl svg.i { width: 15px; height: 15px; color: var(--faint); margin-top: 7px; }
  .fl input, .fl textarea { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; margin-inline-start: -8px; background: transparent; resize: none; font: inherit; color: inherit; }
  .fl input { font-weight: 600; }
  .fl input:hover, .fl textarea:hover { background: var(--hover); }
  .fl input:focus, .fl textarea:focus { outline: none; background: var(--surface); border-color: var(--wood); }
  .fl textarea { color: var(--muted); field-sizing: content; min-height: 1lh; }
  .sc .secs { grid-column: 2; font-size: 12px; color: var(--faint); display: flex; gap: 10px; align-items: center; }
  .sc .secs svg.i { width: 13px; height: 13px; }
  .sc.changed { border-color: #e2c49a; }
  .post { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
  .post .fl input, .post .fl textarea { margin-inline-start: -8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12.5px; color: var(--wood-ink); background: var(--wood-wash); padding: 3px 9px; border-radius: 999px; }
  .copy { margin-inline-start: auto; }
  .bar2 { position: sticky; bottom: 16px; margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: var(--r-m); background: var(--ink); color: #fff; box-shadow: 0 12px 30px -14px rgb(31 27 24 / 0.6); }
  .bar2 span { flex: 1; font-size: 13px; }
  .bar2 .btn { background: #fff; color: var(--ink); border-color: #fff; }
  .bar2 .btn.quiet { background: transparent; color: #d9d1c9; border-color: transparent; }

  .sk { height: 54px; border-top: 1px solid var(--line); background: linear-gradient(100deg, #fff 30%, #f7f3ee 50%, #fff 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .sk:first-child { border-top: 0; }
  @keyframes sh { to { background-position: -150% 0; } }

  @media (max-width: 1080px) {
    .vwrap { grid-template-columns: 240px minmax(0, 1fr); gap: 16px 24px; }
    .vlist { grid-column: 1 / -1; position: static; grid-auto-flow: column; grid-auto-columns: 200px; justify-content: start; overflow-x: auto; }
  }
  @media (max-width: 640px) {
    .vwrap { grid-template-columns: minmax(0, 1fr); }
    .stage { position: static; max-width: 280px; }
  }
  @media (max-width: 680px) {
    .shell { padding: 16px 14px 56px; }
    .seg button span { display: none; }
    .row { grid-template-columns: 30px minmax(0, 1fr) auto; }
    .row .preview { grid-column: 2 / 4; grid-row: 2; margin-top: -8px; }
    .row.choice { grid-template-columns: 30px minmax(0, 1fr); }
    .row.choice .opts, .row.choice .switch { grid-column: 1 / -1; justify-content: flex-start; justify-self: start; }
    .hint { grid-column: 1 / -1; justify-self: start; margin-top: 0; }
    .detail .inner { padding-inline-start: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
(function () {
  "use strict";
  var c = window.cabinet;

  var EMPTY = "Not filled yet";

  var BRAND = {
    "TikTok": '<svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 12a4 4 0 1 0 4 4V3c.6 2.6 2.5 4.4 5.5 4.6"/></svg>',
    "Instagram Reels": '<svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
    "YouTube Shorts": '<svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"/></svg>',
    "X": '<svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l16 16M20 4 4 20"/></svg>',
    "Facebook": '<svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h1z"/></svg>',
  };
  var SHORT = { "Instagram Reels": "Reels", "YouTube Shorts": "Shorts" };

  // The parts of profile.md. `group` places the row; `tone` tints its icon.
  var PARTS = [
    { name: "What you offer", label: "Offer", icon: "package", tone: ["#f5ecdf", "#8a5a3b"], group: "biz" },
    { name: "Who it's for", label: "Audience", icon: "users", tone: ["#e7efe6", "#3d6b45"], group: "biz" },
    { name: "Why you", label: "Why you", icon: "award", tone: ["#e6eef6", "#3a6189"], group: "biz" },
    { name: "The goal", label: "Goal", icon: "target", tone: ["#f7e8e8", "#9a4040"], group: "vid", choices: ["More sales", "More leads", "More followers", "More visits"] },
    { name: "How it sounds", label: "Voice", icon: "mic", tone: ["#eee8f5", "#6a4c93"], group: "vid", choices: ["Warm", "Funny", "Expert", "Bold"] },
    { name: "Where it's posted", label: "Platforms", icon: "phone", tone: ["#e5f0f0", "#2f6f6f"], group: "vid", choices: ["TikTok", "Instagram Reels", "YouTube Shorts", "X", "Facebook"], many: true },
    { name: "What never to say", label: "Never say", icon: "ban", tone: ["#fbeedd", "#a05f12"], group: "vid", hint: "For example: no prices, no competitor names", quick: ["No prices", "No competitor names", "No health claims"] },
  ];
  var STYLES = [["Words on screen", "type", "Words"], ["With a voice", "wave", "Voice"], ["Your own clips", "video", "Clips"]];

  var EXAMPLE = "## What you offer\nA neighbourhood bakery in Florentin. Croissants, sourdough and Friday challah, baked every morning.\nSource: about.md\n\n## Who it's for\nPeople who live and work within a short walk. Weekday regulars and Friday families.\nSource: customer-stories.md\n\n## Why you\nA 2:30am start, 36-hour sourdough, and regulars who have come for years.\nSource: about.md\n\n## The goal\nMore sales\n\n## How it sounds\nWarm\nWords to avoid: artisanal, crafted\n\n## Where it's posted\nTikTok, Instagram Reels, YouTube Shorts\n\n## What never to say\nNot filled yet\n\n## Video style\nWords on screen\n";

  // `file` is profile.md as the team wrote it; `edits` are the person's changes, saved in the
  // Studio's store at once and copied into profile.md by the Producer before its next work.
  var file = {}, edits = {}, profile = {}, open = null, editing = null, saving = {}, running = false, loaded = false;
  var canSave = !!(inCabinet && c.store && c.store.set);
  var ideas = null, ideasRunning = false, pickedIdea = null;
  // Videos: each { id, plan, render }; vEdits are the person's changes, saved in the store.
  // videoJobs: whether make-video and update-video are running, once the list has come in.
  var videoJobs = null;
  var videos = [], currentVideo = null, vEdits = {}, makingId = null, updatingId = null, vtab = "script", vSaveTimer = null;
  var SCENES = [["#7a4a2e", "#24150f"], ["#4f6347", "#161d14"], ["#3f5f6b", "#12202a"], ["#6d4a5c", "#22161c"], ["#7b6a3c", "#24200f"], ["#5a5f78", "#1b1d29"]];
  var EXAMPLE_IDEAS = { ideas: [
    { id: "four-hundred", hook: "400 croissants before 6am", angle: "The morning nobody sees", source: "about.md", platforms: ["TikTok", "Instagram Reels"] },
    { id: "slow-bread", hook: "Why our sourdough takes 36 hours", angle: "Slow bread, explained in 20 seconds", source: "menu.md", platforms: ["YouTube Shorts"] },
    { id: "friday", hook: "Gone by noon. Every Friday.", angle: "The challah people line up for", source: "customer-stories.md", platforms: ["TikTok"] },
  ] };

  function icon(name, extra) { return '<svg class="i' + (extra ? " " + extra : "") + '"><use href="#i-' + name + '"/></svg>'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  /* ---------- profile.md ---------- */
  function parse(text) {
    var out = {}, cur = null;
    text.split(/\r?\n/).forEach(function (line) {
      var h = /^##\s+(.+?)\s*$/.exec(line);
      if (h) { cur = { lines: [], source: "" }; out[h[1]] = cur; return; }
      if (!cur) return;
      var s = /^Source:\s*(\S+)/i.exec(line);
      if (s) { cur.source = s[1].replace(/^(\.\.\/)+/, "").replace(/[,;.)]+$/, ""); return; }
      cur.lines.push(line);
    });
    Object.keys(out).forEach(function (k) {
      var body = out[k].lines.join("\n").trim();
      out[k] = { value: body, source: out[k].source, missing: !body || body === EMPTY };
    });
    return out;
  }
  function merge() {
    profile = {};
    Object.keys(file).forEach(function (k) { profile[k] = file[k]; });
    Object.keys(edits).forEach(function (k) {
      var v = String(edits[k] || "").trim();
      profile[k] = { value: v, source: "", missing: !v || v === EMPTY };
    });
  }
  function part(name) { return profile[name] || { value: "", source: "", missing: true }; }
  function firstLine(name) { return (part(name).value.split("\n")[0] || "").trim(); }
  function restLines(name) { return part(name).missing ? "" : part(name).value.split("\n").slice(1).join("\n").trim(); }
  function picked(p) { var f = firstLine(p.name); return p.many ? f.split(",").map(function (s) { return s.trim(); }) : [f]; }

  /* ---------- saving: straight to the Studio's store, no chat ---------- */
  function tell(name, value) {
    if (!canSave) { if (!inCabinet) { edits[name] = value; merge(); paint(); } return; }
    var next = {};
    Object.keys(edits).forEach(function (k) { next[k] = edits[k]; });
    next[name] = value;
    edits = next; merge(); saving[name] = true; paint();
    c.store.set("profile", next).then(function () { saving[name] = false; paint(); }, function (e) {
      saving[name] = false;
      say(e && e.message ? e.message : "That change was not saved. Try again.");
      readEdits(); paint();
    });
  }
  function readEdits() {
    var v = canSave && c.store.get ? c.store.get("profile") : null;
    edits = v && typeof v === "object" ? v : {};
    var ve = canSave && c.store.get ? c.store.get("videos") : null;
    vEdits = ve && typeof ve === "object" ? ve : {};
    var p = canSave && c.store.get ? c.store.get("picked") : null;
    pickedIdea = typeof p === "string" ? p : null;
    merge();
  }
  function loadIdeas() {
    if (!inCabinet) { ideas = EXAMPLE_IDEAS; return Promise.resolve(); }
    return c.files.read("studio/data/ideas.json").then(function (t) {
      try { ideas = JSON.parse(t); } catch (e) { ideas = null; }
    }, function () { ideas = null; });
  }
  function say(text) { $("status").textContent = text || ""; $("status").hidden = !text; }
  function spinner() { return '<span class="saving">' + icon("loader", "spin") + "Saving</span>"; }

  /* ---------- rows ---------- */
  function tile(p) { return '<span class="tile" style="background:' + p.tone[0] + ";color:" + p.tone[1] + '">' + icon(p.icon) + "</span>"; }
  function textRow(p, i) {
    var cur = part(p.name), isOpen = open === p.name, isEdit = editing === p.name || (isOpen && cur.missing);
    var end = saving[p.name] ? spinner() : cur.missing ? '<span class="add"><i class="dot"></i>Add</span>' : icon("chev", "chev");
    var inner;
    if (isEdit) {
      inner = '<div class="editor"><textarea id="ta' + i + '" aria-label="' + esc(p.name) + '" placeholder="' + esc(p.hint || "In your own words") + '">' + esc(cur.missing ? "" : cur.value) + "</textarea>" +
        '<div class="acts">' + (p.quick || []).map(function (q) { return '<button class="opt" type="button" data-quick="' + i + '">' + esc(q) + "</button>"; }).join("") +
        '<span class="sp"></span><button class="btn quiet" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save="' + i + '">Save</button></div></div>';
    } else {
      inner = '<p class="full">' + esc(cur.value) + '</p><div class="meta">' +
        (cur.source ? '<span class="file">' + icon("file") + esc(cur.source) + "</span>" : '<span class="file">' + icon("pencil") + "Written by you</span>") +
        '<button class="btn" type="button" data-edit="' + i + '">' + icon("pencil") + "Edit</button></div>";
    }
    return '<div class="item' + (isOpen ? " open" : "") + '">' +
      '<button class="row" type="button" data-toggle="' + i + '" aria-expanded="' + isOpen + '">' + tile(p) +
        '<span class="label">' + esc(p.label) + "</span>" +
        '<span class="preview' + (cur.missing ? " unset" : "") + '">' + (cur.missing ? "Not set" : esc(firstLine(p.name))) + "</span>" +
        '<span class="end">' + end + "</span></button>" +
      '<div class="detail"><div><div class="inner">' + inner + "</div></div></div></div>";
  }
  function choiceRow(p, i) {
    var cur = part(p.name), on = cur.missing ? [] : picked(p);
    var opts = p.choices.map(function (ch) {
      var label = p.many ? (BRAND[ch] || "") + esc(SHORT[ch] || ch) : esc(ch.replace(/^More (\w)/, function (_, a) { return a.toUpperCase(); }));
      return '<button class="opt" type="button" data-part="' + i + '" data-choice="' + esc(ch) + '" aria-pressed="' + (on.indexOf(ch) >= 0) + '" title="' + esc(ch) + '">' + label + "</button>";
    }).join("");
    var extra = restLines(p.name);
    var flag = saving[p.name] ? spinner() : cur.missing ? '<span class="add"><i class="dot"></i>Pick</span>' : "";
    return '<div class="item"><div class="row choice">' + tile(p) +
      '<span class="label">' + esc(p.label) + flag + "</span>" +
      '<div class="opts" role="group" aria-label="' + esc(p.name) + '">' + opts + "</div>" +
      (extra ? '<span class="hint">' + esc(extra) + "</span>" : "") + "</div></div>";
  }
  function styleRow() {
    var cur = firstLine("Video style") || "Words on screen";
    return '<div class="item"><div class="row choice">' +
      '<span class="tile" style="background:#eceae6;color:#4a443f">' + icon("layers") + '</span><span class="label">Style' + (saving["Video style"] ? spinner() : "") + "</span>" +
      '<div class="switch" role="group" aria-label="Video style">' + STYLES.map(function (s) {
        return '<button type="button" data-style="' + esc(s[0]) + '" aria-pressed="' + (cur === s[0]) + '" title="' + esc(s[0]) + '">' + icon(s[1]) + esc(s[2]) + "</button>";
      }).join("") + "</div></div></div>";
  }

  function paint() {
    if (!loaded) return;
    var ready = PARTS.filter(function (p) { return !part(p.name).missing; }).length, all = ready === PARTS.length;
    var rows = function (g) { return PARTS.map(function (p, i) { return p.group === g ? (p.choices ? choiceRow(p, i) : textRow(p, i)) : ""; }).join(""); };
    $("biz").innerHTML = rows("biz");
    $("vid").innerHTML = rows("vid") + styleRow();
    $("track").innerHTML = PARTS.map(function (p) { return '<i class="' + (part(p.name).missing ? "off" : "") + '"></i>'; }).join("");
    $("count").textContent = all ? "Ready" : ready + " of " + PARTS.length;
    $("pip").hidden = all;

    var fill = $("fill");
    fill.disabled = running || !inCabinet;
    fill.className = "btn" + (ready === 0 && !running ? " primary" : "");
    $("fillText").textContent = running ? "Reading" : ready === 0 ? "Fill from my pages" : "Read my pages";
    $("fillIcon").innerHTML = '<use href="#i-' + (running ? "loader" : "search") + '"/>';
    $("fillIcon").setAttribute("class", "i" + (running ? " spin" : ""));
    fill.hidden = all && !running;

    if (!all) $("ideasEmpty").innerHTML = '<div class="big">' + icon("bulb") + "</div><h3>Finish your profile first</h3><p>" + (PARTS.length - ready) + " left. Ideas only use what is true.</p><button class=\"btn primary\" type=\"button\" data-go=\"profile\">Go to profile</button>";
    paintIdeas(all);
    // A background repaint (a file changed) leaves the field someone is typing in alone.
    var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.closest("#vpanel");
    if (!typing) paintVideos();

  }

  function keyWord(hook) {
    var words = hook.split(" ");
    var n = words.findIndex(function (w) { return /\d/.test(w); });
    if (n >= 0) return n;
    var best = 0;
    words.forEach(function (w, i) { if (w.replace(/\W/g, "").length > words[best].replace(/\W/g, "").length) best = i; });
    return best;
  }
  function phoneHTML(idea, i) {
    var on = keyWord(idea.hook), bg = SCENES[i % SCENES.length];
    var cap = idea.hook.split(" ").map(function (w, j) { return '<span class="w' + (j === on ? " on" : "") + '">' + esc(w) + "</span>"; }).join(" ");
    var marks = (idea.platforms || []).filter(function (pf) { return BRAND[pf]; }).map(function (pf) { return '<span title="' + esc(pf) + '">' + BRAND[pf] + "</span>"; }).join("");
    return '<div class="phone"><div class="bg" style="background:radial-gradient(120% 70% at 30% 18%,' + bg[0] + "," + bg[1] + ')"></div>' +
      (pickedIdea === idea.id ? '<span class="picked-badge">' + icon("check") + "Picked</span>" : "") +
      '<div class="cap">' + cap + '</div><div class="marks">' + marks + "</div></div>";
  }
  function paintIdeas(all) {
    var list = ideas && Array.isArray(ideas.ideas) ? ideas.ideas : [];
    var blocked = !all || (ideas && Array.isArray(ideas.blocked) && ideas.blocked.length && !list.length);
    $("ideasHead").hidden = blocked;
    $("ideaGrid").hidden = blocked;
    var gi = $("getIdeas");
    gi.disabled = ideasRunning || !inCabinet;
    $("ideasText").textContent = ideasRunning ? "Writing ideas" : list.length ? "New ideas" : "Get ideas";
    $("ideasIcon").innerHTML = '<use href="#i-' + (ideasRunning ? "loader" : "bulb") + '"/>';
    $("ideasIcon").setAttribute("class", "i" + (ideasRunning ? " spin" : ""));

      $("ideaGrid").innerHTML = [0, 1, 2, 3, 4, 5].map(function () { return '<div class="idea" aria-hidden="true"><div class="ghost-phone"></div><div class="ghost-line"></div><div class="ghost-line" style="width:60%"></div></div>'; }).join("");

    }

    if (!list.length) {
      $("ideasEmpty").innerHTML = '<div class="big">' + icon("bulb") + "</div><h3>Ready for ideas</h3><p>Six short videos, each from something true about your business.</p>";
    }
    $("ideaGrid").innerHTML = list.map(function (idea, i) {
      var on = pickedIdea === idea.id;
      return '<article class="idea' + (on ? " on" : "") + '">' + phoneHTML(idea, i) +
        "<h3>" + esc(idea.angle || "") + "</h3>" +
        (idea.source ? '<span class="src">' + icon("file") + "<span>" + esc(String(idea.source).replace(/^(\.\.\/)+/, "")) + "</span></span>" : "") +
        (hasVideo(idea.id)
          ? '<button class="btn" type="button" data-open="' + esc(idea.id) + '">' + icon("play") + "Open video</button>"
          : '<button class="btn primary" type="button" data-make="' + esc(idea.id) + '"' + (makingId ? " disabled" : "") + ">" + (makingId === idea.id ? icon("loader", "spin") + "Making" : icon("film") + "Make video") + "</button>") + "</article>";
    }).join("");
  }

  /* ---------- videos ---------- */
  function hasVideo(id) { return videos.some(function (v) { return v.id === id; }); }
  function videoById(id) { return videos.filter(function (v) { return v.id === id; })[0] || null; }
  function sceneOf(v, i) {
    var base = v.plan.scenes[i] || {}, e = ((vEdits[v.id] || {}).scenes || [])[i] || {};
    return { onScreen: e.onScreen != null ? e.onScreen : base.onScreen || "", said: e.said != null ? e.said : base.said || "", picture: e.picture != null ? e.picture : base.picture || "", base: base };
  }
  function changedScenes(v) {
    var n = 0;
    (v.plan.scenes || []).forEach(function (base, i) {
      var cur = sceneOf(v, i);
      if (cur.onScreen !== (base.onScreen || "") || cur.said !== (base.said || "") || cur.picture !== (base.picture || "")) n++;
    });
    return n;
  }
  function postOf(v, platform) {
    var base = (v.plan.post || {})[platform] || {}, e = (((vEdits[v.id] || {}).post || {})[platform]) || {};
    return { title: e.title != null ? e.title : base.title || "", caption: e.caption != null ? e.caption : base.caption || "", hashtags: base.hashtags || [] };

    return Math.round(t);
  }
  function videoJobRunning() { return !!(videoJobs && (videoJobs["make-video"] || videoJobs["update-video"])); }
  function stateOf(v) {
    if (makingId === v.id || updatingId === v.id) return "making";
    // A render with no routine behind it was cut off (the app closed): say so, do not spin.
    if (v.render && v.render.state === "rendering") return videoJobs && !videoJobRunning() ? "stopped" : "making";
    if (v.render && v.render.state === "ready") return "ready";
    if (v.render && v.render.state === "failed") return "failed";
    return "draft";
  }
  function bgFor(id) {
    var list = ideas && ideas.ideas ? ideas.ideas : [];
    var i = Math.max(0, list.findIndex(function (x) { return x.id === id; }));
    var v = videoById(id), pal = v && Array.isArray(v.plan.palette) ? v.plan.palette : SCENES[i % SCENES.length];
    return "radial-gradient(120% 70% at 30% 18%," + pal[0] + "," + pal[1] + ")";
  }
  function paintVideos() {
    var list = videos.slice();
    if (makingId && !hasVideo(makingId)) {
      var idea = (ideas && ideas.ideas || []).filter(function (x) { return x.id === makingId; })[0];
      list.unshift({ id: makingId, plan: { title: idea ? idea.hook : "New video", scenes: [] }, render: null, pending: true });
    }
    $("vcount").textContent = list.length ? list.length + (list.length === 1 ? " video" : " videos") : "";
    $("vwrap").hidden = !list.length;
    $("vempty").hidden = !!list.length;
    if (!list.length) return;
    if (!currentVideo || !list.some(function (v) { return v.id === currentVideo; })) currentVideo = list[0].id;
    var v = list.filter(function (x) { return x.id === currentVideo; })[0];
    $("vlist").innerHTML = list.map(function (x) {
      var st = x.pending ? "making" : stateOf(x);
      var label = st === "making" ? icon("loader", "spin") + "Making" : st === "ready" ? length(x) + " sec" : st === "failed" || st === "stopped" ? "Not made" : "Draft";
      return '<button class="vitem" type="button" data-video="' + esc(x.id) + '" aria-current="' + (x.id === currentVideo) + '"><span class="th" style="background:' + bgFor(x.id) + '"></span><span><strong>' + esc(x.plan.title || x.id) + '</strong><small class="' + (st === "ready" ? "ok" : "") + '">' + label + "</small></span></button>";
    }).join("");

    var st = v.pending ? "making" : stateOf(v);
    var src = st === "ready" ? "data/videos/" + encodeURIComponent(v.id) + "/video.mp4?v=" + encodeURIComponent(v.render.at || "") : "";
    var first = v.plan.scenes && v.plan.scenes[0] ? sceneOf(v, 0).onScreen : v.plan.title || "";
    var preview = '<div class="bg" style="background:' + bgFor(v.id) + '"></div><div class="cap">' + esc(first) + "</div>";
    var canPlay = inCabinet && c.here && (!c.canWrite || c.canWrite());
    $("stage").innerHTML = '<div class="phone">' +
      (src && canPlay ? '<video src="' + src + '#t=0.6" controls playsinline preload="metadata"></video>' : preview) +
      (st === "making" ? '<div class="making">' + icon("loader", "spin") + "<span>Making your video</span></div>" : "") + "</div>" +
      (st === "ready" ? '<div class="row2"><a class="btn primary" href="' + src + '" download="' + esc(v.id) + '.mp4">' + icon("download") + 'Download</a><span class="meta2">' + length(v) + " sec, " + Math.max(1, Math.round((v.render.bytes || 0) / 1048576)) + " MB</span></div>" : "") +
      (st === "failed" || st === "stopped" ? '<div class="note warn">' + icon("alert") + "<span>" + esc(st === "stopped" ? "This video stopped before it was done." : v.render.why || "The video could not be made.") + "</span></div>" +
        '<div class="row2"><button class="btn" type="button" data-update="' + esc(v.id) + '">' + icon("film") + "Make it again</button></div>" : "");

    if (v.pending) { $("vpanel").innerHTML = '<div class="vhead"><h2>' + esc(v.plan.title) + "</h2><p>Writing the script, the voice and the captions. About two minutes.</p></div>"; return; }
    var platforms = Object.keys(v.plan.post || {});
    var notes = (v.plan.notes || []).map(function (n) { return "<li>" + icon("alert") + "<span>" + esc(n) + "</span></li>"; }).join("");
    var scenesHtml = (v.plan.scenes || []).map(function (base, i) {
      var cur = sceneOf(v, i);
      var changed = cur.onScreen !== (base.onScreen || "") || cur.said !== (base.said || "") || cur.picture !== (base.picture || "");
      var secs = base.audioSeconds ? Math.round((base.audioSeconds + 0.35) * 10) / 10 : Number(base.seconds) || 3.5;
      return '<div class="sc' + (changed ? " changed" : "") + '"><span class="n">' + (i + 1) + '</span><div class="fields">' +
        '<label class="fl" title="On screen">' + icon("type") + '<input data-scene="' + i + '" data-field="onScreen" value="' + esc(cur.onScreen) + '" aria-label="Scene ' + (i + 1) + ' on screen" /></label>' +
        '<label class="fl" title="Said">' + icon("wave") + '<textarea data-scene="' + i + '" data-field="said" rows="1" aria-label="Scene ' + (i + 1) + ' said">' + esc(cur.said) + "</textarea></label>" +
        '<label class="fl" title="Picture">' + icon("image") + '<textarea data-scene="' + i + '" data-field="picture" rows="1" aria-label="Scene ' + (i + 1) + ' picture">' + esc(cur.picture) + "</textarea></label>" +
        '</div><div class="secs">' + icon("clock") + secs + " sec" + (base.audio ? " " + icon("wave") + "Voice" : "") + (base.image ? " " + icon("image") + "Picture" : "") + "</div></div>";
    }).join("");
    var pf = platforms.indexOf(vtab) >= 0 ? vtab : platforms[0];
    var post = pf ? postOf(v, pf) : null;
    var postHtml = post ? '<div class="post"><div class="opts" style="justify-content:flex-start">' + platforms.map(function (x) { return '<button class="opt" type="button" data-platform="' + esc(x) + '" aria-pressed="' + (x === pf) + '">' + (BRAND[x] || "") + esc(SHORT[x] || x) + "</button>"; }).join("") + "</div>" +
      '<label class="fl" title="Title">' + icon("type") + '<input data-post="' + esc(pf) + '" data-field="title" value="' + esc(post.title) + '" aria-label="Title" /></label>' +
      '<label class="fl" title="Caption">' + icon("file") + '<textarea data-post="' + esc(pf) + '" data-field="caption" rows="2" aria-label="Caption">' + esc(post.caption) + "</textarea></label>" +
      '<div class="tags">' + post.hashtags.map(function (h) { return "<span>" + esc(h) + "</span>"; }).join("") + "</div>" +
      '<div><button class="btn copy" type="button" data-copy="' + esc(pf) + '">' + icon("copy") + "Copy caption and hashtags</button></div></div>" : "";
    var n = changedScenes(v);
    $("vpanel").innerHTML = '<div class="vhead"><h2>' + esc(v.plan.title || v.id) + "</h2><p>" + (v.plan.scenes || []).length + " scenes, " + length(v) + " seconds" + (platforms.length ? ", for " + platforms.map(function (x) { return SHORT[x] || x; }).join(", ") : "") + "</p></div>" +
      (notes ? '<ul class="notes">' + notes + "</ul>" : "") +
      '<div class="vtabs"><nav class="seg" style="margin:0;display:inline-flex" role="tablist"><button role="tab" data-vtab="script" aria-selected="' + (vtab === "script") + '">' + icon("film") + '<span>Script</span></button><button role="tab" data-vtab="post" aria-selected="' + (vtab !== "script") + '">' + icon("phone") + "<span>Post</span></button></nav></div>" +
      (vtab === "script" ? '<div class="scenes">' + scenesHtml + "</div>" : postHtml) +
      (st !== "making" ? '<div class="bar2" id="vbar"' + (n ? "" : " hidden") + '><span>' + changesLabel(n) + '</span><button class="btn quiet" type="button" data-undo="' + esc(v.id) + '">Undo</button><button class="btn" type="button" data-update="' + esc(v.id) + '">' + icon("film") + "Update video</button></div>" : "");
  }
  function changesLabel(n) { return n + (n === 1 ? " scene changed" : " scenes changed"); }
  /** While typing: mark changed scenes and show the update bar, without repainting the fields. */
  function refreshChanges() {
    var v = videoById(currentVideo), bar = $("vbar");
    if (!v) return;
    var n = changedScenes(v);
    document.querySelectorAll("#vpanel .sc").forEach(function (el, i) {
      var base = v.plan.scenes[i] || {}, cur = sceneOf(v, i);
      el.classList.toggle("changed", cur.onScreen !== (base.onScreen || "") || cur.said !== (base.said || "") || cur.picture !== (base.picture || ""));
    });
    if (bar) { bar.hidden = !n; bar.querySelector("span").textContent = changesLabel(n); }
  }
  /** A person's click: leave any field, then repaint everything. */
  function repaint() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); paint(); }
  function saveVideoEdits() {
    if (!canSave) return;
    clearTimeout(vSaveTimer);
    vSaveTimer = setTimeout(function () {
      c.store.set("videos", vEdits).catch(function (e) { $("vstatus").textContent = e && e.message ? e.message : "Your change was not saved."; $("vstatus").hidden = false; });
    }, 350);
  }
  function editVideo(id, kind, key, field, value) {
    var next = JSON.parse(JSON.stringify(vEdits || {}));
    next[id] = next[id] || {};
    if (kind === "scene") {
      next[id].scenes = next[id].scenes || [];
      next[id].scenes[key] = next[id].scenes[key] || {};
      next[id].scenes[key][field] = value;
    } else {
      next[id].post = next[id].post || {};
      next[id].post[key] = next[id].post[key] || {};
      next[id].post[key][field] = value;
    }
    vEdits = next;
    saveVideoEdits();
  }
  function startJob(job, onFail) {
    return c.jobs.run(job).catch(function (e) { onFail(); $("vstatus").textContent = e && e.message ? e.message : "That could not start. Try again."; $("vstatus").hidden = false; paint(); });
  }
  function loadVideos() {
    if (!inCabinet || !c.files.list) return Promise.resolve();
    return c.files.list("studio/data/videos").then(function (entries) {
      var dirs = (entries || []).filter(function (e) { return e.isDir; });
      return Promise.all(dirs.map(function (d) {
        var base = "studio/data/videos/" + d.name + "/";
        return Promise.all([
          c.files.read(base + "video.json").then(JSON.parse, function () { return null; }),
          c.files.read(base + "render.json").then(JSON.parse, function () { return null; }),
        ]).then(function (r) { return r[0] && Array.isArray(r[0].scenes) ? { id: d.name, plan: r[0], render: r[1] } : null; });
      }));
    }, function () { return []; }).then(function (list) {
      videos = (list || []).filter(Boolean).sort(function (a, b) { return String(b.plan.createdAt || "").localeCompare(String(a.plan.createdAt || "")); });
    });
  }

  function wire() {
    if (inCabinet && c.canWrite && !c.canWrite()) {
      document.querySelectorAll("[data-choice],[data-style],[data-edit],[data-save]").forEach(function (b) { b.disabled = true; });
    }
    document.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.onclick = function () {
        var name = PARTS[+b.dataset.toggle].name;
        open = open === name ? null : name; editing = null; paint();
        var ta = $("ta" + b.dataset.toggle); if (ta) ta.focus();
      };
    });
    document.querySelectorAll("[data-edit]").forEach(function (b) {
      b.onclick = function () { editing = PARTS[+b.dataset.edit].name; paint(); var ta = $("ta" + b.dataset.edit); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } };
    });
    document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { editing = null; open = null; paint(); }; });
    document.querySelectorAll("[data-save]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.save, ta = $("ta" + i), v = ta.value.trim();
        if (!v) { ta.focus(); return; }
        editing = null; open = null; tell(PARTS[i].name, v);
      };
    });
    document.querySelectorAll("[data-quick]").forEach(function (b) {
      b.onclick = function () { var ta = $("ta" + b.dataset.quick); ta.value = ta.value.trim() ? ta.value.trim().replace(/\.?$/, ". ") + b.textContent + "." : b.textContent + "."; ta.focus(); };
    });
    document.querySelectorAll("[data-choice]").forEach(function (b) {
      b.onclick = function () {
        var p = PARTS[+b.dataset.part], v = b.dataset.choice;
        if (p.many) {
          var on = part(p.name).missing ? [] : picked(p).filter(Boolean);
          on = on.indexOf(v) >= 0 ? on.filter(function (x) { return x !== v; }) : on.concat(v);
          if (!on.length) return;
          v = p.choices.filter(function (x) { return on.indexOf(x) >= 0; }).join(", ");
        } else if (b.getAttribute("aria-pressed") === "true") return;
        var rest = restLines(p.name);
        tell(p.name, rest ? v + "\n" + rest : v);
      };
    });
    document.querySelectorAll("[data-style]").forEach(function (b) {
      b.onclick = function () { if (b.getAttribute("aria-pressed") !== "true") tell("Video style", b.dataset.style); };
    });
    document.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { show(b.dataset.go); }; });
    document.querySelectorAll("[data-make]").forEach(function (b) {
      b.onclick = function () {
        if (!inCabinet) return;
        var id = b.dataset.make;
        pickedIdea = id; makingId = id; currentVideo = id;
        c.store.set("picked", id).then(function () { return startJob("make-video", function () { makingId = null; }); });
        show("videos"); paint();
      };
    });
    document.querySelectorAll("[data-open]").forEach(function (b) { b.onclick = function () { currentVideo = b.dataset.open; show("videos"); paint(); }; });
    document.querySelectorAll("[data-video]").forEach(function (b) { b.onclick = function () { currentVideo = b.dataset.video; repaint(); }; });
    document.querySelectorAll("[data-vtab]").forEach(function (b) { b.onclick = function () { vtab = b.dataset.vtab; repaint(); }; });
    document.querySelectorAll("[data-platform]").forEach(function (b) { b.onclick = function () { vtab = b.dataset.platform; repaint(); }; });
    document.querySelectorAll("[data-scene]").forEach(function (f) {
      f.oninput = function () { editVideo(currentVideo, "scene", +f.dataset.scene, f.dataset.field, f.value); refreshChanges(); };
    });
    document.querySelectorAll("[data-post]").forEach(function (f) {
      f.oninput = function () { editVideo(currentVideo, "post", f.dataset.post, f.dataset.field, f.value); };
    });
    document.querySelectorAll("[data-copy]").forEach(function (b) {
      b.onclick = function () {
        var v = videoById(currentVideo); if (!v) return;
        var post = postOf(v, b.dataset.copy);
        var text = post.caption + "\n\n" + post.hashtags.join(" ");
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.innerHTML = icon("check") + "Copied"; }, function () { b.innerHTML = icon("alert") + "Select and copy it instead"; });
      };
    });
    document.querySelectorAll("[data-undo]").forEach(function (b) {
      b.onclick = function () { var next = JSON.parse(JSON.stringify(vEdits || {})); delete next[b.dataset.undo]; vEdits = next; saveVideoEdits(); repaint(); };
    });
    document.querySelectorAll("[data-update]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.update; updatingId = id; repaint();
        clearTimeout(vSaveTimer);
        c.store.set("videos", vEdits).then(function () { return c.store.set("render", id); }).then(function () { return startJob("update-video", function () { updatingId = null; }); });
      };
    });
    document.querySelectorAll("[data-pick]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.pick;
        pickedIdea = pickedIdea === id ? null : id;
        paint();
        if (canSave) c.store.set("picked", pickedIdea).catch(function (e) { $("ideasStatus").textContent = e && e.message ? e.message : "Your pick was not saved. Try again."; $("ideasStatus").hidden = false; });
      };
    });
  }

  function show(view) {
    document.querySelectorAll(".seg button").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.view === view)); });
    ["profile", "ideas", "videos"].forEach(function (v) { $("view-" + v).hidden = v !== view; });
  }
  document.querySelectorAll(".seg button").forEach(function (t) { t.onclick = function () { show(t.dataset.view); }; });

  $("fill").onclick = function () {
    if (!inCabinet) return;
    running = true; say(""); paint();
    c.jobs.run("fill-profile").catch(function (e) { running = false; say(e && e.message ? e.message : "Reading your pages could not start. Try again."); paint(); });
  };
  $("getIdeas").onclick = function () {
    if (!inCabinet) return;
    ideasRunning = true; $("ideasStatus").hidden = true; paint();
    c.jobs.run("make-ideas").catch(function (e) { ideasRunning = false; $("ideasStatus").textContent = e && e.message ? e.message : "Ideas could not start. Try again."; $("ideasStatus").hidden = false; paint(); });
  };
  function watchJobs(list) {
    videoJobs = videoJobs || {};
    (list || []).forEach(function (job) {
      if (job.id === "fill-profile") {
        var was = running; running = !!job.running;
        if (was && !running && job.lastRun && job.lastRun.ok === false) say("Reading your pages stopped early. Try again, or add the parts yourself.");
      }
      if (job.id === "make-video" || job.id === "update-video") {
        // Only a run seen going and then stopping ends "Making", so a click that has not
        // reached the routine yet is not undone by the last run's old result.
        var wasV = videoJobs[job.id]; videoJobs[job.id] = !!job.running;
        if (wasV && !job.running) {
          if (job.lastRun && job.lastRun.ok === false) { $("vstatus").textContent = "The video stopped before it was done. Try again."; $("vstatus").hidden = false; }
          if (job.id === "make-video") makingId = null; else updatingId = null;
          loadVideos().then(paint);
        }
        if (job.running && job.id === "make-video" && !makingId && pickedIdea) makingId = pickedIdea;
      }
      if (job.id === "make-ideas") {
        var wasI = ideasRunning; ideasRunning = !!job.running;
        if (wasI && !ideasRunning && job.lastRun && job.lastRun.ok === false) { $("ideasStatus").textContent = "Writing ideas stopped early. Try again."; $("ideasStatus").hidden = false; }
      }
    });
    paint();
  }

  function load() {
    if (!inCabinet) { file = parse(EXAMPLE); merge(); loadIdeas(); loaded = true; $("example").hidden = false; paint(); return; }
    Promise.all([
      c.files.read("profile.md").then(function (t) { file = parse(t); }, function () { file = {}; say("profile.md is missing. Fill from my pages makes a new one."); }),
      loadIdeas(),
      loadVideos(),
    ]).then(function () { readEdits(); loaded = true; paint(); });
  }
  if (inCabinet) {
    c.files.onChange("", load);
    c.jobs.list().then(watchJobs, function () {});
    c.jobs.onChange(watchJobs);
    if (c.store && c.store.onChange) c.store.onChange(function () { readEdits(); paint(); });
  }
  // The store's first values arrive with Cabinet's hello.
  (inCabinet && c.ready ? c.ready : Promise.resolve()).then(load, load);
})();
</script>
</body>
</html>
