<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=TikTok+Sans:wght@800&family=Montserrat:wght@900&family=Luckiest+Guy&family=Playfair+Display:wght@800&family=Space+Grotesk:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<script src="compose.js"></script>
<style>
  :root, :root[data-theme="coral"] {
    /* Coral: a clean warm-white page, deep ink, and a coral pick that reads as social and lively. */
    --canvas: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
    --line: #e8e8ed; --line-strong: #d2d2d7; --hover: #ececf0; --well: #e8e8ed;
    --pick: #ff5a5f; --on-pick: #ffffff; --pick-soft: #ffeceb; --pick-ink: #a3242a;
    --on-ink: #ffffff; --ink-hover: #3a3a3c; --row-hover: #fafafc; --ghost-a: #ebebf0; --ghost-b: #f5f5f7;
    --switch-off: #d2d2d7; --live-wash: #ffe5ea; --live-ink: #c4113f;
    --tally: #ff2e63; --ok: #12a37a; --ok-wash: #e2f5ee; --need: #b45f00; --need-wash: #fff1db;
    --hook: #ff5a5f; --point: #f5a524; --proof: #12a37a; --cta: #3b82f6;
    --r-s: 10px; --r-m: 14px; --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --lift: none;
  }
  :root[data-theme="ocean"] {
    /* Ocean: cool and fresh, a teal pick, like a clear morning feed. */
    --canvas: #f3f7f8; --surface: #ffffff; --ink: #10222b; --muted: #5d6f77; --faint: #97a7ae;
    --line: #e2eaed; --line-strong: #d0dce0; --hover: #e9f1f3; --well: #e6eef1;
    --pick: #0fa3a0; --on-pick: #ffffff; --pick-soft: #ddf4f2; --pick-ink: #075c5a;
    --on-ink: #ffffff; --ink-hover: #263a44; --row-hover: #f8fbfb; --ghost-a: #e4ecee; --ghost-b: #f2f6f7;
    --switch-off: #cad6db; --live-wash: #ffe5ea; --live-ink: #c4113f;
    --hook: #f2557a; --point: #f2a93b; --proof: #0fa3a0; --cta: #3d7be6;
    --lift: none;
  }
  :root[data-theme="midnight"] {
    /* Midnight: a dark room for watching video, with a hot pink pick, like the apps it posts to. */
    --canvas: #0f0f12; --surface: #19191e; --ink: #f2f1f4; --muted: #a09ca8; --faint: #6d6a74;
    --line: #27262d; --line-strong: #35343c; --hover: #212027; --well: #1d1c22;
    --pick: #ff3d71; --on-pick: #ffffff; --pick-soft: #3a1724; --pick-ink: #ff9cb6;
    --on-ink: #0f0f12; --ink-hover: #d9d7de; --row-hover: #1e1d23; --ghost-a: #1f1e24; --ghost-b: #2a2930;
    --switch-off: #3a3940; --live-wash: #3a1724; --live-ink: #ff8aa8;
    --ok: #2fd39a; --ok-wash: #11372b; --need: #ffb347; --need-wash: #3a2a12;
    --hook: #ff3d71; --point: #ffb020; --proof: #2fd39a; --cta: #5b9dff;
    --lift: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 14px 30px -18px rgb(0 0 0 / 0.8), 0 0 0 1px var(--line);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Inter, sans-serif; letter-spacing: -0.006em; }
  ::selection { background: var(--pick); color: var(--on-pick); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; caret-color: var(--tally); }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .shell { max-width: 1080px; margin: 0 auto; padding: 20px 28px 40px; }

  /* top: the name, and the film strip that shows where you are */
  .top { display: flex; align-items: center; gap: 14px; }
  .tiktok { color: #000; } .instagram { color: #ff0069; } .youtube { color: #ff0000; } .x { color: #000; } .facebook { color: #0866ff; }
  :root[data-theme="midnight"] .tiktok, :root[data-theme="midnight"] .x { color: #fff; }
  .am { display: inline-grid; place-items: center; flex: none; }
  .am svg.brand { width: 14px; height: 14px; }
  .app { display: inline-flex; align-items: center; gap: 10px; flex: none; }
  .appicon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--pick); }
  .appicon svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .appname { font-weight: 650; font-size: 15px; letter-spacing: -0.02em; }
  .vsw { margin-inline-start: auto; position: relative; }
  .vsw > button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 10px; border-radius: var(--r-s); font-weight: 500; font-size: 14px; letter-spacing: -0.01em; color: var(--muted); max-width: 380px; }
  .vsw > button svg.i { color: var(--faint); }
  .vsw > button:hover { background: var(--hover); color: var(--ink); }
  .vsw > button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu { position: absolute; inset-inline-start: 0; top: 36px; z-index: 20; width: 290px; padding: 6px; border-radius: var(--r-m); background: var(--surface); box-shadow: 0 18px 40px -14px rgb(50 30 10 / 0.4), 0 0 0 1px var(--line); animation: pop 160ms var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
  .menu .mi { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-s); text-align: start; }
  .menu .mi:hover { background: var(--hover); }
  .menu .mi[aria-current="true"] { background: var(--well); }
  .menu .mi strong { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .mi small { color: var(--muted); font-size: 12px; }
  .menu .th { width: 26px; aspect-ratio: 9 / 16; border-radius: 5px; }
  .menu .mnew { width: 26px; height: 26px; border-radius: 7px; background: var(--well); display: grid; place-items: center; color: var(--muted); }

  .reel { margin-top: 16px; padding: 3px; border-radius: 12px; background: var(--well); }
  .frames { display: flex; gap: 2px; }
  .st { flex: 1; min-width: 0; height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; color: var(--muted); font-weight: 500; font-size: 13px; position: relative; transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease); }
  .st:not([disabled]):not(.here):hover { color: var(--ink); background: var(--hover); }
  .st[disabled] { color: var(--faint); cursor: default; }
  .st svg.i { width: 15px; height: 15px; }
  .st.done { color: var(--ink); }
  .st { color: var(--faint); }
  .st.done { color: var(--ink); }
  .st.here, .st.here[disabled] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08), 0 0 0 0.5px rgb(0 0 0 / 0.04); }
  .st .rec { width: 7px; height: 7px; border-radius: 50%; background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  @keyframes rec { 50% { opacity: 0.35; } }

  /* page head */
  .head { margin-top: 30px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .head .sub { color: var(--muted); font-size: 13.5px; }
  .head .grow { flex: 1; }
  .head .btn { align-self: center; }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--well); font-weight: 500; font-size: 13px; text-decoration: none; color: var(--ink); transition: background 160ms var(--ease), border-color 160ms var(--ease), transform 160ms var(--ease); white-space: nowrap; }
  .btn:hover { background: var(--line-strong); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--pick); border-color: var(--pick); color: var(--on-pick); }
  .btn.primary:hover { filter: brightness(0.94); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { color: var(--ink); background: var(--hover); }
  .btn.big { height: 40px; padding: 0 20px; font-size: 14px; font-weight: 600; }
  .btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
  .btn.sm svg.i { width: 13px; height: 13px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ico { width: 26px; height: 26px; border-radius: 7px; display: inline-grid; place-items: center; color: var(--muted); }
  .ico:hover { background: var(--hover); color: var(--ink); }
  .ico[disabled] { opacity: 0.3; cursor: default; background: none; }
  .ico svg.i { width: 14px; height: 14px; }

  .note { margin-top: 14px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-m); font-size: 13px; background: var(--well); }
  .note.warn { background: var(--need-wash); }
  .note svg.i { color: var(--need); }

  /* the brand sheet: plain rows on one sheet */
  .group { margin-top: 32px; }
  .group h2 { margin: 0 0 8px 16px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .panel { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); overflow: hidden; }
  .item + .item { border-top: 1px solid var(--line); }
  .row { width: 100%; display: grid; grid-template-columns: 22px 120px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 16px; text-align: start; min-height: 52px; }
  button.row:hover { background: var(--row-hover); }
  .tile { width: 22px; height: 22px; display: grid; place-items: center; flex: none; color: var(--muted); }
  .tile svg.i { width: 17px; height: 17px; }
  .label { font-weight: 550; display: inline-flex; align-items: center; gap: 8px; }
  .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview.unset { color: var(--faint); }
  .item.open .preview { visibility: hidden; }
  .end { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); }
  .end .chev { transition: transform 200ms var(--ease); }
  .item.open .end .chev { transform: rotate(90deg); }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--need-wash); color: var(--need); font-size: 12px; font-weight: 600; }
  .add .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .saving { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }
  .saving svg.i { width: 13px; height: 13px; }
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease); }
  .item.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .detail .inner { padding: 0 16px 14px 50px; }
  .full { margin: 0; max-width: 62ch; white-space: pre-line; }
  .meta { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .file { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--well); color: var(--muted); font-size: 12px; }
  .file svg.i { width: 13px; height: 13px; }
  .meta .btn { height: 26px; font-size: 12px; margin-inline-start: auto; }
  .meta .btn svg.i { width: 13px; height: 13px; }
  .editor textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 0; border-radius: var(--r-s); background: var(--canvas); }
  .editor textarea:focus { outline: 2px solid var(--pick); outline-offset: 0; background: var(--surface); }
  .editor .acts { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .editor .acts .sp { flex: 1; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .opt { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--well); font-size: 13px; transition: border-color 160ms var(--ease), background 160ms var(--ease), color 160ms var(--ease); }
  .opt:hover { background: var(--line-strong); }
  .opt[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .opt[aria-pressed="true"] .tiktok, .opt[aria-pressed="true"] .x, :root[data-theme="midnight"] .opt[aria-pressed="true"] .tiktok, :root[data-theme="midnight"] .opt[aria-pressed="true"] .x { color: var(--on-ink); }
  .opt .brand { width: 14px; height: 14px; flex: none; }
  .row.choice, .row.field { grid-template-columns: 22px 120px minmax(0, 1fr); }
  .row.field input { width: 100%; height: 32px; border: 1px solid transparent; border-radius: var(--r-s); padding: 0 8px; background: transparent; text-align: end; }
  .row.field input:hover { background: var(--hover); }
  .row.field input:focus { outline: none; background: var(--surface); border-color: var(--ink); text-align: start; }
  .hint { grid-column: 3; justify-self: end; font-size: 12px; color: var(--faint); margin-top: -6px; }

  /* video type: what each kind makes, shown */
  @keyframes wave { 0%, 100% { height: 3px; } 50% { height: 12px; } }

  .empty { margin-top: 64px; text-align: center; display: grid; justify-items: center; gap: 10px; }
  .empty .big { width: 52px; height: 52px; border-radius: 15px; background: var(--pick-soft); display: grid; place-items: center; color: var(--pick-ink); }
  .empty .big svg.i { width: 22px; height: 22px; }
  .empty h3 { margin: 6px 0 0; font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
  .empty p { margin: 0; color: var(--muted); max-width: 40ch; }

  /* ideas */
  .ideas { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 28px 20px; }
  .idea { display: grid; gap: 8px; align-content: start; }
  .phone { position: relative; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; isolation: isolate; container-type: inline-size; box-shadow: 0 2px 4px rgb(30 15 5 / 0.2), 0 18px 30px -16px rgb(30 15 5 / 0.55); transition: transform 220ms var(--ease), box-shadow 220ms var(--ease); background: #1c120d; }
    .phone .bg { position: absolute; inset: 0; z-index: -1; }
  .idea .cap { position: absolute; left: 9%; right: 9%; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; font: 800 clamp(14px, 10.5cqw, 22px)/1.15 Inter, sans-serif; letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 10px rgb(0 0 0 / 0.3); }
  .idea .cap .w { display: inline-block; padding: 0 0.12em; border-radius: 0.18em; }
  .idea .cap .w.on { background: var(--pick); }
  .marks { position: absolute; left: 9px; bottom: 9px; display: flex; gap: 4px; }
  .marks span { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / 0.16); color: #fff; backdrop-filter: blur(6px); }
  .marks .brand { width: 12px; height: 12px; }
  .idea h3 { margin: 2px 0 0; font-size: 14px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
  .idea .src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); max-width: 100%; }
  .idea .src span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idea .src svg.i { width: 12px; height: 12px; }
  .idea .btn { justify-self: start; height: 28px; font-size: 12.5px; }
  .idea .btn svg.i { width: 14px; height: 14px; }
  .idea.on .phone { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--ink), 0 18px 30px -16px rgb(30 15 5 / 0.55); }
  .ghost-phone { aspect-ratio: 9 / 16; border-radius: 16px; background: linear-gradient(100deg, var(--ghost-a) 30%, var(--ghost-b) 50%, var(--ghost-a) 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .ghost-line { height: 10px; border-radius: 5px; background: var(--ghost-a); }
  .sk { height: 54px; border-top: 1px solid var(--line); background: linear-gradient(100deg, var(--surface) 30%, var(--ghost-b) 50%, var(--surface) 70%) 0 0 / 300% 100%; animation: sh 1.4s linear infinite; }
  .sk:first-child { border-top: 0; }
  @keyframes sh { to { background-position: -150% 0; } }

  /* the editor: a monitor, settings beside it, the scenes as a timeline below */
  .stu { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 22px; align-items: start; }
  .stu > * { min-width: 0; }
  .monitor { position: sticky; top: 14px; border-radius: 18px; background: var(--surface); padding: 28px 22px 16px; display: grid; justify-items: center; gap: 14px; box-shadow: var(--lift); overflow: hidden; isolation: isolate; }
  .monitor .pv { width: min(100%, 288px); }
  .transport { width: 100%; display: flex; align-items: center; gap: 10px; }
  .transport .btn.round { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: 50%; background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .transport .btn.round svg.i { width: 14px; height: 14px; fill: currentColor; }
  .transport .t { flex: 1; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .transport .t b { color: var(--ink); font-weight: 600; }
  .hintline { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .hintline svg.i { width: 14px; height: 14px; margin-top: 1px; color: var(--faint); }
  .monitor .hintline { width: 100%; }
  .pv { position: relative; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; isolation: isolate; container-type: inline-size; background: #0b0807; box-shadow: 0 2px 6px rgb(30 15 5 / 0.18), 0 24px 44px -20px rgb(30 15 5 / 0.55); user-select: none; -webkit-user-select: none; }
  .pv .field { position: absolute; inset: 0; transition: background 300ms var(--ease); }
  .pv .orb { position: absolute; width: 90%; aspect-ratio: 1; left: 5%; top: 20%; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / 0.14), rgb(255 255 255 / 0) 65%); animation: drift 9s ease-in-out infinite alternate; }
  .pv .orb.two { width: 110%; left: -24%; top: 54%; mix-blend-mode: screen; opacity: 0.55; animation-duration: 12s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-6%, 4%) scale(0.92); } to { transform: translate(8%, -6%) scale(1.12); } }
  .pv .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.15), rgb(0 0 0 / 0.05) 40%, rgb(0 0 0 / 0.35)); }
  .pv .cap { transform: translate(-50%, -50%); cursor: default; }
  .pv.edit .cap { cursor: grab; touch-action: none; }
  .pv.edit .cap.drag { cursor: grabbing; }
  .pv.edit .cap:hover { outline: 1.5px dashed rgb(255 255 255 / 0.55); outline-offset: 6px; }
  .pv.edit .cap .w { cursor: pointer; }
  .pv .guide { position: absolute; background: rgb(255 255 255 / 0.55); pointer-events: none; opacity: 0; transition: opacity 120ms; }
  .pv .guide.v { top: 0; bottom: 0; left: 50%; width: 1px; } .pv .guide.h { left: 0; right: 0; top: 50%; height: 1px; }
  .pv .guide.on { opacity: 1; }
  .pv .making { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: #fff; font-weight: 600; font-size: 13px; background: rgb(0 0 0 / 0.45); backdrop-filter: blur(3px); }
  .pv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

  /* the timeline: a time ruler, the scenes as clips on a track, a voice track, and a playhead */
  .tl { margin-top: 16px; position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); padding: 6px 12px 12px 6px; }
  .tl .gut { display: grid; grid-template-rows: 22px 58px auto; align-items: center; justify-items: center; color: var(--faint); }
  .tl .gut svg.i { width: 14px; height: 14px; }
  .tl .lanes { position: relative; display: grid; grid-template-rows: 22px 58px auto; gap: 0; min-width: 0; }
  .ruler { position: relative; height: 22px; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ruler i { position: absolute; bottom: 3px; width: 1px; height: 4px; background: var(--line-strong); }
  .ruler i.big { height: 8px; background: var(--faint); }
  .ruler span { position: absolute; top: 1px; transform: translateX(-50%); }
  .ruler span:first-of-type { transform: none; margin-left: 8px; }
  .lane { position: relative; display: flex; gap: 3px; height: 58px; }
  .clip { position: relative; min-width: 0; flex: 1 1 0; height: 100%; padding: 7px 9px; border-radius: 7px; text-align: start; background: color-mix(in srgb, var(--k) 13%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 30%, transparent); display: grid; align-content: space-between; cursor: pointer; overflow: hidden; transition: box-shadow 140ms var(--ease); }
  .clip:hover { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 60%, transparent); }
  .clip[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
  .clip .kt { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: color-mix(in srgb, var(--k) 75%, var(--ink)); white-space: nowrap; overflow: hidden; }
  .clip .kt svg.i { width: 11px; height: 11px; flex: none; }
  .clip b { font-size: 12px; font-weight: 550; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .clip.add { flex: 0 0 40px; display: grid; place-items: center; background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); padding: 0; }
  .clip.add:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .vlane { display: flex; gap: 3px; height: 22px; margin-top: 4px; }
  .vlane i { flex: 1 1 0; min-width: 0; border-radius: 5px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--cta) 45%, transparent) 0 2px, transparent 2px 4px) center / 100% 60% no-repeat, color-mix(in srgb, var(--cta) 8%, var(--surface)); }
  .vlane i.off { background: var(--well); }
  .ph { position: absolute; top: 0; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; z-index: 3; }
  .ph::before { content: ""; position: absolute; top: -1px; left: -4px; width: 10px; height: 10px; border-radius: 3px 3px 5px 5px; background: var(--ink); }

  /* what the apps cover: their buttons on the right and the caption at the foot */
  .safe { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .safe .rc { position: absolute; right: 3.5%; top: 47%; display: grid; gap: 4.5cqw; justify-items: center; }
  .safe .rc i { width: 9cqw; height: 9cqw; border-radius: 50%; background: rgb(255 255 255 / 0.82); box-shadow: 0 1px 4px rgb(0 0 0 / 0.3); }
  .safe .rc i:first-child { width: 10.5cqw; height: 10.5cqw; background: rgb(255 255 255 / 0.95); }
  .safe .bt { position: absolute; left: 4.5%; bottom: 6.5%; width: 66%; display: grid; gap: 1.8cqw; }
  .safe .bt i { height: 2.6cqw; border-radius: 2cqw; background: rgb(255 255 255 / 0.8); }
  .safe .bt i:first-child { width: 42%; height: 3.2cqw; }
  .safe .bt i:last-child { width: 78%; }
  .safe .zone { position: absolute; background: repeating-linear-gradient(135deg, rgb(255 90 95 / 0.22) 0 6px, transparent 6px 12px); }
  .safe .zone.r { right: 0; top: 44%; width: 17%; bottom: 20%; border-radius: 10px 0 0 10px; }
  .safe .zone.b { left: 0; right: 0; bottom: 0; height: 21%; }
  .trim { position: absolute; top: 6px; bottom: 6px; right: 2px; width: 8px; border-radius: 4px; cursor: ew-resize; display: grid; place-items: center; opacity: 0; transition: opacity 140ms var(--ease); touch-action: none; }
  .trim::after { content: ""; width: 2px; height: 16px; border-radius: 1px; background: color-mix(in srgb, var(--k) 70%, var(--ink)); }
  .clip:hover .trim, .clip[aria-current="true"] .trim, .trim.on { opacity: 1; }
  .clip .secs { position: absolute; right: 12px; top: 7px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .clip.drop-before { box-shadow: inset 3px 0 0 var(--ink), inset 0 0 0 1px color-mix(in srgb, var(--k) 30%, transparent); }
  .clip.dragging { opacity: 0.45; }
  .count { font-variant-numeric: tabular-nums; }
  .count.over { color: var(--tally); font-weight: 600; }

  /* settings sheet */
  .insp { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .insp > *, .post > *, .make > * { min-width: 0; }
  .card { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--lift); overflow: hidden; }
  .scbar { display: flex; align-items: center; gap: 2px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
  .scbar .ttl { font-weight: 650; letter-spacing: -0.01em; flex: 1; font-size: 14px; }
  .scbar .ttl small { color: var(--muted); font-weight: 400; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }
  .fld { display: grid; gap: 7px; padding: 12px 16px; }
  .fld + .fld { border-top: 1px solid var(--line); }
  .fld > .lab { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 550; }
  .fld > .lab svg.i { width: 15px; height: 15px; color: var(--faint); }
  .fld > .lab .r { margin-inline-start: auto; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; font-size: 12px; }
  .fld input[type="text"], .fld textarea, .fld select { width: 100%; border: 0; border-radius: var(--r-s); padding: 9px 12px; background: var(--canvas); resize: none; }
  .fld textarea { field-sizing: content; min-height: 2.6lh; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { outline: 2px solid var(--pick); outline-offset: 0; background: var(--surface); }
  .kinds4 { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--well); }
  .k4 { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 6px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .k4:hover { color: var(--ink); }
  .k4[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(40 20 25 / 0.1); }
  .k4 svg.i { width: 14px; height: 14px; }
  .k4[data-kind4="hook"] svg.i { color: var(--hook); } .k4[data-kind4="point"] svg.i { color: var(--point); } .k4[data-kind4="proof"] svg.i { color: var(--proof); } .k4[data-kind4="cta"] svg.i { color: var(--cta); }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--well); }
  .seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 8px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 12.5px; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(40 20 5 / 0.12); }
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pre { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #2c2c33, #141418); border: 0; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.1); transition: box-shadow 160ms var(--ease), transform 160ms var(--ease); }
  .pre:hover { transform: translateY(-1px); }
  .pre[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .pre .cap { pointer-events: none; }
  .pre small { position: absolute; left: 8px; bottom: 5px; font-size: 11px; font-weight: 600; color: rgb(255 255 255 / 0.8); font-family: Inter, sans-serif; }
  .fonts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .fontb { height: 40px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--surface); font-size: 18px; display: grid; place-items: center; transition: border-color 160ms var(--ease), background 160ms var(--ease); }
  .fontb:hover { border-color: #b8b6ae; }
  .fontb[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .range { width: 100%; accent-color: var(--ink); }
  .swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sw { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); transition: transform 160ms var(--ease), box-shadow 160ms var(--ease); }
  .sw:hover { transform: scale(1.1); }
  .sw[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14), 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .colorin { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
  .colorin::-webkit-color-swatch-wrapper { padding: 0; } .colorin::-webkit-color-swatch { border: 1px solid rgb(0 0 0 / 0.15); border-radius: 50%; }
  .pal { display: flex; height: 26px; width: 58px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); }
  .pal i { flex: 1; }
  .pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .tog { display: flex; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: start; }
  .tog + .tog { border-top: 1px solid var(--line); }
  .tog .tx { flex: 1; min-width: 0; font-weight: 550; }
  .tog .tx small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .sw2 { width: 34px; height: 20px; border-radius: 999px; background: var(--switch-off); position: relative; transition: background 200ms var(--ease); flex: none; }
  .sw2::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform 200ms var(--ease); }
  .tog[aria-pressed="true"] .sw2 { background: var(--ok); }
  .tog[aria-pressed="true"] .sw2::after { transform: translateX(14px); }
  [dir="rtl"] .tog[aria-pressed="true"] .sw2::after { transform: translateX(-14px); }
  .sec { border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; }
  .sec > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 16px; font-weight: 650; font-size: 13.5px; letter-spacing: -0.01em; text-align: start; }
  .sec > button .tile { width: 20px; height: 20px; }
  .sec > button .chev { margin-inline-start: auto; color: var(--faint); transition: transform 200ms var(--ease); }
  .sec.open > button .chev { transform: rotate(90deg); }
  .sec .detail .body { padding: 0 16px 16px; display: grid; gap: 14px; }
  .sec.open .detail { grid-template-rows: 1fr; }
  .sec .tog { padding-inline: 0; }
  .sub2 { display: grid; gap: 8px; }
  .sub2 > .lab { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
  /* voices: pick one, hear it first */
  .voices { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 10px; background: var(--well); }
  .vo { position: relative; }
  .vo [data-voice] { width: 100%; display: grid; gap: 1px; padding: 7px 10px 7px 38px; border-radius: 8px; text-align: start; color: var(--muted); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .vo [data-voice] b { font-size: 12.5px; font-weight: 550; color: var(--ink); }
  .vo [data-voice] span { font-size: 11.5px; }
  .vo [data-voice]:hover { background: var(--hover); }
  .vo [data-voice][aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(40 20 5 / 0.12); }
  .vo [data-voice][aria-pressed="true"] b { font-weight: 650; }
  .vo [data-hear] { position: absolute; inset-inline-start: 8px; top: 50%; translate: 0 -50%; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); transition: background 160ms var(--ease), color 160ms var(--ease); }
  .vo [data-hear] svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
  .vo [data-hear]:hover, .vo [data-hear][aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }

  /* make: a clapperboard while the video is made */
  .make { margin: 30px auto 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 44px; align-items: center; max-width: 800px; }
  .acts2 { margin-top: 18px; display: flex; gap: 8px; }
  .make .monitor { position: relative; top: 0; padding: 26px 22px; }
  .make h2 { margin: 12px 0 4px; font-size: 24px; font-weight: 650; letter-spacing: -0.035em; }
  .make p.s { margin: 0 0 18px; color: var(--muted); }
  .rolling { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--live-wash); font-size: 12.5px; font-weight: 600; color: var(--live-ink); }
  .rolling i { width: 7px; height: 7px; border-radius: 50%; background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  .stages { display: grid; gap: 2px; }
  .stg { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--line); color: var(--faint); }
  .stg:first-child { border-top: 0; }
  .stg b { font-weight: 600; display: block; color: inherit; }
  .stg small { color: var(--faint); font-size: 12px; }
  .stg .tile { color: var(--faint); }
  .stg.now { color: var(--ink); } .stg.now small { color: var(--muted); } .stg.now .tile { color: var(--ink); }
  .stg.done { color: var(--ink); } .stg.done .tile { color: var(--ok); }
  .bar2 { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 7px; }
  .bar2 i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width 400ms var(--ease); }

  .post { margin-top: 28px; display: grid; grid-template-columns: 292px minmax(0, 1fr); gap: 34px; align-items: start; }
  .post .sticky { position: sticky; top: 14px; display: grid; gap: 12px; padding: 24px 20px 16px; border-radius: 18px; background: var(--surface); box-shadow: var(--lift); justify-items: center; overflow: hidden; isolation: isolate; }
  .post .sticky .pv { width: 100%; }
  .post .row2 { display: flex; gap: 8px; align-items: center; width: 100%; }
  .post .row2 .meta2 { font-size: 12px; color: var(--muted); margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12.5px; color: var(--muted); background: var(--well); padding: 3px 9px; border-radius: 999px; }
  .notes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .notes li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; border-radius: var(--r-s); background: var(--need-wash); }
  .notes li svg.i { width: 14px; height: 14px; color: var(--need); margin-top: 2px; }

  /* the one next action: at the foot of the page, on the desk */
  .dock { position: sticky; bottom: 0; z-index: 20; margin: 26px -28px 0; padding: 14px 28px; display: flex; align-items: center; gap: 10px; background: var(--canvas); box-shadow: 0 -14px 14px -10px var(--canvas), 0 -1px 0 var(--line); }
  .dock .msg { flex: 1; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-width: 0; font-variant-numeric: tabular-nums; }
  .dock .msg svg.i { color: var(--faint); }
  .dock .btn.big:not(.quiet) { background: var(--pick); border-color: var(--pick); color: var(--on-pick); }
  .dock .btn.big:not(.quiet):hover { filter: brightness(0.94); }

  .enter .fade { animation: fadein 260ms var(--ease); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  @media (max-width: 1000px) {
    .stu { grid-template-columns: minmax(0, 1fr); }
    .monitor { position: static; }
  }
  @media (max-width: 680px) {
    .shell { padding: 16px 14px 24px; }
    .dock { margin-inline: -14px; padding-inline: 14px; }
    .st span.t { display: none; }
    .vsw > button { max-width: 140px; }
    .name { display: none; }
    .make, .post { grid-template-columns: minmax(0, 1fr); }
    .post .sticky { position: static; max-width: 300px; margin-inline: auto; }
    .row { grid-template-columns: 22px minmax(0, 1fr) auto; }
    .row .preview { grid-column: 2 / 4; grid-row: 2; margin-top: -8px; }
    .row.choice, .row.field { grid-template-columns: 22px minmax(0, 1fr); }
    .row.choice .opts, .row.field input { grid-column: 1 / -1; justify-content: flex-start; text-align: start; }
    .hint { grid-column: 1 / -1; justify-self: start; margin-top: 0; }
    .detail .inner { padding-inline-start: 16px; }
  }

  /* the two places: the production line, and the library of everything made */
  .tright { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .tright .vsw { margin-inline-start: 0; }
  .tright .vsw::before { content: ""; width: 1px; height: 18px; background: var(--line-strong); margin-inline-end: 10px; }
  .tright .vsw:not([hidden]) { display: inline-flex; align-items: center; }
  .tright .modes { margin-inline-start: auto; }
  .modes { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--well); flex: none; }
  .modes button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 13px; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(60 40 20 / 0.08); }
  .modes button svg.i { width: 14px; height: 14px; }
  .modes .n { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 500; }
  .menu .mi.all { color: var(--muted); }

  /* library */
  .libbar { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--well); }
  .seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(60 40 20 / 0.08); }
  .seg .n { color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 500; }
  .find { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border-radius: var(--r-s); background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong); color: var(--faint); width: 220px; }
  .find:focus-within { box-shadow: 0 0 0 2px var(--ink); }
  .find input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; color: var(--ink); }
  .lib { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
  .lib.open { grid-template-columns: minmax(0, 1fr) 400px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 26px 16px; }
  .vc { display: grid; gap: 9px; text-align: start; align-content: start; }
  .cvw { position: relative; }
  .cv { position: relative; z-index: 1; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; container-type: inline-size; isolation: isolate; box-shadow: 0 1px 3px rgb(30 15 5 / 0.16), 0 14px 26px -18px rgb(30 15 5 / 0.5); transition: transform 220ms var(--ease), box-shadow 220ms var(--ease); }
  .cv .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.12), rgb(0 0 0 / 0) 40%, rgb(0 0 0 / 0.4)); }
  .cv .cap { transform: translate(-50%, -50%); margin: 0; pointer-events: none; }
  .cv .chip { position: absolute; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; background: rgb(12 8 8 / 0.58); color: #fff; font: 600 11px/1 Inter, sans-serif; font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); }
  .cv .chip.dur { bottom: 8px; inset-inline-end: 8px; }
  .cv .chip.st { top: 8px; inset-inline-start: 8px; }
  .cv .chip.st i { width: 6px; height: 6px; border-radius: 50%; background: #ffc46b; }
  .cv .chip.st.making i { background: var(--tally); animation: rec 1.4s ease-in-out infinite; }
  .cv .chip.ed { top: 8px; inset-inline-end: 8px; padding: 0 6px; }
  .cv .chip svg.i { width: 11px; height: 11px; stroke-width: 2.2; }
  .cv .hov { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 180ms var(--ease); }
  .cv .hov span { width: 40px; height: 40px; border-radius: 50%; background: rgb(255 255 255 / 0.92); color: #1f1a1c; display: grid; place-items: center; box-shadow: 0 6px 18px rgb(0 0 0 / 0.3); }
  .cv .hov svg.i { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-inline-start: 2px; }
  .vc:hover .cv { transform: translateY(-3px); box-shadow: 0 2px 6px rgb(30 15 5 / 0.18), 0 22px 34px -20px rgb(30 15 5 / 0.6); }
  .vc:hover .cv .hov { opacity: 1; }
  .vc[aria-pressed="true"] .cv { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--ink), 0 22px 34px -20px rgb(30 15 5 / 0.6); }
  .vc .tt { font-weight: 600; font-size: 13px; line-height: 1.3; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vc .mt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: -4px; }
  .vc .mt .am svg.brand { width: 11px; height: 11px; }
  .vc .mt .pmk { display: inline-flex; gap: 6px; margin-inline-start: auto; }

  /* one video, opened beside the shelf */
  .lp { position: sticky; top: 16px; background: var(--surface); border-radius: 16px; box-shadow: var(--lift), 0 18px 40px -28px rgb(50 30 10 / 0.35); padding: 16px; animation: slidein 240ms var(--ease); }
  @keyframes slidein { from { opacity: 0; transform: translateX(12px); } }
  [dir="rtl"] .lp { animation-name: slideinr; }
  @keyframes slideinr { from { opacity: 0; transform: translateX(-12px); } }

  .links { display: grid; gap: 6px; }

    document.querySelectorAll("[data-dup]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); addScene(v, +b.dataset.dup + 1, +b.dataset.dup); }; });
    document.querySelectorAll("[data-del]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); const l = editable(v).scenes; if (l.length < 2) return; l.splice(+b.dataset.del, 1); sel = Math.max(0, Math.min(sel, l.length - 1)); saveEdits(); paint(); }; });
    const add = $("addScene"); if (add) add.onclick = () => addScene(v, scenesOf(v).length);
    // Drag a clip's end to change how long it lasts, half a second at a time.
    document.querySelectorAll("[data-trim]").forEach((h) => {
      h.onclick = (e) => e.stopPropagation();
      h.onpointerdown = (e) => {
        e.preventDefault(); e.stopPropagation();
        const i = +h.dataset.trim, clip = h.closest(".clip"), lane = clip.parentElement;
        const list = scenesOf(v), total = list.reduce((a, _, k) => a + secondsOf(v, k), 0);
        const pxPerSec = lane.getBoundingClientRect().width / total, start = secondsOf(v, i), x0 = e.clientX;
        let next = start; h.classList.add("on");
        const move = (ev) => {
          next = Math.max(1.5, Math.min(10, Math.round((start + (ev.clientX - x0) / pxPerSec) * 2) / 2));
          clip.style.flex = next + " 1 0"; clip.querySelector(".secs").textContent = next + "s";
        };
        const up = () => {
          window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
          h.classList.remove("on");
          if (next !== start) { editable(v).scenes[i].seconds = next; sel = i; saveEdits(); paint(); }
        };
        window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
      };
    });
    // Drag a clip onto another to put it there.
    let from = null;
    document.querySelectorAll('.clip[draggable="true"]').forEach((c) => {
      c.ondragstart = (e) => { from = +c.dataset.scene; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(from)); };
      c.ondragend = () => { c.classList.remove("dragging"); document.querySelectorAll(".drop-before").forEach((x) => x.classList.remove("drop-before")); };
      c.ondragover = (e) => { if (from == null) return; e.preventDefault(); document.querySelectorAll(".drop-before").forEach((x) => x.classList.remove("drop-before")); c.classList.add("drop-before"); };
      c.ondrop = (e) => {
        e.preventDefault(); const to = +c.dataset.scene; if (from == null || to === from) return;
        const l = editable(v).scenes, [moved] = l.splice(from, 1); l.splice(to > from ? to - 1 : to, 0, moved);
        sel = to > from ? to - 1 : to; from = null; saveEdits(); paint();
      };
    });
  }
  function wire() {
    wirePlayers();
    if (c.canWrite && !c.canWrite()) document.querySelectorAll("[data-choice],[data-edit],[data-save]").forEach((b) => { b.disabled = true; });
    document.querySelectorAll("[data-step]").forEach((b) => { if (!b.classList.contains("st")) b.onclick = () => go(b.dataset.step); });
    document.querySelectorAll("[data-toggle]").forEach((b) => { b.onclick = () => { const name = PARTS[+b.dataset.toggle].name; open = open === name ? null : name; editing = null; paint(); const ta = $("ta" + b.dataset.toggle); if (ta) ta.focus(); }; });
    document.querySelectorAll("[data-edit]").forEach((b) => { b.onclick = () => { editing = PARTS[+b.dataset.edit].name; paint(); const ta = $("ta" + b.dataset.edit); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }; });
    document.querySelectorAll("[data-close]").forEach((b) => { b.onclick = () => { editing = null; open = null; paint(); }; });
    document.querySelectorAll("[data-save]").forEach((b) => { b.onclick = () => { const i = +b.dataset.save, ta = $("ta" + i), val = ta.value.trim(); if (!val) { ta.focus(); return; } editing = null; open = null; tell(PARTS[i].name, val); }; });
    document.querySelectorAll("[data-quick]").forEach((b) => { b.onclick = () => { const ta = $("ta" + b.dataset.quick); ta.value = ta.value.trim() ? ta.value.trim().replace(/\.?$/, ". ") + b.textContent + "." : b.textContent + "."; ta.focus(); }; });
    document.querySelectorAll("[data-choice]").forEach((b) => {
      b.onclick = () => {
        const p = PARTS[+b.dataset.part]; let val = b.dataset.choice;
        if (p.many) {
          let on = part(p.name).missing ? [] : picked(p).filter(Boolean);
          on = on.indexOf(val) >= 0 ? on.filter((x) => x !== val) : on.concat(val);
          if (!on.length) return;
          val = p.choices.filter((x) => on.indexOf(x) >= 0).join(", ");
        } else if (b.getAttribute("aria-pressed") === "true") return;
        const rest = restLines(p.name); tell(p.name, rest ? val + "\n" + rest : val);
      };
    });
    const fill = $("fill"); if (fill) fill.onclick = () => { running = true; say(""); paint(); c.jobs.run("fill-profile").catch((e) => { running = false; say(e && e.message ? e.message : "Reading your pages could not start. Try again."); paint(); }); };
    const gi = $("getIdeas"); if (gi) gi.onclick = () => { ideasRunning = true; say(""); paint(); c.jobs.run("make-ideas").catch((e) => { ideasRunning = false; say(e && e.message ? e.message : "Ideas could not start. Try again."); paint(); }); };
    document.querySelectorAll("[data-use]").forEach((b) => { b.onclick = () => useIdea(b.dataset.use); });
    document.querySelectorAll("[data-open]").forEach((b) => { b.onclick = () => { currentVideo = b.dataset.open; sel = 0; const x = cur(); go(x && stateOf(x) === "ready" ? "post" : "script"); }; });
    const mk = $("makeBtn"); if (mk) mk.onclick = () => { const v = cur(); if (v && !premake && missing().length) { premake = true; if (view === "look" || view === "script") paint(); else go("look"); return; } premake = false; makeVideo(); };
    const pc = $("pmClose"); if (pc) pc.onclick = () => { premake = false; paint(); };
    const ps = $("pmStill"); if (ps) ps.onclick = () => { const v = cur(); (vEdits[v.id] = vEdits[v.id] || {}).motion = "still"; premake = false; makeVideo(); };
    document.querySelectorAll("[data-motion]").forEach((b) => { b.onclick = () => { const v = cur(); (vEdits[v.id] = vEdits[v.id] || {}).motion = b.dataset.motion; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-connect]").forEach((b) => { b.onclick = () => connectNeed(b.dataset.connect); });
    const un = $("undo"); if (un) un.onclick = () => { const v = cur(); if (!v) return; delete vEdits[v.id]; saveEdits(); sel = 0; paint(); };
    wireScenes();
    wireInspector();
    document.querySelectorAll("[data-platform]").forEach((b) => { b.onclick = () => { postTab = b.dataset.platform; paint(); }; });
    document.querySelectorAll("[data-post]").forEach((f) => {
      f.oninput = () => {
        const v = cur(); const e = (vEdits[v.id] = vEdits[v.id] || {}); e.post = e.post || {}; e.post[f.dataset.post] = e.post[f.dataset.post] || {}; e.post[f.dataset.post][f.dataset.pfield] = f.value; saveEdits();
        const lab = f.parentElement.querySelector("[data-count]"), p = postOf(v, f.dataset.post);
        if (lab) lab.outerHTML = countOf(f.dataset.post, f.dataset.pfield, f.value, f.dataset.pfield === "caption" ? p.hashtags : []);
      };
    });
    document.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = () => {
        const v = cur(); if (!v) return; const post = postOf(v, b.dataset.copy); const text = post.caption + "\n\n" + post.hashtags.join(" ");
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { b.innerHTML = icon("check") + "Copied"; }, () => { b.innerHTML = icon("alert") + "Select and copy it instead"; });
      };
    });
  }
  function wireInspector() {
    const v = cur(); if (!v || (view !== "script" && view !== "look")) return;
    document.querySelectorAll("[data-field]").forEach((f) => {
      f.oninput = () => {
        const s = editable(v).scenes[sel]; if (!s) return;
        const k = f.dataset.field; s[k] = k === "seconds" ? Number(f.value) : f.value;
        // The words are said and shown alike: one line for both.
        if (k === "said") { s.onScreen = f.value; const n = $("f-said-n"); if (n) n.textContent = C.words(f.value).length + " words"; delete s.key; }
        if (k === "seconds") { const n = $("f-sec-n"); if (n) n.textContent = (Math.round(Number(f.value) * 10) / 10) + " sec"; }
        saveEdits(); drawPreview(); refreshScenes();
      };
    });
    document.querySelectorAll("[data-kind4]").forEach((b) => { b.onclick = () => { editable(v).scenes[sel].kind = b.dataset.kind4; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-sec]").forEach((b) => { b.onclick = () => { secOpen[b.dataset.sec] = !secOpen[b.dataset.sec]; const s = b.closest(".sec"); s.classList.toggle("open", secOpen[b.dataset.sec]); b.setAttribute("aria-expanded", String(secOpen[b.dataset.sec])); }; });
    document.querySelectorAll("[data-preset]").forEach((b) => { b.onclick = () => { const p = C.PRESETS[b.dataset.preset], patch = { preset: b.dataset.preset }; ["style", "font", "upper", "size", "color", "accent", "y"].forEach((k) => { patch[k] = p[k]; }); patch.x = 50; setLook(v, patch); paint(); }; });
    document.querySelectorAll("[data-cstyle]").forEach((b) => { b.onclick = () => { setLook(v, { style: b.dataset.cstyle }); paint(); }; });
    document.querySelectorAll("[data-font]").forEach((b) => { b.onclick = () => { setLook(v, { font: b.dataset.font }); paint(); }; });
    const size = $("f-size"); if (size) size.oninput = () => { setLook(v, { size: Number(size.value) }); $("size-n").textContent = size.value; drawPreview(); };
    document.querySelectorAll("[data-accent]").forEach((b) => { b.onclick = () => { setLook(v, { accent: b.dataset.accent }); paint(); }; });
    const acc = $("f-accent"); if (acc) acc.oninput = () => { setLook(v, { accent: acc.value }); drawPreview(); };
    document.querySelectorAll("[data-place]").forEach((b) => { b.onclick = () => { const e = editable(v); e.scenes.forEach((s) => { delete s.pos; }); setLook(v, { y: Number(b.dataset.place), x: 50 }); paint(); }; });
    const all = $("allScenes"); if (all) all.onclick = () => { const e = editable(v), p = e.scenes[sel].pos; e.scenes.forEach((s) => { delete s.pos; }); setLook(v, { x: p.x, y: p.y }); paint(); };
    document.querySelectorAll("[data-pal]").forEach((b) => { b.onclick = () => { const e = (vEdits[v.id] = vEdits[v.id] || {}); e.palette = PALETTES[+b.dataset.pal]; saveEdits(); paint(); }; });
    document.querySelectorAll("[data-tog]").forEach((b) => {
      b.onclick = () => {
        const k = b.dataset.tog;
        if (k === "safe") { showSafe = !showSafe; paint(); return; }
        const e = (vEdits[v.id] = vEdits[v.id] || {});
        if (k === "speak") e.speak = !speakOf(v);
        else setLook(v, { [k]: !lookOf(v)[k] });
        saveEdits(); paint();
      };
    });
    document.querySelectorAll("[data-voice]").forEach((b) => { b.onclick = () => { (vEdits[v.id] = vEdits[v.id] || {}).voice = b.dataset.voice; saveEdits(); paint(); }; });
  }

  /* Each voice has a short sample in studio/voices, so the person hears it before choosing. */
  const sample = new Audio();
  sample.preload = "none";
  function showHearing() {
    document.querySelectorAll("[data-hear]").forEach((b) => {
      const on = b.dataset.hear === hearing;
      b.setAttribute("aria-pressed", String(on));
      b.innerHTML = icon(on ? "pause" : "play");
    });
  }
  sample.onended = sample.onerror = () => { hearing = ""; showHearing(); };
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-hear]");
    if (!b) return;
    const name = b.dataset.hear;
    if (hearing === name) { sample.pause(); hearing = ""; showHearing(); return; }
    hearing = name;
    sample.src = "voices/" + name.toLowerCase() + ".m4a";
    sample.play().catch(() => { hearing = ""; showHearing(); });
    showHearing();
  });

  /* ---------- data ---------- */
  function loadIdeas() {
    return c.files.read("studio/data/ideas.json").then((t) => { try { ideas = JSON.parse(t); } catch (e) { ideas = null; } }, () => { ideas = null; });
  }
  function loadVideos() {
    if (!c.files.list) return Promise.resolve();
    return c.files.list("studio/data/videos").then((entries) => {
      const dirs = (entries || []).filter((e) => e.isDir);
      return Promise.all(dirs.map((d) => {
        const base = "studio/data/videos/" + d.name + "/";
        return Promise.all([c.files.read(base + "video.json").then(JSON.parse, () => null), c.files.read(base + "render.json").then(JSON.parse, () => null)])
          .then((r) => r[0] && Array.isArray(r[0].scenes) ? { id: d.name, plan: r[0], render: r[1] } : null);
      }));
    }, () => []).then((list) => {
      videos = (list || []).filter(Boolean).sort((a, b) => String(b.plan.createdAt || "").localeCompare(String(a.plan.createdAt || "")));
      // The handlers hold the old video objects: rebuild once so they hold the new ones.
      lastHTML = "";
    });
  }
  function watchJobs(list) {
    videoJobs = videoJobs || {};
    (list || []).forEach((job) => {
      if (job.id === "fill-profile") {
        const was = running; running = !!job.running;
        if (was && !running && job.lastRun && job.lastRun.ok === false) say("Reading your pages stopped early. Try again, or add the parts yourself.");
      }
      if (job.id === "write-script") {
        // Only a run seen going and then stopping ends "Writing", so a click that has not
        // reached the routine yet is not undone by the last run's old result.
        const was = videoJobs[job.id]; videoJobs[job.id] = !!job.running;
        if (was && !job.running) {
          if (job.lastRun && job.lastRun.ok === false) say("The script stopped before it was done. Try again.");
          const id = scriptingId; scriptingId = null;
          loadVideos().then(() => { if (id && hasVideo(id)) { currentVideo = id; sel = 0; if (view === "script") { /* stay */ } } paint(); });
        }
        if (job.running && !scriptingId && pickedIdea) scriptingId = pickedIdea;
      }
      if (job.id === "make-video") {
        const was = videoJobs[job.id]; videoJobs[job.id] = !!job.running;
        if (was && !job.running) {
          if (job.lastRun && job.lastRun.ok === false) say("The video stopped before it was done. Try again.");
          const id = makingId; makingId = null;
          loadVideos().then(() => {
            // A made video has taken the person's changes in, so the saved copy of them is done with.
            const v = id ? videoById(id) : cur();
            if (v && stateOf(v) === "ready" && vEdits[v.id]) { delete vEdits[v.id]; if (canSave) c.store.set("videos", vEdits).catch(() => {}); }
            if (v && stateOf(v) === "ready" && view === "make") view = "post";
            paint();
          });
        }
        if (job.running && !makingId) { const r = canSave && c.store.get ? c.store.get("render") : null; makingId = typeof r === "string" && r ? r : currentVideo; }
      }
      if (job.id === "make-ideas") {
        const was = ideasRunning; ideasRunning = !!job.running;
        if (was && !ideasRunning && job.lastRun && job.lastRun.ok === false) say("Writing ideas stopped early. Try again.");
      }
    });
    paint();
  }
  function load() {
    if (!inCabinet) { say("Open Shorts Factory in Cabinet to use the Studio."); return; }
    Promise.all([
      c.files.read("profile.md").then((t) => { file = parse(t); }, () => { file = {}; say("profile.md is missing. Fill from my pages makes a new one."); }),
      loadIdeas(), loadVideos(),
    ]).then(() => { readEdits(); if (!loaded) firstView(); loaded = true; paint(); });
  }
  /** Open on the step the person is at: the newest video, the picked idea, else the brand. */
  function firstView() {
    const v = videos[0];
    if (v) { currentVideo = v.id; view = stateOf(v) === "ready" ? "post" : stateOf(v) === "making" ? "make" : "script"; }
    else if (profileDone() && pickedIdea) view = "idea";
    else if (profileDone()) view = "idea";
    else view = "brand";
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && premake && !linking) { premake = false; paint(); return; }
    if (e.key === "Escape" && mode === "library" && libSel) { libSel = null; paint(); }
  });
  document.addEventListener("click", (e) => { const pm = $("premake"); if (premake && pm && !linking && e.target.isConnected && !e.composedPath().includes(pm) && !e.composedPath().includes($("makeBtn"))) { premake = false; paint(); } });
  document.addEventListener("click", (e) => { if (menuOpen && !e.composedPath().includes($("vsw"))) { menuOpen = false; paintSwitch(); } });
  if (inCabinet) {
    c.files.onChange("", load);
    c.jobs.list().then(watchJobs, () => {});
    c.jobs.onChange(watchJobs);
    if (c.connectors) { const take = (list) => { conns = list || []; settle(); paint(); }; c.connectors.list().then(take, () => {}); c.connectors.onChange(take); }
    if (c.store && c.store.onChange) c.store.onChange(() => { const keep = vEdits; readEdits(); if (vSaveTimer) vEdits = keep; paint(); });
  }
  // The store's first values arrive with Cabinet's hello.
  (inCabinet && c.ready ? c.ready : Promise.resolve()).then(load, load);
})();
</script>
