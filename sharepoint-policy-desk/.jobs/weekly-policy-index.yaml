id: weekly-policy-index
name: Weekly Policy Index
enabled: true
schedule: 0 7 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: library-keeper
agentSlug: library-keeper
timeout: 900
prompt: |-
  Write this week's policy index.

  Your working directory is the cabinet root. Every index lives in `policy-index/`, one
  file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-policy-index.md`, the local time you ran
  and then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is an index nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the five
     columns, the `Review` vocabulary, the row order, what counts as a policy and the
     tone. This prompt does not repeat them.
  2. Find the connected SharePoint library in this cabinet. It is the folder that is
     neither `policy-index/` nor `policies/`, mounted view only by the SharePoint
     connector. Walk it and list every policy document in it.
  3. This run is read only, and the folder is mounted so that it has to be. Do not create,
     edit, rename, move, copy or delete anything inside the library. You write into
     `policy-index/` and nowhere else.
  4. If there is no connected library, STOP HERE. Write nothing. Leave `policy-index/`
     exactly as you found it, example and all, and report: "The policy library is not
     connected yet. Open Cabinet's integrations screen, connect SharePoint, and pick the
     library. I would have listed every policy in it with its owner and review date."
     Then exit.
  5. Same if the folder is there but unreadable, or empty. Say which of the two, touch no
     file, exit. An index you could not read the library for is worse than no index: never
     fall back to the example's contents, to last week's file, or to the policies a
     company like this one usually has.
  6. On the first run that does reach a real library, write your dated file and then delete
     `policy-index/EXAMPLE-policy-index.md`. It is a demo, not a past index, and it must
     not sit in the date list beside real ones. Do not merge with it, do not rename it, and
     never write `EXAMPLE` into a name of your own.
