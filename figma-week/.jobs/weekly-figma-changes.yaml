id: weekly-figma-changes
name: Weekly Figma Changes
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: design-watcher
agentSlug: design-watcher
timeout: 1200
prompt: |-
  Write this Monday's page of what changed in Figma.

  Your working directory is the cabinet root. Every summary lives in `weekly-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-figma-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Kind` vocabulary, the row order and the tone. This prompt does not
     repeat them.
  2. With your Figma tools, go through the files the user can open and collect every change
     from the last seven days, ending now. Read the frames, components and variables far
     enough to say what each change does — that sentence is the whole point of the page.
  3. This run is read only. Do not create a file or a design, do not generate code from a
     design, do not draw a FigJam diagram, and do not edit anything you opened.
  4. If you have no Figma tool, or Figma is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `weekly-summaries/` exactly as you found it, example and all.
     Report: "Figma is not reachable. I would have listed every change in the last seven
     days, one row each, the ones that reach other files first." Then exit.
  5. A week in which nothing changed is a real result. Write the file with an empty table
     and a headline saying so — never pad it, and never reach further back than seven days
     to fill it out.
  6. On the first run that does reach Figma, write your dated file and then delete
     `weekly-summaries/EXAMPLE-figma-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
