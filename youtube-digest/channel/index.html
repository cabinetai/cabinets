<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sheet: #fffdf8; --ink: #1f1b16; --soft: #6b6359; --tone: #f6f1e7; --tone-2: #efe8da; --edge: rgba(31, 27, 22, 0.08);
    --terracotta: #e2725b; --terracotta-ink: #9c3a26; --terracotta-pale: #fbe6e0;
    --amber: #e08a3c; --amber-ink: #8f4d10; --amber-pale: #fbebd9;
    --gold: #e0b23c; --gold-ink: #7a5a08; --gold-pale: #faf0cf;
    --green: #6fa45a; --green-ink: #3a6a28; --green-pale: #e4f1dd;
    --teal: #4fa39a; --teal-ink: #1f6860; --teal-pale: #dcf0ed;
    --sky: #5b8fd6; --sky-ink: #2a5596; --sky-pale: #e0ebfa;
    --yt: #ff0033;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  :root[data-theme="dark"] {
    --sheet: #191714; --ink: #f3eee6; --soft: #a79f93; --tone: #24211c; --tone-2: #2e2a24; --edge: rgba(255, 255, 255, 0.08);
    --terracotta-ink: #f2a593; --terracotta-pale: #3a231d;
    --amber-ink: #f0b680; --amber-pale: #38291a;
    --gold-ink: #ecd079; --gold-pale: #352e17;
    --green-ink: #a9d596; --green-pale: #22301c;
    --teal-ink: #8fd3ca; --teal-pale: #19302d;
    --sky-ink: #a3c3f0; --sky-pale: #1c2a40;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--sheet); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { max-width: 1040px; margin: 0 auto; padding: 28px 28px 64px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: start; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 8px; }
  a { color: inherit; text-decoration: none; }
  svg { flex: none; }
  .ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* head */
  .head { display: flex; align-items: center; gap: 12px; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--terracotta-pale); display: grid; place-items: center; }
  .mark svg { width: 26px; height: 26px; }
  .who { min-width: 0; flex: 1; }
  .who .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .meta { color: var(--soft); font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; font-weight: 500; font-size: 13px; white-space: nowrap; transition: background-color 150ms var(--ease); }
  .btn.quiet { color: var(--soft); }
  .btn.quiet:hover { background: var(--tone); color: var(--ink); }
  .btn.fill { background: var(--ink); color: var(--sheet); }
  .btn.fill:hover { opacity: 0.9; }
  .btn.send { background: var(--green-pale); color: var(--green-ink); }
  .btn.send:hover { background: color-mix(in srgb, var(--green-pale) 80%, var(--green) 20%); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn .spin { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* notices */
  .note { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 14px; border-radius: 14px; }
  .note p { flex: 1; min-width: 0; }
  .note b { font-weight: 600; }
  .note.example { background: var(--gold-pale); color: var(--gold-ink); }
  .note.problem { background: var(--terracotta-pale); color: var(--terracotta-ink); }
  .note.reading { background: var(--sky-pale); color: var(--sky-ink); }
  .note.quiet { background: var(--tone); color: var(--soft); }

  .headline { font-size: 26px; line-height: 1.22; font-weight: 600; letter-spacing: -0.015em; margin: 26px 0 0; max-width: 30em; text-wrap: balance; }

  /* week */
  .week { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; margin-top: 24px; align-items: start; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .num { padding: 14px; border-radius: 14px; }
  .num.v { background: var(--terracotta-pale); color: var(--terracotta-ink); }
  .num.w { background: var(--sky-pale); color: var(--sky-ink); }
  .num.s { background: var(--green-pale); color: var(--green-ink); }
  .num .lab { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
  .num .big { text-align: start; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin-top: 8px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .num .chg { font-size: 12.5px; margin-top: 4px; font-weight: 500; }
  .versus { color: var(--soft); font-size: 12.5px; margin-top: 8px; }
  .chart .bars { display: flex; align-items: flex-end; gap: 3px; height: 92px; }
  .chart .bar { flex: 1 1 0; min-width: 0; border-radius: 4px 4px 2px 2px; background: var(--tone-2); transform-origin: bottom; }
  .intro .chart .bar { animation: grow 500ms var(--ease) backwards; }
  .chart .bar.now { background: var(--terracotta); }
  @keyframes grow { from { transform: scaleY(0.05); opacity: 0; } }
  .chart .axis { display: flex; justify-content: space-between; color: var(--soft); font-size: 12px; margin-top: 8px; }
  .chart .axis span:last-child { color: var(--terracotta-ink); font-weight: 500; }

  /* sections */
  h2 { font-size: 16px; font-weight: 600; margin: 40px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2 .count { font-size: 12.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--amber-pale); color: var(--amber-ink); }
  .empty { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: var(--tone); color: var(--soft); }
  .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .k-question { background: var(--sky-pale); color: var(--sky-ink); }
  .k-problem { background: var(--terracotta-pale); color: var(--terracotta-ink); }
  .k-business { background: var(--gold-pale); color: var(--gold-ink); }
  .k-praise { background: var(--green-pale); color: var(--green-ink); }

  /* waiting */
  .cmt { display: flex; gap: 12px; padding: 14px 0; }
  .intro .cmt { animation: rise 350ms var(--ease) backwards; }
  .cmt + .cmt { border-top: 1px solid var(--edge); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .cmt .body { flex: 1; min-width: 0; }
  .cmt .top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--soft); }
  .cmt .top b { color: var(--ink); font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px 1px 6px; border-radius: 99px; }
  .tag .ic { width: 12px; height: 12px; }
  .cmt .text { margin-top: 4px; font-size: 14.5px; overflow-wrap: anywhere; }
  .reply { margin-top: 10px; padding: 12px 14px; border-radius: 4px 14px 14px 14px; background: var(--tone); }
  [dir="rtl"] .reply { border-radius: 14px 4px 14px 14px; }
  .reply .lab { font-size: 12px; color: var(--soft); font-weight: 500; }
  .reply .words { margin-top: 2px; overflow-wrap: anywhere; }
  .reply .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .more { margin-top: 4px; }

  /* videos */
  .vid { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
  .thumb { width: 112px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; display: grid; place-items: center; flex: none; position: relative; }
  .thumb .ic { width: 22px; height: 22px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .vid .info { flex: 1; min-width: 0; }
  .vid .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vid .title a:hover { text-decoration: underline; }
  .vid .sub { color: var(--soft); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; }
  .vid .sub span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .vid .sub .ic { width: 13px; height: 13px; }
  .usual { width: 190px; flex: none; }
  .usual .say { font-size: 13px; font-weight: 600; }
  .usual .say.up { color: var(--green-ink); }
  .usual .say.down { color: var(--terracotta-ink); }
  .usual .say.same { color: var(--soft); font-weight: 500; }
  .meter { position: relative; height: 8px; border-radius: 99px; background: var(--tone-2); margin-top: 6px; }
  .meter i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 99px; background: var(--soft); transform-origin: left; }
  .intro .meter i { animation: fill 600ms var(--ease) backwards; }
  [dir="rtl"] .meter i { transform-origin: right; }
  .meter i.up { background: var(--green); }
  .meter i.down { background: var(--terracotta); }
  @keyframes fill { from { transform: scaleX(0); } }
  .meter u { position: absolute; inset-block: -3px; inset-inline-start: 40%; width: 2px; border-radius: 2px; background: var(--ink); opacity: 0.55; }

  /* two columns */
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; margin-inline: -10px; border-radius: 12px; width: calc(100% + 20px); transition: background-color 150ms var(--ease); }
  button.row:hover { background: var(--tone); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; }
  .row .t span { color: var(--soft); font-size: 13px; }
  .row .go { color: var(--soft); transition: transform 150ms var(--ease); }
  button.row:hover .go { transform: translateX(2px); color: var(--ink); }
  [dir="rtl"] .row .go { transform: scaleX(-1); }
  [dir="rtl"] button.row:hover .go { transform: scaleX(-1) translateX(2px); }
  .times { font-size: 12.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--sky-pale); color: var(--sky-ink); white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 7px 12px; border-radius: 99px; background: var(--tone); font-size: 13px; transition: background-color 150ms var(--ease); }
  .chip:hover { background: var(--tone-2); }

  /* skeleton */
  .sk { border-radius: 12px; background: var(--tone); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }

  @media (max-width: 760px) {
    body { padding: 18px 16px 48px; }
    .headline { font-size: 21px; }
    .week, .cols { grid-template-columns: minmax(0, 1fr); }
    .week { gap: 20px; }
    .num { padding: 12px 10px; }
    .num .big { font-size: 22px; }
    .vid { flex-wrap: wrap; }
    .thumb { width: 88px; }
    .usual { width: 100%; padding-inline-start: 102px; margin-top: -4px; }
    .btn { height: 36px; }
    .head .btn span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  var $ = function (id) { return document.getElementById(id); };
  function t(key, vars) {
    var s = (S[st.locale] || S.en)[key] || S.en[key] || key;
    if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function n(x) { return new Intl.NumberFormat(st.locale).format(Math.round(Number(x) || 0)); }
  function compact(x) { return new Intl.NumberFormat(st.locale, { notation: "compact", maximumFractionDigits: 1 }).format(Number(x) || 0); }
  function day(iso, withWeekday) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return new Intl.DateTimeFormat(st.locale, withWeekday ? { weekday: "short", day: "numeric", month: "short" } : { day: "numeric", month: "short" }).format(d);
  }
  function ago(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var mins = Math.round((d.getTime() - Date.now()) / 60000);
    var rtf = new Intl.RelativeTimeFormat(st.locale, { numeric: "auto" });
    if (Math.abs(mins) < 60) return rtf.format(mins, "minute");
    if (Math.abs(mins) < 60 * 24) return rtf.format(Math.round(mins / 60), "hour");
    if (Math.abs(mins) < 60 * 24 * 30) return rtf.format(Math.round(mins / 1440), "day");
    return day(iso);
  }
  function length(sec) {
    sec = Math.round(Number(sec) || 0);
    if (!sec) return "";
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function list(x) { return Array.isArray(x) ? x : []; }
  function canAct() { return v2 && st.role !== "viewer"; }
  function connected() { return !!(st.conn && st.conn.state === "connected"); }

  // ---- paint ----
  function change(now, before) {
    now = Number(now) || 0; before = Number(before) || 0;
    if (!before) return t("firstWeek");
    var p = Math.round(((now - before) / Math.abs(before)) * 100);
    if (p === 0) return t("flat");
    return t(p > 0 ? "up" : "down", { p: Math.abs(p) + "%" });
  }

  function paintHead() {
    var d = st.data, ch = (d && d.channel) || {};
    document.documentElement.lang = st.locale;
    document.documentElement.dir = st.locale === "he" || st.locale === "ar" ? "rtl" : "ltr";
    document.documentElement.setAttribute("data-theme", st.theme === "dark" ? "dark" : "light");
    document.title = t("title");
    $("name").textContent = ch.name || t("title");
    var bits = [];
    if (ch.handle) bits.push('<span dir="ltr">' + esc(ch.handle) + "</span>");
    if (ch.subscribers != null) bits.push(esc(t("subs", { n: compact(ch.subscribers) })));
    if (d && d.generatedAt && !st.example) bits.push(esc(t("readAt", { when: ago(d.generatedAt) })));
    $("meta").innerHTML = bits.join(" · ");
    var again = $("again");
    again.hidden = !(canAct() && connected());
    again.disabled = st.running;
    again.firstElementChild.classList.toggle("spin", st.running);
    $("againLabel").textContent = st.running ? t("reading") : t("again");
  }

  function paintNotice() {
    var html = "";
    var failed = st.status && st.status.ok === false;
    if (st.running) {
      html = '<div class="note reading" role="status"><p>' + t("readingNote") + "</p></div>";
    } else if (failed && connected()) {
      html = '<div class="note problem" role="alert"><p><b>' + esc(t("failed")) + "</b> " + esc(st.status.why || "") + "</p>" +
        (canAct() ? '<button class="btn fill" data-act="read">' + esc(t("tryAgain")) + "</button>" : "") + "</div>";
    } else if (st.conn && st.conn.problem && !connected()) {
      html = '<div class="note problem" role="alert"><p>' + esc(st.conn.problem.text) + "</p>" +
        (st.conn.canConnect ? '<button class="btn fill" data-act="connect">' + esc(t("connect")) + "</button>" : "") + "</div>";
    } else if (st.example) {
      var can = st.conn && st.conn.canConnect;
      html = '<div class="note example"><p>' + t(can ? "exampleNote" : "exampleNoConnect") + "</p>" +
        (can ? '<button class="btn fill" data-act="connect">' + esc(t("connect")) + "</button>" : "") + "</div>";
    }
    $("notice").innerHTML = html;
  }

  function weekHtml(w) {
    var days = list(w.days).slice(-28);
    var max = Math.max.apply(null, days.map(function (d) { return Number(d.views) || 0; }).concat([1]));
    var bars = days.map(function (d, i) {
      var h = Math.max(4, Math.round(((Number(d.views) || 0) / max) * 100));
      var now = i >= days.length - 7;
      return '<div class="bar' + (now ? " now" : "") + '" style="height:' + h + "%;animation-delay:" + i * 14 + 'ms" title="' + esc(day(d.date)) + ": " + esc(n(d.views)) + '"></div>';
    }).join("");
    function num(cls, icon, label, big, now, before) {
      return '<div class="num ' + cls + '"><div class="lab">' + ic(icon) + esc(label) + '</div><div class="big" dir="ltr">' + esc(big) + '</div><div class="chg">' + esc(change(now, before)) + "</div></div>";
    }
    var subs = Number(w.subscribers) || 0;
    return '<section class="week"><div><div class="nums">' +
      num("v", "eye", t("views"), compact(w.views), w.views, w.viewsBefore) +
      num("w", "clock", t("watch"), t("hours", { n: compact(w.watchHours) }), w.watchHours, w.watchHoursBefore) +
      num("s", "users", t("newSubs"), (subs > 0 ? "+" : "") + n(subs), w.subscribers, w.subscribersBefore) +
      '</div><p class="versus">' + esc(t("versus")) + "</p></div>" +
      (days.length ? '<div class="chart"><div class="bars" role="img" aria-label="' + esc(t("views")) + '">' + bars + '</div><div class="axis"><span>' + esc(t("ago4")) + "</span><span>" + esc(t("through", { day: day(w.through || days[days.length - 1].date, true) })) + "</span></div></div>" : "") +
      "</section>";
  }

  function waitingHtml(d) {
    var items = list(d.waiting);
    var head = "<h2>" + esc(t("waiting")) + (items.length ? ' <span class="count">' + n(items.length) + "</span>" : "") + "</h2>";
    if (d.repliesOff) {
      return head + '<div class="note quiet" style="margin-top:0"><p>' + esc(t("repliesOff")) + "</p>" +
        (st.conn && st.conn.canConnect ? '<button class="btn fill" data-act="connect">' + esc(t("connectAgain")) + "</button>" : "") + "</div>";
    }
    if (!items.length) return head + '<div class="empty"><span class="tile k-praise">' + ic("check") + "</span>" + esc(t("waitingNone")) + "</div>";
    var shown = st.expanded ? items : items.slice(0, FIRST_SHOWN);
    var rows = shown.map(function (m, i) {
      var kind = ICON[m.kind] ? m.kind : "question";
      var initial = (String(m.author || "?").trim().charAt(0) || "?").toUpperCase();
      var acts = "";
      if (m.reply && (canAct() || st.example)) {
        acts = '<div class="acts"><button class="btn send" data-act="send" data-i="' + i + '">' + ic("send") + esc(t("send")) + "</button>" +
          '<button class="btn quiet" data-act="change" data-i="' + i + '">' + ic("pen") + esc(t("change")) + "</button></div>";
      }
      return '<article class="cmt" style="animation-delay:' + i * 40 + 'ms"><span class="tile k-' + kind + '" aria-hidden="true">' + esc(initial) + "</span>" +
        '<div class="body"><div class="top"><b dir="auto">' + esc(m.author) + '</b><span class="tag k-' + kind + '">' + ic(kind) + esc(t(kind)) + "</span>" +
        "<span>" + esc(t("on")) + ' <span dir="auto">' + esc(m.videoTitle) + "</span></span><span>" + esc(ago(m.at)) + "</span></div>" +
        '<p class="text" dir="auto">' + esc(m.text) + "</p>" +
        (m.reply ? '<div class="reply"><div class="lab">' + esc(t("yourReply")) + '</div><p class="words" dir="auto">' + esc(m.reply) + "</p>" + acts + "</div>" : "") +
        "</div></article>";
    }).join("");
    var more = items.length - shown.length;
    return head + rows + (more > 0 ? '<button class="btn quiet more" data-act="more">' + esc(t("showMore", { n: n(more) })) + "</button>" : "");
  }

  function videosHtml(d) {
    var items = list(d.videos).slice(0, 6);
    var head = "<h2>" + esc(t("videos")) + "</h2>";
    if (!items.length) return head + '<div class="empty"><span class="tile k-question">' + ic("film") + "</span>" + esc(t("videosNone")) + "</div>";
    var hues = ["k-problem", "k-question", "k-business", "k-praise"];
    return head + items.map(function (v, i) {
      var real = /^[A-Za-z0-9_-]{11}$/.test(String(v.id || ""));
      var thumb = real ? '<img alt="" loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/mqdefault.jpg" onerror="this.remove()">' : "";
      var title = v.url ? '<a href="' + esc(v.url) + '" target="_blank" rel="noopener" dir="auto">' + esc(v.title) + "</a>" : '<span dir="auto">' + esc(v.title) + "</span>";
      var x = Number(v.vsUsual), usual = "";
      if (x > 0) {
        var cls = x >= 1.25 ? "up" : x <= 0.75 ? "down" : "same";
        var say = cls === "same" ? t("usualSame") : t(cls === "up" ? "usualUp" : "usualDown", { x: new Intl.NumberFormat(st.locale, { maximumFractionDigits: 1 }).format(x) });
        var width = Math.max(6, Math.min(100, x * 40));
        usual = '<div class="usual"><div class="say ' + cls + '">' + esc(say) + '</div><div class="meter"><i class="' + cls + '" style="width:' + width + '%"></i><u title="' + esc(t("usualMark")) + '"></u></div></div>';
      }
      var len = length(v.seconds);
      return '<div class="vid"><div class="thumb ' + hues[i % hues.length] + '">' + ic("film") + thumb + '</div><div class="info"><div class="title">' + title + '</div><div class="sub">' +
        "<span>" + esc(day(v.publishedAt)) + (len ? " · " + esc(len) : "") + "</span>" +
        "<span>" + ic("eye") + esc(compact(v.views)) + "</span><span>" + ic("like") + esc(compact(v.likes)) + "</span><span>" + ic("msg") + esc(compact(v.comments)) + "</span></div></div>" + usual + "</div>";
    }).join("");
  }

  function colsHtml(d) {
    var asking = list(d.asking).slice(0, 5), ideas = list(d.ideas).slice(0, 3);
    var a = "<div><h2>" + esc(t("asking")) + "</h2>" + (asking.length ? asking.map(function (q, i) {
      return '<button class="row" data-act="pin" data-i="' + i + '"><span class="t"><b dir="auto">' + esc(q.question) + '</b></span><span class="times">' + esc(t("times", { n: n(q.count) })) + '</span><span class="go">' + ic("go") + "</span></button>";
    }).join("") : '<p style="color:var(--soft)">' + esc(t("askingNone")) + "</p>") + "</div>";
    var b = "<div><h2>" + esc(t("ideas")) + "</h2>" + (ideas.length ? ideas.map(function (x, i) {
      return '<button class="row" data-act="idea" data-i="' + i + '"><span class="tile k-business" aria-hidden="true">' + ic("bulb") + '</span><span class="t"><b dir="auto">' + esc(x.title) + '</b><span dir="auto">' + esc(x.why) + '</span></span><span class="go">' + ic("go") + "</span></button>";
    }).join("") : '<p style="color:var(--soft)">' + esc(t("ideasNone")) + "</p>") + "</div>";
    return '<section class="cols">' + a + b + "</section>";
  }

  function askHtml() {
    return "<h2>" + esc(t("ask")) + '</h2><div class="chips">' + ["p1", "p2", "p3", "p4"].map(function (k) {
      return '<button class="chip" data-act="prompt" data-k="' + k + '">' + esc(t(k)) + "</button>";
    }).join("") + "</div>";
  }

  function skeleton() {
    return '<div class="sk" style="height:64px;margin-top:26px;max-width:560px"></div><div class="week"><div class="nums"><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div></div><div class="sk" style="height:112px"></div></div>' +
      '<div class="sk" style="height:20px;width:200px;margin:40px 0 12px"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:120px;margin-top:10px"></div>';
  }

  function paint() {
    paintHead();
    paintNotice();
    var d = st.data;
    if (!st.loaded || !d) { $("main").innerHTML = skeleton(); return; }
    // While the first read runs there is nothing of theirs yet: show the shape, not the example.
    if (st.running && st.example && connected()) { $("main").innerHTML = skeleton(); return; }
    var main = $("main");
    main.className = st.intro ? "" : "intro";
    if (!st.intro) { st.intro = true; setTimeout(function () { main.className = ""; }, 1400); }
    main.innerHTML =
      (d.headline ? '<p class="headline" dir="auto">' + esc(d.headline) + "</p>" : "") +
      (d.week ? weekHtml(d.week) : "") +
      "<section>" + waitingHtml(d) + "</section>" +
      "<section>" + videosHtml(d) + "</section>" +
      colsHtml(d) +
      (canAct() || !v2 ? "<section>" + askHtml() + "</section>" : "");
  }

  // ---- acts ----
  function say(e) { st.status = { ok: false, why: (e && e.message) || "" }; paint(); }
  function ask(text, send) {
    if (!v2) return;
    c.ask(text, send === false ? { send: false } : undefined).catch(say);
  }
  function read() {
    if (!canAct() || st.running) return;
    st.running = true; st.status = null; paint();
    c.jobs.run(JOB).catch(function (e) {
      if (e && e.code === "busy") return;
      st.running = false; say(e);
    });
  }
  function connect() {
    if (!v2) return;
    c.connectors.connect("youtube").then(function (r) { if (r === "connected") refresh(); }).catch(say);
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), i = Number(el.getAttribute("data-i")), d = st.data || {};
    if (act === "connect") return connect();
    if (act === "read") return read();
    if (act === "more") { st.expanded = true; return paint(); }
    if (act === "prompt") return ask(t(el.getAttribute("data-k")));
    if (act === "pin") { var q = list(d.asking)[i]; return q && ask(t("askPin") + q.question); }
    if (act === "idea") { var x = list(d.ideas)[i]; return x && ask(t("askIdea") + x.title + ". " + (x.why || "")); }
    if (act === "send" || act === "change") {
      if (st.example) return connect();
      var m = list(d.waiting)[i];
      if (!m) return;
      var facts = "\n\nComment id: " + m.id + "\nVideo id: " + m.videoId + " (" + m.videoTitle + ")\nComment by " + m.author + ": " + m.text + "\nReply: " + m.reply;
      if (act === "send") ask(t("askSend") + facts);
      else ask(t("askChange") + facts, false);
    }
  });
  $("again").addEventListener("click", read);

  // ---- data ----
  function readJson(path) {
    return c.files.read(st.appPath + "/" + path).then(function (text) { return JSON.parse(text); });
  }
  function load() {
    return readJson("data/latest.json").then(function (d) { st.data = d; st.example = false; }, function () {
      return readJson("data/EXAMPLE-latest.json").then(function (d) { st.data = d; st.example = true; }, function () { st.data = { waiting: [], videos: [] }; st.example = true; });
    }).then(function () {
      return readJson("data/status.json").then(function (s) { st.status = s; }, function () { st.status = null; });
    }).then(function () { st.loaded = true; paint(); maybeRead(); });
  }
  function maybeRead() {
    if (st.tried || !canAct() || !connected() || st.running) return;
    var at = st.data && !st.example ? new Date(st.data.generatedAt).getTime() : 0;
    if (at && Date.now() - at < STALE_MS) return;
    st.tried = true;
    read();
  }
  function setConn(listing) { st.conn = list(listing).filter(function (x) { return x.id === "youtube"; })[0] || null; }
  function setJobs(jobs) {
    var job = list(jobs).filter(function (j) { return j.id === JOB; })[0];
    var was = st.running;
    st.running = !!(job && job.running);
    if (was && !st.running) load(); else paint();
  }
  function refresh() {
    return Promise.all([
      c.connectors.list().then(setConn, function () {}),
      c.jobs.list().then(setJobs, function () {})
    ]).then(load);
  }

  paint();
  if (v2) {
    Promise.resolve(c.ready).then(function () { return c.here(); }).then(function (h) {
      st.locale = S[String(h.locale || "en").slice(0, 2)] ? String(h.locale).slice(0, 2) : "en";
      st.theme = h.theme || "light";
      st.role = h.role || "owner";
      st.appPath = h.appPath || "channel";
    }, function () {}).then(refresh).then(function () {
      c.connectors.onChange(function (l) { setConn(l); paint(); maybeRead(); });
      c.jobs.onChange(setJobs);
      c.files.onChange(st.appPath + "/data", load);
    });
  } else {
    // Opened outside Cabinet, or in an older Cabinet: show the example.
    fetch("data/EXAMPLE-latest.json").then(function (r) { return r.json(); }).then(function (d) { st.data = d; }, function () { st.data = { waiting: [], videos: [] }; }).then(function () { st.example = true; st.loaded = true; paint(); });
  }
})();
</script>
</body>
</html>
