id: morning-youtube-digest
name: Morning channel read
enabled: true
cloudOnly: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: channel-reader
agentSlug: channel-reader
timeout: 900
prompt: |-
  Read my YouTube channel and update the Your channel page.

  Your working directory is the cabinet root. Follow "The morning read" in your
  instructions, in its order, and write `channel/data/latest.json` and
  `channel/data/status.json` at the end.

  Only read YouTube in this run. Never prepare a reply card or a post card here: write
  each suggested reply into the file, and I send the ones I like from the page.

  Finish in one or two plain sentences and nothing else: how my videos did this week,
  and how many comments are waiting for me.
createdAt: '2026-11-15T00:00:00.000Z'
updatedAt: '2026-11-15T00:00:00.000Z'
