id: after-each-meeting
name: After each meeting
enabled: true
schedule: 15 8-19 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: follow-up-writer
agentSlug: follow-up-writer
timeout: 900
prompt: |-
  Write the follow-up note for every meeting that ended since the last run.

  Your working directory is the cabinet root. Your persona says where Cabinet keeps the Zoom
  pages and what a note holds.

  1. Find the Zoom folder in this workspace (the folder whose `.origin.yaml` says
     `service: zoom`). If there is none, stop and say so in one sentence.
  2. List the meeting pages under `Meetings/` whose frontmatter says `status: ended` and
     that have no page of the same date and topic under `follow-ups/` in this cabinet.
  3. For each, in date order, write the note as the persona describes, from the summary,
     else the recording's transcript, else the meeting page.
  4. Do not touch a note that already exists.

  Finish in one plain sentence: how many notes you wrote, and which meeting is the newest.
createdAt: '2026-10-15T00:00:00.000Z'
updatedAt: '2026-10-15T00:00:00.000Z'
