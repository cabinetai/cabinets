id: morning-dev-brief
name: Morning Dev Brief
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: dev-briefer
agentSlug: dev-briefer
timeout: 600
prompt: |-
  Write this morning's dev brief.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-github-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Kind` and `State` vocabularies, the ordering and the tone. This prompt
     does not repeat them.
  2. With your GitHub tools, find the user's own activity in the last 24 hours across
     every repo they touch: their commits, the pull requests they opened or updated, the
     pull requests waiting on their review, and the issues they opened or are assigned.
     Not a feed of everything that happened in a repo.
  3. Open each one only far enough to say in one short line what it does. Read file
     contents and repo metadata when a title is too thin to be useful, no further.
  4. This run is read only. Do not comment on an issue or a pull request, do not open,
     close, merge, review or assign anything, however obvious the one-line answer looks.
  5. If you have no GitHub tool, or GitHub is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `daily-summaries/` exactly as you found it, example and all.
     Report: "GitHub is not reachable. I would have read the last 24 hours of the user's
     own commits, pull requests and issues and written one row per item." Then exit.
  6. On the first run that does reach GitHub, write your dated file and then delete
     `daily-summaries/EXAMPLE-github-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
