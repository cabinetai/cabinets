id: monthly-audit
name: Monthly Audit
enabled: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
ownerAgent: subscription-sleuth
agentSlug: subscription-sleuth
timeout: 900
prompt: |-
  Run this month's subscription audit.

  Your working directory is the cabinet root. Every audit lives in `audits/`, one file
  per run, named `<YYYY-MM-DD>T<HH-MM-SS>-subscription-audit.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by name and opens the
  newest, so a name in any other shape is an audit nobody will see. You only ever ADD
  a file: never overwrite, rename or delete one already sitting there.

  1. Read your persona before anything else. It holds what counts as recurring, the
     frontmatter shape, the table columns, the four state words and the honesty rules.
     This prompt does not repeat them.
  2. Read every file in `statements/` and the most recent audit in `audits/`. The
     statements are read only — never edited, moved or deleted — and their contents
     never leave this cabinet.
  3. If `statements/` has no statement files, STOP HERE. Write nothing, leave
     `audits/` exactly as you found it, example and all, and report: "The statements
     folder is empty — drop a bank or card CSV in and run this again." Then exit.
  4. Write the audit: every recurring charge, the monthly total, and what changed
     since last month. On the first real audit there is no comparison — say it's the
     baseline rather than inventing changes.
  5. On the first run that reads real statements, after writing your dated file,
     delete `audits/EXAMPLE-subscription-audit.md`. It is a demo, not a month that
     happened, and it must not sit in the picker beside real ones. Never write
     `EXAMPLE` into a name of your own.

  Finish by reporting in one or two sentences: the monthly total, and the one change
  most worth the user's attention.
