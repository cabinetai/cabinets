id: morning-asana-tasks
name: Morning Asana Tasks
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: task-reader
agentSlug: task-reader
timeout: 600
prompt: |-
  Write this morning's list of the Asana tasks on the user.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-asana-summary.md`: the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds what is in scope, the frontmatter
     shape, the table columns, how a task's due date, dependencies and comments turn into
     the one status word, the ordering and the tone. This prompt does not repeat them.
  2. With your Asana tools, find the user, then their incomplete tasks, the ones assigned
     to them and the ones in their My Tasks, plus any task of theirs another person's task
     depends on. Read each one's due date, dependencies, subtasks and latest comment, far
     enough to judge it and no further.
  3. This run is read only. Do not create a task, complete one, change a due date, reassign
     anything or post a comment, however obvious the next step looks.
  4. If an Asana call fails, say what you tried and what it said, touch no file, and stop.
     Leave `daily-summaries/` exactly as you found it, example and all.
  5. On the first run that does reach Asana, write your dated file and then delete
     `daily-summaries/EXAMPLE-asana-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
