  }
  function copyLayout(value) { return value.map(copyEntry); }

  /**
   * Where the boxes land: each keeps its columns, is pushed down past any box above it that
   * it would overlap (an opened list grows), then rises into the space left above it, so a
   * hidden or shorter box never leaves a hole. A pinned box (the one being moved or resized)
   * is placed first, exactly where it was put, and the others make room around it.
   */
  function placed(source, pinId) {
    var out = [];
    function hits(b, y, h) {
      return out.some(function (o) { return b.x < o.x + o.w && o.x < b.x + b.w && y < o.y + o.h && o.y < y + h; });
    }
    var boxes = (source || state.layout || DEFAULT_LAYOUT)
      .filter(function (b) { return !BOXES[b.id].show || BOXES[b.id].show(); })
      .slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    boxes.forEach(function (b) {
      if (b.id === pinId) out.push({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h });
    });
    boxes.forEach(function (b) {
      if (b.id === pinId) return;

    return (state.example ? "example:" : "") + kind + ":" + name + "|" + text(kind === "twins" && list(item.items)[0] ? list(item.items)[0].at : item.at, 30);
  }
  /** Late rows first, then your files others changed (newest first), then open links, then rows due later. */
  function nextThings() {
    var ref = refDate();
    var out = [];
    list(state.data && state.data.rows).forEach(function (r, i) {
      var due = parseTime(r.due);
      var gap = due ? daysBetween(ref, due) : 99;
      out.push({ rank: gap <= 1 ? 0 : 3, order: due ? due.getTime() : 0, key: thingKey("row", r),
        title: text(r.title, 80) || "A row with your name", why: [text(r.list, 60), due ? (gap < 0 ? "late" : gap === 0 ? "due today" : gap === 1 ? "due tomorrow" : "due " + shortDate(due)) : ""].filter(Boolean).join(", "),
        action: { label: "Help me with it", act: "row-help", id: text(r.id, 60) || "r" + i } });
    });
    list(state.data && state.data.yours).forEach(function (f, i) {
      var at = parseTime(f.at);
      out.push({ rank: 1, order: at ? -at.getTime() : 0, key: thingKey("yours", f),
        title: "See what " + (text(f.who, 40) || "someone") + " changed", why: fileName(f),
        action: { label: "What changed?", act: "what-changed", id: text(f.id, 60) || "y" + i } });
    });
    list(state.data && state.data.open).forEach(function (f, i) {
      out.push({ rank: 2, order: 0, key: thingKey("open", f),
        title: "Check who can open " + fileName(f), why: openWho(f),
        action: { label: "How do I close it?", act: "close-link", id: text(f.id, 60) || "o" + i } });
    });
    return out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
  }

  // ── The boxes ──────────────────────────────────────────────────────────

  function drawYours(level) {
    var y = yours();
    var ref = refDate();
    if (level === "S") {
      var top = y[0];
      return sumBox("yours", "Your files, changed", "i-file", String(y.length),
        y.length ? plural(y.length, "file", "files") + " someone else saved" : "Nobody touched your files",
        top ? "<b>" + esc(text(top.who, 60)) + ":</b> " + esc(fileName(top)) : "");
    }
    return listBox("yours", "Your files, changed by others", "i-file", "", y.length,
      '<ol class="rows">' + y.map(function (item, i) { return yoursRow(item, i, ref); }).join("") + "</ol>",
      "Nobody else saved a file of yours since the last reading.") + nudgeHtml(boxIdea("yours"));
  }

  function drawRows(level) {
    var r = rows();
    var ref = refDate();
    var late = r.filter(function (x) { var d = parseTime(x.due); return d && daysBetween(ref, d) < 0; }).length;
    if (level === "S") {
      return sumBox("rows", "Rows with your name", "i-list", String(r.length),
        late ? '<span class="hot">' + late + " late</span>" : r.length ? plural(r.length, "row", "rows") + " still open" : "Nothing open",
        r[0] ? esc(text(r[0].title, 100)) : "");
    }
    var refused = state.data && Array.isArray(state.data.refused) && state.data.refused.indexOf("lists") >= 0;
    return listBox("rows", "Rows with your name", "i-list", "", r.length,
      '<ol class="rows">' + r.map(function (item, i) { return rowRow(item, i, ref); }).join("") + "</ol>",
      refused ? "Your company’s SharePoint did not let Cabinet read its lists." : "No open row in your lists names you.") + nudgeHtml(boxIdea("rows"));
  }

  function drawOpen(level) {
    var o = openFiles();
    var ref = refDate();
    if (level === "S") {
      var anyone = o.filter(function (x) { return x.anyone === true; }).length;
      return sumBox("open", "Open to anyone", "i-link", String(o.length),
        anyone ? '<span class="hot">' + anyone + " with a link anyone can use</span>" : o.length ? plural(o.length, "file", "files") + " a guest can open" : "Only your company",
        o[0] ? esc(fileName(o[0])) : "");
    }
    var refused = state.data && Array.isArray(state.data.refused) && state.data.refused.indexOf("sharing") >= 0;
    return listBox("open", "Open to anyone", "i-link", "", o.length,
      '<ol class="rows">' + o.map(function (item, i) { return openRow(item, i, ref); }).join("") + "</ol>",
      refused ? "Your company’s SharePoint did not let Cabinet see who can open your files." : "Your files that moved are open only to your company.") + nudgeHtml(boxIdea("open"));
  }

  function drawTwins(level) {
    var t = twins();
    var ref = refDate();
    if (level === "S") {
      return sumBox("twins", "Which one is real", "i-copies", String(t.length), t.length ? plural(t.length, "set", "sets") + " of look-alike files" : "No look-alikes",
        t[0] && list(t[0].items)[0] ? esc(text(list(t[0].items)[0].name, 100)) : "");
    }
    return listBox("twins", "Which one is real", "i-copies", "", t.length,
      '<ul class="rows">' + t.map(function (x) {
        var id = text(x.id, 60);
        var items = list(x.items).filter(function (i) { return text(i.name); });
        var newest = items[0] || {};
        return '<li class="twin"><span class="where-line" dir="auto">' + esc([text(x.site, 80), text(x.folder, 140)].filter(Boolean).join(" › ")) + "</span>" +
          "<ol>" + items.map(function (i, k) {
            return "<li" + (k === 0 ? ' class="newest"' : "") + '><span dir="auto">' + fileIcon(extOfName(i.name)) + esc(text(i.name, 120)) + (k === 0 ? '<span class="tag">Newest</span>' : "") + "</span>" +
              "<small>" + esc([text(i.by, 40), rowTime(i.at, ref)].filter(Boolean).join(" · ")) + "</small></li>";
          }).join("") + "</ol>" +
          (num(x.count) > items.length ? '<span class="g">and ' + (num(x.count) - items.length) + " more like them</span>" : "") +
          (text(x.gist) ? '<span class="g" dir="auto">' + esc(text(x.gist, 160)) + "</span>" : "") +
          '<span class="acts">' + (canAsk() ? '<button class="btn quiet small" data-act="which-real" data-id="' + esc(id) + '">' + icon("i-chat") + "Which one is real?</button>" : "") +
          (spLink(newest) ? '<a class="btn quiet small" href="' + esc(spLink(newest)) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open the newest</a>" : "") +
          '<button class="btn quiet small" data-act="item-done" data-kind="twins" data-id="' + esc(id) + '">' + icon("i-check") + "Seen</button></span></li>";
      }).join("") + "</ul>",
      "No look-alike files moved since the last reading.") + nudgeHtml(boxIdea("twins"));
  }

  var NEEDS_WORDS = { you: "Has your files", fyi: "Worth a look", none: "Nothing for you" };
  function drawSites(level) {
    var c = sites();
    if (level === "S") {
      var you = c.filter(function (x) { return x.needs === "you"; }).length;
      return sumBox("sites", "Your sites", "i-site", String(c.length), c.length ? plural(c.length, "site", "sites") + " moved" : "All quiet",
        you ? '<span class="hot">' + you + " with your files</span>" : "");
    }
    return listBox("sites", "Your sites", "i-site", "", c.length,
      '<ul class="rows">' + c.map(function (x) {
        var name = text(x.name, 80) || "A site";
        var needs = NEEDS_WORDS[x.needs] ? x.needs : "none";
        var names = Array.isArray(x.names) ? x.names.map(function (n) { return text(n, 60); }).filter(Boolean) : [];
        var people = num(x.people);
        var who = names.length ? "by " + names.join(", ") + (people > names.length ? " and " + (people - names.length) + " more" : "") : "";
        var g = text(x.gist, 160) || [text(x.top, 100) ? "Most in " + text(x.top, 100) : "", who].filter(Boolean).join(", ");
        return '<li class="ch ' + needs + '"><b dir="auto">' + esc(name) + "</b>" +
          '<span class="n num">' + num(x.count).toLocaleString() + "</span>" +
          '<span class="g" dir="auto">' + esc(g) + "</span>" + '<span class="w">' + esc(NEEDS_WORDS[needs]) + "</span>" +
          (needs === "none" ? "" : '<span class="acts">' + (canAsk() ? '<button class="btn quiet small" data-act="site-ask" data-name="' + esc(name) + '">' + icon("i-chat") + "What moved here?</button>" : "") +
          (spLink(x) ? '<a class="btn quiet small" href="' + esc(spLink(x)) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open the site</a>" : "") + "</span>") + "</li>";
      }).join("") + "</ul>",
      "No site moved since the last reading.") + nudgeHtml(boxIdea("sites"));
  }

  function drawNews(level) {
    var d = news();
    var ref = refDate();
    if (level === "S") {
      return sumBox("news", "News", "i-news", String(d.length), d.length ? plural(d.length, "post", "posts") + " on your sites" : "No news",
        d[0] ? esc(text(d[0].title, 100)) : "");
    }
    var refused = state.data && Array.isArray(state.data.refused) && state.data.refused.indexOf("news") >= 0;
    return listBox("news", "News on your sites", "i-news", "", d.length,
      '<ul class="rows decided">' + d.map(function (x) {
        var link = spLink(x);
        return '<li><span class="d" dir="auto">' + esc(text(x.title, 140)) + "</span>" +
          (text(x.gist) ? '<span class="s" dir="auto">' + esc(text(x.gist, 160)) + "</span>" : "") +
          '<span class="s"><span dir="auto">' + esc([text(x.site, 80), text(x.by, 60), rowTime(x.at, ref)].filter(Boolean).join(" · ")) + "</span>" +
          (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Read it</a>' : "") + "</span></li>";
      }).join("") + "</ul>",
      refused ? "Your company’s SharePoint did not let Cabinet read site news." : "No news was posted on your sites since the last reading.") + nudgeHtml(boxIdea("news"));
  }

  /** The numbers to glance at, each a card. */
  function kpiCards() {
    var y = yours().length;
    var r = rows().length;
    var o = openFiles().length;
    var ref = refDate();
    var late = rows().filter(function (x) { var d = parseTime(x.due); return d && daysBetween(ref, d) < 0; }).length;
    return {
      yours: '<a class="kpi' + (y ? "" : " calm") + '" href="#lane-yours"><span class="label">' + icon(y ? "i-file" : "i-check") + "Your files, changed</span>" +
        (y ? '<span class="value num">' + y + '</span><span class="sub">saved by someone else</span>' : '<span class="value num">0</span><span class="sub">Nobody touched them</span>') + "</a>",
      rows: '<a class="kpi' + (late ? " first" : "") + '" href="#lane-rows"><span class="label">' + icon("i-list") + "Rows with your name</span>" +
        (r ? '<span class="value num">' + r + '</span><span class="sub">' + (late ? late + " late" : "still open") + "</span>" : '<span class="value none">None</span><span class="sub">Nothing open</span>') + "</a>",
      open: '<a class="kpi' + (o ? " first" : " calm") + '" href="#lane-open"><span class="label">' + icon("i-link") + "Open to anyone</span>" +
        '<span class="value num">' + o + '</span><span class="sub">' + (o ? plural(o, "file", "files") + " to check" : "Only your company") + "</span></a>"
    };
  }

  /** What the person told the cabinet about their work, from setup.md. */
  function drawSetup(level) {
    var items = state.setup || [];
    var set = items.filter(function (a) { return !a.unset; }).length;
    var btn = canAsk() && askReady()
      ? '<button class="btn small" data-act="ask" data-q="' + esc(set ? "I want to change what you know about my work in SharePoint." : "I want to tell you about my work so you can read my SharePoint better.") + '">' +
        icon("i-pen") + (set ? "Change this" : "Tell it now") + "</button>"
      : "";
    if (level === "S") {
      return sumBox("setup", "What it knows", "i-sliders", set + " of " + items.length, "answers given", "") + (btn ? '<div class="box-pad">' + btn + "</div>" : "");
    }
    if (!set) {
      return boxHead("setup", "Tell your librarian about your work", "i-sliders", "", null) +
        '<div class="box-pad"><p>Which sites matter most, which to skip, and the files you care about. Two minutes here makes every morning sharper.</p>' + btn + "</div>";
    }
    return boxHead("setup", "What your librarian knows", "i-sliders", "", null) +
      '<div class="box-pad"><dl class="facts">' + items.slice(0, 4).map(function (a) {
        return "<div><dt>" + esc(a.label) + "</dt><dd" + (a.unset ? ' class="unset"' : "") + ' dir="auto">' + esc(a.unset ? "Not set yet" : text(a.value, 240)) + "</dd></div>";
      }).join("") + "</dl>" + btn + "</div>";
  }

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shown = shownIdeas();
    if (featured) shown[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shown[idea.id] && !state.hiddenIdeas[idea.id]; }).slice(0, level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask, or try an idea</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Where is the newest price list? Who changed the budget?" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +
      (level !== "S" && note ? '<p class="note" id="ask-note">' + esc(note) + "</p>" : "");
  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */
  function drawLayoutAsk(level) {
    var note = state.askNote || "The agent suggests the boxes. Nothing changes until you press Apply.";
    return (level === "S" ? "" : '<h2 id="ask-title">Ask the agent about your boxes</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: hide the news, show my next 3 things" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about SharePoint</button></p>';
  }
  function askHint() {
    if (askReady()) return "The answer comes up in the chat next to this page.";
    return connState() === "not-available-here"
      ? "Once SharePoint works here, you can ask things like these."
      : "Connect SharePoint first, then ask anything. A question here takes you to connecting.";
  }

  // ── Ideas, where and when they help ────────────────────────────────────
  // An idea offers itself in its box when today's files say it would help, with the real
  // numbers, at most one per box. "Hide" takes it off the page for good (kept per person in
  // cabinet.mine); the Ideas panel always has every one.

  var HIDDEN_IDEAS_KEY = "sharepoint-my-files-hidden-ideas@1";

  /** What today's SharePoint says, counted once for every idea. */
  function ideaFacts() {
    var ref = refDate();
    return {
      ref: ref,
      yours: yours().length,
      rows: rows().length,
      late: rows().filter(function (x) { var d = parseTime(x.due); return d && daysBetween(ref, d) < 0; }).length,
      open: openFiles().length,
      twins: twins().length,
      news: news().length,
      sites: sites().length
    };
  }

  /** For each idea: the line and the press that fit today, or null when it would not help now. */
  var IDEA_FITS = {
    changed: function (f) {
      var n = f.yours;
      return n ? { line: "Someone saved " + n + " of your " + plural(n, "file", "files") + ". See what changed?", act: n === 1 ? "Show me" : "Show me each one" } : null;
    },
    rows: function (f) {
      if (f.late) return { line: f.late + " " + plural(f.late, "row with your name is", "rows with your name are") + " late. Get them all in one list?", act: "Make the list" };
      return f.ref.getDay() === 1 && f.rows ? { line: "It’s Monday. Everything with your name on it, by due date?", act: "Make the list" } : null;
    },
    lock: function (f) {
      var n = f.open;
      return n ? { line: n + " of your " + plural(n, "file is", "files are") + " open beyond your company. Check them all?", act: "Check them" } : null;
    },
    real: function (f) {
      var n = f.twins;
      return n ? { line: n + " " + plural(n, "set", "sets") + " of look-alike files moved. Find the real ones?", act: "Find them" } : null;
    },
    handover: function (f) {
      var day = f.ref.getDay();
      return day === 5 ? { line: "It’s Friday. Going away soon? A list of your files makes a handover easy.", act: "List my files" } : null;
    },
    week: function (f) {
      var day = f.ref.getDay();
      return (day === 4 || day === 5) && (f.news || f.sites) ? { line: "It’s " + f.ref.toLocaleDateString([], { weekday: "long" }) + ". Your sites’ week in five lines?", act: "Tell me" } : null;
    },
    stale: function () { return null; }
  };

  function actionButton(a) {
    return '<button type="button" class="btn small" data-act="' + a.act + '"' + (a.id ? ' data-id="' + esc(a.id) + '"' : "") +
      (typeof a.i === "number" ? ' data-i="' + a.i + '"' : "") +
      (a.q ? ' data-q="' + esc(a.q) + '"' : "") + (canAsk() ? "" : " disabled data-viewer-off") + ">" + esc(a.label) + "</button>";
  }

  function drawNext(level) {
    var all = nextThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    var top = open.slice(0, 3);
    if (level === "S") {
      return sumBox("next", "Do next", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "Nothing needs you",
        top[0] ? "<b>" + esc(top[0].title) + "</b>" : "");
    }
    var body = top.length
      ? '<ol class="rows things">' + top.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            actionButton(t.action) + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else needs you today." : "Nothing needs you today.") + "</p>";
    var rest = open.length - top.length;
    var foot = (rest > 0 ? "<span>" + rest + " more " + plural(rest, "thing", "things") + " in the other boxes</span>" : "<span></span>") +
      (done ? '<button type="button" class="btn quiet small" data-act="undone">' + done + " done · Bring back</button>" : "");
    return boxHead("next", top.length === 3 ? "Your next 3 things" : "Your next things", "i-check", "", null) +
      '<div class="box-body">' + body + "</div>" +
      (rest > 0 || done ? '<div class="next-foot">' + foot + "</div>" : "") +
      '<button type="button" class="box-more" data-act="more-rows" hidden></button>';
  }

  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.next;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    nextThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shown = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shown.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }
    var facts = ideaFacts();
    var can = canAsk();
    return listBox("ideas", "Ideas", "i-bulb", "", shown.length,
      '<ul class="rows idea-rows">' + shown.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }

  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  function ideaById(id) {
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].id === id) return IDEAS[i];
    return null;
  }
  /** The idea with what fits today, or null when it is hidden or would not help now. */
  function fitted(idea, facts) {
    if (!idea || state.hiddenIdeas[idea.id] || !state.data) return null;
    var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts || ideaFacts()) : null;
    return fit ? { idea: idea, line: fit.line, act: fit.act } : null;
  }
  function onPage(boxId) {
    return placed().some(function (spot) { return spot.id === boxId; });
  }
  /** The first idea of this box that fits today. */
  function boxIdea(boxId) {
    var facts = ideaFacts();
    for (var i = 0; i < IDEAS.length; i++) {
      if (IDEAS[i].box !== boxId) continue;
      var f = fitted(IDEAS[i], facts);
      if (f) return f;
    }
    return null;
  }
  /** Ideas the list boxes on the page are showing right now. */
  function shownIdeas() {
    var shown = {};
    ["yours", "rows", "open", "twins", "sites", "news"].forEach(function (id) {
      var el = boxEls[id];
      if (!onPage(id) || (el && el.getAttribute("data-level") === "S")) return;
      var f = boxIdea(id);
      if (f) shown[f.idea.id] = true;
    });
    return shown;
  }
  /** The Ask box's idea for today: its own, or one whose box is not on the page. */
  function askIdea() {
    var facts = ideaFacts();
    var shown = shownIdeas();
    var best = null;
    IDEAS.forEach(function (idea) {
      if (best || shown[idea.id] || (idea.box !== "ask" && onPage(idea.box))) return;
      best = fitted(idea, facts);
    });
    return best;
  }

  /** "every Monday", "every month": the schedule as the end of "Do this ...". */
  function routineWords(idea) { return idea.when.charAt(0).toLowerCase() + idea.when.slice(1); }

  function nudgeHtml(fit, lead) {
    if (!fit) return "";
    var idea = fit.idea;
    var can = canAsk();
    return '<div class="nudge">' + icon("i-bulb") + '<p dir="auto">' + esc((lead || "") + fit.line) + "</p>" +
      '<div class="nudge-actions">' +
      '<button type="button" class="btn small ' + (lead ? "primary" : "dark") + '" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + esc(fit.act) + "</button>" +
      '<button type="button" class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>" +
      '<button type="button" class="nudge-hide" data-act="idea-hide" data-idea="' + idea.id + '" aria-label="Hide this idea from the page">Hide</button>' +
      "</div></div>";
  }

  function setIdeaHidden(id, hidden) {
    var before = snapshot();
    if (hidden) state.hiddenIdeas[id] = true;
    else delete state.hiddenIdeas[id];
    paintGrid();
    glide(before);
    // The idea that takes its place fades up.
    var idea = ideaById(id);
    var home = idea && boxEls[idea.box];
    if (home && home.isConnected) fadeIn(home.querySelector(".nudge"));
    if (state.drawerOpen) paintDrawer();
    toast(hidden ? "Hidden. You can always find it under Ideas." : "It’s back on your page when it fits your day.");
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(HIDDEN_IDEAS_KEY, Object.keys(state.hiddenIdeas)).catch(function () {
        toast("That could not be saved. It comes back next time.");
      });
    }
  }

  var DRAWERS = {
    ideas: { title: "Ideas", sub: "One tap to ask now, or to have it done for you on a schedule.", icon: "i-bulb", paint: paintIdeasPanel },
    add: { title: "Add a box", sub: "Pick what you want on your page. You can remove it again any time.", icon: "i-plus", paint: paintPicker }
  };
  function paintDrawer() {
    var kind = DRAWERS[state.drawerKind] || DRAWERS.ideas;
    $("drawer-title").textContent = kind.title;
    $("drawer-sub").textContent = kind.sub;
    $("drawer-icon").innerHTML = icon(kind.icon);
    kind.paint();
  }

  // The Add a box panel: every box by group, the ones on the page ticked.
  function paintPicker() {
    var on = {};
    (state.layout || DEFAULT_LAYOUT).forEach(function (b) { on[b.id] = true; });
    $("drawer-body").innerHTML = GROUPS.map(function (group) {
      var ids = Object.keys(BOXES).filter(function (id) { return BOXES[id].group === group.id; });
      return '<section class="pick-group"><h3>' + esc(group.title) + "</h3>" + ids.map(function (id) {
        var box = BOXES[id];
        var ready = !box.show || box.show();
        var note = on[id] ? (ready ? "On your page" : "On your page. " + box.when) : ready ? "" : box.when;
        return '<div class="pick' + (on[id] ? " on" : "") + '"><span class="pick-ic" aria-hidden="true">' + icon(box.icon) + "</span>" +
          "<div><b>" + esc(box.title) + "</b><span>" + esc(box.desc) + "</span>" +
          (note ? "<em" + (ready ? "" : ' class="wait"') + ">" + esc(note) + "</em>" : "") + "</div>" +
          (on[id]
            ? '<span class="pick-on" aria-hidden="true">' + icon("i-check") + "</span>"
            : '<button type="button" class="btn small" data-act="add-this" data-add="' + id + '"' + (ready ? "" : " disabled") +
              ' aria-label="Add ' + esc(box.title) + '">' + icon("i-plus") + "Add</button>") +
          "</div>";
      }).join("") + "</section>";
    }).join("");
  }

  // ── Editing the page ───────────────────────────────────────────────────
  // Edit layout turns on a bar above the grid; each box gets a remove button and stops
  // reacting to presses. Every change is kept at once in cabinet.mine, and Undo steps back.

  function startEdit() {
    // Boxes show the size they were given while being arranged, not grown by an open list.
    state.open = {};
    state.expanded = {};
    state.need = {};
    state.editing = true;
    state.undo = [];
    // The page's opening fade ends here, so no box is caught half way into it while moving.
    Object.keys(boxEls).forEach(function (id) { boxEls[id].classList.remove("rise"); });
    paint();
    paintEditbar();
    // The remove and resize handles pop in once, as edit mode starts.
    var grid = $("grid");
    grid.classList.add("fresh");
    setTimeout(function () { grid.classList.remove("fresh"); }, 700);
    toast(phone() ? "Hold a box to move it. Pick its size on top." : "Drag a box to move it. Pull its corner to resize it.");
  }
  function doneEdit() {
    state.editing = false;
    state.undo = [];
    closeDrawer();
    paint();
    paintEditbar();
  }
  function paintEditbar() {
    $("editbar").hidden = !state.editing;
    $("undo-btn").disabled = !state.undo.length;
  }

  function saveLayout() {
    if (!V2 || !cab.mine || typeof cab.mine.set !== "function") return;
    cab.mine.set(LAYOUT_KEY, state.layout).catch(function () {
      toast("Your page could not be saved. It goes back to how it was next time.");
    });
  }
  function changeLayout(next, easing) {
    var before = snapshot();
    letGo();
    state.undo.push(copyLayout(state.layout || DEFAULT_LAYOUT));
    if (state.undo.length > 30) state.undo.shift();
    state.layout = next;
    saveLayout();
    paintGrid();
    glide(before, null, easing);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  function removeBox(id) {
    var el = boxEls[id];
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return b.id !== id; });
    if (el) el.classList.add("leaving");
    setTimeout(function () {
      if (el) el.classList.remove("leaving");
      changeLayout(next);
      toast(BOXES[id].title + " removed. Undo brings it back.");
    }, 200);
  }
  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {
    var spots = placed(source);
    for (var y = 0; ; y++) {
      for (var x = 0; x + w <= COLS; x++) {
        var hit = spots.some(function (o) { return x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h; });
        if (!hit) return { x: x, y: y };
      }
    }
  }
  function addBox(id) {
    var box = BOXES[id];
    var w = Math.min(box.w, COLS);
    var at = freeSpot(w, box.h);
    changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).concat({ id: id, x: at.x, y: at.y, w: w, h: box.h }));
    closeDrawer();
    var el = boxEls[id];
    if (el && el.isConnected) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    toast(box.title + " added.");
  }
  function resetLayout() {
    changeLayout(copyLayout(DEFAULT_LAYOUT));
    toast("Back to the first page. Undo brings yours back.");
  }
  function undoLayout() {
    if (!state.undo.length) return;
    var before = snapshot();
    state.layout = state.undo.pop();
    saveLayout();
    paintGrid();
    glide(before);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  // ── Asking the agent to change the page ────────────────────────────────
  // The agent cannot reach a person's layout (it lives in cabinet.mine), so it writes what
  // to add and remove into data/layout-change.json. The page shows that with Apply and
  // No thanks, and remembers in cabinet.mine which change it last showed.

  var CHANGE_SEEN_KEY = "sharepoint-my-files-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {
    var menu = $("layout-menu");
    var r = button.getBoundingClientRect();
    state.menuOpen = true;
    menu.hidden = false;
    menu.style.top = r.bottom + 6 + "px";
    menu.style.left = Math.max(16, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 16)) + "px";
    button.setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();
  }
  function closeMenu() {
    if (!state.menuOpen) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) { button.setAttribute("aria-expanded", "false"); button.focus(); }
  }

  /** The words sent with a layout request: the boxes on the page now and who is asking. */
  function layoutWords(wish) {
    var on = placed().map(function (spot) { return BOXES[spot.id].title; });
    var me = myName();
    return "Change the boxes on my SharePoint page (My files)." + (me ? " I am " + me + "." : "") +
      " On it now: " + (on.length ? on.join(", ") : "no boxes") + ". What I want: " + wish;
  }
  function myName() {
    var own = cabName();
    if (own) return own;
    return state.profile && state.profile.name ? state.profile.name : "";
  }
  function cabName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    // Without a cloud sign-in Cabinet says "You": that is no name, so the greeting leaves it out.
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    return /^you$/i.test(name) ? "" : name;
  }
  /** The Ask box takes the request when it is on the page; otherwise the chat's own box does. */
  function askAboutLayout() {
    var el = boxEls.ask;
    if (onPage("ask") && el && el.isConnected) {
      state.layoutAsk = true;
      setAskNote("");
      drawBox(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if ($("ask-input")) $("ask-input").focus({ preventScroll: true });
      return;
    }
    cab.ask(layoutWords(""), { send: false }).then(function () {
      toast("Finish the sentence in the chat. The agent's suggestion shows up on this page.");
    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });
  }
  function sendLayoutAsk(wish) {
    var words = text(wish, 600);
    if (!words) return;
    setAskNote("Sending...");
    cab.ask(layoutWords(words), { send: true }).then(function () {
      state.layoutAsk = false;
      if ($("ask-input")) $("ask-input").value = "";
      setAskNote("Sent. The agent's suggestion shows up at the top of this page.");
      if (boxEls.ask) drawBox(boxEls.ask);
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
    });
  }
  function stopLayoutAsk() {
    state.layoutAsk = false;
    setAskNote("");
    if (boxEls.ask) drawBox(boxEls.ask);
  }

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    function ids(list) {
      return Array.isArray(list) ? list.filter(function (id, i) { return typeof id === "string" && BOXES[id] && list.indexOf(id) === i; }) : [];
    }
    return { at: d.at, for: text(d.for, 80), add: ids(d.add), remove: ids(d.remove), note: text(d.note, 300) };
  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {
    var c = state.change;
    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = cabName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });
    if (!add.length && !remove.length && !c.note) return null;
    return { at: c.at, add: add, remove: remove, note: c.note };
  }
  // A number box shares its title with a list ("Rows with your name"), so it says it is the number.
  function titles(ids) {
    return ids.map(function (id) { return BOXES[id].title + (BOXES[id].group === "numbers" ? " (number)" : ""); }).join(", ");
  }
  function paintSuggest() {
    var el = $("suggest");
    if (state.changeApplied) {
      el.hidden = false;
      el.innerHTML = "<p><b>Your page changed.</b></p>" +
        '<div class="suggest-actions"><button type="button" class="btn" data-act="change-undo">' + icon("i-undo") + "Undo</button>" +
        '<button type="button" class="btn dark" data-act="change-ok">OK</button></div>';
      return;
    }
    var c = state.loaded ? pendingChange() : null;
    el.hidden = !c;
    if (!c) { el.innerHTML = ""; return; }
    var parts = [];
    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");
    el.innerHTML = "<p>" + (parts.length ? "<b>The agent suggests:</b> " + esc(parts.join(", and ")) + "." : "<b>From the agent:</b>") +
      (why ? '<span class="why" dir="auto">' + esc(why) + "</span>" : "") + "</p>" +
      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">' + icon("i-check") + "Apply</button>" +
          '<button type="button" class="btn" data-act="change-skip">No thanks</button>'
        : '<button type="button" class="btn" data-act="change-skip">OK</button>') + "</div>";
  }
  function markChangeSeen(at) {
    state.changeSeen = at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(CHANGE_SEEN_KEY, at).catch(function () {});
  }
  function applyChange() {
    var c = pendingChange();
    if (!c) return;
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return c.remove.indexOf(b.id) < 0; });
    c.add.forEach(function (id) {
      var box = BOXES[id];
      var w = Math.min(box.w, COLS);
      var at = freeSpot(w, box.h, next);
      next.push({ id: id, x: at.x, y: at.y, w: w, h: box.h });
    });
    markChangeSeen(c.at);
    state.changeApplied = true;
    changeLayout(next);
    paintSuggest();
  }
  function skipChange() {
    var c = pendingChange();
    if (c) markChangeSeen(c.at);
    paintSuggest();
  }

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a
  // moment first, so the page still scrolls under a passing finger; outside edit mode the
  // hold also starts editing. While a box moves, the others make room live and an outline
  // shows where it lands. The corner handle resizes it on the grid, naming the size it
  // reaches. On a phone a box moves up and down its column; its size is a switch.

  var HOLD_MS = 600;
  var SLOP = 8;
  /** How far a mouse moves, pressed, before the box comes along: a slip of the hand is not a move. */
  var DRAG_START = 10;
  /** How far past a border (in cells) the moving box must be before the others make room. */
  var STICK = 0.8;
  var drag = null;
  var press = null;
  var hold = null;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function spotIn(spots, id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  function gridMetrics() {
    var r = $("grid").getBoundingClientRect();
    return { left: r.left, top: r.top, col: (r.width + GAP) / COLS, row: ROW + GAP };
  }
  /** The page with one box put at x, y and sized w by h, every other box making room. */
  function previewWith(id, x, y, w, h) {
    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }
      return b;
    }), id);
  }
  function showSpots(spots) {
    spots.forEach(function (s) {
      var el = boxEls[s.id];
      if (!el) return;
      el.style.gridColumn = s.x + 1 + " / span " + s.w;
      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {
    var at = {};
    spots.forEach(function (s) { at[s.id] = s; });
    var before = copyLayout(state.layout || DEFAULT_LAYOUT);
    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }
    changeLayout(next, easing);
    return true;
  }
  /** Nothing changed: every box glides back to the place it already had. */
  function settleBack(easing) {
    var before = snapshot();
    letGo();
    paintGrid();
    glide(before, null, easing);
  }

  // The outline where a moving box lands, and the size a resized box has reached.
  function overlay(cls) {
    var grid = $("grid");
    var el = grid.querySelector("." + cls);
    if (!el) {
      el = document.createElement("div");
      el.className = cls;
      el.setAttribute("aria-hidden", "true");
      grid.appendChild(el);
    }
    return el;
  }
  /** Puts the outline (or the size label) on a spot; once shown, it glides from spot to spot. */
  function placeOverlay(el, s) {
    var was = el.style.gridColumn && motionOK() ? el.getBoundingClientRect() : null;
    if (was) el.getAnimations().forEach(function (a) { a.cancel(); });
    el.style.gridColumn = s.x + 1 + " / span " + s.w;
    el.style.gridRow = s.y + 1 + " / span " + s.h;
    if (was) glideFrom(el, was, false, 300, SMOOTH);
  }
  function clearOverlays() {
    Array.prototype.slice.call($("grid").querySelectorAll(".drop-spot, .size-tag")).forEach(function (el) { el.parentNode.removeChild(el); });
  }
  /** "Medium: 3 rows": what a box shows at the size it has now. */
  function sizeWords(el) {
    var id = el.getAttribute("data-box");
    var level = el.getAttribute("data-level") || "M";
    var name = LEVEL_WORDS[level];
    if (!BOXES[id].list) return name;
    if (level === "S") return name + ": the total only";
    var n = el.querySelectorAll(".rows > li:not([hidden]), .cards > li:not([hidden])").length;
    return n ? name + ": " + n + " " + plural(n, "row", "rows") : name;
  }

  function beginDrag(kind, el, x, y, touch) {
    var id = el.getAttribute("data-box");
    var r = el.getBoundingClientRect();
    var spot = spotIn(placed(), id);
    if (!spot) return;
    drag = { kind: kind, id: id, el: el, touch: !!touch, x: x, y: y, x0: x, y0: y, scroll0: window.scrollY, spots: null };
    if (kind === "stack") {
      var boxes = Array.prototype.filter.call($("grid").children, function (c) { return c.hasAttribute("data-box"); });
      drag.boxes = boxes;
      drag.from = boxes.indexOf(el);
      drag.to = drag.from;
      drag.gap = parseFloat(getComputedStyle($("grid")).rowGap) || GAP;
      drag.step = r.height + drag.gap;
      drag.mids = boxes.map(function (b) { var br = b.getBoundingClientRect(); return br.top + window.scrollY + br.height / 2; });
    } else if (kind === "move") {
      drag.w = spot.w;
      drag.h = spot.h;
      drag.grabX = x - r.left;
      drag.grabY = y - r.top;
    } else {
      drag.sx = spot.x;
      drag.sy = spot.y;
      drag.pw0 = r.width;
      drag.ph0 = r.height;
    }
    // Whatever was still animating this box lets go of it, or it would hold the box still
    // while the hand moves.
    el.classList.remove("rise");
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.classList.add(kind === "size" ? "sizing" : "lifted");

  }

  if (V2) {
    // This person's own layout, if they changed it; the default otherwise.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var clean = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (clean) state.layout = clean;
      var seenProfile = mine ? mine.get(PROFILE_SEEN_KEY) : null;
      if (typeof seenProfile === "string") state.profileSeen = seenProfile;
      var giftSeen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof giftSeen === "string") state.giftDone = giftSeen;
      state.mineReady = true;
      var seen = mine ? mine.get(CHANGE_SEEN_KEY) : null;
      if (typeof seen === "string") state.changeSeen = seen;
      var hidden = mine ? mine.get(HIDDEN_IDEAS_KEY) : null;
      if (Array.isArray(hidden)) hidden.forEach(function (id) { if (ideaById(id)) state.hiddenIdeas[id] = true; });
      var done = mine ? mine.get(DONE_KEY) : null;
      var fresh = new Date(Date.now() - 14 * DAY_MS);
      if (done && typeof done === "object") Object.keys(done).forEach(function (k) {
        var at = parseTime(done[k]);
        if (at && at >= startOfDay(fresh)) state.done[k] = done[k];
      });
      paint();
    }).catch(function () {});
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null; document.documentElement.setAttribute("data-role", role());
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      // The routine's data and the person's setup.md both live in this app's folder.
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    cab.connectors.list().then(function (items) {
      state.conn = pickConn(items) || { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    }).catch(function () {
      state.conn = { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    });
    cab.connectors.onChange(function (items) { var t = pickConn(items); if (t) { state.conn = t; paint(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }
})();
</script>
</body>
</html>
