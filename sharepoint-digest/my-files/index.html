<!DOCTYPE html>
<!--
  SharePoint Digest: My files. The cabinet opens on this page.

  SharePoint keeps every file; this page shows the few that changed for you, and which one is
  the real one. The banner is a shelf: every file that changed since the last morning as a
  spine, by site, and the ones that touch you lit. Under it: your files someone else changed,
  list rows with your name, files anyone with the link can open, look-alike files ("v2",
  "final", "copy") with the newest marked, each site that moved, and the news on your sites.
  Ideas offer the next step in each box, and the page can be arranged by hand or by asking
  the agent.

  Where the words come from: the morning routine reads SharePoint through
  my-files/first-sort.mjs, which saves every Graph answer and counts every number, and writes
  data/latest.json (the shape is data/EXAMPLE-latest.json: a made-up company, always labelled
  as an example here). The first reading also writes data/reading.json (live lines and one
  gift) and data/profile.json ("This is you"). A run that could not read SharePoint writes
  data/status.json with ok:false and why. setup.md holds what the person told the cabinet.

  How it talks to Cabinet: window.cabinet v2 (connection state, connect, ask, run the
  routine, read files, the person's own layout in cabinet.mine). It never changes, moves,
  shares or deletes anything in SharePoint: links open SharePoint, where the person decides.

  One file on purpose: a sealed frame cannot load files next to it. It wears SharePoint's look:
  Segoe UI (SharePoint's font) for text with Public Sans as the fallback, Newsreader for the
  titles, SharePoint's teals and its three circles, Fluent's greys, and the Office colours of
  Word, Excel and PowerPoint on the file icons. Icons are inline SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My files</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500..700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* A viewer may not ask or run: the buttons only an editor can use are not shown at all. */
  html[data-role="viewer"] [data-viewer-off] { display: none !important; }
  /* "The shelf": SharePoint is a library nobody can walk through. The banner is a SharePoint
     site header in its deep teal, with the logo's three circles rising behind it, and one
     shelf: every file that changed a spine in its Office colour, the ones that touch you lit
     in brass. Under it plain white sheets on Fluent's light grey, like web parts on a page.
     Teal is SharePoint's own colour and marks the page and its buttons; brass means "touches
     you", red only "anyone can open it" or late, green only done. */
  :root {
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --display: var(--serif);
    --canvas: #f3f2f1;
    --page: #ffffff;
    --panel: #faf9f8;
    --panel-2: #f3f2f1;
    --line: #edebe9;
    --line-2: #d2d0ce;
    --ink: #201f1e;
    --ink-2: #3b3a39;
    --ink-3: #605e5c;
    --navy: #024346;
    --brass: #03787c;
    --brass-ink: #036c70;
    /* The three circles of SharePoint's logo. */
    --sp-1: #036c70; --sp-2: #1a9ba1; --sp-3: #37c6d0;

    --room-top: #013a3d; --room-low: #035e62; --room-ink: #f3fbfb; --room-ink-2: rgba(226, 244, 245, .78);
    --glow: #f2b84b;
    --gold: #b7791f;
    --gold-ink: #85560c;

    --terra: #c8462c;
    --terra-ink: #a3341b;
    --terra-tint: #fcefeb;
    --terra-line: #f1d2c9;
    --slate: #4f5d66;
    --slate-ink: #364249;
    --slate-tint: #edf0f0;
    --sage: #2f7a5b;
    --sage-ink: #1f5a42;
    --sage-tint: #eaf4ef;
    --sage-line: #cde4d8;
    --sand: #b07a26;
    --sand-ink: #84581a;
    --sand-tint: #f8f0e1;

    --shadow-1: 0 1px 2px rgba(28, 36, 34, .05), 0 6px 18px -12px rgba(28, 36, 34, .22);
    --shadow-2: 0 2px 4px rgba(28, 36, 34, .05), 0 16px 34px -18px rgba(28, 36, 34, .32);
    --radius: 12px;
    --font: "Segoe UI Variable Text", "Segoe UI", "Public Sans", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  ::selection { background: color-mix(in srgb, var(--sp-3) 35%, transparent); }
  html { scrollbar-color: var(--line-2) transparent; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--slate-ink); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--sage) 50%, transparent); outline-offset: 2px; border-radius: 10px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .bar { border-bottom: 1px solid var(--line); background: var(--canvas); }
  .bar-in { max-width: 1280px; margin: 0 auto; padding: 16px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .mark .icon { width: 22px; height: 22px; stroke-width: 1.9; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--ink-3); font-size: 14px; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .status .btn { min-height: 40px; padding: 8px 15px; font-size: 14px; }
  .pill .when { font-weight: 500; opacity: .85; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px; border-radius: 999px; background: var(--panel); font-weight: 600; font-size: 14px; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
  .pill.ok { background: var(--sage-tint); color: var(--sage-ink); }
  .pill.ok .dot { background: var(--sage); }
  .pill.warn { background: var(--sand-tint); color: var(--sand-ink); }
  .pill.warn .dot { background: var(--sand); }
  .pill.off { background: var(--terra-tint); color: var(--terra-ink); }
  .pill.off .dot { background: var(--terra); }
  .updated { color: var(--ink-3); font-size: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
    border-radius: 6px; border: 1px solid var(--line-2); background: var(--page); color: var(--ink);
    font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
    box-shadow: var(--shadow-1); transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover { background: var(--panel); border-color: #c9c5bb; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { cursor: default; opacity: .6; transform: none; }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: #fff; box-shadow: 0 8px 18px -10px rgba(3, 108, 112, .7); }
  .btn.primary:hover { background: var(--navy); border-color: var(--navy); }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.dark:hover { background: #2d3442; }
  .btn.big { min-height: 52px; padding: 13px 26px; font-size: 17px; }
  .btn.quiet { border-color: transparent; box-shadow: none; background: transparent; color: var(--slate-ink); padding-inline: 10px; }
  .btn.quiet:hover { background: var(--slate-tint); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 28px 40px; }
  .main { display: flex; flex-direction: column; gap: 26px; }

  /* ── Hero: the one answer and the numbers ────────────────────────────── */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .hero h2 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -.03em; }
  .hero .lead { margin: 10px 0 0; font-size: 18px; color: var(--ink-2); max-width: 70ch; }
  .hero .lead b { color: var(--ink); font-weight: 700; }
  .hero .fine { margin: 8px 0 0; font-size: 15px; color: var(--ink-3); }
  .hero .actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .kpi {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label value" "sub value"; align-items: center; gap: 4px 12px; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--page); text-decoration: none; color: inherit; min-height: 44px;
  }
  .kpi { transition: transform .15s ease, box-shadow .15s ease; }
  .kpi:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .kpi .label { grid-area: label; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .kpi .label .icon { width: 18px; height: 18px; color: var(--ink-3); }
  .kpi .value { grid-area: value; font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; text-align: end; }
  .kpi .sub { grid-area: sub; font-size: 14px; color: var(--ink-3); }
  .kpi.first { background: var(--terra-tint); border-color: var(--terra-line); }
  .kpi.first .value { color: var(--terra-ink); }
  .kpi.calm { background: var(--sage-tint); border-color: var(--sage-line); }
  .kpi.calm .value, .kpi.calm .sub { color: var(--sage-ink); }
  .kpi .value.none { color: var(--ink-3); }
  .kpi .sub .hot { color: var(--terra-ink); font-weight: 700; }

  /* The panel under a connection problem or before the first sort. */
  .card-hero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center;
    padding: 26px 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--page);
    box-shadow: var(--shadow-2);
  }
  .art { width: 132px; height: 104px; }
  .card-hero h2 { font-size: clamp(24px, 2.8vw, 32px); }
  .steps { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 15px; }
  .steps li { display: flex; align-items: center; gap: 8px; }
  .steps .icon { color: var(--sage); width: 18px; height: 18px; }

  .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--terra-tint); color: var(--ink); border: 1px solid var(--terra-line); }
  .notice .icon { color: var(--terra-ink); margin-top: 2px; }
  .notice p { margin: 0; }
  .notice .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }

  #ribbon:empty { display: none; }
  .ribbon { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-radius: 12px; background: var(--sand-tint); border: 1px solid #eadfca; }
  .ribbon p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .tag-example { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

  /* ── Boxes with a list ───────────────────────────────────────────────── */
  /* Plain white sheets: no border, a soft shadow, and a list inside. */
  .lane { border: 0; border-radius: var(--radius); background: var(--page); overflow: hidden; box-shadow: var(--shadow-1); }
  /* A box title: a plain outline icon and a bold word, nothing around them. */
  .lane-head { display: flex; align-items: center; gap: 11px; margin: 0 20px 2px; padding: 18px 0 10px; }
  .lane-head .lane-icon { display: inline-grid; place-items: center; color: var(--brass); }
  .lane-head .lane-icon .icon { width: 22px; height: 22px; stroke-width: 1.8; }
  .lane-head h3 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.015em; color: var(--ink); flex: 1; }
  .lane-head .count { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-3); }
  .lane-head .total { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink-2); }

  /* Your next 3 things: a numbered list to tick off. Terracotta while something waits,
     sage once all is done. */
  .things > li.thing { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .things > li.thing:last-child { border-bottom: 0; }
  .thing .tick { width: 28px; height: 28px; flex: none; display: grid; place-items: center; padding: 0; border: 2px solid var(--line-2); border-radius: 50%; background: var(--page); color: transparent; transition: border-color .15s ease, color .15s ease, background .15s ease; }
  .thing .tick .icon { width: 15px; height: 15px; stroke-width: 2.8; }
  .thing .tick:hover { border-color: var(--sage); color: var(--sage); }
  .thing .tick.ticked { background: var(--sage); border-color: var(--sage); color: #fff; }
  .thing .n { min-width: 14px; font-size: 14px; font-weight: 800; color: var(--ink-3); }
  .thing .what { min-width: 0; }
  .thing .what b { display: block; font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; }
  .thing .what span { display: block; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .thing .btn { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .box[data-level="M"] .thing { grid-template-columns: auto minmax(0, 1fr); }
  .box[data-level="M"] .thing .n { display: none; }
  .box[data-level="M"] .thing .btn { grid-column: 2; justify-self: start; margin-top: 4px; }
  .next-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 4px 8px 4px 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13.5px; }
  .next-foot .btn { min-height: 32px; padding: 4px 10px; font-size: 13.5px; }
  .all-done { display: flex; align-items: center; gap: 10px; color: var(--sage-ink); font-weight: 600; }
  .all-done .icon { color: var(--sage); }

  .lane-empty { padding: 18px; color: var(--ink-3); margin: 0; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  /* A row is a line in a note: the name in bold, then plain words. No faces, no badges. */
  .row-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: start; width: 100%; text-align: start; padding: 13px 20px; border: 0; background: transparent; }
  .row-main:hover { background: var(--panel); }
  .row.open .row-main { background: var(--panel); }
  .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .who b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .who .co { color: var(--ink-3); font-size: 14px; }
  .when { font-size: 14px; color: var(--ink-3); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; grid-row: span 2; }
  .gist { grid-column: 1; color: var(--ink-2); font-size: 15.5px; overflow-wrap: anywhere; }
  /* Labels are words, not pills: grey for what kind of mail it is, red only when it is late. */
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 0; border-radius: 0; font-size: 13px; font-weight: 600; background: none; color: var(--ink-3); white-space: nowrap; }
  .chip .icon { width: 13px; height: 13px; stroke-width: 2.2; }
  .chip.hot, .chip.wait, .chip.soon { color: var(--terra-ink); }
  .chip.hot { font-weight: 700; }
  .chip.ok { color: var(--sage-ink); }

  .row-body { padding: 0 20px 18px; background: var(--panel); }
  .row-body .short { margin: 0; color: var(--ink); font-size: 16px; line-height: 1.55; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

  .cards { list-style: none; margin: 0; padding: 0 6px 6px; display: grid; gap: 0; }

  /* ── Ideas ───────────────────────────────────────────────────────────── */
  .idea { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--page); box-shadow: var(--shadow-1); }
  .idea:hover { box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .idea .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
  .idea h3 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .idea p { margin: 0; color: var(--ink-2); font-size: 15px; flex: 1; }
  .idea .go { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin-top: 4px; }
  .idea .go .btn { min-height: 44px; padding: 8px 12px; font-size: 14px; }
  /* Idea icons are plain outline drawings, never a coloured tile. */
  .ic, .idea .ic, .idea-rows .ic, .one-idea .ic { background: none !important; color: var(--ink-2); width: auto; height: auto; border-radius: 0; }
  .ic .icon { width: 22px; height: 22px; stroke-width: 1.8; }

  /* ── Ask ─────────────────────────────────────────────────────────────── */
  /* Ask: the navy box, the one dark sheet on the page. */
  .ask { padding: 22px; border-radius: var(--radius); color: #fff; background: radial-gradient(circle at 97% 112%, rgba(55, 198, 208, .16) 0 90px, transparent 91px), radial-gradient(circle at 90% 135%, rgba(26, 155, 161, .22) 0 110px, transparent 111px), var(--navy); }
  .ask h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
  .ask > p { margin: 0 0 14px; color: rgba(255, 255, 255, .8); font-size: 15px; }
  .ask form { display: flex; gap: 10px; }
  .ask input { flex: 1; min-width: 0; min-height: 50px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .09); color: #fff; padding: 10px 18px; font-size: 16px; }
  .ask input::placeholder { color: rgba(255, 255, 255, .62); }
  .ask input:focus { outline: none; border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .22); }
  .ask .btn.primary { min-height: 50px; background: #fff; border-color: #fff; color: var(--navy); box-shadow: none; }
  .ask .btn.primary:hover { background: #e6f6f7; border-color: #e6f6f7; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .q { min-height: 40px; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .06); color: #fff; font-size: 14.5px; font-weight: 600; text-align: start; }
  .q:hover { background: rgba(255, 255, 255, .14); }
  .ask .note { margin: 12px 0 0; font-size: 14px; color: rgba(255, 255, 255, .75); min-height: 1.5em; }

  .foot { display: flex; gap: 10px; align-items: flex-start; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 14px; }
  .foot .icon { color: var(--sage); }
  .foot p { margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-2); transition: opacity .2s ease, transform .2s ease; z-index: 50; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* "backwards": hidden until its turn, then it lets go, so it never holds a box still when dragged. */
  .rise { animation: rise .4s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  /* Loading: grey shapes where the banner and the boxes will be, with a soft shimmer. */
  .skel { display: grid; gap: 16px; }
  .skel-banner { display: grid; align-content: center; gap: 16px; min-height: 230px; padding: 28px clamp(20px, 3vw, 36px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .skel-box { display: grid; align-content: start; gap: 14px; min-height: 200px; padding: 24px; background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .skel-line { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, var(--panel-2) 50%, var(--line) 75%); background-size: 200% 100%; animation: skel-shine 1.4s ease-in-out infinite; }
  .skel-line.big { height: 32px; border-radius: 9px; }
  .skel-line.head { height: 18px; }
  .w25 { width: 25%; } .w35 { width: 35%; } .w45 { width: 45%; } .w55 { width: 55%; } .w70 { width: 70%; } .w85 { width: 85%; }
  @keyframes skel-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel-line { animation: none; } }
  /* Until the page is ready, nothing but the shapes: no bar, no note. */
  html:not(.ready) #topbar, html:not(.ready) .foot { display: none !important; }

  /* ── The grid of boxes ───────────────────────────────────────────────── */
  /* Each box sits on a 12 column grid at the place its layout gives it, and draws itself
     small, medium or large by its own width (data-level). A list shows the rows that fit,
     then "+N more". */
  .grid { --row: 64px; --gap: 16px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); }
  .box { display: flex; flex-direction: column; min-width: 0; min-height: 0; transition: box-shadow .2s ease; }
  .box > .box-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .box-more { display: flex; justify-content: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: var(--page); color: var(--slate-ink); font-weight: 700; font-size: 14px; }
  .box-more:hover { background: var(--slate-tint); }
  .box .cards { padding: 8px; gap: 6px; }

  /* Small: one number and one line under it. */
  .sum { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; }
  .sum .value { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .sum .value.none { color: var(--ink-3); }
  .sum .sub { color: var(--ink-3); font-size: 14px; }
  .sum .sub .hot { color: var(--terra-ink); font-weight: 700; }
  .sum .line { margin-top: 6px; color: var(--ink-2); font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }


  /* ── The shelf: the headline box is every file that changed since the last morning ── */
  /* Deep library green. Each spine is a file, standing with the others of its site on a
     plank; a lit one touches you. Glass buttons read on the dark. */
  .box.headline {
    position: relative; isolation: isolate; overflow: hidden; justify-content: flex-start;
    padding: 20px clamp(20px, 2.6vw, 36px) 14px; border-radius: 16px; color: var(--room-ink);
    /* SharePoint's three circles, large and quiet, behind the right side of the header. */
    background:
      radial-gradient(circle at calc(100% - 150px) 38%, rgba(55, 198, 208, .2) 0 132px, transparent 133px),
      radial-gradient(circle at calc(100% - 245px) 74%, rgba(26, 155, 161, .26) 0 104px, transparent 105px),
      radial-gradient(circle at calc(100% - 92px) 96%, rgba(3, 108, 112, .55) 0 78px, transparent 79px),
      linear-gradient(168deg, var(--room-top) 0%, var(--room-low) 100%);
  }
  .box.headline > div:first-child { display: flex; flex-direction: column; min-height: 100%; }
  .hl-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .sp-mark { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; color: var(--room-ink); letter-spacing: .01em; }
  .sp-mark svg { width: 22px; height: 22px; flex: none; }
  .sp-mark span { color: var(--room-ink-2); font-weight: 400; }
  .hl-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .window-tag { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 13px 6px 11px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--room-ink); font-size: 13.5px; font-weight: 700; }
  .window-tag .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 0 4px rgba(242, 184, 75, .18); }
  .hello { margin: 16px 0 4px; font-size: 15px; font-weight: 500; color: var(--room-ink-2); }
  .hello b { font-weight: 700; color: var(--room-ink); }
  .box.headline h2 { margin: 0; font-family: var(--display); font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; font-weight: 600; letter-spacing: -.015em; color: var(--room-ink); max-width: 30ch; }
  .box.headline h2 .need { color: var(--glow); }
  .box.headline h2 .soft { color: var(--room-ink-2); font-weight: 500; }
  .box.headline .lead { margin: 10px 0 0; font-size: 16.5px; color: var(--room-ink-2); max-width: 64ch; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .box.headline .lead b { color: var(--room-ink); font-weight: 700; }
  .box.headline .fine { margin: 6px 0 0; font-size: 14px; color: var(--room-ink-2); }
  .box.headline[data-level="S"] h2 { font-size: 24px; margin-top: 14px; }
  .box.headline[data-level="S"] .hello, .box.headline[data-level="S"] .shelf { display: none; }
  .hello .calm { display: inline-flex; align-items: center; gap: 5px; margin-inline-start: 10px; font-weight: 700; color: #a8e6c8; }
  .hello .calm .cheer { width: 15px; height: 15px; margin: 0; vertical-align: 0; stroke: currentColor; stroke-width: 4; }
  /* The shelf: one bay per site, its spines on a plank, its name under it. */
  .shelf { margin-top: auto; padding-top: 16px; }
  .shelf .bays { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
  .bay { display: flex; flex-direction: column; flex: 0 1 auto; min-width: 70px; }
  .bay .spines { display: flex; align-items: flex-end; gap: 2px; height: 66px; padding: 0 3px; }
  .bay .plank { height: 3px; border-radius: 2px; background: rgba(214, 244, 246, .55); }
  .bay .label { margin-top: 6px; display: flex; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--room-ink-2); white-space: nowrap; }
  .bay .label span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .bay .label .num { color: var(--room-ink); font-weight: 700; }
  .spine { flex: 0 1 auto; width: 9px; min-width: 3px; border-radius: 2px 2px 1px 1px; opacity: .5; background: #cfc6b0; }
  .spine { background: #b9d3d4; }
  .spine.word { background: #6ea8f0; } .spine.excel { background: #5cc28a; } .spine.powerpoint { background: #f08c6a; }
  .spine.pdf { background: #ee7f86; } .spine.image, .spine.video { background: #b39ddb; }
  .spine.m { opacity: .85; }
  .spine.y { opacity: 1; background: var(--glow); box-shadow: 0 0 10px 1px rgba(242, 184, 75, .55); position: relative; }
  .spine.y::after { content: ""; position: absolute; left: 50%; top: -6px; width: 3px; height: 10px; margin-left: -1.5px; background: #fff3d6; border-radius: 1px; }
  .shelf .axis { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--room-ink-2); }
  .shelf .keys { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; }
  .shelf .key { display: inline-flex; align-items: center; gap: 6px; }
  .shelf .key i { width: 5px; height: 12px; border-radius: 1px; background: var(--glow); box-shadow: 0 0 6px var(--glow); }
  .shelf .key i.k-word { background: #6ea8f0; box-shadow: none; } .shelf .key i.k-excel { background: #5cc28a; box-shadow: none; } .shelf .key i.k-powerpoint { background: #f08c6a; box-shadow: none; }
  .hl-status { flex: none; justify-content: flex-end; gap: 6px 14px; }
  .box.headline .hl-status .pill { min-height: 0; padding: 0; gap: 7px; background: none; color: var(--room-ink-2); font-weight: 600; font-size: 13.5px; }
  .box.headline .pill .dot { width: 7px; height: 7px; }
  .box.headline .pill.ok .dot { background: #6fd3a2; }
  .box.headline .pill .when { font-weight: 500; color: inherit; opacity: .85; margin-inline-start: 4px; }
  .box.headline .hl-status .btn[data-act="run"] { min-height: 32px; padding: 4px 8px; border: 0; background: none; box-shadow: none; color: var(--room-ink-2); font-size: 13.5px; }
  .box.headline .hl-status .btn[data-act="run"]:hover { background: rgba(255, 255, 255, .1); }
  .box.headline .hl-status .btn[data-act="run"] .icon { width: 16px; height: 16px; }
  .box.headline .btn[data-act="ideas"], .box.headline .btn[data-act="edit-start"], .box.headline .btn[data-act="layout-menu"] { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .box.headline .btn:not(.primary) { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .2); color: var(--room-ink); box-shadow: none; }
  .box.headline .btn:not(.primary):hover { background: rgba(255, 255, 255, .18); }
  .box.headline .updated, .box.headline .status > span:not(.pill) { color: var(--room-ink-2); }
  @media (max-width: 700px) { .box.headline .lead { -webkit-line-clamp: 5; } .bay .spines { height: 50px; } .shelf .bays { gap: 10px; } }
  /* Ask: the dark box. Small keeps only the field. */
  .box.ask { padding: 20px 22px; overflow: hidden; justify-content: flex-start; }
  .box.ask h2 { font-size: 23px; }
  .box.ask .qs { margin-top: 10px; }
  .box.ask .note { margin-top: 8px; }
  .box.ask[data-level="S"] form { flex-direction: column; }

  /* An idea at the foot of a box, picked from today's mail. */
  .nudge { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--page); }
  .nudge > .icon { color: var(--ink-3); margin-top: 1px; }
  .nudge p { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .nudge-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .btn.small .icon { width: 17px; height: 17px; }
  .nudge-hide { margin-inline-start: auto; min-height: 38px; border: 0; background: transparent; color: var(--ink-3); font-size: 13.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px; }
  .nudge-hide:hover { background: var(--panel-2); color: var(--ink); }
  .box.ask .nudge { margin-top: 12px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; background: rgba(0, 0, 0, .14); }
  .box.ask .nudge > .icon { color: #f1d9a6; }
  .box.ask .nudge p { color: #fff; }
  .box.ask .nudge .btn:not(.primary) { background: transparent; border-color: rgba(255, 255, 255, .3); color: #fff; box-shadow: none; }
  .box.ask .nudge .btn:not(.primary):hover { background: rgba(255, 255, 255, .12); }
  .box.ask .nudge-hide { color: rgba(255, 255, 255, .72); }
  .box.ask .nudge-hide:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  .box.ask .qs-label { margin: 10px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }
  .box.ask .qs { margin-top: 6px; }

  /* The boxes you can add. */
  .box.nbox > .kpi { flex: 1; min-height: 0; justify-content: center; }
  .box-pad { padding: 14px 18px; flex: 1; min-height: 0; overflow: hidden; }
  .box-pad > p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .facts div { padding: 8px 12px; border-radius: 10px; background: var(--panel); }
  .facts dt { font-weight: 700; font-size: 14px; }
  .facts dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .facts dd.unset { color: var(--ink-3); font-style: italic; }
  .box[data-level="M"] .facts { grid-template-columns: minmax(0, 1fr); }
  .idea-rows > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .idea-rows > li:last-child { border-bottom: 0; }
  .idea-rows .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  .idea-rows b { display: block; font-size: 15px; }
  .idea-rows span[dir] { display: block; color: var(--ink-3); font-size: 14px; }
  .one-idea { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .one-idea .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .one-idea h3 { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.3; }
  .one-idea p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
  .one-idea .today { padding: 6px 10px; border-radius: 9px; background: var(--sage-tint); border: 1px solid var(--sage-line); color: var(--ink); font-weight: 600; font-size: 14px; }
  .one-idea .go { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

  /* Editing the page. */
  /* A small toolbar on the right while editing: just the four buttons. */
  .editbar { position: sticky; top: 8px; z-index: 20; align-self: flex-end; display: flex; padding: 3px; border-radius: 999px; background: var(--slate-tint); border: 1px solid #d5dbe6; box-shadow: var(--shadow-2); }
  .editbar-actions { display: flex; flex-wrap: wrap; gap: 2px; }
  .editbar .btn { min-height: 30px; padding: 3px 11px; font-size: 12.5px; gap: 5px; box-shadow: none; }
  .editbar .btn .icon { width: 14px; height: 14px; }
  .editbar .btn.quiet { color: var(--ink-2); }

  /* The Layout button's two ways: by hand, or by asking the agent. */
  .menu { position: fixed; z-index: 40; width: min(300px, calc(100vw - 32px)); padding: 6px; display: grid; gap: 2px; background: var(--page); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow-2); }
  .menu button { display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; text-align: start; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--panel); outline: none; }
  .menu .icon { width: 18px; height: 18px; color: var(--ink-2); }
  .menu b { font-size: 14.5px; font-weight: 700; }
  .menu span { grid-column: 2; color: var(--ink-3); font-size: 13.5px; }

  /* What the agent suggests for the page, with Apply and No thanks. */
  /* The first sort, told as it happens: one line for each thing the agent finds. */
  .reading { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-width: 760px; padding: 26px clamp(20px, 3vw, 36px); background: var(--page); border-radius: 16px; box-shadow: var(--shadow-1); }
  .reading h2 { margin: 0; font-family: var(--display); font-size: clamp(28px, 3vw, 38px); font-weight: 600; letter-spacing: -.02em; }
  .reading > p { margin: 0 0 10px; color: var(--ink-3); font-size: 15.5px; }
  .read-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .read-lines li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 16.5px; color: var(--ink-2); animation: line-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  .read-lines li b { color: var(--ink); }
  .read-lines li .icon { width: 20px; height: 20px; margin-top: 2px; color: var(--brass); stroke-width: 2.2; }
  .read-lines li.old { animation: none; }
  .read-lines li.now { color: var(--ink-3); }
  .read-lines li.now .pulse-dot { width: 9px; height: 9px; margin: 7px 0 0 5px; border-radius: 50%; background: var(--brass); animation: read-pulse 1.2s ease-in-out infinite; }
  .reading .fine { margin: 10px 0 0; color: var(--ink-3); font-size: 13.5px; }
  @keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes read-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .read-strip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: var(--page); box-shadow: var(--shadow-1); color: var(--ink-2); font-size: 14.5px; }
  .read-strip .pulse-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--brass); animation: read-pulse 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .read-lines li, .pulse-dot { animation: none !important; } }
  /* While the first sort reads, the reading is the whole page: no made-up example under it. */
  .first-read #ribbon, .first-read #grid, .first-read #grid-empty, .first-read #topbar, .first-read #gift-keep { display: none !important; }
  /* ...and it fills the page: the reading on the left, the gift on the right, on the canvas. */
  .first-read .wrap { min-height: 100vh; display: flex; flex-direction: column; padding-top: 28px; }
  .first-read .main, .first-read #hero { flex: 1; }
  .read-page { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 20px; }
  .read-page .reading { max-width: none; align-content: start; }
  @media (min-width: 980px) {
    .read-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 24px; min-height: calc(100vh - 72px); }
    .read-page.solo { grid-template-columns: minmax(0, 1fr); }
    .read-page { align-content: stretch; }
    /* The gift sits in the middle of its sheet, like a letter left on the desk. */
    .read-page .gift { align-content: center; }
    .read-page .reading { padding: 40px clamp(28px, 3.4vw, 52px); }
    .read-page .reading h2 { font-size: clamp(34px, 3.4vw, 46px); }
    .read-page .read-lines li { font-size: 17.5px; }
  }

  /* The gift: one thing the owner can act on now, found while the agent reads. */
  .gift { display: grid; align-content: start; gap: 16px; padding: 40px clamp(24px, 3.4vw, 52px) 32px; background: var(--page); border-radius: 16px; box-shadow: var(--shadow-2); }
  .gift.arrive { animation: gift-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes gift-in { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
  .gift .eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brass-ink); }
  .gift .eyebrow .icon { width: 18px; height: 18px; }
  .gift h3 { margin: 0; max-width: 24ch; font-family: var(--display); font-size: clamp(30px, 3.2vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -.02em; color: var(--ink); }
  .gift h3 b { font-weight: 700; }
  .gift h3 .n { white-space: nowrap; }
  .gift .about { margin: 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); display: grid; gap: 2px; max-width: 62ch; }
  .gift .about b { font-size: 15.5px; color: var(--ink); }
  .gift .about span { font-size: 16.5px; color: var(--ink-2); }
  .gift .why { margin: 0; max-width: 56ch; font-size: 17px; color: var(--ink-2); }
  .gift .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
  .gift .acts .btn { min-height: 48px; padding: 0 20px; font-size: 15.5px; }
  .gift .asked { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; font-size: 16px; font-weight: 600; color: var(--sage-ink); }
  .gift .asked .icon { color: var(--sage); }
  .gift .fine { margin: 0; font-size: 13.5px; color: var(--ink-3); }
  /* Before it comes: the space says what is coming, quietly. */
  .gift.looking { align-content: center; justify-items: start; background: color-mix(in srgb, var(--page) 55%, transparent); box-shadow: none; }
  .gift.looking h3 { color: var(--ink-3); font-size: clamp(26px, 2.6vw, 34px); }
  .gift.looking .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brass); animation: read-pulse 1.2s ease-in-out infinite; }
  @media (max-width: 979px) { .gift.looking { display: none; } .gift { padding: 26px clamp(20px, 3vw, 36px); } }
  /* After the reading, the gift waits at the top of the page until it is used or put away. */
  .gift-keep .gift { padding: 26px clamp(20px, 2.6vw, 34px) 22px; gap: 12px; }
  .gift-keep .gift h3 { font-size: clamp(24px, 2.4vw, 32px); max-width: 40ch; }
  @media (prefers-reduced-motion: reduce) { .gift.arrive, .gift.looking .pulse-dot { animation: none !important; } }

  /* "This is you": what the agent learned, confirmed with one press. */
  .welcome { display: grid; gap: 12px; padding: 22px clamp(20px, 2.6vw, 30px); background: var(--page); border-radius: var(--radius); box-shadow: var(--shadow-2); animation: line-in .6s cubic-bezier(.2, .8, .2, 1) both; }
  .welcome .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brass-ink); }
  .welcome h3 { margin: 0; max-width: 60ch; font-family: var(--display); font-size: clamp(22px, 2.2vw, 28px); font-weight: 500; line-height: 1.25; letter-spacing: -.01em; color: var(--ink); }
  .welcome h3 b { font-weight: 700; }
  .welcome ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 22px; }
  .welcome li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; align-items: start; font-size: 15px; color: var(--ink-2); }
  .welcome li b { color: var(--ink); }
  .welcome li .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--brass); }
  .welcome .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
  .welcome .acts .fine { color: var(--ink-3); font-size: 13.5px; }

  .suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; background: var(--page); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  .suggest p { flex: 1 1 320px; margin: 0; font-size: 15px; color: var(--ink-2); }
  .suggest p b { color: var(--ink); }
  .suggest .why { display: block; margin-top: 2px; color: var(--ink-3); font-size: 14px; }
  .suggest-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask .cancel { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }
  .grid.editing .box { position: relative; overflow: visible; outline: 2px dashed #c9c4b8; outline-offset: 5px; border-radius: 14px; }
  .grid.editing .box > :not(.box-x):not(.box-resize):not(.box-size) { pointer-events: none; user-select: none; }
  .grid .box { -webkit-touch-callout: none; }
  .grid.editing .box { cursor: grab; user-select: none; }
  .grid.editing .box:focus-visible { outline: 3px solid var(--slate); outline-offset: 5px; }
  body.is-moving, body.is-moving * { cursor: grabbing !important; user-select: none; }
  body.is-sizing, body.is-sizing * { cursor: nwse-resize !important; user-select: none; }
  .box.lifted { z-index: 30; box-shadow: 0 26px 50px -18px rgba(58, 62, 55, .42); will-change: transform; }
  .box.sizing { z-index: 30; }
  /* Motion: edit mode lifts the boxes a little, and the handles pop in once. */
  .grid.editing .box:not(.headline):not(.lifted) { box-shadow: 0 14px 30px -18px rgba(58, 62, 55, .32); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .grid.fresh .box-x, .grid.fresh .box-resize, .grid.fresh .box-size { animation: pop .45s var(--spring, ease-out) backwards; }
  .cheer { width: .82em; height: .82em; margin-inline-end: 12px; vertical-align: -.06em; fill: none; stroke: var(--sage); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .cheer circle { stroke-dasharray: 107; animation: draw-ring .7s ease-out both; }
  .cheer path { stroke-dasharray: 23; animation: draw-tick .45s .55s ease-out both; }
  @keyframes draw-ring { from { stroke-dashoffset: 107; } }
  @keyframes draw-tick { from { stroke-dashoffset: 23; } }
  .grid.stack.editing { gap: 36px; padding-top: 8px; }
  .grid.stack.editing .box.headline { padding-top: 24px; }
  .grid.stack.arranging .box:not(.lifted) { transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
  .drop-spot { z-index: 1; border: 2px dashed var(--slate); border-radius: 18px; background: color-mix(in srgb, var(--slate) 7%, transparent); pointer-events: none; }
  .size-tag { z-index: 31; place-self: center; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-2); }
  .size-tag:empty { display: none; }
  .box-resize { position: absolute; inset-inline-end: -11px; bottom: -11px; z-index: 3; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--slate); border-radius: 50%; background: var(--page); box-shadow: var(--shadow-1); cursor: nwse-resize; touch-action: none; transition: transform .15s ease; }
  .box-resize::after { content: ""; width: 8px; height: 8px; margin: 0 2px 2px 0; border-right: 2px solid var(--slate); border-bottom: 2px solid var(--slate); }
  .box-resize:hover { transform: scale(1.12); }
  .box-size { position: absolute; top: -16px; inset-inline-start: 12px; z-index: 3; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--ink); box-shadow: var(--shadow-2); }
  .box-size button { min-height: 30px; padding: 4px 10px; border: 0; border-radius: 999px; background: transparent; color: #c8ccd4; font-size: 13px; font-weight: 700; }
  .box-size button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .box-x { position: absolute; top: -14px; inset-inline-end: -14px; z-index: 3; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--page); border-radius: 50%; background: var(--ink); color: #fff; box-shadow: var(--shadow-2); transition: transform .15s ease, background .15s ease; }
  .box-x:hover { background: var(--terra); transform: scale(1.1); }
  .box-x .icon { width: 16px; height: 16px; stroke-width: 2.6; }
  .box.leaving { opacity: 0; transform: scale(.94); transition: opacity .2s ease, transform .2s ease; }
  .box.flash { animation: flash 1.4s ease; }
  @keyframes flash { 25% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--slate) 40%, transparent); } }
  .grid-empty { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 24px; border: 2px dashed var(--line-2); border-radius: 18px; color: var(--ink-2); }
  .grid-empty p { margin: 0; }

  /* The Add a box panel. */
  .pick-group h3 { margin: 6px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--page); }
  .pick.on { background: var(--panel); }
  .pick-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-2); }
  .pick b { display: block; font-size: 15px; }
  .pick span { display: block; color: var(--ink-3); font-size: 14px; }
  .pick em { display: block; margin-top: 2px; font-style: normal; font-size: 13px; font-weight: 700; color: var(--sage-ink); }
  .pick em.wait { color: var(--ink-3); font-weight: 600; }
  .pick-on { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--sage-tint); color: var(--sage-ink); }

  /* The Ideas panel, from the top bar. */
  .drawer { position: fixed; inset: 0; z-index: 40; }
  .drawer-scrim { position: absolute; inset: 0; background: rgba(16, 18, 23, .38); opacity: 0; transition: opacity .25s ease; }
  .drawer-panel { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: min(460px, 100%); display: flex; flex-direction: column; background: var(--page); box-shadow: -24px 0 60px -24px rgba(16, 18, 23, .4); transform: translateX(100%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); outline: none; }
  .drawer.open .drawer-scrim { opacity: 1; }
  .drawer.open .drawer-panel { transform: none; }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
  .drawer-head .lane-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--sage-tint); color: var(--sage-ink); flex: none; }
  .drawer-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .drawer-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 14.5px; }
  .drawer-close { margin-inline-start: auto; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 11px; background: transparent; color: var(--ink-2); }
  .drawer-close:hover { background: var(--panel); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .drawer .idea { box-shadow: none; }
  .drawer .idea.off { background: var(--panel); }
  .idea .today { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--sage-tint); border: 1px solid var(--sage-line); font-size: 14px; font-weight: 600; color: var(--ink); }
  .idea .off-note { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: var(--ink-3); }
  .idea .off-note .btn { min-height: 36px; padding: 4px 10px; font-size: 14px; }

  /* On a phone the boxes stack in their order and grow to fit. */
  .grid.stack { display: flex; flex-direction: column; gap: 16px; }
  .grid.stack .box { flex: none; }

  /* ── Narrow screens ──────────────────────────────────────────────────── */
  @media (max-width: 560px) {
    .bar-in { padding: 12px 16px; }
    .wrap { padding: 18px 16px 32px; }
    .main { gap: 20px; }
    .status { width: 100%; }
    .updated { display: none; }
    .hero h2 { font-size: 27px; }
    .hero .lead { font-size: 16.5px; }
    .kpi { padding: 13px 14px; }
    .kpi .value { font-size: 24px; }
    .card-hero { grid-template-columns: minmax(0, 1fr); padding: 22px 18px; gap: 14px; }
    .art { width: 104px; height: 82px; }
    .card-hero .btn.big { width: 100%; }
    .row-main { grid-template-columns: auto minmax(0, 1fr); padding: 14px 14px; }
    .when { grid-column: 1; grid-row: auto; flex-direction: row; align-items: center; gap: 10px; }
    .row-body { padding: 0 14px 16px 14px; }
    .ask { padding: 18px 16px; }
    .ask form { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── SharePoint rows ─────────────────────────────────────────────────── */
  /* Where a file is: plain grey words, "Sales › Price lists", never a pill. */
  .place { color: var(--ink-3); font-size: 13.5px; font-weight: 600; }
  .kind { color: var(--ink-3); font-weight: 600; font-size: 13px; }
  /* A file's icon, as a SharePoint library shows it: the page, and its Office colour. */
  .ficon { width: 16px; height: 20px; flex: none; vertical-align: -4px; margin-inline-end: 8px; }
  .who .ficon { align-self: center; margin-inline-end: -2px; }
  .twin .ficon { width: 13px; height: 16px; margin-inline-end: 6px; vertical-align: -3px; }
  .gift .twin-list .ficon { width: 14px; height: 17px; }
  .chip.mine { color: var(--gold-ink); }
  .chip.risk { color: var(--terra-ink); font-weight: 700; }
  .chip.said { color: var(--sand-ink); }
  .lane.yours .count:not(.zero), .lane.rows .count:not(.zero) { color: var(--gold-ink); }
  .lane.yours .lane-icon, .lane.rows .lane-icon { color: var(--gold); }
  .lane.open .count:not(.zero) { color: var(--terra-ink); }
  .lane.open .lane-icon { color: var(--terra); }
  .row-done { margin-inline-start: auto; }
  .facts-line { margin: 0 0 4px; color: var(--ink-3); font-size: 14px; }
  .facts-line b { color: var(--ink-2); }
  /* Sites: the site, how much moved, by whom, and whether it wants you. */
  .ch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: baseline; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .ch:last-child { border-bottom: 0; }
  .ch b { font-size: 15.5px; overflow-wrap: anywhere; }
  .ch .n { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--ink-2); text-align: end; }
  .ch .g { grid-column: 1; color: var(--ink-2); font-size: 14.5px; overflow-wrap: anywhere; }
  .ch .w { grid-column: 2; justify-self: end; font-size: 13px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
  .ch.you .w { color: var(--gold-ink); }
  .ch .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-inline-start: -10px; }
  /* Look-alikes: the newest named, the older ones under it in grey. */
  .twin { display: grid; gap: 4px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .twin:last-child { border-bottom: 0; }
  .twin .where-line { font-size: 13.5px; font-weight: 600; color: var(--ink-3); overflow-wrap: anywhere; }
  .twin ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .twin ol li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 14.5px; color: var(--ink-3); }
  .twin ol li span:first-child { overflow-wrap: anywhere; }
  .twin ol li.newest { color: var(--ink); font-weight: 700; }
  .twin .tag { color: var(--sage-ink); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-inline-start: 8px; }
  .twin ol li small { font-size: 13px; white-space: nowrap; font-weight: 500; }
  .twin .g { color: var(--ink-2); font-size: 14.5px; }
  .twin .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-inline-start: -10px; }
  /* News: one line each, site and who under it. */
  .decided > li { display: grid; gap: 2px; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .decided > li:last-child { border-bottom: 0; }
  .decided .d { font-size: 15.5px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .decided .s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--ink-3); font-size: 13.5px; }
  .decided .s a { color: var(--slate-ink); font-weight: 600; text-decoration: none; }
  .decided .s a:hover { text-decoration: underline; }
  .gift .where { margin: -6px 0 0; color: var(--ink-3); font-size: 14.5px; font-weight: 600; }
  .gift .twin-list { margin: 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); list-style: none; display: grid; gap: 4px; max-width: 62ch; }
  .gift .twin-list li { font-size: 16px; color: var(--ink-3); }
  .gift .twin-list li:first-child { color: var(--ink); font-weight: 700; }
  .read-strip { color: var(--ink-2); }
</style>

<script>
(function () {
  "use strict";

  var cab = window.cabinet;
  var V2 = !!(cab && cab.connectors && cab.files && cab.jobs);
  var MORNING = "morning-files";
  var CONNECTOR = "sharepoint";
  var POLL_MS = 60000;
  // Just after a press, Cabinet may still say "not running" before the run has started.
  var ASK_GRACE_MS = 45000;
  var SP_LINK = /^https:\/\/[a-z0-9-]+\.sharepoint(-df)?\.(com|us|cn|de)\//i;

  /**
   * Next steps in SharePoint: one tap to ask now, or to switch on as a routine. Each one belongs
   * to a box and offers itself there when today's files say it would help (see IDEA_FITS); all
   * of them are always in the Ideas panel. Every one only reads.
   */
  var IDEAS = [
    { id: "changed", box: "yours", icon: "i-copies", tint: "", title: "What changed in my files?",
      text: "For each of your files someone else saved, what is different from the version before, in two lines.",
      ask: "For each of my SharePoint files that someone else saved since yesterday, compare the newest version with the one before it and tell me in two plain lines what changed and whether it touches anything I wrote. Read only: change nothing in SharePoint.",
      when: "Every morning", at: "every weekday at 8 am" },
    { id: "rows", box: "rows", icon: "i-list", tint: "", title: "Everything with my name on it",
      text: "Every open row in your SharePoint lists that names you, by due date, late ones first.",
      ask: "Find every open row in my SharePoint lists where a person column names me (assigned to me, owner, approver, reviewer). List them by due date, late ones first, with the list, the site and a link. Read only.",
      when: "Every Monday", at: "every Monday at 8 am" },
    { id: "lock", box: "open", icon: "i-lock", tint: "", title: "Who can open my files?",
      text: "Your files that anyone with the link or a guest can open, and how to close each one in SharePoint.",
      ask: "Check the SharePoint files I made or saved in the last 90 days for links that anyone can use and for guests from outside the company. List each file, who can open it, and tell me step by step how to remove the link in SharePoint. Change nothing yourself.",
      when: "Every month", at: "on the 1st of every month at 9 am" },
    { id: "real", box: "twins", icon: "i-folder", tint: "", title: "Which one is the real one?",
      text: "For each set of look-alike files, which is newest, who works on it, and which ones look old.",
      ask: "Look at the look-alike files in my SharePoint (names with v2, final, copy, a date or (1) in the same folder). For each set, tell me which one is newest, who saved it, and which ones look old. Suggest a clear name for the real one. Change nothing yourself.",
      when: "Every Friday", at: "every Friday at 3 pm" },
    { id: "handover", box: "ask", icon: "i-file", tint: "", title: "Hand over my files",
      text: "Everything you made or worked on lately, by site and folder, with links. Ready for time off.",
      ask: "List every SharePoint file I made or saved in the last 60 days, grouped by site and folder, with one plain line on what each one is for and a link. Put it in a page in reports so I can hand it over.",
      when: "Every month", at: "on the 1st of every month at 8 am" },
    { id: "week", box: "news", icon: "i-news", tint: "", title: "This week on my sites",
      text: "The news posts and the files that moved most on your sites, in five lines.",
      ask: "Tell me in five short lines what happened on my SharePoint sites this week: the news posts, the files that changed most and who worked on them. Read only.",
      when: "Every Friday", at: "every Friday at 4 pm" },
    { id: "stale", box: "sites", icon: "i-site", tint: "", title: "Files nobody touched in a year",
      text: "On your busiest sites, the files no one opened or saved in a year, by folder.",
      ask: "On my three busiest SharePoint sites, find the files nobody saved in more than a year, grouped by folder, with their size. Tell me which folders look like they could be archived. Change nothing yourself.",
      when: "Every month", at: "on the 1st of every month at 9 am" }
  ];


  var state = {
    appPath: appPathFromUrl(),
    here: null,
    conn: null,
    jobs: [],
    loaded: false,
    data: null,
    example: true,
    lastTry: null,
    setup: null,
    connecting: false,
    connectNote: "",
    running: false,
    askedAt: 0,
    sawRun: false,
    runNote: "",
    askNote: "",
    open: {},
    layout: null,
    hiddenIdeas: {},
    done: {},
    drawerOpen: false,
    drawerKind: "ideas",
    editing: false,
    undo: [],
    menuOpen: false,
    layoutAsk: false,
    change: null,
    changeSeen: "",
    changeApplied: false,
    reading: null,
    sawReading: false,
    readShown: 0,
    readStartedAt: null,
    mineReady: false,
    profile: null,
    profileSeen: "",
    expanded: {},
    need: {},
    animate: true
  };

  var $ = function (id) { return document.getElementById(id); };

  // ── Small helpers ──────────────────────────────────────────────────────

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function icon(id, cls) {
    return '<svg class="icon' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function text(value, max) {
    var s = typeof value === "string" ? value.trim() : "";
    return max && s.length > max ? s.slice(0, max - 1) + "…" : s;
  }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function list(value) { return Array.isArray(value) ? value.filter(function (x) { return x && typeof x === "object"; }) : []; }

  function appPathFromUrl() {
    // /api/assets/<cabinet path>/<app folder>/index.html: the folder before the file.
    var parts = location.pathname.split("/").filter(Boolean);
    var at = parts.length - 2;
    return at >= 0 ? decodeURIComponent(parts[at]) : "my-files";
  }

  var toastTimer = 0;
  function toast(message) {
    var el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3200);
  }

  // ── Dates, in the person's own clock ───────────────────────────────────

  var DAY_MS = 86400000;
  function parseTime(value) {
    if (typeof value !== "string" || !value) return null;
    // A bare date is a calendar day, not midnight in another zone.
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    // "+0300" as `date +%z` prints it is read like "+03:00".
    var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(value.replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
    return isNaN(d.getTime()) ? null : d;
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  /** When a sort was written, never later than now: a routine's own clock can be wrong. */
  function writtenAt(value) {
    var d = parseTime(value);
    var now = new Date();
    return d && d > now ? now : d;
  }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS); }
  function clock(d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function bareClock(d) { return clock(d).replace(/\s?[AaPp]\.?\s?[Mm]\.?$/, ""); }
  function shortDate(d) { return d.toLocaleDateString([], { month: "short", day: "numeric" }); }

  /** "7:02 this morning", "yesterday at 7:02 AM", "Tuesday at 7:02 AM", "Sep 12". */
  function whenWords(d, now) {
    var gap = daysBetween(d, now);
    if (gap === 0) {
      var h = d.getHours();
      return bareClock(d) + (h < 12 ? " this morning" : h < 18 ? " this afternoon" : " this evening");
    }
    if (gap === 1) return "yesterday at " + clock(d);
    if (gap > 1 && gap < 7) return d.toLocaleDateString([], { weekday: "long" }) + " at " + clock(d);
    return shortDate(d);
  }
  /** The time on a row: "6:52 AM" today, "Yesterday", "Tue", or "Sep 12". */
  function rowTime(value, ref) {
    var d = parseTime(value);
    if (!d) return "";
    var gap = daysBetween(d, ref);
    if (gap <= 0) return clock(d);
    if (gap === 1) return "Yesterday";
    if (gap < 7) return d.toLocaleDateString([], { weekday: "short" });
    return shortDate(d);
  }

  // ── Reading the files the routines write ───────────────────────────────

  function notFound() { var e = new Error("not written yet"); e.code = "not-found"; return e; }
  function readText(rel) {
    if (V2) return cab.files.read(state.appPath + "/" + rel);
    // An older Cabinet: the files sit next to this page on the same address.
    return fetch(rel, { cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 404) throw notFound();
      if (!r.ok) throw new Error("Could not read " + rel + ".");
      return r.text();
    });
  }
  function readJson(rel) { return readText(rel).then(function (t) { return JSON.parse(t); }); }
  function maybe(promise) {
    return promise.catch(function (e) { if (e && e.code === "not-found") return null; throw e; });
  }
  function quiet(promise) { return promise.catch(function () { return null; }); }

  /** setup.md: every "**Label:** answer" paragraph. An answer in brackets is a hint, not an answer. */
  function parseSetup(md) {
    var body = md.replace(/^---[\s\S]*?\n---[^\n]*\n/, "");
    var out = [];
    body.split(/\n\s*\n/).forEach(function (para) {
      var m = /^\s*\*\*([^*]+?):\*\*\s*([\s\S]*)$/.exec(para);
      if (!m) return;
      var value = m[2].replace(/\s+/g, " ").trim();
      out.push({ label: m[1].trim(), value: value, unset: !value || /^\(/.test(value) });
    });
    return out.length ? out : null;
  }

  function usable(d) { return d && typeof d === "object" && Array.isArray(d.yours) && d.totals && typeof d.totals === "object"; }

  var loading = null;
  function load() {
    if (loading) return loading;
    loading = Promise.all([
      maybe(readJson("data/latest.json")).catch(function () { return "broken"; }),
      quiet(maybe(readJson("data/status.json"))),
      quiet(maybe(readText("setup.md"))),
      quiet(maybe(readJson("data/layout-change.json"))),
      quiet(maybe(readJson("data/reading.json"))),
      quiet(maybe(readJson("data/profile.json")))
    ]).then(function (got) {
      var latest = got[0];
      setReading(cleanReading(got[4]));
      state.profile = cleanProfile(got[5]);
      state.change = cleanChange(got[3]);
      state.lastTry = got[1] && typeof got[1] === "object" ? got[1] : null;
      state.setup = typeof got[2] === "string" ? parseSetup(got[2]) : null;
      if (usable(latest) && latest.example !== true) {
        state.data = latest;
        state.example = false;
        return null;
      }
      // A file half written a moment ago keeps what is on screen; the next change reloads it.
      if (latest === "broken" && state.data && !state.example) return null;
      return maybe(readJson("data/EXAMPLE-latest.json")).then(function (ex) {
        state.data = usable(ex) ? ex : null;
        state.example = true;
      });
    }).catch(function () {
      if (!state.data) state.data = null;
    }).then(function () {
      state.loaded = true;
      loading = null;
      paint();
    });
    return loading;
  }

  // ── Talking to Cabinet ─────────────────────────────────────────────────

  function role() { return state.here && state.here.role ? state.here.role : "owner"; }
  function canAsk() { return V2 && role() !== "viewer"; }
  function canRun() { return V2 && role() !== "viewer"; }
  function morningJob() {
    for (var i = 0; i < state.jobs.length; i++) if (state.jobs[i].id === MORNING) return state.jobs[i];
    return null;
  }
  function pickConn(items) {
    if (!Array.isArray(items)) return null;
    for (var i = 0; i < items.length; i++) if (items[i] && items[i].id === CONNECTOR) return items[i];
    return null;
  }
  function connState() { return state.conn ? state.conn.state : null; }
  /** The morning routine's schedule in words, lower case, or "" when it is paused or unknown. */
  function scheduleWords() {
    var job = morningJob();
    var when = job && typeof job.when === "string" ? job.when.trim() : "";
    return /^every\b/i.test(when) ? when.charAt(0).toLowerCase() + when.slice(1) : "";
  }
  function askReady() {
    var s = connState();
    return !state.conn || s === "connected" || s === "needs-you" || s === "needs-sign-in";
  }

  function setJobs(items) {
    if (!Array.isArray(items)) return;
    var wasRunning = state.running;
    state.jobs = items;
    var job = morningJob();
    var reported = !!(job && job.running);
    if (reported) state.sawRun = true;
    // Just after a press Cabinet may still say "not running": the reading screen stays for that moment.
    state.running = reported || (!state.sawRun && Date.now() - state.askedAt < ASK_GRACE_MS);
    if (wasRunning && !state.running) load();
    paint();
  }

  function connect() {
    if (!V2 || state.connecting) return;
    state.connecting = true;
    state.connectNote = "";
    paint();
    cab.connectors.connect(CONNECTOR).then(function (result) {
      state.connecting = false;
      return cab.connectors.list().then(function (items) {
        state.conn = pickConn(items) || state.conn;
        paint();
        // The first reading starts straight away, so the next thing they see is their own SharePoint.
        if (result === "connected" && state.example && canRun()) runNow();
      });
    }).catch(function (e) {
      state.connecting = false;
      state.connectNote = e && e.message ? e.message : "That did not work. Try again.";
      paint();
    });
  }

  setInterval(function () {
    if (!state.running && !readingNow()) return;
    quiet(maybe(readJson("data/reading.json"))).then(function (d) {
      var r = cleanReading(d);
      if (!r || (state.reading && r.lines.join("\n") === state.reading.lines.join("\n") && r.done === state.reading.done &&
        (r.gift && r.gift.at) === (state.reading.gift && state.reading.gift.at))) return;
      setReading(r);
      paintHero();
      paintWelcome();
      if (r.done) load();
    });
  }, 2500);

  function runNow() {
    if (!V2 || state.running) return;
    state.running = true;
    state.askedAt = Date.now();
    state.sawRun = false;
    state.runNote = "";
    paint();
    // If the run never shows up, the grace ends and the page comes back.
    setTimeout(function () { if (!state.sawRun && state.running) { state.running = false; load(); } }, ASK_GRACE_MS + 500);
    cab.jobs.run(MORNING).then(function () {
      watchRun();
    }).catch(function (e) {
      if (e && e.code === "busy") { watchRun(); return; }
      state.running = false;
      state.runNote = e && e.message ? e.message : "Reading your SharePoint did not start. Try again.";
      paint();
    });
  }

  // jobs.onChange says when the run ends; this is the fallback if a change is ever missed.
  var runTimer = 0;
  function watchRun() {
    clearInterval(runTimer);
    runTimer = setInterval(function () {
      if (!state.running) { clearInterval(runTimer); return; }
      cab.jobs.list().then(setJobs).catch(function () {});
    }, 8000);
  }

  function ask(question) {
    var q = text(question, 3900);
    if (!q) return;
    if (!V2) { toast("Open this cabinet in Cabinet to ask about your SharePoint."); return; }
    // Before SharePoint is connected there is nothing to read yet: the press leads to connecting.
    if (!askReady()) {
      if (state.conn && state.conn.canConnect) { toast("Connect SharePoint first. It takes a minute."); connect(); }
      else toast(connState() === "not-available-here" ? "SharePoint can’t be connected here yet." : "Ask the person who owns this cabinet to connect SharePoint.");
      return;
    }
    setAskNote("Asking...");
    cab.ask(q, { send: true }).then(function () {
      setAskNote("Asked. The answer is coming in the chat next to this page.");
      toast("Asked. The answer is coming in the chat.");
      if ($("ask-input")) $("ask-input").value = "";
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
      toast(state.askNote);
    });
  }
  /** The line under the Ask box; it lives in state because the box can be drawn again. */
  function setAskNote(words) {
    state.askNote = words;
    if ($("ask-note")) $("ask-note").textContent = words;
  }

  /** A link that opens the file, the row or the site in SharePoint, when the routine kept one. */
  function spLink(item) {
    return item && typeof item.link === "string" && SP_LINK.test(item.link) ? item.link : "";
  }

  // ── Painting ───────────────────────────────────────────────────────────

  /** Done is kept per person; a thing ticked off stays off the page. */
  function notDone(kind) { return function (x) { return !state.done[thingKey(kind, x)]; }; }
  function yours() { return state.data ? list(state.data.yours).filter(notDone("yours")) : []; }
  function rows() { return state.data ? list(state.data.rows).filter(notDone("row")) : []; }
  function openFiles() { return state.data ? list(state.data.open).filter(notDone("open")) : []; }
  function twins() { return state.data ? list(state.data.twins).filter(notDone("twins")) : []; }
  function sites() { return state.data ? list(state.data.sites) : []; }
  function news() { return state.data ? list(state.data.news) : []; }
  function totals() { return state.data && state.data.totals && typeof state.data.totals === "object" ? state.data.totals : {}; }
  function num(v) { return typeof v === "number" && isFinite(v) && v >= 0 ? Math.round(v) : 0; }
  function refDate() {
    var g = state.data ? parseTime(state.data.generatedAt) : null;
    return state.example && g ? g : new Date();
  }
  /** The item with this id in one box's list: the same file can be in Your files and in Open to anyone. */
  var KIND_LIST = { yours: "yours", row: "rows", open: "open", twins: "twins", news: "news", sites: "sites" };
  function findItem(id, kind) {
    var all = list(state.data && state.data[KIND_LIST[kind] || "yours"]);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }
  /** What a press does, and the box its item is in. */
  var ACT_KIND = { "what-changed": "yours", "row-help": "row", "close-link": "open", "which-real": "twins" };
  /** "Price list 2026.xlsx": the name a person sees in SharePoint. */
  function fileName(f) {
    var n = text(f.name, 120) || "A file";
    var e = text(f.ext, 8);
    return e ? n + "." + e : n;
  }
  /** "Sales › Price lists": the site and the folders a file is in. */
  function placeWords(f) {
    var bits = [text(f.site, 80)].concat(text(f.folder, 140) ? text(f.folder, 140).split("/") : text(f.library, 60) ? [text(f.library, 60)] : []);
    return bits.filter(Boolean).join(" › ");
  }
  /** The same place in the person's own words, for what is sent to the agent. */
  function askPlace(f) {

  // ── The grid of boxes ──────────────────────────────────────────────────
  // Each box is drawn by its own function at one of three levels, picked by its width on
  // screen: S (one number), M (the rows that fit), L (everything, with more detail). The
  // layout is a list of { id, x, y, w, h } on a 12 column grid of fixed rows; each person's
  // own layout is kept in cabinet.mine, so it follows them to any computer.

  var COLS = 12;
  var ROW = 64;
  var GAP = 16;
  var PHONE_ROWS = 3;
  var LAYOUT_KEY = "sharepoint-my-files-layout@1";
  var DEFAULT_LAYOUT = [
    { id: "headline", x: 0, y: 0, w: 12, h: 6 },
    { id: "yours", x: 0, y: 6, w: 7, h: 6 },
    { id: "rows", x: 7, y: 6, w: 5, h: 6 },
    { id: "open", x: 0, y: 12, w: 7, h: 4 },
    { id: "twins", x: 7, y: 12, w: 5, h: 6 },
    { id: "sites", x: 0, y: 16, w: 7, h: 5 },
    { id: "news", x: 7, y: 18, w: 5, h: 4 },

  /**

   * has nothing to be (`when` says what it waits for).
   */
  var BOXES = {
    headline: { cls: "headline", draw: drawHeadline, group: "files", icon: "i-site", w: 12, h: 6, min: [4, 3],

      title: "Rows with your name", desc: "Open rows in your SharePoint lists that name you, by due date." },
    open: { cls: "lane open", list: true, draw: drawOpen, group: "files", icon: "i-link", w: 7, h: 4, min: [3, 3],

    sites: { cls: "lane sites", list: true, draw: drawSites, group: "files", icon: "i-site", w: 7, h: 5, min: [3, 3],

    "n-yours": { cls: "nbox", draw: function () { return kpiCards().yours; }, group: "numbers", icon: "i-file", w: 3, h: 2, min: [2, 2],
      title: "Your files, changed", desc: "How many of your files someone else saved." },
    "n-rows": { cls: "nbox", draw: function () { return kpiCards().rows; }, group: "numbers", icon: "i-list", w: 3, h: 2, min: [2, 2],
      title: "Rows with your name", desc: "How many open list rows name you." },
    "n-open": { cls: "nbox", draw: function () { return kpiCards().open; }, group: "numbers", icon: "i-link", w: 3, h: 2, min: [2, 2],
      title: "Open to anyone", desc: "How many of your files anyone or a guest can open." },
    ask: { cls: "ask", draw: drawAsk, group: "ask", icon: "i-chat", w: 12, h: 4,
      title: "Ask, or try an idea", desc: "Ask anything about your files and sites, with an idea for today.",
      show: canAsk, when: "Only people who can ask in this cabinet see it." },
    ideas: { cls: "lane ideas", list: true, draw: drawIdeasBox, group: "ask", icon: "i-bulb", w: 6, h: 5,

      show: function () { return !!state.setup; }, when: "Shows up once the setup page is in this cabinet." }
  };
  IDEAS.forEach(function (idea) {

      icon: idea.icon, w: 4, h: 3, title: idea.title, desc: idea.text };
  });
  var GROUPS = [
    { id: "files", title: "Your SharePoint" },
    { id: "numbers", title: "Numbers" },
    { id: "ask", title: "Ask and ideas" },
    { id: "single", title: "One idea" },
    { id: "you", title: "About you" }
  ];

  var PHONE = window.matchMedia ? window.matchMedia("(max-width: 720px)") : null;

  function phone() { return !!(PHONE && PHONE.matches); }
  function levelFor(width) { return width < 320 ? "S" : width < 640 ? "M" : "L"; }
  var LEVEL_WORDS = { S: "Small", M: "Medium", L: "Large" };
  /** The smallest a box may be made: wide and tall enough that what it shows still fits. */
  function minSize(id) { var m = BOXES[id].min || [3, 3]; return { w: m[0], h: m[1] }; }
  function whole(n) { return typeof n === "number" && n === Math.floor(n) && n >= 0; }

  /** A saved layout, keeping only entries that name a box we have and fit the grid. */
  function cleanLayout(value) {
    if (!Array.isArray(value)) return null;
    var seen = {};
    var out = value.filter(function (b) {
      var ok = !!(b && BOXES[b.id] && !seen[b.id] && whole(b.x) && whole(b.y) && whole(b.w) && whole(b.h) &&
        b.w >= 1 && b.h >= 1 && b.x + b.w <= COLS && b.h <= 40);
      if (ok) seen[b.id] = true;
      return ok;
    }).map(copyEntry);
    return out.length ? out : null;
  }
  /** One layout entry: its place on the grid, and on a phone its order (o) and size (p). */
  function copyEntry(b) {
    var out = { id: b.id, x: b.x, y: b.y, w: b.w, h: b.h };
    if (whole(b.o)) out.o = b.o;
    if (b.p === "S" || b.p === "M" || b.p === "L") out.p = b.p;
