id: morning-files
name: Morning files
enabled: true
cloudOnly: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: librarian
agentSlug: librarian
timeout: 900
prompt: |-
  Read SharePoint for the My files app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  SharePoint, what touches the person, the helper's commands, and how to spend little. Every
  call to SharePoint and every file the page reads goes through `node my-files/first-sort.mjs`
  (from the cabinet root, never `cd`).

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `my-files/setup.md`, and run `ls my-files/data/profile.json`.
  2. If your SharePoint line says SharePoint is not connected, write only
     `my-files/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  4. If the helper exits 3, SharePoint needs a new sign-in: run `done`, write the failed
     status with that why, and stop. If anything else fails after `start`, still run `done`.

  Only read SharePoint: never change, move, rename, share, check out or delete anything.

  Finish in one or two plain sentences and nothing else: how many of the person's files
  someone else changed, how many rows name them, and the one thing that matters most this
  morning.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-14T00:00:00.000Z'
