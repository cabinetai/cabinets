id: monthly-receipts
name: Receipts for the accountant
enabled: true
schedule: 0 8 1 * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: money-desk
agentSlug: money-desk
timeout: 900
prompt: |-
  Make last month's receipts list for the accountant.

  Your working directory is the cabinet root. Your persona's "Monthly receipts" holds what
  counts and the shape of the page.

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `money-desk/setup.md`.
  2. If your Gmail line says Gmail is not connected, write only
     `money-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Search Gmail at most twice for last month's receipts and paid bills. Open at most
     three emails.
  4. Write `reports/<YYYY-MM>-receipts.md` in one Bash call.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one plain sentence about the receipts and nothing else: how many, and what they
  add up to.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
