id: morning-money-sort
name: Morning money sort
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: money-desk
agentSlug: money-desk
timeout: 900
prompt: |-
  Sort this morning's money email for the Money desk app.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Gmail, the lists, the shape of each file, and how to spend little. Follow its order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'` and read
     `money-desk/setup.md` and, if it is there, `money-desk/data/latest.json` (the last
     sort).
  2. If your Gmail line says Gmail is not connected, write only
     `money-desk/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. Read Gmail: since the last sort when it is under 3 days old, otherwise the wider
     windows once. At most four searches and three opened emails. When nothing new
     arrived, keep the last sort's lists as they are.
     If `money-desk/data/profile.json` is not there, this is the first sort: follow "The
     first sort" in your persona. Save search results in `money-desk/data/.work/`, never
     `/tmp`. Write `money-desk/data/reading.json` first, push one line after each search
     with its number computed from the saved result (never typed by hand, never rewritten
     later), count the inbox and the money mail exactly with `--page-all` (never
     `resultSizeEstimate`), and at the end write `money-desk/data/profile.json`, fill the
     unanswered lines of `money-desk/setup.md` and set `done` in `reading.json`.
  4. In one Bash call, write `money-desk/data/latest.json` (and check it parses),
     `reports/<YYYY-MM-DD>-money.md` and `money-desk/data/status.json` with `ok: true`.

  Only read Gmail: never send, reply, draft, label, archive, mark read or delete.

  Finish in one or two plain sentences about the money and nothing else: what is owed and
  how much is late, what bills are due, and the one that matters most, if there is one.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
