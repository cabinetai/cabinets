<!doctype html>
<!--
  Company knowledge: what a small business keeps in Notion, at a glance.
  The procedures, client pages, policies, projects and meeting notes by area;
  what changed this week; what may be out of date; a box to ask anything; and
  ideas the business can use today. One file on purpose: on Cabinet Cloud a
  sealed frame cannot load anything next to it, so CSS, script and icons are
  inline, and fonts come from Google Fonts with system fallbacks.

  Data: the cabinet's routine writes library/data/latest.json (and latest.md,
  the readable copy). Until it has, the app shows library/data/EXAMPLE-latest.json,
  a made-up company, labelled as an example everywhere. It reads through
  window.cabinet v2 (docs/apps/BRIDGE.md in Cabinet); an older Cabinet gets the
  same files by a plain relative fetch and a line on where to connect Notion.

  The app never changes anything in Notion. Questions and ideas go to the
  cabinet's chat, where the librarian answers beside the app and asks before
  setting anything up.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Company knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
  :root {
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #676661;
    --paper: #ffffff;
    --tint: #f5f6f8;
    --rule: #e4e5e8;
    --rule-2: #cfd2d8;
    /* One colour per area, in this order everywhere. */
    --a-procedures: #2a78d6;
    --a-clients: #eb6834;
    --a-policies: #1baf7a;
    --a-projects: #eda100;
    --a-meetings: #e87ba4;
    --a-other: #aeb2ba;
    /* States, each shown with a word and an icon, never by colour alone. */
    --good: #0ca30c;
    --warn: #fab219;
    --critical: #d03b3b;
    --focus: #2a78d6;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .top { border-bottom: 1px solid var(--rule); background: var(--paper); }
  .top-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark { width: 30px; height: 30px; flex: none; }
  .brand-name { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-sub { color: var(--ink-2); font-size: 16px; white-space: nowrap; }
  .brand-sep { width: 1px; height: 18px; background: var(--rule-2); }
  .state { display: flex; align-items: center; gap: 14px; font-size: 16px; color: var(--ink-2); flex-wrap: wrap; justify-content: flex-end; }
  .state b { color: var(--ink); font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--a-other); display: inline-block; }
  .dot.good { background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.critical { background: var(--critical); }
  .state-words { display: inline-flex; align-items: center; gap: 9px; }
  .state .short { display: none; }

  /* ── Buttons ─────────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent;
    font: 600 16px/1.2 var(--sans); text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .btn[disabled] { cursor: default; opacity: 0.6; }
  .btn-ink { background: var(--ink); color: #fff; }
  .btn-ink:not([disabled]):hover { background: #2a2a2a; }
  .btn-line { background: var(--paper); color: var(--ink); border-color: var(--rule-2); }
  .btn-line:not([disabled]):hover { border-color: var(--ink); }
  .btn-white { background: #fff; color: var(--ink); }
  .btn-white:not([disabled]):hover { background: #ececec; }
  .btn-big { min-height: 52px; padding: 0 24px; font-size: 17px; border-radius: 12px; }
  .btn .notion-mark { width: 20px; height: 20px; }
  .spin { width: 20px; height: 20px; flex: none; animation: turn 0.9s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ── The band: what needs doing now ──────────────────────────────────── */
  #band:empty { display: none; }
  .band { background: var(--ink); color: #fff; }
  .band-in { display: flex; align-items: center; gap: 20px; padding: 18px 40px; max-width: 1200px; margin: 0 auto; }
  .band-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, 0.12); }
  .band-icon .i { width: 22px; height: 22px; stroke-width: 2.1; }
  .band-icon.good { color: #5ddc5d; } .band-icon.warn { color: var(--warn); } .band-icon.critical { color: #ff7a7a; }
  .band-text { flex: 1; min-width: 0; }
  .band-title { margin: 0; font-weight: 600; font-size: 18px; line-height: 1.35; }
  .band-line { margin: 2px 0 0; color: #d9d8d4; font-size: 16px; line-height: 1.45; }
  .band-tag {
    display: inline-block; margin-right: 10px; padding: 2px 9px; border-radius: 6px; vertical-align: 2px;
    border: 1px solid rgba(255, 255, 255, 0.55); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* ── Hero ────────────────────────────────────────────────────────────── */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; padding: 52px 0 0; align-items: end; }
  .overline {
    display: flex; align-items: center; gap: 10px; margin: 0 0 18px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
  }
  .overline .bars { display: inline-flex; gap: 3px; }
  .overline .bars span { width: 6px; height: 16px; border-radius: 2px; }
  h1 {
    margin: 0; font: 500 clamp(40px, 4.3vw, 56px) / 1.05 var(--serif);
    letter-spacing: -0.025em; font-variation-settings: "opsz" 72;
  }
  h1 em { font-style: italic; font-weight: 400; white-space: nowrap; }
  .intro { margin: 22px 0 0; max-width: 34em; font-size: 19px; line-height: 1.55; color: var(--ink-2); }
  .intro b { color: var(--ink); font-weight: 600; }
  .figures { border-top: 2px solid var(--ink); }
  .figure {
    display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 16px; width: 100%;
    min-height: 44px; padding: 16px 0 14px; border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; text-align: left; cursor: pointer;
  }
  .figure:hover .figure-label { color: var(--ink); }
  .figure-value { font: 600 48px/1 var(--sans); letter-spacing: -0.03em; }
  .figure-label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 16px; line-height: 1.35; }
  .figure-label .i { width: 18px; height: 18px; }
  .figure-label .warn-i { color: #b77d00; }
  .figure-label .good-i { color: var(--good); }
  .skel { display: inline-block; height: 40px; width: 70px; border-radius: 8px; background: var(--tint); }
  .figure .skel { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ── Ask ─────────────────────────────────────────────────────────────── */
  .ask {
    margin-top: 48px; padding: 30px 32px 26px; border: 1px solid var(--rule); border-radius: 20px;
    box-shadow: 0 1px 2px rgba(10, 12, 20, 0.04), 0 18px 40px -26px rgba(10, 12, 20, 0.28);
  }
  .ask-label { display: block; margin: 0 0 16px; font: 500 30px/1.15 var(--serif); letter-spacing: -0.015em; }
  .ask-row { display: flex; gap: 12px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .field .i { position: absolute; left: 20px; top: 50%; margin-top: -11px; width: 22px; height: 22px; color: var(--ink-3); pointer-events: none; }
  #ask {
    width: 100%; height: 64px; padding: 0 18px 0 56px; border: 1.5px solid var(--rule-2); border-radius: 14px;
    background: var(--paper); font-size: 19px; color: var(--ink);
  }
  #ask::placeholder { color: #7a7975; }
  #ask:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(42, 120, 214, 0.18); }
  .ask-row .btn { min-height: 64px; padding: 0 30px; font-size: 18px; border-radius: 14px; }
  .ask-note { margin: 12px 2px 0; font-size: 16px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ask-note:empty { display: none; }
  .ask-note .i { color: var(--good); }
  .matches { margin: 14px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
  .matches:empty { display: none; }
  .matches li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 2px; border-bottom: 1px solid var(--rule); }
  .matches .m-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .matches .m-area { color: var(--ink-2); white-space: nowrap; }
  .matches a { margin-left: auto; }
  .matches-head { margin: 16px 2px 0; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .try { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .try-label { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-right: 4px; }
  .chip {
    min-height: 44px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--rule-2);
    background: var(--paper); font-size: 16px; line-height: 1.3; text-align: left; cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .chip:hover { border-color: var(--ink); background: var(--tint); }

  /* ── Sections ────────────────────────────────────────────────────────── */
  .section { margin-top: 80px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 24px; }
  h2 { margin: 0; font: 500 36px/1.1 var(--serif); letter-spacing: -0.02em; }
  .section-meta { margin: 0; color: var(--ink-2); font-size: 16px; }
  .eg { display: inline-block; margin-left: 12px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--rule-2);
    font: 600 13px/1.4 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); vertical-align: 6px; }

  /* The areas as one bar, in the first screen; the legend under it names every colour. */
  .strip { margin-top: 40px; }
  .strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .strip-title { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  .strip-hint { margin: 0; font-size: 15px; color: var(--ink-2); }
  .bar { display: flex; gap: 2px; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 6px; }
  .legend button {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0; border: 0; background: none;
    font-size: 16px; cursor: pointer; color: var(--ink);
  }
  .legend b { font-weight: 600; }
  .legend .n { color: var(--ink-2); }
  .legend button:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .seg { position: relative; flex-grow: var(--n); flex-basis: 0; min-width: 6px; height: 34px; padding: 0; border: 0; background: transparent; cursor: pointer; }
  .seg::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 20px; background: var(--c); }
  .seg:first-child::before { border-radius: 4px 0 0 4px; }
  .seg:last-child::before { border-radius: 0 4px 4px 0; }
  .seg:only-child::before { border-radius: 4px; }
  .seg .tip {
    position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); z-index: 5;
    padding: 6px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 15px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.12s ease;
  }
  .seg:hover .tip, .seg:focus-visible .tip { opacity: 1; }
  .areas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .area {
    position: relative; display: flex; flex-direction: column; padding: 22px 22px 16px; border: 1px solid var(--rule);
    border-radius: 16px; background: var(--paper); text-align: left; overflow: hidden;
  }
  .area::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
  .area-head { display: flex; align-items: center; gap: 10px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; background: var(--c); }
  .area-name { font-weight: 600; font-size: 17px; }
  .area-count { margin-left: auto; font: 600 30px/1 var(--sans); letter-spacing: -0.02em; }
  .area-list { margin: 14px 0 6px; padding: 0; list-style: none; }
  .area-list li { display: flex; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 16px; }
  .area-list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .area-list .d { color: var(--ink-2); white-space: nowrap; }
  .area-empty { margin: 14px 0 6px; color: var(--ink-2); font-size: 16px; }
  .area .see { margin-top: auto; align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: none; font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
  .area .see:hover { text-decoration-color: var(--ink); }
  .area.ghost { min-height: 210px; background: var(--tint); border-color: var(--tint); }
  .area.ghost::before { display: none; }

  .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 80px; }
  .panel { border: 1px solid var(--rule); border-radius: 20px; padding: 28px 28px 22px; }
  .panel h2 { font-size: 30px; }
  .panel .section-head { margin-bottom: 8px; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 13px 0; border-top: 1px solid var(--rule); }
  .rows li:first-child { border-top: 0; }
  .when { font-weight: 600; font-size: 16px; color: var(--ink); padding-top: 1px; }
  .row-title { margin: 0; font-weight: 600; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .row-title a { text-decoration: none; }
  .row-title a:hover { text-decoration: underline; }
  .row-meta { margin: 3px 0 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; color: var(--ink-2); font-size: 16px; }
  .row-meta .swatch { width: 10px; height: 10px; }
  .inline-area { display: inline-flex; align-items: center; gap: 7px; }
  .stale-rows li { grid-template-columns: minmax(0, 1fr) auto; }
  .age { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 16px; white-space: nowrap; color: var(--ink); }
  .age .i { width: 18px; height: 18px; color: #b77d00; }
  .more-line { margin: 10px 0 0; color: var(--ink-2); font-size: 16px; }
  .panel-foot { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .panel-foot p { margin: 0; color: var(--ink-2); font-size: 16px; flex: 1; min-width: 12em; }
  .calm { margin: 10px 0 0; display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
  .calm .i { color: var(--good); }

  /* ── Ideas ───────────────────────────────────────────────────────────── */
  .ideas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .idea {
    display: flex; flex-direction: column; min-height: 270px; padding: 22px 22px 20px;
    border: 1px solid var(--rule); border-radius: 18px; background: var(--paper);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .idea:hover { border-color: var(--rule-2); box-shadow: 0 16px 32px -24px rgba(10, 12, 20, 0.35); }
  .idea-kind { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; color: var(--ink-2); font-size: 15px; font-weight: 500; }
  .idea-kind .swatch { width: 10px; height: 10px; }
  .idea h3 { margin: 0; font: 600 23px/1.2 var(--serif); letter-spacing: -0.01em; }
  .idea p { margin: 10px 0 18px; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
  /* Room for two rows of buttons in every card, so "Ask now" lines up across the row. */
  .idea-actions { margin-top: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 96px; }
  .idea-actions .btn { padding: 0 14px; }
  .fine { margin: 18px 2px 0; color: var(--ink-2); font-size: 16px; }

  /* ── All pages ───────────────────────────────────────────────────────── */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .filter {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--rule-2); background: var(--paper); font-size: 16px; cursor: pointer;
  }
  .filter .n { color: var(--ink-2); }
  .filter[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .filter[aria-pressed="true"] .n { color: #d9d8d4; }
  .table { border-top: 2px solid var(--ink); }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 170px 170px 110px; gap: 20px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .trow.head { padding: 10px 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .t-title { margin: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .t-title a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .t-title a:hover { text-decoration: underline; }
  .t-title .i { width: 16px; height: 16px; color: var(--ink-3); }
  .t-about { margin: 3px 0 0; color: var(--ink-2); font-size: 16px; }
  .t-cell { color: var(--ink-2); font-size: 16px; }
  .t-area { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
  .table-more { display: flex; justify-content: center; margin-top: 22px; }

  .foot { margin-top: 90px; padding: 28px 0 48px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 16px; }
  .foot p { margin: 4px 0; }
  .loading { padding: 80px 0; text-align: center; color: var(--ink-2); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; z-index: 50; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; max-width: min(640px, calc(100vw - 32px));
    padding: 12px 12px 12px 18px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 16px;
    box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.45);
  }
  .toast p { margin: 0; }
  .toast .btn { flex: none; }

  .wide { display: inline; }
  @media (max-width: 1100px) {
    .wide { display: none; }
    .ideas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; }
  }
  @media (max-width: 900px) {
    .wrap, .band-in { padding-left: 24px; padding-right: 24px; }
    .hero { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-top: 40px; }
    .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two { grid-template-columns: minmax(0, 1fr); }
    .trow { grid-template-columns: minmax(0, 1fr) 150px 100px; }
    .trow .t-editor { display: none; }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .wrap, .band-in { padding-left: 16px; padding-right: 16px; }
    .top-in { min-height: 60px; }
    .brand-sub, .brand-sep, .state .state-when, .state .long, .strip-hint { display: none; }
    .state .short { display: inline; }
    .state .btn { padding: 0 12px; }
    .state .btn .label { display: none; }
    .brand-name { font-size: 16px; }
    .chip { border-radius: 14px; }
    .area-list li:nth-child(3) { display: none; }
    .band-in { flex-wrap: wrap; gap: 14px; padding-top: 16px; padding-bottom: 16px; }
    .band-in .band-icon { display: none; }
    .band-in .btn { width: 100%; }
    .hero { padding-top: 28px; gap: 24px; }
    .overline { font-size: 13px; }
    .intro { font-size: 17px; margin-top: 16px; }

      }
      if (n) append(card, h("button", { class: "see", type: "button", onclick: function () { showArea(a.id); } },
        n > 3 ? "See all " + n : "See " + (n === 1 ? "it" : "them")));
      append(cards, card);
    });
  }
  function showArea(id) {
    S.area = id;
    S.showAll = false;
    renderContents(shown());
    go("contents");
  }

  function metaLine(p, withWhen, ref) {
    return h("p", { class: "row-meta" },
      h("span", { class: "inline-area" }, h("span", { class: "swatch", style: "--c:" + p.area.c }), areaName(p.area)),
      p.editor ? h("span", { dir: "auto", text: (withWhen ? "" : "Last edited by ") + p.editor }) : null,
      withWhen && p.edited ? h("span", { text: shortDate(p.edited) }) : null);
  }
  function titleNode(p, example, cls) {
    var inner = p.url && !example
      ? h("a", { href: p.url, target: "_blank", rel: "noopener noreferrer", dir: "auto", title: "Open in Notion" }, p.title)
      : h("span", { dir: "auto", text: p.title });
    return h("p", { class: cls }, inner);
  }

  function renderWeekAndStale(view) {
    var two = $("two");
    two.hidden = !view;
    if (!view) return;
    var d = view.d;
    var ref = reference(d);
    var box = $("changed");
    box.textContent = "";
    var week = changedThisWeek(d);
    append(box, h("div", { class: "section-head" }, h("h2", null, "Changed this week", exampleTag(view))));
    if (!week.length) {
      append(box, h("p", { class: "calm" }, icon("i-check"), "Nothing changed in the last seven days."));
    } else {
      var rows = h("ul", { class: "rows" });
      week.slice(0, 8).forEach(function (p) {
        append(rows, h("li", null, h("span", { class: "when", text: whenWord(p.edited, ref) }),
          h("div", null, titleNode(p, view.example, "row-title"),
            h("p", { class: "row-meta" },
              h("span", { class: "inline-area" }, h("span", { class: "swatch", style: "--c:" + p.area.c }), areaName(p.area)),
              p.editor ? h("span", { dir: "auto", text: p.editor }) : null))));
      });
      append(box, rows);
      if (week.length > 8) append(box, h("p", { class: "more-line", text: "And " + plural(week.length - 8, "more page", "more pages") + "." }));
    }
    var weekIdea = IDEAS[4];
    if (askable() && week.length) {
      append(box, h("div", { class: "panel-foot" }, h("p", { text: "Want this for the team, every Monday?" }),
        h("button", { class: "btn btn-line", type: "button", onclick: function () { ask(weekIdea.ask); } }, "Write the update")));
    }

    var old = $("stale");
    old.textContent = "";
    var list = staleList(d);
    append(old, h("div", { class: "section-head" }, h("h2", null, "May be out of date", exampleTag(view))));
    if (!list.length) {
      append(old, h("p", { class: "calm" }, icon("i-check"), "Every procedure and policy was edited in the last six months."));
      return;
    }
    append(old, h("p", { class: "section-meta", text: "Procedures and policies nobody has touched in over six months. These are the ones most likely to be wrong." }));
    var rows2 = h("ul", { class: "rows stale-rows" });
    list.slice(0, 6).forEach(function (p) {
      append(rows2, h("li", null,
        h("div", null, titleNode(p, view.example, "row-title"), metaLine(p, false, ref)),
        p.edited ? h("span", { class: "age", title: "Last edited " + shortDate(p.edited) }, icon("i-alert"), ageWords(p.edited, ref)) : null));
    });
    append(old, rows2);
    if (d.staleTotal > 6) append(old, h("p", { class: "more-line", text: "And " + plural(d.staleTotal - 6, "more", "more") + " in All pages below." }));
    if (askable()) {
      append(old, h("div", { class: "panel-foot" }, h("p", { text: "Get a list of who should check each one." }),
        h("button", { class: "btn btn-ink", type: "button", onclick: function () { ask(IDEAS[0].ask); } }, "Make a review list")));
    }
  }

  function renderIdeas() {
    var section = $("ideas-section");
    var st = state();
    section.hidden = !shown() && st !== "connected";
    if (section.hidden) return;
    var grid = $("ideas");
    grid.textContent = "";
    var acts = askable();
    // A phone shows four ideas first, so the page stays short.
    var phone = window.matchMedia("(max-width: 640px)").matches;
    var list = phone && !S.allIdeas ? IDEAS.slice(0, 4) : IDEAS;
    list.forEach(function (idea) {
      var a = idea.area ? AREAS[AREA_INDEX[idea.area.toLowerCase()]] : null;
      var actions = null;
      if (acts) {
        actions = h("div", { class: "idea-actions" },
          h("button", { class: "btn btn-ink", type: "button", onclick: function () { ask(idea.ask); } }, "Ask now", icon("i-arrow")),
          idea.every ? h("button", { class: "btn btn-line", type: "button", "aria-label": idea.every.label + ": " + idea.title,
            onclick: function () { ask(idea.every.ask, "routine"); } }, icon("i-repeat"), idea.every.label) : null);
      }
      append(grid, h("article", { class: "idea" },
        h("p", { class: "idea-kind" }, a ? h("span", { class: "swatch", style: "--c:" + a.c }) : h("span", { class: "swatch", style: "--c:var(--ink)" }),
          a ? a.id : "Your whole Notion"),
        h("h3", { text: idea.title }),
        h("p", { text: idea.line }),
        actions));
    });
    if (list.length < IDEAS.length) {
      append(grid, h("button", { class: "btn btn-line", type: "button", onclick: function () { S.allIdeas = true; renderIdeas(); } },
        plural(IDEAS.length - list.length, "more idea", "more ideas")));
    }
    $("ideas-fine").textContent = acts
      ? "“Every Monday” and “Every month” ask the librarian to set it up as a routine. You approve it in the chat."
      : S.mode === "v2" ? "People who can edit this cabinet can ask for these from here." : "Ask for any of these in the cabinet's chat.";
  }

  function renderContents(view) {
    var section = $("contents");
    section.hidden = !view;
    if (!view) return;
    var d = view.d;
    var all = merged(d.pages, d.stale);
    var title = $("contents-title");
    title.textContent = "All pages";
    append(title, exampleTag(view));
    var extra = d.total > all.length ? d.total - all.length : 0;
    $("contents-meta").textContent = extra
      ? "The " + all.length + " most recent of " + d.total + ", and every one that may be out of date."
      : plural(all.length, "page", "pages and tables") + ", newest first.";
    var counts = {};
    all.forEach(function (p) { counts[p.area.id] = (counts[p.area.id] || 0) + 1; });
    if (S.area !== "All" && !counts[S.area]) S.area = "All";
    var filters = $("filters");
    filters.textContent = "";
    function filter(id, label, n, c) {
      return h("button", { class: "filter", type: "button", "aria-pressed": S.area === id ? "true" : "false",
        onclick: function () { S.area = id; S.showAll = false; renderContents(shown()); } },
        c ? h("span", { class: "swatch", style: "--c:" + c }) : null, label, h("span", { class: "n", text: String(n) }));
    }
    append(filters, filter("All", "All", all.length, null));
    AREAS.forEach(function (a) { if (counts[a.id]) append(filters, filter(a.id, a.id, counts[a.id], a.c)); });

    var list = all.filter(function (p) { return S.area === "All" || p.area.id === S.area; })
      .sort(function (a, b) { return (b.edited || 0) - (a.edited || 0) || a.key - b.key; });
    var table = $("table");
    table.textContent = "";
    append(table, h("div", { class: "trow head", "aria-hidden": "true" },
      h("span", { text: "Page" }), h("span", { text: "Area" }), h("span", { class: "t-editor", text: "Last edited by" }), h("span", { text: "Edited" })));
    var cap = window.matchMedia("(max-width: 640px)").matches ? 10 : 20;
    var visible = S.showAll ? list : list.slice(0, cap);
    visible.forEach(function (p) {
      var titleEl = p.url && !view.example
        ? h("a", { href: p.url, target: "_blank", rel: "noopener noreferrer", "aria-label": p.title + ", open in Notion" },
          h("span", { dir: "auto", text: p.title }), icon("i-out"))
        : h("span", { dir: "auto", text: p.title });
      append(table, h("div", { class: "trow" },
        h("div", null, h("p", { class: "t-title" }, titleEl),
          p.about ? h("p", { class: "t-about", dir: "auto", text: p.about }) : null),
        h("span", { class: "t-cell" }, h("span", { class: "t-area" }, h("span", { class: "swatch", style: "--c:" + p.area.c }), areaName(p.area))),
        h("span", { class: "t-cell t-editor", dir: "auto", text: p.editor || "" }),
        h("span", { class: "t-cell", text: p.edited ? shortDate(p.edited) : "" })));
    });
    var more = $("table-more");
    more.textContent = "";
    more.hidden = visible.length >= list.length;
    if (!more.hidden) {
      append(more, h("button", { class: "btn btn-line", type: "button", onclick: function () { S.showAll = true; renderContents(shown()); } },
        "Show all " + list.length));
    }
  }

  function lowerFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function renderFoot() {
    var foot = $("foot");
    foot.textContent = "";
    append(foot, h("p", { text: "This only reads your Notion. Nothing there is ever changed from here." }));
    if (S.job && S.job.when && state() !== "not-available-here") append(foot, h("p", { text: "A fresh overview " + lowerFirst(S.job.when) + "." }));
  }

  // ── Wiring ────────────────────────────────────────────────────────────────
  var typing = 0;
  $("ask").addEventListener("input", function (e) {
    S.q = e.target.value;
    clearTimeout(typing);
    typing = setTimeout(renderMatches, 80);
  });
  $("ask-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var words = $("ask").value.trim();
    if (!words) { $("ask").focus(); return; }
    ask(words);
  });

  function startV2() {
    var ready = cab.ready ? Promise.race([cab.ready, wait(4000)]) : Promise.resolve();
    return ready.then(function () { return Promise.resolve(cab.here()); }).then(function (here) {
      S.mode = "v2";
      if (here && typeof here.appPath === "string" && here.appPath) S.appPath = here.appPath;
      if (here && here.role) S.role = here.role;
      cab.connectors.onChange(function (list) { S.connector = pickNotion(list) || S.connector; render(); });
      cab.jobs.onChange(onJobs);
      try { cab.files.onChange(S.appPath + "/data", function () { loadData(); }); } catch (e) { /* the overview still loads once */ }
      cab.connectors.list().then(function (list) { S.connector = pickNotion(list); S.connectorFailed = !S.connector; render(); },
        function () { S.connectorFailed = true; render(); });
      cab.jobs.list().then(function (list) { S.job = pickJob(list); render(); }, function () { /* no routine to show */ });
      return loadData();
    }, function () {
      // Inside a page that is not in Cabinet, or a Cabinet without v2: read the files directly.
      return startOld();
    });
  }
  function startOld() {
    S.mode = "old";
    setInterval(function () { if (document.visibilityState === "visible") loadData(); }, 5 * 60 * 1000);
    return loadData();
  }

  if (cab && cab.connectors && typeof cab.here === "function") startV2();
  else startOld();
  // Keeps "Updated 8:02 this morning" true as the day goes on.
  setInterval(function () { if (S.loaded) renderState(); }, 60 * 1000);
})();
</script>
</body>
</html>
