id: morning-notion-library
name: Morning Notion Library
enabled: true
schedule: 0 8 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: notion-librarian
agentSlug: notion-librarian
timeout: 600
prompt: |-
  Write this morning's listing of the Notion pages the user shared.

  Your working directory is the cabinet root. Every summary lives in `daily-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-notion-summary.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and opens the
  newest, so a name in any other shape is a summary nobody will see. You only ever ADD a
  file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Updated` vocabulary and the tone. This prompt does not repeat them.
  2. With your Notion tools, list every page and database shared with this connection.
     Open each one far enough to say in one short line what it holds — no further.
  3. This run is read only. Do not create, edit, comment on or move anything in Notion,
     however tempting the tidy-up looks.
  4. If you have no Notion tool, or Notion is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `daily-summaries/` exactly as you found it, example and all.
     Report: "Notion is not reachable. I would have listed every page and database shared
     with Cabinet, one row each, newest first." Then exit.
  5. On the first run that does reach Notion, write your dated file and then delete
     `daily-summaries/EXAMPLE-notion-summary.md`. It is a demo, not a past summary, and it
     must not sit in the date list beside real ones. Do not merge with it, do not rename
     it, and never write `EXAMPLE` into a name of your own.
