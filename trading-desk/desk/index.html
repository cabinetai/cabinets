<!DOCTYPE html>
<!--
  Trading Desk: the page this cabinet opens on.

  Five screens: Today (what matters now), Charts (any symbol, with your lines),
  Trades (plan, open, closed: one record from idea to result), Review (what your own
  numbers say) and Alerts (the rules that decide a chart is worth a look).

  Where things come from:
    1. desk/data/*.json, written by desk/engine/refresh.mjs: prices, daily candles,
       signals, the calendar, movers, headlines. DATA.md is the map of those files.
    2. The desk's small server (desk/engine/server.mjs), once the person allowed it:
       a chart for any symbol at any size, a search, a refresh now.
    3. The app's own store (window.cabinet.store, kept in desk/.data/shared.json):
       everything the person enters here. Profile, list, rules, lines, plans, trades.
    4. briefs/ and reviews/ at the cabinet's root, written by the assistants.

  The page reads prices. It cannot place an order, and neither can anything else here.
  Charts are drawn by TradingView's open-source Lightweight Charts, which is kept inside
  this file. Google Fonts are the only request that leaves Cabinet from this page.
  One file on purpose: a sealed frame cannot load files next to it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --desk: #EEE9DF; --sheet: #FFFFFF; --sheet-2: #F8F6F1; --press: #EFEBE3; --hover: #F4F1EA;
    --ink: #1E1A15; --ink-2: #4B453C; --muted: #6E675B; --faint: #A39C8F;
    --line: rgba(64, 48, 20, .11); --line-2: rgba(64, 48, 20, .06);
    --brand: #3B2F2F; --on-brand: #FFFFFF; --brand-soft: #EFE7DA; --on-fill: #FFFFFF; --veil: rgba(30, 22, 12, .32);
    --up: #12783A; --up-tint: #E4F3E9; --down: #C2321F; --down-tint: #FBE9E5;
    --warn: #96600C; --warn-tint: #FAF0DA; --info: #2B5C9E; --info-tint: #E6EEF8;
    --grid: rgba(64, 48, 20, .07); --ma20: #C98A1B; --ma50: #2B6CB0; --ma200: #8B5CC7; --vwap: #0E8F8F;
    --radius: 18px; --radius-s: 11px;
    --shadow: 0 1px 2px rgba(59, 47, 47, .05), 0 8px 24px -14px rgba(59, 47, 47, .22);
    --shadow-up: 0 2px 6px rgba(59, 47, 47, .08), 0 24px 60px -20px rgba(59, 47, 47, .38);
    --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --ring: 0 0 0 3px rgba(59, 47, 47, .22);
    --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --desk: #131110; --sheet: #1D1A17; --sheet-2: #23201C; --press: #2E2A25; --hover: #27231F;
    --ink: #F0EBE3; --ink-2: #CFC8BC; --muted: #9E968A; --faint: #6F685E;
    --line: rgba(255, 240, 215, .11); --line-2: rgba(255, 240, 215, .06);
    --brand: #EADFCB; --on-brand: #1E1A15; --brand-soft: #2F2A23; --on-fill: #131110; --veil: rgba(0, 0, 0, .5);
    --up: #4CC38A; --up-tint: #16301F; --down: #FF7B6B; --down-tint: #3A1B17;
    --warn: #E6B45C; --warn-tint: #33280F; --info: #86B2EC; --info-tint: #17263A;
    --grid: rgba(255, 240, 215, .06); --ma20: #E0A63C; --ma50: #6AA5E8; --ma200: #B58CE8; --vwap: #3FC1C1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 240, 215, .04);
    --shadow-up: 0 2px 6px rgba(0, 0, 0, .4), 0 24px 60px -20px rgba(0, 0, 0, .9);
    --ring: 0 0 0 3px rgba(234, 223, 203, .28);
    color-scheme: dark;
  }
  /* Up and down that do not lean on red against green. */
  :root[data-colors="safe"] { --up: #1D66C2; --up-tint: #E3EDFA; --down: #9C4A00; --down-tint: #FBEBDA; }
  :root[data-theme="dark"][data-colors="safe"] { --up: #6FA8F2; --up-tint: #16263B; --down: #F2A14B; --down-tint: #38260F; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.45 var(--font); letter-spacing: -.006em; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  ::selection { background: var(--brand-soft); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: .85; }
  input, textarea { caret-color: var(--brand); }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; }
  svg.i { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
  html[data-read] [data-write] { display: none !important; }

  /* ── The desk: chrome sits on it, sheets float over it ─────────────────── */
  #app { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 16px 8px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex: none; }
  .brand h1 { font: 650 19px/1.1 var(--font); letter-spacing: -.025em; white-space: nowrap; }
  .clock { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; line-height: 1.2; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .clock i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .clock[data-s="open"] i { background: var(--up); box-shadow: 0 0 0 3px var(--up-tint); }
  .clock[data-s="pre"] i, .clock[data-s="after"] i { background: var(--warn); }
  .tabs { display: flex; gap: 2px; margin-left: 6px; padding: 3px; border-radius: 12px; background: var(--line-2); }
  .tab { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; color: var(--muted); transition: color 150ms ease, transform 140ms var(--ease-out); }
  .tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
  .tab:active { transform: scale(.97); }
  .tab .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: var(--on-brand); font: 600 11px/18px var(--mono); text-align: center; }
  .top .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 10px; font-weight: 500; white-space: nowrap; background: var(--sheet); box-shadow: var(--shadow); transition: transform 140ms var(--ease-out), background-color 150ms ease; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: none; font-weight: 600; }
  .btn.quiet { background: transparent; box-shadow: none; color: var(--ink-2); }
  .btn.small { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
  .btn.danger { color: var(--down); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (hover: hover) and (pointer: fine) {
    .btn.quiet:hover, .tab:hover { color: var(--ink); }
    .btn:not(.primary):not(.quiet):hover { background: var(--hover); }
    .row:hover, .wrow:hover { background: var(--hover); }
  }

  /* The strip: the market's vital signs, always in view. */
  .strip { flex: none; display: flex; gap: 0; padding: 0 18px 12px; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .tick { flex: none; display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: center; padding: 4px 14px 4px 2px; border-radius: 10px; text-align: left; transition: transform 140ms var(--ease-out); }
  .tick + .tick { padding-left: 14px; box-shadow: -1px 0 0 var(--line); border-radius: 0; }
  .tick:active { transform: scale(.98); }
  .tick b { display: block; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tick .p { font: 500 13.5px/1.2 var(--mono); letter-spacing: -.02em; }
  .tick .c { font: 500 12px/1 var(--mono); }
  .tick svg { grid-row: span 2; width: 54px; height: 26px; }

  .view { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; }
  .sheet { background: var(--sheet); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card { padding: 16px 18px; }
  .card > header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card h2 { font: 600 15px/1.2 var(--font); letter-spacing: -.01em; }
  .card header .sub { color: var(--muted); font-size: 12.5px; }
  .card header .grow { flex: 1; }
  .empty { padding: 18px 6px; color: var(--muted); text-align: center; }
  .empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-s); background: var(--warn-tint); color: var(--ink); font-size: 13px; }
  .note.info { background: var(--info-tint); } .note.bad { background: var(--down-tint); } .note.good { background: var(--up-tint); }
  .note svg { color: var(--warn); margin-top: 1px; } .note.info svg { color: var(--info); } .note.bad svg { color: var(--down); } .note.good svg { color: var(--up); }
  .note .grow { flex: 1; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--press); color: var(--ink-2); white-space: nowrap; }
  .chip.long { background: var(--up-tint); color: var(--up); } .chip.short { background: var(--down-tint); color: var(--down); }
  .chip.ex { background: var(--warn-tint); color: var(--warn); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--press); gap: 2px; }
  .seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); transition: transform 140ms var(--ease-out); }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
  .seg button:active { transform: scale(.96); }
  .term { border-bottom: 1px dotted var(--faint); cursor: help; }

  /* ── Today ─────────────────────────────────────────────────────────────── */
  .today { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .guard { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
  .guard .state { display: flex; align-items: center; gap: 10px; }
  .guard .lamp { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--up-tint); color: var(--up); }
  .guard[data-s="slow"] .lamp { background: var(--warn-tint); color: var(--warn); } .guard[data-s="stop"] .lamp { background: var(--down-tint); color: var(--down); }
  .guard .state b { display: block; font-size: 15px; } .guard .state span { color: var(--muted); font-size: 12.5px; }
  .meter { height: 8px; border-radius: 4px; background: var(--press); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--up); transform-origin: left; transition: transform 300ms var(--ease-out); }
  .guard[data-s="slow"] .meter i { background: var(--warn); } .guard[data-s="stop"] .meter i { background: var(--down); }
  .guard .nums { display: flex; gap: 18px; }
  .stat b { display: block; font: 500 16px/1.2 var(--mono); letter-spacing: -.02em; } .stat span { font-size: 12px; color: var(--muted); }
  .setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .steps li { display: flex; gap: 10px; align-items: center; }
  .steps .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--up); }
  .steps .mark svg { width: 13px; height: 13px; }
  .steps .done .mark { background: var(--up-tint); border-color: transparent; }
  .steps .grow { flex: 1; min-width: 0; }
  .steps .done b { color: var(--muted); font-weight: 500; }
  .steps p { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; }
  .steps .done p { display: none; }
  [data-level="pro"] .sig .mean, [data-level="pro"] .ideas { display: none; }

  .sig { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; padding: 12px; margin: 0 -8px; border-radius: 14px; }
  .sig + .sig { margin-top: 2px; }
  .sig canvas { width: 132px; height: 74px; border-radius: 9px; background: var(--sheet-2); cursor: pointer; }
  .sig .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sig .sym { font: 600 14.5px/1 var(--mono); letter-spacing: -.02em; }
  .sig .what { font-weight: 600; }
  .sig p { color: var(--ink-2); margin: 5px 0 8px; font-size: 13.5px; }
  .sig .mean { color: var(--muted); font-size: 12.5px; margin: -3px 0 8px; }
  .sig .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .sig .scout { margin: 0 0 8px; padding: 8px 10px; border-radius: 9px; background: var(--brand-soft); font-size: 13px; }
  .sig .scout b { font-weight: 600; }
  .daylabel { margin: 16px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .daylabel:first-child { margin-top: 0; }

  .brief { font: 400 15.5px/1.62 var(--serif); color: var(--ink); max-width: 68ch; }
  .brief h3 { font: 600 16px/1.3 var(--serif); margin: 14px 0 4px; } .brief h3:first-child { margin-top: 0; }
  .brief p { margin: 0 0 8px; } .brief ul { margin: 0 0 8px; padding-left: 20px; } .brief li { margin-bottom: 3px; }
  .brief table { border-collapse: collapse; font: 13px/1.4 var(--font); margin: 6px 0 10px; } .brief td, .brief th { padding: 4px 10px 4px 0; text-align: left; border-bottom: 1px solid var(--line-2); }
  .brief code { font: 13px var(--mono); }

  .row { display: grid; align-items: center; gap: 10px; width: 100%; padding: 8px; margin: 0 -8px; border-radius: 10px; text-align: left; transition: transform 140ms var(--ease-out); }
  button.row:active { transform: scale(.99); }
  .row .s { font: 600 13.5px/1.2 var(--mono); letter-spacing: -.02em; } .row small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r { text-align: right; font: 500 13px/1.3 var(--mono); letter-spacing: -.02em; }
  .pos { grid-template-columns: minmax(0, 1fr) 150px auto; }
  .track { position: relative; height: 22px; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 1px; background: var(--press); }
  .track i { position: absolute; top: 5px; width: 2px; height: 12px; border-radius: 1px; background: var(--faint); }
  .track i.stop { background: var(--down); } .track i.target { background: var(--up); }
  .track i.now { top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--sheet); }
  .cal { grid-template-columns: 58px minmax(0, 1fr) auto; }
  .cal .when { font: 500 12px/1.35 var(--font); font-variant-numeric: tabular-nums; color: var(--muted); }
  .imp { font-size: 12px; font-weight: 600; color: var(--warn); white-space: nowrap; } .imp.High { color: var(--down); }
  .mov { grid-template-columns: minmax(0, 1fr) auto auto; }
  .hold { grid-template-columns: minmax(0, 1fr) auto 64px; }
  .att { grid-template-columns: 82px minmax(0, 1fr); align-items: start; }
  .att p, .spot p { font-size: 13px; line-height: 1.45; color: var(--ink-2); margin-top: 2px; }
  .spot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .spot .row { grid-template-columns: minmax(0, 1fr) auto auto; align-items: start; }
  .chip.warn { background: var(--warn-tint); color: var(--warn); }
  .acct .worth { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .acct .worth b { font: 500 30px/1.1 var(--mono); letter-spacing: -.035em; }
  .acct .worth span { font: 500 13px/1.3 var(--mono); letter-spacing: -.02em; }
  .acct .nums { display: flex; gap: 22px; margin-bottom: 6px; }
  .acct .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .pitch p { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; max-width: 46ch; }
  .pitch p b { color: var(--ink); }
  .pitch small { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet-2); }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .idea { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--press); color: var(--ink-2); font-size: 12.5px; transition: transform 140ms var(--ease-out); }
  .idea:active { transform: scale(.97); }

  /* ── Charts ────────────────────────────────────────────────────────────── */
  .charts { display: grid; grid-template-columns: 232px minmax(0, 1fr) 280px; gap: 14px; height: 100%; }
  .charts > * { min-height: 0; }
  .watch { display: flex; flex-direction: column; padding: 12px 10px; }
  .find { position: relative; margin: 0 2px 8px; }
  .find input { width: 100%; height: 34px; padding: 0 10px 0 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet-2); }
  .find svg { position: absolute; left: 9px; top: 9px; color: var(--muted); }
  .found { position: absolute; z-index: 5; left: 0; right: 0; top: 38px; padding: 5px; border-radius: 12px; background: var(--sheet); box-shadow: var(--shadow-up); transform-origin: top center; animation: pop 150ms var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .found button { display: block; width: 100%; padding: 7px 9px; border-radius: 8px; text-align: left; }
  .found button[data-on], .found button:hover { background: var(--hover); }
  .found b { font: 600 13px var(--mono); } .found small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wlist { flex: 1; overflow: auto; margin: 0 -2px; padding: 0 2px; }
  .wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 7px 9px; border-radius: 10px; text-align: left; }
  .wrow[aria-current="true"] { background: var(--press); }
  .wrow .s { font: 600 13px/1.2 var(--mono); letter-spacing: -.02em; display: flex; align-items: center; gap: 5px; } .wrow small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow .r { text-align: right; font: 500 12.5px/1.3 var(--mono); letter-spacing: -.02em; }
  .wrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .stage { display: flex; flex-direction: column; overflow: hidden; }
  .chead { display: flex; align-items: center; gap: 12px; padding: 14px 18px 8px; flex-wrap: wrap; }
  .chead .name { min-width: 0; } .chead .name b { font: 600 17px/1.2 var(--mono); letter-spacing: -.02em; } .chead .name small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .chead .px { font: 500 22px/1.1 var(--mono); letter-spacing: -.03em; } .chead .ch { font: 500 13px/1.2 var(--mono); }
  .chead .ext { font-size: 12px; color: var(--muted); }
  .ctools { display: flex; align-items: center; gap: 8px; padding: 0 18px 10px; flex-wrap: wrap; }
  .tog { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: var(--muted); background: var(--press); transition: transform 140ms var(--ease-out); }
  .tog i { width: 10px; height: 3px; border-radius: 2px; background: currentColor; }
  .tog[aria-pressed="true"] { color: var(--ink); background: var(--brand-soft); } .tog:active { transform: scale(.96); }
  .plot { position: relative; flex: 1; min-height: 240px; }
  .plot > div { position: absolute; inset: 0; }
  .plot .msg { display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); z-index: 2; background: var(--sheet); }
  .plot[data-draw] { cursor: crosshair; }
  .plot > .legend { position: absolute; inset: 6px auto auto 14px; z-index: 3; font: 500 12px var(--mono); color: var(--muted); pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; }
  .side { overflow: auto; padding: 14px 16px; display: grid; gap: 16px; align-content: start; }
  .side h3 { font: 600 13px/1.2 var(--font); color: var(--ink); margin-bottom: 8px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .fact > span { display: block; font-size: 12px; color: var(--muted); } .fact b { font: 500 14px/1.3 var(--mono); letter-spacing: -.02em; }
  .range { grid-column: span 2; } .range .bar { position: relative; height: 6px; border-radius: 3px; background: var(--press); margin: 6px 0 4px; }
  .range .bar i { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--sheet); }
  .range .ends { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
  .lines li, .heads li { display: flex; align-items: center; gap: 8px; padding: 5px 0; } .lines, .heads { list-style: none; margin: 0; padding: 0; }
  .lines input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; font-size: 13px; } .lines input:hover, .lines input:focus { border-color: var(--line); background: var(--sheet-2); }
  .heads a { text-decoration: none; font-size: 13px; line-height: 1.35; display: block; } .heads a:hover { text-decoration: underline; } .heads small { color: var(--muted); font-size: 12px; }
  .x { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); flex: none; } .x:hover { background: var(--press); color: var(--ink); }

  /* ── Trades and Review ─────────────────────────────────────────────────── */
  .bar2 { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar2 .grow { flex: 1; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 0 10px 8px; white-space: nowrap; }
  table.t td { padding: 10px; border-top: 1px solid var(--line-2); vertical-align: middle; }
  table.t tr.go { cursor: pointer; } table.t tr.go:hover td { background: var(--hover); }
  table.t .n { text-align: right; font: 500 13px var(--mono); letter-spacing: -.02em; white-space: nowrap; }
  table.t .s { font: 600 13.5px var(--mono); letter-spacing: -.02em; }
  .tiles { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(5, minmax(0, 1fr)); gap: 6px 22px; padding: 18px 20px; margin-bottom: 14px; align-items: end; }
  .tile span { font-size: 12.5px; color: var(--muted); } .tile b { display: block; font: 500 19px/1.25 var(--mono); letter-spacing: -.03em; margin-top: 2px; } .tile small { display: block; color: var(--muted); font-size: 12px; }
  .tile.lead b { font-size: 34px; line-height: 1.1; }
  .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; align-items: start; }
  .curve { width: 100%; height: 252px; display: block; }
  .bd { display: grid; grid-template-columns: minmax(90px, 1.1fr) 2fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bd .bar { height: 14px; position: relative; } .bd .bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .bd .bar i { position: absolute; top: 2px; height: 10px; border-radius: 3px; }
  .bd small { color: var(--muted); }
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .heat div { aspect-ratio: 1.5; border-radius: 6px; background: var(--sheet-2); display: grid; place-items: center; font: 500 12px var(--font); font-variant-numeric: tabular-nums; color: var(--muted); }
  .heat .hd { background: none; aspect-ratio: auto; font-family: var(--font); }

  /* ── Alerts ────────────────────────────────────────────────────────────── */
  .alerts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: start; }
  .rule { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line-2); }
  .rule:first-of-type { border-top: 0; }
  .rule b { font-weight: 600; } .rule p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .rule .rec { color: var(--ink); font-size: 12.5px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .sig .rec { color: var(--muted); font-size: 12.5px; margin: -3px 0 8px; }
  .rule .params { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .rule .params input { width: 58px; height: 26px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--sheet-2); font: 13px var(--mono); text-align: right; }
  .sw { position: relative; width: 36px; height: 22px; border-radius: 11px; background: var(--press); transition: background-color 150ms ease; flex: none; margin-top: 1px; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform 180ms var(--ease-out); }
  .sw[aria-checked="true"] { background: var(--up); } .sw[aria-checked="true"]::after { transform: translateX(14px); }

  /* ── Sheets that slide over the page ───────────────────────────────────── */
  .veil { position: fixed; inset: 0; z-index: 20; background: var(--veil); opacity: 0; transition: opacity 220ms ease; }
  .drawer { position: fixed; z-index: 21; top: 10px; right: 10px; bottom: 10px; width: min(460px, calc(100vw - 20px)); display: flex; flex-direction: column; background: var(--sheet); border-radius: var(--radius); box-shadow: var(--shadow-up); transform: translateX(calc(100% + 20px)); transition: transform 320ms var(--ease-drawer); }
  .drawer.wide { width: min(620px, calc(100vw - 20px)); }
  .wrap:not(.open) { pointer-events: none; }
  .open > .veil { opacity: 1; } .open > .drawer { transform: none; }
  .still > .veil, .still > .drawer { transition: none; }
  .drawer > header { flex: none; display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
  .drawer > header h2 { font: 650 18px/1.2 var(--font); letter-spacing: -.02em; flex: 1; min-width: 0; }
  .drawer > header h2 .chip { font-family: var(--font); vertical-align: 2px; }
  .drawer .body { flex: 1; overflow: auto; padding: 4px 18px 18px; }
  .drawer > footer { flex: none; display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line-2); }
  .drawer > footer .grow { flex: 1; }
  .f { display: grid; gap: 5px; margin-bottom: 12px; } .f > span { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .f input, .f select, .f textarea { width: 100%; height: 38px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet-2); }
  .f textarea { height: auto; min-height: 72px; padding: 9px 11px; resize: vertical; line-height: 1.45; }
  .f input.num { font-family: var(--mono); }
  .f small { color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .side2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--press); margin-bottom: 12px; }
  .side2 button { height: 36px; border-radius: 9px; font-weight: 600; color: var(--muted); transition: transform 140ms var(--ease-out); }
  .side2 button:active { transform: scale(.97); }
  .side2 button[aria-pressed="true"][data-v="long"] { background: var(--up); color: var(--on-fill); } .side2 button[aria-pressed="true"][data-v="short"] { background: var(--down); color: var(--on-fill); }
  .sizing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; border-radius: 14px; background: var(--sheet-2); margin-bottom: 12px; }
  .sizing .big { grid-column: span 3; display: flex; align-items: baseline; gap: 8px; } .sizing .big b { font: 500 26px/1 var(--mono); letter-spacing: -.03em; }
  .checks label { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; cursor: pointer; } .checks input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--up); flex: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; } .tags button { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--press); color: var(--ink-2); font-size: 12.5px; } .tags button[aria-pressed="true"] { background: var(--down-tint); color: var(--down); font-weight: 600; }
  .notes { display: grid; gap: 8px; margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .mini { height: 220px; border-radius: 12px; overflow: hidden; background: var(--sheet-2); margin-bottom: 14px; position: relative; }

  .tip { position: fixed; z-index: 40; max-width: 260px; padding: 8px 10px; border-radius: 9px; background: var(--ink); color: var(--sheet); font-size: 12.5px; line-height: 1.4; pointer-events: none; opacity: 0; transform: scale(.97); transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out); }
  .tip.show { opacity: 1; transform: none; } .tip.instant { transition-duration: 0ms; }
  .toast { position: fixed; z-index: 50; left: 50%; bottom: 22px; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--sheet); font-weight: 500; box-shadow: var(--shadow-up); opacity: 0; transform: translate(-50%, 100%); transition: transform 400ms ease, opacity 400ms ease; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .foot { margin: 18px auto 0; max-width: 78ch; text-align: center; color: var(--muted); font-size: 12px; }
  .foot a { color: inherit; }

  /* ── A phone: one column, tabs at the bottom, every control labelled ───── */
  /* Cabinet's own sidebars often leave the desk 700 to 1000 pixels: tabs take a row of their own. */
  @media (max-width: 1100px) { .charts { grid-template-columns: 200px minmax(0, 1fr); } .charts .side { display: none; } .today { grid-template-columns: 1fr; } }
  @media (max-width: 1340px) and (min-width: 1021px) { #refresh span, #settings span { display: none; } }
  @media (max-width: 1020px) and (min-width: 601px) { .top { flex-wrap: wrap; row-gap: 8px; } .tabs { order: 5; width: 100%; margin-left: 0; } .tab { flex: 1; justify-content: center; } .alerts, .two { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tile.lead { grid-column: span 3; } #refresh span, #settings span { display: none; } #refresh, #settings { width: 34px; padding: 0; } }
  @media (max-width: 600px) {
    body { overflow: auto; } #app { height: auto; min-height: 100%; padding-bottom: 68px; }
    .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 12px 12px 10px; gap: 8px 10px; } .top .grow, #refresh { display: none; } #settings { grid-area: 1 / 2; } .clock { grid-area: 2 / 1; justify-self: start; padding: 9px 12px; } #newplan { grid-area: 2 / 2; }
    .view { padding: 0 12px 12px; overflow: visible; } .strip { padding: 0 12px 10px; }
    .card { padding: 14px; } .card > header { flex-wrap: wrap; row-gap: 8px; } .card > header .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; } .seg button { white-space: nowrap; flex: none; min-height: 32px; }
    .wlist { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .wrow { flex: none; width: auto; min-width: 128px; background: var(--sheet-2); } .wrow small { max-width: 110px; }
    .ctools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .ctools > * { flex: none; } .chead { padding: 14px 14px 8px; } .ctools { padding: 0 14px 10px; }
    .tabs { position: fixed; z-index: 15; left: 8px; right: 8px; bottom: 8px; margin: 0; padding: 5px; border-radius: 16px; background: var(--sheet); box-shadow: var(--shadow-up); justify-content: space-between; }
    .tab { flex: 1; flex-direction: column; gap: 2px; height: 50px; padding: 0 4px; font-size: 11px; justify-content: center; } .tab[aria-selected="true"] { background: var(--press); box-shadow: none; } .tab .count { position: absolute; margin: -30px 0 0 26px; }
    .charts { display: flex; flex-direction: column; height: auto; } .watch { padding: 10px; } .plot { min-height: 340px; flex: none; height: 340px; } .charts .side { display: grid; }
    .alerts, .two { grid-template-columns: 1fr; } .tiles { grid-template-columns: 1fr 1fr; } .tile.lead { grid-column: span 2; } .guard { grid-template-columns: 1fr; } .sig { grid-template-columns: 1fr; } .sig canvas { width: 100%; height: 90px; }
    .btn, .f input, .f select { min-height: 42px; } .btn.small { min-height: 34px; }
    .drawer, .drawer.wide { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 92vh; border-radius: var(--radius) var(--radius) 0 0; transform: translateY(100%); }
    table.t .hide-s { display: none; } .pos { grid-template-columns: minmax(0, 1fr) auto; } .pos .track { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer { transform: none; opacity: 0; transition: opacity 160ms ease; } .open > .drawer { opacity: 1; }
    .toast { transform: translate(-50%, 0); transition: opacity 200ms ease; } .sw::after, .meter i { transition-duration: 1ms; } .found { animation: none; }
    .btn:active, .tab:active, .tick:active { transform: none; }
  }

<div id="app">
  <div class="top">
    <div class="brand"><h1>Trading Desk</h1></div>
    <span class="clock" id="clock" data-s="closed"><i></i><span>Loading</span></span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Screens"></nav>
    <span class="grow"></span>
    <button class="btn quiet" id="refresh" title="Refresh prices (R)"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 4v7h-7"/></svg><span>Refresh</span></button>
    <button class="btn" id="newplan" data-write title="Plan a trade (N)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Plan a trade</span></button>
    <button class="btn quiet" id="settings" title="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"/></svg><span>Settings</span></button>
  </div>
  <div class="strip" id="strip" aria-label="The market right now"></div>
  <main class="view" id="view" role="tabpanel" aria-label="Today" tabindex="-1"></main>
</div>
<div id="layer"></div>

      <div class="sheet tiles">${tile("Result", money(st.net, true), st.n + " closed trades", cls(st.net), "", true)}${tile("Win rate", Math.round(st.winRate * 100) + "%", st.wins + " won, " + st.losses + " lost")}${tile("Average trade", rr(st.expectancy), "Win " + rr(st.avgWinR) + ", loss " + rr(st.avgLossR), cls(st.expectancy), "Expectancy")}${tile("Profit factor", st.pf == null ? "-" : st.pf === Infinity ? "No losses" : st.pf.toFixed(2), "Won for each 1 lost", st.pf >= 1 ? "up" : "down", "Profit factor")}${tile("Deepest fall", money(-st.dd), p.account ? ((st.dd / p.account) * 100).toFixed(1) + "% of account" : "From a high to a later low", st.dd ? "down" : "", "Drawdown")}${tile("Followed the plan", st.followed == null ? "-" : Math.round(st.followed * 100) + "%", "Of trades you marked")}</div>
      <div class="two"><section class="sheet card"><header><h2>Your result, trade by trade</h2></header>${curve}</section><section class="sheet card"><header><h2>${MONTHS[now.getMonth()]} ${now.getFullYear()}</h2><span class="sub">Each day you closed a trade</span></header><div class="heat">${heat}</div></section></div>

      <section class="sheet card"><header><h2>The Coach's review</h2>${rv && rv.example ? '<span class="chip ex">Example</span>' : rv ? `<span class="sub">${esc(ago(rv.modified))}</span>` : ""}</header>${rv ? `<div class="brief">${md(rv.text)}</div>` : '<div class="empty"><b>No review yet.</b>Every Friday the Risk Coach reads your week and writes what it sees: what to keep, what to stop, one thing to try.</div>'}</section></div>
      ${D.mine ? `<section class="sheet card" style="margin-bottom:14px"><header><h2>What the desk knows about you</h2><span class="sub">Every assistant reads this before it answers you. To change it, edit the My trading page in this cabinet's journal folder.</span></header><div class="two"><div class="brief"><h3>Your rules</h3>${md(mdSection(D.mine, "My rules").split("\n").filter((l) => /^\s*[-*]\s/.test(l)).join("\n")) || "<p class='muted'>No rules written yet.</p>"}</div><div class="brief"><h3>What your numbers show</h3>${md(mdSection(D.mine, "What my numbers show"))}</div></div></section>` : ""}

  // ── Alerts: the rules, and everything they found ────────────────────────
  function viewAlerts() {

      <div class="col">${lines.length ? `<section class="sheet card"><header><h2>Your lines</h2><span class="sub">The desk tells you when the price crosses one</span></header>${lines.map((l) => `<button class="row mov" data-open="${esc(l.sym)}"><span><span class="s">${esc(l.sym)}</span><small>${esc(l.note || "")}</small></span><span class="r">${fp(+l.p)}</span><span class="r muted">now ${fp(lastPrice(l.sym))}</span></button>`).join("")}</section>` : ""}
      <section class="sheet card"><header><h2>Everything found</h2><span class="sub">The last three weeks</span><span class="grow"></span><div class="seg">${filters.map((f) => `<button data-sigf="${f[0]}" aria-pressed="${state.sigFilter === f[0]}"${f[0] === "mine" ? ' data-tip="Your own lines, plan entries, stops and targets."' : ""}>${f[1]}</button>`).join("")}</div></header>${feed || '<div class="empty"><b>Nothing found yet.</b>Signals appear here after the first refresh of prices.</div>'}</section></div></div>${footer()}`;
  }

  // ── Settings ────────────────────────────────────────────────────────────
  function settingsHtml() {
    const p = profile(), s = D.status, theme = prefs.theme || "auto";

      <div class="f"><span>Look</span><div class="seg" style="justify-self:start">${[["auto", "Match Cabinet"], ["light", "Light"], ["dark", "Dark"]].map((t) => `<button data-theme="${t[0]}" aria-pressed="${theme === t[0]}">${t[1]}</button>`).join("")}</div></div>
      <div class="f"><span>Up and down colours</span><div class="seg" style="justify-self:start"><button data-colors="" aria-pressed="${!prefs.colors}">Green and red</button><button data-colors="safe" aria-pressed="${prefs.colors === "safe"}">Blue and orange</button></div><small>Blue and orange are easier to tell apart for many colour-blind people.</small></div>
      <div class="f"><span>Prices</span><div class="note ${live ? "good" : "info"}">${icon(live ? "check" : "info")}<div class="grow">${live ? "Live. The desk refreshes every five minutes and can chart any symbol." : liveWhy === "allow" ? "Not live yet. Press Allow in the bar above this page. The desk's engine is a small script in this cabinet's desk/engine folder: it reads public prices and cannot trade." : "Showing saved prices. Press Refresh and your assistant fetches new ones."}${s ? `<br><span class="muted">Last refresh ${esc(ago(s.at))}, ${s.symbols} symbols${s.errors && s.errors.length ? ", " + s.errors.length + " problems" : ""}.</span>` : ""}</div></div>
        ${!live ? "" : alpacaOn ? `${s && s.sources && s.sources.Alpaca === false ? `<div class="note">${icon("warn")}<div class="grow">Alpaca did not answer with your key on the last refresh, so stock prices came from the public sources. If it keeps happening, disconnect and paste a new key.</div></div>` : ""}<small>Stock prices come from your Alpaca account. On Alpaca's free plan the price is live from one exchange, and volume is 15 minutes behind.</small><div><button class="btn small" data-act="alpaca-off">Disconnect Alpaca</button></div>`
          : `<small>Stock prices come from public sources that can be late or stop without notice. For steadier prices, connect a free Alpaca account. Alpaca is a US broker that gives its customers market data.</small>
          <small>1. Open a free account at <a href="https://alpaca.markets" target="_blank" rel="noopener noreferrer">alpaca.markets</a>. 2. In its dashboard, create an API key. 3. Paste the key ID and the secret key here.</small>
          <div class="grid2"><label class="f"><span>Key ID</span><input id="ak-id" autocomplete="off" spellcheck="false" /></label><label class="f"><span>Secret key</span><input id="ak-secret" type="password" autocomplete="off" /></label></div>
          <div><button class="btn small" data-act="alpaca-on">Connect Alpaca</button></div>
          <small>The key stays on this computer, outside your cabinet's pages. The desk only reads prices with it. It never places an order.</small>`}</div>
      <div class="f"><span>Robinhood</span><div class="note ${rhOn() ? "good" : "info"}">${icon(rhOn() ? "check" : "info")}<div class="grow">${rhOn() ? "Connected. Your assistants read your account, and place an order only when you ask and say yes." : "Not connected. The desk works without it. With it, the desk shows your real account, scans the market and fills your journal."}${rhOn() || (RH && RH.state === "not-available-here") ? "" : `<div style="margin-top:8px"><button class="btn small" id="rhconnect">${RH && RH.state === "needs-sign-in" ? "Sign in again" : "Connect Robinhood"}</button></div>`}</div></div></div>
      <div class="f"><span>Keys</span><small>1 to 5 switch screens. N plans a trade. R refreshes. / finds a symbol. J and K step through your list.</small></div>
    </div><footer><span class="grow"></span><button class="btn quiet" data-close>Cancel</button><button class="btn primary" data-write data-act="settings-save">Save settings</button></footer>`;
  }
  ACTS["plan-new"] = () => openTicket();
  ACTS["start-hide"] = () => { pref("startHidden", true); paint(true); };
  // Saving or removing the key changes where every stock price comes from, so everything is fetched again.
  const alpacaSet = (alpaca, done) => engine("/keys", { alpaca }).then((k) => { alpacaOn = !!k.alpaca; closeSheet(); toast(done); return engine("/refresh?full=1"); }).then(() => { Object.keys(candleCache).forEach((k) => delete candleCache[k]); return loadData(); }).then(() => { paint(); if (state.tab === "charts") loadChart(); }, (e) => toast(e.message));
  ACTS["alpaca-on"] = () => { const id = $("ak-id").value.trim(), secret = $("ak-secret").value.trim(); if (!id || !secret) return toast("Paste the key ID and the secret key."); alpacaSet({ id, secret }, "Connected. Stock prices now come from Alpaca."); };
  ACTS["alpaca-off"] = () => alpacaSet(null, "Disconnected. Stock prices come from public sources again.");
  ACTS["settings-save"] = () => { const acc = num($("st-account").value); save("profile", { style: $("st-style").value, level: $("st-level").value, account: acc, riskPct: num($("st-risk").value) || 1, dayLossR: num($("st-day").value) || 3, currency: $("st-cur").value.trim() || "$" }); closeSheet(); toast("Settings saved."); paint(); };
  function applyLook() {
    const t = prefs.theme || "auto", dark = t === "dark" || (t === "auto" && (here && here.theme ? here.theme === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)));
    if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
    if (prefs.colors === "safe") document.documentElement.dataset.colors = "safe"; else delete document.documentElement.dataset.colors;
  }

  // ── Sheets ──────────────────────────────────────────────────────────────
  // A sheet opened or closed from the keyboard appears at once: keys are pressed all day, and motion would only slow them.
  let byKey = false, lastFocus = null;
  function openSheet(html, wide) {
    const layer = $("layer"); if (tchart) { try { tchart.remove(); } catch (e) { /* gone */ } tchart = null; }
    const was = layer.firstElementChild && layer.firstElementChild.classList.contains("open");
    layer.innerHTML = `<div class="wrap${was ? " open" : ""}"><div class="veil" data-close></div><aside class="drawer${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</aside></div>`;
    const w = layer.firstElementChild, dlg = w.lastElementChild, title = dlg.querySelector("h2");
    if (!was) lastFocus = document.activeElement;
    dlg.setAttribute("aria-label", title ? title.textContent.trim() : "Details"); dlg.tabIndex = -1;
    if (!dlg.contains(document.activeElement)) dlg.focus({ preventScroll: true });
    if (byKey) { w.classList.add("open", "still"); byKey = false; }
    else if (!was) { w.getBoundingClientRect(); requestAnimationFrame(() => w.classList.add("open")); }
  }
  function closeSheet(now) {
    const layer = $("layer"), w = layer.firstElementChild; sheetKind = null; opened = null;
    if (tchart) { try { tchart.remove(); } catch (e) { /* gone */ } tchart = null; }
    if (!w) return;
    if (lastFocus && document.contains(lastFocus) && lastFocus.focus) lastFocus.focus({ preventScroll: true }); lastFocus = null;
    if (now) { layer.innerHTML = ""; return; }
    w.classList.remove("open"); setTimeout(() => { if (layer.firstElementChild === w) layer.innerHTML = ""; }, 330);
  }

  // ── Painting ────────────────────────────────────────────────────────────
  const VIEWS = { today: viewToday, charts: viewCharts, trades: viewTrades, review: viewReview, alerts: viewAlerts };
  let dirty = false;
  const typingInView = () => { const el = document.activeElement; return !!(el && $("view").contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)); };
  // `soft` is a repaint nobody asked for (new prices arrived): it never takes a box away from someone typing.
  function paint(soft) {
    document.documentElement.dataset.level = profile().level;
    paintTop();
    if (soft && typingInView()) { dirty = true; return; }
    dirty = false;
    if (state.tab === "charts" && $("lw")) { paintWatch(); paintChartHead(); paintSide(); return; }
    const view = $("view"), top = view.scrollTop;
    view.innerHTML = VIEWS[state.tab]();
    view.style.overflow = state.tab === "charts" ? "hidden" : "";
    if (soft) view.scrollTop = top; else view.scrollTop = 0;
    if (state.tab === "charts") mountChart(); else paintMinis();
  }
  function setTab(tab) {
    if (!VIEWS[tab]) return;
    if (state.tab === "charts" && tab !== "charts") { dropChart(); shown = null; state.draw = false; }
    state.tab = tab; pref("tab", tab);
    if (tab === "alerts" && signals()[0]) pref("seen", signals()[0].at);
    $("view").setAttribute("aria-label", (TABS.find((x) => x[0] === tab) || [0, ""])[1]);
    $("view").innerHTML = ""; paint();
  }

  // ── Presses, typing, keys ───────────────────────────────────────────────
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab],[data-open],[data-plan],[data-trade],[data-sigf],[data-movers],[data-run],[data-idea],[data-askscout],[data-sym],[data-frame],[data-over],[data-pick],[data-lvdel],[data-close],[data-act],[data-ttab],[data-range],[data-rule],[data-tk-side],[data-tk-practice],[data-rkind],[data-followed],[data-mistake],[data-theme],[data-colors],#refresh,#newplan,#settings,#starbtn,#drawbtn,#askchart,#su-save,#logpast,#importbtn,#clearex,#rhconnect,#rhhide,#rhall,[data-watchadd]");
    if (!t) { if (!e.target.closest(".find")) { findList = []; findPaint(); } return; }
    const d = t.dataset;
    if (t.id === "refresh") return refreshNow(false);
    if (t.id === "newplan") return openTicket();
    if (t.id === "settings") { sheetKind = "settings"; return openSheet(settingsHtml()); }
    if (t.id === "logpast") return openTicket({ status: "closed", entry: null });
    if (t.id === "importbtn") return ask("Import my trades into the desk. I will paste my broker's export or attach the file. Follow playbooks/how-the-desk-works.md and write them to journal/trades.json.", "journal-clerk");
    if (t.id === "rhconnect") { if (sheetKind) closeSheet(true); return connectRh(); }
    if (t.id === "rhhide") { pref("rhHide", true); toast("Hidden. You can connect Robinhood from Settings."); return paint(true); }
    if (t.id === "rhall") { state.rhAll = true; return paint(true); }
    if (d.watchadd) { const list = watch().slice(); if (!list.some((w) => w.sym === d.watchadd)) { list.push({ sym: d.watchadd, name: d.name || d.watchadd }); save("watch", list); toast(d.watchadd + " is on your list. The desk checks it from the next refresh."); } return paint(true); }
    if (t.id === "clearex") { save("noExamples", true); toast("Examples cleared."); return paint(); }
    if (t.id === "starbtn") { const sym = state.sym, list = watch().slice(), at = list.findIndex((w) => w.sym === sym); if (at >= 0) list.splice(at, 1); else list.push({ sym, name: nameOf(sym) }); save("watch", list); toast(at >= 0 ? sym + " is off your list." : sym + " is on your list. The desk checks it from the next refresh."); return paint(); }
    if (t.id === "drawbtn") { state.draw = !state.draw; return paintChartHead(); }
    if (t.id === "askchart") { const f = shown && shown.facts, q = quote(state.sym); return ask(`Look at the chart of ${state.sym} (${nameOf(state.sym)}). Price ${q ? fp(q.price) : f ? fp(f.close) : "unknown"}${f ? `, RSI ${f.rsi == null ? "?" : f.rsi.toFixed(0)}, 50-day average ${fp(f.sma50)}, 200-day average ${fp(f.sma200)}, usual daily move ${fp(f.atr)}, 52-week range ${fp(f.lo)} to ${fp(f.hi)}` : ""}. Read ${appPath}/data/candles/${fileSym(state.sym)}.1d.json. Tell me in plain words what the chart is doing, the levels that matter, and what would make it a long or a short. Do not tell me what to buy.`, "chart-scout"); }
    if (t.id === "su-save") { const acc = num($("su-account").value); if (!acc) return toast("Add your account size. It stays in this cabinet."); const st = $("su-style").value; const lv = $("su-level").value; save("profile", Object.assign(profile(), { style: st, level: lv, account: acc, riskPct: num($("su-risk").value) || 1 })); if (lv === "new" && !shared.rules) save("rules", Object.fromEntries(RULES.filter((r) => r.on && STARTER_RULES.indexOf(r.id) < 0).map((r) => [r.id, { on: false }]))); const fr = STYLES.find((s) => s[0] === st); if (fr) { state.frame = live ? fr[3] : "1d"; pref("frame", state.frame); } toast("Saved. Every plan is sized from this now."); return paint(); }
    if (d.close != null) return closeSheet();
    if (d.act) return ACTS[d.act] && ACTS[d.act](d.id);
    if (d.tab) return setTab(d.tab);
    if (d.plan) return openTicket({ sym: d.plan, side: d.side || "long", setup: SETUPS.indexOf(d.setup) >= 0 ? d.setup : ({ "Back above a moving average": "Pullback to a moving average", "Gap": "Gap and go", "Opening range break": "Opening range break", "Oversold": "Reversal", "Overbought": "Reversal", "New 52-week high": "Breakout", "New 52-week low": "Breakdown", "Lost a moving average": "Breakdown" }[d.setup] || SETUPS[0]) });
    if (d.trade) return openTrade(d.trade);
    if (d.open) { if (sheetKind) closeSheet(true); return openSym(d.open); }
    if (d.sigf) { state.sigFilter = d.sigf; return paint(); }
    if (d.movers) { state.moversTab = d.movers; return paint(true); }
    if (d.ttab) { state.tradeTab = d.ttab; return paint(); }
    if (d.range) { state.reviewRange = d.range; return paint(); }
    if (d.run) return runJob(d.run, RUNNING[d.run] || "Started. The result appears here.");
    if (d.idea) { const x = IDEAS[+d.idea]; return ask(x[0], x[1] || undefined); }
    if (d.askscout) { const x = signals().find((s) => s.id === d.askscout); if (x) ask(`The desk flagged ${x.sym}: "${x.text}" (rule: ${ruleInfo(x.rule).name}, ${x.day}). Read ${appPath}/data/candles/${fileSym(x.sym)}.1d.json and the newest headlines in ${appPath}/data/news.json. Is this worth my attention? Say what a trader would wait to see, where the idea is wrong, and what could spoil it. Do not tell me what to buy.`, "chart-scout"); return; }
    if (d.sym) { state.sym = d.sym; pref("sym", d.sym); return loadChart(); }
    if (d.frame) { if (!live && d.frame !== "1d" && d.frame !== "1w") toast("Minute and hour charts need live prices."); state.frame = d.frame; pref("frame", d.frame); return loadChart(); }
    if (d.over) { const o = Object.assign({}, prefs.over || {}); o[d.over] = !overOn(d.over); pref("over", o); return loadChart(); }
    if (d.pick) return findPick(d.pick, d.name);
    if (d.lvdel != null) { const list = levels(state.sym).slice(); list.splice(+d.lvdel, 1); save("lv:" + state.sym, list.length ? list : undefined); return loadChart(); }
    if (d.rule) { const r = Object.assign({}, shared.rules || {}), cur2 = rulesNow().find((x) => x.id === d.rule); r[d.rule] = Object.assign({}, r[d.rule] || {}, { on: !cur2.on }); save("rules", r); return paint(); }
    if (d.tkSide) { draft.side = d.tkSide; return openSheet(ticketHtml()); }
    if (d.tkPractice) { draft.practice = d.tkPractice === "yes"; return openSheet(ticketHtml()); }
    if (d.rkind) { state.reviewKind = d.rkind; return paint(); }
    if (d.followed && opened) { opened.followed = d.followed === "yes"; readReview(opened); t.parentNode.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); return; }
    if (d.mistake && opened) { const m = (opened.mistakes || []).slice(), at = m.indexOf(d.mistake); if (at >= 0) m.splice(at, 1); else m.push(d.mistake); opened.mistakes = m; t.setAttribute("aria-pressed", String(at < 0)); return; }
    if (d.theme) { pref("theme", d.theme); applyLook(); openSheet(settingsHtml()); if (state.tab === "charts") loadChart(); else paintMinis(); return; }
    if (d.colors != null) { pref("colors", d.colors); applyLook(); openSheet(settingsHtml()); if (state.tab === "charts") loadChart(); else paint(true); return; }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "find") return findType(el.value);
    if (el.dataset.tk) return ticketInput(el);
    if (el.dataset.tkMine != null) { const m = (draft.mine || []).slice(), r = el.dataset.tkMine, at = m.indexOf(r); if (el.checked && at < 0) m.push(r); if (!el.checked && at >= 0) m.splice(at, 1); draft.mine = m; }
    if (el.dataset.tkCheck != null) { const c = (draft.checks || []).slice(), i = +el.dataset.tkCheck, at = c.indexOf(i); if (el.checked && at < 0) c.push(i); if (!el.checked && at >= 0) c.splice(at, 1); draft.checks = c; }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, d = el.dataset;
    if (d.ruleParam) { const [id, k] = d.ruleParam.split(":"), v = num(el.value); if (v == null || v <= 0) return paint(); const r = Object.assign({}, shared.rules || {}); r[id] = Object.assign({}, r[id] || {}); r[id][k] = v; save("rules", r); toast("Saved. The next refresh uses it."); }
    if (d.lvnote != null) { const list = copy(levels(state.sym)); if (list[+d.lvnote]) { list[+d.lvnote].note = el.value.trim().slice(0, 60); save("lv:" + state.sym, list); if (chart) loadChart(); } }
  });
  document.addEventListener("submit", (e) => { if (e.target.id !== "askform") return; e.preventDefault(); const v = $("askbox").value.trim(); if (v) { ask(v); $("askbox").value = ""; } });
  document.addEventListener("focusout", () => setTimeout(() => { if (dirty && !typingInView()) paint(true); }, 0));
  document.addEventListener("keydown", (e) => {
    const el = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
    if (el.id === "find") {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (findList.length) { findAt = (findAt + (e.key === "ArrowDown" ? 1 : -1) + findList.length) % findList.length; findPaint(); } }
      else if (e.key === "Enter") { const r = findList[findAt] || (el.value.trim() ? { sym: el.value.trim().toUpperCase(), name: "" } : null); if (r) findPick(r.sym, r.name); }
      else if (e.key === "Escape") { findList = []; findPaint(); el.blur(); }
      return;
    }
    if (e.key === "Tab" && $("layer").firstElementChild) {
      const dlg = $("layer").querySelector(".drawer"), list = [...dlg.querySelectorAll("button, input, select, textarea, a[href]")].filter((x) => !x.disabled && x.offsetParent);
      if (list.length) { const first = list[0], last = list[list.length - 1]; if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
      return;
    }
    if (e.key === "Escape") { if ($("layer").firstElementChild) return closeSheet(true); if (state.draw) { state.draw = false; paintChartHead(); } return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey || $("layer").firstElementChild) return;
    const k = e.key.toLowerCase();
    if (k >= "1" && k <= "5") return setTab(TABS[+k - 1][0]);
    if (k === "n" && canWrite()) { e.preventDefault(); byKey = true; return openTicket(); }
    if (k === "r") return refreshNow(false);
    if (k === "/") { e.preventDefault(); if (state.tab !== "charts") setTab("charts"); const f = $("find"); if (f) f.focus(); return; }
    if ((k === "j" || k === "k") && state.tab === "charts") { const list = watch(), at = list.findIndex((w) => w.sym === state.sym), next = list[(at + (k === "j" ? 1 : -1) + list.length) % list.length]; if (next) { state.sym = next.sym; pref("sym", next.sym); loadChart(); } }
  });
  // Words explained on hover. The first waits a moment; the next ones do not.
  let tipTimer = null, tipLast = 0;
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest("[data-tip]"), tip = $("tip");
    if (!el || !el.dataset.tip) return;
    const show = () => { tip.textContent = el.dataset.tip; const r = el.getBoundingClientRect(); tip.style.left = "0px"; tip.style.top = "0px"; const w = tip.offsetWidth, h = tip.offsetHeight; const x = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8), below = r.bottom + 8 + h < innerHeight; tip.style.left = x + "px"; tip.style.top = (below ? r.bottom + 8 : r.top - h - 8) + "px"; tip.style.transformOrigin = (below ? "top" : "bottom") + " center"; tip.classList.add("show"); };
    clearTimeout(tipTimer);
    if (Date.now() - tipLast < 400) { tip.classList.add("instant"); show(); } else { tip.classList.remove("instant"); tipTimer = setTimeout(show, 350); }
  });
  document.addEventListener("mouseout", (e) => { if (!e.target.closest || !e.target.closest("[data-tip]")) return; clearTimeout(tipTimer); const tip = $("tip"); if (tip.classList.contains("show")) tipLast = Date.now(); tip.classList.remove("show"); });
  document.addEventListener("scroll", () => $("tip").classList.remove("show"), true);

  // ── Start ───────────────────────────────────────────────────────────────
  function start() {
    const hereP = cab && cab.here ? Promise.resolve(cab.here()).catch(() => null) : Promise.resolve(null);
    return hereP.then((h) => {
      here = h; if (h && h.appPath) appPath = h.appPath;
      readStores(); applyLook();
      if (VIEWS[prefs.tab]) state.tab = prefs.tab;
      if (prefs.sym) state.sym = prefs.sym; else if (watch()[0]) state.sym = watch()[0].sym;
      return Promise.all([loadData(), loadWriting(), loadJobs(), checkLive(), loadAccount(), loadConn()]);
    }).then(() => {
      state.frame = prefs.frame && (live || prefs.frame === "1d" || prefs.frame === "1w") ? prefs.frame : "1d";
      state.loaded = true; paint();
      if (hasStore && kept.onChange) kept.onChange(() => { shared = fromKept(); paint(true); });
      if (V2 && cab.files.onChange) {
        cab.files.onChange(appPath + "/data", () => loadData().then(() => paint(true)));
        ["briefs", "reviews", "journal"].forEach((dirName) => cab.files.onChange(dirName, () => loadWriting().then(() => paint(true))));
        cab.files.onChange("account", () => loadAccount().then(() => paint(true)));
      }
      if (cab && cab.jobs && cab.jobs.onChange) cab.jobs.onChange((list) => { D.jobs = list || []; paint(true); });
      if (cab && cab.connectors && cab.connectors.onChange) cab.connectors.onChange(() => loadConn().then(() => paint(true)));
      // The clock every minute; fresh prices every two while the page is in view and a market is open.
      let ticks = 0;
      setInterval(() => {
        if (document.hidden) return;
        paintTop(); ticks++;
        if (live && !state.busy && ticks % 2 === 0) engine("/refresh").then(loadData).then(() => { paint(true); if (state.tab === "charts" && shown && state.frame !== "1d" && state.frame !== "1w" && !state.draw) loadChart(); }, () => {});
      }, 60000);
      if (live && D.status && Date.now() - Date.parse(D.status.at) > 5 * 60000) refreshNow(true);
    });
  }
  $("view").innerHTML = '<div class="empty" style="padding:80px 0">Opening your desk</div>';
  if (cab && cab.ready && typeof cab.ready.then === "function") {
    let began = null; const go = () => { if (!began) began = start(); };
    // Cabinet slow to answer: start without it, then read the stores again once it is ready.
    cab.ready.then(() => { if (began) began.then(() => { readStores(); applyLook(); paint(); }); else go(); }, go);
    setTimeout(go, 3000);
  } else start();
})();
</script>
