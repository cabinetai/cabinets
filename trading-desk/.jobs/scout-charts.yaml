id: scout-charts
name: Scout the charts
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: chart-scout
agentSlug: chart-scout
timeout: 900
prompt: |-
  Look at what the rules flagged and write your notes for the desk.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md` and `playbooks/setups.md`.
  2. Run `node desk/engine/refresh.mjs` so the signals are fresh.
  3. Read `desk/data/signals.json` and keep the items whose `day` is the newest day in the
     file. If there are none, write `desk/data/scout.json` with an empty `notes` list and
     report "Nothing flagged today." and stop.
  4. For each symbol in those items, read `desk/data/candles/<SYMBOL>.1d.json` and its
     `facts` in `desk/data/market.json`. Judge it as your persona says: trend, level, volume,
     room, what spoils it.
  5. Pick at most five signals worth the person's attention. Write `desk/data/scout.json` in
     the shape your persona gives, one note for each, with the signal's own `id`.
  
  Every number in a note comes from the files. No note says buy, sell or should.
  
  Finish in two or three plain sentences: how many signals there were, which you picked, and
  the one you would look at first and why.
