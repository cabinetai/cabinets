id: market-scan
name: Scan the market
enabled: true
schedule: 40 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: chart-scout
agentSlug: chart-scout
timeout: 900
prompt: |-
  Scan the whole market for the person, beyond their own list, and write what stands out.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md`, `playbooks/robinhood.md`
     and `playbooks/setups.md`. If you have no tool whose name starts with
     `mcp__cabinet-robinhood__`, report "Robinhood is not connected." and stop.
  2. Read `profile.style` in `desk/.data/shared.json` (a missing file means swing).
  3. Call `get_scans`. Run each scan the person saved with `run_scan`. If they saved none,
     run two that fit their style without saving them (`preview_scan`): for a day trader,
     the biggest moves on unusual volume this session; for anyone else, new 52-week highs
     on unusual volume, and stocks down more than 5% on unusual volume. Liquid US stocks
     only: a price above 5 and an average of 1,000,000 shares a day.
  4. From everything the scans return, drop what is already on the person's list (`watch`
     in the store, or the starter list). For at most 12 of the rest, read
     `get_equity_quotes` and the newest headline from `get_equity_news`.
  5. Pick at most six worth a look. Write `account/scan.json` in the shape `desk/DATA.md`
     gives, replacing the old file. Each find has one `why`: what the stock did, in numbers
     from the tools, and the headline behind it if there is one. Name the scan it came from.
  
  No find says buy, sell or should. A stock that only moved because of a reverse split or
  a penny price is not a find.
  
  Finish in two plain sentences: how many stocks the scans returned, and the one you would
  look at first and why.
