id: month-in-money
name: My month in money
enabled: true
schedule: 0 9 1 * *
provider: claude-code
adapterType: claude_local
ownerAgent: journal-clerk
agentSlug: journal-clerk
timeout: 900
prompt: |-
  Write what the person's month at Robinhood came to, in money.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md` and `playbooks/robinhood.md`.
     If you have no tool whose name starts with `mcp__cabinet-robinhood__`, report
     "Robinhood is not connected." and stop.
  2. The month is the last full calendar month, unless today is after the 20th: then it is
     this month so far, and the first line says so.
  3. Read `get_realized_pnl` and `get_pnl_trade_history` for the month, `get_portfolio` for
     the account's value, and `get_equity_tax_lots` for what is still held.
  4. Write `account/<YYYY-MM>-money.md` with these parts:
     - `## The month in one line`: the realised result and the account's value.
     - `## Where it came from`: a table of at most eight symbols, result for each, the
       biggest winners and losers first.
     - `## What it cost`: fees and commissions, and dividends and interest received.
     - `## Still open`: positions held at a loss and at a gain, with the amounts. For lots
       held at a loss, state the loss and how long the lot has been held. That is a fact
       for the person's own tax decisions, not advice. Say so in one line.
     Every number comes from a tool. If Robinhood's total and your own sum differ, give
     both and say by how much.
  
  Read only. Do not say what to buy or sell, and do not give tax advice.
  
  Finish in two plain sentences: the month's result, and where the page is.
