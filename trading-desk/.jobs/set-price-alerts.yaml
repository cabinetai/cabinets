id: set-price-alerts
name: Set my phone alerts
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
ownerAgent: risk-coach
agentSlug: risk-coach
timeout: 600
prompt: |-
  Put an alert on the person's phone, through Robinhood, for every stop and target they have.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md` and `playbooks/robinhood.md`.
     If you have no tool whose name starts with `mcp__cabinet-robinhood__`, report
     "Robinhood is not connected." and stop.
  2. Build the list of prices that matter from `desk/.data/shared.json` and
     `journal/trades.json`: for each open trade its `stop` and `target`; for each plan its
     `entry`; and each line the person drew (keys starting `lv:`).
  3. Read `account/alerts.json` (the alerts this desk made earlier) and `get_alerts`.
  4. Make them match, touching only alerts whose id is in `account/alerts.json`:
     - a price with no alert: `create_alert`;
     - an alert whose price changed (a stop was moved): `update_alert`;
     - an alert whose trade is closed or whose line is gone: `delete_alert`.
     An alert the person made themselves in the Robinhood app is theirs. Leave it.
  5. Write `account/alerts.json` in the shape `desk/DATA.md` gives: every alert this desk
     has at Robinhood now, with its id.
  
  An alert is a message on the phone. This routine never places an order.
  
  Finish in one or two plain sentences: how many alerts were added, changed and removed.
