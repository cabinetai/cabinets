id: refresh-desk
name: Refresh the desk
enabled: false
schedule: ""
provider: claude-code
adapterType: claude_local
ownerAgent: analyst
agentSlug: analyst
timeout: 900
prompt: |-
  Refresh the desk's prices and signals.
  
  Your working directory is the cabinet root.
  
  1. Run `node desk/engine/refresh.mjs --full`.
  2. Read `desk/data/status.json`.
  
  Finish in one or two plain sentences: how many symbols were refreshed, how many new signals
  were found, and anything that failed.
