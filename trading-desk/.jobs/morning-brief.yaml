id: morning-brief
name: Morning brief
enabled: true
schedule: 0 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: analyst
agentSlug: analyst
timeout: 900
prompt: |-
  Write this morning's brief for the desk.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md`. This prompt does not repeat it.
  2. Run `node desk/engine/refresh.mjs --full` so every number is fresh. If it prints
     problems, keep going and name them in one line at the end of the brief.
  3. Read `desk/data/market.json`, `signals.json`, `calendar.json`, `movers.json`,
     `news.json`, and the person's `profile`, list, plans and open trades from
     `desk/.data/shared.json` and `journal/trades.json`.
  4. Write `briefs/<today>-1-morning.md` (today as YYYY-MM-DD), with these parts:
     - `## The short version`: three sentences at most. The one thing that matters today.
     - `## What moved overnight`: futures, rates, the dollar, crypto, from the strip symbols.
     - `## On the calendar today`: economic news with its time in New York, and earnings on
       their list. A small table.
     - `## Your charts`: the symbols on their list that have a signal on the newest day
       in `signals.json`. Say which day's close they come from. One line each: what happened and the level that matters.
     - `## Your open trades`: each open trade, and each plan whose entry is within one usual
       daily move (`facts.atr`) of the price, with the price now against the stop and target.
     Then one line: the single thing to keep in mind today.
  5. If the list is still the starter list and there are no trades, add one line that says
     how to make the desk their own: add symbols on Charts, set the account on Today. Any
     line about refresh problems comes last of all.
  
  Every number comes from the files. Do not say what to buy or sell.
  
  Finish in two plain sentences: the main point of the brief, and where it is.
