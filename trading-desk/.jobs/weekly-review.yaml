id: weekly-review
name: Weekly review
enabled: true
schedule: 0 18 * * 5
provider: claude-code
adapterType: claude_local
ownerAgent: risk-coach
agentSlug: risk-coach
timeout: 900
prompt: |-
  Write this week's review of the person's trading.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md`, `playbooks/risk-rules.md`
     and `journal/my-trading.md`.
  2. Build the true list of trades from `desk/.data/shared.json` (keys starting `t:`, the
     desk's copy wins) and `journal/trades.json`. Never use `journal/EXAMPLE-trades.json`.
     If there are no closed trades, write nothing and report: "No closed trades yet. Close a
     trade or import your history and I will review it." and stop.
  3. Run `node desk/engine/refresh.mjs` and use `desk/data/candles/` to see how far each
     trade went each way while it was open.
  4. Count everything yourself: closed trades this week (since Monday) and in all. If none
     closed this week, review all closed trades and say so in the first line. Then: win rate, average trade in
     R, profit factor, the result by setup, by side and by mistake label, and how the trades
     that followed the plan did against those that did not.
  5. Write `reviews/<today>-week.md` (today as YYYY-MM-DD) with these parts:
     `## What the numbers say`, `## Keep`, `## Stop`, `## Try this week`. One page. Every
     claim carries its number. With fewer than 20 closed trades, say the sample is small.
  
  6. Update `## What my numbers show` in `journal/my-trading.md`, following
     `playbooks/how-the-desk-works.md`: keep the lines this week's numbers still support,
     remove the ones they do not, add what is new. At most seven lines. Change nothing else
     in that file. If the file is missing, skip this step.
  
  Do not say what to buy or sell.
  
  Finish in two plain sentences: the most important thing you found, and where the review is.
