id: closing-recap
name: Closing recap
enabled: false
schedule: 30 16 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: analyst
agentSlug: analyst
timeout: 900
prompt: |-
  Write tonight's recap for the desk.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md`. This prompt does not repeat it.
  2. Run `node desk/engine/refresh.mjs --full`.
  3. Read `desk/data/market.json`, `signals.json` and `movers.json`, and the person's trades
     from `desk/.data/shared.json` and `journal/trades.json`.
  4. Write `briefs/<today>-2-close.md` (today as YYYY-MM-DD), with these parts:
     - `## The day`: what the market did, in three sentences, with the numbers.
     - `## Your trades today`: every trade opened or closed today, with its result in money
       and in R. If none, say so in one line.
     - `## Still open`: each open trade, the price against its stop and target.
     - `## Tomorrow`: what is on the calendar, and which plans are close to their entry.
  
  Every number comes from the files. Do not say what to buy or sell.
  
  Finish in two plain sentences: the day in one line, and where the recap is.
