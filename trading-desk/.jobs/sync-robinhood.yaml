id: sync-robinhood
name: Sync my Robinhood account
enabled: true
schedule: 30 17 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: journal-clerk
agentSlug: journal-clerk
timeout: 900
prompt: |-
  Bring the person's Robinhood account onto the desk and keep the journal up to date.
  
  Your working directory is the cabinet root.
  
  1. Read your persona, then `playbooks/how-the-desk-works.md` and `playbooks/robinhood.md`.
     If you have no tool whose name starts with `mcp__cabinet-robinhood__`, report
     "Robinhood is not connected." and stop.
  2. Read the account: `get_accounts`, then `get_portfolio`, `get_equity_positions`,
     `get_option_positions`, `get_crypto_positions` and the open orders from
     `get_equity_orders`, for every account. Use `get_equity_quotes` for a price a position
     does not carry.
  3. Write `account/robinhood.json` in the shape `desk/DATA.md` gives, replacing the old
     file. Positions in order of value, largest first. Every number comes from a tool's answer
     in this run. A tool that failed goes in `problems`, in plain words.
  4. Fill the journal. Read the filled orders since the newest trade in
     `journal/trades.json` (the last 90 days if the file is missing), from
     `get_pnl_trade_history` and `get_equity_orders`. Turn fills into trades as your persona
     says and add the new ones to `journal/trades.json`. Skip duplicates by the playbook's
     rule. A position whose opening fill is older than what you read stays out of the journal:
     the desk shows it under holdings. This routine writes without asking first; that is
     what the person switched on.
  5. Run `node desk/engine/refresh.mjs` so every held symbol has a chart.
  
  Read only. This routine never places, changes or cancels an order.
  
  Finish in two or three plain sentences: the account's value, how many positions, and how
  many trades you added to the journal. Name anything that failed.
