id: sunday-week-ahead
name: Sunday week ahead
enabled: true
cloudOnly: true
schedule: 0 18 * * 0
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: week-keeper
agentSlug: week-keeper
timeout: 900
prompt: |-
  Write the week ahead from the person's Google Calendar.

  Your working directory is the cabinet root. Your persona's "Sunday: the week ahead" holds
  the shape of the page.

  1. Find today's date and the calendar's time zone, and read
     `calendar-brief/data/latest.json` if it is there.
  2. Read next Monday to Sunday from the calendar, the way the "Connections this cabinet
     uses" section says. If you cannot, write nothing and say why in one sentence.
  3. Write `reports/<YYYY-MM-DD>-week-ahead.md`.

  Only read the calendar: never create, move, cancel or answer an event.

  Finish in one plain sentence and nothing else: the busiest day, and the one thing to
  prepare.
createdAt: '2026-10-08T00:00:00.000Z'
updatedAt: '2026-10-08T00:00:00.000Z'
