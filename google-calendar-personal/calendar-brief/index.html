      '<div class="sum"><span class="value num' + (value ? "" : " none") + '" dir="auto">' + esc(value || "None") + "</span>" +
      '<span class="sub">' + subHtml + "</span>" + (lineHtml ? '<span class="line" dir="auto">' + lineHtml + "</span>" : "") + "</div>";
  }

  // ── Drawing the boxes ──────────────────────────────────────────────────

  /** "today", "tomorrow", "on Tuesday": a day inside a sentence. */
  function onDay(d, today) {
    var w = dayWord(d, today);
    return w === "Today" || w === "Tomorrow" ? w.toLowerCase() : "on " + w;
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function moreButton() { return '<button type="button" class="box-more" data-act="more-rows" hidden></button>'; }
  function kpi(iconId, label, value, sub, cls) {
    return '<div class="kpi' + (cls ? " " + cls : "") + '"><span class="label">' + icon(iconId) + esc(label) + "</span>" +
      '<span class="value num">' + esc(value) + '</span><span class="sub">' + esc(sub) + "</span></div>";
  }

  function numberCard(id) {
    var f = state.facts;
    var todayN = f.days[0].events.length;
    if (id === "n-events") return kpi("i-calendar", "Events this week", String(f.events), todayN ? count(todayN, "event", "events") + " today" : "Nothing today");
    if (id === "n-hours") return kpi("i-clock", "Hours in meetings", hoursWords(f.meetHours), "not counting personal time");
    if (id === "n-free") return kpi("i-sun", "Free hours", hoursWords(f.freeHours), f.best ? "Longest: " + f.bestWords : "Weekdays are full", "calm");
    return f.busiest
      ? kpi("i-chart", "Busiest day", dayWord(f.busiest.day.date, f.today), count(f.busiest.n, "event", "events"))
      : kpi("i-chart", "Busiest day", "None", "Nothing planned");
  }

  /** "Good evening, Tal": the page's title, for the hour on the person's own clock. */
  function greetText(d) {
    var h = d.getHours();
    var hi = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
    var me = myName();
    return hi + (me ? ", " + me.split(" ")[0] : "");
  }
  /** "Sunday, 11 October." above the title. */
  function helloHtml(d) {
    var day = d.toLocaleDateString([], { weekday: "long" }) + ", " + d.getDate() + " " + d.toLocaleDateString([], { month: "long" });
    return esc(day) + ".";
  }

  /*
   * Today's sky. Seven skies through the day; between two of them the colours mix by the
   * minute. The sun walks an arc over the right of the band from 6:00 to 20:00, the moon
   * from 20:00 to 6:00. Text turns light when the sky is dark.
   */
  var SKY = [
    // hour, top, middle, low, orb, orb core, halo [r, g, b, a]
    [0, "#0e1a33", "#1b2b4d", "#34436a", "#e9e6da", "#fbfaf3", [233, 230, 218, .10]],
    [4.5, "#0e1a33", "#1b2b4d", "#34436a", "#e9e6da", "#fbfaf3", [233, 230, 218, .10]],
    [6, "#26365f", "#8a7aa6", "#f0b49a", "#f08a5d", "#ffc9a0", [255, 190, 150, .25]],
    [7.5, "#dfeaee", "#edf0ea", "#f8ead8", "#f4a259", "#ffd29a", [255, 210, 154, .28]],
    [11, "#cfe3f1", "#e4eef3", "#f3f0e6", "#f7b955", "#ffe3a6", [255, 226, 160, .30]],
    [15, "#bfd8ec", "#dfeaf1", "#f5ead6", "#f5ad4f", "#ffdc96", [255, 214, 150, .28]],
    [18, "#a9bfdc", "#f0cfb2", "#f4a77e", "#ee7a45", "#ffb27a", [255, 170, 120, .30]],
    [19.75, "#2c3d68", "#6c6497", "#d98f84", "#e8705a", "#ffa588", [240, 140, 120, .22]],
    [21.5, "#0e1a33", "#1b2b4d", "#34436a", "#e9e6da", "#fbfaf3", [233, 230, 218, .10]],
    [24, "#0e1a33", "#1b2b4d", "#34436a", "#e9e6da", "#fbfaf3", [233, 230, 218, .10]]
  ];
  function hexRgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mixRgb(a, b, t) { return a.map(function (v, i) { return v + (b[i] - v) * t; }); }
  function rgbText(c) { return "rgb(" + c.slice(0, 3).map(Math.round).join(", ") + ")"; }
  function skyAt(d) {
    var h = d.getHours() + d.getMinutes() / 60;
    var i = 0;
    while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
    var a = SKY[i], b = SKY[i + 1];
    var t = b[0] === a[0] ? 0 : (h - a[0]) / (b[0] - a[0]);
    var at = function (k) { return mixRgb(hexRgb(a[k]), hexRgb(b[k]), t); };
    var halo = mixRgb(a[6], b[6], t);
    var mid = at(2);
    var light = (0.2126 * mid[0] + 0.7152 * mid[1] + 0.0722 * mid[2]) / 255;
    var night = h >= 20 || h < 6;
    var arc = night ? ((h + 4) % 24) / 10 : (h - 6) / 14;
    return {
      top: rgbText(at(1)), mid: rgbText(mid), low: rgbText(at(3)), orb: rgbText(at(4)), core: rgbText(at(5)),
      halo: "rgba(" + halo.slice(0, 3).map(Math.round).join(", ") + ", " + halo[3].toFixed(2) + ")",
      x: (66 + arc * 28).toFixed(1) + "%", y: (112 - Math.sin(Math.PI * arc) * 40).toFixed(1) + "%",
      dark: light < 0.45, night: night
    };
  }
  function applySky() {
    var now = new Date();
    var s = skyAt(now);
    var root = document.documentElement.style;
    root.setProperty("--sky-top", s.top); root.setProperty("--sky-mid", s.mid); root.setProperty("--sky-low", s.low);
    root.setProperty("--sky-orb", s.orb); root.setProperty("--sky-orb-core", s.core); root.setProperty("--sky-halo", s.halo);
    root.setProperty("--sky-x", s.x); root.setProperty("--sky-y", s.y);
    root.setProperty("--canvas", "color-mix(in srgb, " + s.mid + " 16%, #f2f5f5)");
    root.setProperty("--sky-ink", s.dark ? "#f6f3ea" : "#1b2528");
    root.setProperty("--sky-ink-2", s.dark ? "rgba(246, 243, 234, .84)" : "#3f4b4f");
    root.setProperty("--sky-greet", s.dark ? "#ffd9a8" : "#224b3a");
    document.documentElement.classList.toggle("sky-night", s.night);
    Array.prototype.forEach.call(document.querySelectorAll("[data-hello]"), function (el) { el.innerHTML = helloHtml(new Date()); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-greet]"), function (el) { el.textContent = greetText(new Date()); });
  }
  applySky();
  setInterval(applySky, 5 * 60 * 1000);

  /** "No overlaps" rides in the greeting line when the week has plans and none of them clash. */
  function calmHtml(f) {
    if (!f.events || f.conflicts.length || state.example) return "";
    return '<span class="calm"><svg class="cheer" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" /><path d="M12.5 20.5l5 5 10-11" /></svg>No overlaps</span>';
  }

  function drawHeadline(level) {
    var f = state.facts;
    var ex = state.example ? "Example: " : "";
    var main = f.events ? count(f.events, "event", "events") + " this week" : "Nothing on your calendar this week";
    var top = function (h2) {
      return '<div class="hl-top"><p class="hl-name">' + icon("i-calendar") + "<span>My week</span></p>" +
        '<div class="status hl-status" aria-live="polite">' + statusHtml() + "</div></div>" +
        '<p class="hello"><span data-hello>' + helloHtml(new Date()) + "</span>" + calmHtml(f) + "</p>" + h2;
    };
    if (level === "S") return "<div>" + top("<h2>" + esc(ex + main) + "</h2>") + "</div>";
    // A whole empty week is simply clear; naming one free day in it would add nothing.
    var free = f.events && f.best && f.best.slot.end - f.best.slot.start >= 120 ? " " + freeWords(f) + "." : "";
    var lead = "";
    if (f.conflicts.length) {
      var c = f.conflicts[0];
      lead = " <b>" + esc(dayWord(c.day.date, f.today)) + " at " + esc(clock(c.from)) + ":</b> " + bdi(c.a.title) + " and " + bdi(c.b.title) + " overlap.";
    } else if (state.data.note) {
      lead = " " + bdi(state.data.note);
    }
    // The title is the page's name; the week's count leads the line under it.
    lead = '<p class="lead"><b>' + esc(ex + main + ".") + "</b>" + (free ? '<span class="h2-free">' + esc(free) + "</span>" : "") + lead + "</p>";
    var meta = '<p class="meta">' + icon("i-clock") + esc(hoursWords(f.freeHours) + " free in evenings and at the weekend") + "</p>";
    return "<div>" + top("<h2 data-greet>" + esc(greetText(new Date())) + "</h2>") + lead + meta + "</div>";
  }

  /** One event as a row: its time, its name, who or what kind; a press opens it. */
  function dayRow(e, withDay) {
    var who = whoWords(e);
    var kind = e.kind !== "client" ? KIND_WORDS[e.kind] : "";
    var sub = who || kind;
    return '<button type="button" class="dayrow k-' + e.kind + (hasEnded(e) ? " past" : "") + (isNow(e) ? " now" : "") + '" data-act="event" data-id="' + esc(e.id) + '">' +
      '<span class="t num">' + esc(e.allDay ? "All day" : clock(e.start)) + "</span>" +
      '<span class="w">' + bdi(e.title) + (sub ? "<small>" + bdi(sub) + (withDay ? "" : "") + "</small>" : "") + "</span></button>";
  }

  function nowCard(e, nowM) {
    var end = endOf(e);
    var pct = Math.max(0, Math.min(100, Math.round((nowM - e.start) / Math.max(1, end - e.start) * 100)));
    return '<div class="nowcard"><span class="tagline"><span class="live"></span>Now</span>' +
      '<button type="button" class="evtitle" data-act="event" data-id="' + esc(e.id) + '">' + bdi(e.title) + "</button>" +
      '<span class="evmeta">Until ' + esc(clock(end)) + " · " + esc(lengthWords(end - nowM)) + " left" + (e.place ? " · " + bdi(e.place) : "") + "</span>" +
      '<span class="progress" aria-hidden="true"><span style="width:' + pct + '%"></span></span></div>';
  }
  function nextCard(e, nowM) {
    var who = whoWords(e);
    var acts = "";
    if (withPeople(e) && canAsk()) acts += '<button type="button" class="btn small dark" data-act="prep" data-id="' + esc(e.id) + '">' + icon("i-doc") + "Prep me</button>";
    if (!state.example && canAsk() && changeAllowed(state.data)) acts += '<button type="button" class="btn small" data-act="reschedule" data-id="' + esc(e.id) + '">' + icon("i-move") + "Move it</button>";
    acts += '<button type="button" class="btn small" data-act="event" data-id="' + esc(e.id) + '">Details</button>';
    return '<div class="nextcard"><span class="tagline">Next · ' + esc(inWords(e.start - nowM)) + "</span>" +
      '<span class="evtime num">' + esc(clock(e.start)) + (e.end !== null ? " to " + esc(clock(endOf(e))) : "") + "</span>" +
      '<button type="button" class="evtitle" data-act="event" data-id="' + esc(e.id) + '">' + bdi(e.title) + "</button>" +
      (who || e.place ? '<span class="evmeta">' + (who ? icon("i-users") + bdi(who) : "") + (e.place ? (who ? "<span>·</span>" : "") + icon("i-pin") + bdi(e.place) : "") + "</span>" : "") +
      '<div class="nudge-actions">' + acts + "</div></div>";
  }

  /** Today: what's on now, what's next with a live countdown, the rest, and when you're free. */
  function drawToday(level) {
    var f = state.facts;
    var nowM = nowMinutes();
    var n = f.days[0].events.length;
    if (level === "S") {
      var line = f.now.length ? "<b>Now:</b> " + bdi(f.now[0].title)
        : f.next ? "<b>" + esc(cap(inWords(f.next.start - nowM))) + ":</b> " + bdi(f.next.title)
        : f.tomorrowFirst ? "<b>Tomorrow " + esc(clock(f.tomorrowFirst.start)) + ":</b> " + bdi(f.tomorrowFirst.title)
        : "Nothing else today";
      return sumBox("today", "Today", "i-clock", String(n), n ? plural(n, "event", "events") + " today" : "A free day", line);
    }
    var body = "";
    if (f.allDayToday.length) {
      body += '<div class="allday">' + f.allDayToday.map(function (e) {
        return '<button type="button" class="tag-ev" data-act="event" data-id="' + esc(e.id) + '">' + icon("i-calendar") + bdi(e.title) + "</button>";
      }).join("") + "</div>";
    }
    f.now.forEach(function (e) { body += nowCard(e, nowM); });
    if (f.next) body += nextCard(f.next, nowM);
    var rows = f.later.map(function (e) { return "<li>" + dayRow(e) + "</li>"; }).join("");
    if (rows) body += '<ol class="rows dayrows">' + rows + "</ol>";
    if (!f.now.length && !f.next) {
      // The day is done (or empty): what helps now is a look at tomorrow.
      body += '<p class="today-end">' + icon("i-sun") + "<span>" + (n ? "Nothing else on your calendar today." : "Nothing on your calendar today.") + "</span></p>";
      var tomorrow = f.days[1].events;
      if (tomorrow.length) {
        body += '<p class="tagline">Tomorrow</p><ol class="rows dayrows">' + tomorrow.map(function (e) { return "<li>" + dayRow(e) + "</li>"; }).join("") + "</ol>";
      }
    } else {
      var lastEnd = Math.max.apply(null, f.now.concat(f.next ? [f.next] : [], f.later).map(endOf));
      if (lastEnd < 21 * 60) body += '<p class="today-end">' + icon("i-sun") + "<span>Free from <b>" + esc(clock(lastEnd)) + "</b>.</span></p>";
    }
    if (f.earlier.length) body += '<p class="earlier">' + esc(count(f.earlier.length, "event", "events")) + " earlier today</p>";
    return boxHead("today", "Today", "i-clock", longDate(f.today), null) + '<div class="box-body today-body">' + body + "</div>" +
      nudgeHtml(boxIdea("today")) + moreButton();
  }

  /** Free time: the free evenings and weekend stretches, the longest marked, each on its day's own time. */
  function drawFree(level) {
    var f = state.facts;
    if (level === "S") {
      return sumBox("free", "Free time", "i-sun", f.best ? lengthWords(f.best.slot.end - f.best.slot.start) : "",
        f.best ? esc(f.bestWords) : "No long free stretch", f.best ? esc(clock(f.best.slot.start) + " to " + clock(f.best.slot.end)) : "");
    }
    var head = boxHead("free", "Free time", "i-sun", hoursWords(f.freeHours) + " free", null);
    if (!f.free.length) {
      return head + '<div class="box-body"><p class="lane-empty">No free evening or weekend stretch of 1.5 hours or more this week.</p></div>' + moreButton();
    }
    var rows = f.free.map(function (s) {
      var w = windowOf(s.day.date);
      var span = w.to - w.from;
      var DAY_FROM = w.from;
      var mins = s.slot.end - s.slot.start;
      var best = s === f.best;
      return '<li class="' + (best ? "best" : "") + '"><span class="fday">' + esc(stretchWords(s.day, s.slot, f.today)) + (best ? '<span class="chip ok">Longest</span>' : "") + "</span>" +
        '<span class="frange num">' + esc(clock(s.slot.start) + " to " + clock(s.slot.end)) + "</span>" +
        '<span class="flen num">' + esc(lengthWords(mins)) + "</span>" +
        '<span class="fbar" aria-hidden="true"><span style="left:' + Math.round((s.slot.start - DAY_FROM) / span * 100) + "%;width:" + Math.round(mins / span * 100) + '%"></span></span></li>';
    }).join("");
    return head + '<div class="box-body"><ol class="rows freelist">' + rows + "</ol></div>" + moreButton() + nudgeHtml(boxIdea("free"));
  }

  /** This week: a count, a list by day, or a real week of seven columns when there is room. */
  function drawWeek(level) {
    var f = state.facts;
    if (level === "S") {
      return sumBox("week", "This week", "i-calendar", String(f.events), "events in 7 days",
        f.busiest ? "Busiest: <b>" + esc(dayWord(f.busiest.day.date, f.today)) + "</b>, " + esc(count(f.busiest.n, "event", "events")) : "");
    }
    var head = boxHead("week", "This week", "i-calendar", count(f.events, "event", "events"), null);
    if (level === "M") {
      var html = "";
      f.days.forEach(function (d, i) {
        html += '<li class="agday' + (i === 0 ? " today" : "") + '"><span>' + esc(dayWord(d.date, f.today)) + "</span><small>" + esc(shortDate(d.date)) + "</small></li>";
        if (d.outside) { html += '<li class="agnone">Not read yet. Refresh to read it.</li>'; return; }
        if (!d.events.length) html += '<li class="agnone">Nothing planned</li>';
        d.events.forEach(function (e) { html += "<li>" + dayRow(e) + "</li>"; });
      });
      return head + '<div class="box-body"><ol class="rows weeklist">' + html + "</ol></div>" + moreButton() + nudgeHtml(boxIdea("week"));
    }
    var clash = {};
    f.conflicts.forEach(function (c) { clash[c.a.id] = clash[c.b.id] = true; });
    var cols = f.days.map(function (d, i) {
      if (d.outside) {
        return '<div class="col"><span class="dname">' + esc(DAYS[d.date.getDay()].slice(0, 3)) + '</span><span class="dnum num">' + d.date.getDate() + '</span><span class="ev-more">Not read yet</span></div>';
      }
      var items = d.events.map(function (e) {
        return { at: e.allDay ? -1 : e.start, html: '<button type="button" class="ev k-' + e.kind + (hasEnded(e) ? " past" : "") + (isNow(e) ? " now" : "") + (clash[e.id] ? " clash" : "") + '" data-act="event" data-id="' + esc(e.id) + '"' + (clash[e.id] ? ' title="Overlaps another event"' : "") + ">" +
          '<span class="num">' + esc(e.allDay ? "All day" : clock(e.start)) + "</span><b>" + bdi(e.title) + "</b></button>" };
      });
      var best = f.best && f.best.day === d ? f.best : null;
      if (best) items.push({ at: best.slot.start - 0.5, html: '<span class="ev freeslot">' + icon("i-sun") + "Free " + esc(clock(best.slot.start)) + " to " + esc(clock(best.slot.end)) + "</span>" });
      items.sort(function (a, b) { return a.at - b.at; });
      var shownItems = items.slice(0, 6).map(function (it) { return it.html; }).join("");
      return '<div class="col' + (i === 0 ? " today" : "") + '"><span class="dname">' + esc(i === 0 ? "Today" : DAYS[d.date.getDay()].slice(0, 3)) + "</span>" +
        '<span class="dnum num">' + d.date.getDate() + "</span>" + (items.length ? shownItems : '<span class="ev-more">Nothing planned</span>') +
        (items.length > 6 ? '<span class="ev-more">+' + (items.length - 6) + " more</span>" : "") + "</div>";
    }).join("");
    return head + '<div class="strip">' + cols + "</div>" + nudgeHtml(boxIdea("week"));
  }

  /** Plans and dates from today on, within 30 days. */
  function within30(list) {
    var today = startOfToday();
    return list.filter(function (u) { var n = daysBetween(today, parseDay(u.day)); return n >= 0 && n <= 30; });
  }
  function soonPlans() { return state.data ? within30(state.data.upcoming || []) : []; }
  function soonDates() { return state.data ? within30(state.data.dates || []) : []; }
  function whenAhead(u) {
    var d = parseDay(u.day);
    var n = daysBetween(startOfToday(), d);
    var day = n === 0 ? "Today" : n === 1 ? "Tomorrow" : n < 7 ? DAYS[d.getDay()] : shortDate(d);
    return day + (u.start !== null && u.start !== undefined ? ", " + clock(u.start) : "");
  }
  var AHEAD_WORDS = { appointment: "Appointment", school: "School", booking: "Booking", travel: "Trip", family: "Family", other: "" };

  /** Coming up: appointments, bookings, school dates and trips in the next 30 days. */
  function drawComing(level) {
    var list = soonPlans();
    if (level === "S") {
      var top = list[0];
      return sumBox("coming", "Coming up", "i-calendar", String(list.length), list.length ? "in the next 30 days" : "Nothing planned",
        top ? "<b>" + esc(whenAhead(top)) + ":</b> " + bdi(top.title) : "");
    }
    var rows = list.map(function (u) {
      var kind = AHEAD_WORDS[u.kind] || "";
      return '<li><span class="cwhen num">' + esc(whenAhead(u)) + '</span><span class="cwhat"><b>' + bdi(u.title) + "</b>" +
        (u.place || kind ? "<small>" + bdi([kind, u.place].filter(Boolean).join(" · ")) + "</small>" : "") + "</span></li>";
    }).join("");
    return listBox("coming", "Coming up", "i-calendar", "", list.length, '<ol class="rows aheadlist">' + rows + "</ol>",
      "Nothing planned in the next 30 days.") + nudgeHtml(boxIdea("coming"));
  }

  /** Birthdays and dates: the next 30 days, with a nudge to plan something. */
  function drawDates(level) {
    var list = soonDates();
    if (level === "S") {
      var top = list[0];
      return sumBox("dates", "Dates", "i-sun", String(list.length), list.length ? "in the next 30 days" : "None soon",
        top ? "<b>" + esc(whenAhead(top)) + ":</b> " + bdi(top.title) : "");
    }
    var rows = list.map(function (u) {
      var n = daysBetween(startOfToday(), parseDay(u.day));
      var soon = n === 0 ? "Today" : n === 1 ? "Tomorrow" : "In " + n + " days";
      return '<li><span class="cwhat"><b>' + bdi(u.title) + "</b><small>" + esc(soon + " · " + longDate(parseDay(u.day))) + "</small></span>" +
        (canAsk() ? '<button type="button" class="btn small" data-act="ask" data-q="' + esc("Help me plan something for " + u.title + " on " + longDate(parseDay(u.day)) + ": a gift or a plan, and a short message I could send.") + '">' + icon("i-bulb") + "Plan something</button>" : "") + "</li>";
    }).join("");
    return listBox("dates", "Birthdays and dates", "i-sun", "", list.length, '<ol class="rows aheadlist">' + rows + "</ol>",
      "No birthdays or dates in the next 30 days.") + nudgeHtml(boxIdea("dates"));
  }

  /** Double bookings: events on one day that overlap, with a press to sort it out. */
  function drawConflicts(level) {
    var f = state.facts;
    var list = f.conflicts;
    if (level === "S") {
      return sumBox("conflicts", "Double bookings", "i-overlap", String(list.length), list.length ? plural(list.length, "overlap", "overlaps") + " this week" : "None this week",
        list[0] ? "<b>" + esc(dayWord(list[0].day.date, f.today)) + ":</b> " + bdi(list[0].a.title) : "");
    }
    var rows = list.map(function (c) {
      return '<li><span class="cday">' + esc(dayWord(c.day.date, f.today) + " " + clock(c.from)) + "</span>" +
        '<span class="cwhat">' + bdi(c.a.title) + " <i>and</i> " + bdi(c.b.title) + "<small>overlap by " + esc(lengthWords(c.minutes)) + "</small></span>" +
        '<button type="button" class="btn small" data-act="fix-overlap" data-a="' + esc(c.a.id) + '" data-b="' + esc(c.b.id) + '">Help me fix it</button></li>';
    }).join("");
    return listBox("conflicts", "Double bookings", "i-overlap", "", list.length, '<ol class="rows clashes">' + rows + "</ol>", "No double bookings this week.");
  }
  function fixAsk(a, b) {
    return "“" + a.title + "” and “" + b.title + "” overlap on " + longDate(parseDay(a.day)) + ". Suggest what to move and to when so both can still happen. Don't change anything; show me first.";
  }

  /** Your time: where the week's hours go, as one bar and a legend. */
  function drawBalance(level) {
    var f = state.facts;
    var k = f.byKind;
    if (level === "S") {
      return sumBox("balance", "Your time", "i-pie", hoursWords(f.meetHours), "in meetings this week", esc(hoursWords(k.personal / 60)) + " personal");
    }
    var parts = [
      { cls: "client", label: "With others", min: k.client },
      { cls: "team", label: "Team", min: k.team },
      { cls: "other", label: "Other", min: k.other },
      { cls: "personal", label: "Personal", min: k.personal },
      { cls: "free", label: "Free, weekdays", min: Math.round(f.freeHours * 60) }
    ];
    var bar = '<div class="tbar" aria-hidden="true">' + parts.filter(function (p) { return p.min > 0; }).map(function (p) {
      return '<span class="k-' + p.cls + '" style="flex:' + p.min + '" title="' + esc(p.label + ": " + lengthWords(p.min)) + '"></span>';
    }).join("") + "</div>";
    var legend = '<ul class="tlegend">' + parts.map(function (p) {
      return '<li><span class="sw k-' + p.cls + '"></span>' + esc(p.label) + '<b class="num">' + esc(hoursWords(p.min / 60)) + "</b></li>";
    }).join("") + "</ul>";
    return boxHead("balance", "Your time", "i-pie", "this week", null) + '<div class="box-pad">' + bar + legend + "</div>";
  }

  // People you meet: from the routine's list of everyone met in 90 days or booked in 30.
  var FILTERS = [
    { id: "all", label: "All" },
    { id: "quiet", label: "Going quiet" },
    { id: "new", label: "New" },
    { id: "active", label: "Regular" }
  ];
  function sortedPeople(data) {
    return data.clients.slice().sort(function (a, b) {
      var an = a.next ? a.next.day + "T" + pad(a.next.start || 0) : null;
      var bn = b.next ? b.next.day + "T" + pad(b.next.start || 0) : null;
      if (an && bn) return an < bn ? -1 : an > bn ? 1 : 0;
      if (an) return -1;
      if (bn) return 1;
      var al = a.lastMet || "", bl = b.lastMet || "";
      return al > bl ? -1 : al < bl ? 1 : 0;
    });
  }
  function statusChip(c) {
    var s = STATUS[c.status];
    return '<span class="chip ' + (c.status === "quiet" ? "wait" : c.status === "new" ? "lead" : "open") + '">' + esc(s.label) + "</span>";
  }
  function drawPeople(level) {
    var f = state.facts;
    var all = sortedPeople(state.data);
    if (level === "S") {
      return sumBox("people", "People you meet", "i-users", String(all.length), "in the last 90 days",
        f.quiet.length ? '<span class="hot">' + f.quiet.length + " going quiet</span>" : "");
    }
    var counts = { all: all.length, quiet: 0, "new": 0, active: 0 };
    all.forEach(function (c) { counts[c.status] += 1; });
    if (state.filter !== "all" && !counts[state.filter]) state.filter = "all";
    var list = all.filter(function (c) { return state.filter === "all" || c.status === state.filter; });
    var seg = '<div class="seg" role="group" aria-label="Show people">' + FILTERS.map(function (fl) {
      return '<button type="button" data-act="filter" data-filter="' + fl.id + '" aria-pressed="' + (state.filter === fl.id) + '">' + esc(fl.label) + '<span class="n">' + (counts[fl.id] || 0) + "</span></button>";
    }).join("") + "</div>";
    var checkAll = f.quiet.length && canAsk() ? '<button type="button" class="btn small" data-act="checkin-all">' + icon("i-reply") + "Check in with everyone going quiet</button>" : "";
    var wide = level === "L";
    var rows = list.map(function (c) {
      var next = c.next ? whenShort(c.next.day, c.next.start, f.today) : "";
      var last = c.lastMet ? sinceWords(c.lastMet, f.today) : "";
      var name = '<span class="pname"><b>' + bdi(c.name) + "</b>" + (c.contact ? "<small>" + bdi(c.contact) + "</small>" : "") + "</span>";
      if (wide) {
        return '<li><button type="button" class="prow" data-act="person" data-id="' + esc(c.id) + '">' + name +
          '<span class="num r">' + c.meetings + "</span><span>" + esc(last || "Not yet") + "</span><span>" + esc(next || "Nothing booked") + "</span>" +
          '<span class="num r">' + esc(hoursWords(c.hours)) + "</span><span>" + statusChip(c) + "</span></button></li>";
      }
      return '<li><button type="button" class="prow" data-act="person" data-id="' + esc(c.id) + '"><span class="ptop">' + name + statusChip(c) + "</span>" +
        '<span class="pline">' + esc((next ? "Next: " + next : "Nothing booked") + " · " + (last ? "Last met " + (/^(Today|Yesterday)$/.test(last) ? last.toLowerCase() : last) : "Not met yet") + " · " + count(c.meetings, "meeting", "meetings") + " in 90 days") + "</span></button></li>";
    }).join("");
    var headRow = wide ? '<div class="phead"><span>Person or company</span><span class="r">Meetings, 90 days</span><span>Last met</span><span>Next</span><span class="r">Hours this month</span><span>Status</span></div>' : "";
    return boxHead("people", "People you meet", "i-users", count(all.length, "person or company", "people and companies"), null) +
      '<div class="ptools">' + seg + checkAll + "</div>" +
      '<div class="box-body">' + (all.length ? headRow + '<ol class="rows plist' + (wide ? " wide" : "") + '">' + rows + "</ol>" : '<p class="lane-empty">No meetings with other people in the last 90 days.</p>') + "</div>" + moreButton() + nudgeHtml(boxIdea("people"));
  }

  function drawQuiet(level) {
    var f = state.facts;
    var list = f.quiet;
    if (level === "S") {
      return sumBox("quiet", "Going quiet", "i-hourglass", String(list.length), list.length ? plural(list.length, "person", "people") + " to get back to" : "Nobody", list[0] ? bdi(list[0].name) : "");
    }
    var rows = list.map(function (c) {
      var last = c.lastMet ? sinceWords(c.lastMet, f.today) : "";
      return '<li><span class="pname"><b>' + bdi(c.name) + "</b><small>" + esc(last ? "Last met " + last : "Not met in 90 days") + "</small></span>" +
        (canAsk() ? '<button type="button" class="btn small" data-act="checkin" data-id="' + esc(c.id) + '">' + icon("i-reply") + "Draft a check-in</button>" : "") + "</li>";
    }).join("");
    return listBox("quiet", "Going quiet", "i-hourglass", "", list.length, '<ol class="rows quietlist">' + rows + "</ol>", "Nobody is going quiet. You've seen everyone recently.");
  }

  // ── Before and after ───────────────────────────────────────────────────
  // Meetings with other people today and tomorrow to prepare for, and the ones that ended
  // today to follow up, each with its press ready. A tick takes it off for good (kept per
  // person in cabinet.mine) and the next one moves up.

  var DONE_KEY = "calendar-week-done@1";
  function todayKey() { return ymd(new Date()); }
  function readyThings() {
    var f = state.facts;
    var pre = state.example ? "example:" : "";
    var out = [];
    // A routine that happens on three or more days this week (a daily standup) needs no
    // preparing or following up; and a meeting under way is past preparing for.
    var times = {};
    f.days.forEach(function (d) { d.events.forEach(function (e) { var k = e.title.toLowerCase(); times[k] = (times[k] || 0) + 1; }); });
    f.days.slice(0, 2).forEach(function (d, di) {
      d.events.forEach(function (e) {
        if (!withPeople(e) || e.day !== d.key || times[e.title.toLowerCase()] >= 3 || isNow(e)) return;
        var who = whoWords(e);
        if (!hasEnded(e)) {
          out.push({ key: pre + "prep:" + e.id + ":" + e.day, rank: 0, order: di * 1440 + e.start, title: "Prepare for " + e.title,
            why: whenShort(e.day, e.start, f.today) + (who ? ", with " + who : ""), action: { label: "Prep me", act: "prep", id: e.id } });
        } else {
          out.push({ key: pre + "follow:" + e.id + ":" + e.day, rank: 1, order: -endOf(e), title: "Follow up: " + e.title,
            why: "Ended at " + clock(endOf(e)) + (who ? ", with " + who : ""), action: { label: "Draft a follow-up", act: "follow", id: e.id } });
        }
      });
    });
    return out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
  }
  function drawReady(level) {
    var all = readyThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    if (level === "S") {
      return sumBox("ready", "Before and after", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "All done",
        open[0] ? "<b>" + bdi(open[0].title) + "</b>" : "");
    }
    var body = open.length
      ? '<ol class="rows things">' + open.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            (canAsk() ? '<button type="button" class="btn small" data-act="' + t.action.act + '" data-id="' + esc(t.action.id) + '">' + esc(t.action.label) + "</button>" : "<span></span>") + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else to prepare or follow up." : "Nothing to prepare or follow up today.") + "</p>";
    var foot = done ? '<div class="next-foot"><span></span><button type="button" class="btn quiet small" data-act="undone">' + done + " done · Bring back</button></div>" : "";
    return boxHead("ready", "Before and after", "i-check", "", open.length || null) + '<div class="box-body">' + body + "</div>" + foot + moreButton();
  }
  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.ready;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    readyThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }

  // ── Ask, and the ideas ─────────────────────────────────────────────────

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shownNow = shownIdeas();
    if (featured) shownNow[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shownNow[idea.id] && !state.hiddenIdeas[idea.id]; }).slice(0, level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask, or try an idea</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about your week, your free time, who you meet..." />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +
      (level !== "S" && note ? '<p class="note" id="ask-note">' + esc(note) + "</p>" : "");
  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */
  function drawLayoutAsk(level) {
    var note = state.askNote || "The agent suggests the boxes. Nothing changes until you press Apply.";
    return (level === "S" ? "" : '<h2 id="ask-title">Ask the agent about your boxes</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: hide the numbers, show birthdays" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about your week</button></p>';
  }
  function askHint() {
    if (askReady()) return "The answer opens in the chat beside this page.";
    return mode() === "not-here"
      ? "Once Google Calendar works here, you can ask things like these."
      : "Connect Google Calendar first, then ask anything. A question here takes you to connecting.";
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shownList = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shownList.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }
    var facts = ideaFacts();
    var can = canAsk();
    return listBox("ideas", "Ideas", "i-bulb", "", shownList.length,
      '<ul class="rows idea-rows">' + shownList.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }
  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (fit && fit.q ? ' data-q="' + esc(fit.q) + '"' : "") + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  // An idea offers itself in its box when this week says it would help, with the real
  // event, time or people, at most one per box. "Hide" takes it off the page for good (kept
  // per person in cabinet.mine); the Ideas panel in the top bar always has every one. On the
  // made-up example an idea shows what it would say, but asks only in general terms.

  var HIDDEN_IDEAS_KEY = "calendar-week-hidden-ideas@1";
  function ideaFacts() { return state.facts; }
  var IDEA_FITS = {
    weekend: function (f) {
      var dow = f.today.getDay();
      return dow >= 3 && dow <= 5 ? { line: "The weekend is coming. See what's on and where you're free?", act: "Plan it" } : null;
    },
    birthday: function () {
      var d = soonDates()[0];
      if (!d) return null;
      var n = daysBetween(startOfToday(), parseDay(d.day));
      return n <= 14 ? { line: d.title + " " + (n === 0 ? "is today" : n === 1 ? "is tomorrow" : "is in " + n + " days") + ".", act: "Gift ideas" } : null;
    },
    school: function () {
      var any = soonPlans().some(function (u) { return u.kind === "school" && daysBetween(startOfToday(), parseDay(u.day)) <= 7; });
      return any ? { line: "School has dates this week. See them in one list?", act: "List them" } : null;
    },
    overlap: function (f) {
      var c = f.conflicts[0];
      if (!c) return null;
      return { line: (f.conflicts.length === 1 ? "Two plans overlap" : f.conflicts.length + " overlaps this week, the first") + " " + onDay(c.day.date, f.today) + " at " + clock(c.from) + ".",
        act: "Help me fix it", q: state.example ? "" : fixAsk(c.a, c.b) };
    },
    protect: function (f) {
      var b = f.best;
      if (!b || b.slot.end - b.slot.start < 120) return null;
      var when = f.bestWords.charAt(0).toLowerCase() + f.bestWords.slice(1);
      var range = clock(b.slot.start) + " to " + clock(b.slot.end);
      var change = changeAllowed(state.data);
      return { line: freeWords(f) + ": " + lengthWords(b.slot.end - b.slot.start) + ".", act: change ? "Keep it free" : "Plan it",
        q: state.example ? "" : change
          ? "Block " + when + " (" + longDate(b.day.date) + ", " + range + ") on my Google Calendar as time for myself, so it stays free. Show me exactly what you'll add and wait for my yes."
          : "I'm free " + when + " (" + longDate(b.day.date) + ", " + range + "). Help me plan something nice for it." };
    },
    together: function (f) {

    },
    nextweek: function (f) {
      var dow = f.today.getDay();

    }
  };

  // ── One event or person, opened ────────────────────────────────────────

  var sheetFrom = null;

  }
  function closeSheet() {

  }
  function sheetButton(act, id, iconId, label, primary) {

  }
  function sheetEvent(e) {
    if (!e) return null;
    var today = startOfToday();
    var d = parseDay(e.day);
    var name = dayWord(d, today);
    var when = (name === DAYS[d.getDay()] ? longDate(d) : name + ", " + longDate(d)) +
      (e.allDay ? ", all day" : ", " + clock(e.start) + (e.end !== null ? " to " + clock(endOf(e)) : ""));
    var c = clientOf(state.data, e);
    var who = whoWords(e);
    var facts = '<ul class="sfacts"><li>' + icon("i-clock") + "<span>" + esc(when) + (isNow(e) ? ' <span class="chip ok">Now</span>' : "") + "</span></li>" +
      (who ? "<li>" + icon("i-users") + bdi(who) + "</li>" : "") +
      (e.place ? "<li>" + icon("i-pin") + bdi(e.place) + "</li>" : "") +
      "<li>" + icon("i-calendar") + "<span>" + esc(KIND_WORDS[e.kind]) + "</span></li></ul>";
    var acts = "";
    if (!state.example && canAsk()) {
      if (withPeople(e)) acts += hasEnded(e) ? sheetButton("follow", e.id, "i-reply", "Draft a follow-up", true) : sheetButton("prep", e.id, "i-doc", "Prep me", true);
      else acts += sheetButton("ask-event", e.id, "i-chat", "Ask about this", true);
      if (c) acts += sheetButton("about-person", c.id, "i-chat", "What should I know");
      if (changeAllowed(state.data) && !e.allDay) acts += sheetButton("reschedule", e.id, "i-move", "Reschedule");
    }
    if (e.link && !state.example) acts += '<a class="btn" href="' + esc(e.link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Google Calendar</a>";
    return { kicker: e.kind === "client" ? "Meeting with others" : KIND_WORDS[e.kind], title: e.title, sub: c ? c.name : null, facts: facts, acts: acts };
  }
  function sheetPerson(c) {
    if (!c) return null;
    var today = startOfToday();
    var next = c.next ? whenShort(c.next.day, c.next.start, today) : "";
    var facts = '<ul class="sfacts">' +

  function startEdit() {

  // ── Asking the agent to change the page ────────────────────────────────

  var CHANGE_SEEN_KEY = "calendar-personal-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {

  /** The words sent with a layout request: the boxes on the page now and who is asking. */

  /** When a note was written, from its ISO time; null when it is not a time. */

    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });

  function sendLayoutAsk(wish) {

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {

    }

  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {

    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = myName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });

  // A number box can sound like a list ("Free hours", "Free time"), so it says it is the number.
  function titles(ids) {

  }
  function paintSuggest() {
    var el = $("suggest");

    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");

      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">' + icon("i-check") + "Apply</button>" +

  function markChangeSeen(at) {

    c.add.forEach(function (id) {

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a

  // hold also starts editing. While a box moves, the others make room live and an outline

  var HOLD_MS = 600;

  var DRAG_START = 10;

  }

    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }

    }), id);
  }

    spots.forEach(function (s) {

      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {

    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }

    var name = LEVEL_WORDS[level];
    if (!BOXES[id].list) return name;

  function beginDrag(kind, el, x, y, touch) {
    var id = el.getAttribute("data-box");
    var r = el.getBoundingClientRect();
    var spot = spotIn(placed(), id);
    if (!spot) return;
    drag = { kind: kind, id: id, el: el, touch: !!touch, x: x, y: y, x0: x, y0: y, scroll0: window.scrollY, spots: null };
    if (kind === "stack") {
      var boxes = Array.prototype.filter.call($("grid").children, function (c) { return c.hasAttribute("data-box"); });
      drag.boxes = boxes;
      drag.from = boxes.indexOf(el);
      drag.to = drag.from;
      drag.gap = parseFloat(getComputedStyle($("grid")).rowGap) || GAP;
      drag.step = r.height + drag.gap;
      drag.mids = boxes.map(function (b) { var br = b.getBoundingClientRect(); return br.top + window.scrollY + br.height / 2; });
    } else if (kind === "move") {
      drag.w = spot.w;
      drag.h = spot.h;
      drag.grabX = x - r.left;
      drag.grabY = y - r.top;
    } else {
      drag.sx = spot.x;
      drag.sy = spot.y;
      drag.pw0 = r.width;
      drag.ph0 = r.height;
    }
    // Whatever was still animating this box lets go of it, or it would hold the box still
    // while the hand moves.
    el.classList.remove("rise");
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.classList.add(kind === "size" ? "sizing" : "lifted");
    $("grid").classList.add("arranging");
    document.body.classList.add(kind === "size" ? "is-sizing" : "is-moving");
    if (touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* not allowed here */ } }
    moveDrag(x, y);
    drag.raf = requestAnimationFrame(edgeScroll);
  }

  function moveDrag(x, y) {
    drag.x = x;
    drag.y = y;
    if (drag.kind === "stack") moveInColumn();
    else if (drag.kind === "move") moveOnGrid();
    else resizeOnGrid();
  }

  function moveOnGrid() {
    var m = gridMetrics();
    var left = drag.x - drag.grabX;
    var top = drag.y - drag.grabY;
    // The spot only changes once the box is well past a border (four fifths of a cell),
    // so a hand resting near the line does not flip it back and forth.
    var fx = (left - m.left) / m.col;
    var fy = (top - m.top) / m.row;
    var tx = drag.spots && Math.abs(fx - drag.tx) < STICK ? drag.tx : clamp(Math.round(fx), 0, COLS - drag.w);
    var ty = drag.spots && Math.abs(fy - drag.ty) < STICK ? drag.ty : Math.max(0, Math.round(fy));
    if (!drag.spots || drag.tx !== tx || drag.ty !== ty) {
      drag.tx = tx;
      drag.ty = ty;
      var before = snapshot(drag.el);
      drag.spots = previewWith(drag.id, tx, ty, drag.w, drag.h);
      showSpots(drag.spots);
      glide(before, drag.el, SMOOTH);
      placeOverlay(overlay("drop-spot"), spotIn(drag.spots, drag.id));
    }
    drag.el.style.transform = "translate(" + (left - (m.left + tx * m.col)) + "px," + (top - (m.top + ty * m.row)) + "px)";
  }

  // The box follows the hand pixel by pixel; the outline shows the grid size it will take,
  // the neighbours make room for that size, and letting go glides the box into it.
  function resizeOnGrid() {
    var m = gridMetrics();
    var min = minSize(drag.id);
    var dy = drag.y - drag.y0 + (window.scrollY - drag.scroll0);
    var pw = clamp(drag.pw0 + drag.x - drag.x0, min.w * m.col - GAP, (COLS - drag.sx) * m.col - GAP);
    var ph = clamp(drag.ph0 + dy, min.h * m.row - GAP, 40 * m.row - GAP);
    drag.el.style.width = pw + "px";
    drag.el.style.height = ph + "px";
    var fw = (pw + GAP) / m.col;
    var fh = (ph + GAP) / m.row;
    var w = drag.spots && Math.abs(fw - drag.w) < STICK ? drag.w : clamp(Math.round(fw), min.w, COLS - drag.sx);
    var h = drag.spots && Math.abs(fh - drag.h) < STICK ? drag.h : clamp(Math.round(fh), min.h, 40);
    if (drag.spots && drag.w === w && drag.h === h) return;
    drag.w = w;
    drag.h = h;
    var before = snapshot(drag.el);
    drag.spots = previewWith(drag.id, drag.sx, drag.sy, w, h);
    showSpots(drag.spots);
    glide(before, drag.el, SMOOTH);
    var spot = spotIn(drag.spots, drag.id);
    placeOverlay(overlay("drop-spot"), spot);
    placeOverlay(overlay("size-tag"), spot);
  }
  /** The label names what the box shows at the size it has under the hand. */
  function sizeTag(el) {
    var tag = drag && drag.kind === "size" && drag.el === el ? $("grid").querySelector(".size-tag") : null;
    if (tag) tag.textContent = sizeWords(el);
  }

  function moveInColumn() {
    var dy = drag.y - drag.y0 + (window.scrollY - drag.scroll0);
    drag.el.style.transform = "translateY(" + dy + "px) scale(1.02)";
    // The edge leading the move passes a box once it crosses that box's middle, so a tall
    // box does not have to travel its own height before the others make room.
    var top = drag.mids[drag.from] - (drag.step - drag.gap) / 2 + dy;
    var bottom = top + drag.step - drag.gap;
    var to = drag.from;
    drag.mids.forEach(function (mid, i) {
      if (i > drag.from && bottom > mid + 24) to++;
      if (i < drag.from && top < mid - 24) to--;
    });
    drag.to = to;
    drag.boxes.forEach(function (b, i) {
      if (b === drag.el) return;
      var shift = drag.from < to && i > drag.from && i <= to ? -drag.step : drag.from > to && i >= to && i < drag.from ? drag.step : 0;
      b.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
  }

  /**
   * Near the top or bottom of the window, the page scrolls while something is held: only
   * after it has rested there for a moment, slowly at first and never fast, so a box carried
   * past the edge does not send the page racing.
   */
  var EDGE = 56;
  var EDGE_WAIT_MS = 300;
  var EDGE_MAX = 7;
  function edgeScroll(now) {
    if (!drag) return;
    var into = drag.y < EDGE ? -(EDGE - drag.y) : drag.y > window.innerHeight - EDGE ? drag.y - window.innerHeight + EDGE : 0;
    if (!into) drag.edgeSince = 0;
    else if (!drag.edgeSince) drag.edgeSince = now || performance.now();
    var waited = drag.edgeSince ? (now || performance.now()) - drag.edgeSince : 0;
    if (into && waited > EDGE_WAIT_MS) {
      // Speed grows with how deep into the edge the hand is and how long it has stayed.
      var ramp = Math.min(1, (waited - EDGE_WAIT_MS) / 600);
      var v = Math.max(1, Math.round(Math.min(EDGE_MAX, Math.abs(into) / 6) * ramp));
      window.scrollBy(0, into < 0 ? -v : v);
      moveDrag(drag.x, drag.y);
    }
    drag.raf = requestAnimationFrame(edgeScroll);
  }

  function endDrag(cancelled) {
    if (!drag) return;
    var d = drag;
    drag = null;
    cancelAnimationFrame(d.raf);
    clearOverlays();
    $("grid").classList.remove("arranging");
    document.body.classList.remove("is-moving", "is-sizing");
    d.el.classList.remove("lifted", "sizing");
    // The held box and the ones that made room keep their offsets until the glide takes over.
    if (d.kind === "stack") {
      if (cancelled || d.to === d.from) { settleBack(SMOOTH); return; }
      var ids = d.boxes.map(function (b) { return b.getAttribute("data-box"); });
      ids.splice(d.to, 0, ids.splice(d.from, 1)[0]);
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
        var at = ids.indexOf(b.id);
        if (at >= 0) b.o = at;
        return b;
      }), SMOOTH);
      return;
    }
    if (cancelled || !d.spots) { settleBack(SMOOTH); return; }
    if (keepSpots(d.spots, SMOOTH) && d.kind === "size") {
      requestAnimationFrame(function () { toast(BOXES[d.id].title + ": " + sizeWords(d.el)); });
    }
  }

  // Mouse and pen: press on a box and move a little; the corner handle resizes at once
  // (for a finger too: it never scrolls the page).
  document.addEventListener("pointerdown", function (e) {
    if (!state.editing || drag || e.button !== 0) return;
    var el = e.target.closest ? e.target.closest("#grid > .box") : null;
    if (!el) return;
    if (e.target.closest(".box-resize")) {
      e.preventDefault();
      beginDrag("size", el, e.clientX, e.clientY, false);
      return;
    }
    if (e.pointerType === "touch" || e.target.closest(".box-x, .box-size")) return;
    press = { el: el, x: e.clientX, y: e.clientY };
  });
  document.addEventListener("pointermove", function (e) {
    if (drag && !drag.touch) { moveDrag(e.clientX, e.clientY); return; }
    if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > DRAG_START) {
      var p = press;
      press = null;
      beginDrag(phone() ? "stack" : "move", p.el, e.clientX, e.clientY, false);
      // The grab point is where the press began, not where the move was noticed.
      if (drag && drag.kind === "move") { drag.grabX -= e.clientX - p.x; drag.grabY -= e.clientY - p.y; moveDrag(e.clientX, e.clientY); }
      if (drag && drag.kind === "stack") { drag.y0 = p.y; moveDrag(e.clientX, e.clientY); }
    }
  });
  document.addEventListener("pointerup", function () { press = null; if (drag && !drag.touch) endDrag(false); });
  document.addEventListener("pointercancel", function () { press = null; if (drag && !drag.touch) endDrag(true); });

  // A finger: hold still on a box for a moment, then drag.
  document.addEventListener("touchstart", function (e) {
    if (drag || e.touches.length !== 1 || !state.data) return;
    var el = e.target.closest ? e.target.closest("#grid > .box") : null;
    if (!el || e.target.closest(".box-x, .box-size, .box-resize")) return;
    var t = e.touches[0];
    hold = { el: el, x: t.clientX, y: t.clientY, timer: setTimeout(function () {
      var h = hold;
      hold = null;
      if (!h || !h.el.isConnected) return;
      if (!state.editing) startEdit();
      beginDrag(phone() ? "stack" : "move", h.el, h.x, h.y, true);
    }, HOLD_MS) };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (hold && t && Math.abs(t.clientX - hold.x) + Math.abs(t.clientY - hold.y) > SLOP) {
      clearTimeout(hold.timer);
      hold = null;
    }
    if (drag && drag.touch && t) {
      e.preventDefault();
      moveDrag(t.clientX, t.clientY);
    }
  }, { passive: false });
  function touchOver(e, cancelled) {
    if (hold) { clearTimeout(hold.timer); hold = null; }
    if (drag && drag.touch) {
      // No tap reaches what was under the finger when it lets go of a box.
      if (e.cancelable) e.preventDefault();
      endDrag(cancelled);
    }
  }
  document.addEventListener("touchend", function (e) { touchOver(e, false); }, { passive: false });
  document.addEventListener("touchcancel", function (e) { touchOver(e, true); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { if (drag || hold) e.preventDefault(); });

  // The keyboard: arrows move the box in focus, Shift and arrows resize it.
  var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  function keyMove(el, d, resize) {
    var id = el.getAttribute("data-box");
    if (phone()) {
      if (!d[1]) return;
      var ids = phoneOrder(placed()).map(function (s) { return s.id; });
      var from = ids.indexOf(id);
      var to = clamp(from + d[1], 0, ids.length - 1);
      if (to === from) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
        var at = ids.indexOf(b.id);
        if (at >= 0) b.o = at;
        return b;
      }));
      el.focus();
      toast(BOXES[id].title + " moved " + (d[1] < 0 ? "up" : "down") + ".");
      return;
    }
    var s = spotIn(placed(), id);
    if (!s) return;
    var min = minSize(id);
    if (resize) {
      var w = clamp(s.w + d[0], min.w, COLS - s.x);
      var h = clamp(s.h + d[1], min.h, 40);
      if (keepSpots(previewWith(id, s.x, s.y, w, h))) {
        el.focus();
        requestAnimationFrame(function () { toast(BOXES[id].title + ": " + sizeWords(el)); });
      }
      return;
    }
    // Down past empty space would only float back up, so it goes as far as it takes to move.
    for (var step = 1; step <= 40; step++) {
      var x = clamp(s.x + d[0] * step, 0, COLS - s.w);
      var y = Math.max(0, s.y + d[1] * step);
      if (x === s.x && y === s.y) return;
      if (keepSpots(previewWith(id, x, y, s.w, s.h))) {
        el.focus();
        toast(BOXES[id].title + " moved.");
        return;
      }
      if (d[0]) return;
    }
  }
  document.addEventListener("keydown", function (e) {
    if (!state.editing || drag || !ARROWS[e.key]) return;
    var el = document.activeElement;
    if (!el || !el.matches || !el.matches("#grid > .box")) return;
    e.preventDefault();
    keyMove(el, ARROWS[e.key], e.shiftKey);
  });

  // The Ideas panel: every idea, today's line when it fits, and the hidden ones to bring back.
  function paintIdeasPanel() {
    var can = canAsk();
    var facts = state.data ? ideaFacts() : null;
    $("drawer-body").innerHTML =
      (!V2 ? '<p class="fine" style="margin:0">Ask for any of these in the cabinet’s chat.</p>'
        : !askReady() ? '<p class="fine" style="margin:0">Connect Gmail and each of these is one tap away.</p>' : "") +
      IDEAS.map(function (idea) {
        var off = !!state.hiddenIdeas[idea.id];
        var fit = !off && facts && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<article class="idea' + (off ? " off" : "") + '">' +
          '<span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<h3>" + esc(idea.title) + "</h3><p>" + esc(idea.text) + "</p>" +
          (fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "") +
          (off ? '<div class="off-note">Hidden from your page<button type="button" class="btn quiet" data-act="idea-unhide" data-idea="' + idea.id + '">Show on my page</button></div>' : "") +
          '<div class="go"><button class="btn dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask now</button>" +
          '<button class="btn" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button></div>" +
          "</article>";
      }).join("");
  }

  var drawerTimer = 0;
  var drawerFrom = null;
  function openDrawer(kind) {
    var el = $("drawer");
    clearTimeout(drawerTimer);
    drawerFrom = document.activeElement;
    state.drawerOpen = true;
    state.drawerKind = kind;
    el.querySelector(".drawer-body").scrollTop = 0;
    paintDrawer();
    el.hidden = false;
    document.body.style.overflow = "hidden";
    // One frame on screen closed first, so the panel slides in rather than appearing.
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("open"); }); });
    el.querySelector(".drawer-panel").focus();
  }
  function closeDrawer() {
    var el = $("drawer");
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    el.classList.remove("open");
    document.body.style.overflow = "";
    drawerTimer = setTimeout(function () { el.hidden = true; }, 360);
    if (drawerFrom && drawerFrom.focus) drawerFrom.focus();
  }


  // ── Presses ────────────────────────────────────────────────────────────

  // A press anywhere outside the Layout menu closes it.
  document.addEventListener("pointerdown", function (event) {
    if (!state.menuOpen || !event.target.closest) return;
    if (event.target.closest("#layout-menu, [data-act='layout-menu']")) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) button.setAttribute("aria-expanded", "false");
  });
  window.addEventListener("resize", function () { if (state.menuOpen) { state.menuOpen = false; $("layout-menu").hidden = true; } });

  document.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    if (act === "sheet-scrim") { if (event.target === el) closeSheet(); return; }
    if (act === "event") openSheet({ event: id });
    else if (act === "person") openSheet({ person: id });
    else if (act === "sheet-close") closeSheet();
    else if (act === "prep" || act === "follow") {
      var e = eventById(id);
      if (!e) return;
      // On the made-up example the buttons show what is possible; a press explains instead.
      if (state.example) { openSheet({ event: id }); return; }
      closeSheet();
      ask(act === "prep" ? prepAsk(e) : followAsk(e));
    } else if (act === "reschedule") {
      var r = eventById(id);
      if (!r || state.example) return;
      closeSheet();
      ask("Move my “" + r.title + "” on " + longDate(parseDay(r.day)) + " at " + clock(r.start) + " to ", { send: false });
    } else if (act === "ask-event") {
      var a = eventById(id);
      if (!a) return;
      closeSheet();
      ask("Tell me about “" + a.title + "” on " + longDate(parseDay(a.day)) + (a.allDay ? "" : " at " + clock(a.start)) + ".");
    } else if (act === "about-person") {
      var p = personById(id);
      if (!p) return;
      closeSheet();
      ask(aboutAsk(p));
    } else if (act === "checkin") {
      var q = personById(id);
      if (!q) return;
      if (state.example) { openSheet({ person: id }); return; }
      closeSheet();
      ask(checkInAsk([q]));
    } else if (act === "checkin-all") {
      if (!state.facts || !state.facts.quiet.length) return;
      if (state.example) { openSheet({ person: state.facts.quiet[0].id }); return; }
      ask(checkInAsk(state.facts.quiet));
    } else if (act === "fix-overlap") {
      var x = eventById(el.getAttribute("data-a")), y = eventById(el.getAttribute("data-b"));
      if (!x || !y) return;
      if (state.example) { openSheet({ event: x.id }); return; }
      ask(fixAsk(x, y));
    } else if (act === "filter") {
      state.filter = el.getAttribute("data-filter") || "all";
      paintGrid();
    } else if (act === "connect") connect();
    else if (act === "run") runNow();
    else if (act === "ask") ask(el.getAttribute("data-q"));
    else if (act === "more-rows") {
      var boxId = el.closest(".box").getAttribute("data-box");
      var shownBefore = snapshot();
      state.expanded[boxId] = !state.expanded[boxId];
      fitBox(boxEl(boxId));
      glide(shownBefore);
    } else if (act === "idea-now") {
      var idea = ideaById(el.getAttribute("data-idea"));
      if (idea) { closeDrawer(); ask(el.getAttribute("data-q") || idea.ask); }
    } else if (act === "idea-routine") {
      var rt = ideaById(el.getAttribute("data-idea"));
      if (rt) { closeDrawer(); ask("Set this up as a routine that runs " + rt.at + ": " + rt.ask + " Show me the routine so I can approve it before it starts."); }
    } else if (act === "idea-hide") {
      setIdeaHidden(el.getAttribute("data-idea"), true);
    } else if (act === "idea-unhide") {
      setIdeaHidden(el.getAttribute("data-idea"), false);
    } else if (act === "ideas") {
      openDrawer("ideas");
    } else if (act === "done") {
      markDone(el.getAttribute("data-key"), el.closest(".thing"));
    } else if (act === "undone") {
      bringBack();
    } else if (act === "add-box") {
      openDrawer("add");
    } else if (act === "add-this") {
      var add = el.getAttribute("data-add");
      if (BOXES[add]) addBox(add);
    } else if (act === "phone-size") {
      var sized = el.closest(".box").getAttribute("data-box");
      var size = el.getAttribute("data-size");
      changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) { if (b.id === sized) b.p = size; return b; }));
      if (boxEls[sized]) { var sb = boxEls[sized].querySelector('[data-size="' + size + '"]'); if (sb) sb.focus(); }
    } else if (act === "layout-menu") {
      if (state.menuOpen) closeMenu(); else openMenu(el);
    } else if (act === "layout-edit") {
      closeMenu();
      startEdit();
    } else if (act === "layout-ask") {
      closeMenu();
      askAboutLayout();
    } else if (act === "layout-ask-cancel") {
      stopLayoutAsk();
    } else if (act === "change-apply") {
      applyChange();
    } else if (act === "change-skip") {
      skipChange();
    } else if (act === "change-undo") {
      state.changeApplied = false;
      undoLayout();
      paintSuggest();
      toast("Your page is back to how it was.");
    } else if (act === "change-ok") {
      state.changeApplied = false;
      paintSuggest();
    } else if (act === "remove-box") {
      removeBox(el.closest(".box").getAttribute("data-box"));
    } else if (act === "edit-start") {
      startEdit();
    } else if (act === "edit-done") {
      doneEdit();
    } else if (act === "undo") {
      undoLayout();
    } else if (act === "reset-layout") {
      resetLayout();
    } else if (act === "drawer-close") {
      closeDrawer();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      if (drag) endDrag(true);
      else if (state.menuOpen) closeMenu();
      else if (state.sheet) closeSheet();
      else if (state.drawerOpen) closeDrawer();
      else if (state.editing) doneEdit();
      return;
    }
    if (event.key !== "Tab" || !state.sheet) return;
    // Keep the keyboard inside the open sheet.
    var items = Array.prototype.slice.call(document.querySelectorAll("#layer button, #layer a[href]"));
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });

  // The Ask box is drawn again as it changes size, so its form is listened to from here.
  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    if (state.layoutAsk) sendLayoutAsk($("ask-input").value);
    else ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paint();

  if (PHONE) {
    var onPhoneChange = function () { if (state.loaded && state.data) { paintGrid(); paintEditbar(); } };
    if (PHONE.addEventListener) PHONE.addEventListener("change", onPhoneChange);
    else if (PHONE.addListener) PHONE.addListener(onPhoneChange);
  }
  // Rows are measured to fit their boxes; the web font changes their height once it arrives.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      Object.keys(boxEls).forEach(function (id) { if (boxEls[id].isConnected) fitBox(boxEls[id]); });
    });
  }
  var resizeTimer = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintStatus, 150);
  });
  // Now and next move on as the day goes: the page looks again every half minute, and a box
  // whose words did not change is left alone. Not while something is held, open or edited.
  setInterval(function () {
    if (state.loaded && !drag && !state.sheet && !state.editing && !document.hidden) paint();
  }, 30000);

  if (!V2) {
    loadData().then(paint);
    // No change events in an older Cabinet: look again when the page comes back into view.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData().then(paint); });
  } else {
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath && here.appPath.indexOf("..") < 0) appDir = here.appPath;
    }, function () {}).then(function () {
      return Promise.all([
        cab.connectors.list().then(setConnectors, function () {}),
        cab.jobs.list().then(setJobs, function () {}),
        loadData()
      ]);
    }).then(function () {
      paint();
      cab.connectors.onChange(function (list) { setConnectors(list); paint(); });
      cab.jobs.onChange(function (list) { setJobs(list); paint(); });
      try { cab.files.onChange(appDir + "/data", function () { loadData().then(paint); }); } catch (e) { /* older bridge */ }
    });
    // This person's own layout, hidden ideas and ticks, if they made any.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      if (!mine) return;
      var clean = cleanLayout(mine.get(LAYOUT_KEY));
      if (clean) state.layout = clean;
      var seen = mine.get(CHANGE_SEEN_KEY);
      if (typeof seen === "string") state.changeSeen = seen;
      var hidden = mine.get(HIDDEN_IDEAS_KEY);
      if (Array.isArray(hidden)) hidden.forEach(function (hid) { if (ideaById(hid)) state.hiddenIdeas[hid] = true; });
      var done = mine.get(DONE_KEY);
      var fresh = addDays(startOfToday(), -14);
      if (done && typeof done === "object") Object.keys(done).forEach(function (k) {
        var at = parseDay(done[k]);
        if (at && at >= fresh) state.done[k] = done[k];
      });
      paint();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
