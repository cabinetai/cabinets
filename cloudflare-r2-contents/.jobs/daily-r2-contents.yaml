id: daily-r2-contents
name: Daily R2 Contents
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: r2-reader
agentSlug: r2-reader
timeout: 900
prompt: |-
  Write today's bucket contents summary.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-contents.md` — the local time you
  ran, then that exact postfix. The page reads the folder, sorts by the name and
  opens the newest, so a name in any other shape is a summary nobody will see. You
  only ever ADD a file: never overwrite, rename or delete one already sitting there,
  including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns and the tone. This prompt does not repeat them.
  2. With your file tools, walk the cabinet's own folders. Skip `.agents`, `.jobs`,
     `.cabinet-state`, `summaries` and `contents` — that last one is this cabinet's
     own app folder, not synced content. Everything else is a real synced file.
  3. If nothing is there yet — the folder is effectively empty of user content, the
     normal state before the first sync — STOP HERE. Write nothing. Leave
     `summaries/` exactly as you found it, example and all. Report: "The bucket has
     not been synced yet. I would have read whatever landed and written up to
     twenty rows, most recently modified first." Then exit.
  4. Otherwise write your dated file, following the persona's frontmatter and table
     shape exactly.
  5. On the first run that finds real synced files, write your dated file and then
     delete `summaries/EXAMPLE-contents.md`. It is a demo, not a past summary, and
     it must not sit in the picker beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
