id: weekly-sharepoint-changes
name: Weekly SharePoint Changes
enabled: true
schedule: 0 8 * * 1
provider: codex-cli
adapterType: claude_local
ownerAgent: site-watcher
agentSlug: site-watcher
timeout: 900
prompt: |-
  Write this Monday's page of what changed in SharePoint.

  Your working directory is the cabinet root. Every summary lives in `weekly-summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-sharepoint-summary.md`: the local time
  you ran, then that exact postfix. The page reads the folder, sorts by the name and opens
  the newest, so a name in any other shape is a summary nobody will see. You only ever ADD
  a file: never overwrite, rename or delete one already sitting there, including one from
  earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the `Changed` and `Touches you` vocabularies, the row order and the tone.
     This prompt does not repeat them.
  2. Look through the SharePoint folders in this cabinet's sidebar, or your Microsoft 365
     tools if that is how it is connected, and list every file changed in the last seven
     days. File dates say when; Office files already on this computer name who saved
     them last. Drop every change the user made themselves. This page is about everyone
     else.
  3. This run is read only. Do not edit, rename, move, share or delete a document, and do
     not send mail, touch a calendar event or post to Teams.
  4. If a read fails, say which way in you tried and what it said, touch no file, and stop.
     Leave `weekly-summaries/` exactly as you found it, example and all.
  5. A week in which nobody else changed anything is a real result. Write the file with an
     empty table and a headline saying so. Never pad it with the user's own edits, and
     never reach further back than seven days to fill it out.
  6. On the first run that does reach SharePoint, write your dated file and then delete
     `weekly-summaries/EXAMPLE-sharepoint-summary.md`. It is a demo, not a past summary,
     and it must not sit in the date list beside real ones. Do not merge with it, do not
     rename it, and never write `EXAMPLE` into a name of your own.
cabinetPath: hilas-home/cabinets/sharepoint-week
