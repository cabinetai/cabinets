id: weekly-sharepoint-changes
name: Weekly SharePoint Changes
enabled: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: site-watcher
agentSlug: site-watcher
timeout: 900
prompt: |-
  Look at what changed in the team's SharePoint folders in the last 7 days, and write it
  down for the Week in Files app.

  Your working directory is this cabinet's folder. You write exactly two things, both
  inside it, and nothing anywhere else:
  - `week-in-files/data/latest.json`, the file the app shows. Its exact shape is in
    `week-in-files/DATA.md`.
  - `past-weeks/<today as YYYY-MM-DD>.md`, the same week as a page people read. Make the
    `past-weeks` folder if it is not there. A second look on the same day replaces that
    day's page.

  1. Read `week-in-files/DATA.md`, then `week-in-files/setup.md` (the person's own
     settings: their name at work, the folders that matter most, the folders to skip).
  2. Find the SharePoint folders. The "Connections this cabinet uses" part of your
     instructions says where: "the files under <path>", a path relative to this folder.
     They are folders Microsoft's sync app keeps on this computer, and they are view only.
     Every file you list must come from under one of those paths.
  3. List every file under them whose modified date is in the last 7 days (for example
     `find "<path>" -type f -mtime -7` on a Mac, or Get-ChildItem with LastWriteTime on
     Windows). Leave out hidden files, Office's temporary files (names starting with
     `~$`) and the folders the setup says to skip. Newest first.
  4. For Word, Excel and PowerPoint files, read who saved each one last from the
     `<cp:lastModifiedBy>` field in `docProps/core.xml` inside the file, for example
     `unzip -p "<file>" docProps/core.xml`. Read that one field and nothing else from
     inside a file. Every other file has no name: write null. Never guess a name.
  5. Pick at most one file worth a look first and say why in one short sentence, preferring
     the folders the setup says matter most. Never quote what a file says.
  6. Write `week-in-files/data/latest.json.tmp`, check it is valid JSON in the DATA.md
     shape, then rename it over `week-in-files/data/latest.json`. Then write the page in
     `past-weeks/`. Leave `week-in-files/data/EXAMPLE-latest.json` as it is.
  7. If a SharePoint folder cannot be read, or your instructions say SharePoint is not
     connected, write latest.json with "status": "problem", a one-sentence "problem" in
     plain words the person can act on, and an empty "changes" list. Write no page, and
     stop.

  This look only reads. Never change, move, rename or delete anything in the SharePoint
  folders, never write inside them, and never copy what a document says into any file.
  A week with no changes is a real answer: write it with an empty list.
