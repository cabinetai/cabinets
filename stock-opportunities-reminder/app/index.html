<!DOCTYPE html>
<!--
  Stock Opportunities Reminder: the page this cabinet opens on.

  Two screens: Opportunities (what the Stock Scout found on its last run, and how its
  earlier opportunities did) and My stocks (the person's list, with a chart of each).

  Where things come from:
    1. opportunities/YYYY-MM-DD.json at the cabinet's root, written by the Stock Scout,
       one file per day it ran.
    2. app/data/*.json, written by app/engine/refresh.mjs: prices, daily candles, signals,
       headlines, each rule's record, and what became of every opportunity (outcomes.json).
       DATA.md is the map of those files.
    3. The app's small server (app/engine/server.mjs), once the person allowed it:
       a chart for any symbol at any size, a search, a refresh now.
    4. The app's own store (window.cabinet.store): the person's list of stocks.

  The page reads prices. It cannot place an order, and neither can anything else here.
  Charts are drawn by TradingView's open-source Lightweight Charts, which is kept inside
  this file. Google Fonts are the only request that leaves Cabinet from this page.
  One file on purpose: a sealed frame cannot load files next to it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Opportunities Reminder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --page: #EEE9DF; --sheet: #FFFFFF; --sheet-2: #F8F6F1; --press: #EFEBE3; --hover: #F4F1EA;
    --ink: #1E1A15; --ink-2: #4B453C; --muted: #6E675B; --faint: #A39C8F;
    --line: rgba(64, 48, 20, .11); --line-2: rgba(64, 48, 20, .06);
    --brand: #3B2F2F; --on-brand: #FFFFFF; --brand-soft: #EFE7DA;
    --up: #12783A; --up-tint: #E4F3E9; --down: #C2321F; --down-tint: #FBE9E5;
    --warn: #96600C; --warn-tint: #FAF0DA; --info: #2B5C9E; --info-tint: #E6EEF8; --zone: rgba(43, 92, 158, .16);
    --grid: rgba(64, 48, 20, .07); --ma20: #C98A1B; --ma50: #2B6CB0; --ma200: #8B5CC7;
    --radius: 18px; --radius-s: 11px;
    --shadow: 0 1px 2px rgba(59, 47, 47, .05), 0 8px 24px -14px rgba(59, 47, 47, .22);
    --shadow-up: 0 2px 6px rgba(59, 47, 47, .08), 0 24px 60px -20px rgba(59, 47, 47, .38);
    --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page: #131110; --sheet: #1D1A17; --sheet-2: #23201C; --press: #2E2A25; --hover: #27231F;
    --ink: #F0EBE3; --ink-2: #CFC8BC; --muted: #9E968A; --faint: #6F685E;
    --line: rgba(255, 240, 215, .11); --line-2: rgba(255, 240, 215, .06);
    --brand: #EADFCB; --on-brand: #1E1A15; --brand-soft: #2F2A23;
    --up: #4CC38A; --up-tint: #16301F; --down: #FF7B6B; --down-tint: #3A1B17;
    --warn: #E6B45C; --warn-tint: #33280F; --info: #86B2EC; --info-tint: #17263A; --zone: rgba(134, 178, 236, .2);
    --grid: rgba(255, 240, 215, .06); --ma20: #E0A63C; --ma50: #6AA5E8; --ma200: #B58CE8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 240, 215, .04);
    --shadow-up: 0 2px 6px rgba(0, 0, 0, .4), 0 24px 60px -20px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }

  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); letter-spacing: -.006em; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  ::selection { background: var(--brand-soft); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: .85; }
  h1, h2, h3, h4, p, ul, dl, dd { margin: 0; }
  a { color: inherit; }
  svg.i { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* Focus is an outline, so no later box-shadow can hide it. Inside a box that clips, it is drawn inward. */
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .tick:focus-visible, .wrow:focus-visible, .seg button:focus-visible, .tog:focus-visible, .found button:focus-visible, .find input:focus-visible { outline-offset: -2px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
  .grow { flex: 1; min-width: 0; }
  /* Someone who may only read sees no control that changes anything. */
  html[data-read] [data-write] { display: none !important; }

  /* ── The frame: a top bar, the market's vital signs, then one screen ───── */
  #app { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 16px 8px; }
  .top h1 { font: 650 19px/1.15 var(--font); letter-spacing: -.025em; }
  .clock { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; line-height: 1.2; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .clock i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .clock[data-s="open"] i { background: var(--up); box-shadow: 0 0 0 3px var(--up-tint); }
  .clock[data-s="pre"] i, .clock[data-s="after"] i { background: var(--warn); }
  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--line-2); }
  .tab { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color 150ms ease, transform 140ms var(--ease-out); }
  .tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
  #refresh { margin-left: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 10px; font-weight: 500; white-space: nowrap; background: var(--sheet); box-shadow: var(--shadow); transition: transform 140ms var(--ease-out), background-color 150ms ease; }
  .btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: none; font-weight: 600; }
  .btn.quiet { background: transparent; box-shadow: none; color: var(--ink-2); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn:active, .tab:active, .tick:active, .seg button:active, .tog:active { transform: scale(.97); }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (hover: hover) and (pointer: fine) {
    .btn.quiet:hover, .tab:hover { color: var(--ink); }
    .btn:not(.primary):not(.quiet):hover, .row:hover, .wrow:hover { background: var(--hover); }
  }

  .strip { flex: none; display: flex; padding: 0 18px 12px; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .tick { flex: none; display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: center; padding: 4px 14px 4px 2px; text-align: left; transition: transform 140ms var(--ease-out); }
  .tick + .tick { padding-left: 14px; box-shadow: -1px 0 0 var(--line); }
  .tick b { display: block; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tick .p { font: 500 13.5px/1.2 var(--mono); letter-spacing: -.02em; }
  .tick .c { font: 500 12px/1 var(--mono); }
  .tick svg, .wrow svg { width: 54px; height: 26px; }

  .view { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; }
  .sheet { background: var(--sheet); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card { padding: 16px 18px; }
  .card > header { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .card h2, .daytitle { font: 600 15px/1.25 var(--font); letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .empty { padding: 18px 6px; color: var(--muted); text-align: center; }
  .empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-s); background: var(--warn-tint); font-size: 13px; }
  .note svg { color: var(--warn); margin-top: 1px; }
  .note.info { background: var(--info-tint); } .note.info svg { color: var(--info); }
  .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 2px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--press); color: var(--ink-2); }
  .chip svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
  .chip.good { background: var(--up-tint); color: var(--up); } .chip.bad { background: var(--down-tint); color: var(--down); }
  .chip.now { background: var(--info-tint); color: var(--info); } .chip.ex { background: var(--warn-tint); color: var(--warn); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--press); gap: 2px; }
  .seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: transform 140ms var(--ease-out); }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
  /* A word that explains itself: a button that reads as text, or as a chip. */
  .term { position: relative; border-bottom: 1px dotted var(--faint); cursor: help; text-align: inherit; }
  .term.chip { border-bottom: 0; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .foot { margin: 18px auto 0; max-width: 78ch; text-align: center; color: var(--muted); font-size: 12px; }
  .foot a { position: relative; }

  /* ── Opportunities ─────────────────────────────────────────────────────── */
  .opps { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr); gap: 14px; align-items: start; }
  .opps > .wide { grid-column: 1 / -1; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .market .stance { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 6px; }
  .market .lamp { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--warn-tint); color: var(--warn); }
  .market[data-s="with-you"] .lamp { background: var(--up-tint); color: var(--up); } .market[data-s="against-you"] .lamp { background: var(--down-tint); color: var(--down); }
  .market h2 { font-size: 17px; }
  .read { font: 400 16px/1.55 var(--serif); max-width: 74ch; }
  .market .acts { margin-top: 12px; }
  .whenrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .whenrow select, .whenrow input { height: 34px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet-2); }
  .daytitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px 4px 0; }

  .opp .sym { font: 600 17px/1.2 var(--mono); letter-spacing: -.02em; }
  .opp .headline { font: 500 19px/1.3 var(--serif); margin-bottom: 3px; }
  .opp .body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: center; margin: 12px 0 14px; }
  .opp canvas { display: block; width: 100%; height: 190px; border-radius: 12px; background: var(--sheet-2); }
  .opp h4 { font: 600 13px/1.2 var(--font); margin: 12px 0 4px; }
  .opp ul, .because { padding-left: 18px; } .opp li, .because li { margin-bottom: 3px; }
  .opp ul, .opp .say, .because { color: var(--ink-2); font-size: 13.5px; max-width: 76ch; }
  .opp .note { margin-top: 10px; }
  .opp .acts { margin-top: 14px; }
  /* The numbers of one opportunity, as label and value. The swatch matches the chart. */
  .nums { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; align-items: baseline; }
  .nums dt { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .nums dd b { font: 500 15px/1.3 var(--mono); letter-spacing: -.02em; }
  .nums dd small { display: block; color: var(--muted); font-size: 12px; }
  .nums dt i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 2px; background: var(--info); }
  .nums dt i.stop { background: var(--down); } .nums dt i.aim { background: var(--up); }

  .passed { padding: 9px 0; border-top: 1px solid var(--line-2); }
  .passed:first-of-type { border-top: 0; padding-top: 0; }
  .passed b, .row .s { font: 600 13.5px/1.2 var(--mono); letter-spacing: -.02em; }
  .passed p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; width: calc(100% + 16px); padding: 8px; margin: 0 -8px; border-radius: 10px; text-align: left; }
  .row .when { flex: none; width: 74px; color: var(--muted); font-size: 12.5px; }
  .row small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
  .score b { display: block; font: 500 22px/1.2 var(--mono); letter-spacing: -.03em; } .score span { font-size: 12.5px; color: var(--muted); }

  /* ── My stocks ─────────────────────────────────────────────────────────── */
  .view[data-screen="stocks"] { overflow: hidden; }
  .stocks { display: grid; grid-template-columns: 272px minmax(0, 1fr) 300px; gap: 14px; height: 100%; }
  .stocks > * { min-height: 0; }
  .watch { display: flex; flex-direction: column; padding: 12px 10px; }
  .find { position: relative; margin: 0 2px 8px; }
  .find input { width: 100%; height: 36px; padding: 0 10px 0 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet-2); caret-color: var(--brand); }
  .find > svg { position: absolute; left: 9px; top: 50%; margin-top: -8.5px; color: var(--muted); }
  .found { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); padding: 5px; border-radius: 12px; background: var(--sheet); box-shadow: var(--shadow-up); transform-origin: top center; animation: pop 150ms var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .found button { display: block; width: 100%; padding: 8px 9px; border-radius: 8px; text-align: left; }
  .found button[data-on], .found button:hover { background: var(--hover); }
  .found b { font: 600 13px var(--mono); } .found small, .wrow small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wlist { flex: 1; overflow: auto; margin: 0 -2px; padding: 0 2px; }
  .wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; width: 100%; padding: 7px 9px; border-radius: 10px; text-align: left; }
  .wrow[aria-current="true"] { background: var(--press); }
  .wrow .s { font: 600 13px/1.2 var(--mono); letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; }
  .wrow .s .chip { min-height: 17px; padding: 0 5px; font: 600 10.5px/1 var(--font); }
  .wrow .r { text-align: right; font: 500 12.5px/1.3 var(--mono); letter-spacing: -.02em; }
  .stage { display: flex; flex-direction: column; overflow: hidden; }
  .chead { display: flex; align-items: center; gap: 8px 12px; padding: 14px 18px 8px; flex-wrap: wrap; }
  .chead .name { min-width: 0; } .chead .name b { font: 600 17px/1.2 var(--mono); letter-spacing: -.02em; }
  .chead .name small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .chead .px { font: 500 22px/1.1 var(--mono); letter-spacing: -.03em; } .chead .ch { font: 500 13px/1.2 var(--mono); }
  .chead .ext { font-size: 12px; color: var(--muted); }
  .ctools { display: flex; align-items: center; gap: 8px; padding: 0 18px 10px; flex-wrap: wrap; }
  .tog { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: var(--muted); background: var(--press); transition: transform 140ms var(--ease-out); }
  .tog i { width: 10px; height: 3px; border-radius: 2px; }
  .tog[aria-pressed="true"] { color: var(--ink); background: var(--brand-soft); }
  .plot { position: relative; flex: 1; min-height: 240px; }
  .plot > div { position: absolute; inset: 0; }
  .plot .msg { display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); z-index: 2; background: var(--sheet); }
  .plot .msg b { color: var(--ink); }
  .plot > .legend { inset: 6px auto auto 14px; z-index: 3; font: 500 12px var(--mono); color: var(--muted); pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; }
  .side { overflow: auto; padding: 14px 16px; display: grid; gap: 16px; align-content: start; }
  .side h3 { font: 600 13px/1.2 var(--font); margin-bottom: 8px; }
  .side p, .heads .say { font-size: 13px; color: var(--ink-2); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 12px; }
  .fact > span { display: block; font-size: 12px; color: var(--muted); } .fact b { font: 500 14px/1.3 var(--mono); letter-spacing: -.02em; }
  .range { grid-column: span 2; } .range .bar { position: relative; height: 6px; border-radius: 3px; background: var(--press); margin: 6px 0 4px; }
  .range .bar i { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--sheet); }
  .range .ends { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
  .heads { list-style: none; padding: 0; } .heads li { padding: 6px 0; }
  .heads a { text-decoration: none; font-size: 13px; line-height: 1.35; display: block; } .heads a:hover { text-decoration: underline; } .heads small { color: var(--muted); font-size: 12px; }
  .rec { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
  .rec .chip { margin-right: 6px; } .rec b { color: var(--ink-2); font-weight: 500; }
  .side .nums { margin: 8px 0 10px; }

  .tip { position: fixed; z-index: 40; max-width: 260px; padding: 8px 10px; border-radius: 9px; background: var(--ink); color: var(--sheet); font-size: 12.5px; line-height: 1.4; pointer-events: none; opacity: 0; transform: scale(.97); transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out); }
  .tip.show { opacity: 1; transform: none; } .tip.instant { transition-duration: 0ms; }
  .toast { position: fixed; z-index: 50; left: 50%; bottom: 22px; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--sheet); font-weight: 500; box-shadow: var(--shadow-up); opacity: 0; transform: translate(-50%, 100%); transition: transform 400ms ease, opacity 400ms ease; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Narrower frames ───────────────────────────────────────────────────── */
  /* Inside Cabinet on a desktop the frame is often 580 to 730 pixels wide: everything is one
     column there, the tabs take a row with Refresh, and My stocks scrolls as one page. */
  @media (max-width: 1100px) {
    .opps { grid-template-columns: minmax(0, 1fr); }
    .top { flex-wrap: wrap; row-gap: 8px; } .top h1 { flex: 1 1 auto; }
    .tabs { order: 3; flex: 1 1 calc(100% - 140px); } .tab { flex: 1; } #refresh { order: 4; }
    .view[data-screen="stocks"] { overflow: auto; }
    .stocks { display: flex; flex-direction: column; height: auto; }
    .watch { padding: 10px; } .find { margin-bottom: 10px; }
    .wlist { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .wrow { flex: none; width: auto; min-width: 200px; background: var(--sheet-2); } .wrow small { max-width: 110px; }
    .plot { flex: none; height: 380px; }
    .side { overflow: visible; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px 24px; }
  }
  @media (max-width: 700px) { .opp .body { grid-template-columns: minmax(0, 1fr); } }
  /* A phone: the page itself scrolls, the tabs sit at the bottom, every control is tall enough to press. */
  @media (max-width: 600px) {
    body { overflow: auto; } #app { height: auto; min-height: 100%; padding-bottom: 76px; }
    .top { padding: 12px 12px 10px; gap: 8px 10px; } .top h1 { font-size: 17px; }
    .clock { order: 2; padding: 8px 12px; } #refresh { order: 1; }
    .view, .view[data-screen="stocks"] { padding: 0 12px 12px; overflow: visible; } .strip { padding: 0 12px 10px; }
    .card { padding: 14px; }

    .heads li { padding: 0; } .heads a { display: flex; align-items: center; min-height: 44px; }

    .toast { bottom: 84px; }

    .toast { transform: translate(-50%, 0); transition: opacity 200ms ease; } .found { animation: none; }
    .btn:active, .tab:active, .tick:active, .seg button:active, .tog:active { transform: none; }
  }

  const earningsWords = (e) => `Earnings ${esc(onDay(e.date))}${e.when ? ", " + esc(e.when) : ""}. Prices often jump on the report, in either direction.`;

  const sma = (v, n) => { const o = new Array(v.length).fill(null); let s = 0; for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= n) s -= v[i - n]; if (i >= n - 1) o[i] = s / n; } return o; };
  const ema = (v, n) => { const o = new Array(v.length).fill(null); if (v.length < n) return o; const k = 2 / (n + 1); let p = 0; for (let i = 0; i < n; i++) p += v[i]; p /= n; o[n - 1] = p; for (let i = n; i < v.length; i++) { p = v[i] * k + p * (1 - k); o[i] = p; } return o; };
  // The newest RSI of a list of closes.
  function rsiNow(c, n) { let g = 0, l = 0; for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; if (d >= 0) g += d; else l -= d; } g /= n; l /= n; for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; } return l === 0 ? 100 : 100 - 100 / (1 + g / l); }

  function dropChart() { if (chart) { try { chart.remove(); } catch (e) { /* already gone */ } } chart = null; main = null; }

      plotMsg(""); drawChart(sym, frame, res.candles);
      const dl = (day || res).candles, c = res.candles[res.candles.length - 1];
      shown = { sym, meta: res.meta, facts: quote(sym) && quote(sym).facts ? null : factsOf(dl), day: frame !== "1w" && dl.length > 1 ? [dl[dl.length - 2].c, dl[dl.length - 1].c] : null, last: c ? { open: c.o, high: c.h, low: c.l, close: c.c } : null };
      legend(shown.last); paintChartHead(); paintSide();
    }, (e) => {
      if (token !== chartToken || state.tab !== "stocks") return;
      shown = null; legend(null); paintSide();
      plotMsg(e.message === "needs-live" ? "<b>Minute and hour charts need live prices.</b><br>" + (needsAllow ? "Press Allow in the bar above this page, or pick Day or Week." : "Pick Day or Week.") : e.message === "none" ? `<b>No chart saved for ${esc(sym)} yet.</b><br>${needsAllow ? "Press Allow in the bar above this page and it appears at once." : "It arrives with the next refresh of prices."}` : esc(e.message));
    });
  }
  function drawChart(sym, frame, list) {
    const LC = window.LightweightCharts, intraday = !daily(frame), o = oppOn(sym);
    mountChart();
    const shift = intraday ? -new Date().getTimezoneOffset() * 60 : 0;
    const time = (c) => (intraday ? c.t + shift : new Date(c.t * 1000).toISOString().slice(0, 10));
    const up = css("--up"), down = css("--down");
    chart.applyOptions({ timeScale: { timeVisible: intraday, secondsVisible: false } });
    main = chart.addSeries(LC.CandlestickSeries, { upColor: up, downColor: down, wickUpColor: up, wickDownColor: down, borderVisible: false, priceLineColor: css("--faint") });
    const seen = {}, data = [];
    list.forEach((c) => { const t = time(c); if (seen[t]) return; seen[t] = 1; data.push({ time: t, open: c.o, high: c.h, low: c.l, close: c.c, v: c.v }); });
    main.setData(data.map((d) => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
    const closes = data.map((d) => d.close);
    const line = (vals, color) => chart.addSeries(LC.LineSeries, { color, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }).setData(vals.map((v, i) => (v == null ? null : { time: data[i].time, value: v })).filter(Boolean));
    if (overOn("vol")) { const v = chart.addSeries(LC.HistogramSeries, { priceFormat: { type: "volume" }, priceScaleId: "vol", priceLineVisible: false, lastValueVisible: false }); v.priceScale().applyOptions({ scaleMargins: { top: 0.84, bottom: 0 }, visible: false }); v.setData(data.map((d) => ({ time: d.time, value: d.v, color: (d.close >= d.open ? up : down) + "55" }))); }
    if (overOn("ma20")) line(ema(closes, 20), css("--ma20"));
    if (overOn("ma50")) line(sma(closes, 50), css("--ma50"));
    if (overOn("ma200")) line(sma(closes, 200), css("--ma200"));
    // The Scout's opportunity on this stock: the two edges of the buy zone, the stop and the target.
    const level = (p, color, title, dashed) => main.createPriceLine({ price: p, color, lineWidth: 1, lineStyle: dashed ? 2 : 0, axisLabelVisible: true, title });
    if (o) { level(o.buy[1], css("--info"), "Buy up to"); level(o.buy[0], css("--info"), "Buy from"); level(o.stop, down, "Stop", true); level(o.target, up, "Target"); }
    const n = data.length, span = { "5m": 160, "15m": 150, "1h": 160, "1d": 150, "1w": 130 }[frame];
    chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - span), to: n + 4 });
    $("lw").setAttribute("aria-label", `${FRAMES.find((f) => f[0] === frame)[1]} candles of ${sym}${o ? `, with the buy zone ${lv(o.buy[0])} to ${lv(o.buy[1])}, the stop at ${lv(o.stop)} and the target at ${lv(o.target)}` : ""}`);
  }
  function openSym(sym) { state.sym = String(sym).toUpperCase(); pref("sym", state.sym); if (state.tab === "stocks") loadChart(); else setTab("stocks"); }
  function setWatch(list, said) { save("watch", list); toast(said); paint(true); }
  const addToList = (sym, name) => setWatch(watch().concat([{ sym, name: name || nameOf(sym) }]), sym + " is on your list. The Stock Scout looks at it from its next run.");
  function removeFromList(sym) {
    if (watch().length < 2) return toast("Keep at least one stock on your list.");
    setWatch(watch().filter((w) => w.sym !== sym), sym + " is off your list.");
  }
  // The search under "Add a stock": the list itself at once, then the engine's search when it is live.
  let findTimer = null, findList = [], findAt = 0;
  function findPaint() { const el = $("found"); if (!el) return; el.hidden = !findList.length; el.innerHTML = findList.map((r, i) => `<button data-pick="${esc(r.sym)}" data-name="${esc(r.name || "")}"${i === findAt ? " data-on" : ""}><b>${esc(r.sym)}</b><small>${onList(r.sym) ? "On your list. " : ""}${esc(r.name || "Add this symbol")}${r.exchange ? ", " + esc(r.exchange) : ""}</small></button>`).join(""); }
  function findClose() { findList = []; findPaint(); }
  function findType(typed) {
    clearTimeout(findTimer); const q = typed.trim(), Q = q.toUpperCase();
    if (!q) return findClose();
    const local = watch().filter((w) => w.sym.indexOf(Q) === 0 || (w.name || "").toLowerCase().indexOf(q.toLowerCase()) >= 0);
    findList = local.length ? local.slice(0, 5) : [{ sym: Q, name: "" }]; findAt = 0; findPaint();
    if (live) findTimer = setTimeout(() => engine("/search?q=" + encodeURIComponent(q)).then((j) => { if ($("find") && $("find").value.trim() === q && j.results.length) { findList = j.results.slice(0, 7); findAt = 0; findPaint(); } }, () => {}), 220);
  }
  function findPick(sym, name) {
    findClose(); $("find").value = ""; $("find").blur();
    if (name) guestName[sym] = name;
    if (!onList(sym)) addToList(sym, name);
    openSym(sym);
  }

  // ── Painting ────────────────────────────────────────────────────────────
  const VIEWS = { opps: viewOpps, stocks: viewStocks };
  // `soft` is a repaint nobody asked for (new prices arrived): it keeps the scroll position, on My stocks it leaves
  // the chart and the search box alone, and it waits while the person is choosing a day or a time.
  function paint(soft) {
    paintTop();
    if (soft && document.activeElement && document.activeElement.closest(".whenrow")) return;
    if (state.tab === "stocks" && $("lw")) { paintWatch(); paintChartHead(); paintSide(); return; }
    const view = $("view"), top = view.scrollTop;
    view.dataset.screen = state.tab; view.setAttribute("aria-label", TABS.find((t) => t[0] === state.tab)[1]);
    view.innerHTML = VIEWS[state.tab]();
    view.scrollTop = soft ? top : 0;
    if (state.tab === "stocks") loadChart(); else paintMinis();
  }
  function setTab(tab) {
    if (tab === state.tab) return;
    dropChart(); shown = null;
    state.tab = tab; $("view").innerHTML = ""; scrollTo(0, 0); paint();
  }
  function applyLook() {
    const dark = here && here.theme ? here.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  }

  // ── Presses, typing, keys ───────────────────────────────────────────────
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".term,[data-tab],[data-open],[data-ask],[data-frame],[data-over],[data-pick],#refresh,#run,#listbtn,#askchart");
    if (!t) { if (!e.target.closest(".find")) findClose(); return; }
    if (t.matches(".term")) return tipShow(t, true);
    const d = t.dataset;
    if (t.id === "refresh") return refreshNow(false);
    if (t.id === "run") return runScout();
    if (t.id === "listbtn") return onList(state.sym) ? removeFromList(state.sym) : addToList(state.sym);
    if (t.id === "askchart") { const f = factsFor(state.sym), px = lastPrice(state.sym), o = oppOn(state.sym); return ask(`Look at the chart of ${state.sym} (${nameOf(state.sym)}). Price ${px != null ? fp(px) : f ? fp(f.close) : "unknown"}${f ? `, RSI ${f.rsi == null ? "unknown" : f.rsi.toFixed(0)}, 50-day average ${fp(f.sma50)}, 200-day average ${fp(f.sma200)}, usual daily move ${fp(f.atr)}, 52-week range ${fp(f.low52)} to ${fp(f.high52)}` : ""}.${o ? ` Your reminder of ${o.day} has an opportunity on it: ${oppWords(o)}.` : ""} Read ${candleFile(state.sym)}. Tell me in plain words what the chart is doing, the prices that matter, and what would make it a good place to buy. If it is not one now, say what you would wait for.`); }
    if (d.tab) return setTab(d.tab);
    if (d.open) return openSym(d.open);
    if (d.ask) { const o = findOpp(d.ask), px = o && lastPrice(o.sym); if (o) ask(`About the ${o.sym} opportunity in your reminder of ${o.day}${o.headline ? `, "${o.headline}"` : ""}. ${oppWords(o)}.${px != null ? ` The price is now ${fp(px)}, ${whereNow(o, px)}.` : ""} Read ${o.path} and ${candleFile(o.sym)}. Is it still worth a look today? Say what I should wait to see before buying, and what would spoil the idea.`); return; }
    if (d.frame) { state.frame = d.frame; pref("frame", d.frame); return loadChart(); }
    if (d.over) { const o = Object.assign({}, prefs.over || {}); o[d.over] = !overOn(d.over); pref("over", o); return loadChart(); }
    if (d.pick) return findPick(d.pick, d.name);
  });
  document.addEventListener("input", (e) => { if (e.target.id === "find") findType(e.target.value); });
  // A time field reports a change after each part typed, so the time is saved once the typing rests or the field is left.
  let whenTimer = null;
  document.addEventListener("change", (e) => { if (e.target.id === "sdays") saveWhen(); else if (e.target.id === "stime") { clearTimeout(whenTimer); whenTimer = setTimeout(saveWhen, 900); } });
  document.addEventListener("focusout", (e) => { if (e.target.id === "stime") { clearTimeout(whenTimer); saveWhen(); } else if (e.target === tipFor) tipHide(); });
  document.addEventListener("keydown", (e) => {
    const el = e.target;
    if (e.key === "Escape") tipHide();
    if (el.id === "find") {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (findList.length) { findAt = (findAt + (e.key === "ArrowDown" ? 1 : -1) + findList.length) % findList.length; findPaint(); } }
      else if (e.key === "Enter") { const r = findList[findAt]; if (r) findPick(r.sym, r.name); }
      else if (e.key === "Escape") { findClose(); el.blur(); }
      return;
    }
    // A key typed into a field is that field's, never a shortcut.
    if (el.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "1" || k === "2") return setTab(TABS[+k - 1][0]);
    if (k === "r") return refreshNow(false);
    if ((k === "j" || k === "k") && state.tab === "stocks") { const list = watch(), at = list.findIndex((w) => w.sym === state.sym), next = list[(at + (k === "j" ? 1 : -1) + list.length) % list.length]; openSym(next.sym); }
  });
  // The pictures on the cards are drawn to the pixel, so a new width means a new drawing.
  let resizeTimer = null;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(paintMinis, 150); });
  // Explanations open under the pointer, on keyboard focus and on a tap of a word that only explains.
  // Escape, a press elsewhere, a scroll by hand or a repaint closes them. Under the pointer the first waits a moment; the next ones do not.
  let tipTimer = null, tipLast = 0, tipFor = null;
  function tipHide() {
    clearTimeout(tipTimer);
    if (!tipFor) return;
    tipFor.removeAttribute("aria-describedby"); tipFor = null; tipLast = Date.now(); $("tip").classList.remove("show");
  }
  function tipPlace() {
    const box = $("tip"), r = tipFor.getBoundingClientRect(); box.style.left = "0px"; box.style.top = "0px";
    const w = box.offsetWidth, h = box.offsetHeight, below = r.bottom + 8 + h < innerHeight;
    box.style.left = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8) + "px"; box.style.top = (below ? r.bottom + 8 : r.top - h - 8) + "px"; box.style.transformOrigin = (below ? "top" : "bottom") + " center";
  }
  function tipShow(el, atOnce) {
    const box = $("tip");
    const show = () => { tipHide(); tipFor = el; el.setAttribute("aria-describedby", "tip"); box.textContent = el.dataset.tip; tipPlace(); box.classList.toggle("instant", atOnce); box.classList.add("show"); };
    clearTimeout(tipTimer);
    if (el === tipFor) return;
    if (atOnce) show(); else tipTimer = setTimeout(show, 350);
  }
  document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (el) tipShow(el, Date.now() - tipLast < 400); });
  document.addEventListener("mouseout", (e) => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && !el.contains(e.relatedTarget)) tipHide(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el && el.matches(":focus-visible")) tipShow(el, true); });
  document.addEventListener("pointerdown", (e) => { if (tipFor && !tipFor.contains(e.target)) tipHide(); });
  // Moving to a word by key can scroll the page: its explanation follows it. Any other scroll closes the explanation.
  document.addEventListener("scroll", () => { if (tipFor && tipFor === document.activeElement) tipPlace(); else tipHide(); }, true);
  new MutationObserver(() => { if (tipFor && !tipFor.isConnected) tipHide(); }).observe($("app"), { childList: true, subtree: true });

  // ── Start ───────────────────────────────────────────────────────────────
  function start() {
    const hereP = cab && cab.here ? Promise.resolve(cab.here()).catch(() => null) : Promise.resolve(null);
    return hereP.then((h) => {
      here = h; if (h && h.appPath) appPath = h.appPath;
      readStores(); applyLook();
      state.sym = prefs.sym || watch()[0].sym;
      return Promise.all([loadData(), loadOpps(), loadJobs(), checkLive()]);
    }).then(() => {
      state.frame = prefs.frame && (live || daily(prefs.frame)) ? prefs.frame : "1d";
      paint();
      if (hasStore && kept.onChange) kept.onChange(() => { shared = fromKept(); paint(true); });
      if (V2 && cab.files.onChange) {
        cab.files.onChange(appPath + "/data", () => loadData().then(() => paint(true)));
        cab.files.onChange("opportunities", () => loadOpps().then(() => { paint(true); if (state.tab === "stocks") loadChart(); }));
      }
      if (cab && cab.jobs && cab.jobs.onChange) cab.jobs.onChange((list) => { D.jobs = list || []; paint(true); });
      // The clock every minute; fresh prices every two while the page is in view.
      let ticks = 0;
      setInterval(() => {
        if (document.hidden) return;
        paintTop(); ticks++;
        if (live && !state.busy && ticks % 2 === 0) engine("/refresh").then(loadData).then(() => { paint(true); if (state.tab === "stocks" && !daily(state.frame)) loadChart(); }, () => {});
      }, 60000);
      if (live && D.status && Date.now() - Date.parse(D.status.at) > 5 * 60000) refreshNow(true);
    });
  }
  $("view").innerHTML = '<div class="empty" style="padding:80px 0">Opening your reminders</div>';
  if (cab && cab.ready && typeof cab.ready.then === "function") {
    let began = null; const go = () => { if (!began) began = start(); };
    // Cabinet slow to answer: start without it, then read the stores again once it is ready.
    cab.ready.then(() => { if (began) began.then(() => { readStores(); applyLook(); paint(true); }); else go(); }, go);
    setTimeout(go, 3000);
  } else start();
})();
</script>
