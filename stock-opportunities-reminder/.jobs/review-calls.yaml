id: review-calls
name: Review my calls
enabled: true
schedule: 0 10 * * 6
provider: claude-code
adapterType: claude_local
ownerAgent: stock-scout
agentSlug: stock-scout
timeout: 900
prompt: |-
  Look at how your calls turned out and write down what to do differently.

  Your working directory is the cabinet root.

  1. Read your persona, `playbooks/how-it-works.md`, `playbooks/method.md` and
     `playbooks/lessons.md`.
  2. Run `node app/engine/refresh.mjs --full`, then read `app/data/outcomes.json` and every
     file in `opportunities/` whose name does not start with `EXAMPLE-`.
  3. For each call that finished since your last review, set what you wrote (the setup,
     the conviction, the risks you named) beside what happened. Look for what repeats: a
     setup that keeps failing, stops that are too tight, calls made against the market,
     convictions that did not match results. One call proves nothing. Three alike is a
     pattern.
  4. Rewrite `playbooks/lessons.md`, keeping its front matter and its two headings.
     `## What I do differently now`: twelve lines at most, each a change in what you do,
     with the calls that taught it (symbol and date). Remove a lesson the numbers no longer
     support. `## Where I stand`: the scorecard in two or three lines: finished calls, how
     many finished above zero, how many reached their target, the average result in R, and
     which setup did best and worst. Under 20 finished calls, say the sample is too small
     to trust.
  5. If there are no finished calls yet, leave the file as it is.

  Never explain a loss away, and never change `playbooks/method.md`: lessons go in
  `lessons.md`, where the person can read them.

  Finish in three or four plain sentences: how the calls did, and the one thing you will do
  differently.
