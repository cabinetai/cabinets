id: find-opportunities
name: Find opportunities
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: stock-scout
agentSlug: stock-scout
timeout: 1500
prompt: |-
  Look for stocks worth buying now and write today's reminder.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-it-works.md`, `playbooks/method.md` and
     `playbooks/lessons.md`, in that order and in full.
  2. Run `node app/engine/refresh.mjs --full` so every number is fresh. If it prints
     problems, keep going and name them in one line at the end.
  3. Read `app/data/market.json`, `signals.json`, `record.json`, `movers.json`,
     `calendar.json`, `news.json` and `outcomes.json`, and the person's list as
     `playbooks/how-it-works.md` says.
  4. Follow `playbooks/method.md` step by step. Read the market first and name the stance.
     Gather the candidates. For each one that fits a setup, read its candles in
     `app/data/candles/`, try to break the idea, and only then build its numbers.
  5. When a stock moved hard and you cannot tell why from the headlines, look it up and
     name the source. Do not call a stock whose move you cannot explain.
  6. Write `opportunities/<today>.json`, today being the date in New York as YYYY-MM-DD,
     in the exact shape `playbooks/how-it-works.md` gives. Three calls at most. None is a
     fine answer: then `nothing` says why.
  7. Run `node app/engine/refresh.mjs` and read `app/data/outcomes.json`. Every call you
     wrote must be listed. If one is missing, its numbers were malformed: fix the file and
     run it again.

  Every number comes from the files or from a source you name. No call says "buy" or names
  an amount.

  Finish with the reminder itself, in plain words, three to five sentences: what the market
  is doing, each call with its buy zone and the price where it is wrong, or that there is
  nothing today and why. This is what the person reads first.
