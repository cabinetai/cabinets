id: find-opportunities
name: Find opportunities
enabled: true
schedule: 30 8 * * 1-5
provider: claude-code
adapterType: claude_local
ownerAgent: stock-scout
agentSlug: stock-scout
timeout: 1500
prompt: |-
  Look for stocks worth a look now and write today's reminder.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-it-works.md`, `playbooks/method.md` and
     `playbooks/lessons.md`, in that order and in full.
  2. Run `node app/engine/refresh.mjs --full` so every number is fresh. If it prints
     problems, keep going and name them in one line at the end. If the command cannot
     run, or `app/data/candidates.json` then has a `problem`, prices could not be
     fetched: skip to step 6, write the file with no calls, and let `nothing` say that
     prices could not be fetched today.
  3. Follow `playbooks/method.md` step by step. Take the market's stance from `regime`
     in `app/data/market.json`. Read `app/data/candidates.json` and `app/data/setups.json`:
     your calls come from the candidates, with their numbers exactly as given, and only as
     far as each setup's verdict allows.
  4. For each candidate you would call, read its candles in `app/data/candles/`, its
     headlines in `app/data/news.json` and the dates in `app/data/calendar.json`, then make
     the case against it as the method says. When a stock moved hard and the headlines do
     not explain why, look it up and name the source. Pass on what does not survive.
  5. Read `app/data/outcomes.json`: your open calls, your scorecard, and any `problems`.
  6. Write `opportunities/<today>.json`, today being the date in New York as YYYY-MM-DD,
     in the exact shape `playbooks/how-it-works.md` gives, with `at` set to the moment you
     write it. None is a fine answer: then `nothing` says why, and `passed` still lists
     what was tempting.
  7. Run `node app/engine/refresh.mjs`, then `node app/engine/check-calls.mjs`. Fix or
     remove any call it complains about and run it again until it ends with
     "All in order."

  Every number comes from the files or from a source you name. No call says "buy" or names
  an amount.

  Finish with the reminder itself, in plain words, three to five sentences: what the market
  is doing, each call with its buy zone and the price where it is wrong, or that there is
  nothing today and why. This is what the person reads first.
