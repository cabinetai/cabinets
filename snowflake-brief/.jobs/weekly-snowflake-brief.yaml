id: weekly-snowflake-brief
name: Weekly Snowflake Brief
enabled: true
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: metric-reader
agentSlug: metric-reader
timeout: 600
prompt: |-
  Write this week's Snowflake brief.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-snowflake-brief.md` — the local
  time you ran, then that exact postfix. The page reads the folder, sorts by the
  name and opens the newest, so a name in any other shape is a summary nobody will
  see. You only ever ADD a file: never overwrite, rename or delete one already
  sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns, the "what you watch" query or view, the change vocabulary and
     the tone. This prompt does not repeat them.
  2. With your Snowflake tools, run read-only queries against the last seven days,
     and the seven days before that for comparison.
  3. This run is read only. Do not write to a table, alter a view, or change a
     warehouse setting.
  4. If you have no Snowflake tool, or it is not connected, or the query fails,
     STOP HERE. Write nothing. Leave `summaries/` exactly as you found it, example
     and all. Report: "Snowflake is not reachable. I would have run last week's
     query and written one row per metric." Then exit.
  5. On the first run that does reach Snowflake, write your dated file and then
     delete `summaries/EXAMPLE-snowflake-brief.md`. Never write `EXAMPLE` into a
     name of your own.
