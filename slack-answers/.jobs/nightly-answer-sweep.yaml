id: nightly-answer-sweep
name: Nightly Answer Sweep
enabled: true
schedule: 0 2 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: answer-keeper
agentSlug: answer-keeper
timeout: 900
prompt: |-
  Sweep Slack for answers worth keeping, and keep them in the team's memory.

  Your working directory is the cabinet root. You keep two kinds of file in `answers/`:
  topic pages in `answers/topics/`, which you edit in place, and one sweep log per run in
  `answers/` itself, named `<YYYY-MM-DD>T<HH-MM-SS>-sweep.md` with the local time you ran.
  The Answer Book page reads both, so a name in any other shape is work nobody will see.
  Never overwrite or rename a sweep log. The only logs you delete are ones more than 180 days
  old, at the end of the run: Cabinet lists 500 files of a folder, oldest name first, so a
  folder that only grows would hide the newest sweep.
  Topic pages are never renamed and never deleted, only edited.

  This run has 900 seconds. Plan for the limits, because they are real:
  - Search is fast: 100 results a page.
  - `slack_read_channel` and `slack_read_thread` are about one call a minute, 15 messages a
    call. Search first, and read at most 5 threads a run. Never read a channel from the top.
  - A reaction is one search, not one call per message: `has::white_check_mark:` takes a
    conversation filter, so prefer one such search per channel per emoji.
    `slack_get_reactions` is a normal speed call: use it only for a New topic the search left
    in doubt, at most 20 calls a run.
  - At 12 minutes stop reading Slack, whatever is left, and go to step 8. A run that cannot
    finish everything writes what it has and says so in `status`.

  1. Read your persona before anything else. It holds the topic page shape, the sweep log
     shape, the closed vocabularies, how to match a question to an existing page, how to tell
     the first sweep as it happens, and the tone. This prompt does not repeat them.
  2. Find the newest dated sweep log in `answers/`. Ignore every file whose name starts
     with `EXAMPLE-`, here and in `answers/topics/`: they are invented, so never match a
     question to one, never count one, never copy from one. Your window starts at that log's
     `resume` time if it has one, otherwise at its `generated` time, so a missed night is not
     lost. If there is no dated log yet, this is the first sweep: read the last 7 days, and
     tell it as you go, as your persona says. Never read more than 7 days back.
  3. See which Slack tools you have, because they decide how you read.
     - `slack_search_messages` is Cabinet's own Slack app. `slack_list_channels` says which
       channels you may use; a private channel the person added there by name is in scope
       like any other. Run one search per channel: `in:#<channel> after:<the day before your
       window>`, newest first, 100 a page, because `after:` leaves out the date it names.
       Page until the results are older than your window, at most 5 pages a channel. Every
       search names a channel. Never search on a person or a date alone: that also returns
       direct messages, and this cabinet promises not to read them. Thread replies come back
       in the results: a reply's permalink carries `thread_ts`, the start of its thread, so
       group by that to pair a question with its answer.
     - `slack_search_public` is Slack's own tool, on the person's own app. Run the same
       searches, one per channel. For a private channel the person chose, use
       `slack_search_public_and_private` with `in:#<channel>`, and nothing wider. Read a
       channel or a thread only for what the search left out.
     Either way, read a thread only when a question's answer is missing from the results, at
     most 5 threads a run. If search stopped at its page limit inside your window, your
     `status` says so and `resume` gives the time of the oldest message you reached.
  4. If you have no Slack tool, or Slack is not connected, or the first call fails, STOP
     HERE. Write nothing. Leave `answers/` exactly as you found it, examples and all.
     Report: "Slack is not reachable. I would have read the channels you allowed since
     the last sweep and kept the answers they settled." Then exit. If Slack limits a call,
     wait about a minute and try that call again, up to three times.
  5. Look for a question that got an answer somebody accepted, a question that came back,
     and an answer that changed. A reply to a question, or a reaction like
     `:white_check_mark:` on an answer, is what accepted looks like.
  6. Match each one to the pages you already have. Never read every page body: list the
     titles from the frontmatter with the grep in your persona, once this run, and open only
     the likely matches. Update the page that holds it, as your persona says. Make a new page
     only when none matches.
  7. This run is read only in Slack. Do not post, reply in a thread, react, pin, or mark
     anything read, however obvious the one-line answer looks.
  8. Write this run's sweep log, one row per topic you touched. Write it even when you
     found nothing, with an empty table and a headline that says so: the next run reads
     Slack from its `generated` time. If the run stopped short, set `status` to what is
     missing and `resume` to where the next run should start.
  9. On the first run that does reach Slack, after the log is written, delete every file
     whose name starts with `EXAMPLE-` in `answers/` and in `answers/topics/`, yourself,
     without asking: this deletion is part of the job and already approved. They are a demo,
     not past sweeps and not things your team said. Never write `EXAMPLE` into a name of your
     own. If you told the sweep as you went, finish with
     `node answer-book/first-read.mjs done`.
  10. Report in one or two lines: how many topics are new, asked again and updated, and the
      lead if there is one.
