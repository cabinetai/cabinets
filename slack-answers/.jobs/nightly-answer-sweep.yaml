id: nightly-answer-sweep
name: Nightly Answer Sweep
enabled: true
schedule: 0 2 * * *
provider: claude-code
adapterType: claude_local
ownerAgent: answer-keeper
agentSlug: answer-keeper
timeout: 600
prompt: |-
  Sweep today's Slack for answers worth keeping.

  Your working directory is the cabinet root. Every sweep lives in `answers/`, one file per
  run, named `<YYYY-MM-DD>T<HH-MM-SS>-answers.md`, the local time you ran and then that
  exact postfix. The page reads the folder, sorts by the name and opens the newest, so a
  name in any other shape is a sweep nobody will see. You only ever ADD a file: never
  overwrite, rename or delete one already sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the table
     columns, the closed vocabularies and the tone. This prompt does not repeat them.
  2. Read the newest file already in `answers/` and carry its rows forward. This file is
     the whole book, not today's additions. A question that came up again gets its `Asked`
     count raised, but only for a message sent after that file's `generated` time: an older
     one was already counted. A row whose answer is now wrong is the only kind you drop.
  3. Look at which Slack tools you have, because they decide how you read:
     - **`slack_search_messages`**: Slack is connected through Cabinet's own Slack app.
       Search is fast and complete, but each `slack_read_channel` or `slack_read_thread`
       costs about a minute (Slack limits it). So find everything with search: list the
       public channels you may read with `slack_list_channels`, then search each one with
       `in:#<channel> after:<the day before yesterday>` (a date filter alone returns
       nothing), and keep only the last 24 hours. Thread replies come back in the results.
       Read a thread only when a question's answer is missing from them, at most 5 threads
       a run.
     - **Slack's own tools** (such as `slack_search_public`): Slack is connected through the
       person's own app. Read the last 24 hours of the channels you are allowed to read,
       thread replies included.
     Either way, look for a question that got an answer somebody accepted, and skip direct
     messages and private channels entirely.
  4. This run is read only. Do not post, reply in a thread, react, or mark anything read,
     however obvious the one-line answer looks.
  5. If you have no Slack tool, or Slack is not connected, or the call fails, STOP HERE.
     Write nothing. Leave `answers/` exactly as you found it, example and all. Report:
     "Slack is not reachable. I would have read the last 24 hours of the channels you
     allowed and kept the answers they settled." Then exit.
  6. On the first run that does reach Slack, write your dated file and then delete
     `answers/EXAMPLE-answers.md` yourself, without asking: this deletion is part of the job
     and already approved. It is a demo, not a past sweep, and it must not sit in
     the date list beside real ones. Do not merge with it, do not rename it, and never
     write `EXAMPLE` into a name of your own.
