id: sunday-paper-check
name: Sunday Paper Check
enabled: true
schedule: 0 18 * * 0
provider: claude-code
adapterType: claude_local
ownerAgent: household-clerk
agentSlug: household-clerk
timeout: 900
prompt: |-
  Do the Sunday walk of the papers drawer.

  Your working directory is the cabinet root. Papers land in `papers/`; each date
  that matters gets one small file in `dates/`. The Board page redraws from
  `dates/`, so that folder is the truth and you keep it true.

  1. Read your persona before anything else. It holds the sacred-drawer rule, what
     earns a date file, the file shape, and the update-don't-duplicate rule. This
     prompt does not repeat them.
  2. Read anything in `papers/` that is new or changed since the last walk. Extract
     the dates that matter; write or update files in `dates/`. Never move, rename,
     edit or delete anything in `papers/`.
  3. Skip the `EXAMPLE-` date files if they're still there — they're demos. Never
     delete them yourself; their own text tells the user to.
  4. If a paper can't be read — blurry photo, unopenable format — name it in your
     report rather than silently skipping it.
  5. If the drawer is empty apart from the README, report: "The drawer is waiting
     for its first paper — drop any warranty, letter or document into papers/."
     and exit.

  Finish by reporting in two or three sentences: what you filed from new papers, and
  every board date inside the next 14 days, each in plain words.
