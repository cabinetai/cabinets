id: sunday-week-ahead
name: Sunday week ahead
enabled: true
schedule: 0 18 * * 0
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: chat-helper
agentSlug: chat-helper
timeout: 900
prompt: |-
  Write the week ahead from the person's WhatsApp chats.

  Your working directory is the cabinet root. Your persona's "Sunday: the week ahead" holds
  the shape of the page.

  1. In one Bash call, run `node my-chats/first-sort.mjs read 7` and print
     `my-chats/data/latest.json` if it is there.
  2. If `read` exits 2, run `node my-chats/first-sort.mjs off '<the sentence it printed>'`,
     and stop.
  3. Write `reports/<YYYY-MM-DD>-week-ahead.md` in one Bash call.

  The chats live in another cabinet: only read them, never write, move or delete there.
  Never send or propose a message.

  Finish in one plain sentence about the week and nothing else: the busiest day, and the
  one thing to do first.
createdAt: '2026-10-25T00:00:00.000Z'
updatedAt: '2026-10-25T00:00:00.000Z'
