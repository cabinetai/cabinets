id: morning-chat-sort
name: Morning chat sort
enabled: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
  effort: low
ownerAgent: chat-helper
agentSlug: chat-helper
timeout: 900
prompt: |-
  Sort this morning's WhatsApp chats for the My chats app.

  Your working directory is the cabinet root. Your persona holds the rules: the helper, the
  lists, the shape of each file, and how to spend little. Follow its order:

  1. Run `ls my-chats/data` and `node my-chats/first-sort.mjs read` in one Bash call. If
     `profile.json` is not in that list, this is the first sort: follow "The first sort" in
     your persona instead, starting with `start`.
  2. If `read` exits 2, run `node my-chats/first-sort.mjs off '<the sentence it printed>'`,
     and stop.
  3. In one Bash call, write `my-chats/data/.work/latest.json`, run
     `node my-chats/first-sort.mjs latest @latest.json`, and write
     `reports/<YYYY-MM-DD>-morning.md`. If the helper refuses, fix the file and run it again.

  The chats live in another cabinet: only read them, never write, move or delete there.
  Never send or propose a message.

  Finish in one or two plain sentences about the chats and nothing else: how many people
  are waiting for an answer, the next plan, and the one that matters most, if there is one.
createdAt: '2026-10-25T00:00:00.000Z'
updatedAt: '2026-10-25T00:00:00.000Z'
