    open: { cls: "lane open-box", list: true, draw: drawOpen, group: "files", icon: "i-globe", w: 5, h: 5, min: [3, 3],
      title: "Open to anyone", desc: "Your files that anyone with the link can open, the private ones first.",
      show: function () { return sharingFresh(); }, when: "Shows up after the Monday sharing check." },
    versions: { cls: "lane versions", list: true, draw: drawVersions, group: "files", icon: "i-layers", w: 6, h: 5, min: [3, 3],
      title: "Which is the latest", desc: "Files that come in v2, final and Copy of, and which one is current." },
    folders: { cls: "lane folders", list: true, draw: drawFolders, group: "files", icon: "i-folder", w: 6, h: 5, min: [3, 3],
      title: "Client folders", desc: "When each client folder last changed, and which ones went quiet." },
    "n-comments": { cls: "nbox", draw: function () { return kpiCards().comments; }, group: "numbers", icon: "i-comment", w: 3, h: 2, min: [2, 2],
      title: "Waiting on you", desc: "How many comments wait on you, and how many name you." },
    "n-shared": { cls: "nbox", draw: function () { return kpiCards().shared; }, group: "numbers", icon: "i-share", w: 3, h: 2, min: [2, 2],
      title: "New from others", desc: "How many files were shared with you, and how many you have not opened." },
    "n-open": { cls: "nbox", draw: function () { return kpiCards().open; }, group: "numbers", icon: "i-globe", w: 3, h: 2, min: [2, 2],
      title: "Open to anyone", desc: "How many of your files anyone with the link can open.",
      show: function () { return sharingFresh(); }, when: "Shows up after the Monday sharing check." },
    "n-storage": { cls: "nbox", draw: function () { return kpiCards().storage; }, group: "numbers", icon: "i-gauge", w: 3, h: 2, min: [2, 2],
      title: "Storage", desc: "How much of your Drive is used." },
    ask: { cls: "ask", draw: drawAsk, group: "ask", icon: "i-chat", w: 7, h: 5,
      title: "Ask your files", desc: "Ask anything about your files, with an idea for today.",
      show: canAsk, when: "Only people who can ask in this cabinet see it." },
    ideas: { cls: "lane ideas", list: true, draw: drawIdeasBox, group: "ask", icon: "i-bulb", w: 6, h: 5,
      title: "All ideas", desc: "Every idea in one box, one tap each." },
    setup: { cls: "lane setup", draw: drawSetup, group: "business", icon: "i-sliders", w: 6, h: 4,
      title: "What your file room knows", desc: "What you told it about the business, and a button to change it.",
      show: function () { return !!state.setup; }, when: "Shows up once the setup page is in this cabinet." }
  };
  IDEAS.forEach(function (idea) {
    BOXES["idea-" + idea.id] = { cls: "lane idea1", draw: function (level) { return drawOneIdea(idea, level); }, group: "single",
      icon: idea.icon, w: 4, h: 3, title: idea.title, desc: idea.text };
  });
  var GROUPS = [
    { id: "files", title: "Your files" },
    { id: "numbers", title: "Numbers" },
    { id: "ask", title: "Ask and ideas" },
    { id: "single", title: "One idea" },
    { id: "business", title: "About the business" }
  ];

  var PHONE = window.matchMedia ? window.matchMedia("(max-width: 720px)") : null;

  function phone() { return !!(PHONE && PHONE.matches); }
  function levelFor(width) { return width < 320 ? "S" : width < 640 ? "M" : "L"; }
  var LEVEL_WORDS = { S: "Small", M: "Medium", L: "Large" };
  /** The smallest a box may be made: wide and tall enough that what it shows still fits. */
  function minSize(id) { var m = BOXES[id].min || [3, 3]; return { w: m[0], h: m[1] }; }
  function whole(n) { return typeof n === "number" && n === Math.floor(n) && n >= 0; }

  /** A saved layout, keeping only entries that name a box we have and fit the grid. */
  function cleanLayout(value) {
    if (!Array.isArray(value)) return null;
    var seen = {};
    var out = value.filter(function (b) {
      var ok = !!(b && BOXES[b.id] && !seen[b.id] && whole(b.x) && whole(b.y) && whole(b.w) && whole(b.h) &&
        b.w >= 1 && b.h >= 1 && b.x + b.w <= COLS && b.h <= 40);
      if (ok) seen[b.id] = true;
      return ok;
    }).map(copyEntry);
    return out.length ? out : null;
  }
  /** One layout entry: its place on the grid, and on a phone its order (o) and size (p). */
  function copyEntry(b) {
    var out = { id: b.id, x: b.x, y: b.y, w: b.w, h: b.h };
    if (whole(b.o)) out.o = b.o;
    if (b.p === "S" || b.p === "M" || b.p === "L") out.p = b.p;
    return out;
  }
  function copyLayout(value) { return value.map(copyEntry); }

  /**
   * Where the boxes land: each keeps its columns, is pushed down past any box above it that
   * it would overlap (an opened list grows), then rises into the space left above it, so a
   * hidden or shorter box never leaves a hole. A pinned box (the one being moved or resized)
   * is placed first, exactly where it was put, and the others make room around it.
   */
  function placed(source, pinId) {
    var out = [];
    function hits(b, y, h) {
      return out.some(function (o) { return b.x < o.x + o.w && o.x < b.x + b.w && y < o.y + o.h && o.y < y + h; });
    }
    var boxes = (source || state.layout || DEFAULT_LAYOUT)
      .filter(function (b) { return !BOXES[b.id].show || BOXES[b.id].show(); })
      .slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    boxes.forEach(function (b) {

  // ── Motion ─────────────────────────────────────────────────────────────

    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  /** The same thing keeps the same key from one morning's read to the next. */
  function thingKey(kind, item) {
    var f = fileOf(item);
    var ref = (f && f.id ? f.id : text(item.name || item.file || item.base, 80)) + "|" + text(item.at || item.date || item.from, 40);
    return (state.example ? "example:" : "") + kind + ":" + ref;
  }
  var WHAT_WORDS = { ends: "Ends", renews: "Renews", notice: "Last day for notice", due: "Due", expires: "Expires" };
  function dayCount(days) { return days <= 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days"; }

  /**
   * The order: a comment that names you, a private file open to anyone, a contract date in
   * the next 14 days, the other comments, a client's file you have not opened, a date in the
   * next 30 days, then a version mix-up worth a look. Within a step, the oldest first.
   */
  function nextThings() {
    var ref = refDate();
    var out = [];
    function add(rank, order, kind, item, title, why, action) {
      out.push({ rank: rank, order: order, key: thingKey(kind, item), title: title, why: why, action: action });
    }
    comments().forEach(function (c, i) {
      var id = text(c.id, 60) || "c" + i;
      var days = waitingDays(c.at, ref);
      add(c.mention === true ? 0 : 3, -days, "answer", c, "Answer " + (text(c.from, 60) || "a comment"),
        "on " + (text(c.file, 60) || "a file") + (days >= 1 ? ", " + days + " " + plural(days, "day", "days") + " ago" : ""),
        text(c.reply) ? { label: "Copy the answer", act: "copy", id: id } : { label: "Draft an answer", act: "answer", id: id });
    });
    openFiles().forEach(function (o, i) {
      if (o.sensitive !== true) return;
      add(1, i, "close", o, "Close the link to " + (text(o.name, 60) || "a file"),
        o.how === "outside" ? "shared outside your company" : "anyone with the link can open it",
        { label: "Show me how", act: "close-help", id: text(o.id, 60) || "o" + i });
    });
    contractDates().forEach(function (d, i) {
      var days = daysBetween(startOfDay(ref), parseTime(d.date));
      if (days > 30) return;
      add(days <= 14 ? 2 : 5, days, "date", d, (WHAT_WORDS[d.what] || "A date") + ": " + (text(d.who, 50) || text(d.file, 50)),
        dayCount(days) + (text(d.gist) ? ", " + text(d.gist, 70) : ""),
        { label: "Open the contract", act: "open-file", id: text(d.id, 60) || "d" + i });
    });
    shared().forEach(function (s, i) {
      if (s.opened !== false || s.outside !== true) return;
      add(4, -waitingDays(s.sharedAt, ref), "look", s, "Look at " + (text(s.name, 60) || "a file"),
        "from " + (text(s.from, 50) || "someone") + ", " + (rowTime(s.sharedAt, ref) || "lately").toLowerCase(),
        { label: "Open it", act: "open-file", id: text(s.id, 60) || "s" + i });
    });
    versions().forEach(function (v, i) {
      if (!text(v.gist)) return;
      add(6, i, "version", v, "Check which " + (text(v.base, 50) || "file") + " is current", text(v.gist, 90),
        { label: "Open the latest", act: "open-file", id: text(v.id, 60) || "v" + i });
    });
    return out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
  }

  function actionButton(a) {
    return '<button type="button" class="btn small" data-act="' + a.act + '"' + (a.id ? ' data-id="' + esc(a.id) + '"' : "") +
      (typeof a.i === "number" ? ' data-i="' + a.i + '"' : "") +
      (a.q ? ' data-q="' + esc(a.q) + '"' : "") + (canAsk() || a.act === "copy" ? "" : " disabled") + ">" + esc(a.label) + "</button>";
  }

  function drawNext(level) {
    var all = nextThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    var top = open.slice(0, 3);
    if (level === "S") {
      return sumBox("next", "Do next", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "Nothing needs you",
        top[0] ? "<b>" + esc(top[0].title) + "</b>" : "");
    }
    var body = top.length
      ? '<ol class="rows things">' + top.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            actionButton(t.action) + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else needs you today." : "Nothing needs you today.") + "</p>";
    var rest = open.length - top.length;
    var foot = (rest > 0 ? "<span>" + rest + " more " + plural(rest, "thing", "things") + " in the boxes below</span>" : "<span></span>") +
      (done ? '<button type="button" class="btn quiet small" data-act="undone">' + done + " done · Bring back</button>" : "");
    return boxHead("next", top.length === 3 ? "Your next 3 things" : "Your next things", "i-check", "", null) +
      '<div class="box-body">' + body + "</div>" +
      (rest > 0 || done ? '<div class="next-foot">' + foot + "</div>" : "") +
      '<button type="button" class="box-more" data-act="more-rows" hidden></button>';
  }

  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.next;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    nextThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }


  // ── The boxes ──────────────────────────────────────────────────────────

  function drawComments(level) {
    var c = comments();
    var ref = refDate();
    if (level === "S") {
      var named = c.filter(function (x) { return x.mention === true; }).length;
      var top = c[0];
      return sumBox("comments", "Waiting on you", "i-comment", String(c.length),
        named ? '<span class="hot">' + named + " " + plural(named, "names", "name") + " you</span>" : c.length ? plural(c.length, "comment", "comments") + " to answer" : "No comment waits on you",
        top ? "<b>" + esc(text(top.from, 60)) + ":</b> " + esc(text(top.said, 120)) : "");
    }
    return listBox("comments", "Waiting on you", "i-comment", "", c.length,
      '<ol class="rows">' + c.map(function (item, i) { return commentRow(item, i, ref); }).join("") + "</ol>",
      "No comment waits for your answer.") + nudgeHtml(boxIdea("comments"));
  }

  /** Files shared with the owner, newest first; a client's file they have not opened says so. */
  function drawShared(level) {
    var sh = shared();
    var ref = refDate();
    if (level === "S") {
      var unopened = sh.filter(function (x) { return x.opened === false; }).length;
      return sumBox("shared", "New from others", "i-share", String(sh.length),
        unopened ? unopened + " not opened yet" : sh.length ? plural(sh.length, "file", "files") + " shared with you" : "Nothing new",
        sh[0] ? "<b>" + esc(text(sh[0].from, 50)) + ":</b> " + esc(text(sh[0].name, 80)) : "");
    }
    return listBox("shared", "New from others", "i-share", "", sh.length,
      '<ul class="rows files">' + sh.map(function (s) {
        var f = fromWords(s);
        var tags = [];
        if (s.outside === true) tags.push('<span class="chip">' + icon("i-globe") + (f.dom ? esc(f.dom) : "outside") + "</span>");
        if (s.opened === false) tags.push('<span class="chip wait">Not opened</span>');
        return fileRow({ kind: s.kind, name: s.name, fileId: s.fileId,
          meta: "from <b>" + esc(f.who) + "</b>" + (tags.length ? " " + '<span class="chips">' + tags.join("") + "</span>" : ""),
          time: esc(rowTime(s.sharedAt, ref)),
          extra: text(s.gist) && level === "L" ? '<p class="note" dir="auto">' + esc(text(s.gist, 140)) + "</p>" : "" });
      }).join("") + "</ul>", "Nobody shared a file with you lately.");
  }

  function drawRecent(level) {
    var r = recent();
    var ref = refDate();
    if (level === "S") {
      var mine = r.filter(function (x) { return x.by === "you"; }).length;
      return sumBox("recent", "Your recent work", "i-history", String(r.length), mine + " by you, " + (r.length - mine) + " by your team",
        r[0] ? "<b>" + esc(text(r[0].name, 80)) + "</b>" : "");
    }
    return listBox("recent", "Your recent work", "i-history", "", r.length,
      '<ul class="rows files">' + r.map(function (x) {
        var by = x.by === "you" ? "by you" : "by " + (text(x.by, 50) || "your team");
        return fileRow({ kind: x.kind, name: x.name, fileId: x.fileId,
          // A gist that only repeats the name says nothing.
          meta: esc([by, level === "L" && text(x.gist).toLowerCase() !== text(x.name).toLowerCase() ? text(x.gist, 90) : ""].filter(Boolean).join(" · ")),
          time: esc(rowTime(x.modifiedAt, ref)) });
      }).join("") + "</ul>", "Nothing changed in your files lately.") + nudgeHtml(boxIdea("recent"));
  }

  /** The dates inside the contracts, soonest first; the next 14 days in red. */
  function drawDates(level) {
    var ds = contractDates();
    var ref = startOfDay(refDate());
    if (level === "S") {
      var first = ds[0];
      var d0 = first ? daysBetween(ref, parseTime(first.date)) : 0;
      return sumBox("dates", "Contract dates", "i-calendar", first ? dayCount(d0).replace(/^in /, "") : "", first ? (WHAT_WORDS[first.what] || "A date") + ": " + esc(text(first.who, 40) || text(first.file, 40)) : "No dates ahead",
        first ? esc(text(first.gist, 90)) : "");
    }
    return listBox("dates", "Contract dates", "i-calendar", "", ds.length,
      '<ol class="rows dates">' + ds.map(function (d) {
        var day = parseTime(d.date);
        var days = daysBetween(ref, day);
        var link = driveLink(d.fileId, d.kind);
        return '<li class="' + (days <= 14 ? "soon" : "") + '">' +
          '<span class="leaf" aria-hidden="true"><span>' + esc(day.toLocaleDateString([], { month: "short" })) + "</span><b>" + day.getDate() + "</b></span>" +
          '<div class="what"><span class="whatday" dir="auto">' + esc((WHAT_WORDS[d.what] || "A date") + ": " + (text(d.who, 60) || text(d.gist, 60))) + "</span>" +
          '<span class="sr">' + esc(day.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" })) + ", </span>" +
          '<span class="meta" dir="auto">' + esc(text(d.gist, 120)) + "</span>" +
          '<span class="meta">in ' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc((text(d.file, 100) || "the contract") + ", open in Google Drive (new tab)") + '">' + esc(text(d.file, 100)) + "</a>" : esc(text(d.file, 100))) + "</span></div>" +
          '<span class="t">' + esc(dayCount(days)) + "</span>" +
          (text(d.quote) && level === "L" ? '<p class="quote" dir="auto">“' + esc(text(d.quote, 200)) + "”</p>" : "") +
          "</li>";
      }).join("") + "</ol>", "No dates in your contracts in the next year.") + nudgeHtml(boxIdea("dates"));
  }

  /** What anyone with the link can open, the private ones first, each with where to close it. */
  function drawOpen(level) {
    var o = openFiles();
    if (level === "S") {
      var priv = o.filter(function (x) { return x.sensitive === true; }).length;
      return sumBox("open", "Open to anyone", "i-globe", String(o.length), priv ? '<span class="hot">' + priv + " look private</span>" : o.length ? "none look private" : "All private",
        o[0] ? "<b>" + esc(text(o[0].name, 80)) + "</b>" : "");
    }
    var head = text(state.sharing && state.sharing.headline, 120);
    return listBox("open", "Open to anyone", "i-globe", "", o.length,
      '<ul class="rows files">' + o.map(function (x, i) {
        var how = x.how === "outside"
          ? "Shared with " + (Array.isArray(x.with) && x.with.length ? x.with.slice(0, 2).map(function (w) { return text(w, 40); }).join(", ") : "people outside")
          : "Anyone with the link";
        return fileRow({ kind: x.kind, name: x.name, fileId: x.fileId,
          meta: '<span class="chips"><span class="chip' + (x.sensitive === true ? " hot" : "") + '">' + icon(x.sensitive === true ? "i-alert" : "i-globe") + esc(how) + "</span></span>",
          time: "",
          extra: (level === "L" && text(x.why) ? '<p class="note" dir="auto">' + esc(text(x.why, 160)) + "</p>" : "") +
            (x.sensitive === true && canAsk() ? '<div class="acts"><button type="button" class="btn small" data-act="close-help" data-id="' + esc(text(x.id, 60) || "o" + i) + '">' + icon("i-lock") + "Show me how to close it</button></div>" : "") });
      }).join("") + "</ul>", head || "Nothing of yours is open to anyone.") + nudgeHtml(boxIdea("open"));
  }

  /** Files that come in several versions: the latest named, the others under it. */
  function drawVersions(level) {
    var vs = versions();
    var ref = refDate();
    if (level === "S") {
      var warn = vs.filter(function (v) { return text(v.gist); }).length;
      return sumBox("versions", "Which is the latest", "i-layers", String(vs.length), warn ? '<span class="hot">' + warn + " to check</span>" : plural(vs.length, "file", "files") + " in versions",
        vs[0] ? "<b>" + esc(text(vs[0].base, 60)) + "</b>" : "");
    }
    return listBox("versions", "Which is the latest", "i-layers", "", vs.length,
      '<ul class="rows files">' + vs.map(function (v) {
        var l = v.latest;
        var by = l.by === "you" ? "you" : text(l.by, 40);
        var others = list(v.others).slice(0, 3);
        return fileRow({ kind: l.kind, name: l.name || v.base, fileId: l.fileId,
          meta: "Latest of <b>" + esc(text(v.base, 60)) + "</b>" + (by ? ", changed by " + esc(by) : "") + (others.length ? " · " + others.length + " older" : ""),
          time: esc(rowTime(l.modifiedAt, ref)),
          extra: (text(v.gist) ? '<p class="note" dir="auto">' + icon("i-alert") + " " + esc(text(v.gist, 160)) + "</p>" : "") +
            (level === "L" && others.length ? '<ul class="older">' + others.map(function (x) {
              return '<li dir="auto">' + esc(text(x.name, 100)) + (parseTime(x.modifiedAt) ? ", " + esc(shortDate(parseTime(x.modifiedAt))) : "") + "</li>";
            }).join("") + "</ul>" : "") });
      }).join("") + "</ul>", "No file comes in several versions. Tidy.");
  }

  /** Client folders and shared drives, clients first, quiet ones marked. */
  function drawFolders(level) {
    // A client folder gone quiet is the one worth a look: those first, then the newest change.
    var fs = folders().slice().sort(function (a, b) {
      return ((b.quiet === true && b.client === true) - (a.quiet === true && a.client === true)) || String(b.lastAt || "").localeCompare(String(a.lastAt || ""));
    });
    var ref = refDate();
    var quiet = fs.filter(function (f) { return f.quiet === true; });
    if (level === "S") {
      return sumBox("folders", "Client folders", "i-folder", String(fs.length), quiet.length ? '<span class="hot">' + quiet.length + " gone quiet</span>" : "all active",
        quiet[0] ? "<b>" + esc(text(quiet[0].name, 60)) + "</b>" : "");
    }
    return listBox("folders", "Client folders", "i-folder", "", fs.length,
      '<ul class="rows files">' + fs.map(function (f) {
        var last = parseTime(f.lastAt);
        var days = last ? daysBetween(last, ref) : 0;
        var by = f.by === "you" ? "you" : text(f.by, 40);
        return fileRow({ kind: "folder", name: f.name, fileId: f.fileId,
          meta: (f.quiet === true ? '<span class="chips"><span class="chip wait">Quiet ' + days + " days</span></span> " : "") +
            (last ? "Last change " + esc(shortDate(last)) + (by ? " by " + esc(by) : "") : ""),
          time: f.client === true && level === "L" ? "Client" : "" });
      }).join("") + "</ul>", "No client folders found yet. Tell your file room where client work lives.") + nudgeHtml(boxIdea("folders"));
  }

  /** What the owner told the cabinet about the business, from setup.md. */
  function drawSetup(level) {
    var items = state.setup || [];
    var set = items.filter(function (a) { return !a.unset; }).length;
    var btn = canAsk() && askReady()
      ? '<button class="btn small" data-act="ask" data-q="' + esc(set ? "I want to change what you know about my business." : "I want to tell you about my business so you can keep my files better.") + '">' +
        icon("i-pen") + (set ? "Change this" : "Tell it now") + "</button>"
      : "";
    if (level === "S") {

    }
    return boxHead("setup", "What your file room knows", "i-sliders", "", null) +

        return "<div><dt>" + esc(a.label) + "</dt><dd" + (a.unset ? ' class="unset"' : "") + ' dir="auto">' + esc(a.unset ? "Not set yet" : text(a.value, 240)) + "</dd></div>";
      }).join("") + "</dl>" + btn + "</div>";
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shown = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shown.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }
    var facts = ideaFacts();
    var can = canAsk();
    return listBox("ideas", "Ideas", "i-bulb", "", shown.length,
      '<ul class="rows idea-rows">' + shown.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }

  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shown = shownIdeas();
    if (featured) shown[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shown[idea.id] && !state.hiddenIdeas[idea.id]; }).slice(0, level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask your files</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about a file, a client, a contract..." />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +
      (level !== "S" && note ? '<p class="note" id="ask-note">' + esc(note) + "</p>" : "");
  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */
  function drawLayoutAsk(level) {
    var note = state.askNote || "The agent suggests the boxes. Nothing changes until you press Apply.";
    return (level === "S" ? "" : '<h2 id="ask-title">Ask the agent about your boxes</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: hide the numbers, show contract dates" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about your files</button></p>';
  }

  function askHint() {
    if (askReady()) return "The answer comes up in the chat next to this page.";
    return driveState() === "not-available-here"
      ? "Once Google Drive works here, you can ask things like these."
      : "Connect Google Drive first, then ask anything. A question here takes you to connecting.";
  }

  // ── Ideas, where and when they help ────────────────────────────────────
  // An idea offers itself in its box when today's files say it would help, with the real
  // numbers, at most one per box. "Hide" takes it off the page for good (kept per person in
  // cabinet.mine); the Ideas panel in the banner always has every one.

  var HIDDEN_IDEAS_KEY = "file-room-hidden-ideas@1";

  /** What today's files say, counted once for every idea. */
  function ideaFacts() {
    var ref = refDate();
    var st = storage();
    return {
      ref: ref,
      comments: comments().length,
      changed: state.data && typeof state.data.changed7 === "number" ? state.data.changed7 : 0,
      soon: contractDates().filter(function (d) { return daysBetween(startOfDay(ref), parseTime(d.date)) <= 60; }).length,
      quiet: folders().filter(function (f) { return f.quiet === true && f.client === true; }).length,
      clients: folders().filter(function (f) { return f.client === true; }).length,
      privateOpen: openFiles().filter(function (o) { return o.sensitive === true; }).length,
      full: st && st.limit ? Math.round(st.used / st.limit * 100) : 0
    };
  }

  /** For each idea: the line and the press that fit today, or null when it would not help now. */
  var IDEA_FITS = {
    answers: function (f) {
      var n = f.comments;
      return n >= 2 ? { line: n + " comments wait on you.", act: "Draft all the answers" } : null;
    },
    week: function (f) {
      var day = f.ref.getDay();
      return (day === 1 || day === 5) && f.changed >= 10
        ? { line: f.changed + " files changed this week. See what your team did?", act: "Write the week" }
        : null;
    },
    contracts: function (f) {
      return f.soon ? { line: f.soon + " " + plural(f.soon, "date", "dates") + " in your contracts in the next 60 days.", act: "List every contract" } : null;
    },
    clients: function (f) {
      if (f.quiet) return { line: f.quiet + " client " + plural(f.quiet, "folder has", "folders have") + " gone quiet. Worth a call?", act: "Write a page per client" };
      return f.clients >= 3 ? { line: "Your client folders already hold what each client needs.", act: "Write a page per client" } : null;
    },
    sharing: function (f) {
      return f.privateOpen ? { line: f.privateOpen + " private " + plural(f.privateOpen, "file is", "files are") + " open to anyone with the link.", act: "Show me how to close them" } : null;
    },
    space: function (f) {
      return f.full >= 75 ? { line: "Your Drive is " + f.full + "% full.", act: "Find what takes the space" } : null;
    },
    starter: function () { return { line: "Your Drive already holds what a new person needs to read.", act: "Pick the 10 files" }; }
  };

  function ideaById(id) {
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].id === id) return IDEAS[i];
    return null;
  }
  /** The idea with what fits today, or null when it is hidden or would not help now. */
  function fitted(idea, facts) {
    if (!idea || state.hiddenIdeas[idea.id] || !state.data) return null;
    var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts || ideaFacts()) : null;
    return fit ? { idea: idea, line: fit.line, act: fit.act } : null;
  }
  function onPage(boxId) {
    return placed().some(function (spot) { return spot.id === boxId; });
  }
  /** The first idea of this box that fits today. */
  function boxIdea(boxId) {
    var facts = ideaFacts();
    for (var i = 0; i < IDEAS.length; i++) {
      if (IDEAS[i].box !== boxId) continue;
      var f = fitted(IDEAS[i], facts);
      if (f) return f;
    }
    return null;
  }
  /** Ideas the list boxes on the page are showing right now. */
  function shownIdeas() {
    var shown = {};
    ["comments", "recent", "dates", "open", "folders"].forEach(function (id) {
      var el = boxEls[id];
      if (!onPage(id) || (el && el.getAttribute("data-level") === "S")) return;
      var f = boxIdea(id);
      if (f) shown[f.idea.id] = true;
    });
    return shown;
  }
  /** The Ask box's idea for today: its own, or one whose box is not on the page. */
  function askIdea() {
    var facts = ideaFacts();
    var shown = shownIdeas();
    var best = null;
    IDEAS.forEach(function (idea) {
      if (best || shown[idea.id] || (idea.box !== "ask" && onPage(idea.box))) return;
      best = fitted(idea, facts);
    });
    return best;
  }

  /** "every Monday", "every month": the schedule as the end of "Do this ...". */
  function routineWords(idea) { return idea.when.charAt(0).toLowerCase() + idea.when.slice(1); }

  function nudgeHtml(fit, lead) {
    if (!fit) return "";
    var idea = fit.idea;
    var can = canAsk();
    return '<div class="nudge">' + icon("i-bulb") + '<p dir="auto">' + esc((lead || "") + fit.line) + "</p>" +
      '<div class="nudge-actions">' +
      '<button type="button" class="btn small ' + (lead ? "primary" : "dark") + '" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + esc(fit.act) + "</button>" +
      '<button type="button" class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>" +
      '<button type="button" class="nudge-hide" data-act="idea-hide" data-idea="' + idea.id + '" aria-label="Hide this idea from the page">Hide</button>' +
      "</div></div>";
  }

  function setIdeaHidden(id, hidden) {
    var before = snapshot();
    if (hidden) state.hiddenIdeas[id] = true;
    else delete state.hiddenIdeas[id];
    paintGrid();
    glide(before);
    // The idea that takes its place fades up.
    var idea = ideaById(id);
    var home = idea && boxEls[idea.box];
    if (home && home.isConnected) fadeIn(home.querySelector(".nudge"));
    if (state.drawerOpen) paintDrawer();
    toast(hidden ? "Hidden. You can always find it under Ideas." : "It’s back on your page when it fits your day.");
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(HIDDEN_IDEAS_KEY, Object.keys(state.hiddenIdeas)).catch(function () {
        toast("That could not be saved. It comes back next time.");
      });
    }
  }

  var DRAWERS = {
    ideas: { title: "Ideas", sub: "One tap to ask now, or to have it done for you on a schedule.", icon: "i-bulb", paint: paintIdeasPanel },
    add: { title: "Add a box", sub: "Pick what you want on your page. You can remove it again any time.", icon: "i-plus", paint: paintPicker }
  };
  function paintDrawer() {
    var kind = DRAWERS[state.drawerKind] || DRAWERS.ideas;
    $("drawer-title").textContent = kind.title;
    $("drawer-sub").textContent = kind.sub;
    $("drawer-icon").innerHTML = icon(kind.icon);
    kind.paint();
  }

  // The Add a box panel: every box by group, the ones on the page ticked.
  function paintPicker() {
    var on = {};
    (state.layout || DEFAULT_LAYOUT).forEach(function (b) { on[b.id] = true; });
    $("drawer-body").innerHTML = GROUPS.map(function (group) {
      var ids = Object.keys(BOXES).filter(function (id) { return BOXES[id].group === group.id; });
      return '<section class="pick-group"><h3>' + esc(group.title) + "</h3>" + ids.map(function (id) {
        var box = BOXES[id];
        var ready = !box.show || box.show();
        var note = on[id] ? (ready ? "On your page" : "On your page. " + box.when) : ready ? "" : box.when;
        return '<div class="pick' + (on[id] ? " on" : "") + '"><span class="pick-ic" aria-hidden="true">' + icon(box.icon) + "</span>" +
          "<div><b>" + esc(box.title) + "</b><span>" + esc(box.desc) + "</span>" +
          (note ? "<em" + (ready ? "" : ' class="wait"') + ">" + esc(note) + "</em>" : "") + "</div>" +
          (on[id]
            ? '<span class="pick-on" aria-hidden="true">' + icon("i-check") + "</span>"
            : '<button type="button" class="btn small" data-act="add-this" data-add="' + id + '"' + (ready ? "" : " disabled") +
              ' aria-label="Add ' + esc(box.title) + '">' + icon("i-plus") + "Add</button>") +
          "</div>";
      }).join("") + "</section>";
    }).join("");
  }

  // ── Editing the page ───────────────────────────────────────────────────
  // Edit layout turns on a bar above the grid; each box gets a remove button and stops
  // reacting to presses. Every change is kept at once in cabinet.mine, and Undo steps back.

  function startEdit() {
    // Boxes show the size they were given while being arranged, not grown by an open list.
    state.open = {};
    state.expanded = {};
    state.need = {};
    state.editing = true;
    state.undo = [];
    // The page's opening fade ends here, so no box is caught half way into it while moving.
    Object.keys(boxEls).forEach(function (id) { boxEls[id].classList.remove("rise"); });
    paint();
    paintEditbar();
    // The remove and resize handles pop in once, as edit mode starts.
    var grid = $("grid");
    grid.classList.add("fresh");
    setTimeout(function () { grid.classList.remove("fresh"); }, 700);
    toast(phone() ? "Hold a box to move it. Pick its size on top." : "Drag a box to move it. Pull its corner to resize it.");
  }
  function doneEdit() {
    state.editing = false;
    state.undo = [];
    closeDrawer();
    paint();
    paintEditbar();
  }
  function paintEditbar() {
    $("editbar").hidden = !state.editing;
    $("undo-btn").disabled = !state.undo.length;
  }

  function saveLayout() {
    if (!V2 || !cab.mine || typeof cab.mine.set !== "function") return;
    cab.mine.set(LAYOUT_KEY, state.layout).catch(function () {
      toast("Your page could not be saved. It goes back to how it was next time.");
    });
  }
  function changeLayout(next, easing) {
    var before = snapshot();
    letGo();
    state.undo.push(copyLayout(state.layout || DEFAULT_LAYOUT));
    if (state.undo.length > 30) state.undo.shift();
    state.layout = next;
    saveLayout();
    paintGrid();
    glide(before, null, easing);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  function removeBox(id) {
    var el = boxEls[id];
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return b.id !== id; });
    if (el) el.classList.add("leaving");
    setTimeout(function () {
      if (el) el.classList.remove("leaving");
      changeLayout(next);
      toast(BOXES[id].title + " removed. Undo brings it back.");
    }, 200);
  }
  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {
    var spots = placed(source);
    for (var y = 0; ; y++) {
      for (var x = 0; x + w <= COLS; x++) {
        var hit = spots.some(function (o) { return x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h; });
        if (!hit) return { x: x, y: y };
      }
    }
  }
  function addBox(id) {
    var box = BOXES[id];
    var w = Math.min(box.w, COLS);
    var at = freeSpot(w, box.h);
    changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).concat({ id: id, x: at.x, y: at.y, w: w, h: box.h }));
    closeDrawer();
    var el = boxEls[id];
    if (el && el.isConnected) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    toast(box.title + " added.");
  }
  function resetLayout() {
    changeLayout(copyLayout(DEFAULT_LAYOUT));
    toast("Back to the first page. Undo brings yours back.");
  }
  function undoLayout() {
    if (!state.undo.length) return;
    var before = snapshot();
    state.layout = state.undo.pop();
    saveLayout();
    paintGrid();
    glide(before);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  // ── Asking the agent to change the page ────────────────────────────────
  // The agent cannot reach a person's layout (it lives in cabinet.mine), so it writes what
  // to add and remove into data/layout-change.json. The page shows that with Apply and
  // No thanks, and remembers in cabinet.mine which change it last showed.

  var CHANGE_SEEN_KEY = "file-room-layout-change-seen@1";
  var CHANGE_DAYS = 2;

  function openMenu(button) {
    var menu = $("layout-menu");
    var r = button.getBoundingClientRect();
    state.menuOpen = true;
    menu.hidden = false;
    menu.style.top = r.bottom + 6 + "px";
    menu.style.left = Math.max(16, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 16)) + "px";
    button.setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();
  }
  function closeMenu() {
    if (!state.menuOpen) return;
    state.menuOpen = false;
    $("layout-menu").hidden = true;
    var button = document.querySelector('[data-act="layout-menu"]');
    if (button) { button.setAttribute("aria-expanded", "false"); button.focus(); }
  }

  /** The words sent with a layout request: the boxes on the page now and who is asking. */
  function layoutWords(wish) {
    var on = placed().map(function (spot) { return BOXES[spot.id].title; });
    var me = myName();
    return "Change the boxes on my file room page." + (me ? " I am " + me + "." : "") +
      " On it now: " + (on.length ? on.join(", ") : "no boxes") + ". What I want: " + wish;
  }
  function myName() {
    var own = cabName();
    if (own) return own;
    return state.profile && state.profile.name ? state.profile.name : "";
  }
  function cabName() {
    var me = V2 && typeof cab.me === "function" ? cab.me() : null;
    // Without a cloud sign-in Cabinet says "You": that is no name, so the greeting leaves it out.
    var name = me && typeof me.name === "string" ? me.name.trim() : "";
    return /^you$/i.test(name) ? "" : name;
  }
  /** The Ask box takes the request when it is on the page; otherwise the chat's own box does. */
  function askAboutLayout() {
    var el = boxEls.ask;
    if (onPage("ask") && el && el.isConnected) {
      state.layoutAsk = true;
      setAskNote("");
      drawBox(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if ($("ask-input")) $("ask-input").focus({ preventScroll: true });
      return;
    }
    cab.ask(layoutWords(""), { send: false }).then(function () {
      toast("Finish the sentence in the chat. The agent's suggestion shows up on this page.");
    }).catch(function (e) { toast(e && e.message ? e.message : "The chat could not be opened. Try again."); });
  }
  function sendLayoutAsk(wish) {
    var words = text(wish, 600);
    if (!words) return;
    setAskNote("Sending...");
    cab.ask(layoutWords(words), { send: true }).then(function () {
      state.layoutAsk = false;
      if ($("ask-input")) $("ask-input").value = "";
      setAskNote("Sent. The agent's suggestion shows up at the top of this page.");
      if (boxEls.ask) drawBox(boxEls.ask);
    }).catch(function (e) {
      setAskNote(e && e.message ? e.message : "That did not go through. Try again.");
    });
  }
  function stopLayoutAsk() {
    state.layoutAsk = false;
    setAskNote("");
    if (boxEls.ask) drawBox(boxEls.ask);
  }

  /** data/layout-change.json, keeping only box ids the page knows. */
  function cleanChange(d) {
    if (!d || typeof d !== "object" || !writtenAt(d.at)) return null;
    function ids(list) {
      return Array.isArray(list) ? list.filter(function (id, i) { return typeof id === "string" && BOXES[id] && list.indexOf(id) === i; }) : [];
    }
    return { at: d.at, for: text(d.for, 80), add: ids(d.add), remove: ids(d.remove), note: text(d.note, 300) };
  }
  /** The change to offer now: new, recent, meant for this person, and not done already. */
  function pendingChange() {
    var c = state.change;
    if (!c || !canAsk() || state.editing || c.at === state.changeSeen) return null;
    if (daysBetween(writtenAt(c.at), new Date()) > CHANGE_DAYS) return null;
    var me = cabName();
    if (c.for && me && c.for.toLowerCase() !== me.toLowerCase()) return null;
    // A box waiting for its data counts as there: it is in the layout, only not drawn yet.
    var add = c.add.filter(function (id) { return !entryOf(id) && c.remove.indexOf(id) < 0; });
    var remove = c.remove.filter(function (id) { return !!entryOf(id); });
    if (!add.length && !remove.length && !c.note) return null;
    return { at: c.at, add: add, remove: remove, note: c.note };
  }
  // A number box shares its title with a list ("Waiting on you"), so it says it is the number.
  function titles(ids) {
    return ids.map(function (id) { return BOXES[id].title + (BOXES[id].group === "numbers" ? " (number)" : ""); }).join(", ");
  }
  function paintSuggest() {
    var el = $("suggest");
    if (state.changeApplied) {
      el.hidden = false;
      el.innerHTML = "<p><b>Your page changed.</b></p>" +
        '<div class="suggest-actions"><button type="button" class="btn" data-act="change-undo">' + icon("i-undo") + "Undo</button>" +
        '<button type="button" class="btn dark" data-act="change-ok">OK</button></div>';
      return;
    }
    var c = state.loaded ? pendingChange() : null;
    el.hidden = !c;
    if (!c) { el.innerHTML = ""; return; }
    var parts = [];
    if (c.add.length) parts.push("add " + titles(c.add));
    if (c.remove.length) parts.push("remove " + titles(c.remove));
    var waits = c.add.filter(function (id) { return BOXES[id].show && !BOXES[id].show(); });
    var why = [c.note].concat(waits.map(function (id) { return BOXES[id].title + ": " + BOXES[id].when; })).filter(Boolean).join(" ");
    el.innerHTML = "<p>" + (parts.length ? "<b>The agent suggests:</b> " + esc(parts.join(", and ")) + "." : "<b>From the agent:</b>") +
      (why ? '<span class="why" dir="auto">' + esc(why) + "</span>" : "") + "</p>" +
      '<div class="suggest-actions">' + (parts.length
        ? '<button type="button" class="btn primary" data-act="change-apply">' + icon("i-check") + "Apply</button>" +
          '<button type="button" class="btn" data-act="change-skip">No thanks</button>'
        : '<button type="button" class="btn" data-act="change-skip">OK</button>') + "</div>";
  }
  function markChangeSeen(at) {
    state.changeSeen = at;
    if (V2 && cab.mine && typeof cab.mine.set === "function") cab.mine.set(CHANGE_SEEN_KEY, at).catch(function () {});
  }
  function applyChange() {
    var c = pendingChange();
    if (!c) return;
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return c.remove.indexOf(b.id) < 0; });
    c.add.forEach(function (id) {
      var box = BOXES[id];
      var w = Math.min(box.w, COLS);
      var at = freeSpot(w, box.h, next);
      next.push({ id: id, x: at.x, y: at.y, w: w, h: box.h });
    });
    markChangeSeen(c.at);
    state.changeApplied = true;
    changeLayout(next);
    paintSuggest();
  }
  function skipChange() {
    var c = pendingChange();
    if (c) markChangeSeen(c.at);
    paintSuggest();
  }

  // ── Moving and resizing ────────────────────────────────────────────────
  // A mouse or pen drags a box from anywhere on it in edit mode. A finger holds a box for a
  // moment first, so the page still scrolls under a passing finger; outside edit mode the
  // hold also starts editing. While a box moves, the others make room live and an outline
  // shows where it lands. The corner handle resizes it on the grid, naming the size it
  // reaches. On a phone a box moves up and down its column; its size is a switch.

  var HOLD_MS = 600;
  var SLOP = 8;
  /** How far a mouse moves, pressed, before the box comes along: a slip of the hand is not a move. */
  var DRAG_START = 10;
  /** How far past a border (in cells) the moving box must be before the others make room. */
  var STICK = 0.8;
  var drag = null;
  var press = null;
  var hold = null;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function spotIn(spots, id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  function gridMetrics() {
    var r = $("grid").getBoundingClientRect();
    return { left: r.left, top: r.top, col: (r.width + GAP) / COLS, row: ROW + GAP };
  }
  /** The page with one box put at x, y and sized w by h, every other box making room. */
  function previewWith(id, x, y, w, h) {
    return placed(copyLayout(state.layout || DEFAULT_LAYOUT).map(function (b) {
      if (b.id === id) { b.x = x; b.y = y; b.w = w; b.h = h; }
      return b;
    }), id);
  }
  function showSpots(spots) {
    spots.forEach(function (s) {
      var el = boxEls[s.id];
      if (!el) return;
      el.style.gridColumn = s.x + 1 + " / span " + s.w;
      el.style.gridRow = s.y + 1 + " / span " + s.h;
    });
  }
  /** Keeps the places a move or resize ended on; nothing is kept when nothing moved. */
  function keepSpots(spots, easing) {
    var at = {};
    spots.forEach(function (s) { at[s.id] = s; });
    var before = copyLayout(state.layout || DEFAULT_LAYOUT);
    var next = copyLayout(before).map(function (b) {
      var s = at[b.id];
      if (s) { b.x = s.x; b.y = s.y; b.w = s.w; b.h = s.h; }
      return b;
    });
    // Compared as the page shows them, so a drop back in the same place is no change.
    var shown = function (l) { return JSON.stringify(placed(l).map(function (s) { return [s.id, s.x, s.y, s.w, s.h]; })); };
    if (shown(next) === shown(before)) { settleBack(easing); return false; }
    changeLayout(next, easing);
    return true;
  }
  /** Nothing changed: every box glides back to the place it already had. */
  function settleBack(easing) {
    var before = snapshot();
    letGo();
    paintGrid();
    glide(before, null, easing);
  }

  // The outline where a moving box lands, and the size a resized box has reached.
  function overlay(cls) {
    var grid = $("grid");
    var el = grid.querySelector("." + cls);
    if (!el) {
      el = document.createElement("div");
      el.className = cls;
      el.setAttribute("aria-hidden", "true");
      grid.appendChild(el);
    }
    return el;
  }
  /** Puts the outline (or the size label) on a spot; once shown, it glides from spot to spot. */
  function placeOverlay(el, s) {

      if (state.reading && state.reading.gift) giftDone(state.reading.gift);
      paintGiftKeep();
    } else if (act === "profile-ok") {
      markProfileSeen();
      toast("Thanks. Your file room works with this from now on.");
    } else if (act === "profile-fix") {
      markProfileSeen();
      cab.ask("About my business and my files, please fix this: ", { send: false }).catch(function () {});
    } else if (act === "change-ok") {
      state.changeApplied = false;
      paintSuggest();
    } else if (act === "edit-start") {
      startEdit();
    } else if (act === "edit-done") {
      doneEdit();
    } else if (act === "undo") {
      undoLayout();
    } else if (act === "reset-layout") {
      resetLayout();
    } else if (act === "drawer-close") {
      closeDrawer();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (drag) endDrag(true);
    else if (state.menuOpen) closeMenu();
    else if (state.drawerOpen) closeDrawer();
    else if (state.editing) doneEdit();
  });

  // The Ask box is drawn again as it changes size, so its form is listened to from here.
  document.addEventListener("submit", function (event) {
    if (!event.target || event.target.id !== "ask-form") return;
    event.preventDefault();
    if (state.layoutAsk) sendLayoutAsk($("ask-input").value);
    else ask($("ask-input").value);
  });

  // ── Start ──────────────────────────────────────────────────────────────

  paint();

  if (PHONE) {
    var onPhoneChange = function () { if (state.loaded && state.data) paintGrid(); };
    if (PHONE.addEventListener) PHONE.addEventListener("change", onPhoneChange);
    else if (PHONE.addListener) PHONE.addListener(onPhoneChange);
  }
  // Rows are measured to fit their boxes; the web font changes their height once it arrives.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      Object.keys(boxEls).forEach(function (id) { if (boxEls[id].isConnected) fitBox(boxEls[id]); });
    });
  }

  if (V2) {
    // This person's own layout, if they changed it; the default otherwise.
    Promise.resolve(cab.ready).then(function () {
      var mine = cab.mine && typeof cab.mine.get === "function" ? cab.mine : null;
      var clean = cleanLayout(mine ? mine.get(LAYOUT_KEY) : null);
      if (clean) state.layout = clean;
      var seenProfile = mine ? mine.get(PROFILE_SEEN_KEY) : null;
      if (typeof seenProfile === "string") state.profileSeen = seenProfile;
      var giftSeen = mine ? mine.get(GIFT_KEY) : null;
      if (typeof giftSeen === "string") state.giftDone = giftSeen;
      state.mineReady = true;
      var seen = mine ? mine.get(CHANGE_SEEN_KEY) : null;
      if (typeof seen === "string") state.changeSeen = seen;
      var hidden = mine ? mine.get(HIDDEN_IDEAS_KEY) : null;
      if (Array.isArray(hidden)) hidden.forEach(function (id) { if (ideaById(id)) state.hiddenIdeas[id] = true; });
      var done = mine ? mine.get(DONE_KEY) : null;
      var fresh = new Date(Date.now() - 14 * DAY_MS);
      if (done && typeof done === "object") Object.keys(done).forEach(function (k) {
        var at = parseTime(done[k]);
        if (at && at >= startOfDay(fresh)) state.done[k] = done[k];
      });
      paint();
    }).catch(function () {});
    Promise.resolve(cab.here()).then(function (here) {
      state.here = here || null;
      if (here && typeof here.appPath === "string" && here.appPath) state.appPath = here.appPath;
    }).catch(function () {}).then(function () {
      load();
      // The routines' data and the owner's setup.md both live in this app's folder.
      try { cab.files.onChange(state.appPath, function () { load(); }); } catch (e) { /* older bridge */ }
    });
    cab.connectors.list().then(function (items) {
      state.drive = pickDrive(items) || { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    }).catch(function () {
      state.drive = { id: CONNECTOR, state: "not-available-here", problem: null, canConnect: false };
      paint();
    });
    cab.connectors.onChange(function (items) { var g = pickDrive(items); if (g) { state.drive = g; paint(); } });
    cab.jobs.list().then(setJobs).catch(function () {});
    cab.jobs.onChange(setJobs);
  } else {
    load();
    // No live changes in an older Cabinet: look again now and then while the page is in view.
    setInterval(function () { if (document.visibilityState === "visible") load(); }, POLL_MS);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }
})();
</script>
</body>
</html>
