id: morning-telegram-digest
name: Morning Telegram Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: chat-reader
agentSlug: chat-reader
timeout: 600
prompt: |-
  Write this morning's Telegram digest.

  Your working directory is the cabinet root. Every summary lives in `summaries/`,
  one file per run, named `<YYYY-MM-DD>T<HH-MM-SS>-telegram-digest.md` — the local
  time you ran, then that exact postfix. The page reads the folder, sorts by the
  name and opens the newest, so a name in any other shape is a summary nobody will
  see. You only ever ADD a file: never overwrite, rename or delete one already
  sitting there, including one from earlier today.

  1. Read your persona before anything else. It holds the frontmatter shape, the
     table columns, the urgency vocabulary and the tone. This prompt does not
     repeat them.
  2. With your Telegram tools, read the last 24 hours of every chat you can see.
  3. This run is read only. Do not send a message, reply, or mark anything read,
     however obvious the one-line answer looks.
  4. If you have no Telegram tool, or Telegram is not connected, or the call fails,
     STOP HERE. Write nothing. Leave `summaries/` exactly as you found it, example
     and all. Report: "Telegram is not reachable. I would have read the last 24
     hours of every chat I can see and written one row per chat." Then exit.
  5. On the first run that does reach Telegram, write your dated file and then
     delete `summaries/EXAMPLE-telegram-digest.md`. It is a demo, not a past
     summary, and it must not sit in the picker beside real ones. Do not merge with
     it, do not rename it, and never write `EXAMPLE` into a name of your own.
