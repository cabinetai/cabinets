id: morning-telegram-digest
name: Morning Telegram Digest
enabled: true
schedule: 0 9 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: sonnet
ownerAgent: chat-reader
agentSlug: chat-reader
timeout: 900
prompt: |-
  Catch up on Telegram for the Catch up app.

  Your working directory is the cabinet root. Your persona holds the rules: what needs the
  person, every field the page reads, and how to write it. The page reads only the files in
  `catch-up/data/` (from the cabinet root, never `cd`).

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `catch-up/setup.md`, and run `ls catch-up/data/profile.json`.
  2. If your Telegram line says Telegram is not connected, write only
     `catch-up/data/status.json` with `ok: false` and a plain `why`, and stop.
  3. If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona. Otherwise follow "The morning".
  4. If a Telegram call fails, write `catch-up/data/status.json` with `ok: false`, what you
     tried and what it said, in plain words, and leave `latest.json` as it was.

  Only read Telegram: never send, reply, react, mark read, or change anything.

  Finish in one or two plain sentences and nothing else: how many people wait for an
  answer, how many promises are open, and the one thing that matters most this morning.
