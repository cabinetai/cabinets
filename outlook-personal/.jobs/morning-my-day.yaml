id: morning-my-day
name: Morning, my day
enabled: true
cloudOnly: true
schedule: 0 7 * * *
provider: claude-code
adapterType: claude_local
adapterConfig:
  model: haiku
  effort: low
ownerAgent: home-keeper
agentSlug: home-keeper
timeout: 900
prompt: |-
  Put today on the fridge door for the My day app, from Outlook mail and Outlook Calendar.

  Your working directory is the cabinet root. Your persona holds the rules: how to reach
  Outlook through Microsoft Graph, how to sort the mail, the shape of each file, and how
  to spend little. Follow "The morning" in order:

  1. In one Bash call, print the time with `date '+%Y-%m-%dT%H:%M:%S%z'`, read
     `my-day/setup.md` and, if it is there, `my-day/data/latest.json` (the last morning),
     and run `ls my-day/data/profile.json` (from the cabinet root, never `cd`).
  2. If your Outlook line says Outlook is not connected, write only
     `my-day/data/status.json` with `ok: false` and a plain `why`, and stop.
     If `profile.json` is not there, this is the first reading and the person is watching:
     follow "The first reading" in your persona instead of steps 3 and 4, through
     `node my-day/first-sort.mjs` only, and finish with the same one or two sentences.
  3. Read today's and the week's calendar (when Outlook Calendar is connected) and the mail
     since the last morning, then the Sent Items once.
  4. In one Bash call, write `my-day/data/latest.json` (and check it parses),
     `reports/<YYYY-MM-DD>-morning.md` and `my-day/data/status.json` with `ok: true`.

  Only read Outlook: never send, reply, forward, move, flag, mark read, delete or pay.

  Finish in one or two plain sentences about the day and nothing else: how many plans,
  how many people are waiting, and the one thing not to forget today.
createdAt: '2026-10-14T00:00:00.000Z'
updatedAt: '2026-10-14T00:00:00.000Z'
