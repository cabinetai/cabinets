    if (calendarUnknown()) return '<p class="next-plan"><i class="dot" aria-hidden="true"></i>Calendar not connected</p>';
    if (!next) return '<p class="next-plan"><i class="dot" aria-hidden="true"></i>' + (events().length ? "Nothing else planned today" : "Nothing planned today") + "</p>";
    var on = next.start <= now;
    return '<p class="next-plan"><i class="dot" aria-hidden="true"></i>' + (on ? "Now: " : "Next: ") + esc(text(next.raw.title, 40) || "Busy") +
      " <span>" + (on ? "until " + esc(clock(next.end)) : "at " + esc(clock(next.start))) + "</span></p>";
  }
  function headlineTop(now) {
    return '<div class="hl-top"><div>' + nextPlanHtml(now) + "</div>" +
      '<div class="status hl-status" aria-live="polite">' + statusHtml() + "</div></div>";
  }
  function mailMeta() {
    var d = state.data;
    var arrived = typeof d.arrived === "number" ? d.arrived : null;
    var aside = d.setAside && typeof d.setAside.count === "number" ? d.setAside.count : 0;
    var parts = [];
    if (arrived !== null) parts.push(arrived + " " + plural(arrived, "email", "emails") + " since yesterday");
    if (aside) parts.push(aside + " set aside");
    return parts.length ? '<p class="meta">' + icon("i-inbox") + esc(parts.join(", ")) + "</p>" : "";
  }
  function leadHtml() {
    var n = waiting().length;
    var head = (state.example ? "Example: " : "") + (n ? n + " " + plural(n, "person", "people") + " to answer." : "Nobody is waiting for you.");
    return '<p class="lead"><b>' + esc(head) + '</b> <span dir="auto">' + esc(text(state.data.headline, 220)) + "</span></p>";
  }
  /** The day from morning to night as a line, a dot for each plan, filled to now. */
  function daylineHtml(now) {
    var day = state.data && state.data.day ? state.data.day : {};
    var from = typeof day.startHour === "number" ? day.startHour : 7;
    var to = typeof day.endHour === "number" ? day.endHour : 22;
    if (to - from < 4) { from = 7; to = 22; }
    var pct = function (h) { return Math.max(0, Math.min(100, (h - from) / (to - from) * 100)).toFixed(1); };
    var today = sameDay(now, dayDate());
    var h = hourOf(now);
    var left = events().filter(function (e) { return e.end > now; }).length;
    var dots = events().map(function (e) {
      return '<b class="p' + (today && e.end <= now ? " past" : "") + '" style="left:' + pct(hourOf(e.start)) + '%" title="' + esc(clock(e.start) + " " + text(e.raw.title, 60)) + '"></b>';
    }).join("");
    return '<div class="dayline" aria-label="Your day, ' + hm(from) + " to " + hm(to) + '"><span>' + hm(from) + "</span>" +
      '<span class="track">' + (today ? '<i style="width:' + pct(h) + '%"></i>' : "") + dots + (today && h >= from && h <= to ? '<span class="now" style="left:' + pct(h) + '%"></span>' : "") + "</span>" +
      "<span>" + hm(to) + '</span><span class="left">' + (calendarUnknown() ? "Calendar not connected" : events().length ? left + " " + plural(left, "plan", "plans") + " left" : "A free day") + "</span></div>";
  }

  /** What to remember today and tomorrow: bills, parcels, dates. Each with its magnet colour. */
  function dontForget(now) {
    var out = [];
    bills().forEach(function (b) {
      var d = parseTime(b.due);
      if (b.status === "failed") out.push({ c: MAGNET.need, t: "Payment failed: " + text(b.from || b.what, 40) });
      else if (d && daysBetween(now, d) <= 1) out.push({ c: MAGNET.need, t: capital(dayWords(d, now)) + ": pay " + text(b.from || b.what, 40) });
    });
    deliveries().forEach(function (p) {
      var d = parseTime(p.eta);
      if (d && daysBetween(now, d) <= 0) out.push({ c: MAGNET.way, t: "Arriving today: " + text(p.what, 40) });
    });
    list(state.data && state.data.coming).forEach(function (c) {
      var d = parseTime(c.start);
      if (c.kind === "birthday" && d && daysBetween(now, d) >= 0 && daysBetween(now, d) <= 7) out.push({ c: MAGNET.date, t: capital(dayWords(d, now)) + ": " + text(c.title, 40) });
    });
    return out.slice(0, 4);
  }
  function doorHtml(level, now) {
    var d = dayDate();
    var leaf = '<div class="leaf" aria-hidden="true"><span class="wd">' + esc(d.toLocaleDateString([], { weekday: "long" })) + '</span><span class="n">' + d.getDate() +
      '</span><span class="m">' + esc(d.toLocaleDateString([], { month: "long" })) + "</span></div>";
    var today = sameDay(now, dayDate());
    var evs = events();
    // The plans still to come, one done plan kept for the morning's sake.
    var left = 0;
    while (left < evs.length && today && evs[left].end <= now) left++;
    var forget = dontForget(now);
    var unknown = calendarUnknown();
    var max = level === "L" ? (forget.length || unknown ? 3 : 4) : forget.length || unknown ? 1 : 2;
    var room = evs.length - left < max;
    var first = left >= evs.length || (level === "L" && room) ? Math.max(0, left - 1) : left;
    var shown = evs.slice(first, first + max);
    var notes = shown.map(function (e, i) {
      var done = today && e.end <= now, on = today && e.start <= now && e.end > now;
      return '<li class="fnote' + (done ? " done" : on ? " now" : "") + '" style="--tilt:' + TILTS[i % 4] + 'deg;--mag:' + MAGNET.plan + '">' +
        '<i class="mag" aria-hidden="true"></i><span class="t">' + esc(clock(e.start)) + '</span><b dir="auto">' + esc(text(e.raw.title, 60) || "Busy") + "</b>" +
        (text(e.raw.where) ? '<small dir="auto">' + esc(text(e.raw.where, 40)) + "</small>" : done ? "<small>Done</small>" : "") + "</li>";
    });
    if (unknown && V2 && state.calendar && state.calendar.canConnect) {
      notes.push('<li class="fnote" style="--tilt:' + TILTS[1] + 'deg;--mag:' + MAGNET.plan + '"><i class="mag" aria-hidden="true"></i><b>Your plans go here</b>' +
        '<small>Connect Outlook Calendar</small><button type="button" class="btn small" style="margin-top:8px" data-act="connect" data-id="outlook-calendar">' + icon("i-calendar") + "Connect</button></li>");
    }
    if (forget.length) {
      notes.push('<li class="fnote list" style="--tilt:' + TILTS[(notes.length + 1) % 4] + 'deg;--mag:' + MAGNET.need + '"><i class="mag" aria-hidden="true"></i><h4>Don’t forget</h4><ul>' +
        forget.map(function (f) { return '<li style="--c:' + f.c + '"><i aria-hidden="true"></i><span dir="auto">' + esc(f.t) + "</span></li>"; }).join("") + "</ul></li>");
    }
    var body;
    if (!notes.length) {
      body = '<p class="door-empty">' + (events().length ? "That was today. Nothing else on the fridge." : "Nothing on the fridge today. A free day.") + "</p>";
    } else body = '<ul class="notes">' + notes.join("") + "</ul>";
    return '<div class="door" role="group" aria-label="On the fridge today">' + leaf + body + "</div>";
  }

  function drawHeadline(level) {
    var now = refDate();
    if (level === "S") {
      return headlineTop(now) + '<div class="hl-left"><h2>' + esc((state.example ? "Example: " : "") + greeting()) + "</h2></div>";
    }
    var d = new Date();
    return headlineTop(now) +
      '<div class="hl-left"><p class="hello">' + esc(d.toLocaleDateString([], { weekday: "long" }) + ", " + d.getDate() + " " + d.toLocaleDateString([], { month: "long" })) + "</p>" +
      "<h2>" + esc(greeting()) + "</h2>" + leadHtml() + mailMeta() + daylineHtml(now) + "</div>" +
      doorHtml(level, now);
  }

  // ── The boxes ──────────────────────────────────────────────────────────

  /** The numbers someone looks for first, each a card. */
  function numberCards() {
    var w = waiting();
    var b = bills();
    var c = coming();
    var nb = b[0] ? parseTime(b[0].due) : null;
    return {
      waiting: w.length
        ? '<a class="kpi first" href="#lane-waiting"><span class="label">' + icon("i-reply") + "To answer</span>" +
          '<span class="value num">' + w.length + '</span><span class="sub">' + plural(w.length, "person waits", "people wait") + " for you</span></a>"
        : '<a class="kpi calm" href="#lane-waiting"><span class="label">' + icon("i-check") + "To answer</span>" +
          '<span class="value num">0</span><span class="sub">Everyone has an answer</span></a>',
      bills: '<a class="kpi" href="#lane-bills"><span class="label">' + icon("i-receipt") + "Bills</span>" +
        '<span class="value num">' + b.length + '</span><span class="sub">' + (b.length ? (b[0].status === "failed" ? "A payment failed" : nb ? "Next due " + dayWords(nb, refDate()) : "not paid yet") : "Nothing due") + "</span></a>",
      coming: '<a class="kpi" href="#lane-coming"><span class="label">' + icon("i-calendar") + "This week</span>" +
        '<span class="value num">' + c.length + '</span><span class="sub">' + plural(c.length, "plan or date", "plans and dates") + " ahead</span></a>"
    };
  }

  /** Today's plans, with what to bring or know before each one. */
  function drawToday(level) {
    var now = refDate();
    var today = sameDay(now, dayDate());
    var all = events();
    var ahead = 0;
    while (ahead < all.length && today && all[ahead].end <= now) ahead++;
    var items = all.slice(ahead);
    if (level === "S") {
      var n0 = all[ahead];
      return sumBox("today", "Today", "i-clock", String(all.length - ahead), all.length - ahead ? plural(all.length - ahead, "plan", "plans") + " left today" : "Nothing else today",
        n0 ? "<b>" + esc(clock(n0.start)) + "</b> " + esc(text(n0.raw.title, 80)) : "");
    }
    var waits = {};
    waiting().forEach(function (w) { waits[w.id] = w; });
    return listBox("today", "Today", "i-clock", "", items.length,
      '<ol class="rows prep-rows">' + items.map(function (e) {
        var raw = e.raw;
        var past = today && e.end <= now;
        var soon = !past && e.start > now && minutesBetween(now, e.start) <= 90;
        var who = people(raw);
        var mail = typeof raw.prepMailId === "string" && waits[raw.prepMailId] ? waits[raw.prepMailId] : null;
        var link = safeLink(raw.webLink);
        var acts = [];
        if (canAsk() && !past) acts.push('<button type="button" class="btn quiet small" data-act="plan" data-id="' + esc(raw.id) + '">' + icon("i-bulb") + "What do I need?</button>");
        if (mail) acts.push('<button type="button" class="btn quiet small" data-act="open-waiting" data-id="' + esc(mail.id) + '">' + icon("i-mail") + esc(firstName(mail.from)) + "’s email</button>");
        if (link) acts.push('<a class="btn quiet small" href="' + esc(link) + '" target="_blank" rel="noopener">' + icon("i-open") + "Open in Outlook</a>");
        return '<li class="' + (past ? "past" : soon ? "soon" : "") + '"><span class="t">' + esc(bareClock(e.start)) + "<small>" +
          esc(past ? "done" : e.start <= now && today ? "now" : soon ? "in " + minutesBetween(now, e.start) + " min" : lengthWords(minutesBetween(e.start, e.end))) + "</small></span>" +
          '<div class="m"><b dir="auto">' + esc(text(raw.title, 100) || "Busy") + "</b>" +
          (who.length || text(raw.where) ? '<span class="with" dir="auto">' + esc([text(raw.where, 60), who.length ? "with " + names(who) : ""].filter(Boolean).join(", ")) + "</span>" : "") +
          (text(raw.prep) && !past ? '<p dir="auto">' + icon("i-bulb") + esc(text(raw.prep, 220)) + "</p>" : "") +
          (acts.length ? '<div class="acts">' + acts.join("") + "</div>" : "") + "</div></li>";
      }).join("") + "</ol>",
      calendarUnknown() ? "Connect Outlook Calendar and your plans show up here." : all.length && today ? "That was today. Nothing else planned." : "Nothing planned today.").replace(!items.length ? /<span class="count[^"]*">0<\/span>/ : /$^/, "") + nudgeHtml(boxIdea("today"));
  }

  // People to answer.
  function waitingRow(item, index, ref) {
    var id = text(item.id) || "w" + index;
    var open = !!state.open[id];
    var name = text(item.from, 80) || "Someone";
    var chips = [];
    var kind = KIND_WORDS[item.kind] || "";
    if (kind) chips.push('<span class="chip ' + esc(item.kind) + '">' + esc(kind) + "</span>");
    var days = waitingDays(item.waitingSince || item.receivedAt, ref);
    if (item.urgent === true) chips.push('<span class="chip hot">Answer today</span>');
    else if (text(item.due)) chips.push(billChip({ due: item.due }, ref));
    if (days >= 3) chips.push('<span class="chip wait">Waiting ' + days + " days</span>");
    var link = safeLink(item.webLink);
    var hasReply = !!text(item.reply);
    var actions = [];
    if (hasReply) actions.push('<button class="btn dark" data-act="copy" data-id="' + esc(id) + '">' + icon("i-copy") + "Copy the reply</button>");
    if (hasReply && canAsk() && !state.example) actions.push('<button class="btn" data-act="draft" data-id="' + esc(id) + '">' + icon("i-send") + "Put it in my Drafts</button>");
    if (canAsk()) actions.push('<button class="btn quiet" data-act="reply" data-id="' + esc(id) + '">' + icon("i-pen") + (hasReply ? "Change it" : "Draft a reply") + "</button>");
    if (link) actions.push('<a class="btn quiet" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon("i-open") + "Open in Outlook</a>");
    var style = state.animate ? ' style="--d:' + Math.min(index, 6) * 50 + 'ms"' : "";
    return '<li class="row' + (open ? " open" : "") + (state.animate ? " rise" : "") + '" id="w-' + esc(id) + '"' + style + ">" +
      '<button class="row-main" data-act="toggle" data-id="' + esc(id) + '" aria-expanded="' + open + '" aria-controls="body-' + esc(id) + '">' +
      '<span class="who"><b dir="auto">' + esc(name) + "</b>" +
      '<span class="chips">' + chips.join("") + "</span></span>" +
      '<span class="when">' + esc(rowTime(item.receivedAt, ref)) + (hasReply ? '<span class="drafted">' + icon("i-pen") + "Reply ready</span>" : "") + "</span>" +
      '<span class="gist" dir="auto">' + esc(text(item.gist, 160) || text(item.subject, 160)) + "</span>" +
      "</button>" +
      '<div class="row-body" id="body-' + esc(id) + '"' + (open ? "" : " hidden") + ">" +
      (text(item.subject) ? '<p class="subject">Subject: <span dir="auto">' + esc(text(item.subject, 160)) + "</span></p>" : "") +
      (hasReply ? draftHtml(text(item.reply, 1500)) : "") +
      (actions.length ? '<div class="row-actions">' + actions.join("") + "</div>" : "") +
      "</div></li>";
  }
  function draftHtml(value) {
    var safe = esc(value).replace(/\[([^\]]{1,120})\]/g, "<mark>$1</mark>");
    var marked = /\[[^\]]{1,120}\]/.test(value);
    return '<div class="draft"><h4>Reply, written in your voice</h4><p dir="auto">' + safe + "</p>" +
      (marked ? '<p class="hint">Check the highlighted words before you send it.</p>' : "") + "</div>";
  }
  function drawWaiting(level) {
    var w = waiting();
    var ref = refDate();
    if (level === "S") {
      var urgent = w.filter(function (x) { return x.urgent === true; }).length;
      var top = w[0];
      return sumBox("waiting", "To answer", "i-reply", String(w.length),
        urgent ? '<span class="hot">' + urgent + " to answer today</span>" : w.length ? plural(w.length, "person", "people") + " waiting" : "Everyone has an answer",
        top ? "<b>" + esc(text(top.from, 60)) + ":</b> " + esc(text(top.gist, 120)) : "");
    }
    return listBox("waiting", "People to answer", "i-reply", "", w.length,
      '<ol class="rows">' + w.map(function (item, i) { return waitingRow(item, i, ref); }).join("") + "</ol>",
      "Nobody is waiting for your answer.") + nudgeHtml(boxIdea("waiting"));
  }

  /** When a bill is due, in words, red when it is close or failed. */
  function billChip(b, ref) {
    if (b.status === "failed") return '<span class="chip hot">Payment failed</span>';
    var d = parseTime(b.due);
    if (!d) return b.status === "renews" ? '<span class="chip">Renews soon</span>' : "";
    var gap = daysBetween(ref, d);
    var word = b.status === "renews" ? "Renews " : "Due ";
    if (gap < 0) return '<span class="chip hot">' + (-gap) + " " + plural(-gap, "day", "days") + " late</span>";
    if (gap <= 1) return '<span class="chip hot">' + word + dayWords(d, ref) + "</span>";
    return '<span class="chip' + (gap < 4 ? " soon" : "") + '">' + word + esc(dayWords(d, ref)) + "</span>";
  }
  function drawBills(level) {
    var b = bills();
    var ref = refDate();
    if (level === "S") {
      var failed = b.filter(function (x) { return x.status === "failed"; }).length;
      return sumBox("bills", "Bills", "i-receipt", String(b.length), failed ? '<span class="hot">' + failed + " payment failed</span>" : b.length ? "not paid yet" : "Nothing due",
        b[0] ? "<b>" + esc(text(b[0].from || b[0].what, 40)) + "</b> " + esc(text(b[0].amount, 20)) : "");
    }
    return listBox("bills", "Bills and money", "i-receipt", "", b.length,
      '<ul class="rows plain-rows">' + b.map(function (x) {
        var link = safeLink(x.webLink);
        var acts = [];
        if (canAsk()) acts.push('<button type="button" class="btn quiet small" data-act="bill" data-id="' + esc(x.id) + '">' + icon("i-bulb") + (x.status === "failed" ? "What do I do?" : "Check this bill") + "</button>");
        if (link) acts.push('<a class="btn quiet small" href="' + esc(link) + '" target="_blank" rel="noopener">' + icon("i-open") + "Open in Outlook</a>");
        return '<li class="' + (x.status === "failed" ? "failed" : "") + '"><b dir="auto">' + esc(text(x.from, 60) || text(x.what, 60)) + "</b>" +
          '<span class="side"><span class="amt num" dir="auto">' + esc(text(x.amount, 20)) + "</span>" + billChip(x, ref) + "</span>" +
          '<span class="sub" dir="auto">' + esc(text(x.from) ? text(x.what, 80) : "") + "</span>" +
          (acts.length ? '<span class="acts">' + acts.join("") + "</span>" : "") + "</li>";
      }).join("") + "</ul>", "No bill is waiting. Nothing failed.") + nudgeHtml(boxIdea("bills"));
  }

  var PARCEL_WORDS = { ordered: "Ordered", shipped: "On the way", "out-for-delivery": "Out for delivery", delayed: "Delayed" };
  function drawDeliveries(level) {
    var p = deliveries();
    var ref = refDate();
    if (level === "S") {
      return sumBox("deliveries", "On the way", "i-truck", String(p.length), p.length ? plural(p.length, "parcel", "parcels") + " coming" : "Nothing on the way",
        p[0] ? "<b>" + esc(text(p[0].what, 60)) + "</b>" : "");
    }
    return listBox("deliveries", "On the way", "i-truck", "", p.length,
      '<ul class="rows plain-rows">' + p.map(function (x) {
        var d = parseTime(x.eta);
        var link = safeLink(x.webLink);
        var gap = d ? daysBetween(ref, d) : null;
        var chip = x.status === "delayed" ? '<span class="chip hot">Delayed</span>'
          : d ? '<span class="chip way">' + (gap <= 0 ? "Arrives today" : "Arrives " + esc(dayWords(d, ref))) + "</span>" : "";
        return '<li><b dir="auto">' + esc(text(x.what, 80)) + "</b>" + chip +
          '<span class="sub" dir="auto">' + esc([text(x.from, 40), PARCEL_WORDS[x.status] || ""].filter(Boolean).join(", ")) + "</span>" +
          (link ? '<span class="acts"><a class="btn quiet small" href="' + esc(link) + '" target="_blank" rel="noopener">' + icon("i-open") + "Open in Outlook</a></span>" : "") + "</li>";
      }).join("") + "</ul>", "No parcel is on the way.") + nudgeHtml(boxIdea("deliveries"));
  }

  function drawComing(level) {
    var c = coming();
    var ref = refDate();
    if (level === "S") {
      return sumBox("coming", "Coming up", "i-calendar", String(c.length), c.length ? "in the next 7 days" : "A quiet week",
        c[0] ? "<b>" + esc(capital(dayWords(parseTime(c[0].start), ref))) + ":</b> " + esc(text(c[0].title, 60)) : "");
    }
    return listBox("coming", "Coming up", "i-calendar", "", c.length,
      '<ul class="rows plain-rows">' + c.map(function (x) {
        var d = parseTime(x.start);
        var bday = x.kind === "birthday";
        var timed = !x.allDay && /T\d\d:\d\d/.test(x.start || "");
        return '<li class="' + (bday ? "bday" : "") + '"><span><span class="day">' + (bday ? icon("i-cake") : "") + esc(capital(dayWords(d, ref)) + (timed ? ", " + clock(d) : "")) + "</span>" +
          '<b dir="auto">' + esc(text(x.title, 90)) + "</b></span>" +
          (text(x.where) ? '<span class="sub" dir="auto">' + esc(text(x.where, 60)) + "</span>" : "") +
          (canAsk() && bday ? '<span class="acts"><button type="button" class="btn quiet small" data-act="gift-idea" data-id="' + esc(x.id) + '">' + icon("i-cake") + "A gift idea</button></span>" : "") + "</li>";
      }).join("") + "</ul>", calendarOn() || state.example ? "Nothing planned in the next 7 days." : "Connect Outlook Calendar and the week ahead shows up here.") + nudgeHtml(boxIdea("coming"));
  }

  function drawMore(level) {
    var f = fyi();
    var left = state.data.setAside && typeof state.data.setAside === "object" ? state.data.setAside : null;
    var aside = left && typeof left.count === "number" && left.count ? left.count : 0;
    if (level === "S") {
      return sumBox("more", "Also came in", "i-bell", String(f.length), f.length ? plural(f.length, "note", "notes") + " with nothing to do" : "Nothing new",
        aside ? esc(aside + " set aside") : "");
    }
    var rows = f.map(function (item) {
      return '<li><b dir="auto">' + esc(text(item.from, 60)) + '</b><span dir="auto">' + esc(text(item.gist, 140)) + "</span></li>";
    });
    if (aside) rows.push("<li><b>" + aside + " set aside</b><span dir=\"auto\">" + esc(text(left.what, 80) || "Not for today") + ". Still in Outlook.</span></li>");
    return listBox("more", "Also came in", "i-bell", "", rows.length, '<ul class="mini rows">' + rows.join("") + "</ul>", "Nothing else came in today.") + nudgeHtml(boxIdea("more"));
  }

  /** What the person told the cabinet about themselves, from setup.md. */
  function drawSetup(level) {
    var items = state.setup || [];
    var set = items.filter(function (a) { return !a.unset; }).length;
    var btn = canAsk() && askReady()
      ? '<button class="btn small" data-act="ask" data-q="' + esc(set ? "I want to change what you know about me." : "I want to tell you about me and my family so you can sort my Outlook better.") + '">' +
        icon("i-pen") + (set ? "Change this" : "Tell it now") + "</button>"
      : "";
    if (level === "S") {
      return sumBox("setup", "What it knows", "i-sliders", set + " of " + items.length, "answers given", "") + (btn ? '<div class="box-pad">' + btn + "</div>" : "");
    }
    if (!set) {
      return boxHead("setup", "Tell your Home Keeper about you", "i-sliders", "", null) +
        '<div class="box-pad"><p>Who is in your family, whose mail always matters, what to set aside and how your replies sound. Two minutes here makes every morning sharper.</p>' + btn + "</div>";
    }
    return boxHead("setup", "What your Home Keeper knows", "i-sliders", "", null) +
      '<div class="box-pad"><dl class="facts">' + items.slice(0, 5).map(function (a) {
        return "<div><dt>" + esc(a.label) + "</dt><dd" + (a.unset ? ' class="unset"' : "") + ' dir="auto">' + esc(a.unset ? "Not set yet" : text(a.value, 240)) + "</dd></div>";
      }).join("") + "</dl>" + btn + "</div>";
  }

  // ── Your next 3 things ─────────────────────────────────────────────────
  // Everything that asks something of the person, from all the boxes, in the order to do
  // it, each with its press ready. "Done" takes a thing off the list for good (kept per
  // person in cabinet.mine) and the next one moves up.

  var DONE_KEY = "my-day-done@1";
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function thingKey(kind, item) {
    var ref = item.id || text(item.from || item.title, 80) + "|" + text(item.subject || item.what, 80);
    return (state.example ? "example:" : "") + kind + ":" + ref + (kind === "plan" || kind === "parcel" ? ":" + todayKey() : "");
  }
  /**
   * The order: an answer needed today, a payment that failed, family waiting, a bill due
   * today or tomorrow, a plan in the next three hours with something to bring, a parcel
   * arriving today, the others waiting (longest first), then bills due later this week.
   */
  function nextThings() {
    var ref = refDate();
    var out = [];
    function add(rank, order, kind, item, title, why, action) {
      out.push({ rank: rank, order: order, key: thingKey(kind, item), title: title, why: why, action: action });
    }
    waiting().forEach(function (w, i) {
      var id = text(w.id) || "w" + i;
      var days = waitingDays(w.waitingSince || w.receivedAt, ref);
      var who = KIND_WORDS[w.kind] ? KIND_WORDS[w.kind].toLowerCase() : "";
      var why = [who, w.urgent === true ? "needs it today" : days >= 2 ? "waiting " + days + " days" : text(w.gist, 60)].filter(Boolean).join(", ");
      var rank = w.urgent === true ? 0 : w.kind === "family" ? 2 : 6;
      add(rank, -days, "reply", w, "Answer " + (text(w.from, 60) || "someone"), why,
        text(w.reply) ? { label: "Copy the reply", act: "copy", id: id } : { label: "Draft a reply", act: "reply", id: id });
    });
    bills().forEach(function (b) {
      var d = parseTime(b.due);
      var gap = d ? daysBetween(ref, d) : 99;
      if (b.status === "failed") add(1, gap, "bill", b, "Fix the " + (text(b.from, 40) || "failed") + " payment", text(b.amount, 20) + (text(b.what) ? ", " + text(b.what, 50) : ""), { label: "What do I do?", act: "bill", id: b.id });
      else if (b.status !== "renews" && gap <= 1) add(3, gap, "bill", b, "Pay " + (text(b.from, 40) || text(b.what, 40)), [text(b.amount, 20), "due " + (d ? dayWords(d, ref) : "soon")].filter(Boolean).join(", "), { label: "Check this bill", act: "bill", id: b.id });
      else if (b.status !== "renews" && gap <= 7) add(7, gap, "bill", b, "Pay " + (text(b.from, 40) || text(b.what, 40)), [text(b.amount, 20), "due " + dayWords(d, ref)].filter(Boolean).join(", "), { label: "Check this bill", act: "bill", id: b.id });
    });
    events().forEach(function (e) {
      var mins = minutesBetween(ref, e.start);
      if (mins < 0 || mins > 180 || !text(e.raw.prep) || !sameDay(ref, dayDate())) return;
      add(4, mins, "plan", e.raw, "Get ready for " + (text(e.raw.title, 50) || "your plan"), "at " + clock(e.start) + ", " + text(e.raw.prep, 70), { label: "What do I need?", act: "plan", id: e.raw.id });
    });
    deliveries().forEach(function (p) {
      var d = parseTime(p.eta);
      if (!d || daysBetween(ref, d) > 0) return;
      add(5, 0, "parcel", p, text(p.what, 50) + " arrives today", [text(p.from, 30), "someone should be home"].filter(Boolean).join(", "), { label: "Where is it?", act: "parcel", id: p.id });
    });
    return out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
  }

  function actionButton(a) {
    return '<button type="button" class="btn small" data-act="' + a.act + '"' + (a.id ? ' data-id="' + esc(a.id) + '"' : "") +
      (canAsk() || a.act === "copy" ? "" : " disabled data-viewer-off") + ">" + esc(a.label) + "</button>";
  }

  function drawNext(level) {
    var all = nextThings();
    var open = all.filter(function (t) { return !state.done[t.key]; });
    var done = all.length - open.length;
    var top = open.slice(0, 3);
    if (level === "S") {
      return sumBox("next", "Do next", "i-check", String(open.length), open.length ? plural(open.length, "thing", "things") + " to do" : "Nothing needs you",
        top[0] ? "<b>" + esc(top[0].title) + "</b>" : "");
    }
    var body = top.length
      ? '<ol class="rows things">' + top.map(function (t, i) {
          return '<li class="thing" data-key="' + esc(t.key) + '">' +
            '<button type="button" class="tick" data-act="done" data-key="' + esc(t.key) + '" aria-label="Done: ' + esc(t.title) + '">' + icon("i-check") + "</button>" +
            '<span class="n num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<span class="what"><b dir="auto">' + esc(t.title) + '</b><span dir="auto">' + esc(t.why) + "</span></span>" +
            actionButton(t.action) + "</li>";
        }).join("") + "</ol>"
      : '<p class="lane-empty all-done">' + icon("i-check") + (done ? "All done. Nothing else needs you today." : "Nothing needs you today.") + "</p>";
    var rest = open.length - top.length;
    var foot = (rest > 0 ? "<span>" + rest + " more " + plural(rest, "thing", "things") + " in the boxes below</span>" : "<span></span>") +
      (done ? '<button type="button" class="btn quiet small" data-act="undone">' + done + " done, bring back</button>" : "");
    return boxHead("next", top.length === 3 ? "Your next 3 things" : "Your next things", "i-check", "", null) +
      '<div class="box-body">' + body + "</div>" +
      (rest > 0 || done ? '<div class="next-foot">' + foot + "</div>" : "") +
      '<button type="button" class="box-more" data-act="more-rows" hidden></button>';
  }

  /** Ticks a thing off: it slides away, the ones under it move up, a new one fades in. */
  function markDone(key, row) {
    var finish = function () {
      var box = boxEls.next;
      var tops = {};
      if (box) Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) { tops[r.getAttribute("data-key")] = r.getBoundingClientRect().top; });
      state.done[key] = todayKey();
      saveDone();
      var before = snapshot();
      paintGrid();
      glide(before);
      if (box && motionOK()) {
        Array.prototype.forEach.call(box.querySelectorAll(".thing"), function (r) {
          var was = tops[r.getAttribute("data-key")];
          if (was == null) { fadeIn(r); return; }
          var dy = was - r.getBoundingClientRect().top;
          if (Math.abs(dy) >= 1) r.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 320, easing: SMOOTH });
        });
      }
      toast("Done.");
    };
    if (row && motionOK()) {
      // The tick shows, the row slides away; the list moves on by the clock, not on the
      // animation's end, so a page that draws no frames still marks it done.
      row.querySelector(".tick").classList.add("ticked");
      row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(14px)" }], { duration: 240, delay: 160, easing: "ease-in", fill: "forwards" });
      setTimeout(finish, 420);
    } else finish();
  }
  function bringBack() {
    nextThings().forEach(function (t) { delete state.done[t.key]; });
    saveDone();
    var before = snapshot();
    paintGrid();
    glide(before);
  }
  function saveDone() {
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(DONE_KEY, state.done).catch(function () { toast("That could not be saved. It comes back next time."); });
    }
  }

  /** Every idea the person has not hidden, one tap each; today's line when it fits. */
  function drawIdeasBox(level) {
    var shown = IDEAS.filter(function (idea) { return !state.hiddenIdeas[idea.id]; });
    if (level === "S") {
      return sumBox("ideas", "Ideas", "i-bulb", String(shown.length), "ideas, one tap each", "") +
        '<div class="box-pad"><button class="btn small" data-act="ideas">' + icon("i-bulb") + "See them all</button></div>";
    }
    var facts = ideaFacts();
    var can = canAsk();
    return listBox("ideas", "Ideas", "i-bulb", "", shown.length,
      '<ul class="rows idea-rows">' + shown.map(function (idea) {
        var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts) : null;
        return '<li><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
          "<div><b>" + esc(idea.title) + "</b>" + (level === "L" ? '<span dir="auto">' + esc(fit ? "Today: " + fit.line : idea.text) + "</span>" : "") + "</div>" +
          '<button class="btn small" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask</button></li>";
      }).join("") + "</ul>",
      "Every idea is hidden from the page. Find them under Ideas.");
  }

  /** One idea as its own box, put there by the person, so it shows even on a day it does not fit. */
  function drawOneIdea(idea, level) {
    var fit = state.data && IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](ideaFacts()) : null;
    var can = canAsk();
    return '<div class="one-idea"><span class="ic ' + idea.tint + '" aria-hidden="true">' + icon(idea.icon) + "</span>" +
      "<h3>" + esc(idea.title) + "</h3>" +
      (level === "S" ? "" : fit ? '<p class="today" dir="auto">Today: ' + esc(fit.line) + "</p>" : "<p>" + esc(idea.text) + "</p>") +
      '<div class="go"><button class="btn small dark" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-send") + "Ask now</button>" +
      (level === "S" ? "" : '<button class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>") +
      "</div></div>";
  }

  // Ask, or try an idea: the idea for today on top, a few more under it as chips.
  function drawAsk(level) {
    if (state.layoutAsk) return drawLayoutAsk(level);
    var featured = level === "S" ? null : askIdea();
    var shown = shownIdeas();
    if (featured) shown[featured.idea.id] = true;
    var more = level === "S" ? [] : IDEAS.filter(function (idea) { return !shown[idea.id] && !state.hiddenIdeas[idea.id] && ideaUseful(idea); }).slice(0, featured ? 0 : level === "L" ? 4 : 2);
    var note = state.askNote || (askReady() ? "" : askHint());
    return (level === "S" ? "" : '<h2 id="ask-title">Ask, or try an idea</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">Your question</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="Ask about bills, plans, parcels, people..." />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Ask</button></form>" +
      (featured ? nudgeHtml(featured, "Idea for today: ") : "") +
      (more.length ? '<p class="qs-label">More ideas</p><div class="qs">' + more.map(function (idea) {
        return '<button type="button" class="q" data-act="idea-now" data-idea="' + idea.id + '">' + esc(idea.title) + "</button>";
      }).join("") + "</div>" : "") +
      (level !== "S" && note ? '<p class="note" id="ask-note">' + esc(note) + "</p>" : "");
  }
  /** The Ask box while it takes a request about the boxes, from the Layout button. */
  function drawLayoutAsk(level) {
    var note = state.askNote || "The agent suggests the boxes. Nothing changes until you press Apply.";
    return (level === "S" ? "" : '<h2 id="ask-title">Ask the agent about your boxes</h2>') +
      '<form id="ask-form" autocomplete="off"><label for="ask-input" class="sr">What you want on your page</label>' +
      '<input id="ask-input" name="q" dir="auto" maxlength="600" placeholder="For example: put bills first, hide the numbers" />' +
      '<button type="submit" class="btn primary">' + icon("i-send") + "Send</button></form>" +
      '<p class="note" id="ask-note">' + esc(note) + "</p>" +
      '<p class="note"><button type="button" class="cancel" data-act="layout-ask-cancel">Back to asking about your day</button></p>';
  }
  function askHint() {
    if (askReady()) return "The answer comes up in the chat next to this page.";
    return outlookState() === "not-available-here"
      ? "Once Outlook works here, you can ask things like these."
      : "Connect Outlook first, then ask anything. A question here takes you to connecting.";
  }

  // ── Ideas, where and when they help ────────────────────────────────────
  // An idea offers itself in its box when today's mail and plans say it would help, with the
  // real numbers, at most one per box. "Hide" takes it off the page for good (kept per person
  // in cabinet.mine); the Ideas panel on the fridge door always has every one.

  var HIDDEN_IDEAS_KEY = "my-day-hidden-ideas@1";

  /** What today says, counted once for every idea. */
  function ideaFacts() {
    var ref = refDate();
    var w = waiting();
    var aside = state.data && state.data.setAside && typeof state.data.setAside.count === "number" ? state.data.setAside.count : 0;
    return {
      ref: ref,
      longWait: w.filter(function (x) { return waitingDays(x.waitingSince || x.receivedAt, ref) >= 3; }).length,
      school: w.filter(function (x) { return x.kind === "school"; }).length,
      renews: bills().filter(function (b) { return b.status === "renews"; }).length,
      birthdays: list(state.data && state.data.coming).filter(function (c) { return c.kind === "birthday"; }).length,
      parcels: deliveries().length,
      aside: aside
    };
  }

  /** For each idea: the line and the press that fit today, or null when it would not help now. */
  var IDEA_FITS = {
    replies: function (f) {
      var n = f.longWait;
      return n ? { line: n + " " + plural(n, "person has", "people have") + " waited 3 days or more.", act: n === 1 ? "Draft the reply" : "Draft their replies" } : null;
    },
    subs: function (f) {
      return f.renews ? { line: "Something renews this week. Worth a look at everything you pay for?", act: "Show what I pay for" } : null;
    },
    school: function (f) {
      return f.school ? { line: "School wrote to you. All of this week’s school dates in one list?", act: "List school dates" } : null;
    },
    week: function (f) {
      var day = f.ref.getDay();
      return day === 0 || day === 6 ? { line: "It’s the weekend. Lay out next week before it starts?", act: "Plan my week" } : null;
    },
    birthdays: function (f) {
      return f.birthdays ? { line: f.birthdays === 1 ? "A birthday is coming this week. A gift idea in time?" : f.birthdays + " birthdays are coming. Gift ideas in time?", act: "Gift ideas" } : null;
    },
    parcels: function (f) {
      return f.parcels >= 2 ? { line: f.parcels + " parcels are on the way. Which days should you be home?", act: "Check my parcels" } : null;
    },
    newsletters: function (f) {
      return f.aside >= 30 ? { line: f.aside + " emails were set aside. Which senders do you never read?", act: "Show the noisy senders" } : null;
    },
    warranty: function () { return null; }
  };

  /** A list box with nothing in it today shrinks to a short sheet. */
  function boxEmpty(id) {
    if (!state.data) return false;
    if (id === "waiting") return !waiting().length;
    if (id === "bills") return !bills().length;
    if (id === "deliveries") return !deliveries().length;
    if (id === "coming") return !coming().length;
    if (id === "today") return !plansLeft().length;
    if (id === "more") return !fyi().length && !(state.data.setAside && state.data.setAside.count);
    return false;
  }
  /** An idea is offered only when its box has something today. */
  function ideaUseful(idea) { return idea.box === "ask" || !boxEmpty(idea.box); }

  function ideaById(id) {
    for (var i = 0; i < IDEAS.length; i++) if (IDEAS[i].id === id) return IDEAS[i];
    return null;
  }
  /** The idea with what fits today, or null when it is hidden or would not help now. */
  function fitted(idea, facts) {
    if (!idea || state.hiddenIdeas[idea.id] || !state.data) return null;
    var fit = IDEA_FITS[idea.id] ? IDEA_FITS[idea.id](facts || ideaFacts()) : null;
    return fit ? { idea: idea, line: fit.line, act: fit.act } : null;
  }
  function onPage(boxId) {
    return placed().some(function (spot) { return spot.id === boxId; });
  }
  /** The first idea of this box that fits today. */
  function boxIdea(boxId) {
    var facts = ideaFacts();
    for (var i = 0; i < IDEAS.length; i++) {
      if (IDEAS[i].box !== boxId) continue;
      var f = fitted(IDEAS[i], facts);
      if (f) return f;
    }
    return null;
  }
  /** Ideas the list boxes on the page are showing right now. */
  function shownIdeas() {
    var shown = {};
    ["waiting", "today", "bills", "deliveries", "coming", "more"].forEach(function (id) {
      var el = boxEls[id];
      if (!onPage(id) || (el && el.getAttribute("data-level") === "S")) return;
      var f = boxIdea(id);
      if (f) shown[f.idea.id] = true;
    });
    return shown;
  }
  /** The Ask box's idea for today: its own, or one whose box is not on the page. */
  function askIdea() {
    var facts = ideaFacts();
    var shown = shownIdeas();
    var best = null;
    IDEAS.forEach(function (idea) {
      if (best || shown[idea.id] || (idea.box !== "ask" && onPage(idea.box))) return;
      best = fitted(idea, facts);
    });
    return best;
  }

  /** "every Monday", "every month": the schedule as the end of "Do this ...". */
  function routineWords(idea) { return idea.when.charAt(0).toLowerCase() + idea.when.slice(1); }

  function nudgeHtml(fit, lead) {
    if (!fit) return "";
    var idea = fit.idea;
    var can = canAsk();
    return '<div class="nudge">' + icon("i-bulb") + '<p dir="auto">' + esc((lead || "") + fit.line) + "</p>" +
      '<div class="nudge-actions">' +
      '<button type="button" class="btn small ' + (lead ? "primary" : "dark") + '" data-act="idea-now" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + esc(fit.act) + "</button>" +
      '<button type="button" class="btn small" data-act="idea-routine" data-idea="' + idea.id + '"' + (can ? "" : " disabled data-viewer-off") + ">" + icon("i-repeat") + "Do this " + esc(routineWords(idea)) + "</button>" +
      '<button type="button" class="nudge-hide" data-act="idea-hide" data-idea="' + idea.id + '" aria-label="Hide this idea from the page">Hide</button>' +
      "</div></div>";
  }

  function setIdeaHidden(id, hidden) {
    var before = snapshot();
    if (hidden) state.hiddenIdeas[id] = true;
    else delete state.hiddenIdeas[id];
    paintGrid();
    glide(before);
    // The idea that takes its place fades up.
    var idea = ideaById(id);
    var home = idea && boxEls[idea.box];
    if (home && home.isConnected) fadeIn(home.querySelector(".nudge"));
    if (state.drawerOpen) paintDrawer();
    toast(hidden ? "Hidden. You can always find it under Ideas." : "It’s back on your page when it fits your day.");
    if (V2 && cab.mine && typeof cab.mine.set === "function") {
      cab.mine.set(HIDDEN_IDEAS_KEY, Object.keys(state.hiddenIdeas)).catch(function () {
        toast("That could not be saved. It comes back next time.");
      });
    }
  }

  var DRAWERS = {
    ideas: { title: "Ideas", sub: "One tap to ask now, or to have it done for you on a schedule.", icon: "i-bulb", paint: paintIdeasPanel },
    add: { title: "Add a box", sub: "Pick what you want on your page. You can remove it again any time.", icon: "i-plus", paint: paintPicker }
  };
  function paintDrawer() {
    var kind = DRAWERS[state.drawerKind] || DRAWERS.ideas;
    $("drawer-title").textContent = kind.title;
    $("drawer-sub").textContent = kind.sub;
    $("drawer-icon").innerHTML = icon(kind.icon);
    kind.paint();
  }

  // The Add a box panel: every box by group, the ones on the page ticked.
  function paintPicker() {
    var on = {};
    (state.layout || DEFAULT_LAYOUT).forEach(function (b) { on[b.id] = true; });
    $("drawer-body").innerHTML = GROUPS.map(function (group) {
      var ids = Object.keys(BOXES).filter(function (id) { return BOXES[id].group === group.id; });
      return '<section class="pick-group"><h3>' + esc(group.title) + "</h3>" + ids.map(function (id) {
        var box = BOXES[id];
        var ready = !box.show || box.show();
        var note = on[id] ? (ready ? "On your page" : "On your page. " + box.when) : ready ? "" : box.when;
        return '<div class="pick' + (on[id] ? " on" : "") + '"><span class="pick-ic" aria-hidden="true">' + icon(box.icon) + "</span>" +
          "<div><b>" + esc(box.title) + "</b><span>" + esc(box.desc) + "</span>" +
          (note ? "<em" + (ready ? "" : ' class="wait"') + ">" + esc(note) + "</em>" : "") + "</div>" +
          (on[id]
            ? '<span class="pick-on" aria-hidden="true">' + icon("i-check") + "</span>"
            : '<button type="button" class="btn small" data-act="add-this" data-add="' + id + '"' + (ready ? "" : " disabled") +
              ' aria-label="Add ' + esc(box.title) + '">' + icon("i-plus") + "Add</button>") +
          "</div>";
      }).join("") + "</section>";
    }).join("");
  }

  // ── Editing the page ───────────────────────────────────────────────────
  // Edit layout turns on a bar above the grid; each box gets a remove button and stops
  // reacting to presses. Every change is kept at once in cabinet.mine, and Undo steps back.

  function startEdit() {
    // Boxes show the size they were given while being arranged, not grown by an open list.
    state.open = {};
    state.expanded = {};
    state.need = {};
    state.editing = true;
    state.undo = [];
    // The page's opening fade ends here, so no box is caught half way into it while moving.
    Object.keys(boxEls).forEach(function (id) { boxEls[id].classList.remove("rise"); });
    paint();
    paintEditbar();
    // The remove and resize handles pop in once, as edit mode starts.
    var grid = $("grid");
    grid.classList.add("fresh");
    setTimeout(function () { grid.classList.remove("fresh"); }, 700);
    toast(phone() ? "Hold a box to move it. Pick its size on top." : "Drag a box to move it. Pull its corner to resize it.");
  }
  function doneEdit() {
    state.editing = false;
    state.undo = [];
    closeDrawer();
    paint();
    paintEditbar();
  }
  function paintEditbar() {
    $("editbar").hidden = !state.editing;
    $("undo-btn").disabled = !state.undo.length;
  }

  function saveLayout() {
    if (!V2 || !cab.mine || typeof cab.mine.set !== "function") return;
    cab.mine.set(LAYOUT_KEY, state.layout).catch(function () {
      toast("Your page could not be saved. It goes back to how it was next time.");
    });
  }
  function changeLayout(next, easing) {
    var before = snapshot();
    letGo();
    state.undo.push(copyLayout(state.layout || DEFAULT_LAYOUT));
    if (state.undo.length > 30) state.undo.shift();
    state.layout = next;
    saveLayout();
    paintGrid();
    glide(before, null, easing);
    paintEditbar();
    if (state.drawerOpen) paintDrawer();
  }

  function removeBox(id) {
    var el = boxEls[id];
    var next = copyLayout(state.layout || DEFAULT_LAYOUT).filter(function (b) { return b.id !== id; });
    if (el) el.classList.add("leaving");
    setTimeout(function () {
      if (el) el.classList.remove("leaving");

      toast(BOXES[id].title + " removed. Undo brings it back.");
    }, 200);
  }
  /** The first place, reading left to right and top down, where a w by h box touches nothing. */
  function freeSpot(w, h, source) {
    var spots = placed(source);

      for (var x = 0; x + w <= COLS; x++) {
        var hit = spots.some(function (o) { return x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h; });
        if (!hit) return { x: x, y: y };

    }
  }
  function addBox(id) {
    var box = BOXES[id];

    var at = freeSpot(w, box.h);
    changeLayout(copyLayout(state.layout || DEFAULT_LAYOUT).concat({ id: id, x: at.x, y: at.y, w: w, h: box.h }));
    closeDrawer();
    var el = boxEls[id];
    if (el && el.isConnected) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });

  }
  function resetLayout() {
