# Meeting Memory — Meeting Index
# Maintained by Meeting Summarizer. One row per meeting processed.
# Written by the Daily Meeting Capture job (Mon–Fri 09:00).
#
# Row fields:
#   slug            meeting file basename, <YYYY-MM-DD>-<title-slug>
#   date            meeting date (YYYY-MM-DD)
#   file            path to the meeting file, or "missing" if never written
#   attendees       attendee count (null when the meeting file does not exist)
#   decisions       decision count (null when the meeting file does not exist)
#   open_actions    open items in action-items.yaml pointing at this slug
#   source          transcript | calendar-description | unknown
#
# The Action Tracker reads the `decisions` field here for its weekly rollup.
# A null `decisions` means "not known", NOT "zero decisions" — do not report
# a null as zero.

