# Rows above were reconstructed from meeting_slug references in
# action-items.yaml, not from meeting files — no meeting file has ever been
# written to this directory. They are recorded so the open action items stay
# traceable to a slug. See capture-log.md.

# Days the daily capture job ran but produced no meeting files, and why.
# A gap entry is not a claim that no meetings happened — it is a claim that
# no meeting source was reachable.
capture_gaps:
  - date: "2026-08-12"
    run: "2026-08-13"
    reason: no-source-reachable
    detail: >-
      Calendar connector (Google Calendar) not authorised; no video connector
      (Zoom/Meet/Teams) configured; no transcripts present in the cabinet.
      Gmail, the one authorised source, held no meeting traffic for this date.
      Nothing was written rather than inferred.
