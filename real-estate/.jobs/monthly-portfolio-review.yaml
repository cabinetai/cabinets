id: monthly-portfolio-review
name: Monthly Portfolio Review
enabled: true
schedule: 0 8 1 * *
provider: claude-code
adapterType: claude_local
ownerAgent: portfolio-manager
agentSlug: portfolio-manager
timeout: 900
prompt: |-
  Write this month's review of the portfolio.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-the-map-works.md`. It says where a property
     is kept and which copy is the newer one. This prompt does not repeat it.
  2. Build the true list of properties from `properties/` and `map/.data/shared.json`.
     Skip `EXAMPLE-` files if the person has a property of their own. If there are only
     examples, report: "Your map only has the examples. Add a property and I will
     review it next month." and stop.
  3. Work out, for everything not sold: total value, total owed, equity, rent a month,
     costs a month (mortgage, running costs, building fees, and a twelfth of tax and
     insurance), what is left, and how many rentable places are rented.
  4. Write `reviews/YYYY-MM.md` (this month): the totals, one line per property, what
     changed since last month's review if there is one, and the gaps (a property with
     no value, no rent, or no pin).
  5. Change no property file. This routine reads and reports.

  Finish in three or four plain sentences: the totals, the biggest change, and the one
  property most worth a look.
