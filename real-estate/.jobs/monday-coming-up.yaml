id: monday-coming-up
name: Monday Coming Up
enabled: true
schedule: 0 8 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: property-keeper
agentSlug: property-keeper
timeout: 600
prompt: |-
  Do the Monday check of every date on every property.

  Your working directory is the cabinet root.

  1. Read your persona, then `playbooks/how-the-map-works.md`. It says where a property
     is kept and which copy is the newer one. This prompt does not repeat it.
  2. Build the true list of properties from `properties/` and `map/.data/shared.json`.
     Delete each `EXAMPLE-` file the person removed on the map, as the playbook says.
     Skip `EXAMPLE-` files if the person has a property of their own. If the person has
     no property of their own, report: "Your map has no properties of your own yet. Add
     one and I will watch its dates." and stop.
  3. Collect the watched dates only: lease end, tax due, insurance renewal, fixed rate
     ending, next inspection, renovation end, and a date field the person made
     themselves. Leave out dates that are history, such as bought on, lease start,
     vacant since and last renovated. List the watched dates that already passed and
     the ones inside the next 60 days, soonest first. Leave out a date the person made
     once it is more than 30 days past.
  4. For each lease ending inside 60 days, draft a short, friendly renewal note to the
     tenant and add it as a dated line in that property's notes. Never write the same
     note twice. You draft, you never send.
  5. Name each vacant property and how long it has been empty.

  Finish in three or four plain sentences: what is due soonest and where, what passed
  without a word, and the one thing most worth doing this week.
