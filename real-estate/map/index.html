<!DOCTYPE html>
<!--
  Real Estate Map: every property you own, as a pin on a map. The cabinet opens here.

  Hover a pin to read everything known about the property. Press it to open the property:
  its state, its numbers, its dates, a to-do list, notes, and any field the person adds.
  Beside the map is a board of boxes each person arranges for themselves (Edit layout),
  and an Ideas panel of one-press asks for the assistants.

  Where a property comes from:
    1. A file in properties/ (one .md per property, frontmatter on top). The assistants
       write these, and the examples ship this way.
    2. The app's own store (window.cabinet.store, kept by Cabinet in map/.data/shared.json).
       Everything added or edited on this page lands there, under the key "a:<id>".
  For one property the newer of the two wins, so an edit here shows at once and a later
  edit by an assistant shows too. playbooks/how-the-map-works.md is the same rule in words.

  The map is MapLibre (loaded from a CDN) drawing OpenFreeMap (free, no key). MapLibre does
  the panning and zooming; the pins are this page's own buttons, placed as MapLibre markers.
  If MapLibre cannot start, the map says so and the board works alone. Address search asks OpenStreetMap's
  Nominatim, only on a press. Those, and Google Fonts, are the only requests that leave
  Cabinet. One file on purpose: a sealed frame cannot load files next to it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Real Estate Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F6F3; --surface: #FFFFFF; --surface-muted: #F6F5F2; --surface-press: #ECEAE5;
    
    --ink: #1C1F24; --ink-2: #40454D; --ink-muted: #6F747C;
    --wood: #1F3A5C; --wood-deep: #142842; --on-wood: #FFFFFF;
    --border: #E2E0DA; --border-soft: rgba(226,224,218,.7);
    --danger: #C4321F; --danger-tint: #FCEBE7;
    --warn: #A86A12; --warn-tint: #FBF1DD;
    --ok: #14823E; --ok-tint: #E6F4EB;
    --st-rented: #2E7D5B; --st-vacant: #B5473A; --st-own: #6B7280;
    --st-reno: #B07D2B; --st-sale: #3A64A8; --st-sold: #9CA3AF;
    --on-st: #FFFFFF;
    color-scheme: light;
    --radius: 18px;
    --shadow-1: 0 1px 2px rgba(59,47,47,.06), 0 6px 18px -10px rgba(59,47,47,.18);
    --shadow-2: 0 2px 4px rgba(59,47,47,.08), 0 18px 40px -16px rgba(59,47,47,.32);
    --font: Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --ring: 0 0 0 3px rgba(31,58,92,.25);
    --ease: cubic-bezier(.23, 1, .32, 1);
    --map-bg: #EDE6DA;
    --gl-filter: sepia(.14) saturate(.9);
  }
  :root[data-theme="dark"] {
    --bg: #131518; --surface: #1C1F23; --surface-muted: #23262B; --surface-press: #2D3036;
    
    --ink: #ECEDEF; --ink-2: #C9CCD1; --ink-muted: #969BA3;
    --wood: #9DBCE3; --wood-deep: #BCD2EE; --on-wood: #0F1B2B;
    --border: #33363C; --border-soft: rgba(70,74,82,.6);
    --danger: #FF8A7A; --danger-tint: #3A1B18;
    --warn: #E5B866; --warn-tint: #33290F;
    --ok: #5CC98A; --ok-tint: #173022;
    --st-rented: #5FB28C; --st-vacant: #E07B6E; --st-own: #A3A9B3;
    --st-reno: #D7A85A; --st-sale: #7EA3DD; --st-sold: #7C828C;
    --on-st: #14171B;
    color-scheme: dark;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
    --shadow-2: 0 2px 4px rgba(0,0,0,.35), 0 18px 40px -16px rgba(0,0,0,.8);
    --ring: 0 0 0 3px rgba(157,188,227,.35);
    --map-bg: #1d1a18;
  }
  :root[data-map="classic"] { --gl-filter: none; }
  :root[data-map="night"] { --map-bg: #1d1a18; --gl-filter: none; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  html[data-read] [data-write] { display: none !important; }

  /* ── Frame ─────────────────────────────────────────────────────────────── */
  #app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; flex-wrap: wrap; }
  .brand { min-width: 0; margin-right: auto; }
  .brand h1 { margin: 0; font: 600 22px/1.15 var(--serif); letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
  .brand h1 .mark { width: 34px; height: 34px; border-radius: 11px; background: var(--wood); color: var(--on-wood); display: grid; place-items: center; flex: none; }
  .brand h1 .mark svg { width: 19px; height: 19px; }
  .brand p .part-x { position: static; display: inline-grid; vertical-align: middle; margin-left: 8px; border-width: 0; }
  .brand p { margin: 3px 0 0 43px; color: var(--ink-muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p b { color: var(--ink-2); font-weight: 600; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .16s var(--ease), background .16s, border-color .16s, box-shadow .16s; }
  .btn:hover { background: var(--surface-muted); border-color: color-mix(in srgb, var(--wood) 35%, var(--border)); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--wood); border-color: var(--wood); color: var(--on-wood); box-shadow: var(--shadow-1); }
    .host { position: relative; display: inline-flex; }
  .part-x { position: absolute; top: -9px; right: -9px; z-index: 7; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ink); color: var(--bg); display: grid; place-items: center; padding: 0; box-shadow: var(--shadow-1); transition: transform .16s var(--ease), background .16s; }
  .part-x svg { width: 12px; height: 12px; stroke-width: 2.6; }
  .part-x:hover { background: var(--danger); }
  .part-x:active { transform: scale(.92); }
  .part-x.wide { position: static; width: auto; height: 34px; border-radius: 999px; padding: 0 13px 0 10px; display: inline-flex; gap: 6px; font-weight: 600; font-size: 13.5px; border-width: 0; }
  .btn.primary:hover { background: var(--wood-deep); border-color: var(--wood-deep); }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { background: var(--surface-press); }
  .btn.small { min-height: 32px; padding: 4px 10px; font-size: 13.5px; border-radius: 9px; }
  .btn.danger { color: var(--danger); }
  .btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .icon-btn { width: 38px; padding: 0; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 404px; min-height: 0; }
  .mapwrap { position: relative; min-height: 0; margin: 0 0 14px 14px; border-radius: 22px; overflow: hidden; background: var(--map-bg); box-shadow: var(--shadow-2); border: 1px solid var(--border-soft); isolation: isolate; }
  .main.nomap, .main.norail { grid-template-columns: minmax(0, 1fr); }
  .main.nomap .mapwrap, .main.norail .rail { display: none; }
  .main.norail .mapwrap { margin-right: 14px; }
  .main.nomap .rail { padding-left: 14px; }
  .main.nomap .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
  .main.nomap .detail { max-width: 560px; margin: 0 auto; }
  .map-off { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 7; }
  .rail { min-height: 0; overflow-y: auto; padding: 0 14px 28px; scrollbar-width: thin; }

  /* ── The map ───────────────────────────────────────────────────────────── */
  #map { position: absolute; inset: 0; user-select: none; -webkit-user-select: none; }
  #map canvas { outline: none; filter: var(--gl-filter, none); }
  #map.placing .maplibregl-canvas-container, #map.placing .pin { cursor: crosshair; }
  /* MapLibre moves each marker by its transform; the look of a pin is on .pin-in inside. */
  .pin, .cluster, .spot { border: 0; background: none; padding: 0; }
  .pin-in { position: relative; display: flex; align-items: center; gap: 6px; transform: translate(-50%, calc(-100% - 9px)); transform-origin: 50% calc(100% + 9px); padding: 5px 10px 5px 6px; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; max-width: 190px; box-shadow: 0 1px 2px rgba(34,23,22,.25), 0 8px 18px -8px rgba(34,23,22,.5); border: 1.5px solid var(--c); transition: transform .22s var(--ease), box-shadow .22s, background .2s, color .2s; animation: drop .5s var(--ease) both; animation-delay: var(--d, 0ms); }
  .pin-in::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 11px; height: 11px; background: inherit; border: inherit; border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); border-radius: 0 0 3px 0; }
  .pin-in::before { content: ""; position: absolute; left: 50%; bottom: -13px; width: 8px; height: 4px; border-radius: 50%; background: rgba(34,23,22,.28); transform: translateX(-50%); filter: blur(1px); }
  .pin-ic { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: var(--on-st); display: grid; place-items: center; flex: none; }
  .pin-ic svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .pin-t { overflow: hidden; text-overflow: ellipsis; }
  .pin.bare .pin-in { padding: 4px; }
  .pin:hover, .pin.hot, .pin.sel { z-index: 5; }
  .pin:hover .pin-in, .pin.hot .pin-in { transform: translate(-50%, calc(-100% - 9px)) scale(1.12); box-shadow: 0 2px 4px rgba(34,23,22,.3), 0 16px 28px -10px rgba(34,23,22,.6); }
  .pin.sel .pin-in { background: var(--c); color: var(--on-st); transform: translate(-50%, calc(-100% - 9px)) scale(1.14); }
  .pin.sel .pin-ic { background: rgba(255,255,255,.22); }
  .pin.sel::after { content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--c); animation: ring 1.8s ease-out infinite; pointer-events: none; }
  .pin.example .pin-in { border-style: dashed; }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, calc(-100% - 40px)) scale(.7); } }
  @keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  .cluster-in { transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--wood); color: var(--on-wood); font-weight: 700; font-size: 15px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--wood) 26%, transparent), 0 10px 20px -8px rgba(34,23,22,.6); transition: transform .2s var(--ease); }
  .cluster:hover .cluster-in { transform: translate(-50%, -50%) scale(1.1); }
  .spot-in { transform: translate(-50%, calc(-100% - 10px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-2); white-space: nowrap; }
  .spot-in::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); }
  .spot::after { content: ""; position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); }

  .map-ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .map-ui > * { pointer-events: auto; }
  .chips { position: absolute; left: 12px; top: 12px; right: 64px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; align-items: center; }
  .chips .part-x { position: static; pointer-events: auto; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-1); transition: transform .16s var(--ease), opacity .2s; }
  .chip:active { transform: scale(.95); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip.off { opacity: .55; text-decoration: line-through; }
  .chip.off i { background: var(--ink-muted); }
  .chip span { color: var(--ink-muted); font-weight: 500; }
  .ctrl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ctrl .stack { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-1); border: 1px solid var(--border); background: var(--surface); }
  .ctrl button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: var(--surface); transition: background .15s; }
  .ctrl button + button { border-top: 1px solid var(--border); }
  .ctrl button:hover { background: var(--surface-press); }
  .menu { position: absolute; right: 60px; top: 12px; width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2); padding: 10px; animation: pop .18s var(--ease); transform-origin: top right; }
  .menu h4 { margin: 4px 6px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); }
  .menu .opt { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 8px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 14px; }
  .menu .opt:hover { background: var(--surface-muted); }
  .menu .opt.on { font-weight: 700; color: var(--wood); }
  .menu .opt.on::after { content: "✓"; margin-left: auto; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  .attr { position: absolute; right: 8px; bottom: 6px; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--ink-muted); }
  .attr a { color: inherit; }
  .banner { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-2); font-weight: 600; font-size: 14px; max-width: calc(100% - 24px); animation: rise .3s var(--ease); }
  .banner .btn { background: rgba(255,255,255,.14); border-color: transparent; color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 14px); } }
  .empty-map { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; background: var(--surface); padding: 22px 26px; border-radius: 18px; box-shadow: var(--shadow-2); max-width: 340px; }
  .empty-map h2 { margin: 0 0 6px; font: 600 20px var(--serif); }
  .empty-map p { margin: 0 0 14px; color: var(--ink-muted); }

  /* The hover card: everything known about the property, without a press. */
  .hover { position: absolute; left: 0; top: 0; width: 300px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-2); border: 1px solid var(--border); pointer-events: none !important; overflow: hidden; opacity: 0; transition: opacity .16s; z-index: 6; }
  .hover.show { opacity: 1; }
  .hover.wide { width: 400px; }
  .hover.wide dl { grid-template-columns: 1fr 1fr 1fr; }
  .hover .h-top { padding: 12px 14px 10px; border-top: 4px solid var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, var(--surface)), var(--surface)); }
  .hover .h-photo { height: 110px; background-size: cover; background-position: center; }
  .hover h3 { margin: 0; font: 600 17px/1.2 var(--serif); letter-spacing: -.01em; }
  .hover .h-addr { color: var(--ink-muted); font-size: 13px; margin-top: 2px; }
  .hover .h-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
  .tag.plain { background: var(--surface-press); color: var(--ink-2); }
  .tag svg { width: 13px; height: 13px; }
  .hover dl { margin: 0; padding: 4px 14px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .hover dl div { padding: 6px 0; border-top: 1px solid var(--border-soft); min-width: 0; }
  .hover dt { font-size: 11.5px; color: var(--ink-muted); }
  .hover dd { margin: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hover .h-flag { margin: 0 14px 8px; padding: 6px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; }
  .hover .h-note { padding: 0 14px 8px; font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hover .h-foot { padding: 7px 14px; background: var(--surface-muted); color: var(--ink-muted); font-size: 12px; display: flex; justify-content: space-between; }
  .flag-bad { background: var(--danger-tint); color: var(--danger); }
  .flag-warn { background: var(--warn-tint); color: var(--warn); }
  .flag-info { background: var(--surface-press); color: var(--ink-2); }
  .flag-ok { background: var(--ok-tint); color: var(--ok); }

  /* Search */
  .search { position: relative; flex: 1 1 220px; max-width: 340px; }
  .search input { width: 100%; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px 0 36px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .search input:focus { border-color: var(--wood); box-shadow: var(--ring); }
  .search > svg { position: absolute; left: 11px; top: 10px; color: var(--ink-muted); }
  .results { position: absolute; left: 0; right: 0; top: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2); padding: 6px; z-index: 30; max-height: 60vh; overflow: auto; animation: pop .16s var(--ease); transform-origin: top; }
  .results button { display: flex; width: 100%; gap: 9px; align-items: center; text-align: left; border: 0; background: none; padding: 8px 9px; border-radius: 9px; font-size: 14px; }
  .results button:hover, .results button:focus-visible { background: var(--surface-muted); }
  .results small { display: block; color: var(--ink-muted); font-size: 12.5px; }
  .results .sep { margin: 6px 9px 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

  /* ── The board of boxes ────────────────────────────────────────────────── */
  .board { display: flex; flex-direction: column; gap: 12px; }
  .box { position: relative; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border-soft); box-shadow: var(--shadow-1); animation: boxin .4s var(--ease) both; }
  @keyframes boxin { from { opacity: 0; transform: translateY(8px); } }
  .box > header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
  .box > header h3 { margin: 0; font-size: 15.5px; letter-spacing: -.005em; color: var(--ink); font-weight: 650; display: flex; gap: 9px; align-items: center; }
  .bi { display: grid; place-items: center; flex: none; color: var(--ink-muted); }
  .bi svg { width: 16px; height: 16px; }
    .addtile { width: 100%; min-height: 64px; border-radius: var(--radius); border: 1.5px dashed color-mix(in srgb, var(--wood) 45%, var(--border)); background: color-mix(in srgb, var(--wood) 5%, transparent); color: var(--wood); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .16s var(--ease), background .16s; }
  .addtile:hover { background: color-mix(in srgb, var(--wood) 10%, transparent); }
  .addtile:active { transform: scale(.98); }
  .box > header .n { margin-left: auto; color: var(--ink-muted); font-size: 13px; }
  .box .body { padding: 12px 16px 16px; }
  .box .none { color: var(--ink-muted); font-size: 14px; margin: 0; }
  .editing .box { cursor: default; }
  .editing .box .body { opacity: .55; pointer-events: none; }
  .box .tools { display: none; margin-left: auto; gap: 2px; }
  .editing .box .tools { display: flex; }
  .editing .box > header .n { display: none; }
  .tools button { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--ink-muted); }
  .tools button:hover { background: var(--surface-press); color: var(--ink); }
  .tools .grip { cursor: grab; touch-action: none; }
  .box.lift { z-index: 4; box-shadow: var(--shadow-2); transition: none; }
  .editbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 12px; margin-bottom: 12px; background: var(--ink); color: var(--bg); border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-2); }
  .editbar span { margin-right: auto; }
  .editbar .btn { background: rgba(255,255,255,.14); border-color: transparent; color: inherit; }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

 * Change this file, never a page's copy.
 *
 * A page loads MapLibre 4.7.1 from unpkg first, then marks the place with an empty
 * script element that has the attribute data-shared="basemap.js". The sync fills it.
 */
(function () {

  var STYLE_URL = "https://tiles.openfreemap.org/styles/";

  // only when a label on screen needs it.
  var RTL_TEXT = "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js";
  var LOOKS = { paper: "positron", classic: "liberty", night: "dark" };

  // otherwise. Arabic shows only for a name that has no Hebrew or Latin form.
  var NAME = ["coalesce", ["get", "name:he"], ["get", "name:latin"], ["get", "name"]];

  // label is hidden, and Judea and Samaria is named at the middle of the area.

  function styleUrl(look) {
    return STYLE_URL + (LOOKS[look] || LOOKS.classic);

    try {
      if (window.maplibregl.getRTLTextPluginStatus() !== "unavailable") return;
      var loading = window.maplibregl.setRTLTextPlugin(RTL_TEXT, true);
      if (loading && loading.catch) loading.catch(function () {});
    } catch (e) {
      /* the names stay as they are */
    }

  function isStateLabel(layer) {
    return layer["source-layer"] === "place" && JSON.stringify(layer.filter || "").indexOf('"state"') !== -1;
  }

  // Runs on every style load, so a change of look keeps the names.
  function localize(map) {
    var layers = map.getStyle().layers;
    var stateLabel = null;
    layers.forEach(function (layer) {
      if (layer.type !== "symbol") return;
      var field = layer.layout && layer.layout["text-field"];
      if (field && JSON.stringify(field).indexOf('"name') !== -1) map.setLayoutProperty(layer.id, "text-field", NAME);

      var keep = ["!=", ["get", "iso_a2"], HIDDEN_COUNTRY];
      map.setFilter(layer.id, layer.filter ? ["all", layer.filter, keep] : keep);
      if (!stateLabel && isStateLabel(layer)) stateLabel = layer;

    map.addSource("cabinet-regions", {
      type: "geojson",
      data: {
        type: "FeatureCollection",
        features: REGIONS.map(function (r) {
          return { type: "Feature", properties: { name: r.name }, geometry: { type: "Point", coordinates: r.at } };
        }),
      },
    });
    map.addLayer({
      id: "cabinet-regions",
      type: "symbol",
      source: "cabinet-regions",
      minzoom: 6,
      maxzoom: 10,
      layout: { "text-field": ["get", "name"], "text-font": stateLabel.layout["text-font"], "text-size": 14 },

  // overrides MapLibre's map options (center, zoom, bounds, minZoom). Returns null
  // when MapLibre did not load or the browser cannot draw it (no WebGL).

    }

    ATTRIBUTION: ATTRIBUTION,
    create: create,
    setLook: setLook,

    // Cabinet slow to answer: start without it, then read the stores again once it is ready.
    cab.ready.then(function () { if (began) began.then(function () { readStores(); refresh(); }); else go(); }, go);
    setTimeout(go, 3000);
  } else start();
})();
</script>
