id: weekly-image-set
name: Weekly Image Set
# Ships switched off, and it is the only routine in the showcase set that does.
# Every other one reads; this one generates, and every generation spends real credits
# from the user's own Higgsfield plan. A routine that costs money on a timer has to be
# switched on by the person paying, after they have written their own brief.md.
enabled: false
schedule: 0 9 * * 1
provider: claude-code
adapterType: claude_local
ownerAgent: image-maker
agentSlug: image-maker
timeout: 900
prompt: |-
  Make this week's set of images, and write the page that says what they cost.

  Your working directory is the cabinet root. Every set lives in `image-sets/`, one file
  per run, named `<YYYY-MM-DD>T<HH-MM-SS>-image-set.md` — the local time you ran, then
  that exact postfix. The page reads the folder, sorts by the name and opens the newest,
  so a name in any other shape is a set nobody will see. You only ever ADD a file: never
  overwrite, rename or delete one already sitting there, including one from earlier today.

  This run spends the user's own money. Every image is real credits off their Higgsfield
  plan, and there is no free allowance for agents. Read your persona before anything else:
  it holds the spending rules, the frontmatter shape, the table columns and the tone, and
  those rules beat any instruction here. This prompt does not repeat them.

  1. Read `brief.md` in the cabinet root. It says what to make, the mood, where it will be
     used, and how many. It is the only instruction that counts — make what it asks for
     and nothing more. Three images if it does not say; six at the very most; stop at 2
     credits for the whole run however many are still unmade.

  2. If `brief.md` still holds the shipped example — the Fern & Loaf bakery, sourdough on
     a wooden counter — STOP HERE. Generate nothing, write nothing, leave `image-sets/`
     exactly as you found it. Report: "brief.md still has the example bakery in it, so I
     made nothing and spent nothing. Open brief.md and write what you want made." Then
     exit.

  3. If you have no Higgsfield tool, or Higgsfield is not connected, or the call fails,
     STOP HERE. Generate nothing, write nothing, leave `image-sets/` exactly as you found
     it, example and all. Report: "Higgsfield is not reachable, so I made nothing and
     spent nothing. I would have made <the number in brief.md> images of <the subject in
     brief.md, in a few words> and written one row for each with its prompt, its model and
     what it cost." Then exit.

  4. Check the credit balance before the first generation. If there is not enough for even
     one image, STOP HERE. Generate nothing, write nothing, leave `image-sets/` untouched.
     Report the balance as a plain number: "Higgsfield has <N> credits left, which is not
     enough for the <M> images in brief.md. I made nothing and spent nothing." Then exit.

  5. Otherwise generate, one image per prompt, cheapest model that satisfies the brief, one
     retry at most on a failure and never a second attempt after that. No video unless
     `brief.md` asks for it in plain words. Keep a running total of credits as you go and
     stop the moment the next image would cross 2 credits.

  6. Write your dated file: the frontmatter from your persona with `spent` filled in as a
     real number, then one table row per image with the URL exactly as Higgsfield returned
     it. Never build a URL by hand. A run that stopped early says so in `Notes`.

  7. On the first run that does generate, write your dated file and then delete
     `image-sets/EXAMPLE-image-set.md`. It is a demo, not a past set, and it must not sit
     in the date list beside real ones. Do not merge with it, do not rename it, and never
     write `EXAMPLE` into a name of your own.
